spring:
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "console"
  ai:
    mcp:
      server:
        name: yukta
        version: 0.0.1
        enabled: true
        stdio: false
        protocol: STATELESS
        type: ASYNC
        streamable-http:
          mcp-endpoint: /sse
        sse:
          sse-endpoint: /sse
  docker:
    compose:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} : %msg %kvp%n"
  level:
    root: INFO
    com.infenia.yukta: DEBUG
    com.infenia.yukta.service.orchestrator.stream: TRACE


yukta:
  heartbeat-interval-seconds: 10
  session:
    base-dir: /tmp/.yukta
    file-log-sub-dir: modified-files
    result-log-sub-dir: results
    execution-timeout-seconds: 3600
    store-type: in-memory
  tracker:
    cleanup-ttl: 10m
  daemon:
    port: 8080
    startup-timeout-seconds: 30
    health-check-interval-ms: 500

control:
  bus:
    batch:
      size: 100          # Number of control signals to batch before processing
      timeout:
        ms: 50           # Timeout (in ms) for batch accumulation
    buffer:
      size: 256          # Internal buffer size (Queues.SMALL_BUFFER_SIZE = 256)

gg:
  jte:
    developmentMode: true
    usePrecompiledTemplates: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
