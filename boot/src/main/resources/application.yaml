server:
  port: ${SERVER_PORT:9858}
  # Loopback by default so a fresh install is not reachable from the network. Set
  # YUKTA_SERVER_ADDRESS=0.0.0.0 (and yukta.api-key) to opt in to remote access.
  address: ${YUKTA_SERVER_ADDRESS:127.0.0.1}

spring:
  profiles:
    # prod unless a profile is named: a jar started with no flags must not log payloads or open the
    # dev-only management endpoints. bootRun asks for dev.
    default: prod
  codec:
    # Largest request body (start payload, workflow definition, MCP call) the server reads; a bigger
    # one is answered with 413. The same limit applies to what a request is copied into later.
    max-in-memory-size: ${YUKTA_LIMITS_MAX_BODY:1MB}
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "console"
  ai:
    mcp:
      server:
        name: yukta
        version: "@project.version@"
        enabled: true
        stdio: false
        protocol: STATELESS
        type: ASYNC
        streamable-http:
          mcp-endpoint: /mcp
  docker:
    compose:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} : [%X{requestId:-}] %msg %kvp%n"
  level:
    root: INFO
    com.infenia.yukta: INFO


yukta:
  session:
    file-log-sub-dir: modified-files
    result-log-sub-dir: results
    execution-timeout-seconds: 3600
    store-type: in-memory
  tracker:
    cleanup-ttl: 10m
  streaming:
    status-history-ttl-minutes: 5
  logs:
    store:
      backend: memory              # memory is the only store
      retention:
        default-period-minutes: 30 # User-configurable retention period
        # Note: Maximum retention is hardcoded to 1440 minutes (24 hours)
        # If configured value exceeds max, max will take effect

management:
  # OTLP export is off until an operator turns it on, so the server sends nothing by default:
  #   MANAGEMENT_TRACING_EXPORT_ENABLED=true  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://collector:4318/v1/traces
  #   MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true  MANAGEMENT_OTLP_METRICS_EXPORT_URL=http://collector:4318/v1/metrics
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never          # no Spring Security here, so nobody can be "authorized"

# R2DBC and Flyway are only on the class path in a build made with -Pyukta.persistence=postgres;
# they are left out unless the postgres profile is active (SPRING_PROFILES_ACTIVE=prod,postgres).
---
spring:
  config:
    activate:
      on-profile: "!postgres"
  autoconfigure:
    exclude:
      - org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration
      - org.springframework.boot.r2dbc.autoconfigure.R2dbcInitializationAutoConfiguration
      - org.springframework.boot.r2dbc.autoconfigure.R2dbcProxyAutoConfiguration
      - org.springframework.boot.r2dbc.autoconfigure.R2dbcTransactionManagerAutoConfiguration
      - org.springframework.boot.r2dbc.autoconfigure.health.ConnectionFactoryHealthContributorAutoConfiguration
      - org.springframework.boot.r2dbc.autoconfigure.metrics.ConnectionPoolMetricsAutoConfiguration
      - org.springframework.boot.r2dbc.autoconfigure.observation.R2dbcObservationAutoConfiguration
      - org.springframework.boot.data.r2dbc.autoconfigure.DataR2dbcAutoConfiguration
      - org.springframework.boot.data.r2dbc.autoconfigure.DataR2dbcRepositoriesAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayEndpointAutoConfiguration
