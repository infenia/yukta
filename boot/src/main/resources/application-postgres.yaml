# Sessions, workflow definitions (with their versions) and the execution log in PostgreSQL.
# Needs a build made with -Pyukta.persistence=postgres. Set the connection through the environment:
#   SPRING_R2DBC_URL=r2dbc:postgresql://host:5432/yukta  (run time, reactive)
#   SPRING_R2DBC_USERNAME / SPRING_R2DBC_PASSWORD
#   SPRING_FLYWAY_URL=jdbc:postgresql://host:5432/yukta   (schema migrations only; Flyway has no
#   SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD            R2DBC support)
yukta:
  session:
    store-type: postgres
  # Conversations with AI agents survive a restart (those still open are ended as failed).
  agents:
    store-type: postgres
  # Runs are durable: node outputs are checkpointed, and a run cut off by a restart or a takeover
  # is resumed on its own (finished nodes replay, the rest run again). Set
  # YUKTA_RESTART_AUTO_RESUME=false to resume by hand, or YUKTA_RESTART_STORE_TYPE=memory to keep
  # checkpoints in memory (nothing to resume from after a restart). Input requests stay in memory
  # unless yukta.input.store-type=postgres.
  restart:
    store-type: postgres
    auto-resume: true

# The connection pool (r2dbc-pool) and the database's own statement timeout. Override any of them
# through the environment, for example SPRING_R2DBC_POOL_MAX_SIZE=40.
spring:
  r2dbc:
    pool:
      initial-size: 4
      # R2DBC does not park a thread per connection, so a few connections carry many runs; each one
      # costs memory on the database server.
      max-size: 20
      # Give up rather than wait forever for a free connection or a new one (the defaults do not).
      max-acquire-time: 5s
      max-create-connection-time: 5s
      max-idle-time: 10m
      # Renew connections now and then, so a failover or a pooler behind the URL is picked up.
      max-life-time: 30m
    properties:
      # The server stops a statement after this long (an ISO-8601 duration). The stores stop
      # waiting after 30 s as well; without this the query would keep running on the server.
      statementTimeout: PT30S
