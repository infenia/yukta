<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta boot Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>

<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>

  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
  <div class="others" id="others"></div>
</nav>
<main id="main"></main>

var DATA = {"module": "boot", "title": "How Yukta boot works, and where it can break", "htmlTitle": "Yukta boot Guide", "date": "2026-10-15", "glance": {"lede": "Boot is the executable. It contains almost no logic of its own: it pulls the engine (core), the REST layer (web), the AI-agent endpoint (mcp), the React screens (ui) and the chosen plugins into one Spring Boot program, decides which settings apply (dev or prod), serves the web UI, and can be compiled into a native binary. Its risks are about defaults and packaging, not algorithms: what is switched on, who can reach it, and what is frozen at build time.", "props": [["Thin assembly", "One class starts Spring; component scanning finds every module's beans. The behaviour you see comes from other modules, boot decides what is included and how it is configured."], ["Profile decides safety", "With no profile the app runs as dev: verbose logs including message payloads, extra management endpoints. A native binary forces prod instead. The same code is more or less exposed depending on one setting."], ["Loopback by default", "The server listens on 127.0.0.1 unless YUKTA_SERVER_ADDRESS says otherwise, so a fresh install is not reachable from the network. The container image opts in to 0.0.0.0."], ["Plugins fixed at build", "Optional plugins are compiled in or left out with -Pyukta.plugins. There is no way to add or remove one on a running server."]], "start": [["primer", "Primer", "The problem, the vocabulary and one cold start traced to a browser deep link"], ["map", "System map", "Eight components and how a start-up flows through them"], ["guarantees", "What is enforced where", "Switch between dev and prod and see what changes"], ["reference", "Config and commands", "Profile matrix, run commands, plugin list"], ["quality", "Stress it", "Scalability, security, operability and the rest"], ["board", "Challenge it", "Open risks on an impact x effort grid"], ["adrs", "Decisions", "Seven decisions, each with a revisit trigger"], ["glossary", "Glossary", "Plain definitions of every term"]]}, "primer": {"problem": "Yukta is built as many modules (engine, REST layer, MCP server, UI, plugins). Someone has to put them together into one program you can run, choose its settings, serve the web screens and ship it, either as a normal Java program or as a native binary. That someone is <b>boot<\/b>. It has one Java class that starts the app, one class that serves the web UI, three configuration files, a build script, and four test classes.", "analogy": "Think of the box a product ships in. The box does not make the product, but it decides what is inside (which plugins), what is printed on the label (default settings), whether the lid is locked (loopback only, prod profile) and how it is carried (JVM jar or native binary). A mistake in the box, such as a missing part or an unlocked lid, ruins the product even if every part is fine.", "layersTitle": "Where boot sits", "layers": [["Clients", "Browser, REST callers, MCP agents, CLI", ""], ["web / mcp / ui", "Controllers, the MCP endpoint, the built React app", ""], ["core", "The workflow engine and control plane", ""], ["plugin-api + plugins", "The contract and the node types", ""], ["boot", "Starts it all in one process. This page.", "me"]], "layersNote": "Boot depends on every other module and nothing depends on boot. It owns the entry point, the YAML configuration, the single-page-app hosting and the native image.", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["Spring profile", "A named set of settings. Boot has dev and prod. A profile adds a second YAML file on top of the base file.", "application-prod.yaml turns off debug logging."], ["Default profile", "The profile used when none is chosen. Here it is dev (spring.profiles.default).", "java -jar yukta.jar with no arguments runs as dev."], ["Optional plugin", "A plugin you may leave out of the build. Nine can be chosen; triggers, terminals, supervisors and control planes are always included.", "-Pyukta.plugins=http-request,script-js"], ["Native image", "A GraalVM-compiled executable that starts fast and needs no JVM, but is fixed at build time (no new classes, reflection must be declared).", "./gradlew nativeCompile produces a binary named yukta."], ["Actuator", "Spring's management endpoints (health, metrics, loggers...). They live on the same port as the API.", "/actuator/health"], ["SPA", "Single-page application: the React UI is one index.html plus scripts. The browser handles page changes itself.", "Opening /sessions/x must still return index.html."], ["Deep link", "A URL that points inside the SPA, like /sessions/x. The server has no such file, so it must answer with index.html.", "Without a fallback route, a page refresh gives 404."], ["MCP endpoint", "The address AI agents use to call Yukta's tools. It is /mcp, in stateless, async mode.", "An agent posts a tool call to /mcp."]], "ex": {"title": "One example, end to end", "lede": "A cold start of the native binary, up to a user pasting the link /sessions/x into a browser. Click a step to see what happens, why, and what can go wrong.", "labels": ["What happens", "Why it is built this way", "Can go wrong"], "legend": "Green = entry point · Blue = boot step · Grey = result served", "nodes": [{"id": "bin", "n": "Run the binary", "s": "entry", "k": "t", "x": 10, "y": 40, "does": "The operating system starts the yukta executable (or java -jar). main() turns on automatic Reactor context propagation, so request ids and tracing values follow a message across threads.", "adds": "Without context propagation the request id in log lines would be lost whenever work hops to another thread, and log correlation would break.", "wrong": "The hook is global and set once. If another library sets a conflicting hook, nothing here detects it."}, {"id": "prof", "n": "Pick a profile", "s": "dev or prod", "k": "p", "x": 190, "y": 40, "does": "In a native image with no --spring.profiles.active= (or -Dspring.profiles.active=) argument, main() sets prod. In a normal JVM, no profile means the default, dev.", "adds": "A native binary is what you ship, so it should be safe without extra flags. A developer running from the IDE wants verbose logs, so dev is the default.", "wrong": "A JVM jar started with no flags runs as dev: debug logs including message payloads and extra management endpoints. The choice is easy to forget."}, {"id": "ctx", "n": "Build context", "s": "scan + config", "k": "p", "x": 370, "y": 40, "does": "Spring scans everything under com.infenia.yukta, so beans from core, web, mcp and every included plugin appear. The base YAML and the profile YAML are merged. Beans are created eagerly (no lazy initialisation).", "adds": "Eager creation means a bad setting fails at startup, not on the first request at 3 a.m.", "wrong": "Scanning is by package, not by an explicit list. A bean that happens to be on the classpath is switched on whether or not anyone meant it."}, {"id": "listen", "n": "Listen on :8080", "s": "127.0.0.1", "k": "p", "x": 550, "y": 40, "does": "Netty starts and binds to server.address, which is ${YUKTA_SERVER_ADDRESS:127.0.0.1}, on the default port 8080. Virtual threads are enabled for blocking work.", "adds": "Loopback means a laptop install is not reachable from the office network. The container image sets YUKTA_SERVER_ADDRESS=0.0.0.0 because a container must listen on all its interfaces.", "wrong": "Bind to 0.0.0.0 with no yukta.api-key and the REST API is open. Even with a key, /actuator and Swagger have no key check (see Risks)."}, {"id": "req", "n": "GET /sessions/x", "s": "browser deep link", "k": "t", "x": 730, "y": 40, "does": "A user pastes a link into the browser. The browser asks the server for the path /sessions/x.", "adds": "The path has no file behind it, because it is a screen of the React app, not a server resource.", "wrong": "If the server answered 404 here, every refresh or shared link would break."}, {"id": "spa", "n": "SPA fallback", "s": "index.html", "k": "p", "x": 550, "y": 150, "does": "SpaWebFluxConfig answers any GET that is not /api, /actuator, /mcp, /sse, /v3, Swagger or a static file with index.html. The response is marked no-cache and carries a strict Content-Security-Policy.", "adds": "No-cache means a new release shows up on the next load. The CSP allows only same-origin scripts and connections, so HTML injected through a plugin's node design cannot load anything external.", "wrong": "A mistyped API path outside /api/ returns the HTML page with status 200, not a 404, which can confuse a client that expects JSON."}, {"id": "assets", "n": "Hashed assets", "s": "/assets/**", "k": "e", "x": 370, "y": 150, "does": "The page asks for /assets/index-3fa9.js and friends. These are served from the ui jar's static folder with a 365-day cache.", "adds": "The file name contains a hash of its content, so a new build has a new name. Caching for a year is therefore safe and the second visit loads instantly.", "wrong": "Top-level files with fixed names (favicon, manifest, any /*.json) get the same 365-day cache but are not hashed, so a changed one can be stale in browsers."}, {"id": "api", "n": "UI calls /api", "s": "REST + SSE", "k": "e", "x": 190, "y": 150, "does": "The running UI calls /api/... on the same origin. Those requests reach web controllers, protected by the optional api key filter in the web module.", "adds": "Same origin means no cross-site configuration is needed, which is why the CSP can be so strict.", "wrong": "Nothing in boot restricts which origins may call the API. If a front proxy changes origins, the CSP connect rule will block the UI."}], "edges": [["bin", "prof"], ["prof", "ctx"], ["ctx", "listen"], ["listen", "req"], ["req", "spa"], ["spa", "assets"], ["assets", "api"]], "start": "prof"}, "wrapper": {"title": "What every request passes through", "lede": "Order matters: the key checks run before anything else, the SPA router only gets what is left.", "steps": ["API key and MCP key filters (web, mcp), earliest", "Request id and tracing filter", "Controllers and MCP tools", "Static asset handler (/assets/**)", "SPA fallback router (index.html)"]}, "story": {"title": "The module in plain words", "steps": [["Choose", "at build time you pick which optional plugins go in, and whether you build a jar or a native binary."], ["Start", "main() sets up context propagation and, for a native binary without a profile, picks prod."], ["Configure", "the base YAML is read, then the dev or prod file on top."], ["Assemble", "Spring finds every bean from every included module and starts the web server."], ["Serve", "API, MCP, management endpoints and the React app all answer on one port."], ["Stay up", "there is no cluster logic; everything is one process with in-memory defaults."]]}, "paths": [["New to the module", "Primer, then System map, then Guarantees (dev vs prod), then Config and commands.", "primer"], ["Reviewing for security", "Guarantees (enforced per profile), Quality (Security lens), then the Security risks on the Board.", "guarantees"], ["Planning deployment", "Config and commands, then Decisions 2, 3 and 5, then Evolution.", "reference"]]}, "plain": {"config": ["The settings sheet. One base file for everything, plus one overlay for dev and one for prod.", "Developers want noisy logs and extra tools; production wants quiet logs and a small surface. One file cannot be both."], "app": ["The assembled machine. Spring scans all Yukta packages and wires every module's beans into one process with one web server.", "Modules stay separate for building and testing, yet users get a single program to run."], "spa": ["The web-page host. It hands out the React app, caches its files for a year and answers every unknown address with the main page.", "A single-page app needs the server to return the same page for every screen address, or refresh and shared links break."], "tuning": ["The dials the engine reads at start. A few values for the control queue, status history and tracker clean-up are written down in the base file.", "Teams can tune the engine without code changes, and the defaults are visible in one place."], "mgmt": ["The service hatch: health, info and metrics for operators, plus extras in dev.", "Orchestrators and monitoring need a health URL, and developers need to inspect a running app. The risk is leaving the hatch open."], "plugsel": ["The parts list. At build time you choose which optional plugins are packed in.", "Not every deployment needs a shell-command plugin or a JavaScript engine. Leaving them out shrinks the image and the attack surface."], "native": ["The compile-to-executable recipe. It turns the app into one native file with fast start and no JVM, with size-reduction flags.", "Fast start and a small footprint for containers, at the cost of a long, memory-hungry build."], "launch": ["The ignition key. One method starts the whole application and, in a native binary with no profile given, chooses the safe prod profile.", "A native binary is shipped as is. It should not start in debug mode just because nobody passed a flag."], "accept": ["The end-to-end check. Tests that boot the real application and run real workflows, plus tests of the profile files and the SPA router.", "Unit tests in each module cannot show that the assembled program works. These can, and they stop a config change from silently exposing something."]}, "comps": [{"id": "launch", "name": "Launcher", "tag": "main(), profile guess", "c": 0, "r": 0, "flag": false, "resp": "Starts the application and chooses the profile in the one case where it must not be left to chance: a native image started without a profile.", "how": ["main() first calls Hooks.enableAutomaticContextPropagation(). This makes Reactor copy context values (request id, tracing) from one thread to the next. Reason: Yukta is reactive, and without this the request id in log lines would vanish whenever work moves to another thread.", "If the process is a native image and no argument starts with --spring.profiles.active= or -Dspring.profiles.active=, main() sets the system property to prod. Example: ./yukta runs as prod; ./yukta --spring.profiles.active=dev runs as dev.", "In a normal JVM the launcher does nothing about profiles. The default profile in the base YAML, dev, applies. Example: java -jar boot.jar with no flags gives debug logging.", "Only command-line arguments are checked. If a native image is started with only the SPRING_PROFILES_ACTIVE environment variable, main() still sets the system property to prod; which of the two Spring then prefers was not tested."], "guar": "Context propagation is on before any Spring code runs. An explicit profile argument is never overwritten.", "state": "No state. The profile choice lives in a JVM system property for the rest of the process.", "ceil": "One class, no scaling concern.", "fail": "If Spring fails to start (bad config, port in use) the process exits with the Spring error. There is no custom start-up diagnostics.", "set": ["Hooks.enableAutomaticContextPropagation()", "--spring.profiles.active=<name> (also -D form)", "SPRING_PROFILES_ACTIVE is not checked by main()"], "risks": ["profileDefault", "profileForce", "guardMcpKeyOnly"]}, {"id": "config", "name": "Layered Configuration", "tag": "base + dev or prod", "c": 1, "r": 0, "flag": false, "resp": "Provides every setting as a base file overlaid by the active profile's file.", "how": ["application.yaml is always read. It sets the loopback address, virtual threads, the MCP server (name yukta, version 0.0.1, stateless, async, endpoint /mcp, no stdio), strict JSON (unknown fields are rejected), the console log pattern with a request id, and the management exposure.", "application-dev.yaml adds more management endpoints and verbose logging. application-prod.yaml quiets logging, turns the banner off and switches on gzip compression for responses over 1 KB.", "Profile files are merged over the base, key by key. Prod does not set management exposure, so prod inherits the small base list (health, info, metrics). Dev replaces it with a longer list.", "ProfileConfigTest reads the real files and asserts that prod has no TRACE for the stream package, INFO for com.infenia.yukta, the small actuator list and no lazy initialisation, and that dev has TRACE and the longer list. This is what stops a casual edit from leaking payload logs into prod.", "Strict JSON (fail-on-unknown-properties: true) means a client that sends an extra field gets an error rather than silent acceptance. Reason: a misspelt option should not be ignored."], "guar": "A fresh install without any flags is loopback-only, and prod never has TRACE payload logging or debug management endpoints (guarded by a test).", "state": "Files are read at start. Changing them needs a restart. Nothing is stored.", "ceil": "Settings are plain keys with no validation of the YAML itself; a typo in a key name is silently ignored by Spring except for typed properties.", "fail": "A bad value (for instance unreadable type) stops start-up. A misspelt key does not fail anything; it is just ignored.", "set": ["server.address = ${YUKTA_SERVER_ADDRESS:127.0.0.1}", "spring.profiles.default = dev", "spring.jackson.deserialization.fail-on-unknown-properties = true", "spring.ai.mcp.server.* (see map)"], "risks": ["profileDefault", "devExposure", "deadKeys", "healthDetails", "guardMcpKeyOnly"]}, {"id": "app", "name": "Assembled Application", "tag": "component scan, one process", "c": 2, "r": 0, "flag": true, "resp": "Turns every module's classes into running beans inside one web server.", "how": ["The application class carries @SpringBootApplication in com.infenia.yukta, so Spring scans that whole package tree: core, web, mcp, messaging and every plugin on the classpath. Boot lists no beans itself.", "Dependencies are fixed in build.gradle.kts: core, web, mcp, ui, the internal-core processors, the API/constant/schedule triggers, notify and console terminals, the rule supervisor and three control planes (rule, model, rules-first). They are always in. The nine optional plugins join depending on the build flag.", "Boot also brings the WebFlux, validation and actuator starters. It has no Spring Security: access control is done by plain web filters in web and mcp (roles, session-limited keys, host and origin checks), and the start-up guard ExposureGuard lives in boot. PostgreSQL stores and remote workers are optional modules switched on at build time.", "Defaults are in-memory: session store type in-memory, plugin log store memory. A restart starts from nothing unless you configure files.", "Startup is eager: a missing bean or a bad property stops the process immediately."], "guar": "If the context starts, every module's beans are present and consistent. Eager creation means a defect appears at boot.", "state": "All engine state is in this one process (see core). Boot itself stores nothing.", "ceil": "One process, one port, one JVM. Scaling means running more copies, but nothing shares state between them.", "fail": "A failed bean stops the whole app. There is no partial start where only the UI works.", "set": ["yukta.session.store-type = in-memory", "yukta.logs.store.backend = memory", "scan base package com.infenia.yukta"], "risks": ["singleProc", "scanBroad"]}, {"id": "spa", "name": "SPA Host", "tag": "assets, fallback, CSP", "c": 3, "r": 0, "flag": true, "resp": "Serves the React app from the ui jar and makes client-side routes work.", "how": ["Files under /assets/ (Vite writes hashed file names) and flat top-level files ending in .js, .css, .woff, .woff2, .ttf, .svg, .png, .jpg, .webp, .ico, .json or .webmanifest are served with a 365-day cache. A hashed name changes when the content changes, so a long cache is safe for /assets/.", "Every other GET is answered with index.html, except /api, /actuator, /mcp, /sse, /v3, /swagger-ui, /swagger-ui.html and /webjars, and except static asset paths. Reason: the router is looked at before the resource handler, so without these exclusions it would hide real files and real endpoints.", "index.html is sent with Cache-Control no-cache, must-revalidate, and a Content-Security-Policy: default-src 'self'; style-src 'self' 'unsafe-inline'; img-src and font-src also allow data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'. In plain words: scripts and connections only from the same origin, no plugins or embedding in frames; inline styles are allowed because React Flow positions nodes with style attributes.", "The CSP header exists only on this fallback response. API responses and static assets do not get it; they do not need it, since the CSP matters for the document the browser renders.", "Exclusions include /sse/**, a leftover alias. The MCP filter still maps the exact path /sse to /mcp for old clients, so the exclusion is harmless but keeps a historic name in the code."], "guar": "A refresh or pasted deep link always returns the app; a new release is picked up on the next load because index.html is never cached.", "state": "Stateless. The files come from the ui jar on the classpath.", "ceil": "The index file is read per request from the classpath resource. For heavy traffic a CDN in front would take the load; boot has no ETag or compression for assets in dev (gzip is on in prod).", "fail": "If ui was not built, static/index.html is missing and the fallback fails at request time, not at start.", "set": ["Cache-Control: max-age 365 days (assets)", "Cache-Control: no-cache, must-revalidate (index.html)", "CONTENT_SECURITY_POLICY constant"], "risks": ["staticStale", "apiPath200", "cspScope"]}, {"id": "tuning", "name": "Engine Tuning Defaults", "tag": "yukta.* and control.bus.*", "c": 1, "r": 1, "flag": false, "resp": "Writes down a handful of engine settings so they are visible and changeable without code.", "how": ["control.bus.batch.size 100 and control.bus.batch.timeout.ms 50: the control bus collects up to 100 commands, or waits at most 50 ms, before processing a batch. control.bus.buffer.size 256 is its internal buffer. The code uses the same numbers as its built-in defaults.", "yukta.tracker.cleanup-ttl 10m: how long a finished run's data stays in the tracker. yukta.streaming.status-history-ttl-minutes 5: how long recent progress is kept for late subscribers (the code accepts 1 to 30).", "yukta.session.execution-timeout-seconds 3600, yukta.session.store-type in-memory, and the two sub-directory names file-log-sub-dir (modified-files) and result-log-sub-dir (results).", "yukta.logs.store.backend memory with a 30-minute default retention (the comment says the maximum is 1440 minutes, 24 hours). Only the memory store is registered today, although the comment says memory | file.", "Everything else the engine reads (limits, queue, restart directories) has no entry in boot. Its default lives in core code, so boot's YAML is not the whole list of settings."], "guar": "These values are what a fresh start uses. Unset settings fall back to the defaults written in core.", "state": "None here. Values are read at start.", "ceil": "Because they are only defaults, a deployment that needs limits, a durable log or file stores must add keys of its own; boot does not provide a production profile for state.", "fail": "A wrongly typed value stops start-up. A key that nothing reads, such as one left over after a rename, is silently ignored.", "set": ["control.bus.batch.size / batch.timeout.ms / buffer.size", "yukta.tracker.cleanup-ttl", "yukta.streaming.status-history-ttl-minutes", "yukta.session.*", "yukta.logs.store.*"], "risks": ["deadKeys", "singleProc"]}, {"id": "mgmt", "name": "Management Surface", "tag": "actuator health, metrics", "c": 2, "r": 1, "flag": true, "resp": "Gives operators health, info and metrics, and developers a few more diagnostics, on the same port as the API.", "how": ["Base and prod expose health, info and metrics. Dev adds loggers, mappings and threaddump. Not exposed in either profile: heapdump, env, beans, shutdown.", "Health details use show-details: when-authorized. Boot contains no Spring Security, so in our view nobody counts as authorised and detail fields are most likely never shown; this was not run to confirm.", "Management shares port 8080; there is no separate management port. The SPA router excludes /actuator/**, so these paths are never answered with index.html.", "The API key filter in web now also covers /actuator (except /actuator/health): with a key set, the rest needs an ADMIN key. With no key on a loopback bind, the actuator is open to local callers; in the dev profile loggers can be read and changed (POST to /actuator/loggers). Swagger and /v3 are still outside any key check."], "guar": "Prod exposure is exactly health, info, metrics (asserted by ProfileConfigTest). No endpoint that dumps memory is exposed anywhere.", "state": "None. Metrics are in memory in the process.", "ceil": "Same port and thread pool as the API, so a scrape storm competes with real requests.", "fail": "If the management endpoint is not reachable, probes fail and an orchestrator may restart a healthy app.", "set": ["management.endpoints.web.exposure.include", "management.endpoint.health.show-details = when-authorized"], "risks": ["devExposure", "openOps", "healthDetails"]}, {"id": "plugsel", "name": "Plugin Selection", "tag": "build-time -Pyukta.plugins", "c": 1, "r": 2, "flag": false, "resp": "Decides at build time which optional plugins are linked into the app.", "how": ["-Pyukta.plugins accepts default (all except script-js, the default), all, none, or a comma list. The nine valid names are process-executor, http-request, file-io, sql-query, llm-call, session-memory, decision, mcp-tool-call and script-js. Two more modules are switched on by their own flags: -Pyukta.persistence=postgres (PostgreSQL stores) and -Pyukta.workers=true (remote workers).", "An unknown name fails the Gradle configuration with a message listing the valid names. Example: -Pyukta.plugins=http-requst stops before compiling anything.", "Triggers (api, constant source, schedule), terminals (notify, console), the internal-core processors, the rule supervisor and three control planes are always included. Only nine processors are optional.", "Reason: a pure data-pipeline deployment may not want a shell-command plugin or a JavaScript engine in the image. Fewer plugins means less code to secure and a smaller native image.", "The choice is baked into the jar or binary. A running server cannot gain or lose a plugin. A workflow that uses a plugin that was left out fails when it is validated or run."], "guar": "The build refuses typos. What was chosen is exactly what is on the classpath.", "state": "No runtime state. Build input only.", "ceil": "Eleven or more modules are built each time. The more plugins, the longer the native compile.", "fail": "A workflow using a missing node type is rejected by core; boot does not warn at start which plugins are missing.", "set": ["./gradlew bootRun -Pyukta.plugins=none|all|a,b", "./gradlew :boot:bootJar -Pyukta.plugins=..."], "risks": ["buildFixed", "testsNeedPlugin"]}, {"id": "native", "name": "Native Image", "tag": "GraalVM build and flags", "c": 2, "r": 2, "flag": false, "resp": "Compiles the app into a standalone executable with fast start and low memory.", "how": ["nativeCompile builds a binary named yukta from the main class, with --no-fallback (fail rather than build a JVM-needing fallback). The build JVM gets -J-Xmx16g. The size flags are -H:+RemoveUnusedSymbols, -H:+StripDebugInfo and -H:-AddAllCharsets.", "Build arguments -Dspring.profiles.active=prod and -Dspring.aot.enabled=true are also set. Spring AOT precomputes the bean wiring at build time, which is what makes native start-up fast.", "Whether the -D profile argument reaches the running binary was not verified: it is passed to the native-image builder. The launcher's own prod rule in main() is the part that is covered by a test.", "The Dockerfile builds the image in a GraalVM stage, optionally compresses the binary with UPX, then copies it into a distroless nonroot image that exposes 8080 and sets YUKTA_SERVER_ADDRESS=0.0.0.0. There is no shell in the final image.", "script-js (GraalJS) is no longer in the default set: it is the largest part of the native image, so ask for it with -Pyukta.plugins=all or by name."], "guar": "A native image either builds with all reflection and resources known, or the build fails (no fallback).", "state": "None. The binary is immutable; data directories must be mounted if you use file stores.", "ceil": "The 16 GB build heap is not measured; a small CI machine may run out. Native builds are slow, so most developers use the JVM.", "fail": "Reflection or resource gaps appear only at run time in the native binary, since tests run on the JVM.", "set": ["./gradlew :boot:nativeCompile", "buildArgs: --no-fallback, -J-Xmx16g, -H:+RemoveUnusedSymbols, -H:+StripDebugInfo, -H:-AddAllCharsets", "-Dspring.aot.enabled=true"], "risks": ["xmx8g", "nativeGap", "profileForce", "nativeMetaStale"]}, {"id": "accept", "name": "Acceptance Harness", "tag": "real app, real plugins", "c": 3, "r": 2, "flag": false, "resp": "Boots the whole assembled app and proves the wiring, profiles and web hosting behave.", "how": ["WorkflowAcceptanceTest runs a trigger, a PROCESS_EXECUTOR step and a console terminal on the real engine: a normal run ends SUCCESS and is logged; a stop leaves no node running and records the command; a flaky step is retried; a failing step fails the run; a finished run can be restarted; a step silent for over 30 seconds is not cut off by the default idle timeout.", "SupervisorAcceptanceTest attaches a real rule supervisor: a rule pauses a workflow when its node starts running, and a deny rule refuses a KILL stop.", "ProfileConfigTest checks dev vs prod config values. YuktaApplicationTest starts main() and checks the native profile rule and the profile-argument parsing. SpaWebFluxConfigTest checks the 365-day cache, the no-cache index, the CSP and which paths the router leaves alone.", "These tests use the PROCESS_EXECUTOR plugin, which is optional. Building with -Pyukta.plugins=none would leave :boot:test with workflows it cannot run."], "guar": "A wiring or profile regression fails a test instead of reaching a release.", "state": "Tests use real files and shell commands such as echo and sh in a temp setup; they need a Unix-like environment.", "ceil": "Acceptance tests wait up to 30 seconds per scenario, so they are the slowest part of the module.", "fail": "A test depends on plugins that a build flag can remove; the failure then looks like a workflow bug rather than a build choice.", "set": ["./gradlew :boot:test", "./gradlew :boot:test --tests com.infenia.yukta.ProfileConfigTest"], "risks": ["testsNeedPlugin", "nativeGap"]}], "mapFlag": {"label": "Highlight network-facing parts", "hint": "Dashed amber = reachable by clients on the server port", "badge": "NET"}, "mapLegend": "Solid = start-up data flow · Dashed = build-time and configuration influence", "edges": [["launch", "config", "data", "profile"], ["config", "app", "data", "settings"], ["app", "spa", "data", "routes"], ["config", "tuning", "ctrl", "defaults"], ["tuning", "app", "ctrl", "engine keys"], ["config", "mgmt", "ctrl", "exposure"], ["app", "mgmt", "data", "actuator"], ["plugsel", "app", "ctrl", "plugins"], ["native", "launch", "ctrl", "forces prod"], ["accept", "app", "ctrl", "boots it"], ["plugsel", "native", "ctrl", "same set"]], "scen": [{"id": "jvm", "name": "Developer: ./gradlew bootRun", "steps": [{"t": "Pick plugins", "d": "Gradle reads -Pyukta.plugins (default all) and adds the nine optional plugins to the classpath. Without the flag, everything is in.", "c": ["plugsel"], "r": ["buildFixed"]}, {"t": "main() runs", "d": "Context propagation is enabled. It is a JVM, not a native image, so the launcher leaves the profile alone.", "c": ["launch"], "r": []}, {"t": "Default profile is dev", "d": "With no profile named, spring.profiles.default makes dev active. Debug logging, TRACE for the orchestrator stream package and the longer management list apply.", "c": ["config"], "r": ["profileDefault", "devExposure"]}, {"t": "Context starts", "d": "Beans from all modules are created. The server binds to 127.0.0.1:8080, so only this machine can connect.", "c": ["app"], "r": []}, {"t": "Browse the UI", "d": "The browser opens http://localhost:8080, the fallback router serves index.html and the UI calls /api.", "c": ["spa"], "r": []}]}, {"id": "native", "name": "Production: native container", "steps": [{"t": "Build the binary", "d": "nativeCompile runs with AOT and size flags and the prod profile argument. Plugins are those chosen at build time.", "c": ["native", "plugsel"], "r": ["xmx8g", "buildFixed"]}, {"t": "Package", "d": "The Dockerfile copies the binary into a distroless nonroot image and sets YUKTA_SERVER_ADDRESS=0.0.0.0, because a container must listen on all interfaces.", "c": ["native"], "r": []}, {"t": "Start", "d": "main() sees a native image with no profile argument and sets prod. Logging is quiet and management exposure is health, info and metrics.", "c": ["launch", "config"], "r": ["profileForce"]}, {"t": "Serve", "d": "Port 8080 answers API, MCP, actuator and UI. The key filter guards /api and /actuator when a key is set; Swagger and /v3 have no check.", "c": ["app", "spa", "mgmt"], "r": ["openOps"]}]}, {"id": "deeplink", "name": "Deep link refresh", "steps": [{"t": "Browser asks for /sessions/x", "d": "The path is a screen inside the React app, not a file. A plain file server would return 404.", "c": ["spa"], "r": []}, {"t": "Router checks exclusions", "d": "The path is not /api, /actuator, /mcp, /sse, /v3, Swagger, webjars or a static asset, so the fallback matches.", "c": ["spa"], "r": ["apiPath200"]}, {"t": "index.html with CSP", "d": "The page comes back as 200 with no-cache and the CSP header. The browser then loads /assets/ files from its 365-day cache.", "c": ["spa"], "r": ["cspScope"]}, {"t": "A new release", "d": "The new index.html points to new hashed file names, so the browser fetches new bundles. Fixed-name files such as favicon may be stale.", "c": ["spa"], "r": ["staticStale"]}]}, {"id": "exposed", "name": "Exposed by mistake", "steps": [{"t": "Operator binds to 0.0.0.0", "d": "They set YUKTA_SERVER_ADDRESS=0.0.0.0 and yukta.api-key=secret for remote access, and run the jar as before. Without a key the server would now refuse to start (ExposureGuard).", "c": ["config"], "r": []}, {"t": "Profile was never set", "d": "A JVM jar has no native rule, so the default dev profile still applies, with loggers, mappings and threaddump exposed.", "c": ["launch", "config"], "r": ["profileDefault", "devExposure"]}, {"t": "API is protected, the rest is not", "d": "/api and /actuator (except health) now need the key. /swagger-ui.html and /v3/api-docs do not. Anyone on the network can read the API description. If only yukta.mcp.api-key had been set, ExposureGuard would still have let the server start, and /api would be open.", "c": ["mgmt", "app"], "r": ["openOps"]}, {"t": "Payloads reach the log", "d": "Dev sets the orchestrator stream package to TRACE, which writes message payloads to the console. In a shared log system those payloads are now visible to others.", "c": ["config"], "r": ["devExposure"]}]}, {"id": "plugfail", "name": "Bad plugin build flag", "steps": [{"t": "A typo in -Pyukta.plugins", "d": "Example -Pyukta.plugins=http-requst. The build script computes the unknown names.", "c": ["plugsel"], "r": []}, {"t": "Fail fast", "d": "Gradle stops at configuration with 'Unknown yukta.plugins entries ... valid: ...'. No jar is built, so a typo cannot silently drop a plugin.", "c": ["plugsel"], "r": []}, {"t": "A valid but incomplete list", "d": "-Pyukta.plugins=none passes the build. The app starts, but a workflow using PROCESS_EXECUTOR is rejected.", "c": ["plugsel", "app"], "r": ["buildFixed"]}, {"t": "Tests break too", "d": "WorkflowAcceptanceTest and SupervisorAcceptanceTest use PROCESS_EXECUTOR, so :boot:test cannot pass with none.", "c": ["accept"], "r": ["testsNeedPlugin"]}]}, {"id": "restart", "name": "Restart under defaults", "steps": [{"t": "Process stops", "d": "Session store, log store and tracker are in memory by default. Nothing is written by boot.", "c": ["app", "tuning"], "r": ["singleProc"]}, {"t": "Process starts again", "d": "The base YAML again says store-type in-memory, logs backend memory. No workflow definition, session setting or run history is there.", "c": ["config", "tuning"], "r": ["singleProc"]}, {"t": "Optional state is on you", "d": "Only configuration you added (file stores or logs directories) brings state back, or a build with -Pyukta.persistence=postgres and yukta.session.store-type=postgres. The default build has no database module.", "c": ["config"], "r": ["singleProc"]}, {"t": "Clients reconnect", "d": "The UI shows an empty system. Anyone who relied on stored definitions must re-create them. File stores must be configured on purpose.", "c": ["app", "spa"], "r": ["singleProc"]}]}], "intro": {"jvm": "What a developer's local run does from build to browser.", "native": "How the production container is built, started and what it exposes.", "deeplink": "How a refresh or shared link on a client-side route reaches the right page.", "exposed": "A realistic misconfiguration: remote access with a key but no profile.", "plugfail": "What a wrong or minimal plugin choice does at build time and in tests.", "restart": "What a restart loses when only boot's defaults are used."}, "caps": [["Packaging", "One program", "Core, web, mcp, ui and plugins as one app.", "Component scan from com.infenia.yukta; always-included modules in build.gradle.kts.", "One process to run.", "One module's fault stops all."], ["Packaging", "Optional plugins", "Pick plugins at build time.", "-Pyukta.plugins=all|none|a,b with 9 names.", "Typos fail the build.", "Cannot change at run time."], ["Packaging", "Native binary", "Fast-start executable.", "graalvmNative with --no-fallback, AOT and size flags.", "Fails build on missing metadata.", "16 GB build heap unmeasured."], ["Packaging", "Container image", "Distroless nonroot image.", "Dockerfile copies the native binary, sets YUKTA_SERVER_ADDRESS=0.0.0.0.", "No shell, unprivileged user.", "API open unless a key is set."], ["Configuration", "Profiles", "Dev and prod overlays.", "Base file plus application-dev or -prod; default profile dev.", "Prod verified by ProfileConfigTest.", "JVM default is dev, not prod."], ["Configuration", "Loopback by default", "Not reachable remotely.", "server.address defaults to 127.0.0.1; override with YUKTA_SERVER_ADDRESS.", "Fresh install is local only.", "Remote means opt-in with care."], ["Configuration", "Strict JSON", "Reject unknown fields.", "spring.jackson fail-on-unknown-properties true.", "Typos in requests error out.", "Older clients with extra fields break."], ["Configuration", "Engine defaults", "Control bus, tracker and history values.", "control.bus.* and yukta.* keys in the base file.", "Defaults visible in one place.", "Not the full list of engine settings."], ["Web hosting", "SPA fallback", "Deep links and refresh work.", "Any unmatched GET returns index.html; API paths excluded.", "Client routes never 404.", "Bad paths outside /api give 200 HTML."], ["Web hosting", "Asset caching", "Fast repeat visits.", "365-day cache for /assets/** and top-level asset names; index.html no-cache.", "New release seen on next load.", "Fixed-name files may go stale."], ["Web hosting", "Content-Security-Policy", "Limit what the page can load.", "Header on index.html: same-origin default, no objects, no framing.", "Injected HTML cannot load external scripts.", "Only on the fallback response; inline styles allowed."], ["Operations", "Actuator", "Health, info, metrics.", "Base and prod: those three; dev adds loggers, mappings, threaddump.", "No heapdump exposed in any profile.", "No authentication on Swagger and /v3."], ["Operations", "Request ids in logs", "Correlate lines of one request.", "Log pattern includes [%X{requestId}]; context propagation enabled in main().", "Id follows across threads.", "Only when the filter sets one."], ["Operations", "Virtual threads", "Cheap threads for blocking work.", "spring.threads.virtual.enabled true in base and prod.", "Blocking plugins do not tie up the event loop.", "Pinned or CPU-bound work still limited."], ["Operations", "Gzip in prod", "Smaller responses.", "spring.web.compression on over 1024 bytes in prod.", "Less bandwidth.", "Dev has no compression."], ["Verification", "Acceptance tests", "Real workflows on the real app.", "Workflow and supervisor tests with PROCESS_EXECUTOR.", "Wiring regressions fail tests.", "Need the optional plugin."], ["Verification", "Profile guard", "Config can't silently leak.", "ProfileConfigTest reads real YAML.", "Prod stays quiet and small.", "Tests only list known keys."]], "capsLede": "Boot's capabilities are about packaging, configuration and hosting, not workflow features. Those live in core and the plugins.", "guar": {"title": "What is enforced where", "lede": "Pick a profile and see what holds. Rows marked part or lost are the reasons for the risks on the board.", "profiles": ["dev (default)", "prod"], "profileLabel": "Profile", "defaultProfile": 0, "tables": [{"title": "What each profile enforces", "profiled": true, "head": ["Topic", "In this profile"], "rows": [["Active when", ["info", "No profile named in a JVM run. Also the choice if you pass dev."], ["info", "--spring.profiles.active=prod, or a native image run without a profile argument."]], ["Management endpoints", ["part", "health, info, metrics, loggers, mappings, threaddump. Heapdump and env are not exposed."], ["ok", "health, info, metrics only (inherited from the base file)."]], ["Orchestrator stream logs", ["lost", "TRACE: message payloads can be written to the console."], ["ok", "Not set, so the INFO level of com.infenia.yukta applies."]], ["Application log level", ["part", "DEBUG for com.infenia.yukta; Spring web at DEBUG."], ["ok", "INFO for com.infenia.yukta; root WARN; Spring ERROR."]], ["Response compression", ["info", "Off."], ["ok", "On for responses over 1 KB."]], ["Startup banner", ["info", "Console banner."], ["info", "Off."]], ["Lazy initialisation", ["ok", "Off: errors at start."], ["ok", "Off: errors at start (guarded by a test)."]], ["Network address", ["ok", "127.0.0.1 unless YUKTA_SERVER_ADDRESS."], ["ok", "127.0.0.1 unless YUKTA_SERVER_ADDRESS."]], ["API key on /api", ["part", "Only if a key is set (yukta.api-key or yukta.api-keys). Without it the API is open on loopback."], ["part", "Same."]], ["MCP key on /mcp", ["part", "The same keys, or yukta.mcp.api-key, if any is set."], ["part", "Same."]], ["Auth on /actuator and Swagger", ["part", "Actuator: yes when a key is set (ADMIN, except health). Swagger and /v3: none."], ["part", "Same."]]]}, {"title": "What survives a restart (defaults)", "lede": "Boot's own defaults keep everything in memory.", "head": ["State", "After a restart"], "rows": [["Workflow definitions and sessions", ["lost", "Gone with store-type in-memory (the default set in boot)."]], ["Run history and tracker", ["lost", "Gone; nothing is persisted by default."]], ["Plugin logs", ["lost", "Gone with log backend memory, 30-minute retention."]], ["Settings and profile", ["ok", "Re-read from the same files and environment."]], ["Plugin set", ["ok", "Fixed at build; identical after restart."]], ["Static assets", ["ok", "Served from the jar or binary."]], ["Files and databases", ["part", "Only if configured on purpose; PostgreSQL stores need -Pyukta.persistence=postgres at build time."]]]}, {"title": "Static serving rules", "head": ["Rule", "Value"], "rows": [["Assets cache", "365 days for /assets/** and the 12 top-level file patterns."], ["index.html cache", "no-cache, must-revalidate."], ["CSP on index.html", "Same-origin; inline styles allowed; no objects; no framing."], ["Router exclusions", "/api, /actuator, /mcp, /sse, /v3, /swagger-ui, /swagger-ui.html, /webjars."], ["Match order", "Router is consulted before the resource handler, hence the exclusions."]]}]}, "ref": [{"id": "matrix", "title": "Profile and config matrix", "lede": "The effective value after merging the base file with each profile.", "head": ["Setting", "dev (default)", "prod"], "rows": [["server.address", "127.0.0.1 (YUKTA_SERVER_ADDRESS)", "127.0.0.1 (YUKTA_SERVER_ADDRESS)"], ["Management exposure", "health, info, metrics, loggers, mappings, threaddump", "health, info, metrics"], ["health show-details", "when-authorized", "when-authorized"], ["com.infenia.yukta log level", "DEBUG", "INFO"], ["Stream package log level", "TRACE", "not set (INFO)"], ["Root log level", "INFO", "WARN"], ["Spring web logger", "DEBUG", "WARN"], ["Compression", "off", "on over 1024 bytes"], ["Banner", "console", "off"], ["Virtual threads", "on", "on"], ["MCP endpoint", "/mcp, stateless, async", "/mcp, stateless, async"], ["JSON unknown fields", "rejected", "rejected"], ["Session store type", "in-memory", "in-memory"]]}, {"id": "run", "title": "Run commands", "lede": "JVM vs native.", "head": ["Goal", "Command", "Notes"], "rows": [["Run from sources", "./gradlew bootRun", "dev profile unless -Dspring.profiles.active is set"], ["Run with chosen plugins", "./gradlew bootRun -Pyukta.plugins=http-request,script-js", "Unknown names fail the build"], ["Run without optional plugins", "./gradlew bootRun -Pyukta.plugins=none", "Acceptance tests then fail"], ["Build a jar", "./gradlew :boot:bootJar", "Then java -jar boot/build/libs/*.jar --spring.profiles.active=prod"], ["Build native", "./gradlew :boot:nativeCompile", "Output boot/build/native/nativeCompile/yukta; slow, needs GraalVM 25"], ["Run native", "./boot/build/native/nativeCompile/yukta", "prod chosen by main() if no profile argument"], ["Remote access", "YUKTA_SERVER_ADDRESS=0.0.0.0 yukta.api-key=<secret>", "Without a key the server refuses to start; set the REST keys (they cover /mcp too), not just yukta.mcp.api-key. Swagger and /v3 are still open"], ["Run module tests", "./gradlew :boot:test", "Needs the PROCESS_EXECUTOR plugin"]]}, {"id": "plugins", "title": "Plugin catalogue", "head": ["Build name", "Gradle module", "Status"], "rows": [["process-executor", ":plugins:processors:process-executor", "optional"], ["http-request", ":plugins:processors:http-request", "optional"], ["file-io", ":plugins:processors:file-io", "optional"], ["sql-query", ":plugins:processors:sql-query", "optional"], ["llm-call", ":plugins:processors:llm-call", "optional"], ["session-memory", ":plugins:processors:session-memory", "optional"], ["decision", ":plugins:processors:decision", "optional"], ["mcp-tool-call", ":plugins:processors:mcp-tool-call", "optional"], ["script-js", ":plugins:processors:internal:script-js", "optional"], ["api, constant, schedule triggers", "plugins:triggers:*", "always"], ["notify, console terminals", "plugins:terminals:*", "always"], ["internal-core processors", "plugins:processors:internal:internal-core", "always"], ["rule supervisor", "plugins:supervisors:rule-supervisor", "always"], ["rule, model, rules-first control planes", "plugins:control-planes:*", "always"]]}, {"id": "endpoints", "title": "Endpoints served by this app", "head": ["Path", "Served by", "Guard"], "rows": [["/api/**", "web controllers (REST and SSE)", "yukta.api-key or yukta.api-keys if set"], ["/mcp", "mcp server (stateless, async)", "the same keys, or yukta.mcp.api-key, if any is set"], ["/sse", "alias rewritten to /mcp", "same as /mcp"], ["/actuator/**", "actuator", "ADMIN key when a key is set (health excepted)"], ["/swagger-ui.html, /v3/**", "springdoc", "none"], ["/assets/**", "SPA host", "none"], ["any other GET", "SPA host (index.html)", "none"]]}], "quality": [{"n": "Scalability", "pos": "Boot adds nothing that scales: one process, one port. All scaling questions belong to core. It does not block scale-out, but it offers no help either.", "ceil": ["One JVM, one Netty server, one port for API, MCP and management", "In-memory defaults mean copies share nothing", "Native image fixes the plugin set", "Management traffic shares the API pool"], "have": ["Virtual threads for blocking work", "Gzip in prod", "Long cache for hashed assets"], "need": ["A documented multi-instance setup, or an explicit statement that it is single-node", "A separate management port", "A CDN or ETag strategy for assets if traffic grows"]}, {"n": "Performance", "pos": "Start-up and memory are the performance topics here. Native image gives the best start-up; the JVM is easier to build.", "ceil": ["The native build needs a big heap and time", "index.html is read per request", "Debug logging with payloads in dev costs CPU and disk"], "have": ["Native image with AOT", "365-day cache of hashed assets", "Eager start-up that finds faults early"], "need": ["Measured start-up and memory numbers per mode", "Cache the index file in memory", "A budget for build time and heap"]}, {"n": "Availability", "pos": "Nothing in boot restarts, replicates or drains. Availability comes from the platform that runs the process, and from core's recovery after a restart.", "ceil": ["No graceful shutdown setting is configured here", "Defaults lose state on restart", "Health detail is probably hidden"], "have": ["Health endpoint in every profile", "Eager start-up so bad config never half-starts", "Fail-fast build for plugin typos"], "need": ["Readiness vs liveness split", "A shutdown grace period set explicitly", "A persistent-state profile"]}, {"n": "Security", "pos": "The strongest lens for this module. Since the first guide the start-up guard, a guarded actuator and Host/Origin checks were added; what is left is the dev default, the open docs, and one gap in the guard.", "ceil": ["Swagger and /v3 are outside any key", "The guard accepts yukta.mcp.api-key alone, which leaves /api open", "Default JVM profile is dev", "Keys are optional on loopback"], "have": ["Loopback by default, and a start-up refusal on other addresses without a key", "Actuator guarded by an ADMIN key; no heapdump or env exposure", "CSP and no-cache on index.html", "Profile test guards prod config"], "need": ["Prod-by-default or a refusal to bind publicly in dev", "Guard the docs, or switch them off in prod", "A guard that checks the keys the filters use"]}, {"n": "Operability", "pos": "Good basics: three profiles' worth of logging, request ids in log lines, a health URL. Missing is guidance and guard rails for production.", "ceil": ["Config split across YAML, environment and build flags", "Keys that nothing reads", "Which plugins are in a given binary is not visible at run time"], "have": ["Console logs with request id", "Health, info and metrics", "Documented run commands"], "need": ["Expose the build's plugin list in info", "Remove or implement dead config keys", "A production example config"]}, {"n": "Evolvability", "pos": "Adding a module or plugin is one line in the build file, which is cheap. The weak spot is that behaviour is spread across the build flag, YAML and a launcher rule.", "ceil": ["Plugin list is a hand-kept map in the build script", "Profile forcing is in code and in the build", "Legacy /sse name lingers"], "have": ["Single place to add modules", "Tests for config and launcher rules", "Fail-fast validation of plugin names"], "need": ["Derive the plugin list from the module tree", "Decide and document the profile policy", "Retire the /sse alias on a schedule"]}], "risks": [{"id": "profileDefault", "t": "Default JVM profile is dev", "a": "Security", "i": 4, "e": 2, "c": ["launch", "config"], "why": "A jar started with no flags uses dev: DEBUG logs, TRACE for the orchestrator stream package (message payloads) and extra management endpoints. Example: an operator copies the jar to a server and forgets --spring.profiles.active=prod.", "o": "Make prod the default and keep dev opt-in for developers (bootRun can pass dev); or have main() refuse to bind a non-loopback address under dev.", "q": "Which users run the JVM jar rather than the native binary or container, and can we change the default for them?"}, {"id": "devExposure", "t": "Dev exposes loggers, mappings and threaddump, and logs payloads", "a": "Security", "i": 2, "e": 2, "c": ["config", "mgmt"], "why": "loggers lets a caller read and change log levels over HTTP; threaddump and mappings reveal internals. The TRACE stream logger writes message payloads, which may hold secrets from workflow inputs. Update: a configured key now guards these endpoints (ADMIN only), so the exposure is limited to keyless loopback use; the TRACE payload logging is unchanged.", "o": "Trim dev exposure to health and info plus what is needed; put payload tracing behind its own flag rather than a profile.", "q": "Does anyone rely on /actuator/loggers in dev, and is payload TRACE needed as often as it is on?"}, {"id": "openOps", "t": "Swagger and /v3 are outside any key; the dev profile opens more", "a": "Security", "i": 3, "e": 2, "c": ["mgmt", "app"], "why": "Done (PR #373): with a key set, the key filter now covers /actuator (except /actuator/health) and requires an ADMIN key, and <code>/mcp<\/code> is guarded by the same keys. Still open: the Swagger UI and the OpenAPI document have no check, so with a public bind anyone can read the API description; and with no key on a loopback bind the actuator (in dev: loggers, mappings, thread dumps) is open to every local caller.", "o": "Guard the docs with the same filter, or switch springdoc off under the prod profile; or put management on a loopback-only port.", "q": "Should operations endpoints use the same key as the API, a different one, or network isolation?"}, {"id": "profileForce", "t": "Prod profile choice is split between main() and the build", "a": "Operability", "i": 2, "e": 2, "c": ["launch", "native"], "why": "main() forces prod in native images and the build passes -Dspring.profiles.active=prod. The old review said main()'s rule was removed; it is still there. Two mechanisms, and it is unverified whether the build flag reaches the running binary. The env var SPRING_PROFILES_ACTIVE is not considered.", "o": "Keep one mechanism, test the native binary's profile at run time, and document the order of precedence.", "q": "Which of the two did we intend to keep?"}, {"id": "buildFixed", "t": "Plugins are fixed at build time", "a": "Functionality", "i": 3, "e": 4, "c": ["plugsel"], "why": "A user cannot add or remove a plugin without rebuilding. Teams that want a custom set must run their own build, including a slow native compile. Update: there is now one built-in variant switch (<code>-Pyukta.plugins=default<\/code> leaves out script-js), and native images with the workers module must be built as their role (<code>-Pyukta.workers.native=control-plane|worker<\/code>).", "o": "Offer prebuilt variants (full, minimal), or a plugin directory loaded by the JVM build for users who do not need native.", "q": "Do we want third parties to ship plugins, and if so how do they get them onto a binary?"}, {"id": "testsNeedPlugin", "t": "Tests need an optional plugin", "a": "Correctness", "i": 2, "e": 2, "c": ["accept", "plugsel"], "why": "WorkflowAcceptanceTest and SupervisorAcceptanceTest use PROCESS_EXECUTOR. A build with -Pyukta.plugins=none or a list without it cannot pass :boot:test, and the failure looks like a workflow bug.", "o": "Make the tests skip with a clear message when the plugin is absent, or always add it to testImplementation.", "q": "Which plugin combinations must CI cover?"}, {"id": "xmx8g", "t": "Native build heap of 16 GB is unmeasured", "a": "Operability", "i": 2, "e": 1, "c": ["native"], "why": "<code>-J-Xmx16g<\/code> is set for the native build (it was 8 GB in the first guide, and 16 GB before that); neither value was measured. On a smaller runner the build can run out of memory, and on a larger project it may need more. The repository's CI workflows contain no native build job, so the figure is only exercised on a developer's or release machine.", "o": "Measure peak use once, record it next to the flag, and fail with a clear message if memory is too small.", "q": "What is the smallest runner we want to support for native builds?"}, {"id": "nativeGap", "t": "Native binary is not exercised by tests", "a": "Reliability", "i": 3, "e": 4, "c": ["native", "accept"], "why": "All tests run on the JVM. Missing reflection or resource entries show up only when the binary runs. Plugin loading, JSON binding of records and the MCP tools are typical places.", "o": "Add a smoke test that starts the built binary and runs one workflow, perhaps in CI after nativeCompile.", "q": "How often does a native-only failure reach users compared with JVM issues?"}, {"id": "singleProc", "t": "Everything is a single process with in-memory defaults", "a": "Availability", "i": 4, "e": 5, "c": ["app", "tuning"], "why": "A restart loses definitions, sessions and history unless files are configured. Update: boot can now include the PostgreSQL stores (<code>-Pyukta.persistence=postgres<\/code>, with <code>yukta.session.store-type=postgres<\/code>), and a control-plane/worker split with <code>-Pyukta.workers=true<\/code>; a leader lease allows an active/standby pair. The default build is still one process with in-memory state, and no persistent profile is documented as the default.", "o": "Ship a documented persistent profile (file stores or PostgreSQL) and say which build flag it needs.", "q": "Is a persistent profile expected for production or is Yukta single-use per install?"}, {"id": "healthDetails", "t": "Health show-details: when-authorized with no security", "a": "Operability", "i": 2, "e": 1, "c": ["mgmt", "config"], "why": "Boot has no Spring Security, so in our view no caller can be authorised and detail fields are probably never shown. Operators then see only UP or DOWN. This was not run to confirm.", "o": "Set show-details explicitly (never or always on loopback), or add the security that makes the rule meaningful.", "q": "What do operators expect to see at /actuator/health?"}, {"id": "deadKeys", "t": "Config keys that nothing reads or that mislead", "a": "Operability", "i": 2, "e": 1, "c": ["config", "tuning"], "why": "The comment on yukta.logs.store.backend says memory | file, but only the memory store is registered. control.bus.* repeats the code's own defaults, so the two can drift. A key with no reader is ignored in silence.", "o": "Remove or implement them; keep one source for each default; test that every key in the files is read.", "q": "Who owns the list of supported keys?"}, {"id": "staticStale", "t": "Unhashed top-level assets cached for a year", "a": "Functionality", "i": 2, "e": 2, "c": ["spa"], "why": "Patterns like /*.json, /*.svg, /*.ico and /*.webmanifest get the 365-day cache but are not content-hashed, so a changed icon or manifest can stay stale in browsers for a long time.", "o": "Use a shorter cache or ETag for unhashed names and keep the year only for /assets/**.", "q": "Which top-level files do we actually ship and how often do they change?"}, {"id": "apiPath200", "t": "Unknown non-/api path returns 200 HTML", "a": "Correctness", "i": 1, "e": 1, "c": ["spa"], "why": "A mistyped REST path, for example /apis/workflows, returns index.html with 200. A client expecting JSON gets HTML and a confusing parse error.", "o": "Limit the fallback to paths that look like screens (no file extension, no /api prefix), or return 404 for Accept: application/json.", "q": "Do external clients call the server with typos often enough to matter?"}, {"id": "cspScope", "t": "CSP covers only the fallback page and allows inline styles", "a": "Security", "i": 2, "e": 3, "c": ["spa"], "why": "The policy is only on index.html. It allows style-src 'unsafe-inline' because React Flow needs inline styles. No o ent has none.", "con": "Small and native friendly; no roles, and uneven coverage of paths.", "alt": "Spring Security: roles, standard patterns, bigger footprint and configuration.", "rev": "users need roles, single sign-on or protection of every path."}], "evo": [{"id": "now", "n": "Today", "d": "One process, loopback by default with a start-up guard, dev default on the JVM, prod forced on native, all plugins except script-js by default, in-memory state unless a persistence or workers build is chosen.", "r": []}, {"id": "safe", "n": "Safer defaults", "d": "Done: refuse to bind publicly without a key, guard /actuator. Next: fix the guard for the MCP-key-only case, guard or switch off Swagger, prod as the default profile, trim dev exposure.", "r": ["guardMcpKeyOnly", "profileDefault", "devExposure", "openOps"]}, {"id": "verify", "n": "Verify the shipped artifact", "d": "Smoke-test the native binary and its profile; measure the build heap; make tests independent of plugin choice.", "r": ["nativeGap", "xmx8g", "testsNeedPlugin", "profileForce", "nativeMetaStale"]}, {"id": "state", "n": "Persistent profile", "d": "A documented profile with file stores or a database, and clean-up of dead keys.", "r": ["singleProc", "deadKeys"]}, {"id": "plug", "n": "Flexible packaging", "d": "Prebuilt plugin variants or a plugin directory for JVM builds.", "r": ["buildFixed", "scanBroad"]}], "evoLede": "Boot's path is mostly about making the safe choice the default and proving the shipped artifact works.", "prompts": [["Security", "The server is exposed on 0.0.0.0 with an API key and no profile. List what a stranger can read (hint: the docs), and what changes if only yukta.mcp.api-key is set.", "mgmt", "openOps"], ["Security", "Which of our default settings would you change first to be safe in production, and what breaks for developers?", "config", "profileDefault"], ["Scale", "You must run three copies behind a load balancer. What does each copy hold that the others cannot see?", "app", /* ---- prompts ---- */
if(D.prompts&&D.prompts.length){var pi=0;
 var deck=function(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
  $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}};
 deck()}
/* ---- glossary ---- */
function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
</script>
</body>
</html>
