# Build cache configuration for faster incremental builds
org.gradle.caching=true

# Configuration cache (experimental but safe)
# Disabled for CLI module: Go tasks are not compatible with Gradle's configuration cache
org.gradle.configuration-cache=false

# Parallel execution
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.vfs.watch=true

# Memory configuration
org.gradle.jvmargs=-Xmx4g

# Native image caching - GraalVM native-image specific cache
org.graalvm.buildtools.native.buildtools.gradle.plugin.caching=true

# Build scan (optional - uncomment for detailed analysis)
# org.gradle.build.scan.opt-in=true

# Single version source for every module
# x-release-please-start-version
version=0.1.0-alpha.3
# x-release-please-end
