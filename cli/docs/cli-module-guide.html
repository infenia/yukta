dreds of times"]}, {"n": "Availability", "pos": "The CLI is only as available as the server. It fails fast (30 s) and never retries, which is predictable but unforgiving for flaky networks and for the 'at limit' answer the server gives on purpose.", "ceil": ["No retries or back-off on 429, 5xx or network errors", "Streams do not reconnect, and a clean close looks like success", "Exit code 1 for every failure, so scripts cannot react differently to each", "A hung stream with a silent server waits forever"], "have": ["A time limit on every normal call", "Ctrl-C always works on streams", "Clear 'request failed' versus 'API error' wording"], "need": ["Opt-in retry for safe GETs and for starts with an idempotency key", "Reconnect with Last-Event-ID", "Distinct exit codes for usage error, server error and timeout"]}, {"n": "Security", "pos": "The CLI is a credential carrier. It sends a bearer token to whatever address it is given, and the server's API key is the only protection on an open server. The server's default is loopback only, and the CLI's default URL matches that.", "ceil": ["Token sent over plain http with no warning", "<code>--token<\/code> on the command line is visible in shell history and the process list", "No control over TLS (custom CA, client certificates)", "Path escaping protects ids, but nothing validates the server's identity beyond normal TLS"], "have": ["Ids are escaped, so a hostile id cannot redirect a request", "Token read from the environment by default", "gosec and govulncheck run in the build; releases carry checksums and provenance", "User-named files are read deliberately and annotated for the scanner"], "need": ["A warning (or refusal) when a token would go over http to a non-loopback host", "Documented advice to use YUKTA_TOKEN rather than --token", "A way to trust a private CA"]}, {"n": "Operability", "pos": "Easy to build and test, harder to support in the field. A user cannot tell which version they run, errors appear twice with help text, and the documentation describes commands and files that do not exist.", "ceil": ["No version command and no embedded version", "Errors printed twice and wrapped in usage text", "README out of date: wrong binary names, a <code>goBuildDev<\/code> task that does not exist, a config file and <code>--file<\/code> flag that do not exist, <code>/api/v1<\/code> paths", "Windows developers need make and a POSIX shell"], "have": ["Release workflow with SHA256SUMS and provenance", "One source of truth for the build (the Makefile)", "Clear error prefixes: request failed versus API error"], "need": ["A <code>version<\/code> command with ldflags", "Silenced duplicate error output", "Refresh the README and CLAUDE.md, add a test that every command listed in help is registered"]}, {"n": "Evolvability", "pos": "Adding a command is easy and cheap because of the shared builder, and the code is small and fully covered. The weakness is the link to the server: nothing breaks when the server changes, so the CLI quietly drifts.", "ceil": ["Hand-written DTOs and paths with no contract test", "Server marks the paths the CLI uses as deprecated", "Registration by hand: a finished command can stay unreachable", "Shared package-level output variable"], "have": ["Generic Action helper keeps new simple commands to a few lines", "Tests use a real HTTP server, so refactors are safe", "100% per-function coverage"], "need": ["A contract test against the server's OpenAPI document or a real server in CI", "A test that walks the command tree and compares it with a list of supported endpoints", "Move to the non-deprecated paths with care for the session check"]}], "risks": [{"id": "stopMode", "t": "<code>workflow stop<\/code> cannot choose DRAIN, CANCEL or KILL", "a": "Functionality", "i": 3, "e": 1, "c": ["cmds", "res"], "why": "The server's stop endpoint takes <code>?mode=<\/code> with DRAIN (finish in-flight work, the default), CANCEL (cancel at once, let plugins clean up) or KILL (cancel and remove the run). The CLI never sends it, so the polite default is the only option. An operator facing a stuck run has no CLI way to force it.", "o": "Add <code>--mode<\/code> with the three values, validated before sending. Document that KILL removes the run.", "q": "Should a destructive mode like KILL need a confirmation flag in a CLI, or is naming it enough?"}, {"id": "noPaging", "t": "No paging: long lists are silently cut at the first page", "a": "Correctness", "i": 3, "e": 2, "c": ["cmds", "res"], "why": "Session list, summaries, workflow history and workflow executions return at most 500 items by default (1,000 at most) and announce more in an <code>X-Next-Cursor<\/code> header. The CLI neither sends <code>limit<\/code>/<code>cursor<\/code> nor reads the header, so with 800 sessions the user sees 500 and nothing says that 300 are missing. Scripts that look for an execution in history can wrongly conclude it does not exist.", "o": "Add --limit and --cursor flags; or follow the header automatically with an --all flag; at minimum print a warning when the header is present.", "q": "Is silent truncation acceptable for a tool used in scripts, or should the CLI fail loudly when it sees a next cursor?"}, {"id": "dtoDrift", "t": "Hand-written paths and types can drift from the server", "a": "Evolvability", "i": 4, "e": 3, "c": ["res", "tests"], "why": "Paths and response shapes are copied by hand. A renamed field decodes to an empty value, so a command can print blanks and exit 0. The tests run against fake servers written by the same author, so they confirm the CLI matches the author's memory, not the server. The improvements note itself says an OpenAPI-generated client was not built.", "o": "Run a contract test in CI that starts the real server (or reads <code>/v3/api-docs<\/code>) and checks each path and field the CLI uses; or generate the client; or fail decoding on missing required fields.", "q": "Is it worth generating the client, which brings many generated types, or is a thin contract test enough for about 30 endpoints?"}, {"id": "legacyPaths", "t": "Uses the server's deprecated session-qualified paths", "a": "Evolvability", "i": 2, "e": 2, "c": ["res"], "why": "Pause, resume, status, stream and node control use <code>/api/workflow/{sid}/{eid}/...<\/code>. The server documents these as deprecated in favour of <code>/api/executions/{eid}/...<\/code>. When they are removed the CLI breaks. In our view the legacy form also has a useful property: the session in the path makes the server check that the run belongs to that session. Update: 12 of the client's calls still use the deprecated /api/workflow/... forms (pause, resume, stop, status, stream, history and the node commands); the newer commands (retry, breakpoint, signal, result) use the canonical /api/executions/... and /api/sessions/... paths.", "o": "Move to the new paths and keep session as an optional guard (for example a --session flag); or ask the server team to keep the session check on the new paths and set a removal date for the old ones.", "q": "Should the new execution-only paths verify a session when one is known, so that moving to them does not weaken the cross-session check?"}, {"id": "tokenPlain", "t": "Bearer token goes over plain http and may leak through the process list", "a": "Security", "i": 4, "e": 2, "c": ["root", "http"], "why": "The CLI sends <code>Authorization: Bearer ...<\/code> to any <code>--url<\/code>. If someone points it at <code>http://prod.example.com<\/code> the key crosses the network in clear text. Passing <code>--token abc<\/code> also exposes the key in shell history and in <code>ps<\/code> output. A 401 gives no hint about how to set a token.", "o": "Warn (or refuse without a flag) when a token is used with http to a non-loopback host; read the token from a file or prompt; hint at YUKTA_TOKEN on a 401; support custom CA files.", "q": "Should the CLI refuse plain-http tokens by default, accepting that local test servers need an explicit override?"}, {"id": "noRetry", "t": "No retries or back-off", "a": "Availability", "i": 3, "e": 3, "c": ["http"], "why": "A 429 ('at the run limit, try later') or a network blip fails the command at once. CI scripts must wrap every call in their own retry loop, and they cannot tell the cases apart because the exit code is always 1. Retrying blindly would be unsafe for starts, which is why it is tied to the idempotency key risk.", "o": "Add opt-in retries (--retries, --retry-wait) for GET requests and 429/503 with the server's Retry-After if present; retry starts only with an idempotency key.", "q": "Which failures should a CLI retry by default: only reads, or also 429 answers that the server deliberately gave?"}, {"id": "idemKey", "t": "A start cannot be sent with an idempotency key", "a": "Reliability", "i": 3, "e": 1, "c": ["http", "cmds"], "why": "The server supports <code>Idempotency-Key<\/code> on <code>POST /api/workflow/start<\/code>: the same key returns the first run's id instead of starting a second run. With a 30-second limit, a start that times out is ambiguous: the run may exist. The CLI gives the user no safe way to repeat it, so a pipeline may start the workflow twice.", "o": "Add <code>--idempotency-key<\/code> (or generate one per invocation and print it) to <code>workflow start<\/code>.", "q": "Should the CLI generate a key automatically for every start so that retries are safe by default?"}, {"id": "streamLoose", "t": "Streams: no reconnect, clean close looks like success, last event may be lost", "a": "Reliability", "i": 3, "e": 3, "c": ["sse"], "why": "The server supports <code>Last-Event-ID<\/code> and sends a ping every 15 seconds. The CLI uses neither. A dropped connection ends the watch, and a clean close exits 0, the same as a finished run. An event not followed by a blank line at the end of the connection is discarded. A silent server leaves the command waiting forever. The new <code>controlbus watch<\/code> has the same limits: it does not send Last-Event-ID or reconnect.", "o": "Reconnect with the last id and back-off (bounded); fail if the stream ends before a final state; flush the last partial event; add an idle timeout based on the pings.", "q": "Should <code>logs<\/code> and <code>status-stream<\/code> exit non-zero when the stream ends before the execution reaches a final state?"}, {"id": "missingCmds", "t": "Many server endpoints have no command", "a": "Functionality", "i": 2, "e": 3, "c": ["cmds", "res", "sse"], "why": "Partly closed. Since the first guide the CLI gained <code>controlbus watch<\/code> (the event stream, with <code>--quiet<\/code>), <code>result<\/code>, <code>workflow node retry<\/code>, <code>breakpoint<\/code>, <code>signal<\/code> and <code>session apply<\/code>. Still without a command: definition validation, session config and workflow list, supervisors, workflow versions (list, diff, rollback, notes), pending approvals, scheduler limits and priority, recover, run search and the control audit, and workers. Operators and CI jobs fall back to curl for these.", "o": "Add the commands people ask for first (validate, retry, events stream); or generate the commands from OpenAPI; or state an explicit scope for the CLI.", "q": "What is the CLI for: a full admin tool, or only the handful of commands CI and developers use daily?"}, {"id": "fileOrJson", "t": "File-or-JSON arguments hide a mistyped path as 'invalid JSON'", "a": "Operability", "i": 2, "e": 1, "c": ["cmds"], "why": "<code>controlbus command<\/code> (and <code>session apply<\/code>) check whether a file exists and otherwise treat the text as inline JSON. A typo in a file name therefore reports <code>invalid JSON: invalid character<\/code>, which sends the user hunting for a JSON mistake. A directory name is also parsed as JSON.", "o": "Use <code>@file<\/code> for files (like curl) or separate <code>--file<\/code> and <code>--json<\/code> flags. Or detect text that does not start with <code>{<\/code> and say 'file not found'.", "q": "Would you accept a breaking change to the argument form, given that scripts may already rely on passing a path?"}, {"id": "outputUneven", "t": "The -o setting is not applied consistently", "a": "Operability", "i": 2, "e": 2, "c": ["out", "cmds", "root"], "why": "Some commands print tables, some plain text, some always JSON. <code>status-stream<\/code> always prints JSON, <code>heartbeat<\/code> rows are in random order and <code>-o yaml<\/code> is accepted and treated as table. <code>session apply<\/code> would define a second local -o that shadows the global one. Scripts cannot rely on one output rule.", "o": "Define a rule: -o table|json applies to every command except raw streams; validate the value on the root; give every command a table and a JSON form; sort map keys.", "q": "Should JSON output be the stable, documented contract for scripts, and table output free to change?"}, {"id": "errorNoise", "t": "Errors are printed twice and the exit code is only 0 or 1", "a": "Operability", "i": 2, "e": 1, "c": ["entry", "http"], "why": "Cobra prints <code>Error: ...<\/code> and the usage block, then <code>main<\/code> prints <code>error: ...<\/code>. The one useful line is hidden in help text in CI logs. The server's JSON error body (message, error, path) is shown raw. Scripts cannot tell 404, 429, 5xx, timeout and bad usage apart.", "o": "Silence Cobra's error and usage printing for runtime errors; parse the error envelope and print its message; define exit codes (for example 2 usage, 3 not found, 4 server, 5 timeout).", "q": "Which exit codes does your automation need, and is it better to publish them as part of the CLI's contract?"}, {"id": "noVersion", "t": "No version command, no embedded version", "a": "Operability", "i": 2, "e": 1, "c": ["entry", "build"], "why": "Releases are published with checksums and provenance, but the binary cannot say which release it is. Bug reports cannot name a version, and a user cannot tell whether their CLI is older than their server.", "o": "Add <code>yukta version<\/code> with the tag and commit set through <code>-ldflags -X<\/code> in <code>make build<\/code>; optionally warn when the server's version is newer.", "q": "Should the CLI check server compatibility on first use, or is a printed version enough?"}, {"id": "winBuild", "t": "Windows developers need make and a POSIX shell", "a": "Operability", "i": 1, "e": 2, "c": ["build"], "why": "The Makefile uses shell, awk and grep, and the Gradle tasks call <code>make<\/code>. The released Windows binary is fine, but building or checking on plain Windows needs WSL or Git Bash.", "o": "Document it; or move the logic into a small Go or Gradle program; or provide a Windows-friendly wrapper.", "q": "Are there Windows contributors who build the CLI, or is CI the only builder for that platform?"}, {"id": "testsTwice", "t": "<code>check<\/code> runs the tests twice", "a": "Performance", "i": 1, "e": 1, "c": ["build", "tests"], "why": "The Gradle <code>check<\/code> task depends on both <code>goTest<\/code> and <code>goCoverageCheck<\/code>, and the coverage check runs all tests again. It doubles the test time on every check.", "o": "Drop <code>goTest<\/code> from <code>check<\/code> (the coverage check already runs the tests) or let the coverage check reuse the result.", "q": "Is the separate goTest task there for a clearer failure message, which might be worth the extra time?"}, {"id": "docsStale", "t": "README and notes disagree with the code", "a": "Governance", "i": 2, "e": 1, "c": ["build", "cmds"], "why": "The README names binaries like <code>yukta-darwin<\/code>, a <code>goBuildDev<\/code> Gradle task, a <code>goCheck<\/code> task, a <code>~/.yukta/config<\/code> file, a <code>--file<\/code> flag, <code>/api/v1<\/code> endpoints and Go 1.21; none exists. The root help text still says 'Code quality gates for AI-driven development'. Notes disagree on the Go version. A newcomer follows the README and fails at the first command. Update: still true on 2026-10-15 (yukta-darwin, goBuildDev, ~/.yukta/config and /api/v1 are all still in the README).", "o": "Rewrite the README from the Makefile and the command map; add a docs test that every command shown in the README exists in the tree.", "q": "Who owns the CLI docs, and would generating the command reference from Cobra remove the problem?"}, {"id": "emptyReason", "t": "Node stop always sends an empty reason", "a": "Correctness", "i": 1, "e": 1, "c": ["cmds"], "why": "<code>workflow node stop<\/code> always adds <code>reason=<\/code> to the request. The server's default reason, 'Stopped via REST API', applies only when the parameter is absent, so audit records of CLI stops carry an empty reason unless the user passes --reason.", "o": "Send the parameter only when --reason is set, or default it to a CLI-specific text such as 'Stopped via yukta CLI'.", "q": "Should audit trails be able to tell which client (UI, CLI, agent) sent a stop?"}, {"id": "localTimestamps", "t": "Zone-less server timestamps are read in the CLI's own time zone", "a": "Correctness", "i": 2, "e": 2, "c": ["res"], "why": "The server sends <code>java.time.LocalDateTime<\/code> values with no zone. The new <code>Timestamp<\/code> type accepts RFC 3339 and, failing that, parses the zone-less form with <code>time.Local<\/code>. The code comment says it assumes that the server and the CLI share a zone: differences between two zone-less values are right, but a value compared with an RFC 3339 one, or printed next to the user's own clock, is off by the zone difference. A CI runner in UTC talking to a server in another zone shows wrong run times.", "o": "Send ISO instants with a zone from the server (the root cause), or add a --server-zone flag; until then print the server's time as received.", "q": "Do your CI runners and your Yukta server run in the same time zone?"}, {"id": "keywordProblems", "t": "--quiet decides what is a problem by keywords copied from the server", "a": "Correctness", "i": 2, "e": 2, "c": ["sse", "cmds"], "why": "<code>controlbus watch --quiet<\/code> keeps a line when it matches <code>error|failed|failure|exception|What went wrong<\/code> (or warn/deprecat), the same regular expressions as the server's <code>EventSeverity<\/code>, plus gradle-specific context lines. A log line such as '0 errors found' is shown as an error, and a real failure whose line has none of the words is hidden (a failed node's own reason is still shown). The two copies of the patterns can drift apart, and each node prints at most 20 problem lines.", "o": "Have the server send the severity it already computes (the CLI reads it for the server filter) and use only that; or share the patterns from one place.", "q": "Would you rather see a harmless line too often or miss a failure line?"}], "adrs": [{"t": "A thin Go client that shares no code with the server", "ctx": "Developers and CI machines should be able to drive Yukta without a JVM, and the CLI should start instantly.", "dec": "Write the CLI in Go with Cobra, as a separate module with its own build. It talks to the web module's REST and SSE API only.", "con": "Tiny static binaries, fast start, no Java needed. The cost is that every endpoint and type is duplicated by hand and nothing links it to the server.", "alt": "A Java CLI sharing the web module's DTOs would stay in step automatically but needs a JVM or a native-image build of the whole server stack. A shell script around curl needs no build but has no help text, validation or tests. A client generated from OpenAPI is possible but was not built.", "rev": "the endpoint list keeps growing, or drift causes a real incident."}, {"t": "Hand-written types and loosely typed answers", "ctx": "The server's answers are wrapped in an envelope with many fields. The CLI only needs a few.", "dec": "Decode only the <code>data<\/code> field into small hand-written structs, or a generic map for complex answers such as graphs.", "con": "Little code and no generator dependency. Unknown fields are ignored, which is lenient, but renamed fields become empty without any error.", "alt": "Generate from the OpenAPI document: always correct, but large generated code and a build step. Strict decoding that rejects missing fields: catches drift, but breaks on harmless server additions if not tuned.", "rev": "a contract test finds drift, or a second client (for example a Python SDK) appears and could share the generated model."}, {"t": "The Makefile is the build; Gradle only wraps it", "ctx": "The first Gradle script had about 578 lines duplicating Go build logic, hid compiler output and could use a stale coverage file.", "dec": "Put all logic in the Makefile and make each Gradle task run one Make target, so output shows as is and the JVM build can still include the CLI.", "con": "One place to change, same result with make or Gradle. Windows needs make and a POSIX shell.", "alt": "Pure Gradle: familiar to the JVM team but duplicates Go tooling and hid errors before. Pure Go tooling with no wrapper: simplest, but the repository's single entry point (<code>./gradlew check<\/code>) would not cover the CLI.", "rev": "Windows contributors become common, or the Make logic outgrows shell and awk."}, {"t": "One generic Action builder and commands grouped by resource", "ctx": "Dozens of commands do the same thing: call an endpoint with ids and print one line.", "dec": "Group commands like the REST resources (session, workflow, node, executions, logs, plugin, controlbus) and build 'call and print' commands from one generic helper with a typed result.", "con": "Short, uniform commands; the 12 duplicate files were removed. Registration is still manual, which allowed a finished command to go unregistered.", "alt": "One file per command: easy to read but repetitive. Generating commands from OpenAPI: no omissions but unpredictable help text and awkward names. A flat list of commands: fewer levels but names collide.", "rev": "a registration test is added (then fine), or the command count doubles."}, {"t": "Test with a real local HTTP server, not mocks", "ctx": "An earlier setup had interfaces and a 612-line fake client only for tests; the fake could pass while real behaviour was wrong.", "dec": "Delete the fakes. Every command and client function is run against an <code>httptest<\/code> server that records the path and returns canned answers. Enforce 100% coverage per function.", "con": "Escaping, headers and error text are tested for real. The fake server's answers are still written by the author, so wrong assumptions about the server pass. Coverage cannot see an unregistered command.", "alt": "Interface mocks: faster to write but test the mock. A real server in CI: the truest, slow and heavy (needs the JVM image). Recorded responses from the real server: realistic, but need regular refresh.", "rev": "a contract problem reaches users, which would justify the cost of a real-server test."}, {"t": "Streams: no timeout, own SSE scanner, no reconnect", "ctx": "Status and log streams may run for hours, and the server speaks plain SSE with ids and 15-second pings.", "dec": "Skip the request timeout for streams, scan lines with a small own reader (1 MB line limit), and stop on Ctrl-C. Do not reconnect.", "con": "No extra dependency and easy to fuzz. The user loses events or must re-run after a drop, and a silent server hangs the command.", "alt": "A third-party SSE library: reconnect and ids for free, but a new dependency to scan and pin. A per-read idle timeout: protects against silent servers; not done. Polling the status endpoint: simple and resumable but slower and heavier.", "rev": "users report lost events, or CI jobs hang on dead streams."}, {"t": "Pin the quality tools with go run and versions", "ctx": "Using @latest of golangci-lint, gosec and govulncheck made builds non-repeatable and ran unpinned code.", "dec": "Run each tool as <code>go run pkg@version<\/code> in the Makefile (golangci-lint v2.14.0, gosec v2.29.0, govulncheck v1.8.0).", "con": "Repeatable results with nothing to install; the module's own dependency list stays small. Versions need manual bumps, and a first run downloads the tool.", "alt": "A <code>tool<\/code> directive in go.mod: native, but adds hundreds of indirect requirements to the CLI module. Installing from a Docker image: strong isolation, heavier setup. Unpinned @latest: no upkeep but no repeatability.", "rev": "the manual bumps are forgotten, or Dependabot support for these pins becomes possible."}, {"t": "Static binaries per platform with checksums and provenance", "ctx": "Users of a CLI download a program and trust it with an API key.", "dec": "Build with <code>CGO_ENABLED=0<\/code> for five targets, publish <code>SHA256SUMS<\/code> and a build-provenance attestation on tagged releases.", "con": "No installs, and users can verify what they run. No installer, no package-manager entries, no auto-update, no version command.", "alt": "Packages for Homebrew, apt and winget: easier for users, more release work. A container image: simple for CI but awkward for desktops. Source install with <code>go install<\/code>: needs Go.", "rev": "many users ask for package-manager installs, or a signed release is required."}], "evoLede": "A practical order: fix what misleads users first, then close the gaps to the server, then make the link to the server self-checking.", "evo": [{"id": "now", "n": "Today", "d": "Five command groups (about forty commands, including watch, result, node retry, breakpoint and signal), 100% function coverage, pinned tools, releases with checksums. The first page of every list, no retries, no resume.", "r": []}, {"id": "honest", "n": "Make it honest", "d": "Done: <code>session apply<\/code> is registered. Next: refresh the README, fix the root description, silence the duplicate error output, add <code>yukta version<\/code>, and test that every written command is registered.", "r": ["docsStale", "errorNoise", "noVersion"]}, {"id": ed for live status and logs."], ["Last-Event-ID", "An HTTP header a reconnecting stream client sends so the server skips events it already delivered.", "The server supports it; the CLI does not use it."], ["Keep-alive ping", "A comment line the server sends every 15 seconds on an idle stream.", "Stops proxies from closing it; the CLI ignores it."], ["Bearer token", "A secret sent in the Authorization header as proof of permission.", "The CLI's way to pass the server's API key."], ["API key (yukta.api-key)", "The server setting that turns on authentication for /api paths.", "If it is set, the CLI needs --token or YUKTA_TOKEN."], ["Loopback", "The address 127.0.0.1, reachable only from the same machine.", "The server's default, which is why an open API is acceptable locally."], ["Idempotency key", "A caller-chosen label that makes a repeated request return the first result instead of acting twice.", "The server supports it on start; the CLI cannot send it."], ["Pagination and cursor", "Returning a long list in pages; a cursor is the 'where I stopped' marker for the next page.", "The CLI never asks for page two."], ["X-Next-Cursor", "The response header in which the server names the cursor of the next page.", "Not read by the CLI."], ["Execution", "One live run of a workflow with its own id.", "Run-control commands take the execution id."], ["Session", "A workspace grouping workflows, runs and configuration.", "Most commands start with a session id."], ["Node", "One step of a workflow.", "Node commands act on a single step of a live run."], ["Step mode", "A debugging state where a node waits and is advanced one step at a time.", "<code>workflow node step enable|next|disable<\/code>."], ["Control bus", "The server's channel for observing nodes and sending commands to them.", "The <code>controlbus<\/code> command group."], ["Heartbeat", "A signal a node emits to show it is alive.", "<code>controlbus heartbeat<\/code> prints the last one."], ["DRAIN, CANCEL, KILL", "Stop $("#vGrid").onclick=function(){view="grid";$("#vGrid").setAttribute("aria-pressed","true");$("#vList").setAttribute("aria-pressed","false");board()};
$("#statFilter").onchange=function(e){stF=e.target.value;board()};
$("#rq").oninput=function(e){rq=e.target.value.trim().toLowerCase();board()};
function openRisk(id){view="list";$("#vList").setAttribute("aria-pressed","true");$("#vGrid").setAttribute("aria-pressed","false");aOn={};attrs.forEach(function(a){aOn[a]=true});$$("#attrFilters button").forEach(function(b){b.setAttribute("aria-pressed","true")});stF="";rq="";$("#statFilter").value="";$("#rq").value="";board();
 var d=$("#r-"+id);if(d){d.open=true;d.classList.add("hl");d.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(function(){d.classList.remove("hl")},2000)}}
$("#copyBtn").onclick=function(){var md="# Yukta "+MOD+": my architecture notes\n\n";var any=false;D.risks.forEach(function(r){var n=notes[r.id];if(!n)return;any=true;md+="## "+r.t+"\n- Attribute: "+r.a+" · impact "+r.i+" · effort "+r.e+"\n"+(n.s?"- Status: "+n.s+"\n":"")+(n.n?"- Note: "+n.n.replace(/\n/g,"\n  ")+"\n":"")+"\n"});
 var msg=$("#copyMsg"),ta=$("#copyArea");if(!any){msg.textContent="Nothing to copy yet. Set a status or note first.";return}
 ta.hidden=false;ta.value=md;ta.rows=10;
 var done=function(){msg.textContent="Copied."},fail=function(){msg.textContent="Select the text below and copy it."};
 try{navigator.clipboard.writeText(md).then(done,fail)}catch(e){fail()}};
board();

/* ---- jumps ---- */
document.addEventListener("click",function(e){var r=e.target.closest("[data-risk]");if(r){e.preventDefault();openRisk(r.getAttribute("data-risk"));return}
 var c=e.target.closest("[data-comp]");if(c){e.preventDefault();pick(c.getAttribute("data-comp"));$("#map").scrollIntoView({behavior:"smooth"})}});
document.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target;if(t.matches&&t.matches("a.chip,.dot")){e.preventDefault();t.click?t.click():0}});

/* ---- prompts ---- */
if(D.prompts&&D.prompts.length){var pi=0;
 var deck=function(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
  $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}};
 deck()}
/* ---- glossary ---- */
function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
</script>
</body>
</html>
