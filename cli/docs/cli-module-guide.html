<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta cli Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>

<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>

  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
  <div class="others" id="others"></div>
</nav>
<main id="main"></main>

<script>
var DATA = {"module": "cli", "title": "How the Yukta cli works, and where it can break", "htmlTitle": "Yukta cli Guide", "date": "2026-10-15", "glance": {"lede": "The cli module builds <code>yukta<\/code>, a small command-line program written in Go. It does no workflow work itself. Every command turns your typed words into one request to a running Yukta server, then prints the answer. This page explains how that translation works, what the program guarantees, and where it quietly falls short of the server it talks to.", "props": [["Thin client", "No engine, no database, no cache, no config file. Each command is one HTTP call (or one live stream) and then the process exits. If the server is down, nothing works."], ["Hand-written mirror", "Every endpoint, path and response shape is copied by hand from the web module. Nothing generates or checks them, so the CLI can fall behind the server without any build failing."], ["Strict build", "Pinned linters, a security scanner, a vulnerability scan and a rule that every function is 100% covered by tests. Quality of the Go code is high; fit with the server is the weaker side."], ["Streams without a safety net", "Live status and logs use Server-Sent Events (a long-lived HTTP response that keeps sending lines). There is no timeout, no reconnect and no resume, only Ctrl-C."]], "start": [["primer", "Primer", "New here? Read the problem, the vocabulary and one worked example from keystroke to printed result"], ["map", "System map", "Nine components and how a command travels through them to the server and back"], ["map", "Replay a command", "Six scenarios: start with a payload, live watch, server error, slow server, create a session with apply, a release build"], ["guarantees", "Guarantees", "What the CLI promises about timeouts, retries, streaming, exit codes and what it stores"], ["reference", "Command map", "Every command with the REST endpoint it calls, and the server endpoints that have no command"], ["quality", "Stress it", "Scalability, performance, availability, security lenses, and why some barely apply"], ["board", "Challenge it", "16 open weaknesses in an impact x effort grid, including a documented command that does not exist"], ["adrs", "Decisions", "Eight design decisions, each with a 'revisit when' trigger"]]}, "primer": {"problem": "People and scripts need to drive a Yukta server without opening the web UI: start a run in a CI job, watch its progress in a terminal, pause a node while debugging, list plugins. The server already offers all of this over HTTP (REST). Typing raw <code>curl<\/code> commands with long paths and JSON bodies is slow and error-prone, and a Java client would force every machine to install a JVM. The <b>cli<\/b> module solves this with one small native program, <code>yukta<\/code>, that has no runtime to install and starts in milliseconds.", "analogy": "Think of a remote control for a television. The remote has no picture and no tuner. It only turns a button press into a signal, sends it, and shows you what the television reports back. If the television is off, or has a new feature the remote's maker never heard of, the remote can do nothing about it. That is the CLI: the buttons are commands, the signal is an HTTP request, and the television is the Yukta server.", "layersTitle": "Where the cli sits", "layers": [["You, scripts, CI jobs", "Type <code>yukta workflow start ...<\/code> in a shell or call it from a pipeline", ""], ["cli (this page)", "A Go program built with Cobra, a library for command-line trees. One request per command.", "me"], ["HTTP over the network", "JSON for normal calls, Server-Sent Events for live streams, optional bearer token", ""], ["web module (REST controllers)", "Receives the request and calls core. This is the only thing the CLI knows about.", ""], ["core and plugins", "The engine that actually runs workflows", ""]], "layersNote": "The CLI shares no code with the Java side. It is a separate Go program in the same repository, built by its own Makefile. Gradle only calls that Makefile.", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["Session", "A workspace on the server that groups workflows, runs and configuration. Almost every command names one.", "<code>yukta session list<\/code> prints session ids."], ["Workflow and execution", "A workflow is a stored graph of steps. An execution is one live run of it, with its own id. Commands that steer a run need the execution id, not the workflow id.", "Start returns an execution id; pause, status and logs all take it."], ["Node", "One step in a workflow. Node commands (pause, stop, skip, step) act on a single node of a running execution.", "<code>yukta workflow node pause s1 e42 classify<\/code>"], ["REST and the envelope", "The server answers JSON wrapped in an envelope: status, message and a <code>data<\/code> field. The CLI reads only <code>data<\/code>.", "<code>{\"status\":200,\"message\":\"...\",\"data\":{\"executionId\":\"e42\"}}<\/code>"], ["SSE (Server-Sent Events)", "A normal HTTP response that never ends. The server keeps writing lines starting with <code>data:<\/code>, one event per blank-line-separated block. Used for live status and logs.", "<code>workflow status-stream<\/code> and <code>logs<\/code>."], ["Cobra command tree", "Cobra is the Go library that turns words like <code>workflow node pause<\/code> into a function call and generates --help text. Commands nest like folders.", "root, then workflow, then node, then pause."], ["Bearer token", "A secret the CLI sends in the <code>Authorization<\/code> header. The server requires one only when its <code>yukta.api-key<\/code> setting is set.", "<code>--token<\/code> or the <code>YUKTA_TOKEN<\/code> environment variable."], ["Global flags", "Options valid on every command: <code>--url<\/code> (which server), <code>--token<\/code>, <code>--timeout<\/code> (seconds before giving up on a normal call) and <code>-o table|json<\/code>.", "<code>yukta -o json plugin list<\/code>"]], "ex": {"title": "One example, end to end", "lede": "A developer starts a workflow with an input payload, then watches it live. Click a step to see what happens, why, and what can go wrong. (The session must already exist on the server; create it first with 'yukta session apply'.)", "viewBox": "0 0 880 230", "labels": ["What happens", "Why", "Can go wrong"], "legend": "Green = user input · Blue = CLI work · Grey = output or end", "start": "parse", "nodes": [{"id": "parse", "n": "Parse command", "s": "cobra", "k": "t", "x": 10, "y": 40, "does": "The shell gives the program <code>workflow start s1 build --payload '{\"msg\":\"hi\"}'<\/code>. Cobra finds the <code>start<\/code> command, checks it received exactly two positional arguments (session id, workflow id) and stores the flags. The global flags <code>--url<\/code>, <code>--token<\/code> and <code>--timeout<\/code> are written straight into the one shared client object.", "adds": "Checking argument counts before any network call means a typo costs nothing. Binding flags directly to the client avoids a separate configuration step that could be skipped.", "wrong": "The URL default comes from <code>YUKTA_SERVER_URL<\/code> if set, else <code>http://localhost:8080<\/code>. A forgotten variable silently points the command at the wrong server."}, {"id": "payload", "n": "Check payload", "s": "--payload", "k": "p", "x": 190, "y": 40, "does": "<code>--payload<\/code> (inline text) or <code>--payload-file<\/code> (a path) is read. The two flags cannot be combined. The text must parse as a JSON object, not an array or a bare number.", "adds": "The server declares the payload as a map of names to values. Rejecting a bad payload here gives a clear local message instead of a server validation error after a network round trip.", "wrong": "With <code>--payload-file<\/code> a missing file is a plain read error, which is good. The other file-or-JSON commands (see the risks) cannot tell a mistyped path from bad JSON."}, {"id": "request", "n": "Build request", "s": "apiPath + headers", "k": "p", "x": 370, "y": 40, "does": "The client builds <code>POST /api/workflow/start<\/code> with a JSON body holding <code>sessionId<\/code>, <code>workflowId<\/code> and the payload. It adds <code>Content-Type<\/code> and <code>Accept<\/code> JSON headers and, when a token is set, <code>Authorization: Bearer ...<\/code>.", "adds": "Ids that go into a path are escaped. Without that, a node id such as <code>a/../../sessions<\/code> would silently change which endpoint is called.", "wrong": "The token is sent to whatever <code>--url<\/code> says, including plain <code>http://<\/code>, with no warning. There is also no way to send the server's <code>Idempotency-Key<\/code> header, so a timed-out start cannot be retried safely."}, {"id": "send", "n": "Send and wait", "s": "30 s limit", "k": "p", "x": 550, "y": 40, "does": "The request goes out with a time limit (default 30 seconds, <code>--timeout 0<\/code> disables). The server answers <b>202 Accepted<\/b> with an envelope containing the new execution id. Any 2xx counts as success. Any other status becomes the error text <code>API error: status N: body<\/code>.", "adds": "The limit covers connecting, waiting and reading the whole body. Without it a hung server would hang the shell or CI job forever.", "wrong": "No retries, ever. A 429 (server at its run limit) or a network blip is reported once and the command exits with status 1. The raw error body is shown, not parsed."}, {"id": "result", "n": "Print result", "s": "table or json", "k": "e", "x": 730, "y": 40, "does": "The CLI decodes the <code>data<\/code> field and prints <code>Workflow started with execution ID: e42<\/code>, or the same data as indented JSON when <code>-o json<\/code> is set.", "adds": "JSON output lets a script capture the id (<code>jq -r .executionId<\/code>) and feed it to the next command.", "wrong": "The server's response shape is copied by hand into a Go struct. If the server renames <code>executionId<\/code>, the CLI prints an empty id and still exits 0."}, {"id": "open", "n": "Open stream", "s": "status-stream", "k": "p", "x": 370, "y": 150, "does": "<code>yukta workflow status-stream s1 e42<\/code> opens <code>GET /api/workflow/s1/status/e42/stream?includeHistory=false<\/code> asking for <code>text/event-stream<\/code>. It checks the response really has that content type before reading.", "adds": "No timeout is applied, because a stream may legitimately stay open for hours. Ctrl-C and SIGTERM are wired to cancel the request cleanly.", "wrong": "The CLI sends <code>includeHistory=false<\/code> by default, while the server's own default is true. Events that happened before you connected are not replayed unless you pass <code>--include-history<\/code>."}, {"id": "events", "n": "Read events", "s": "ScanSSE", "k": "p", "x": 550, "y": 150, "does": "A small scanner reads line by line (up to 1 MB per line). Lines starting <code>data:<\/code> are collected, and a blank line ends one event. Each event is decoded as a progress snapshot and printed as indented JSON. The server's 15-second <code>: ping<\/code> comments are ignored.", "adds": "Writing the scanner by hand keeps the dependency list to Cobra only. A fuzz test feeds it random input so a bad stream cannot crash it.", "wrong": "An event not followed by a blank line at the end of the connection is dropped. If the connection simply closes, the command ends with exit 0, which looks like success even when the network failed."}, {"id": "end", "n": "Ctrl-C or end", "s": "exit", "k": "e", "x": 730, "y": 150, "does": "When you press Ctrl-C the request is cancelled and the command returns without an error, exit status 0. If the server finishes the stream, the command ends the same way.", "adds": "Treating Ctrl-C as a normal end is what a 'watch' command should do: the user asked to stop watching, nothing failed.", "wrong": "There is no reconnect and the <code>Last-Event-ID<\/code> header is never sent. A dropped connection means you re-run the command and may see events twice or miss some."}], "edges": [["parse", "payload"], ["payload", "request"], ["request", "send"], ["send", "result"], ["result", "open"], ["open", "events"], ["events", "end"]], "json": {"title": "The two requests on the wire", "note": "Simplified from the code. The envelope fields other than data are not read by the CLI.", "text": "POST /api/workflow/start\nAuthorization: Bearer <token, only if set>\nContent-Type: application/json\n{ \"sessionId\": \"s1\", \"workflowId\": \"build\", \"payload\": { \"msg\": \"hi\" } }\n\n-> 202  { \"status\": 202, \"message\": \"Workflow start accepted\",\n          \"data\": { \"executionId\": \"e42\" } }\n\nGET /api/workflow/s1/status/e42/stream?includeHistory=false\nAccept: text/event-stream\n\n-> 200 text/event-stream\n   id: 0\n   data: { \"executionId\": \"e42\", \"status\": \"RUNNING\", ... }\n\n   : ping"}}, "story": {"title": "A command in plain words", "steps": [["Type", "You type a command. Cobra matches the words to a function and checks the arguments."], ["Configure", "Global flags and environment variables fill in the server address, token and time limit on one shared client."], ["Build", "The client builds the path, escaping every id, and attaches JSON and token headers."], ["Send", "One HTTP request goes out with a time limit. There is no retry."], ["Judge", "Any answer outside 200-299 becomes an error message that contains the status and the raw body."], ["Decode", "The CLI reads only the data field of the answer into a hand-written Go type."], ["Print", "A table or JSON goes to standard output, errors go to standard error, and the exit code is 0 or 1."]]}, "paths": [["New to the module", "Primer, then Map and the 'Start a run' scenario, then the Command map reference.", "primer"], ["Reviewing for gaps", "Challenge it first: paging, stop modes, idempotency. Then the endpoints with no command in the reference.", "board"], ["Changing the build or releases", "Map (Build and quality), Guarantees (what check enforces), and the decisions about the Makefile and static binaries.", "adrs"]]}, "plain": {"entry": ["The program's front door. It creates one HTTP client, builds the tree of commands, and runs it. If anything fails it prints one line and exits with status 1.", "A tool needs a single place where everything is wired, so every command shares the same client and the same settings."], "root": ["The top-level command and the options that work everywhere: server address, token, timeout and output style.", "Every command needs the same four settings. Defining them once on the root means no command can forget one."], "cmds": ["The five command groups (session, workflow, plugin, controlbus, logs) and the helpers that build them: one generic builder for 'call and print a message' commands, and helpers that read a JSON argument from text or a file.", "About forty commands would otherwise repeat the same dozen lines. A shared builder keeps them short and equal in behaviour."], "out": ["Prints tables or indented JSON to the terminal.", "Humans want aligned columns; scripts want JSON. One small printer keeps both consistent."], "http": ["The part that actually talks HTTP: builds the request, adds headers and the token, applies the time limit, and turns any non-2xx answer into an error.", "Without one choke point, every command would invent its own timeout, error text and header handling."], "res": ["Plain Go functions, one per server endpoint, plus the small types that describe the answers (execution id, progress, plugin summary).", "Commands should say 'start this workflow', not 'build this URL'. These functions also validate that ids are not empty."], "sse": ["Reads a live stream of events: checks the content type, scans lines, joins them into events and hands each one to a callback. Stops on Ctrl-C.", "Live status and logs cannot use the normal request path: it would cut them off at the time limit, and the answer never 'finishes'."], "build": ["The Makefile and Gradle wrapper that compile the program for five platforms and run formatting, linting, security, vulnerability and coverage checks. A release workflow publishes the binaries with checksums.", "A CLI is only useful if people can get a trustworthy binary for their machine. Pinned tools make the same commit produce the same result."], "tests": ["Tests that run each command against a throwaway local HTTP server, plus a fuzz test for the stream scanner and a rule that every function must be fully covered.", "The CLI has no real server in its own tests, so fake-but-real HTTP is the cheapest way to prove commands call the right path and print the right thing."]}, "comps": [{"id": "entry", "name": "Entry & Wiring", "tag": "main, one client, 5 groups", "c": 0, "r": 0, "resp": "Starts the program: creates one HTTP client, builds the root command, attaches the five command groups and runs Cobra. Any returned error is printed as <code>error: ...<\/code> on standard error and the process exits with status 1.", "how": ["<code>main<\/code> calls a single <code>Run<\/code> function. It creates exactly one client object and passes that same object to every command group (plugin, controlbus, logs, workflow, session). Sharing one object is what lets the global flags work: the root command writes <code>--url<\/code>, <code>--token<\/code> and <code>--timeout<\/code> into the client's fields, and every command later reads the same fields.", "The client is created before the flags are read, but with fields the flag parser fills in. An earlier design replaced the server address in a pre-run hook; the current one binds the flags directly, so there is no moment where a command could see the wrong address.", "Registration is manual: each group is added with an explicit call. That is simple, but it means a command can be written, tested and documented yet never reach the user. This happened with <code>session apply<\/code>, which was built and unit-tested but not registered; it is registered now, and nothing tests the command tree as a whole, so the same can happen again.", "Cobra prints its own <code>Error: ...<\/code> and the usage text for any error, and then <code>main<\/code> prints <code>error: ...<\/code> again. A failed command therefore shows the message twice with a block of help text between.", "The exit code is only ever 0 or 1. A 404, a timeout and a bad flag all look the same to a calling script."], "guar": "Every command shares one client. Any error ends the process with status 1 after a message on standard error.", "state": "Nothing is held after the process exits. There is no config file, history or cache.", "ceil": "Not applicable: one short-lived process per command.", "fail": "A failed command prints the message twice and exits 1. A panic would print a Go stack trace and exit 2; none is known.", "set": ["yukta (binary name)", "exit status 0 or 1"], "risks": ["errorNoise", "noVersion"]}, {"id": "root", "name": "Root & Global Flags", "tag": "url, token, timeout, -o", "c": 0, "r": 1, "resp": "Defines the top-level <code>yukta<\/code> command and the four options every command inherits, and applies the defaults.", "how": ["<code>--url<\/code> defaults to the <code>YUKTA_SERVER_URL<\/code> environment variable, or <code>http://localhost:8080<\/code> when that is unset. The flag always wins over the variable. The default is read when the command tree is built, which is why a test or a script must set the variable before the program starts.", "<code>--token<\/code> defaults to <code>YUKTA_TOKEN<\/code>. It is sent as <code>Authorization: Bearer ...<\/code> on normal requests and on streams. The server accepts it only when <code>yukta.api-key<\/code> is configured; otherwise the server ignores it. Passing the secret as a flag puts it in shell history and in the process list (visible to other users on the machine), so the environment variable is the safer way in our view.", "<code>--timeout<\/code> defaults to 30 seconds and applies only to normal calls. <code>0<\/code> turns it off. Streams ignore it on purpose, because a status stream may run for hours.", "<code>-o<\/code> / <code>--output<\/code> is <code>table<\/code> by default or <code>json<\/code>. The value is held in a package-level variable that commands read through a getter. Nothing validates it: <code>-o yaml<\/code> is accepted and treated as table by most commands, and only <code>session get<\/code> rejects it.", "The root command's short description still reads 'Code quality gates for AI-driven development'. That describes one use of Yukta, not the product, so <code>yukta --help<\/code> misdescribes it."], "guar": "Flag values reach the client before any command body runs. The flag always overrides the environment variable.", "state": "None. Defaults come from two environment variables read at start-up.", "ceil": "No ceiling. The only shared mutable state is the output-format variable, which is why tests that change it must reset it.", "fail": "A bad duration such as <code>--timeout abc<\/code> is rejected by Cobra before anything runs.", "set": ["--url / YUKTA_SERVER_URL (default http://localhost:8080)", "--token / YUKTA_TOKEN", "--timeout (default 30s, 0 = off)", "-o, --output table|json (default table)"], "risks": ["tokenPlain", "outputUneven"]}, {"id": "cmds", "name": "Command Builders", "tag": "Cobra groups, Action helper", "c": 1, "r": 0, "resp": "Declares every command, its arguments and flags, calls the matching client function and chooses how to print the result.", "how": ["There are five groups. <code>session<\/code> (list, get, summaries, workflow get/graph/executions), <code>workflow<\/code> (start, stop, pause, resume, status, status-stream, history, executions stop/restart, node pause/resume/stop/skip, node step enable/disable/next), <code>plugin<\/code> (list, get), <code>controlbus<\/code> (nodes, all-nodes, heartbeat, command) and <code>logs<\/code>. Group names follow the server's resources, so someone who knows the REST API can guess the command.", "Most 'do something to this id' commands are built by one generic helper, <code>Action<\/code>. A command supplies its usage text, how many arguments it takes, the client call to make and a one-line success message. The helper adds the 'if <code>-o json<\/code> print the raw answer, else print the message' behaviour. This replaced about a dozen near-identical files and means pause, resume, step and stop all behave the same way.", "Commands that take JSON (<code>controlbus command<\/code> and <code>session apply<\/code>) accept either a file path or inline JSON. The code checks whether a file with that name exists; if so it reads it, otherwise it treats the argument itself as JSON. Example: <code>yukta controlbus command wf1 node1 cmd.jsno<\/code> (typo) does not say 'file not found'. It says 'invalid JSON', because the typo was parsed as JSON text.", "<code>workflow start<\/code> takes <code>--payload<\/code> or <code>--payload-file<\/code>. They exclude each other, and the content must be a JSON object. <code>workflow stop<\/code> takes no options and always sends the default stop mode, so the server's <code>?mode=DRAIN|CANCEL|KILL<\/code> choice is unreachable. <code>workflow node stop<\/code> has <code>--immediate<\/code> and <code>--reason<\/code>, but it always sends <code>reason=<\/code>, even when empty, which replaces the server's default reason text.", "None of the list commands accept <code>--limit<\/code> or a cursor. The server returns at most 500 items per page by default (1,000 at most) and announces a next page in an <code>X-Next-Cursor<\/code> header, which the CLI never reads. An installation with more than 500 sessions is silently shown only the first 500."], "guar": "Argument counts are checked before any request is sent, and every id is a required positional argument. Payload and JSON arguments are parsed locally before sending.", "state": "None. The only shared variable is the chosen output format.", "ceil": "About forty commands across five groups. Each new server endpoint needs a hand-written command, which does not scale as the API grows.", "fail": "A bad argument count or invalid JSON stops the command before any network call, and exits 1.", "set": ["yukta session list|get|summaries", "yukta session workflow get|graph|executions", "yukta workflow start|stop|pause|resume|status|status-stream|history", "yukta workflow node ...", "yukta workflow executions stop|restart", "yukta plugin list|get", "yukta controlbus nodes|all-nodes|heartbeat|command", "yukta logs [--entries]"], "risks": ["stopMode", "noPaging", "missingCmds", "fileOrJson", "idemKey", "emptyReason", "outputUneven", "keywordProblems"]}, {"id": "out", "name": "Output Formatter", "tag": "table or JSON to stdout", "c": 1, "r": 1, "resp": "Prints aligned tables and indented JSON, and writes errors to standard error.", "how": ["A table is written with Go's tab writer: columns are padded by two spaces. A header row comes first. This is for people reading a terminal.", "JSON output is indented by two spaces and written to standard output, so it can be piped to <code>jq<\/code>. Encoding errors go to standard error and do not stop the program.", "Which output a command gives is decided by the command, not by this component, and the choices are uneven. <code>session list<\/code>, <code>plugin list<\/code>, <code>controlbus nodes<\/code> print real tables. <code>workflow status<\/code> and <code>history<\/code> print plain text lines instead of a table. <code>session summaries<\/code>, <code>session workflow graph<\/code>, <code>session workflow executions<\/code> and <code>session workflow get<\/code> always print JSON whatever <code>-o<\/code> says. <code>workflow status-stream<\/code> always prints one indented JSON object per event. <code>logs<\/code> prints each line as the server sent it.", "<code>controlbus heartbeat<\/code> in table mode walks a Go map, so its rows come out in random order from run to run. <code>controlbus command<\/code> sorts its keys first."], "guar": "Data goes to standard output and errors to standard error, so piping JSON into another tool is safe.", "state": "None.", "ceil": "Whole results are held in memory and printed at the end (except streams), which is fine for hundreds of rows.", "fail": "A JSON encoding failure prints a line to standard error and the command still exits 0.", "set": ["-o table|json"], "risks": ["outputUneven"]}, {"id": "http", "name": "HTTP Client Core", "tag": "headers, timeout, errors", "c": 2, "r": 0, "resp": "Builds every request and turns the server's answer into either bytes or an error. All resource functions and streams go through it.", "how": ["Every request carries <code>Content-Type: application/json<\/code> and <code>Accept: application/json<\/code>, plus the bearer token when one is set. The path must start with <code>/<\/code>. The address is joined from the base URL (trailing slashes removed) and the path.", "Normal calls get a time limit: the request context is wrapped with the <code>--timeout<\/code> value, and the limit stays active until the whole body has been read. So a server that answers headers quickly but trickles the body is also cut off. The underlying Go HTTP client has no timeout of its own, deliberately, so that streams are not cut.", "Any status outside 200-299 returns the error text <code>API error: status 404: {body}<\/code>, with the server's raw JSON error body included as-is. The CLI does not parse the error envelope (message, error, path), so the user sees JSON text inside an error line. The server's 202 for a start is accepted because it is a 2xx.", "Path pieces are escaped with Go's path-escape function through one helper, <code>apiPath<\/code>. Example: node id <code>a/b<\/code> becomes <code>a%2Fb<\/code>, so it stays one path segment and cannot be used to reach a different endpoint. Query values are built separately with the standard query encoder.", "There are no retries, no connection reuse tuning, no proxy settings beyond Go's defaults (the standard <code>HTTP_PROXY<\/code> variables are honoured by Go's default transport), no TLS options (no way to trust a private CA other than the system store) and no redirect policy beyond Go's default."], "guar": "Every id in a path is escaped. A normal call never waits longer than the timeout (0 disables). A non-2xx answer is always an error that contains the status and body.", "state": "No state beyond the three settings on the client (base URL, token, timeout).", "ceil": "One request at a time per command. No pooling concerns for a short-lived process.", "fail": "Network and timeout errors read <code>request failed: ...<\/code>. A server error reads <code>API error: status N: body<\/code>. Neither is retried.", "set": ["--url", "--token", "--timeout", "standard HTTP_PROXY / HTTPS_PROXY / NO_PROXY"], "risks": ["tokenPlain", "noRetry", "errorNoise", "idemKey"]}, {"id": "res", "name": "Resource Clients", "tag": "one function per endpoint", "c": 2, "r": 1, "resp": "One Go function per server endpoint (sessions, workflows and executions, plugins, control bus, logs), each with hand-written types for the answers.", "how": ["Each function checks its ids are not empty, builds the path, sends the request and decodes only the <code>data<\/code> field of the envelope into a Go type. Example types: <code>WorkflowStartResponse{executionId}<\/code>, <code>WorkflowProgress{executionId, status, tasks[]}<\/code>, <code>PluginDetails<\/code>.", "Some answers are typed (workflow start, progress, history, plugins). Others are left as <code>map[string]any<\/code> or <code>any<\/code> (session details, workflow definition, graph, summaries, heartbeat, command reply). The loosely typed ones cannot drift in a way that breaks, but they also give no help to someone reading the code.", "The CLI calls the server's older, session-qualified paths for most run control: <code>/api/workflow/{sessionId}/{executionId}/pause<\/code>, <code>/api/workflow/{sessionId}/status/{executionId}<\/code> and the node paths. The server marks these as deprecated and offers shorter equivalents such as <code>/api/executions/{executionId}/pause<\/code>. The older paths have one advantage: with a session in the path the server also checks that the run belongs to that session, so one session's id cannot steer another session's run.", "The decoding step treats a missing or renamed field as an empty value rather than an error. If the server renamed <code>executionId<\/code>, <code>workflow start<\/code> would print an empty id and exit 0.", "No test compares these types or paths to the server's real API description (the OpenAPI document at <code>/v3/api-docs<\/code>). They are checked only against fake servers written by the same author, so a wrong assumption would be repeated in both places."], "guar": "A call with an empty id fails locally with a clear message, and the response is decoded or an error returned. It never returns half-decoded data.", "state": "None.", "ceil": "Roughly 30 hand-written endpoint functions. Server changes need matching manual edits.", "fail": "A body that is not valid JSON gives <code>failed to unmarshal response<\/code>. A valid body with different field names decodes to empty values.", "set": ["/api/sessions...", "/api/workflow/...", "/api/plugins", "/api/control/...", "/api/sessions/{sid}/executions/{eid}/logs"], "risks": ["dtoDrift", "legacyPaths", "missingCmds", "noPaging", "localTimestamps"]}, {"id": "sse", "name": "SSE Streaming", "tag": "status and log streams", "c": 2, "r": 2, "resp": "Opens long-lived event streams for execution status and logs, and reads them until the user stops or the server ends them.", "how": ["A stream request sends <code>Accept: text/event-stream<\/code> and the same bearer token. A non-2xx status is read and reported like a normal error. A 2xx answer must have media type <code>text/event-stream<\/code>, otherwise the stream is refused. The time limit does not apply, so only Ctrl-C, SIGTERM or the server can end it.", "The scanner reads lines with a buffer that grows to 1 MB. A line longer than that stops the stream with an error. <code>data:<\/code> lines in the same event are joined with newlines; a blank line fires the event. <code>event:<\/code> is remembered but never used. <code>id:<\/code>, <code>retry:<\/code> and comment lines (the server's <code>: ping<\/code> keep-alive every 15 seconds) are ignored.", "There is no reconnect. The server supports <code>Last-Event-ID<\/code> (event ids count from 0 per stream, and a reconnecting client with that header skips what it already saw), but the CLI never sends it. A dropped connection ends the command. If the network closes cleanly, the command ends with exit 0, which cannot be told apart from 'the execution finished'.", "Status updates are decoded as progress snapshots and each is printed as indented JSON. Log streams print each event's data as one line. <code>logs --entries<\/code> reads the structured variant. By the server's design these end when the execution reaches a final state.", "A fuzz test feeds random bytes to the scanner to prove it never panics. Plain <code>go test<\/code> runs only its saved examples; the random exploration needs <code>go test -fuzz<\/code>, which nothing in the build runs."], "guar": "Ctrl-C ends a stream cleanly with status 0. A stream of the wrong content type is never read. Event text is passed through unmodified.", "state": "None. The last event id is never stored, so resuming is not possible.", "ceil": "One connection per command. A single event larger than 1 MB (for example a progress snapshot with very large node metadata) ends the stream with an error.", "fail": "A malformed progress event ends the stream with <code>failed to unmarshal progress<\/code>. A server that stops sending but keeps the connection open is not detected, apart from the server's own pings, which the CLI does not watch for.", "set": ["workflow status-stream [--include-history]", "logs [--entries]"], "risks": ["streamLoose", "missingCmds", "keywordProblems"]}, {"id": "build", "name": "Build & Quality", "tag": "Makefile, Gradle, release", "c": 0, "r": 2, "resp": "Compiles the program for five platforms and runs all quality checks. The Makefile holds the real logic; Gradle only calls it so the JVM build can include the CLI.", "how": ["<code>make build<\/code> produces one static binary (<code>CGO_ENABLED=0<\/code>, symbols stripped) named <code>build/yukta-&lt;os&gt;-&lt;arch&gt;<\/code>, with <code>.exe<\/code> added on Windows. <code>make build-all<\/code> builds linux/amd64, linux/arm64, darwin/amd64, darwin/arm64 and windows/amd64. Static means one file with nothing to install.", "Tools are pinned by version and run with <code>go run pkg@version<\/code>: golangci-lint v2.14.0 (standard linters plus gocritic and revive), gosec v2.29.0 (security patterns) and govulncheck v1.8.0 (known-vulnerable dependencies and standard library). Pinning means the same commit gives the same result next month. The cost is a download on first use.", "<code>make cover-check<\/code> always runs the tests afresh and then fails if any single function is below 100% coverage. Exceptions: <code>cmd/yukta/main.go<\/code>, <code>internal/testutil/testutil.go<\/code> and <code>test/integration_test.go<\/code> are exempt (0%). Per-function is stricter than a project average: a new untested function cannot hide behind well-tested ones.", "<code>build.gradle.kts<\/code> is a 48-line wrapper: each Gradle task such as <code>goBuild<\/code>, <code>goLint<\/code> or <code>goTest<\/code> runs one Make target and shows its output. The Gradle <code>check<\/code> task runs all of them. Because it runs both <code>goTest<\/code> and the coverage check (which itself runs the tests), the tests run twice.", "Windows developers need <code>make<\/code> and a POSIX shell (the Makefile uses shell, awk and grep), for example through WSL or Git Bash. The produced Windows binary itself needs nothing.", "On a version tag, the release workflow runs <code>make build-all<\/code>, writes <code>SHA256SUMS<\/code>, attaches a signed build-provenance attestation (a record proving which commit and workflow produced the files) and publishes a GitHub release. CI and release read the Go version from <code>go.mod<\/code>. The binary has no version command, and the build embeds no version string."], "guar": "Tool versions are pinned. Coverage is regenerated on every check. Release binaries come with checksums and a provenance record.", "state": "Build output goes to <code>cli/build/<\/code>; <code>coverage.out<\/code> is a generated file. Nothing else persists.", "ceil": "Tests run twice in <code>check<\/code>. Tools are downloaded on first use, so a clean machine needs network access to the Go module proxy.", "fail": "Any failing step stops <code>make check<\/code>. A missing <code>make<\/code> on Windows stops the Gradle tasks before Go is even called.", "set": ["make build | build-all | test | cover | cover-check | fmt | vet | lint | sec | vuln | check", "./gradlew :cli:goBuild | goBuildAll | goTest | check", "GOOS= / GOARCH= overrides", "go.mod: go 1.26, toolchain go1.27.2"], "risks": ["noVersion", "winBuild", "testsTwice", "docsStale"]}, {"id": "tests", "name": "Test Harness", "tag": "httptest, capture, fuzz", "c": 1, "r": 2, "resp": "Lets every command and client function be tested end to end against a real local HTTP server without a real Yukta.", "how": ["A helper starts a throwaway local server that returns a fixed status and body and records each request's method and path-with-query. A test builds the real command, runs it with a list of arguments and checks both what was sent (<code>POST /api/workflow/s1/e1/pause<\/code>) and what was printed.", "Printing is checked by swapping standard output for a pipe during the call and reading it back. Streams use another helper that serves a fixed block of event text with the right content type.", "Earlier versions had a 612-line hand-written fake client behind several interfaces. It was deleted: fakes tested the fake. Real HTTP exercises the escaping, headers and error handling for free.", "The file called <code>test/integration_test.go<\/code> is not an integration test in the usual sense. It never contacts a server; it checks how the client is constructed (default URL, trailing slash trimming, header setup). Nothing in the repository runs the CLI against a real Yukta server, so the paths and shapes in <code>res<\/code> are never checked against the actual controllers.", "Because the output-format setting is a shared variable, tests that change it must restore it, or later tests in the same package see the wrong format."], "guar": "Every function except the three exempt files is fully covered. The paths a command calls are asserted exactly.", "state": "Each test starts its own server and cleans it up.", "ceil": "Test code is about three times the size of main code (the improvements note gives about 8.0k test lines against 2.9k main lines).", "fail": "A test that leaves the output variable changed can break unrelated tests. The fake server returns whatever the test says, so a wrong assumption about the server passes.", "set": ["go test ./...", "make cover-check", "go test -fuzz FuzzScanSSE (manual)"], "risks": ["dtoDrift", "testsTwice"]}], "mapLegend": "Solid arrows = the command path. Dashed arrows = configuration, build and test relationships.", "edges": [["entry", "root", "ctrl", "builds"], ["entry", "cmds", "data", "registers"], ["root", "http", "ctrl", "binds flags"], ["root", "out", "ctrl", "-o value"], ["cmds", "res", "data", "calls"], ["cmds", "sse", "data", "streams"], ["res", "http", "data", "sends"], ["sse", "http", "data", "opens"], ["cmds", "out", "data", "prints"], ["build", "entry", "ctrl", "compiles"], ["tests", "cmds", "ctrl", "exercises"], ["tests", "http", "ctrl", "fake server"]], "scen": [{"id": "start", "name": "Start a run with a payload", "steps": [{"t": "Typed command", "d": "The user runs <code>yukta workflow start s1 build --payload '{\"msg\":\"hi\"}'<\/code>. Cobra matches the command and checks it got two positional arguments before anything else happens.", "c": ["entry", "cmds"], "r": []}, {"t": "Flags reach the client", "d": "<code>--url<\/code>, <code>--token<\/code> and <code>--timeout<\/code> (or their defaults from the environment) were written into the shared client while the flags were parsed. No command needs to look them up.", "c": ["root"], "r": ["tokenPlain"]}, {"t": "Payload is validated locally", "d": "The payload text must be a JSON object. A mistake such as a trailing comma is reported before any request is sent, which saves a round trip and gives a message about the user's text rather than the server's.", "c": ["cmds"], "r": ["fileOrJson"]}, {"t": "One request, one answer", "d": "The client sends <code>POST /api/workflow/start<\/code> with a 30-second limit. The server replies 202 with an execution id. The CLI cannot send an <code>Idempotency-Key<\/code>, so if this call timed out, running it again could start a second run.", "c": ["res", "http"], "r": ["idemKey", "noRetry"]}, {"t": "Print", "d": "<code>Workflow started with execution ID: e42<\/code> is printed, or JSON with <code>-o json<\/code>. A script can then pass the id to <code>status<\/code> or <code>logs<\/code>.", "c": ["out"], "r": ["dtoDrift"]}]}, {"id": "watch", "name": "Watch a run live", "steps": [{"t": "Open the stream", "d": "<code>yukta workflow status-stream s1 e42<\/code> asks for an event stream. The stream path is built with escaped ids and the same bearer token. The CLI sends <code>includeHistory=false<\/code> unless told otherwise.", "c": ["cmds", "sse"], "r": ["streamLoose"]}, {"t": "No time limit", "d": "The stream bypasses the normal timeout. If it did not, a long run would be cut off after 30 seconds. The content type is checked first: a proxy returning an HTML login page with status 200 is rejected instead of being parsed as events.", "c": ["sse", "http"], "r": []}, {"t": "Events arrive", "d": "The server sends a snapshot whenever progress changes, plus a <code>: ping<\/code> comment every 15 seconds so proxies do not close an idle connection. The scanner joins lines into events and prints each snapshot as JSON.", "c": ["sse", "out"], "r": ["outputUneven"]}, {"t": "Ctrl-C", "d": "Ctrl-C cancels the request. The scanner returns a 'cancelled' error, which the command deliberately treats as a clean finish, exit 0. The user asked to stop watching, so that is not a failure.", "c": ["entry", "sse"], "r": []}, {"t": "Connection drops instead", "d": "If the network breaks, the stream ends. A clean close gives exit 0; a reset gives an error. The CLI does not reconnect and does not send <code>Last-Event-ID<\/code>, so nothing resumes.", "c": ["sse"], "r": ["streamLoose"]}]}, {"id": "error", "name": "The server says no", "steps": [{"t": "A refusal comes back", "d": "The user runs <code>yukta workflow start s1 build<\/code> and the server is at its run limit. It answers 429 with a JSON error body.", "c": ["http"], "r": []}, {"t": "Turned into an error", "d": "Any status outside 200-299 becomes <code>API error: status 429: {body}<\/code>. The CLI does not read the body's message field, so the user sees raw JSON inside a sentence.", "c": ["http"], "r": ["errorNoise"]}, {"t": "No retry", "d": "A 429 means 'try again soon', and a pipeline could do that, but the CLI gives up at once. The wrapper script must implement its own retry loop and cannot tell 429 from 404 because the exit code is 1 either way.", "c": ["http", "entry"], "r": ["noRetry", "errorNoise"]}, {"t": "Printed twice", "d": "Cobra prints <code>Error: ...<\/code> followed by the full usage text. Then <code>main<\/code> prints <code>error: ...<\/code> again. The one useful line is repeated and wrapped in help text, so it is easy to miss in CI logs.", "c": ["entry"], "r": ["errorNoise"]}, {"t": "The 401 variant", "d": "If the server has <code>yukta.api-key<\/code> set and no token was given, every call returns 401 with <code>WWW-Authenticate: Bearer<\/code>. The CLI reports the same generic <code>API error: status 401<\/code>, with no hint to set <code>YUKTA_TOKEN<\/code>.", "c": ["root", "http"], "r": ["tokenPlain"]}]}, {"id": "slow", "name": "Slow or unreachable server", "steps": [{"t": "Server does not answer", "d": "The server host is down or a firewall silently drops packets. A normal call has a 30-second limit started when the request is created, so the command fails after 30 seconds instead of hanging forever.", "c": ["http"], "r": []}, {"t": "Refused instantly", "d": "If the port is closed, Go reports <code>connection refused<\/code> straight away. The message is <code>request failed: ...<\/code> and exit 1.", "c": ["http", "entry"], "r": ["errorNoise"]}, {"t": "Slow body", "d": "The limit also covers reading the body, so a server that sends headers and then trickles data is cut off too. A very large legitimate answer might exceed 30 seconds and need <code>--timeout 120s<\/code> or <code>0<\/code>.", "c": ["http"], "r": []}, {"t": "Streams are exempt", "d": "A stream has no limit, so a server that accepts the connection and then goes silent leaves <code>yukta logs<\/code> waiting forever. The server's 15-second pings exist for proxies; the CLI does not watch for them.", "c": ["sse"], "r": ["streamLoose"]}, {"t": "Ambiguous start", "d": "If a <code>workflow start<\/code> times out, the run may or may not have started. Without an idempotency key the user cannot safely repeat it. They must check <code>workflow history<\/code> first, which is capped at the server's first page.", "c": ["res", "cmds"], "r": ["idemKey", "noPaging"]}]}, {"id": "apply", "name": "Create a session with apply", "steps": [{"t": "Docs promise it", "d": "The README shows <code>yukta session apply session.json<\/code> and the help text of <code>yukta session<\/code> says 'Apply session configurations'. A developer types it.", "c": ["cmds"], "r": ["docsStale"]}, {"t": "It is registered now", "d": "The session group registers list, get, apply, workflow and summaries. <code>apply<\/code> reads a file or inline JSON, validates it, posts to <code>POST /api/sessions<\/code> and has its own local <code>-o<\/code> flag. Until the fix, the session group never registered it and Cobra reported an unknown command, even though its own tests passed.", "c": ["cmds", "entry"], "r": []}, {"t": "No test over the tree", "d": "Its unit tests build the command directly, so they cannot tell whether the group lists it. A test that asked 'does <code>yukta session --help<\/code> list apply?' would catch the next command that is written but not registered.", "c": ["tests"], "r": ["docsStale"]}, {"t": "Typos and flags", "d": "A mistyped file name is parsed as JSON and reports 'invalid JSON', and the local <code>-o<\/code> flag shadows the global one.", "c": ["cmds"], "r": ["fileOrJson", "outputUneven"]}, {"t": "Before applying", "d": "There is still no command for <code>POST /api/sessions/validate<\/code>, so a CI job cannot check a definition without saving it.", "c": ["http"], "r": ["missingCmds"]}]}, {"id": "release", "name": "From commit to released binary", "steps": [{"t": "Local check", "d": "A developer runs <code>./gradlew :cli:check<\/code>. Gradle calls Make for format check, module verify, vet, lint, security scan, vulnerability scan, tests and coverage. Tests run twice because both the test task and the coverage task run them.", "c": ["build", "tests"], "r": ["testsTwice"]}, {"t": "Pinned tools", "d": "golangci-lint, gosec and govulncheck run at fixed versions through <code>go run pkg@version<\/code>. The same commit gives the same verdict. Pinning previously exposed 32 unchecked errors and 5 security findings that unpinned runs had hidden.", "c": ["build"], "r": []}, {"t": "Coverage gate", "d": "Each function must be 100% covered, except three exempt files. Adding an untested helper fails the build at once. It still cannot detect an unregistered command, since coverage measures lines run, not features reachable.", "c": ["build", "tests"], "r": []}, {"t": "Tag and release", "d": "A version tag starts the release workflow. It builds five binaries, writes <code>SHA256SUMS<\/code>, records build provenance and publishes them. Names look like <code>yukta-linux-amd64<\/code> and <code>yukta-windows-amd64.exe<\/code>.", "c": ["build"], "r": ["docsStale"]}, {"t": "Which version is this?", "d": "A user with an old binary cannot ask it. There is no <code>version<\/code> command and no version string embedded at build time, so bug reports cannot name a release.", "c": ["entry", "build"], "r": ["noVersion"]}]}], "intro": {"start": "One request path from keystroke to printed result, including where an idempotency key would matter.", "watch": "How live status streams work, why they have no time limit, and what Ctrl-C and a dropped connection do.", "error": "What the user sees when the server refuses a call, and why scripts cannot tell failures apart.", "slow": "Time limits, what they cover, and the two places they do not (streams and ambiguous starts).", "apply": "A real gap: a documented, tested command that users cannot run, and why no check caught it.", "release": "How the build proves quality, what it cannot prove, and how binaries reach users."}, "capsLede": "What the program can do today, grouped by area. 'Limit' names the practical edge of each.", "caps": [["Sessions", "List sessions", "Prints session ids from the server.", "<code>session list<\/code> calls GET /api/sessions.", "Alphabetical ids as the server returns them.", "Only the first page (500 by default); no --limit or cursor."], ["Sessions", "Session details and summaries", "One session's id and workflow ids, or lean summaries of all sessions.", "<code>session get<\/code>, <code>session summaries<\/code>.", "Summaries always print JSON.", "No paging; get prints table or JSON, summaries ignores -o."], ["Sessions", "Workflow definition, graph, executions", "Read a stored workflow, its node and edge graph, and its past runs.", "<code>session workflow get|graph|executions<\/code>.", "Printed as JSON whatever -o says.", "Executions list is the server's first page only."], ["Runs", "Start a run", "Starts an execution, optionally with an input payload.", "<code>workflow start<\/code> with --payload or --payload-file.", "Payload must be a JSON object; checked locally.", "No Idempotency-Key, so a timed-out start cannot be safely repeated."], ["Runs", "Stop, pause, resume a run", "Steer one execution or stop all runs of a workflow.", "<code>workflow stop|pause|resume<\/code>, <code>workflow executions stop<\/code>.", "Prints the affected execution ids.", "<code>workflow stop<\/code> cannot choose DRAIN, CANCEL or KILL."], ["Runs", "Restart", "Re-run an execution from the start or from a node.", "<code>workflow executions restart &lt;eid&gt; [node]<\/code>.", "Returns the new execution id.", "Needs the server's checkpoints for from-node restarts."], ["Runs", "Status and history", "A snapshot of one run, or the runs of a session.", "<code>workflow status<\/code>, <code>workflow history<\/code>.", "Plain text or JSON.", "History is the first page; status table shows no per-task rows."], ["Nodes", "Pause, resume, stop, skip a node", "Act on one node of a live run.", "<code>workflow node pause|resume|stop|skip<\/code>, stop has --immediate and --reason.", "Each prints a one-line confirmation.", "The server notes that skip is currently rejected for running executions."], ["Nodes", "Step-through debugging", "Make a node pause so you can advance it one step at a time.", "<code>workflow node step enable|disable|next<\/code>.", "Same confirmation style.", "No breakpoint commands (server has them)."], ["Live", "Live status stream", "Watch a run's progress as it happens.", "<code>workflow status-stream<\/code> over SSE.", "Ctrl-C ends cleanly with exit 0.", "No reconnect or resume; history off by default."], ["Live", "Execution logs", "Stream log lines or structured entries.", "<code>logs &lt;sid&gt; &lt;eid&gt; [--entries]<\/code>.", "Stored lines first, then live, as the server sends them.", "Entries mode prints JSON lines; no filtering."], ["Discovery", "Plugin list and detail", "Find node types and their ports and usage text.", "<code>plugin list<\/code>, <code>plugin get &lt;type&gt;<\/code>.", "Table or JSON.", "Table shows only some fields; JSON includes the UI design."], ["Control bus", "Node inspection and commands", "List active nodes, read a node's last heartbeat, send it a command.", "<code>controlbus nodes|all-nodes|heartbeat|command<\/code>.", "Command payload is checked as JSON first.", "The server expects a non-empty object of at most 100 entries; the CLI does not check that."], ["Access", "Remote servers and tokens", "Point the CLI at another server with an API key.", "--url and --token, or YUKTA_SERVER_URL and YUKTA_TOKEN.", "Token is sent on normal calls and streams.", "No warning when the token goes over plain http."], ["Output", "Table or JSON output", "Readable columns for humans, JSON for scripts.", "-o table|json.", "JSON goes to standard output and is indented.", "Several commands ignore -o."], ["Packaging", "Static binaries for five platforms", "Download one file and run it.", "<code>make build-all<\/code>; release adds SHA256SUMS and provenance.", "No runtime needed (CGO disabled).", "No version command."]], "guar": {"title": "Guarantees and limits", "lede": "What the CLI promises, what it leaves to the server, and what it does not do. 'Enforced' means code checks it; 'not enforced' means a user or the server must.", "tables": [{"title": "Behaviour of a command", "lede": "Per-call semantics. The CLI keeps no data between runs.", "head": ["Topic", "What the CLI does"], "rows": [["Time limit", ["ok", "Normal calls give up after 30 seconds by default (covers connect, wait and reading the body). <code>--timeout 0<\/code> disables."]], ["Streams", ["part", "No time limit on purpose. Only Ctrl-C, SIGTERM or the server ends them. A silent server is not detected."]], ["Retries", ["lost", "None. A timeout, 429 or network blip is reported once."]], ["Path safety", ["ok", "Every id in a path is escaped, so ids with <code>/<\/code>, <code>?<\/code> or <code>#<\/code> cannot reach a different endpoint."]], ["Success test", ["ok", "Any 2xx is success (the server uses 200 and 202). Everything else is an error with status and raw body."]], ["Exit codes", ["part", "0 on success and on Ctrl-C of a stream; 1 on any error. No separate codes for 4xx, 5xx, timeout or bad usage."]], ["Output channels", ["ok", "Results go to standard output, errors to standard error, so JSON can be piped."]], ["Stored data", ["info", "None: no config file, no cache, no history. Every setting comes from flags or two environment variables."]], ["Decoding", ["part", "Only the envelope's <code>data<\/code> field is read. A renamed field becomes an empty value, not an error."]], ["Idempotency", ["lost", "The server's <code>Idempotency-Key<\/code> header for starts is not sendable from the CLI."]]]}, {"title": "Enforced by the CLI vs left to the server", "head": ["Rule", "Who enforces it"], "rows": [["Required ids and argument counts", ["ok", "CLI, before any request."]], ["Payload is a JSON object (start)", ["ok", "CLI, and also the server's request validation."]], ["Command payload non-empty, at most 100 entries", ["part", "Server only. The CLI checks only that the text is valid JSON."]], ["Authentication", ["info", "Server decides (<code>yukta.api-key<\/code>). The CLI only sends the token."]], ["Run belongs to the session", ["part", "Server checks it on the session-qualified paths the CLI uses; the shorter execution-only paths skip that check."]], ["Run limit and queue", ["info", "Server. A refusal arrives as 429 and the CLI does not retry."]], ["Output format value", ["lost", "Not validated except by <code>session get<\/code>."]], ["Server compatibility", ["lost", "Not checked at all: no version negotiation and no contract test."]]]}, {"title": "Defaults and limits", "head": ["Setting", "Value"], "rows": [["Server URL", "<code>YUKTA_SERVER_URL<\/code>, else <code>http://localhost:8080<\/code> (the server itself listens on loopback by default)"], ["Token", "<code>YUKTA_TOKEN<\/code>, else none"], ["Request timeout", "30 s for normal calls; <code>0<\/code> disables; not applied to streams"], ["Output", "<code>table<\/code>; <code>json<\/code> is the only other defined value"], ["Largest stream line", "1 MB (initial buffer 64 KB)"], ["Status stream history", "<code>--include-history<\/code> off by default (the server's own default is on)"], ["List size", "Whatever the server returns as its first page: 500 by default, at most 1,000; the CLI cannot ask for more or for the next page"], ["Platforms built", "linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64"], ["Coverage rule", "100% per function; exempt: main.go, testutil.go, integration_test.go"]]}]}, "ref": [{"id": "cmdmap", "title": "Command to REST endpoint map", "lede": "What each command calls. sid = session id, eid = execution id, nid = node id, wid = workflow id. Paths marked (legacy) are the session-qualified forms that the server documents as deprecated; the server also offers /api/executions/{eid}/... forms.", "head": ["Command", "Method and endpoint", "Notes"], "rows": [["session list", "GET /api/sessions", "First page only. -o json prints {sessions:[...]}."], ["session get &lt;sid&gt;", "GET /api/sessions/{sid}", "Table shows id and workflow ids; JSON raw."], ["session summaries", "GET /api/sessions/summaries", "Always JSON. First page only."], ["session workflow get &lt;sid&gt; &lt;wid&gt;", "GET /api/sessions/{sid}/workflows/{wid}", "Always JSON."], ["session workflow graph &lt;sid&gt; &lt;wid&gt;", "GET /api/sessions/{sid}/workflows/{wid}/graph", "Always JSON."], ["session workflow executions &lt;sid&gt; &lt;wid&gt;", "GET /api/sessions/{sid}/workflows/{wid}/executions", "Always JSON. First page only."], ["session apply &lt;json-or-file&gt;", "POST /api/sessions", "Registered in the session group."], ["workflow start &lt;sid&gt; &lt;wid&gt; [--payload | --payload-file]", "POST /api/workflow/start", "Server answers 202. No Idempotency-Key."], ["workflow stop &lt;sid&gt; &lt;wid&gt;", "POST /api/workflow/{sid}/{wid}/stop", "No ?mode= sent, so the server default DRAIN applies."], ["workflow pause | resume &lt;sid&gt; &lt;eid&gt;", "POST /api/workflow/{sid}/{eid}/pause | resume", "(legacy)"], ["workflow status &lt;sid&gt; &lt;eid&gt;", "GET /api/workflow/{sid}/status/{eid}", "(legacy) Prints id, workflow, status, times, task count."], ["workflow status-stream &lt;sid&gt; &lt;eid&gt; [--include-history]", "GET /api/workflow/{sid}/status/{eid}/stream?includeHistory=", "(legacy) SSE. Sends includeHistory=false by default."], ["workflow history &lt;sid&gt;", "GET /api/workflow/{sid}/history", "First page only. Plain text, not a table."], ["workflow executions stop &lt;eid&gt;", "POST /api/workflow/executions/{eid}/stop", "(legacy, no session in path)"], ["workflow executions restart &lt;eid&gt; [node]", "POST /api/workflow/executions/{eid}/restart[/{node}]", "(legacy, no session in path)"], ["workflow node pause | resume &lt;sid&gt; &lt;eid&gt; &lt;nid&gt;", "POST /api/workflow/{sid}/{eid}/node/{nid}/pause | resume", "(legacy)"], ["workflow node stop ... [--immediate] [--reason]", "POST /api/workflow/{sid}/{eid}/node/{nid}/stop?immediate=&reason=", "(legacy) Always sends reason, even when empty."], ["workflow node skip ... [--skip=false]", "POST /api/workflow/{sid}/{eid}/node/{nid}/skip?skip=", "(legacy) The server notes core currently rejects skip for running executions."], ["workflow node step enable | disable | next", "POST /api/workflow/{sid}/{eid}/node/{nid}/step/enable | step/disable | step", "(legacy)"], ["logs &lt;sid&gt; &lt;eid&gt; [--entries]", "GET /api/sessions/{sid}/executions/{eid}/logs[/entries]", "SSE. Ends when the execution reaches a final state."], ["plugin list", "GET /api/plugins", "Table: type and category."], ["plugin get &lt;type&gt;", "GET /api/plugins/{type}", "Table omits the UI HTML; JSON includes it."], ["controlbus nodes &lt;wid&gt;", "GET /api/control/workflows/{wid}/nodes", ""], ["controlbus all-nodes", "GET /api/control/nodes", ""], ["controlbus heartbeat &lt;wid&gt; &lt;nid&gt;", "GET /api/control/workflows/{wid}/nodes/{nid}/heartbeat", "Table rows in random order."], ["controlbus command &lt;wid&gt; &lt;nid&gt; &lt;json-or-file&gt;", "POST /api/control/workflows/{wid}/nodes/{nid}/command", "Body is the raw JSON object; the server needs 1 to 100 entries."], ["controlbus watch [--execution] [--type] [--until-done] [--quiet]", "GET /api/events/stream", "One line per event; --quiet shows only problems and the end."], ["result &lt;sid&gt; &lt;eid&gt;", "GET /api/sessions/{sid}/executions/{eid}/results", "What reached the terminal nodes."], ["workflow node retry &lt;eid&gt; &lt;nid&gt;", "POST /api/executions/{eid}/nodes/{nid}/retry", "Restart from a failed node; prints the new execution id."], ["workflow node breakpoint &lt;eid&gt; &lt;nid&gt;", "POST and DELETE /api/executions/{eid}/nodes/{nid}/breakpoint", "Data-driven breakpoint."], ["workflow node signal &lt;eid&gt; &lt;nid&gt;", "POST /api/executions/{eid}/nodes/{nid}/signal", "Answer an approval."]]}, {"id": "gaps", "title": "Server endpoints with no CLI command", "lede": "Found by comparing the web controllers with the commands. Each is a candidate for a new command or a reason to generate the client.", "head": ["Server endpoint", "What it does", "Why a user might want it"], "rows": [["GET /api/supervisors", "Lists automated watchers.", "Seeing what is watching a run."], ["POST /api/sessions/validate", "Checks a workflow definition without saving it.", "A CI check before applying a config."], ["GET /api/sessions/{sid}/config, GET /api/sessions/{sid}/workflows", "Full session config and workflow list.", "Exporting a session."], ["POST /api/executions/{eid}/priority", "Change a queued run's priority.", "Queue management."], ["POST /api/scheduler/limits", "Change run limits at run time.", "Operations."], ["?mode= on POST /api/workflow/{sid}/{wid}/stop", "DRAIN (default), CANCEL or KILL.", "Choosing how hard to stop."], ["?limit= and ?cursor= on list endpoints", "Paging with an X-Next-Cursor response header.", "Seeing beyond the first 500 items."], ["Idempotency-Key header on POST /api/workflow/start", "Repeat-safe starts.", "Safe retries in pipelines."], ["Last-Event-ID header on streams", "Resume a stream without repeats.", "Reconnecting watchers."], ["GET /api/sessions/{sid}/approvals, POST .../versions/note, rollback, diff", "Pending approvals and workflow versions.", "Operating approval steps and rolling back from the terminal."], ["GET /api/executions (run search), GET /api/control/audit", "Search runs across sessions; list control commands with the actor.", "Finding a run and seeing who did what."], ["POST /api/executions/{eid}/recover", "Resume a run that a restart aborted.", "Recovery after a crash."], ["GET /api/workers", "Lists connected remote workers.", "Operations."]]}, {"id": "build", "title": "Build and check targets", "lede": "The Makefile is the source of truth. Gradle task names are listed for people who start from the JVM side.", "head": ["Make target", "Gradle task", "What it does"], "rows": [["make build", "goBuild", "Static binary for the current OS and architecture into build/yukta-&lt;os&gt;-&lt;arch&gt;[.exe]."], ["make build-all", "goBuildAll", "The five platforms: linux amd64/arm64, darwin amd64/arm64, windows amd64."], ["make test", "goTest", "go test ./..."], ["make cover / cover-check", "goTestCoverage / goCoverageCheck", "Fresh coverage profile, then the 100% per-function rule."], ["make fmt-check / fmt", "goFormatCheck / goFormat", "gofmt."], ["make mod-verify / mod-tidy", "goModVerify / goModTidy", "Module checksums / tidy."], ["make vet / lint", "goVet / goLint", "go vet; golangci-lint v2.14.0."], ["make sec / vuln", "goSecurityScan / goVulnCheck", "gosec v2.29.0; govulncheck v1.8.0."], ["make check", "check", "Everything above. In Gradle, tests run twice (goTest and inside the coverage check)."]]}], "quality": [{"n": "Scalability", "pos": "A command-line client barely has a scaling story: one short-lived process, one request. What scales badly is not the program but its hand-written copy of the API (every new endpoint needs hand edits) and its inability to see past the first page of a long list.", "ceil": ["Lists stop at the server's first page (500 by default, 1,000 at most) with no way to continue", "One hand-written function and command per endpoint: the work grows with the API", "A single stream event larger than 1 MB ends the stream", "Many parallel CLI calls from CI each open their own connection; no shared pooling"], "have": ["Streams do not buffer: events are printed as they arrive", "Static binaries scale to any number of build agents without installs"], "need": ["--limit and --cursor flags or an automatic follow of X-Next-Cursor", "A generated client or a contract test to stop manual drift", "A larger or configurable line limit"]}, {"n": "Performance", "pos": "Start-up is fast because there is no runtime to boot: it is a static Go binary. The real latency is the network round trip and the server. Performance is not a concern of this module.", "ceil": ["Each command pays one connection setup (and TLS handshake if https)", "Whole answers are read into memory before printing", "30-second default limit may be too short for large answers"], "have": ["Milliseconds of start-up; no JVM", "Request body and flags are tiny", "No retries, so no hidden extra load on the server"], "need": ["Nothing urgent. A batch mode could save reconnects if scripts call it hun
