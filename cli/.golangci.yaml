version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gocritic
    - revive
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (*text/tabwriter.Writer).Flush
        - fmt.Fprintln
  exclusions:
    paths:
      - vendor
      - build
      - bin
    rules:
      # Exclude style-only issues in revive for now
      - linters: [revive]
        text: "unused-parameter|exported|package-comments"
      - path: _test\.go
        linters: [gosec, errcheck]
