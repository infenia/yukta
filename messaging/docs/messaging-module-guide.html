<script>
var DATA = {"module": "messaging", "title": "How Yukta messaging works, and where it can break", "htmlTitle": "Yukta messaging Guide", "date": "2026-10-12", "glance": {"lede": "Messaging is the smallest and lowest module in Yukta. It answers two questions: what is the thing that travels along every edge of a workflow graph (the <b>message envelope<\/b>), and what hook can wrap the input and output of every node (the <b>node message channel<\/b>)? It has no engine, no I/O and no state. This page is for thinking about it: open a component, play a scenario, then challenge the weak spots.", "props": [["Immutable envelope", "A message is a Java record. Every change returns a new copy, so two branches that receive the same message can never disturb each other's view of it."], ["Enterprise-integration shape", "The envelope carries identity, routing, sequence, priority and dead-letter fields borrowed from classic messaging patterns. Many of them are carried but nothing acts on them yet."], ["One hook per node", "Core asks a provider for a channel for each node and wraps the plugin's input and output with it. Today the only channel does nothing (a pass-through)."], ["Core owns the bookkeeping", "Core, not plugins, stamps the node history and sets the source node on every edge. The module only supplies the vocabulary."]], "start": [["primer", "Primer", "The problem, the vocabulary and one message followed through one node"], ["map", "System map", "Ten components, how a message is built, routed, wrapped and stamped"], ["map", "Replay a message", "Five scenarios: happy path, a dead letter, a custom channel, a long loop, a split"], ["guarantees", "What is promised", "What the envelope enforces and what it only carries"], ["reference", "Field table and do/don't", "Every envelope field, who sets it, who reads it"], ["quality", "Stress it", "Scalability, performance, availability, security lenses"], ["board", "Challenge it", "Open risks, an impact x effort grid, your own notes"], ["adrs", "Decisions", "Seven ADRs, each with a 'revisit when' trigger"]]}, "primer": {"problem": "A workflow in Yukta is a graph of steps. Something has to flow from one step to the next, and that thing must be safe to hand to several steps at once. If steps could change a shared object in place, a step on one branch could silently break a step on another. Teams also need to know where a piece of data came from, which request it belongs to and which steps it passed through. <b>Messaging<\/b> defines that unit of data (the <b>message<\/b>) and a hook (the <b>channel<\/b>) that core wraps around every step. It is the lowest module: core, plugin-api and every plugin depend on it, and it depends on nobody in Yukta.", "analogy": "Think of a postal service. A message is a sealed envelope with a label: sender, tracking number, priority stamp, and a sheet where each sorting office stamps its name. You never edit an envelope. If a sorting office wants to change something, it puts the content into a new envelope and copies the label. The <b>channel<\/b> is a customs gate at the door of each sorting office: today the gate is open and nobody checks anything, but the door frame is there, so a real checkpoint could be fitted later.", "layersTitle": "Where messaging sits", "layers": [["Clients", "REST, web UI, MCP agents", ""], ["web / mcp", "A few control endpoints build control messages", ""], ["core", "Routes messages along edges, stamps history, calls the channel hook", ""], ["plugin-api + plugins", "Create and derive messages; plugin-api re-exports messaging", ""], ["messaging", "The envelope and the channel hook. This page.", "me"]], "layersNote": "Messaging depends only on Reactor (streams) and Spring Boot autoconfigure (for one conditional bean). It knows nothing about workflows, plugins or HTTP.", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["Message", "The unit of data on an edge: a payload plus labels (headers). It is immutable. Its type is <code>Message&lt;T&gt;<\/code> where T is the payload type.", "One incoming API request becomes one message."], ["Payload", "The actual data being moved. It is typed as a plain Java object with no schema, so any plugin can put anything in it.", "A JSON map, a string, a list of rows."], ["Header", "A label on the message that is not the payload. Fixed headers (id, trace id, source port...) are real fields. Free-form headers live in the <code>metadata<\/code> map.", "A plugin adds metadata 'http.status' = 200."], ["Wither", "A method named <code>withX<\/code> that returns a copy of the message with one thing changed. The original is untouched.", "<code>msg.withPayload(newBody)<\/code> returns a new message with the same labels."], ["Message history", "The list of node ids a message has passed through. Core appends to it; plugins must not. Only the last 64 are kept.", "[ticket, classify, approve]"], ["Source port", "The name of the output a message leaves a node from. Edges can listen only to a named port, such as <code>error<\/code>.", "A failed message leaves on port 'error'."], ["Node message channel", "A hook with two methods: one wraps the stream going into a plugin, one wraps the stream coming out. The default does nothing.", "A custom channel could log or encrypt every message."], ["Channel provider", "A factory that hands core the channel to use for a node, given its id and config. Core asks once per node when it builds the graph.", "One provider bean for the whole server."]], "ex": {"title": "One message, through one node", "lede": "A weather lookup. An API trigger creates a message, a node called 'weather' (an HTTP_REQUEST processor) enriches it, and two children receive the result. Click a step to see what happens, why, and where it can go wrong.", "viewBox": "0 0 880 230", "labels": ["What happens", "Why it works this way", "Can go wrong"], "legend": "Green = the message is created or derived · Blue = channel hook (the SPI of this module) · Grey = core engine steps", "nodes": [{"id": "create", "n": "Create", "s": "DefaultMessage", "k": "t", "x": 10, "y": 40, "does": "The API trigger turns the request body into a message with the factory <code>create(traceId, payload)<\/code>. The message gets a random UUID as its id, the current time, a trace id, empty metadata and empty history. Then it sets source port 'default'.", "adds": "A factory with safe defaults means every message starts with the same shape: no null maps, no null history, a timestamp always present.", "wrong": "Passing a null trace id (the control bus does) means the message has no trace. Nothing checks that a trace exists."}, {"id": "route", "n": "Route in", "s": "core edge", "k": "e", "x": 190, "y": 40, "does": "On the edge into 'weather', core stamps the parent's node id as the message's source node and checks the port. This edge names no port, so everything passes except messages on the <code>error<\/code> port.", "adds": "Routing by port lets one node feed different children by outcome. Excluding the error port from unnamed edges means dead letters never leak into the happy path.", "wrong": "A plugin that forgets to set a port still works on unnamed edges but is silently dropped by an edge that names a port."}, {"id": "inbound", "n": "Inbound hook", "s": "channel.inbound", "k": "p", "x": 370, "y": 40, "does": "Core asks the provider for the channel of node 'weather' and passes the incoming stream through <code>inbound<\/code>. The default channel returns the stream unchanged.", "adds": "This is the one seam where a deployment could inspect, delay, persist or forward every message entering a node without touching any plugin.", "wrong": "An error thrown here is not inside the node's retry policy, so it is not retried or routed to the error port. A node skipped at assembly time never calls the channel at all."}, {"id": "derive", "n": "Plugin derives", "s": "from / withers", "k": "t", "x": 550, "y": 40, "does": "The HTTP plugin calls <code>DefaultMessage.from(original, body)<\/code> and then <code>withMetadata(...)<\/code>. The result keeps the id, trace id, timestamp and history, but has the new body and extra headers such as the HTTP status.", "adds": "Deriving from the input, instead of creating from scratch, is how trace, correlation and sequence survive the node. The id also stays the same, so retries of the same message are recognisable.", "wrong": "Using <code>create<\/code> instead of <code>from<\/code> starts a new identity and an empty history: lineage is lost. Splitter and Aggregate do this on purpose."}, {"id": "outbound", "n": "Outbound hook", "s": "channel.outbound", "k": "p", "x": 730, "y": 40, "does": "The plugin's output stream passes through <code>outbound<\/code>. Again the default returns it unchanged.", "adds": "Symmetric to inbound: a custom channel could add a signature, size check or audit entry to every output.", "wrong": "Terminals have no output, so for them only the inbound side is ever called; triggers have no input, so only outbound."}, {"id": "stamp", "n": "History stamp", "s": "core, once", "k": "e", "x": 730, "y": 150, "does": "After the node, core appends 'weather' to the message's history, so it now reads [api, weather] (the trigger node 'api' was stamped earlier). Then it saves a checkpoint and records a log line.", "adds": "One place stamps every node, so history is complete and plugins cannot get it wrong or double-stamp.", "wrong": "Only the last 64 entries are kept. In a long chain or a loop, the beginning of the journey is forgotten."}, {"id": "fan", "n": "Fan-out", "s": "same message", "k": "e", "x": 550, "y": 150, "does": "The stamped message goes to every child edge. Each edge stamps its own source node on a copy, then applies its port filter.", "adds": "Because the message is immutable, every child can safely receive the same object. No defensive copies are needed.", "wrong": "Immutability is shallow: the payload object and any object stored in metadata are shared by reference. If a plugin mutates a list inside a payload, sibling branches can see it."}], "edges": [["create", "route"], ["route", "inbound"], ["inbound", "derive"], ["derive", "outbound"], ["outbound", "stamp"], ["stamp", "fan"]], "start": "inbound", "json": {"title": "See the envelope as it changes", "note": "Simplified: field names are the real record components; most are omitted for space.", "text": "right after Create (history still empty):\n{ \"id\": \"4f1c...\", \"traceId\": \"9a2e...\", \"sourcePort\": \"default\",\n  \"metadata\": {}, \"messageHistory\": [],\n  \"payload\": { \"city\": \"Pune\" } }\n\nafter the weather node (same id, trace, timestamp; core stamped the trigger node 'api' earlier):\n{ \"id\": \"4f1c...\", \"traceId\": \"9a2e...\",\n  \"sourceNodeId\": \"api\",              // set by core on the edge\n  \"metadata\": { \"http.status\": 200 },  // added by the plugin\n  \"messageHistory\": [ \"api\", \"weather\" ],  // stamped by core\n  \"payload\": { \"tempC\": 31 } }                 // swapped by from()"}}, "wrapper": {"title": "What core wraps around every message", "lede": "Plugin authors get this for free; the messaging module defines the shape.", "steps": ["Edge routing: set source node, filter by port", "Inbound channel hook (processor, terminal)", "Plugin derives new messages with withers", "Outbound channel hook (trigger, processor)", "History stamp, checkpoint, fan-out to children"]}, "story": {"title": "A message in plain words", "steps": [["Born", "a trigger creates it with a fresh id, a trace id and a timestamp."], ["Delivered", "core puts the parent's node id on it and checks the port rule of the edge."], ["Wrapped", "the channel sees it on the way into the plugin."], ["Changed", "the plugin never edits it; it makes a copy with a new payload or extra headers."], ["Wrapped again", "the channel sees the output on the way out."], ["Stamped", "core adds the node to its history."], ["Shared", "every child edge receives the same immutable message."]]}, "paths": [["New to the module", "Primer, then the System map and the Happy path scenario, then the field table in Reference.", "primer"], ["Writing a plugin", "Reference (do/don't list and field table), then Guarantees to see what is enforced and what is only carried.", "reference"], ["Planning a remote or durable transport", "System map (Channel SPI), Risks (remote transport, payload size), then Decisions 3 and 4.", "board"]]}, "plain": {"env": ["The shape of an envelope: a list of labels you can read and a list of ways to make a changed copy.", "Every plugin and core need one shared definition of 'a message', without depending on how it is stored."], "impl": ["The real envelope. A fixed record with 22 slots (labels, history, payload) that cleans itself up when built.", "Gives immutability and tidy defaults in one place, so no plugin has to remember to copy maps or trim lists."], "fact": ["The two ways to get a message: make a brand-new one, or make one from an old one with a new payload.", "New logical messages and derived messages need different rules for ids, history and timestamps. Two named entry points keep them apart."], "ops": ["The small copy-with-one-change tools: set a header, record a failure, mark a sequence position.", "Plugins can change things without ever editing a shared message, so branches cannot affect each other."], "route": ["The sorting desk at the entrance of every node. It writes who sent the message and decides which edges may receive it.", "Lets one node feed different children by outcome, and keeps failed messages off the normal path."], "spi": ["A door frame in every node, one for the way in and one for the way out, where a custom checkpoint can be fitted.", "Transport, auditing or encryption can be added in one place, without changing any plugin."], "direct": ["The default checkpoint: an open gate. It passes everything straight through.", "Zero overhead and zero surprise in the normal case; the hook exists without costing anything."], "wire": ["The small piece of Spring configuration that fits the open gate unless someone has installed another.", "Core must always have a channel provider; this guarantees one exists and lets a deployment replace it."], "stamp": ["The logbook. After each node core writes the node's name on the message's history sheet.", "Shows where a message has been without relying on every plugin to remember to record it."], "build": ["The module's dependency list and its safety net of tests.", "Keeps the lowest module tiny and makes sure the envelope rules (immutability, caps, null handling) keep holding."]}, "comps": [{"id": "env", "name": "Envelope Contract", "tag": "the Message interface", "c": 0, "r": 0, "resp": "Defines what a message is: 22 read accessors and 18 copy-with-change methods, with no storage or transport decisions.", "how": ["Reading uses record-style accessors with no 'get' prefix: <code>msg.payload()<\/code>, <code>msg.traceId()<\/code>. Writing uses 'wither' methods that always return a new message and never touch the original.", "The accessors are grouped by purpose: identity (id, trace, correlation, reply-to), timestamp and expiry, routing (source port, source node, workflow id), sequence, priority and control flag, dead-letter fields, history, metadata and payload.", "The interface has about 40 methods but one implementation. The reason it is an interface at all is that core and plugins should compile against a contract, not against a record that may grow fields.", "The id is documented as a <i>logical<\/i> id: it is kept across <code>withPayload<\/code> and every other copy. So it is not unique per node output. Any store must key entries by (execution id, node id, message id), or two different outputs would overwrite each other.", "The documentation of <code>withAddedHistory<\/code> states the rule that core stamps every node itself and plugins must not call it."], "guar": "Every wither returns a new instance; reading a message never changes it.", "state": "None. It is an interface.", "ceil": "Each new field needs changes in the interface, the record, the two copy paths and the tests. A wide interface is costly to extend (see the risk on its width).", "fail": "Nothing runs here, so nothing fails. The contract can be broken only by an implementation that mutates, and there is only one implementation.", "set": [], "risks": ["wideContract", "untypedPayload", "idNotUnique"]}, {"id": "impl", "name": "Envelope Record", "tag": "DefaultMessage, 22 components", "c": 1, "r": 0, "resp": "The only implementation of the envelope: an immutable record that tidies its own maps and history when it is built.", "how": ["It is a Java record with 22 components, so equality, accessors and copying come for free. Lombok generates most withers and a builder with <code>toBuilder<\/code>, so several fields can be changed in one copy instead of a chain of copies.", "Metadata is cleaned in the constructor. A null map becomes empty. Entries whose value is null are dropped quietly, because an immutable map cannot hold nulls. A null key is rejected with a NullPointerException, because that would be a programming error and not 'no value'.", "History is cleaned in the constructor too: null becomes an empty list, and only the last 64 entries are kept (the constant is <code>MAX_HISTORY<\/code>). So even a message built by hand or read back from a checkpoint file cannot carry more than 64.", "The timestamp defaults to 'now' if not given. Both maps and lists are copied into unmodifiable versions, so a caller who keeps a reference to the list it passed in cannot change the message later.", "This immutability is shallow. The list and map are fixed, but the objects inside metadata and the payload itself are shared by reference. Nothing in the module copies or freezes them.", "The checkpoint store in core writes a message as JSON and reads it back as this record. The payload then comes back as plain JSON values (maps, lists, strings), not as its original Java type."], "guar": "A message always has non-null metadata and history, history is at most 64 long, metadata has no null values or keys, and a timestamp is present.", "state": "None. Every instance is a value. Nothing survives a restart unless core checkpoints it.", "ceil": "Each wither copies the whole record (22 fields). Metadata changes copy the entire map. That is fine for small headers and wasteful if many large headers are rewritten at every node.", "fail": "A null metadata key throws NullPointerException at construction. Any other bad input (a negative priority, a huge map) is accepted.", "set": ["MAX_HISTORY = 64 (a constant, not configurable)"], "risks": ["shallowImmutable", "historyCap", "wideContract", "copyDrift", "payloadSize", "metadataCopy"]}, {"id": "fact", "name": "Factories", "tag": "create and from", "c": 0, "r": 1, "resp": "The two named ways to get a message: a new logical message (<code>create<\/code>) or a new payload on an old message (<code>from<\/code>).", "how": ["<code>create(traceId, payload)<\/code> makes a brand-new message: a random UUID id, the trace id as text (or null if none is given), the current time, empty metadata and empty history. Everything else is zero or null.", "<code>from(original, newPayload)<\/code> copies every one of the 22 fields of the original, including id, trace, timestamp, history and metadata, and swaps only the payload. The instance method <code>withPayload<\/code> does the same.", "Triggers use <code>create<\/code> because a trigger starts a new logical message (the API trigger, the schedule trigger and the constant source all do). Processors such as HTTP_REQUEST, LLM_CALL, MAPPER and PROCESS_EXECUTOR use <code>from<\/code>, which is why trace and id survive them.", "Splitter and Aggregate deliberately use <code>create<\/code>: a split child is a new logical message with a new id (its correlation id points at the parent), and an aggregate is one new message built from many. Their history starts empty again. Splitter copies the parent's trace id; Aggregate takes the trace id of the first message in the batch."], "guar": "<code>from<\/code> never loses a field. <code>create<\/code> never produces null maps or null history.", "state": "None.", "ceil": "No uniqueness or validation: the factory trusts the caller (for example, two messages could be created with the same trace id by design).", "fail": "If a plugin builds a message with <code>create<\/code> when it should have used <code>from<\/code>, trace, history and identity are silently lost. Nothing warns about it.", "set": [], "risks": ["lineageReset", "copyDrift", "idNotUnique"]}, {"id": "ops", "name": "Header & History Ops", "tag": "withers for plugin authors", "c": 1, "r": 1, "resp": "The small copy-with-one-change operations that plugins and core use to adjust headers, record failures and mark sequence positions.", "how": ["<code>withHeader(key, value)<\/code> adds or replaces one entry in the metadata map. A null value removes the key; a null key throws. So a plugin can 'unset' a header without a separate remove method.", "<code>withMetadata(map)<\/code> replaces the whole map (the record cleans it as always). <code>withSourcePort(port)<\/code> names the output the message leaves from; core filters edges by this value.", "<code>withFailure(origDest, reason, detail)<\/code> fills three dead-letter fields in one copy. Core's retry policy and several router plugins use it, then set the source port to <code>error<\/code> so only error edges receive the message. It does not touch the <code>retryCount<\/code> field; the retry count in dead letters lives in a header called <code>failure.attempts<\/code>.", "<code>withSequence(id, position, total)<\/code> marks a message as item N of M in a group. <code>withAddedHistory(nodeId)<\/code> appends one id and drops the oldest if there are already 64. Plugins must not call it: core does it for every node, and a second stamp would put a node in the list twice.", "Convenience setters exist for trace id, correlation id, reply-to, source node, workflow id, expiration, format indicator, timestamp, priority, control flag and retry count."], "guar": "Each call returns a new message and leaves the original unchanged. Trace and correlation ids survive any chain of withers on a derived message.", "state": "None.", "ceil": "A chain of three withers makes three copies of a 22-field record. Use <code>toBuilder()<\/code> to change several fields in one copy.", "fail": "Wrong use, not runtime failure: stamping history in a plugin double-counts nodes; setting a port name no edge listens for makes the message vanish.", "set": [], "risks": ["unenforced", "shallowImmutable", "forgeable", "nullSilent"]}, {"id": "route", "name": "Port Routing (core)", "tag": "sets source node, filters", "c": 1, "r": 2, "resp": "Core's step on every edge: put the parent's node id on the message and decide whether this edge may receive it, based on the source port.", "how": ["For each parent edge, core sets <code>sourceNodeId<\/code> to the parent's id by copying the message. This overwrites whatever was there, so a plugin cannot fake where a message came from.", "If the edge names a source port, only messages whose <code>sourcePort<\/code> equals that name pass. If the edge names no port, every message passes except those on the port named <code>error<\/code>.", "Why exclude the error port: with <code>onError: ROUTE<\/code>, a message that failed all its retries is tagged with failure details and the <code>error<\/code> port. A normal edge must not receive it as if it had succeeded; only an edge that asks for the error port gets it.", "A message with no source port reaches unnamed edges but never an edge that names a port. The API trigger and several processors set the port <code>default<\/code> explicitly.", "This code lives in core (<code>StreamTopologyDecorator<\/code>), not in messaging. It is shown here because it defines how two fields of the envelope are used."], "guar": "A message never reaches an error-port edge unless it carries the error port, and never reaches an unnamed edge if it does.", "state": "None. The decision is made per message from its fields.", "ceil": "Filtering is a string comparison per message per edge. Not a bottleneck.", "fail": "An edge that names a port nothing emits just stays silent. The validator rejects an edge naming a port the plugin does not declare, so this mostly shows up with plugins that emit undeclared ports.", "set": ["edge.sourcePort in the workflow JSON"], "risks": ["unenforced"]}, {"id": "spi", "name": "Channel SPI", "tag": "inbound / outbound hook", "c": 2, "r": 1, "resp": "A two-method hook core calls around every node, plus the provider that hands core the right hook for each node.", "how": ["The hook is <code>NodeMessageChannel<\/code> with <code>inbound(nodeId, executionId, upstream)<\/code> and <code>outbound(nodeId, executionId, pluginOutput)<\/code>. Each takes a Reactor stream of messages and returns a stream. A channel may transform, delay, filter, log or forward the messages.", "The provider is <code>NodeMessageChannelProvider.channelFor(nodeId, config)<\/code>. It receives the node's id and config, so one provider can choose a different channel per node. Core calls it once while it builds the node, not once per message.", "Processor nodes use both sides. Trigger nodes have no input, so only <code>outbound<\/code> is used. Terminal nodes have no output, so only <code>inbound<\/code> is used.", "The channel sits outside the engine's retry and error policy. For processors, the per-message retry wraps the plugin call, while the channel wraps the whole stream around it. A failure inside the channel therefore fails the node's stream; it is not retried per message.", "A processor that is marked for skip when the graph is assembled bypasses the channel completely, because the skipped stream is wired straight through. A processor skipped later at run time still has its channel."], "guar": "Core asks the provider for a channel for every trigger, processor and terminal it builds, and wraps the plugin stream with it.", "state": "None in the interface. A custom channel can hold what it likes.", "ceil": "The streams are Reactor <code>Flux<\/code> values of in-process objects. There is no acknowledgement, no serialisation contract and no flow-control signal beyond Reactor back-pressure, so the hook is not yet proven for a remote or durable transport.", "fail": "An exception in <code>inbound<\/code> or <code>outbound<\/code> propagates as the node's stream error. The retry policy does not wrap it.", "set": ["a NodeMessageChannelProvider bean (to replace the default)"], "risks": ["remoteSpi", "channelErrors", "skipBypass", "conditionalOrder"]}, {"id": "stamp", "name": "History Stamp (core)", "tag": "once per node, in core", "c": 3, "r": 1, "resp": "Core appends each node's id to every message leaving that node, then checkpoints and fans it out.", "how": ["After the node's output (and after the outbound channel), core maps every message through <code>withAddedHistory(nodeId)<\/code>. Only after that does it save the checkpoint, emit a log line and broadcast to children.", "Because it is the single stamp point, a message that passed through three nodes has three entries, in order. A plugin that also stamped would add a duplicate.", "A skipped processor is still stamped, because the stamp is part of the node's output decoration, not of the plugin call.", "Fan-out sends the same stamped message object to every child. Immutability makes that safe for the envelope itself; the shared payload is the only thing that could be changed by mistake.", "No plugin in the repository calls <code>withAddedHistory<\/code> today; only core does."], "guar": "Exactly one history entry per node per message, added by core. The checkpoint copy already includes it.", "state": "History travels inside the message. It is checkpointed with it (files or memory, per core's setting).", "ceil": "The list is capped at 64 entries, oldest dropped first. Messages that move through more than 64 nodes (for example in a retry loop) lose the start of their journey.", "fail": "Nothing here fails. The loss is silent: the oldest entries are discarded without a marker.", "set": [], "risks": ["historyCap", "lineageReset"]}, {"id": "direct", "name": "Direct Channel", "tag": "no-op default", "c": 3, "r": 2, "resp": "The default channel: both methods return the stream unchanged, and one shared instance serves every node.", "how": ["<code>inbound<\/code> and <code>outbound<\/code> each return their argument. There is no copy, no buffer and no operator added to the Reactor chain.", "The provider returns the same singleton for every node and ignores the node id and config.", "This is why the hook costs nothing today: the node's stream has the same shape with or without the channel.", "Tests check that the stream object returned is the very same one that went in, and that the provider hands back the same instance for different nodes."], "guar": "A message is delivered to the plugin and downstream exactly as received. No reordering, no change.", "state": "None.", "ceil": "Not applicable: it does no work. It is also the only channel, so the ceiling of the SPI has never been tested with a real transport.", "fail": "It cannot fail. It also provides no durability, no remote delivery and no extra back-pressure.", "set": [], "risks": ["remoteSpi"]}, {"id": "wire", "name": "Default Wiring", "tag": "Spring configuration", "c": 2, "r": 2, "resp": "A tiny Spring configuration that registers the direct provider unless another provider bean exists.", "how": ["A configuration class declares one bean of the provider type, marked <code>@ConditionalOnMissingBean<\/code>. If any other provider bean is already registered when Spring evaluates the condition, the default is not created.", "The class is found by normal component scanning: the application class is in the package <code>com.infenia.yukta<\/code>, which contains this package. The module has no auto-configuration registration file.", "To replace the channel, register your own <code>NodeMessageChannelProvider<\/code> bean. A test in the module shows the default appears when none exists and is skipped when a custom one is added to the context first.", "Condition checks depend on the order in which Spring processes configuration. The conditional annotation is designed for auto-configuration classes that Spring orders last. Here it is on an ordinary scanned class, so the outcome can depend on scan order."], "guar": "In the tested setups, exactly one provider bean exists: the custom one if present, otherwise the direct one.", "state": "A Spring bean, created once per application context.", "ceil": "One provider for the whole server; per-node choice has to be made inside the provider.", "fail": "If the default and a custom provider both get registered, core's constructor injection cannot choose one and the application fails to start with a clear error.", "set": ["a NodeMessageChannelProvider @Bean"], "risks": ["conditionalOrder"]}, {"id": "build", "name": "Build & Tests", "tag": "dependencies, safety net", "c": 0, "r": 2, "resp": "The module's two exported dependencies and its four test classes.", "how": ["The module exports Reactor core (for <code>Flux<\/code>) and Spring Boot autoconfigure (for the conditional bean). Both are declared as 'api', so every module that depends on messaging sees them too.", "Core and plugin-api both declare messaging as an 'api' dependency. That is why every plugin sees <code>Message<\/code> without adding anything: plugin-api re-exports it.", "One test class covers the record: accessors, withers, factories, immutability of maps and history, null handling, the 64 cap, and an oversized history passed to the constructor. Three small test classes cover the channel, the provider and the Spring configuration.", "There is no test of a custom channel with real behaviour, because none exists yet."], "guar": "The envelope rules in the Guarantees section are each pinned by a test.", "state": "None.", "ceil": "The module is tiny (about 7 main files); it cannot grow into a bottleneck by itself. Its weight is that everything depends on it, so a change here forces a rebuild and re-check of the whole repository.", "fail": "A breaking change to the interface fails compilation in core, plugin-api and every plugin, which is a loud and early signal.", "set": [":messaging:test (Gradle task)"], "risks": ["wideContract"]}], "edges": [["fact", "impl", "data", "builds"], ["env", "impl", "ctrl", "implemented by"], ["ops", "impl", "data", "copies"], ["fact", "route", "data", "new message"], ["route", "spi", "data", "inbound"], ["ops", "spi", "data", "derived"], ["spi", "stamp", "data", "outbound"], ["direct", "spi", "ctrl", "default hook"], ["wire", "direct", "ctrl", "registers"], ["wire", "spi", "ctrl", "provider bean"], ["build", "env", "ctrl", "exports"]], "scen": [{"id": "happy", "name": "Happy path", "steps": [{"t": "A trigger creates a message", "d": "An API trigger receives a request and calls <code>create(traceId, payload)<\/code>. The result has a random id, the current time, empty history and empty metadata. The trigger sets source port 'default'.", "c": ["fact", "impl"], "r": []}, {"t": "The outbound hook and the first stamp", "d": "The trigger's output goes through the channel's <code>outbound<\/code> (a pass-through), then core appends the trigger's node id to the history.", "c": ["spi", "direct", "stamp"], "r": ["historyCap"]}, {"t": "Core routes along the edge", "d": "For the edge to the next node, core copies the message with the parent as source node. The edge names no port, so the message passes (it is not on the error port).", "c": ["route"], "r": []}, {"t": "Inbound hook, plugin and withers", "d": "The message goes through <code>inbound<\/code> into the plugin. The plugin makes a derived message with <code>from<\/code> and <code>withMetadata<\/code>. Id, trace and timestamp survive because it derived instead of creating.", "c": ["spi", "ops", "fact"], "r": ["lineageReset"]}, {"t": "Outbound, stamp and fan-out", "d": "The output passes <code>outbound<\/code>; core appends the node id, checkpoints the message and fans out the same object to every child. Immutability makes sharing safe, but the payload object itself is shared by reference.", "c": ["spi", "stamp", "impl"], "r": ["shallowImmutable"]}]}, {"id": "deadletter", "name": "Dead letter", "steps": [{"t": "A message fails all its retries", "d": "A processor with <code>onError: ROUTE<\/code> keeps failing for one message. Core's policy gives up after the configured attempts.", "c": ["spi", "ops"], "r": []}, {"t": "The envelope records why", "d": "Core calls <code>withFailure(nodeId, 'PROCESSING_FAILED', exception text)<\/code>, adds headers <code>failure.attempts<\/code>, <code>failure.exception<\/code> and <code>failure.time<\/code>, and sets source port <code>error<\/code>. The original message and id are kept so the failure can be traced back.", "c": ["ops", "impl"], "r": ["unenforced"]}, {"t": "Routing keeps it off the happy path", "d": "Normal edges (no port) drop anything on the error port. Only an edge that names the port <code>error<\/code> receives the message, typically going to a dead-letter terminal.", "c": ["route"], "r": []}, {"t": "What is not used", "d": "The envelope also has a <code>retryCount<\/code> field, but nothing sets it. The count of attempts travels in the <code>failure.attempts<\/code> header instead. A reader who looks only at the field sees zero.", "c": ["impl"], "r": ["unenforced"]}]}, {"id": "custom", "name": "Custom channel", "steps": [{"t": "A deployment registers its own provider", "d": "A team wants every message audited. They add a <code>NodeMessageChannelProvider<\/code> bean that returns an auditing channel for each node.", "c": ["wire", "spi"], "r": ["conditionalOrder"]}, {"t": "Spring chooses", "d": "If their bean is registered before the default's condition is checked, the default is skipped and everything works. If the order is different, two providers exist and startup fails because core needs exactly one.", "c": ["wire"], "r": ["conditionalOrder"]}, {"t": "Core asks once per node", "d": "While building the graph, core calls <code>channelFor(nodeId, config)<\/code> once per node and keeps the channel. The auditing channel's <code>inbound<\/code> and <code>outbound<\/code> methods add an operator to each stream.", "c": ["spi"], "r": []}, {"t": "Where it does not apply", "d": "A processor marked for skip at assembly time is wired straight through, so the audit channel never sees it. A failure inside the audit code is not retried by the node's retry policy and fails the node's stream.", "c": ["spi"], "r": ["skipBypass", "channelErrors"]}, {"t": "Making it remote", "d": "The team now wants the channel to send messages to another process. The interface passes only in-memory streams, with no acknowledgement or serialisation rule, and the payload is a plain Java object with no schema. They must design all of that themselves.", "c": ["spi", "impl"], "r": ["remoteSpi", "untypedPayload"]}]}, {"id": "loop", "name": "Long chain or loop", "steps": [{"t": "A message keeps travelling", "d": "A message passes through many nodes (a long pipeline, or a processor that sends output back through an earlier path). At each node core appends one id.", "c": ["stamp"], "r": []}, {"t": "The cap bites", "d": "At 64 entries the oldest id is dropped for every new one. The list is a sliding window of the last 64 nodes, with no marker that something was dropped.", "c": ["stamp", "impl"], "r": ["historyCap"]}, {"t": "Lineage questions go unanswered", "d": "A debugger asks 'which trigger produced this message?'. For a message that has passed 100 nodes, the answer is gone from history. Only the trace id and the checkpoints in core can still tell.", "c": ["impl"], "r": ["historyCap"]}, {"t": "Why the cap exists", "d": "Without a cap, a message that loops would grow its history without limit, and every copy (each wither) would cost more. The cap keeps each copy small and constant.", "c": ["impl", "ops"], "r": []}]}, {"id": "split", "name": "Split and aggregate", "steps": [{"t": "Splitter makes children", "d": "A Splitter node turns one message with 3 items into 3 messages. Each child is created with <code>create<\/code> and then given the parent's trace id, correlation id (the parent's id), sequence id and position 1/3, 2/3, 3/3.", "c": ["fact", "ops"], "r": []}, {"t": "Each child is a new logical message", "d": "The children have fresh ids and empty history; they share the parent's metadata map. They carry the parent's priority, reply-to, expiration and format indicator, but nothing in the engine acts on those.", "c": ["fact", "impl"], "r": ["lineageReset", "unenforced"]}, {"t": "Aggregate merges", "d": "An Aggregate node buffers a number of messages, or waits for a time limit, and builds one new message with the list of payloads. It keeps the trace id of the first one but not metadata, correlation or sequence.", "c": ["fact"], "r": ["lineageReset"]}, {"t": "Nobody checks the sequence", "d": "The sequence fields say 'item 2 of 3', but the aggregate does not wait for all 3 or put them in order; it merges by count or time. The fields are labels only.", "c": ["ops", "impl"], "r": ["unenforced"]}]}], "intro": {"happy": "One message from creation, through one processor and out to its children. Use it first.", "deadletter": "How a failed message is marked and kept off the normal path, and one field that looks useful but is unused.", "custom": "What happens when a deployment replaces the default channel, and where the hook does not reach.", "loop": "What the 64-entry history cap means for long chains and loops.", "split": "How split children and aggregates are built, and why their lineage restarts."}, "caps": [["Envelope", "Immutable messages", "A message cannot be changed after it is built.", "A record whose maps and lists are copied into unmodifiable versions; all changes go through <code>with*<\/code> methods.", "Two branches never disturb each other's view of the envelope.", "Shallow: payload and metadata values are shared by reference."], ["Envelope", "Tidy defaults", "A message never has null metadata, null history or a missing timestamp.", "The constructor replaces nulls and fills the timestamp.", "Plugins can read headers without null checks.", "Other fields (ids, port) may still be null."], ["Envelope", "Null headers dropped", "Metadata cannot hold a null value.", "Entries with null values are removed at construction; <code>withHeader(key, null)<\/code> removes the key; a null key throws.", "No null surprises in headers.", "A plugin cannot store 'explicitly nothing'."], ["Envelope", "Bounded history", "History cannot grow without limit.", "Only the last 64 node ids are kept, including when a message is built or read from a checkpoint.", "Constant copy cost per message.", "Early lineage is lost in long chains."], ["Identity", "Trace survives derivation", "Messages derived from one input share its trace id.", "<code>from<\/code> and the withers copy the trace and correlation ids.", "One request can be followed through the whole flow.", "Only if plugins derive instead of creating."], ["Identity", "Logical message id", "One id for one logical message across nodes.", "<code>from<\/code> keeps the id; <code>create<\/code> makes a random UUID.", "Retries of a message are recognisable by id.", "Not unique per node output."], ["Identity", "Correlation and reply-to", "Fields to link a reply to a request and to say where to send it.", "Set by plugins; the Splitter sets the correlation id to the parent's id.", "A child can be tied to its parent.", "Nothing routes replies; reply-to is only carried."], ["Routing", "Source port", "A message names the output it leaves from.", "Plugins call <code>withSourcePort<\/code>; core filters edges by it.", "Outcomes can be routed to different children.", "A port name no edge listens for drops the message."], ["Routing", "Source node", "A message says which node it came from.", "Core sets it on every edge, overwriting any earlier value.", "Consumers can trust it was set by the engine.", "Control messages set it by hand."], ["Routing", "Error port exclusion", "Failed messages stay off normal edges.", "Unnamed edges drop messages on the <code>error<\/code> port.", "Dead letters never reach the happy path.", "Needs an explicit error edge to be seen."], ["Failure", "Dead-letter fields", "A message can say where it was headed and why it failed.", "<code>withFailure(origDest, reason, detail)<\/code>; core and several router plugins use it.", "A failed message arrives with its explanation.", "<code>retryCount<\/code> is not set by anyone."], ["Sequence", "Position in a group", "A message can be item N of M.", "<code>withSequence(id, position, total)<\/code>; the Splitter sets it.", "A consumer could rebuild order.", "No component reorders or waits for the full set."], ["Sequence", "Priority and control flag", "Header fields to mark importance and management messages.", "Set on control messages by the control gateway; the control bus sorts a batch by priority.", "Operator commands in one batch run in priority order.", "Data messages are not prioritised."], ["Channel", "Per-node hook", "One place to wrap every node's input and output.", "<code>NodeMessageChannel<\/code> chosen per node by the provider; core calls inbound and outbound.", "Transport, audit or encryption can be added without touching plugins.", "Only a pass-through exists; skipped-at-assembly nodes bypass it."], ["Channel", "Replaceable default", "A deployment can replace the channel.", "A provider bean replaces the default thanks to <code>@ConditionalOnMissingBean<\/code>.", "No code change in core is needed.", "Order of Spring configuration matters."], ["Lineage", "History stamp by core", "A record of which nodes a message passed.", "Core appends the node id once per node; plugins must not.", "A complete, uniform journey record.", "Capped at 64; reset by Splitter and Aggregate."], ["Packaging", "Re-exported by plugin-api", "Plugin authors need one dependency.", "Messaging is an 'api' dependency of plugin-api, with Reactor and Spring autoconfigure.", "Every plugin sees <code>Message<\/code> and <code>Flux<\/code> automatically.", "The module's dependencies become part of every plugin's classpath."]], "guar": {"title": "What is promised, and what is only carried", "lede": "The module has no profiles or deployment modes. It is pure code with no storage, so what matters is which rules the envelope enforces and which fields are only labels. Nothing here survives a restart by itself: core checkpoints decide that.", "tables": [{"title": "Enforced by the envelope", "lede": "Each rule is applied in the record's constructor or its withers and is covered by a test.", "head": ["Rule", "Guarantee"], "rows": [["Immutability of the envelope", ["ok", "Every wither returns a new instance. The metadata map and the history list are unmodifiable copies."]], ["Deep immutability", ["part", "Not provided. Payload and the values inside metadata are shared references and can be mutated by whoever holds them."]], ["Metadata cleanliness", ["ok", "No null values (dropped), no null keys (rejected with NullPointerException)."]], ["History length", ["ok", "At most 64. The oldest ids are dropped first, on append, on construction and on read-back."]], ["Timestamp", ["ok", "Always present: defaults to the time of construction when omitted."]], ["Identity across derivation", ["ok", "Id, trace id, correlation id and timestamp are kept by <code>from<\/code>, <code>withPayload<\/code> and all withers."]], ["Trace presence", ["part", "Kept if present, but nothing requires a trace: control messages are created with none."]]]}, {"title": "Core rules built on the envelope", "lede": "These behaviours live in core but define how fields are used.", "head": ["Topic", "Behaviour"], "rows": [["History stamping", ["ok", "Core stamps each node once per message, including skipped processors. Plugins must not."]], ["Source node", ["ok", "Set by core on every edge, overwriting any earlier value."]], ["Port filtering", ["ok", "A named edge passes only its port. An unnamed edge passes everything except the <code>error<\/code> port."]], ["Channel coverage", ["part", "Processors use inbound and outbound, triggers outbound only, terminals inbound only. A processor marked for skip when the graph is assembled bypasses the channel."]], ["Channel failure", ["part", "A failure in the channel is not covered by the node's per-message retry and error-port policy."]]]}, {"title": "Carried but not enforced", "lede": "These fields exist in the envelope. Nothing in core or the plugins acts on them. Do not assume they have an effect.", "head": ["Field", "Status"], "rows": [["expiration", ["lost", "Never checked. An expired message is delivered like any other. Splitter only copies it."]], ["replyTo", ["lost", "Never used to route a reply. Splitter copies it; ContentFilter can read it."]], ["formatIndicator", ["lost", "Never checked or used to pick a format. Splitter copies it."]], ["retryCount", ["lost", "Not set by any code. The attempt count is carried in the header <code>failure.attempts<\/code> instead."]], ["controlMessage", ["lost", "Set on control messages by the gateway and controller; no code reads it to treat them differently."]], ["sequenceId, sequenceNumber, sequenceSize", ["lost", "Set by Splitter. No node re-orders or waits for the full set; Aggregate merges by count or time."]], ["priority", ["part", "Used only to order a batch of control commands. Data messages are not prioritised. The run scheduler has its own separate priority."]], ["correlationId", ["part", "Set by Splitter, read by ContentFilter for its allow-list. Nothing matches requests to replies."]]]}, {"title": "Limits and defaults", "lede": "Numbers a reader may need.", "head": ["Item", "Value"], "rows": [["History cap", ["info", "64 entries (constant, not configurable)"]], ["Envelope size", ["info", "22 record components, 22 accessors, 18 withers"]], ["Payload size limit", ["lost", "None in this module. Core's checkpoint caps limit replay, not the message."]], ["Payload type", ["info", "Plain Java object; no schema. Read back from checkpoints as JSON values."]], ["Provider call frequency", ["info", "Once per node when the graph is assembled, not per message."]], ["Default channel", ["info", "Pass-through, one shared instance for all nodes."]]]}]}, "ref": [{"id": "fields", "title": "Envelope field table", "lede": "Every field, who sets it today, and who reads it. Verified against core and the plugins in the repository.", "head": ["Group", "Fields", "Who sets them", "Who reads them"], "rows": [["Identity", "id, traceId", "<code>create<\/code> (random id; trace from the trigger or null). Kept by <code>from<\/code> and all withers.", "Core logs and checkpoints; id is the key for retries and stores."], ["Identity", "correlationId, replyTo", "Plugins. Splitter sets correlation to the parent's id and copies reply-to.", "ContentFilter reads them. Nothing routes replies."], ["Time", "timestamp", "Set at construction. <code>from<\/code> keeps the original; Splitter copies the parent's.", "Plugins and logs."], ["QoS", "expiration, formatIndicator", "Splitter copies them from the parent.", "Nothing."], ["QoS", "priority, controlMessage", "Control gateway and the node-command endpoint set them on commands. Splitter copies priority.", "Control bus sorts a batch by priority. Nothing reads the flag."], ["Routing", "sourcePort", "Plugins (<code>default<\/code>, named ports, <code>error<\/code>). Core's retry policy and PluginGuard set <code>error<\/code>.", "Core edge filter."], ["Routing", "sourceNodeId", "Core, on every edge. The control bus sets a fixed source name on commands.", "Control bus (to find the target node)."], ["Routing", "workflowId", "Only the node-command endpoint sets it today.", "Control bus. Data messages do not carry it."], ["Sequence", "sequenceId, sequenceNumber, sequenceSize", "Splitter.", "ContentFilter (sequence id). No reordering."], ["Dead letter", "origDest, failureReason, exceptionDetail", "<code>withFailure<\/code>: core's retry policy, PluginGuard, Branch, Splitter, ContentFilter, RecipientList, Validate.", "Dead-letter terminals and loggers."], ["Dead letter", "retryCount", "Nobody.", "Nobody."], ["Lineage", "messageHistory", "Core only, once per node.", "Debugging and checkpoints. Capped at 64."], ["Free-form", "metadata", "Many plugins (HTTP status, LLM usage, process output...). Core adds <code>failure.attempts<\/code>, <code>failure.exception<\/code>, <code>failure.time<\/code>.", "Plugins and expressions."], ["Body", "payload", "Every plugin.", "Every plugin; core echoes a truncated text of it into run log lines."]]}, {"id": "dos", "title": "Do and don't for plugin authors", "lede": "Short rules that follow from the guarantees.", "head": ["Do", "Don't"], "rows": [["Derive from the input: <code>DefaultMessage.from(in, newPayload)<\/code> or <code>in.withPayload(...)<\/code>, so trace, id, history and metadata survive.", "Don't call <code>create<\/code> inside a processor unless you really produce a new logical message (split children, aggregates). It resets identity and history."], ["Add information with <code>withHeader(key, value)<\/code> or <code>withMetadata(map)<\/code>.", "Don't expect a null header to be stored. A null value removes the key, and a null key throws."], ["Set <code>withSourcePort(port)<\/code> when you emit to a named port, and use the declared port names.", "Don't emit a port no edge listens for. The message is silently dropped."], ["Use <code>toBuilder()<\/code> when changing several fields, to make one copy instead of several.", "Don't call <code>withAddedHistory<\/code>. Core stamps every node once; a second stamp duplicates the entry."], ["Treat the payload and metadata values as read-only: copy before you change a list or map.", "Don't mutate a payload object in place. Sibling branches share the same object."], ["Key any store by (execution id, node id, message id).", "Don't key by message id alone. The id is logical and stays the same through the nodes."], ["Use <code>withFailure<\/code> plus source port <code>error<\/code> when you want a message to go to the error edge.", "Don't rely on <code>expiration<\/code>, <code>replyTo<\/code>, <code>retryCount<\/code> or <code>controlMessage<\/code> having any effect."]]}], "quality": [{"n": "Scalability", "pos": "The module has no state, so it scales with whatever uses it. The question is the envelope's weight when many messages flow: each wither copies 22 fields and metadata is copied per header change. History is capped so copies do not grow with length.", "ceil": ["Copy cost is proportional to metadata size at every header change", "Payload is carried by reference, so it is as large as the plugin makes it", "One provider for the whole server; no per-run channel state in the SPI", "In-process Flux only; no proof of a cross-machine transport"], "have": ["History cap of 64", "Singleton direct channel, no extra operators", "Builder to batch several changes into one copy"], "need": ["A measured limit for payload and metadata size", "A defined remote or durable channel contract before scale-out", "Optionally a cheaper copy path for header-only changes"]}, {"n": "Performance", "pos": "Per message the default cost is small: a few record copies per node and one list append. The channel adds nothing. In our view the module is not a bottleneck; the cost shows up when payloads are large or headers are rewritten many times per node.", "ceil": ["Each wither allocates a new 22-field record", "Each header change copies the whole metadata map (an unmodifiable copy is rebuilt)", "Constructor does null checks, a stream scan of metadata values and a list copy for every instance"], "have": ["Pass-through channel with identical stream objects", "Short-circuit when metadata has no nulls (copy only)", "Capped history keeps copies constant"], "need": ["A micro-benchmark for the envelope under a realistic header load", "Guidance on when to use <code>toBuilder()<\/code>"]}, {"n": "Availability", "pos": "Barely applies: the module holds no state and does no I/O, so it cannot be down by itself. Its availability story is about what a replacement channel could do to the node's stream.", "ceil": ["A faulty custom channel can fail every node in the run (its errors are outside the retry policy)", "Two competing provider beans stop the server from starting", "No acknowledgement or redelivery in the SPI"], "have": ["Default channel cannot fail", "Immutable messages make sharing safe in concurrent branches", "Constructor tests for odd inputs"], "need": ["A documented failure contract for channels (retry, error port, or fail)", "A startup check that exactly one provider exists, with a clear message"]}, {"n": "Security", "pos": "No authentication, no network and no secrets here. The relevant points are trust in header values and what travels in a message. The module does not sign, validate or encrypt anything, and the envelope makes no secrecy promise.", "ceil": ["Any plugin can set trace id, correlation id, workflow id, priority or control flag on a message it emits", "Core overwrites only the source node; other identity fields are unverified", "Payload and metadata may hold secrets; core echoes a truncated payload into run log lines", "A custom channel runs inside the JVM with full access to every message"], "have": ["Source node is set by core, not by plugins", "Unmodifiable copies protect the envelope from accidental changes", "Channel hook exists, so signing or encryption could be added in one place"], "need": ["A rule on which headers plugins may set", "A redaction hook or marker for sensitive headers", "A review of what the control flag is meant to do"]}, {"n": "Operability", "pos": "Little to operate. The visible pieces are the history list, the trace id and the failure headers, which together explain most of a message's journey. There is no metric from this module.", "ceil": ["No counters for dropped null headers or truncated history", "No indication that a custom channel is active (no log or metric from the default wiring)", "History truncation leaves no marker"], "have": ["Trace id and history in every message", "Failure fields and headers on dead letters", "Tests documenting each rule"], "need": ["A startup log naming the active channel provider", "A header or flag that says history was truncated"]}, {"n": "Evolvability", "pos": "The envelope is the most widely shared type in the codebase. A new field touches the interface, the record, two hand-written copy paths and the tests, and then ripples through every module's rebuild. The channel SPI is small and easy to extend, but untested beyond a pass-through.", "ceil": ["40-method interface with one implementation", "Two copy paths list all 22 fields by hand (<code>from<\/code> and <code>withPayload<\/code>)", "Payload typed as a plain Object, so a schema change is invisible to the compiler", "Fields carried but unused tempt future code to rely on them"], "have": ["Record and Lombok withers cut the boilerplate", "Builder with <code>toBuilder<\/code>", "Tests for immutability and the cap", "A clear note in the interface for the history rule"], "need": ["A single copy path (for example builder only) so a new field cannot be missed", "A decision to remove or enforce each unenforced field", "A typed or schema-checked payload option"]}], "risks": [{"id": "unenforced", "t": "About eight envelope fields are carried but never acted on", "a": "Functionality", "i": 3, "e": 3, "c": ["env", "ops", "route"], "why": "The envelope offers expiration, reply-to, format indicator, retry count, control flag and the sequence fields, and gives them real accessors and withers. Nothing reads them to change behaviour. A plugin author who sets <code>expiration<\/code> expects the message to be dropped when late; it is delivered anyway. Whoever reads <code>retryCount<\/code> sees zero because the engine counts attempts in a header instead. Each unused field is a promise the code does not keep.", "o": "Enforce the ones that matter (an expiry check in the inbound hook; a sequence-aware aggregate) and delete or mark the rest as reserved. Or document each as informational in the interface.", "q": "Which of these fields do you want as real features in the next year, and which should be deleted so nobody trusts them?"}, {"id": "remoteSpi", "t": "The channel SPI is unproven for remote or durable transport", "a": "Evolvability", "i": 4, "e": 4, "c": ["spi", "direct"], "why": "The SPI takes a Reactor stream of in-process objects and returns one. There is no acknowledgement, no redelivery, no serialisation rule and no signal for 'the other side is slow'. The only implementation does nothing. If a team plugs a network or disk transport into this hook, they will discover the missing contract the hard way.", "o": "Write the contract first: what a channel must do on failure, whether it may drop, how it signals back-pressure, how messages are encoded. Build one real channel (for example a durable file channel) to test it.", "q": "Is this SPI meant to carry messages between machines, or only to decorate local streams? The answer decides how much contract it needs."}, {"id": "conditionalOrder", "t": "The default-provider override depends on Spring bean order", "a": "Reliability", "i": 3, "e": 2, "c": ["wire", "spi"], "why": "The default provider is guarded by <code>@ConditionalOnMissingBean<\/code>, a condition built for auto-configuration classes that Spring processes last. Here it is on a normal class found by component scanning, with no auto-configuration registration. A custom provider declared in a class that Spring reads later could end up registered next to the default. Core would then see two providers and the server would not start. In our view the tests only prove the easy order.", "o": "Register the default through <code>AutoConfiguration.imports<\/code>, or make the provider injection tolerate several beans with a clear rule, or add a startup check that fails with an explicit message.", "q": "Has any team actually added a custom provider in a scanned class, and in which order did Spring read it?"}, {"id": "payloadSize", "t": "No payload size limit or claim check", "a": "Performance", "i": 4, "e": 4, "c": ["impl", "ops"], "why": "The payload is any Java object and nothing here limits its size. Each message is carried through memory and copied into checkpoint files by core. A 50 MiB payload is passed by reference between nodes but is also serialised to JSON for the checkpoint, and cannot be replayed once it passes core's cap. This is the messaging side of core's large-payload risk.", "o": "Add a claim-check pattern: store the large body elsewhere and carry only a reference in the message. Add an optional size check in the inbound hook.", "q": "What is the largest message you expect within a year, and who should refuse it: the envelope, the channel or the plugin?"}, {"id": "untypedPayload", "t": "Payload is an untyped Object with no schema", "a": "Correctness", "i": 3, "e": 4, "c": ["env", "impl"], "why": "<code>Message&lt;T&gt;<\/code> has a type parameter, but every stream in the engine is <code>Flux&lt;Message&lt;?&gt;&gt;<\/code>, so the type is erased at the boundary. Producers and consumers agree only by convention. A checkpoint read-back turns the payload into plain JSON values, so a plugin that stored a Java record gets a map after a resume. The <code>formatIndicator<\/code> field was meant to carry this information, but nobody uses it.", "o": "Add an optional schema or type hint that is checked by the inbound hook; or define a canonical payload model (JSON tree) and say so.", "q": "Should the engine promise that a payload survives a resume with its original type, or only as a JSON tree?"}, {"id": "wideContract", "t": "A 40-method interface with a single implementation", "a": "Evolvability", "i": 2, "e": 3, "c": ["env", "impl", "build"], "why": "The interface has 22 accessors and 18 withers, and only one class implements it. Every new field means edits in the interface, the record, two copy paths and the tests. In our view the interface adds change cost without the benefit of alternative implementations, and the 22-slot record is already large.", "o": "Keep the interface small (read-only accessors plus a few core withers) and let the record carry the rest; or accept the width and add a test that fails when a field is not copied.", "q": "Do you expect a second implementation, for example a lazy one for large payloads? If not, why keep the interface?"}, {"id": "copyDrift", "t": "Two hand-written copy paths must list all 22 fields", "a": "Correctness", "i": 3, "e": 2, "c": ["impl", "fact"], "why": "The instance <code>withPayload<\/code> and the static <code>from<\/code> each copy every field one by one. If a new field is added to the record and one path is forgotten, derived messages silently lose it. One test checks <code>from<\/code> field by field today. Nothing prevents the paths from drifting.", "o": "Implement both through <code>toBuilder()<\/code> (which copies all fields) and change only the payload; or generate the copy.", "q": "Would a test that compares all record components by reflection be enough, or should the copy be done by the compiler?"}, {"id": "shallowImmutable", "t": "Immutability is shallow: payload and header values are shared", "a": "Correctness", "i": 3, "e": 3, "c": ["impl", "ops", "stamp"], "why": "The envelope itself cannot change, but the payload object and every object stored in metadata are shared by reference. Core fans out the same message to every child. If one plugin edits a list inside the payload, a sibling branch sees the edit, possibly half-way through its own work. Bugs of this kind show up rarely and are hard to reproduce.", "o": "Document 'payloads are read-only'; add defensive copies in plugins that edit; or provide a payload copier or freeze step for collections in the inbound hook.", "q": "Would you pay a copy per fan-out to make payloads safe, or rely on plugin discipline?"}, {"id": "historyCap", "t": "History capped at 64 loses lineage in long chains and loops", "a": "Operability", "i": 2, "e": 2, "c": ["impl", "stamp"], "why": "Only the last 64 node ids are kept and nothing records that older entries were dropped. A message that loops or passes through many nodes loses the beginning of its journey. A reader cannot tell 'started at node 1' from 'the first 40 were dropped'. The trace id and checkpoints remain, so lineage can still be rebuilt elsewhere.", "o": "Keep a counter of dropped entries, or the first entry plus the last N. Or move lineage to the tracker and keep only a short window in the message.", "q": "What question do you want history to answer, and is a sliding window enough for it?"}, {"id": "lineageReset", "t": "Split and aggregate restart history and identity", "a": "Correctness", "i": 3, "e": 3, "c": ["fact", "stamp"], "why": "Splitter and Aggregate build their outputs with <code>create<\/code>. A split child has a new id and an empty history. An aggregate keeps only the trace id of the first message in the batch and drops metadata, correlation and sequence. After either node, lineage questions ('where did this come from?') can be answered only through the trace id and the child's correlation id. The behaviour is deliberate but not written down as a rule.", "o": "Carry the parent's history (or a link to it) into children and a list of source ids into an aggregate. Document the rule either way.", "q": "After a split, is a child 'the same message' or 'a new one with a parent'? The answer decides what lineage means."}, {"id": "skipBypass", "t": "A processor skipped at assembly bypasses the channel", "a": "Correctness", "i": 2, "e": 2, "c": ["spi"], "why": "If an operator marks a processor to be skipped before the graph is built, core wires its input straight to its output, with no channel at all. A custom channel that audits, signs or meters every message would miss it. The history stamp still happens, because it is part of node decoration, not the channel. A node skipped later at run time still goes through the channel.", "o": "Call the channel on both paths, or document that a skipped node is outside the channel.", "q": "Should a skipped node still be visible to an audit channel, as 'passed through unchanged'?"}, {"id": "channelErrors", "t": "Channel errors are outside the node's retry and error-port policy", "a": "Reliability", "i": 3, "e": 3, "c": ["spi"], "why": "Core's per-message retry and error routing wrap the plugin call. The channel wraps the stream around it. An exception thrown in <code>inbound<\/code> or <code>outbound<\/code> therefore fails the node's stream instead of being retried or sent to the error port, and one bad message can stop the node. The default channel cannot throw, so this is untested.", "o": "Define the failure contract for channels. For example, run the channel inside the policy for per-message channels, or document that it must never throw.", "q": "If a channel fails on one message, should that message dead-letter, or should the whole node stop?"}, {"id": "idNotUnique", "t": "The message id is logical, not unique per node output", "a": "Correctness", "i": 2, "e": 2, "c": ["env", "fact"], "why": "Because <code>from<\/code> keeps the id, the same id appears on the output of every node that derives from it, and on retries. A store or log that uses the id alone as a key will overwrite. The interface says so, but the field is called 'id' and invites misuse. Core's checkpoint store keys by (execution, node, id) for this reason.", "o": "Add a separate per-output sequence or a 'lineage id' field; or rename the accessor to make the meaning obvious.", "q": "Do you need a unique id per output, for tracing a single hop?"}, {"id": "forgeable", "t": "Identity and control fields are unverified", "a": "Security", "i": 3, "e": 3, "c": ["ops", "env"], "why": "A plugin can set trace id, correlation id, workflow id, priority and the control flag on any message it emits. Core overwrites only the source node. Today the control flag is not read and the control bus ignores data messages, so the exposure is small. Another consumer could one day trust one of them. In our view the module should say which headers are trusted.", "o": "Define which headers are engine-owned and re-stamp them in core, as with the source node; or sign engine-owned headers.", "q": "Which headers should a plugin never be able to set?"}, {"id": "metadataCopy", "t": "Every header change copies the whole metadata map", "a": "Performance", "i": 2, "e": 2, "c": ["impl", "ops"], "why": "<code>withHeader<\/code> copies the map into a mutable one, changes it, then the constructor copies it again into an unmodifiable one and scans it for nulls. A plugin that sets ten headers one by one does it ten times, each time a bit bigger. Fine for a handful of headers; a cost for metadata-heavy flows like LLM usage or HTTP response headers.", "o": "Offer a bulk <code>withHeaders(map)<\/code>, or make plugins use <code>toBuilder().metadata(...)<\/code>. Measure first.", "q": "How many headers does a typical message carry by the end of a workflow?"}, {"id": "nullSilent", "t": "Null header values vanish silently", "a": "Correctness", "i": 2, "e": 1, "c": ["ops", "impl"], "why": "Setting a header to null removes it, and a map with null values has those entries dropped, without a log or an error. A plugin that sets a header to null to mean 'unknown' will see the key disappear and may then treat it as 'never set'. The rule is documented and tested, but it differs from how a plain map behaves.", "o": "Keep the rule but add a sentinel for explicit absence, or log at debug level when entries are dropped.", "q": "Is 'unset' and 'null' the same thing for your headers?"}], "riskNote": "Risk ids are descriptive names. Old review items M1 to M13 for this module are all fixed and are not listed. No backlog identifiers apply to the remaining items.", "adrs": [{"t": "An immutable record envelope with withers", "ctx": "A message is handed to several branches at once and passes through many plugins written by different people.", "dec": "The message is a Java record. Maps and lists are copied into unmodifiable versions at construction. Changes return new instances.", "con": "Safe sharing across branches and simple reasoning; every change allocates a copy; immutability is shallow, so payloads can still be mutated.", "alt": "A mutable bean: cheaper changes, but one branch could break another and ordering bugs would be hard to find. A fully deep-copied message on every hop: safe but far too expensive for large payloads.", "rev": "payload mutation causes a real bug, or copy cost shows up in profiles."}, {"t": "Enterprise-integration headers in the envelope", "ctx": "The module was modelled on classic messaging patterns (envelope, correlation, sequence, dead letter, return address).", "dec": "The envelope carries identity, routing, sequence, QoS and dead-letter fields from the start, even if the engine does not use them yet.", "con": "Plugins have the vocabulary; some fields are unused and mislead; every addition widens the interface.", "alt": "A minimal envelope (id, payload, headers map) and put everything else in headers: smaller and easier to change, but loses typed, discoverable fields.", "rev": "a field stays unused after a year, or a feature needs one that is missing."}, {"t": "Node-level channel hook instead of a transport between nodes", "ctx": "Edges are Reactor streams with back-pressure, and the project may need remote or durable transport later.", "dec": "Core calls a provider once per node and wraps input and output with a channel. The default is a no-op pass-through.", "con": "One seam for audit, encryption or transport; zero cost today; the hook is coarse and its failure contract is undefined.", "alt": "A message broker between every pair of nodes: durable but adds latency and loses end-to-end back-pressure. No hook at all: simplest, but retrofitting needs core changes.", "rev": "a concrete need for remote or durable delivery appears."}, {"t": "Plugin-replaceable default through a conditional bean", "ctx": "Deployments should be able to replace the channel without changing core.", "dec": "The default provider is registered with <code>@ConditionalOnMissingBean<\/code> in a scanned configuration; a custom bean wins.", "con": "Replacing needs one bean and no code change; the outcome depends on Spring ordering.", "alt": "Auto-configuration registration: the intended home for this condition. An explicit property selecting the provider: clear, but needs a name registry. An optional dependency injected with a default: simple, but hides which one is active.", "rev": "the first real custom provider is added, or two providers conflict at startup."}, {"t": "Core stamps history, once per node", "ctx": "Plugins are written by many people and cannot be trusted to record where a message has been.", "dec": "Core appends the node id to every message after the node's output. Plugins must not. The list is capped at 64.", "con": "Uniform, complete history for the retained window; lineage is lost beyond 64 and across split and aggregate.", "alt": "Plugins stamp themselves: flexible, but duplicates and gaps. Store lineage in the tracker only: unbounded, but not visible to plugins and not carried in checkpoints.", "rev": "a feature needs complete lineage over long or looping flows."}, {"t": "The id is a logical id, kept across derivation", "ctx": "A retry or a derived message is still the same piece of work, and stores must recognise it.", "dec": "<code>from<\/code> and <code>withPayload<\/code> keep the id; <code>create<\/code> makes a new one. Stores key by (execution, node, id).", "con": "Retries and enrichment keep one id; the id is not unique per node output.", "alt": "A new id at every node plus a parent id link: unique per hop but needs a lineage map and breaks 'stable id for idempotency'. A separate lineage id: both properties, one more field.", "rev": "single-hop tracing or exactly-once keyed storage needs a unique id per output."}, {"t": "Messaging as a tiny, dependency-light bottom module", "ctx": "Core, plugin-api and every plugin share the envelope. Any dependency becomes everyone's dependency.", "dec": "The module depends only on Reactor and Spring Boot autoconfigure, both as 'api', and plugin-api re-exports it.", "con": "Plugins need one import; the module's two dependencies become part of every plugin's classpath; changes to the interface rebuild everything.", "alt": "Merge it into plugin-api: fewer modules but core would then depend on the plugin contract. Hide Reactor behind our own stream type: cleaner but heavy and slower.", "rev": "plugins need to ship without Reactor or Spring on their classpath."}], "evo": [{"id": "now", "n": "Today", "d": "One immutable envelope, one pass-through channel, core stamps history and routes by port. Several fields carried but unused.", "r": []}, {"id": "clean", "n": "Decide the unused fields", "d": "For each unenforced field choose: enforce it (for example an expiry check), or remove it. Make <code>from<\/code> and <code>withPayload<\/code> use one copy path.", "r": ["unenforced", "copyDrift", "wideContract"]}, {"id": "contract", "n": "Define the channel contract", "d": "Write what a channel may do on failure, how it signals slowness, and fix the registration through auto-configuration. Make skipped nodes consistent.", "r": ["channelErrors", "conditionalOrder", "skipBypass"]}, {"id": "payload", "n": "Payload model", "d": "Choose a payload story: a canonical JSON tree, an optional schema, and a claim check for large bodies.", "r": ["payloadSize", "untypedPayload", "shallowImmutable"]}, {"id": "lineage", "n": "Better lineage", "d": "Carry history through split and aggregate, record truncation, and add a per-output id if needed.", "r": ["historyCap", "lineageReset", "idNotUnique"]}, {"id": "remote", "n": "A real second channel", "d": "Build one durable or remote channel to prove the SPI, and trusted-header rules for it.", "r": ["remoteSpi", "forgeable"]}], "prompts": [["Evolution", "Name one field of the envelope you would delete today, and one you would enforce. What breaks for each?", "env", "unenforced"], ["Scale", "If the SPI had to carry messages to another machine, which five questions must its contract answer first?", "spi", "remoteSpi"], ["Correctness", "A plugin mutates a list inside its payload. Which other branches can see it, and when would anyone notice?", "impl", "shallowImmutable"], ["Performance", "A message becomes 50 MiB. Which components copy it, and which only pass a reference?", "impl", "payloadSize"], ["Security", "Which headers can a malicious plugin set that an operator would trust, and which should core re-stamp?", "ops", "forgeable"], ["Operability", "You debug a message that went through 80 nodes. What can you still see in its history, and what can you rebuild from elsewhere?", "stamp", "historyCap"], ["Failure", "A custom channel throws on one message. What does the user see, and which component should decide?", "spi", "channelErrors"], ["Design", "After a split, is each child the same message or a new one? What should its history say?", "fact", "lineageReset"], ["Evolvability", "Is the 40-method interface worth keeping if only one implementation will ever exist?", "env", "wideContract"], ["Operability", "How would you know which channel provider is active in production, and how would two providers be diagnosed?", "wire", "conditionalOrder"]], "gloss": [["Message", "  var d=$("#r-"+id);if(d){d.open=true;d.classList.add("hl");d.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(function(){d.classList.remove("hl")},2000)}}
$("#copyBtn").onclick=function(){var md="# Yukta "+MOD+": my architecture notes\n\n";var any=false;D.risks.forEach(function(r){var n=notes[r.id];if(!n)return;any=true;md+="## "+r.t+"\n- Attribute: "+r.a+" · impact "+r.i+" · effort "+r.e+"\n"+(n.s?"- Status: "+n.s+"\n":"")+(n.n?"- Note: "+n.n.replace(/\n/g,"\n  ")+"\n":"")+"\n"});
 var msg=$("#copyMsg"),ta=$("#copyArea");if(!any){msg.textContent="Nothing to copy yet. Set a status or note first.";return}
 ta.hidden=false;ta.value=md;ta.rows=10;
 var done=function(){msg.textContent="Copied."},fail=function(){msg.textContent="Select the text below and copy it."};
 try{navigator.clipboard.writeText(md).then(done,fail)}catch(e){fail()}};
board();

/* ---- jumps ---- */
document.addEventListener("click",function(e){var r=e.target.closest("[data-risk]");if(r){e.preventDefault();openRisk(r.getAttribute("data-risk"));return}
 var c=e.target.closest("[data-comp]");if(c){e.preventDefault();pick(c.getAttribute("data-comp"));$("#map").scrollIntoView({behavior:"smooth"})}});
document.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target;if(t.matches&&t.matches("a.chip,.dot")){e.preventDefault();t.click?t.click():0}});

/* ---- prompts ---- */
if(D.prompts&&D.prompts.length){var pi=0;
 var deck=function(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
  $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}};
 deck()}
/* ---- glossary ---- */
function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
</script>
