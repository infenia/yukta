<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta Messaging Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0}
pre code{background:none;padding:0}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:56px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
.lede{color:var(--muted);max-width:760px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul,.card ol{padding-left:18px;margin:6px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;text-decoration:none}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"]{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"]{color:#111}}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);min-width:220px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pipe{width:100%;height:auto;display:block}
.pipe .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2;transition:fill .15s,stroke .15s}
.pipe .box text{fill:var(--text);font:600 13px var(--sans)}
.pipe .box .s{fill:var(--muted);font:12px var(--mono)}
.pipe .box.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.pipe .arrow{stroke:var(--muted);stroke-width:1.4;fill:none}
.pipe .box{cursor:pointer}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.stepbody h3{margin-top:0}
.refs{font-size:13px;color:var(--muted)}
.flag{border-left:3px solid var(--p1);background:var(--p1-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:10px;font-size:14px}
.flag.p0{border-color:var(--p0);background:var(--p0-soft)}
.pkgs{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.pkglist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:6px;padding:7px 10px;background:transparent;font-family:var(--mono);font-size:12.5px}
.pkglist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.finding{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.finding summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}
.finding summary::-webkit-details-marker{display:none}
.finding .id{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:30px}
.finding .t{font-weight:600}
.finding .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.finding .body{padding:0 14px 14px 14px;border-top:1px solid var(--line)}
.finding .body dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;margin:12px 0 0}
.finding .body dt{color:var(--muted);font-size:13px}
.finding .body dd{margin:0;min-width:0;overflow-wrap:anywhere}
.finding.done{opacity:.55}
.finding.done .t{text-decoration:line-through}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.progress .bar{flex:1;height:8px;margin:0}
.progress .bar>i{background:var(--ok)}
.empty{color:var(--muted);padding:20px;text-align:center}
.score td:nth-child(2){font-family:var(--mono);white-space:nowrap}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.pkgs{grid-template-columns:1fr}
  .finding summary{grid-template-columns:auto minmax(0,1fr)}
  .finding .meta{grid-column:1/-1}
  .finding .body dl{grid-template-columns:1fr}
}
</style>
</head>
<body>

  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
</nav>
<main id="main"></main>
</div>

var DATA = {"module": "messaging", "htmlTitle": "Yukta Messaging Guide", "title": "messaging module guide", "date": "2026-10-09", "lede": "The <code>Message&lt;T&gt;<\/code> envelope that travels on every DAG edge, the <code>NodeMessageChannel<\/code> hook wrapped around every plugin, and the optional <code>MessageStore<\/code> wire-tap.", "stats": [["11", "main files"], ["≈1.03k", "main lines"], ["7", "test classes"]], "overviewHtml": "<h3>Design in one paragraph<\/h3><p><code>DefaultMessage<\/code> is an immutable record with 22 components: identity (id, trace, correlation), routing (sourceNodeId, sourcePort, workflowId), EIP headers (sequence, priority, control flag, dead-letter fields, retry count), free-form <code>metadata<\/code>, <code>messageHistory<\/code>, and the payload. Every change goes through a <code>with*<\/code> method that returns a new instance. For each node, core asks a <code>NodeMessageChannelProvider<\/code> for a channel and wraps the plugin's input with <code>inbound()<\/code> and its output with <code>outbound()<\/code>. The default <i>direct<\/i> channel is a no-op. The <i>persisting<\/i> channel would tee output into a <code>MessageStore<\/code>, but there is no store implementation today.<\/p>", "score": [["Envelope design", "3.5/5", "Immutable, EIP-complete. Two accessor styles"], ["Correctness", "3/5", "Duplicate history, null-metadata NPE"], ["Performance", "3/5", "O(n) history copy per hop"], ["Simplicity", "2/5", "About 200 lines of manual withers, dead persistence path"], ["Tests", "4/5", "Good ratio"]], "flowTitle": "A message's journey through one node", "steps": [{"k": "Create", "cls": "Trigger plugin → DefaultMessage.create", "d": "A trigger builds a message with <code>DefaultMessage.create(traceId, payload)<\/code>: a random UUID id, the current timestamp, empty metadata and history.", "f": ["M2"]}, {"k": "Route in", "cls": "core StreamTopologyDecorator.applyEdgeRouting", "d": "For each parent edge, core stamps <code>withSourceNodeId(parent)<\/code> and filters by <code>getSourcePort()<\/code> when the edge names a port.", "f": []}, {"k": "Inbound", "cls": "NodeMessageChannel.inbound", "d": "The channel can transform the plugin's input. Both implementations pass it through unchanged.", "f": ["M9"]}, {"k": "Plugin", "cls": "Processor.process / withPayload / withHeader", "d": "The plugin derives new messages with <code>withPayload<\/code>, <code>withHeader<\/code>, <code>withSourcePort<\/code> and so on. Each call rebuilds all 22 fields. Internal-core routers also call <code>withAddedHistory(nodeId)<\/code>.", "f": ["M1", "M2", "M4", "M6", "M7"]}, {"k": "Outbound", "cls": "NodeMessageChannel.outbound", "d": "Direct: pass-through. Persisting: <code>flatMap(store)<\/code> (never active, because no store exists).", "f": ["M9", "M10"]}, {"k": "Stamp", "cls": "core StreamTopologyDecorator.applyLoggingAndBroadcasting", "d": "Core appends <code>nodeId<\/code> to <code>messageHistory<\/code> for every node. Together with the plugin's own stamp, that duplicates entries, and each append copies the list twice.", "f": ["M1", "M5"]}, {"k": "Fan out", "cls": "core multicast sink", "d": "The message is checkpointed, echoed to the log, and multicast to every child edge.", "f": []}], "pkgTitle": "Class explorer", "pkgs": [["Message", 1, 350, "The envelope interface: 25 getters and 19 withers, grouped into header, history, sequence, QoS, dead-letter and payload sections.", "com.infenia.yukta.message.Message"], ["DefaultMessage", 1, 431, "The only implementation. A record with 22 components, Lombok <code>@With<\/code> on 12 of them, and 7 hand-written copy methods plus the <code>from<\/code> and <code>create<\/code> factories.", "com.infenia.yukta.message.DefaultMessage"], ["channel (direct)", 3, 69, "<code>DirectNodeMessageChannel<\/code> (pass-through), its provider (singleton), and the <code>@ConditionalOnMissingBean<\/code> configuration.", "com.infenia.yukta.message.channel"], ["channel (persisting)", 3, 100, "<code>PersistingNodeMessageChannel<\/code> (outbound wire-tap), its provider (a new instance per node), and the <code>@ConditionalOnBean(MessageStore)<\/code> configuration. Inactive.", "com.infenia.yukta.message.channel"], ["channel SPI", 2, 51, "<code>NodeMessageChannel<\/code> (inbound/outbound) and <code>NodeMessageChannelProvider<\/code> (<code>channelFor(nodeId, config)<\/code>).", "com.infenia.yukta.message.channel"], ["store", 1, 29, "<code>MessageStore<\/code>: <code>store(Message)<\/code> and <code>get(id)<\/code>. No implementation in the repo.", "com.infenia.yukta.message.store"], ["build.gradle.kts", 1, 10, "<code>api(spring-boot-starter-webflux)<\/code>, re-exported through plugin-api to every plugin.", "messaging/build.gradle.kts"]], "sections": [{"id": "fields", "title": "Envelope fields", "lede": "What each header is for, and whether anything reads it today.", "html": "<div class=\"card tablewrap\"><table><tr><th>Group<\/th><th>Fields<\/th><th>Used by<\/th><\/tr><tr><td>Identity<\/td><td><code>id, traceId, correlationId, replyTo<\/code><\/td><td>Splitter (correlation), routers (log), traces<\/td><\/tr><tr><td>Routing<\/td><td><code>sourceNodeId, sourcePort, workflowId<\/code><\/td><td>core edge routing and port filters<\/td><\/tr><tr><td>Sequence<\/td><td><code>sequenceId, sequenceNumber, sequenceSize<\/code><\/td><td>Splitter. <code>isLastInSequence<\/code> has no caller<\/td><\/tr><tr><td>QoS / control<\/td><td><code>priority, controlMessage, expiration, formatIndicator<\/code><\/td><td>Splitter copies them. Nothing enforces <code>expiration<\/code><\/td><\/tr><tr><td>Dead letter<\/td><td><code>origDest, failureReason, exceptionDetail, retryCount<\/code><\/td><td><code>withFailure<\/code> in routers. No retry consumer<\/td><\/tr><tr><td>Lineage<\/td><td><code>messageHistory<\/code><\/td><td>core plus internal-core plugins (stamped twice, see M1)<\/td><\/tr><tr><td>Free-form<\/td><td><code>metadata<\/code><\/td><td>Many plugins. Null values throw (M2)<\/td><\/tr><\/table><\/div>"}, {"id": "usage", "title": "Using messages in a plugin", "html": "<div class=\"grid g2\"><div class=\"card\"><h3>Do<\/h3><pre><code>// derive, never mutate\nreturn in.map(m -&gt; m\n    .withPayload(transform(m.getPayload()))\n    .withHeader(\"x-step\", \"done\"));<\/code><\/pre><ul><li>Keep the trace and correlation IDs: derive from the input message.<\/li><li>Set <code>withSourcePort(port)<\/code> when emitting to a named port.<\/li><li>Use <code>DefaultMessage.create<\/code> only for new logical messages, such as split children.<\/li><\/ul><\/div><div class=\"card\"><h3>Don't<\/h3><ul><li>Don't call <code>withAddedHistory<\/code>. Core stamps history (M1).<\/li><li>Don't put <code>null<\/code> into metadata or headers (M2).<\/li><li>Don't chain many withers in hot loops. Each one allocates a full copy (M6).<\/li><li>Don't depend on <code>MessageStore<\/code>. There is no implementation yet (M9).<\/li><\/ul><\/div><\/div>"}], "findings": [{"id": "M1", "sev": "P1", "area": "Correctness", "pkg": ["DefaultMessage"], "t": "Each internal-core plugin node appears twice in message history", "where": "Branch/RecipientList/Splitter/ContentFilter/Filter processors call withAddedHistory, and core StreamTopologyDecorator stamps every node again", "impact": "Lineage reads [filter1, filter1, branch1, branch1, …].", "fix": "Core owns stamping. Remove the plugin-side calls and document the rule.", "eff": "S"}, {"id": "M2", "sev": "P1", "area": "Correctness", "pkg": ["DefaultMessage"], "t": "Null metadata or header values throw an NPE", "where": "Compact constructor Map.copyOf; withHeader ConcurrentHashMap", "impact": "A null header or field fails the node stream.", "fix": "Reject nulls with a clear error at the boundary, or drop null entries. Pick one rule.", "eff": "S"}, {"id": "M3", "sev": "P2", "area": "Correctness", "pkg": ["DefaultMessage"], "t": "Timestamp has two representations and from() loses precision", "where": "Instant field vs getTimestamp() millis; from() uses Instant.ofEpochMilli", "impact": "Sub-millisecond precision is lost, plus an extra allocation.", "fix": "Expose the Instant and copy it directly.", "eff": "S"}, {"id": "M4", "sev": "P3", "area": "Performance", "pkg": ["DefaultMessage"], "t": "withHeader copies the metadata twice", "where": "new ConcurrentHashMap → withMetadata → Map.copyOf", "impact": "Wasted allocation.", "fix": "Use one HashMap copy.", "eff": "S"}, {"id": "M5", "sev": "P2", "area": "Performance", "pkg": ["DefaultMessage"], "t": "History append costs O(n) per hop and grows without bound in loops", "where": "withAddedHistory: new ArrayList + List.copyOf", "impact": "Quadratic work per message, and memory growth in loop workflows.", "fix": "Cap the history or make it opt-in. Use a cons-list if full lineage is needed.", "eff": "S"}, {"id": "M6", "sev": "P3", "area": "Performance", "pkg": ["DefaultMessage"], "t": "Chained withers rebuild all 22 fields each time", "where": "Splitter createChild and the routers (4–7 withers per message)", "impact": "Several allocations per message.", "fix": "@Builder(toBuilder = true) for multi-field updates.", "eff": "S"}, {"id": "M7", "sev": "P2", "area": "Simplicity", "pkg": ["DefaultMessage"], "t": "About 200 lines of hand-written copy constructors", "where": "withAddedHistory, withSequence, withControl, withFailure, withRetryCount, withPayload, from", "impact": "Error-prone when a field is added: you must edit 8 places.", "fix": "@With on every component plus toBuilder.", "eff": "S"}, {"id": "M8", "sev": "P3", "area": "Simplicity", "pkg": ["Message", "DefaultMessage"], "t": "Every field has two accessors; one implementation", "where": "Message getX() plus record x()", "impact": "API noise. 44 interface methods.", "fix": "Drop the getX duplicates, or seal the interface.", "eff": "M"}, {"id": "M9", "sev": "P2", "area": "Simplicity", "pkg": ["channel (persisting)", "store"], "t": "The persisting channel path is dead", "where": "No MessageStore implementation in the repo; @ConditionalOnBean on a component-scanned @Configuration", "impact": "Three classes and a config that never run. The condition would be unreliable anyway.", "fix": "Delete them. If kept: use concatMap, a singleton channel, and @AutoConfiguration.", "eff": "S"}, {"id": "M10", "sev": "P3", "area": "Design", "pkg": ["DefaultMessage", "store"], "t": "The message ID is kept across transformations", "where": "withPayload and from() keep the id", "impact": "A store keyed by id would overwrite each node's output.", "fix": "Document the ID semantic and key stores by (execution, node, id).", "eff": "S"}, {"id": "M11", "sev": "P2", "area": "Dependencies", "pkg": ["build.gradle.kts"], "t": "The webflux starter is exported for an envelope module", "where": "api(libs.spring.boot.starter.webflux)", "impact": "Heavy transitive dependencies for every consumer.", "fix": "Use reactor-core plus spring-context only.", "eff": "S"}, {"id": "M12", "sev": "P3", "area": "Simplicity", "pkg": ["Message"], "t": "Unused helpers", "where": "isLastInSequence, withIncrementedRetry", "impact": "Dead API.", "fix": "Keep them only if aggregator or retry features are planned.", "eff": "S"}, {"id": "M13", "sev": "P3", "area": "Docs", "pkg": ["channel (persisting)"], "t": "CLAUDE.md presents the persisting channel as live", "where": "messaging/CLAUDE.md", "impact": "Misleading.", "fix": "Update it after M9.", "eff": "S"}], "road": [["1 · Correct lineage", ["M1", "M2"], "Accurate history and no null crashes"], ["2 · Shrink", ["M7", "M9", "M11", "M13"], "About 300 fewer lines and a lighter dependency"], ["3 · Hot path", ["M5", "M6", "M3", "M4"], "Fewer allocations per hop"], ["4 · API cleanup", ["M8", "M10", "M12"], "One accessor style, clear ID semantic"]]};

  (D.score?'<h3>Scorecard</h3><div class="card tablewrap"><table class="score"><tr><th>Area</th><th>Score</th><th>Notes</th></tr>'+D.score.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+r[2]+'</td></tr>'}).join("")+'</table></div>':"")+'</section>';
if(D.steps&&D.steps.length)h+='<section id="flow"><h2>'+esc(D.flowTitle||"How it works")+'</h2><p class="lede">'+(D.flowLede||"Click a stage or step through with the buttons. Each stage names the classes involved and the review findings that touch it.")+'</p><div class="card"><svg class="pipe" id="pipe" role="img" aria-label="Flow diagram"><g id="pipeBoxes"></g></svg><div class="steps" id="stepBtns" role="tablist"></div><div class="stepbody" id="stepBody" aria-live="polite"></div></div></section>';
if(D.pkgs&&D.pkgs.length)h+='<section id="packages"><h2>'+esc(D.pkgTitle||"Package explorer")+'</h2><p class="lede">Bar width is lines of code. Select an entry to see what it owns and which findings apply to it.</p><div class="pkgs"><div class="card pkglist" id="pkgList" style="padding:8px"></div><div class="card" id="pkgDetail"></div></div></section>';
(D.sections||[]).forEach(function(s){h+='<section id="'+s.id+'"><h2>'+esc(s.title)+'</h2>'+(s.lede?'<p class="lede">'+s.lede+'</p>':"")+s.html+'</section>'});
h+='<section id="findings"><h2>Improvement board</h2><p class="lede">All review findings from <a href="'+D.module+'-improvements.md">'+D.module+'-improvements.md</a>. Filter, search and tick items off. Ticks are saved in this browser only.</p>'+
 '<div class="progress"><span id="progTxt"></span><div class="bar"><i id="progBar" style="width:0"></i></div><button type="button" id="resetBtn">Reset ticks</button></div>'+
 '<div class="filters" id="sevFilters"><span class="lbl">Severity</span></div><div class="filters" id="areaFilters"><span class="lbl">Area</span></div>'+
 '<div class="filters"><input type="search" id="q" placeholder="Search class, keyword…" aria-label="Search findings"><button type="button" id="hideDone" aria-pressed="false">Hide done</button><button type="button" id="expandAll">Expand all</button></div><div id="findingList"></div></section>'+
 '<section id="roadmap"><h2>Roadmap</h2><div class="card tablewrap"><table id="roadTable"><thead><tr><th>Phase</th><th>Items</th><th>Outcome</th><th>Done</th></tr></thead><tbody></tbody></table></div></section>';
document.getElementById("main").innerHTML=h;

/* flow */
if(D.steps&&D.steps.length){
  var NS="http://www.w3.org/2000/svg",g=document.getElementById("pipeBoxes"),S=D.steps,n=S.length,W=112,gap=Math.max(12,Math.floor((980-n*W)/Math.max(1,n-1)));
  var total=n*W+(n-1)*gap;document.getElementById("pipe").setAttribute("viewBox","0 30 "+Math.max(total,300)+" 130");
  S.forEach(function(s,i){var x=i*(W+gap),y=i%2?100:40,grp=document.createElementNS(NS,"g");
    grp.setAttribute("class","box");grp.setAttribute("data-i",i);grp.setAttribute("tabindex","0");grp.setAttribute("role","button");grp.setAttribute("aria-label",s.k);
    grp.innerHTML='<rect x="'+x+'" y="'+y+'" width="'+W+'" height="50" rx="8"/><text x="'+(x+W/2)+'" y="'+(y+22)+'" text-anchor="middle">'+esc(s.k)+'</text><text class="s" x="'+(x+W/2)+'" y="'+(y+39)+'" text-anchor="middle">step '+(i+1)+'</text>';
    g.appendChild(grp);
    if(i<n-1){var nx=(i+1)*(W+gap),ny=(i+1)%2?100:40,p=document.createElementNS(NS,"path");p.setAttribute("class","arrow");
      p.setAttribute("d","M"+(x+W)+","+(y+25)+" C"+(x+W+gap/2)+","+(y+25)+" "+(nx-gap/2)+","+(ny+25)+" "+nx+","+(ny+25));g.insertBefore(p,g.firstChild)}
    grp.addEventListener("click",function(){showStep(i)});
    grp.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();showStep(i)}})});
  var sb=document.getElementById("stepBtns");
  S.forEach(function(s,i){var b=document.createElement("button");b.type="button";b.textContent=(i+1)+". "+s.k;b.setAttribute("role","tab");b.onclick=function(){showStep(i)};sb.appendChild(b)});
  var showStep=function(i){var s=S[i];
    [].forEach.call(g.querySelectorAll(".box"),function(el){el.classList.toggle("on",+el.getAttribute("data-i")===i)});
    [].forEach.call(sb.children,function(b,j){b.setAttribute("aria-pressed",j===i?"true":"false");b.setAttribute("aria-selected",j===i?"true":"false")});
    var r=(s.f||[]).map(byId).filter(Boolean),p0=r.some(function(f){return f.sev==="P0"});
    document.getElementById("stepBody").innerHTML='<h3>'+(i+1)+'. '+esc(s.k)+'</h3><div class="refs mono">'+esc(s.cls||"")+'</div><p>'+s.d+'</p>'+
      (r.length?'<div class="flag'+(p0?" p0":"")+'"><b>Findings here:</b> '+r.map(function(f){return pillFor(f.id)+" "+esc(f.t)}).join(" · ")+'</div>':"")};
  showStep(0);
}
/* packages */
if(D.pkgs&&D.pkgs.length){
  var P=D.pkgs,maxL=Math.max.apply(null,P.map(function(p){return p[2]})),pl=document.getElementById("pkgList");
  P.forEach(function(p,i){var b=document.createElement("button");b.type="button";var c=F.filter(function(f){return (f.pkg||[]).indexOf(p[0])>=0}).length;
    b.innerHTML='<span style="min-width:0;flex:1"><span>'+esc(p[0])+'</span><span class="bar"><i style="width:'+(p[2]/maxL*100)+'%"></i></span></span><span style="margin-left:8px;color:var(--muted)">'+(c?c+"⚑":"")+'</span>';
    b.onclick=function(){showPkg(i)};pl.appendChild(b)});
  var showPkg=function(i){var p=P[i];[].forEach.call(pl.children,function(b,j){b.setAttribute("aria-pressed",j===i?"true":"false")});
    var fs=F.filter(function(f){return (f.pkg||[]).indexOf(p[0])>=0});
    document.getElementById("pkgDetail").innerHTML='<h3 class="mono" style="margin-top:0">'+esc(p[4]||p[0])+'</h3><p class="refs">'+p[1]+' files · '+p[2]+' lines</p><p>'+p[3]+'</p>'+
      (fs.length?'<h3>Findings ('+fs.length+')</h3><ul style="padding-left:18px;margin:0">'+fs.map(function(f){return '<li>'+pillFor(f.id)+' '+esc(f.t)+'</li>'}).join("")+'</ul>':'<p class="refs">No findings.</p>')};
  showPkg(0);
}
/* findings */
var SEVS=["P0","P1","P2","P3"].filter(function(s){return F.some(function(f){return f.sev===s})}),AREAS=[];
F.forEach(function(f){if(AREAS.indexOf(f.area)<0)AREAS.push(f.area)});
var sevOn={},areaOn={},hideDone=false;SEVS.forEach(function(s){sevOn[s]=true});AREAS.forEach(function(a){areaOn[a]=true});
function chip(c,label,cb){var b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed","true");
  b.onclick=function(){var v=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",v?"true":"false");cb(v);render()};c.appendChild(b)}
SEVS.forEach(function(s){chip(document.getElementById("sevFilters"),s,function(v){sevOn[s]=v})});
AREAS.forEach(function(a){chip(document.getElementById("areaFilters"),a,function(v){areaOn[a]=v})});
var q=document.getElementById("q");q.oninput=render;
var hd=document.getElementById("hideDone");hd.onclick=function(){hideDone=!hideDone;hd.setAttribute("aria-pressed",hideDone?"true":"false");render()};
document.getElementById("expandAll").onclick=function(){var ds=document.querySelectorAll("#findingList details"),o=!(ds[0]&&ds[0].open);[].forEach.call(ds,function(d){d.open=o})};
document.getElementById("resetBtn").onclick=function(){done={};store.set(KEY,done);render()};
function render(){var t=q.value.trim().toLowerCase();
  var list=F.filter(function(f){if(!sevOn[f.sev]||!areaOn[f.area])return false;if(hideDone&&done[f.id])return false;
    if(t&&(f.id+" "+f.t+" "+f.where+" "+f.impact+" "+f.fix+" "+(f.pkg||[]).join(" ")).toLowerCase().indexOf(t)<0)return false;return true});
  var el=document.getElementById("findingList");
  el.innerHTML=list.length?list.map(function(f){return '<details class="finding'+(done[f.id]?" done":"")+'" id="f-'+f.id+'"><summary><span class="id">'+f.id+'</span>'+
    '<input type="checkbox" aria-label="Mark '+f.id+' done" data-id="'+f.id+'"'+(done[f.id]?" checked":"")+'><span class="t">'+esc(f.t)+'</span>'+
    '<span class="meta"><span class="pill '+f.sev+'">'+f.sev+'</span><span class="pill P3">'+esc(f.area)+'</span><span class="pill P3">effort '+f.eff+'</span></span></summary>'+
    '<div class="body"><dl><dt>Where</dt><dd class="mono">'+esc(f.where)+'</dd><dt>Impact</dt><dd>'+esc(f.impact)+'</dd><dt>Fix</dt><dd>'+esc(f.fix)+'</dd>'+
    ((f.pkg||[]).length?'<dt>Area</dt><dd class="mono">'+esc(f.pkg.join(", "))+'</dd>':"")+'</dl></div></details>'}).join("")
    :'<div class="empty">No findings match these filters.</div>';
  [].forEach.call(el.querySelectorAll("input[type=checkbox]"),function(cb){cb.onclick=function(e){e.stopPropagation()};
    cb.onchange=function(){if(cb.checked)done[cb.dataset.id]=true;else delete done[cb.dataset.id];store.set(KEY,done);render()}});
  var k=Object.keys(done).filter(byId).length;
  document.getElementById("progTxt").textContent=k+" / "+F.length+" done";
  document.getElementById("progBar").style.width=(k/F.length*100)+"%";
  document.getElementById("statFindings").textContent=F.length-k;
  document.querySelector("#roadTable tbody").innerHTML=D.road.map(function(r){var d=r[1].filter(function(id){return done[id]}).length;
    return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+r[1].map(pillFor).join(" ")+'</td><td>'+esc(r[2])+'</td><td class="mono">'+d+'/'+r[1].length+'</td></tr>'}).join("")}
render();
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("[data-jump]");if(!a)return;e.preventDefault();
  var id=a.getAttribute("data-jump");SEVS.forEach(function(s){sevOn[s]=true});AREAS.forEach(function(x){areaOn[x]=true});hideDone=false;q.value="";
  [].forEach.call(document.querySelectorAll("#sevFilters button,#areaFilters button"),function(b){b.setAttribute("aria-pressed","true")});
  hd.setAttribute("aria-pressed","false");render();var d=document.getElementById("f-"+id);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"})}});
var links=document.querySelectorAll("nav.side a");
[].forEach.call(links,function(l){l.addEventListener("click",function(e){var t=document.querySelector(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)
  [].forEach.call(links,function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});
  [].forEach.call(document.querySelectorAll("main section"),function(s){io.observe(s)})}
})();
</script>
</body>
</html>
