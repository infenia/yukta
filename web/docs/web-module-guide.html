<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta web Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
  <div class="others" id="others"></div>
</nav>
<main id="main"></main>
</div>
<script>
var DATA = {"module": "web", "title": "How Yukta web works, and where it can break", "htmlTitle": "Yukta web Guide", "date": "2026-10-12", "glance": {"lede": "Web is the HTTP front door of the Yukta server. It accepts REST calls and long-lived event streams, checks them, hands them to core (the engine) and wraps the answer in one standard envelope. It holds almost no state and makes almost no decisions: its job is to be a faithful, safe translation layer. This page is for thinking about it, not documenting it: open a component, replay a scenario, then challenge the weak spots.", "props": [["Thin by design", "Eleven controllers do three things: bind and validate the request, call one core service, wrap the result. Rules (limits, ordering, retries) live in core, not here."], ["One envelope, one error path", "Every answer is an ApiResponse. Errors are thrown, never caught in controllers, and one handler turns them into 400, 403, 404, 429 or 500."], ["Streams without gaps", "Status, log and event streams use Server-Sent Events with ids and a 15 s heartbeat. The log stream subscribes to live lines before it reads history so nothing falls between the two."], ["One shared key, no roles", "A single optional API key guards /api/**. There is no user identity, so anyone with the key can do everything, including running workflows that execute code."]], "start": [["primer", "Primer", "New here? Start with the problem, the vocabulary and one request followed end to end"], ["map", "System map", "Ten components and how a request moves through them"], ["map", "Replay a scenario", "Start a run, watch logs with no gap, a bad call, steering, a locked server, paging"], ["reference", "Endpoint map", "All 42 operations (56 routes with legacy aliases) in tables, plus error and convention tables"], ["guarantees", "What is enforced", "Which surfaces the key protects, defaults, and what the web layer remembers"], ["quality", "Stress it", "Scalability, performance, availability, security lenses"], ["board", "Challenge it", "16 open risks, an impact x effort grid, your own notes"], ["adrs", "Decisions", "Eight ADRs, each with a 'revisit when' trigger"]]}, "primer": {"problem": "Yukta runs workflows (graphs of steps) inside a Java server. People and programs need a way in: a web page that starts a run, a command-line tool that stops one, a script that reads logs. That way in must be predictable (same shape of answer every time), safe (reject bad input early, never leak internals) and live (show progress as it happens). <b>Web<\/b> is that way in. It is the HTTP boundary: it receives REST calls and streaming connections and translates them into calls on core, the engine. It does not run anything itself.", "analogy": "Think of a hotel front desk. Guests (clients) never walk into the kitchen. The <b>doorman<\/b> checks who you are (the key check) and writes your name in the visitors' book (request id and access log). The <b>receptionist<\/b> checks your booking form is filled in correctly (validation) and passes it to the right department (core). If something is wrong, one <b>complaints desk<\/b> answers in a standard letter (the error handler). For a long job, the desk gives you a <b>live display<\/b> (a stream) rather than making you ask again and again.", "layersTitle": "Where web sits", "layers": [["Clients", "The web UI, the Go command-line tool (cli), scripts, curl", ""], ["web", "REST and event streams. Binds, validates, calls core, wraps. This page.", "me"], ["core", "The engine and control plane that actually starts, steers and remembers runs", ""], ["plugin-api + plugins", "The node types a workflow is made of", ""], ["boot", "Wires everything into one Spring Boot app and sets the bind address and settings", ""]], "layersNote": "The mcp module is a parallel front door for AI agents. It calls core directly and has its own key (yukta.mcp.api-key); it does not go through web. Web knows nothing about plugins: it only calls core services.", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["Filter", "Code that runs on every HTTP request before any controller, and again as the response leaves. Web has three: key check, request id, access log.", "Checking an API key once in a filter is simpler and safer than repeating it in 42 endpoints."], ["ApiResponse envelope", "The one JSON shape for every answer: timestamp, status, message, and either data (success) or error, path and a list of field errors (failure).", "A start returns status 202 with data.executionId; a bad body returns status 400 with errors listing each bad field."], ["Session, workflow, execution", "Three ids that appear in URLs. A <b>session<\/b> is a workspace that owns configuration and workflows. A <b>workflow<\/b> is a stored graph. An <b>execution<\/b> is one run of a workflow.", "Session team-a, workflow triage, execution e-123."], ["Mono and Flux", "Reactor types used by the reactive WebFlux server. A <b>Mono<\/b> is one result that arrives later (or none); a <b>Flux<\/b> is many results over time. Nothing waits on a thread meanwhile.", "A start returns a Mono of the response; a log stream returns a Flux of events."], ["Server-Sent Events (SSE)", "A long-lived HTTP response where the server keeps pushing small text messages. Each can carry an id; a reconnecting client sends the last id it saw in the Last-Event-ID header.", "The log page keeps one SSE connection open and appends lines as they arrive."], ["Idempotency-Key", "A client-chosen header that makes a retry safe. The server returns the first run's id for a repeated key instead of starting a second run.", "A phone loses signal after sending a start; it resends with the same key and gets the same execution id."], ["Cursor paging", "A way to read a long list in pages. The reply says where it stopped (X-Next-Cursor, the id of the last item); the next call sends that as ?cursor=.", "GET /api/workflow/team-a/history?limit=100&cursor=e-900 returns the next 100 runs after e-900."], ["Control command", "A request to change a run that is already going: pause, resume, stop, step, set a breakpoint. Web forwards it; core orders, applies and records it.", "POST /api/executions/e-123/nodes/classify/pause."]], "ex": {"title": "One example, end to end", "lede": "A client starts a workflow and web answers. Click a step to see what happens, why it is built that way, and what can go wrong. The grey step is core, outside this module.", "labels": ["What happens", "Why it works this way", "Can go wrong"], "legend": "Green = enters or leaves the module · Blue = a step inside web · Grey = core (outside web) · Dashed red = error path", "start": "bind", "nodes": [{"id": "req", "n": "Request in", "s": "POST /workflow/start", "k": "t", "x": 10, "y": 40, "does": "A client sends POST /api/workflow/start with a JSON body naming a session, a workflow and an optional trigger payload, and optionally an Idempotency-Key header.", "adds": "The server is non-blocking (Spring WebFlux): the request is handled by a small pool of event-loop threads, not one thread per call, so thousands of connections (including streams) are cheap.", "wrong": "There is no limit here on request rate, body size beyond the framework default, or open connections (see the limits risk)."}, {"id": "key", "n": "API key check", "s": "ApiKeyFilter", "k": "p", "x": 190, "y": 40, "does": "If yukta.api-key is set and the path starts with /api/, the filter requires the same key as 'Authorization: Bearer <key>' or 'X-API-Key'. It compares bytes in constant time. A miss ends the request with 401 and 'WWW-Authenticate: Bearer'.", "adds": "It runs first, so a caller without the key costs almost nothing and never reaches validation or core. Constant-time comparison means response time does not reveal how many leading characters were right.", "wrong": "If no key is configured the check is off and the API is open. A rejected request gets no request id and no access-log line, because the later filters never run."}, {"id": "trace", "n": "Request id", "s": "RequestTracing", "k": "p", "x": 370, "y": 40, "does": "Keeps the client's X-Request-ID if it is 1 to 64 letters, digits or hyphens; otherwise makes a UUID. Echoes it as X-Request-ID and X-Correlation-ID and stores it in the logging context.", "adds": "The id lets support match a client's failed call to the server's log lines, which is the only detail a 500 reply gives out. The strict character rule stops a hostile header from forging log lines.", "wrong": "Nothing in the log says who made the call, only which request. With one shared key there is no identity to record."}, {"id": "bind", "n": "Validate body", "s": "records + @Valid", "k": "p", "x": 550, "y": 40, "does": "The JSON is read into a WorkflowStartRequest record. The session id must be non-blank, at most 256 characters and free of slashes and '..'; the workflow id must be non-blank. Unknown JSON fields are rejected.", "adds": "Bad input is stopped at the door with a precise message (which field, why). Rejecting unknown fields turns a typo like 'workflowID' into an immediate 400 instead of a silently ignored value.", "wrong": "Web checks the shape only. Whether the session and workflow exist, and whether the graph is valid, is core's job and shows up later as a 404 or 400."}, {"id": "core", "n": "Core starts run", "s": "WorkflowService", "k": "e", "x": 730, "y": 40, "does": "The controller calls WorkflowService.validateAndStartWorkflow (with the key if given). Core finds the workflow, asks the scheduler for a slot and returns an execution id.", "adds": "Web adds no rules of its own. Limits, queueing, retry of the same key and ordering are core's, so the same behaviour holds for the REST API, the UI and the MCP tools.", "wrong": "Core can refuse: unknown session or workflow gives NotFoundException, a full server gives ExecutionRejectedException. Either becomes an HTTP error in the next steps."}, {"id": "wrap", "n": "Reply 202", "s": "ApiResponse", "k": "t", "x": 730, "y": 150, "does": "The id is wrapped as status 202 'Workflow start accepted' with data.executionId. 202 means accepted, not finished: the run continues after the reply.", "adds": "One envelope for every reply means clients write one parser. The client then watches progress with GET /api/executions/{id}/status/stream.", "wrong": "A 202 does not mean the run will succeed, only that it was admitted. The client must watch the status or history to learn the outcome."}, {"id": "log", "n": "Access log", "s": "RequestLogging", "k": "p", "x": 550, "y": 150, "does": "When the exchange ends, one INFO line is written: method, path, status and duration, for example 'POST /api/workflow/start -> 202 in 14ms', tagged with the request id.", "adds": "One line per request, written once the answer is known, is cheap and enough to see traffic and slow calls.", "wrong": "For a stream the line appears only when the connection closes, so duration means connection time. The query string and caller identity are not logged."}, {"id": "err", "n": "Error mapping", "s": "error handler", "k": "p", "x": 370, "y": 150, "does": "If binding fails or core throws, GlobalExceptionHandler turns the exception into an ApiResponse error: 400 for bad input, 404 not found, 403 vetoed, 429 too many runs, 500 for anything else.", "adds": "Controllers never catch errors, so every endpoint, including future ones, answers failure in the same shape. A 500 reply contains no exception text, only 'Reference: <request id>'; the real cause goes to the log.", "wrong": "4xx replies do echo the exception message from core. A core message that names internal detail would reach the client. Some exceptions that mean 'conflict' (such as a restart already running) arrive as IllegalStateException and become 500."}], "edges": [["req", "key"], ["key", "trace"], ["trace", "bind"], ["bind", "core"], ["core", "wrap"], ["wrap", "log"], ["bind", "err", "err", "400"], ["core", "err", "err", "404 / 429"]], "json": {"title": "See the request and the reply", "note": "Shortened. Field order and the timestamp format are illustrative; the field names and status come from the code.", "text": "POST /api/workflow/start\nAuthorization: Bearer <key>\nIdempotency-Key: retry-7f3c\nContent-Type: application/json\n\n{ \"sessionId\": \"team-a\", \"workflowId\": \"triage\",\n  \"payload\": { \"ticket\": \"T-1042\" } }\n\n--> 202\nX-Request-ID: 5b0f...-uuid\n{ \"timestamp\": \"2026-10-12T09:15:02\", \"status\": 202,\n  \"message\": \"Workflow start accepted\",\n  \"data\": { \"executionId\": \"e-123\" } }\n\n--> 400 (for a typo such as \"workflowID\")\n{ \"status\": 400, \"error\": \"Bad Request\",\n  \"message\": \"Invalid request body\", \"path\": \"/api/workflow/start\",\n  \"errors\": [ { \"field\": \"workflowID\", \"message\": \"Unknown field: 'workflowID'\" } ] }"}}, "wrapper": {"title": "What web wraps around every call", "lede": "Controller authors get these for free; a new endpoint only has to return a Mono and throw on error.", "steps": ["Key check (only /api/**, only if a key is set)", "Request id into headers, logs and Reactor context", "Bind JSON to a record, reject unknown fields, run bean validation", "Controller calls one core service", "Success: wrap in ApiResponse; failure: one handler maps the exception", "Access log line when the exchange ends"]}, "story": {"title": "A request in plain words", "steps": [["Knock", "a client sends an HTTP request to /api/..."], ["Door", "the key filter lets it in or sends 401."], ["Name tag", "it gets a request id that follows it into every log line."], ["Form check", "the body is read into a record and validated; typos and missing fields stop here with a 400."], ["Hand-off", "one core service is called; core does the real work."], ["Reply", "the result is wrapped in the standard envelope, or the one error handler explains the failure."], ["Live view", "for long jobs the client opens a stream and receives events with ids and a heartbeat."]]}, "paths": [["New to the module", "Primer, then the System map (Start a run), then Reference (endpoint tables), then pick one risk and read its components.", "primer"], ["Reviewing for improvements", "Quality lenses (start with Security), then the risks board, then Decisions for what you would revisit.", "quality"], ["Exposing the server", "Guarantees (what the key protects), Risks board (shared key, open by default), then the Locked server scenario.", "guarantees"]]}, "plain": {"filters": ["The doorman and the visitors' book: checks the key, gives each request a name tag, writes one line when it is done.", "Without it every endpoint would repeat the key check and logging, and a forgotten check would leave a hole."], "bind": ["The receptionist's form check: reads the JSON into a typed form, rejects unknown or missing fields, and converts forms to what core expects.", "Without it core would receive malformed or misspelled input and fail later with confusing errors."], "sessions": ["The filing cabinet window: create or replace a workspace and its workflows, read them back, and test-drive a draft before saving.", "An editor needs to load, change, validate and save a workflow definition without knowing core's internals."], "lifecycle": ["The start, stop and history counter for runs.", "Clients need one place to launch a run, stop it, restart it and see what ran before."], "control": ["The control room's buttons: pause, step, break, retry, raise or lower limits while a run is going.", "People debugging or operating a live run need to steer it without redeploying anything."], "streams": ["The live display boards: status, logs and events pushed as they happen, with numbered messages and a heartbeat.", "Polling a running job wastes calls and lags; pushing is faster and cheaper if reconnects and gaps are handled."], "errors": ["The complaints desk and the standard letter: one envelope for answers and one place that turns exceptions into status codes.", "Without it every controller would invent its own error format and some would leak internal messages."], "access": ["A check that the run you name really belongs to the session you name.", "It stops a client from reading or steering the wrong session's run by mistake (it is a guard against mistakes, not a real permission system)."], "catalogue": ["The directory and the switchboard: which plugin types exist, which nodes are live, the last heartbeat, and who the supervisors are.", "Editors need the plugin list and each plugin's config fields; operators need to see what is attached to the control bus."], "config": ["The settings that decide who can reach the server: bind address, the API key, the API documentation, the JSON strictness.", "A fresh install should not be reachable from the network, and exposure should be a deliberate act."]}, "comps": [{"id": "filters", "name": "Filter chain", "tag": "key, request id, access log", "c": 0, "r": 0, "resp": "Runs on every request before any controller: checks the API key, gives the request an id and writes one access-log line when it ends.", "how": ["Order matters. The key filter runs first, the request-id filter second, the access-log filter last (it has no explicit order, so it runs after the others). The reason for key-first is that an unauthenticated caller should cost as little as possible. The consequence is that a rejected 401 has no request id and no log line.", "The key check applies only when yukta.api-key is non-empty and only to paths starting with /api/. The key is read from 'Authorization: Bearer <key>'; if that header does not start with 'Bearer ' the X-API-Key header is used instead. Bytes are compared with MessageDigest.isEqual, which takes the same time wherever the first difference is, so a caller cannot guess the key one character at a time by measuring response time. A miss gives 401, 'WWW-Authenticate: Bearer' and an empty body.", "The request id: a client's X-Request-ID is kept only if it matches [A-Za-z0-9-]{1,64}; otherwise a UUID is generated. X-Correlation-ID follows the same rule and falls back to the request id. Both are returned on the response. The id goes into the Reactor context and the logging MDC, so every log line of that request shows [requestId] even when work hops threads. The strict pattern exists because the value is written to logs and headers: a newline in it could forge a log line.", "The access log writes 'POST /api/workflow/start -> 202 in 14ms' at INFO when the exchange ends. For a stream that is when the connection closes. The line has method, path, status and duration, with no query string and no caller identity.", "Why filters and not controller code: a filter covers every route, including endpoints added later, so a forgotten check cannot leave a hole."], "guar": "A request that passes the key check has a request id that is echoed in X-Request-ID. The key comparison is constant-time. Client-supplied ids can only contain letters, digits and hyphens.", "state": "Only the key bytes, read once when the server starts. Nothing is stored per request. Changing the key needs a restart.", "ceil": "One shared key for all of /api/**: no roles, no per-user identity, no rotation without restart. No rate limiting.", "fail": "Missing or wrong key: 401 with an empty body. If the key is empty the filter lets everything through.", "set": ["yukta.api-key (empty = API open)", "Authorization: Bearer <key> or X-API-Key", "X-Request-ID, X-Correlation-ID"], "risks": ["sharedKey", "openByDefault", "silent401", "uiNoKey", "noLimits"]}, {"id": "bind", "name": "Binding & mapping", "tag": "JSON to records, mappers", "c": 1, "r": 0, "resp": "Turns JSON bodies into validated Java records and maps them to and from core's own types.", "how": ["Request bodies are records: ConfigRequest (a session), WorkflowDefinitionRequest (a workflow, also used by the dry-run validator), WorkflowStartRequest and NodeCommandRequest. Rules are annotations: a session id is at most 256 characters and must not contain '/', backslash or '..'; names and descriptions are at most 256; the project path is non-blank and at most 1024; a session needs at least one workflow, a workflow at least one node; a node command payload has 1 to 100 entries. In our view the id pattern exists so an id is safe to use as a file or path segment.", "Unknown JSON fields are rejected. The setting lives in boot (spring.jackson.deserialization.fail-on-unknown-properties: true), so it applies to every JSON body. Example: a client sends workflowID instead of workflowId. Without the rule that field would be dropped and the call would fail later with a vague 'workflowId is required'.", "Records copy their lists and maps and turn null into empty (a missing tags map means no tags), so nothing downstream has to null-check and nobody can change a request after validation.", "Three MapStruct mappers convert records to core types and back. MapStruct generates plain Java at compile time (no reflection), which also suits a GraalVM native image. SessionMapper maps a session request to core's SessionConfigData and builds the summary rows; AppConfigMapper maps a workflow request for the dry-run validator; WorkflowMapper builds graph edges and log entries.", "The two mappers differ on one default: SessionMapper turns a missing edge sourcePort into 'default', AppConfigMapper leaves it null. So the validator and the saving path can see the same edge slightly differently."], "guar": "Anything that fails validation is stopped with a 400 before core is called, with every failing field listed. Request records are immutable.", "state": "None.", "ceil": "No explicit body-size limit is set in this repository, so the framework default applies. Validation checks shape and length, not the meaning of a node's config (core's validator does that).", "fail": "Bean-validation failure: 400 'Validation failed' with one entry per bad field. Unknown field: 400 'Invalid request body' naming the field. Malformed JSON: 400 with a generic reason.", "set": ["spring.jackson.deserialization.fail-on-unknown-properties=true (boot)", "@SessionId, @ProjectPath, @NotBlank, @Size"], "risks": ["mapperDrift", "deadDtos", "noLimits"]}, {"id": "sessions", "name": "Session & config API", "tag": "sessions, validate, graph", "c": 2, "r": 0, "resp": "Creates or replaces a session with its workflows, reads them back in several shapes, dry-runs a draft and describes a workflow's graph for the editor.", "how": ["POST /api/sessions applies a whole configuration: it creates the session or replaces its config. There is no partial update. The editor calls GET /api/sessions/{sid}/config, changes it and posts it back, which is why /config returns exactly the shape the POST accepts.", "Reads come in sizes for different screens. GET /api/sessions lists ids alphabetically (paged). /summaries returns lean rows (name, tag names, workflow count) and loads only the page's configs, one after another, skipping any it cannot read with a warning in the log. /{sid} returns details (tag names and workflow ids, but not tag values). /config returns everything. /workflows returns each workflow with node count, edge count and latest run status. /workflows/{wid} returns one definition.", "POST /api/sessions/validate dry-runs a draft with the same WorkflowValidator that execution uses. It always answers 200: valid:true, or valid:false with the first problem as the message. The reason: the question 'is this draft OK?' was answered successfully, and an editor wants to show the problem inline, not handle an HTTP error. Malformed bodies still get 400 first.", "The validate reply also lists each node's output ports for its current config (nodes whose plugin type is unknown are left out). Ports can depend on config, for example whether an error port exists, so the editor asks instead of guessing.", "GET .../workflows/{wid}/graph builds the picture for the canvas: each node enriched with plugin category, description, UI hints and ports, the edges, and a topological order (an order in which every step comes after the steps it depends on).", "This is the one controller that catches errors itself: validate turns any exception into valid:false plus e.getMessage()."], "guar": "A saved session is exactly what core's store holds; reads never change anything. Validate never saves and never starts a run.", "state": "None in web. Sessions live in core's store, which is in memory by default (yukta.session.store-type: in-memory) and is lost on restart unless core is configured otherwise.", "ceil": "Listing sessions loads every id and sorts them on each page call. A config POST carries a whole session in one body. /config and /workflows/{wid} return node config exactly as stored.", "fail": "Unknown session or workflow: 404. Bad body: 400 with field errors. A draft that fails validation: 200 with valid:false.", "set": ["POST /api/sessions", "GET /api/sessions[/summaries]", "GET /api/sessions/{sid}[/config|/workflows]", "POST /api/sessions/validate", "GET .../workflows/{wid}/graph"], "risks": ["configUnredacted", "pagingLinear", "localCatch", "mapperDrift", "sharedKey"]}, {"id": "lifecycle", "name": "Run lifecycle API", "tag": "start, stop, restart, status", "c": 3, "r": 0, "flag": true, "resp": "Starts a workflow, stops one run or every run of a workflow, restarts a run whole or from a node, and reads status and history.", "how": ["POST /api/workflow/start answers 202 'accepted' with an execution id. The run continues after the reply, so the client follows it with a status call or stream. An optional Idempotency-Key header makes a retry safe: the same key with the same session and workflow returns the first run's id instead of starting a second one. The window is core's setting (yukta.start.idempotency-ttl, 10 minutes by default).", "An unknown session or workflow gives 404. If core refuses to admit the run because of its limits the reply is 429.", "Stopping has two scopes. POST /api/workflow/{sid}/{wid}/stop?mode= stops every active run of a workflow and returns the ids it signalled. DRAIN (default) lets in-flight work finish, CANCEL cancels it, KILL stops at once. POST /api/executions/{eid}/stop stops one run.", "POST /api/executions/{eid}/restart stops the run and starts the workflow again with the original trigger payload and a new execution id. .../restart/{node} restarts from a node, replaying the stored outputs of its parent nodes. .../nodes/{nid}/retry restarts from a node that failed. Each returns the new id.", "Status: GET /api/executions/{eid} returns a progress snapshot; GET /api/workflow/{sid}/history lists a session's runs newest first (paged), and GET /api/sessions/{sid}/workflows/{wid}/executions does the same for one workflow.", "Every execution route has a canonical form (/api/executions/...) and a deprecated alias (/api/workflow/...). The CLI still calls almost all of the aliases and the UI calls the two status aliases."], "guar": "A 202 means core admitted the start. The same Idempotency-Key never starts a second run inside core's window. Stop returns only the ids actually signalled.", "state": "None in web. Run state and history live in core.", "ceil": "History is loaded in full from core and then cut into a page by web. Admission limits, queues and the idempotency window are core's.", "fail": "404 unknown session, workflow, execution or node. 429 when core refuses a start. 500 if core throws something unmapped, such as a restart already in progress (see risks).", "set": ["POST /api/workflow/start (Idempotency-Key)", "POST /api/workflow/{sid}/{wid}/stop?mode=DRAIN|CANCEL|KILL", "POST /api/executions/{eid}/stop|restart|restart/{node}", "GET /api/executions/{eid}", "GET /api/workflow/{sid}/history"], "risks": ["legacyAliases", "ownershipGap", "noConflict", "pagingLinear", "sharedKey"]}, {"id": "errors", "name": "Errors & envelope", "tag": "ApiResponse, one handler", "c": 1, "r": 1, "resp": "Defines the one JSON shape for every reply and the one place that turns exceptions into HTTP status codes.", "how": ["ApiResponse has timestamp, status, message, data (success only), error, path and a list of field errors (failure only). Empty fields are left out of the JSON. Lists are returned as bare arrays inside data.", "Controllers do not catch errors. Core throws typed exceptions and GlobalExceptionHandler maps them: NotFoundException (core) or ResourceNotFoundException (web) gives 404; IllegalArgumentException, ValidationException and bean-validation errors give 400; ControlRejectedException (a supervisor vetoed a command) gives 403; ExecutionRejectedException gives 429; anything else, including IllegalStateException, gives 500.", "A 500 never carries exception text. The message is 'An unexpected error occurred. Reference: <request id>' and the cause is logged with the same id. The reason: exception messages can name classes, paths or SQL; a client should get a ticket number, not internals.", "4xx replies do carry the exception message, because 'Session not found: team-x' is what the caller needs. This relies on core writing client-safe messages.", "Framework errors (unsupported method, wrong content type, unknown route) pass through the same handler, so even those get the envelope.", "Two places bypass the handler: the validate endpoint (returns e.getMessage() inside a 200) and the plugin list (a 500 whose message includes 'Failed to retrieve plugins: ' plus the exception text)."], "guar": "Every error reply has the envelope with status, error, message and path. A 500 reveals no exception text.", "state": "None.", "ceil": "The mapping is by exception type, so a new kind of core failure becomes 500 until someone adds a handler. There is no 409 Conflict.", "fail": "If a core exception is not mapped it becomes 500 and the caller gets only the reference id.", "set": ["ApiResponse<T>", "GlobalExceptionHandler", "X-Request-ID in 5xx replies"], "risks": ["noConflict", "localCatch", "silent401"]}, {"id": "control", "name": "Run control API", "tag": "pause, step, retry, limits", "c": 2, "r": 1, "flag": true, "resp": "Steers a run while it is running: pause and resume, per-node pause, resume, stop, skip and step, breakpoints, queue priority and the global limits.", "how": ["All control calls are POST (clearing a breakpoint is DELETE). Each one checks the execution exists, sends one command to core, waits for core's acknowledgement and answers 200 with the execution id. It does not wait for the effect to show; read the status to confirm. Core orders commands per run and its supervisors may veto one, which is the 403.", "Whole run: pause and resume. Per node: pause, resume, stop (?immediate=false drains in-flight work, true stops at once; ?reason= is recorded), skip (?skip=true or false; core currently rejects skipping on a running execution).", "Debugging: 'step mode' makes a node hold messages; 'step' lets exactly one through. A breakpoint pauses a node when a payload field equals a value, for example field=payload.status&equals=error. Example: put a breakpoint on classify, run, and the node stops at the first error ticket so you can look at it.", "Operating: POST /api/executions/{eid}/priority?priority=n changes the priority of a start still waiting for a slot (higher runs first; otherwise 400). POST /api/scheduler/limits?maxConcurrent=&maxPerWorkflow= sets the two global limits at run time; 0 means no limit and a negative number is treated as 0.", "Older routes take a session id and run the ownership check. The newer routes (retry, breakpoint, priority, limits) have no session in the path, so they check existence only or nothing at all."], "guar": "A command reaches core only if the execution exists. Core applies commands in order per run and records them.", "state": "None in web. Limits changed at run time are not restored after a restart (core logs them).", "ceil": "Limits can only be set globally and per workflow here, not per session. There is no batching: one command per call.", "fail": "404 for an unknown execution or node. 400 for a rejected state change (such as priority of a run that is not waiting). 403 when a supervisor vetoes. Conflicts surface as 500.", "set": ["POST /api/executions/{eid}/pause|resume", "POST .../nodes/{nid}/pause|resume|stop|skip|step|step/enable|step/disable|retry", "POST|DELETE .../nodes/{nid}/breakpoint", "POST .../priority", "POST /api/scheduler/limits"], "risks": ["ownershipGap", "noConflict", "limitsEndpoint", "legacyAliases", "sharedKey"]}, {"id": "streams", "name": "Streams (SSE)", "tag": "status, logs, events", "c": 3, "r": 1, "flag": true, "resp": "Pushes run status, execution logs and a global event feed to clients as Server-Sent Events, with ids and a heartbeat.", "how": ["A shared helper numbers each event from 0 and merges a keep-alive comment (': ping') every 15 seconds so proxies do not close an idle connection. A reconnecting client sends Last-Event-ID; the stream skips everything up to that id.", "Status stream: GET /api/executions/{eid}/status/stream?includeHistory=true asks core to replay recent status changes (core keeps five minutes by default) and then follow live ones.", "Log streams: GET /api/sessions/{sid}/executions/{eid}/logs (formatted lines) and .../logs/entries (structured: level, stream, message). If the run already ended they send the stored lines and finish. If it is running they send history then live lines, and finish when the run reaches a terminal state.", "How history and live join without a gap: the live feed is subscribed first, into a buffer of 1024 lines, and only then is the history read. A line written during the read may appear in both. For history lines stamped at or after the seam start, the stream remembers their text; the first live line with the same text and a timestamp not after the history snapshot is dropped once. Example: history ends with 'step 7 done'; the live buffer also holds 'step 7 done' from the same moment; it is sent once.", "Event feed: GET /api/events/stream?executionId=&type= pushes node status changes, workflow status changes, control-command outcomes and log lines (types NodeStatusChanged, WorkflowStatusChanged, ControlOutcome, LogLine) for all runs. It has no replay and no session filter.", "The live parts are best-effort: if a client reads more slowly than events arrive, it misses events instead of slowing the server."], "guar": "Event ids are sequential within one connection and a heartbeat is sent every 15 s. Log streams subscribe to live lines before reading history, so nothing falls into the gap (duplicates are suppressed by a text heuristic).", "state": "Per connection only: a position counter and, for running log streams, a 1024-line buffer. Everything is gone when the connection closes or the server restarts.", "ceil": "Every open stream holds a subscription and (for logs) a buffer. There is no cap on open connections and no maximum stream lifetime. A slow reader silently misses live events.", "fail": "A foreign or unknown execution: 404 before the stream starts. A dropped connection: the client reconnects with Last-Event-ID; ids are positions in a rebuilt stream, so they line up only if history is unchanged.", "set": ["Heartbeat 15 s", "Live buffer 1024 lines", "yukta.streaming.status-history-ttl-minutes (core, 5)", "Last-Event-ID", "includeHistory=true"], "risks": ["slowReader", "logSeam", "noLimits", "ownershipGap"]}, {"id": "config", "name": "Settings & exposure", "tag": "bind address, key, API docs", "c": 0, "r": 2, "resp": "The few settings that decide who can reach the server and how strict it is, plus the generated API documentation.", "how": ["Bind address: server.address defaults to 127.0.0.1 (loopback), so a fresh install is not reachable from the network. Setting YUKTA_SERVER_ADDRESS=0.0.0.0 opens it. The Docker image sets 0.0.0.0, because inside a container the app must listen on all interfaces.", "The API key is the one security setting in web: yukta.api-key. Empty (the default) leaves the API open. The README says to set it whenever the address is opened.", "Surfaces the key does not cover: anything outside /api/. That includes the MCP endpoint (/mcp, with its own key, yukta.mcp.api-key, open by default), the Swagger UI, the OpenAPI document, and the actuator endpoints boot exposes (health, info, metrics).", "OpenAPI is generated by springdoc from the controller annotations: UI at /swagger-ui.html, JSON at /v3/api-docs. The UI has a generated types file (api.generated.ts) for these endpoints.", "Web has no settings class of its own. It also relies on boot for the log pattern that prints the request id and for virtual threads being enabled."], "guar": "On a default install the server accepts connections only from the same machine.", "state": "Read once at startup.", "ceil": "Settings are changed by restarting; there is no live reload of the key.", "fail": "If the address is opened without a key, the whole API (including workflows that run code) is open to the network.", "set": ["server.address / YUKTA_SERVER_ADDRESS (127.0.0.1)", "yukta.api-key", "yukta.mcp.api-key (mcp)", "/swagger-ui.html, /v3/api-docs", "management.endpoints.web.exposure.include=health,info,metrics"], "risks": ["openByDefault", "sharedKey", "uiNoKey"]}, {"id": "catalogue", "name": "Catalogue & control bus", "tag": "plugins, nodes, supervisors", "c": 2, "r": 2, "flag": true, "resp": "Read-only views of what the server offers and what is attached to it: plugin types, live nodes and heartbeats, and supervisors; plus an admin command to a live node.", "how": ["GET /api/plugins lists every plugin type and its category. GET /api/plugins/{type} adds the description, a usage pattern, UI design hints, the output ports and the configSchema: the list of config fields the plugin declares. An editor uses it to build a form for a node.", "The control-bus views identify nodes by workflow id and node id only, with no session or execution in the path: GET /api/control/nodes (all live nodes), /api/control/workflows/{wid}/nodes, and .../nodes/{nid}/heartbeat (the last heartbeat message).", "POST /api/control/workflows/{wid}/nodes/{nid}/command sends an administrative command to a live plugin. The body is a map of 1 to 100 entries (it is the map itself, not wrapped in a field). Web builds a control message marked with source 'CONSOLE' and returns the plugin's response payload. Example: {\"action\": \"flush\"}.", "GET /api/supervisors lists the supervisors and control-plane plugins attached to the control bus, in review order, with id, kind, type, dry-run flag, rate limit and counters since startup: applied, rejected, recorded (dry-run) and rate-limited.", "The plugin catalogue handles its own errors: an unknown type is a locally built 404, and a failure listing plugins becomes a 500 with the exception text."], "guar": "The catalogue is read-only. The admin command goes through the control bus like any other command.", "state": "None. Counters live in core's supervisor host.", "ceil": "Control-bus views are not scoped to a session; two sessions that reuse a workflow id are not told apart by the path.", "fail": "Unknown plugin type or node: 404. Empty or oversized command: 400.", "set": ["GET /api/plugins[/{type}]", "GET /api/control/nodes", "GET /api/control/workflows/{wid}/nodes[/{nid}/heartbeat]", "POST .../nodes/{nid}/command", "GET /api/supervisors"], "risks": ["ownershipGap", "localCatch", "sharedKey"]}, {"id": "access", "name": "Ownership check", "tag": "ExecutionAccess", "c": 3, "r": 2, "resp": "One helper that confirms that the execution you name exists and, when a session is named, belongs to that session.", "how": ["require(sessionId, executionId) has two modes. With a session id it looks in that session's own records, so another session's run looks like 'not found' and its existence is not revealed. Without one (null) it looks the execution up globally.", "Who calls it with a session: the log streams and the older /api/workflow/{sid}/... routes. Who calls it without one: the newer canonical routes (/api/executions/...), which have no session in the path. In that mode it only proves the execution exists.", "Who does not call it at all: stop, restart and restart-from-node (core reports a missing run itself), history by workflow, the control-bus views and the events stream.", "Why it exists: it catches client mistakes, such as a UI addressing session A's run through session B's screen. It is not authorization: with one shared key every caller may use every session anyway."], "guar": "A named session cannot read or steer another session's execution through the routes that use it.", "state": "None.", "ceil": "It reads core's in-memory tracker, so it only knows runs core still remembers.", "fail": "Always the same 404 'Execution not found: <id>' for unknown or foreign runs.", "set": [], "risks": ["ownershipGap", "legacyAliases"]}], "mapFlag": {"label": "Highlight session-blind endpoints", "hint": "Dashed amber = some routes here do not check the session", "badge": "no session"}, "edges": [["filters", "bind", "data", "request"], ["bind", "sessions", "data", "records"], ["bind", "lifecycle", "data", "records"], ["bind", "control", "data", "records"], ["bind", "catalogue", "data", "requests"], ["sessions", "errors", "ctrl", "exceptions"], ["lifecycle", "errors", "ctrl", "exceptions"], ["control", "errors", "ctrl", "exceptions"], ["control", "access", "ctrl", "ownership"], ["streams", "access", "ctrl", "ownership"], ["config", "filters", "ctrl", "api key"], ["config", "bind", "ctrl", "unknown fields"]], "scen": [{"id": "start", "name": "Start a run", "steps": [{"t": "Request arrives", "d": "A client posts to /api/workflow/start with a session id, a workflow id and an optional payload. The key filter checks the key (if one is set) and the tracing filter gives the request an id.", "c": ["filters"], "r": []}, {"t": "Bind and validate", "d": "The JSON is read into a record. A bad session id, a blank workflow id or an unknown field is a 400 right here, so core never sees malformed input.", "c": ["bind"], "r": []}, {"t": "Call core", "d": "The controller calls core's WorkflowService, passing the Idempotency-Key if the client sent one. Core finds the workflow, asks the scheduler for a slot and returns an execution id. Web adds no rules of its own.", "c": ["lifecycle"], "r": []}, {"t": "Reply 202", "d": "The id is wrapped in the envelope with status 202 'accepted'. The run goes on after the reply. The access-log filter writes 'POST /api/workflow/start -> 202 in 14ms'.", "c": ["lifecycle", "errors", "filters"], "r": []}, {"t": "Follow the run", "d": "The client opens GET /api/executions/{id}/status/stream. The canonical route has no session, so only existence is checked. The legacy route (/api/workflow/{sid}/status/{id}/stream) carries the session and checks ownership too.", "c": ["streams", "access"], "r": ["ownershipGap"]}]}, {"id": "watch", "name": "Watch logs, no gap", "steps": [{"t": "Connect", "d": "GET /api/sessions/{sid}/executions/{eid}/logs. The ownership check looks in that session's own records; a run of another session is a 404, so existence is not leaked.", "c": ["streams", "access"], "r": []}, {"t": "Finished or running?", "d": "If the run is already in a terminal state, only the stored lines are sent and the stream ends. A running run needs both history and live lines, which is where a gap could appear.", "c": ["streams"], "r": []}, {"t": "Subscribe to live first", "d": "The live feed is subscribed before anything is read, into a 1024-line buffer, filtered to this execution. Reason: if history were read first, a line written during the read would be in neither part.", "c": ["streams"], "r": ["slowReader"]}, {"t": "Read history and join", "d": "After the stored lines, live lines follow. A line written during the read may be in both, so history lines from the seam are remembered by text and the first live line with the same text and a timestamp not after the snapshot is dropped once.", "c": ["streams"], "r": ["logSeam"]}, {"t": "Ids and heartbeat", "d": "Every event gets id 0, 1, 2... and an idle stream sends ': ping' every 15 s. The stream ends when core reports the run in a terminal state.", "c": ["streams"], "r": []}, {"t": "Reconnect", "d": "The connection drops. The client reconnects with Last-Event-ID: 41. Web rebuilds the stream and skips ids up to 41. That is exact only if the history did not change in between (for example it was not trimmed by retention).", "c": ["streams"], "r": ["logSeam", "slowReader"]}]}, {"id": "bad", "name": "A bad call", "steps": [{"t": "A typo", "d": "A client sends workflowID instead of workflowId. The unknown field is rejected: 400 'Invalid request body' with errors: [{field: workflowID, message: Unknown field}]. Without this rule the typo would be ignored.", "c": ["bind", "errors"], "r": []}, {"t": "Missing fields", "d": "A session body without name and initiator is a 400 'Validation failed' listing every bad field at once, so the client fixes them in one go.", "c": ["bind", "errors"], "r": []}, {"t": "Unknown workflow", "d": "The body is fine but the workflow does not exist. Core throws NotFoundException, the handler maps it to 404 and echoes the message ('Workflow not found...').", "c": ["lifecycle", "errors"], "r": []}, {"t": "Too many runs", "d": "Core's limit is reached and it refuses the start with ExecutionRejectedException. The handler answers 429. The client should retry later.", "c": ["lifecycle", "errors"], "r": []}, {"t": "An unmapped failure", "d": "Two restarts of the same run arrive together. Core throws IllegalStateException ('Restart already in progress'). The handler has no 409, so the answer is 500 with only 'Reference: <request id>'; the cause is in the log.", "c": ["lifecycle", "errors"], "r": ["noConflict"]}, {"t": "The exception to the rule", "d": "POST /api/sessions/validate catches every error itself and puts e.getMessage() in the reply. That is useful for an editor but it is the one path that can show exception text for an unexpected failure.", "c": ["sessions", "errors"], "r": ["localCatch"]}]}, {"id": "steer", "name": "Steer a live run", "steps": [{"t": "Pause the run", "d": "POST /api/executions/{eid}/pause. The helper checks the execution exists, sends the command to core and waits for the acknowledgement. The reply is 200 with the execution id; the status confirms the effect.", "c": ["control", "access"], "r": ["ownershipGap"]}, {"t": "Break on a value", "d": "POST .../nodes/classify/breakpoint?field=payload.status&equals=error. The node pauses when a message matches, so a person can inspect the first bad case. DELETE on the same path clears it.", "c": ["control"], "r": []}, {"t": "Step through", "d": "Step mode holds messages at a node; each POST .../step lets exactly one through. Useful to watch a transformation message by message.", "c": ["control"], "r": []}, {"t": "A supervisor says no", "d": "A rule or AI supervisor attached to the control bus can review commands. If it vetoes one, core throws ControlRejectedException and web answers 403 with the reason.", "c": ["control", "errors", "catalogue"], "r": []}, {"t": "Retry a failed node", "d": "POST .../nodes/{nid}/retry restarts from the failed node and returns a new execution id. The caller then follows the new id.", "c": ["control", "lifecycle"], "r": []}, {"t": "Lift the limits", "d": "POST /api/scheduler/limits?maxConcurrent=0&maxPerWorkflow=0 removes the two global caps at once (0 means no limit). There is no validation or confirmation, and anyone with the key can do it.", "c": ["control"], "r": ["limitsEndpoint", "sharedKey"]}]}, {"id": "locked", "name": "A server exposed with a key", "steps": [{"t": "Open the door deliberately", "d": "An operator sets YUKTA_SERVER_ADDRESS=0.0.0.0 and yukta.api-key. Loopback is the default so that exposure is a decision, not an accident. The Docker image already sets 0.0.0.0, so a container started without a key is open.", "c": ["config"], "r": ["openByDefault"]}, {"t": "A call without the key", "d": "The filter answers 401 with 'WWW-Authenticate: Bearer' and an empty body. The request-id and access-log filters never run, so the rejected call is not in the access log.", "c": ["filters"], "r": ["silent401"]}, {"t": "A call with the key", "d": "The key is compared in constant time and the call proceeds. Nothing in the request says who the caller is; the key is the same for everyone.", "c": ["filters"], "r": ["sharedKey"]}, {"t": "What the key allows", "d": "Everything under /api/**: create sessions, start and stop any run, read any log. Some plugins run processes, scripts and SQL, so a caller who can write a workflow can run code on the server.", "c": ["sessions", "lifecycle", "control"], "r": ["sharedKey"]}, {"t": "The bundled UI", "d": "The UI's API client sends no Authorization or X-API-Key header, so against a keyed server its calls would be 401 unless a proxy adds the header. The CLI can send a bearer token.", "c": ["filters", "config"], "r": ["uiNoKey"]}, {"t": "What the key does not guard", "d": "Paths outside /api/: the MCP endpoint (own key, open by default), Swagger UI, the OpenAPI document and the actuator endpoints.", "c": ["config"], "r": ["openByDefault"]}]}, {"id": "page", "name": "Page through history", "steps": [{"t": "First page", "d": "GET /api/workflow/{sid}/history with no limit returns up to 500 runs, newest first. A limit above 1000 is cut to 1000; below 1 means 500.", "c": ["lifecycle"], "r": []}, {"t": "A next cursor", "d": "If more remain, the reply has X-Next-Cursor: the id of the last run on this page. The client sends it back as ?cursor=. Because it is an id, not an offset, new runs added at the top do not shift the pages.", "c": ["lifecycle"], "r": []}, {"t": "How the page is cut", "d": "Web asks core for the whole history, finds the cursor by walking the list, and slices. Cost grows with the history length on every page call, not with the page size.", "c": ["lifecycle"], "r": ["pagingLinear"]}, {"t": "A cursor that vanished", "d": "If the run named by the cursor has been trimmed from history, web does not fail; it silently starts again from the first item. A client that loops until there is no next cursor could see page 1 again.", "c": ["lifecycle"], "r": ["pagingLinear"]}]}], "intro": {"start": "One start request from the door to a 202 reply, and how the client then follows the run.", "watch": "A log stream that joins stored lines and live lines with no gap, and what happens on reconnect.", "bad": "Five ways a call fails, what status each gets, and the one place that does not follow the rule.", "steer": "Pausing, breaking, stepping and retrying a run that is already going, and one dangerous switch.", "locked": "What an API key does and does not protect once the server is reachable from the network.", "page": "Reading a long history in pages, and what the cursor design costs."}, "caps": [["Edge", "API key guard", "Optional shared secret for /api/**.", "Filter compares the presented key (Bearer or X-API-Key) with the configured one in constant time.", "Wrong or missing key is always a 401 with WWW-Authenticate.", "One key for all callers; off when yukta.api-key is empty."], ["Edge", "Request tracing", "A request id on every accepted request.", "Accepts a safe X-Request-ID or generates a UUID; puts it in headers, Reactor context and the logging MDC.", "Client ids are limited to 1 to 64 letters, digits and hyphens.", "Not set for requests rejected by the key filter."], ["Edge", "Access log", "One line per request.", "Logs method, path, status and duration when the exchange ends.", "Written even if the stream is cancelled (it runs on completion of any kind).", "No query string, no caller identity, no line for 401s."], ["Edge", "Strict JSON", "Typos in field names are errors.", "Jackson is configured to fail on unknown properties.", "A misspelled field never silently disappears.", "Applies to JSON bodies only; query parameters are not checked this way."], ["Sessions", "Create or replace a session", "Save a session and its workflows in one call.", "POST /api/sessions maps the request to core's config and applies it.", "Whole-config semantics: what you send is what is stored.", "No partial update; large bodies depend on the framework body limit."], ["Sessions", "Read in several shapes", "Ids, summaries, details, full config, workflow summaries, one definition.", "Separate GETs sized for each screen; summaries load only the requested page.", "Reads never change state.", "Full config is returned as stored, including any literal secrets in node config."], ["Sessions", "Dry-run validation", "Check a draft without saving.", "POST /api/sessions/validate runs core's WorkflowValidator and returns valid, the first problem and each node's ports.", "Same rules as execution; never saves or runs.", "Reports only the first problem; unknown plugin types get no ports."], ["Sessions", "Workflow graph", "The picture data for the canvas.", "Enriches nodes with plugin category, description, UI design and ports and adds topological order.", "Order is a valid run order for the DAG.", "Built per request from the stored definition."], ["Runs", "Start with retry safety", "Launch a run; retry without duplicates.", "POST /api/workflow/start returns 202 and an id; Idempotency-Key returns the first id for a repeated key.", "No second run for the same key inside core's window (10 minutes by default).", "404 unknown session or workflow; 429 at core's limit."], ["Runs", "Stop modes", "Stop one run or all runs of a workflow.", "?mode=DRAIN (default), CANCEL or KILL for a workflow; one run has its own stop route.", "Returns the ids that were signalled.", "Stopping a workflow acts on active runs only."], ["Runs", "Restart and retry", "Run again from the start or from a node.", "restart repeats the original payload; restart/{node} and retry replay from checkpoints; each returns a new execution id.", "The old run's record is kept; the new run has its own id.", "Needs core's checkpoints for node restarts."], ["Runs", "History with cursor paging", "Read past runs in pages.", "limit (default 500, max 1000) and cursor; next cursor in X-Next-Cursor.", "Cursor is an id, so new runs do not shift later pages.", "The whole history is loaded and cut per call; an unknown cursor restarts from the first item."], ["Control", "Pause, resume, stop, skip, step", "Whole-run and per-node control.", "POST routes call core's control bus and answer with the execution id.", "Acknowledged by core before the reply; core orders commands per run.", "Skip is rejected on running executions; a supervisor may veto (403)."], ["Control", "Breakpoints", "Pause a node on a payload value.", "POST .../breakpoint?field=&equals=; DELETE clears it.", "Condition is a field and an exact value.", "One field-equals rule; no expressions."], ["Control", "Queue priority and limits", "Reorder waiting starts; change global limits live.", "POST .../priority?priority=n and POST /api/scheduler/limits?maxConcurrent=&maxPerWorkflow=.", "Priority only for runs waiting for a slot; 0 means no limit.", "No per-session limit here; not restored after restart; no validation of values."], ["Streams", "Status stream", "Progress of one run as events.", "GET .../status/stream with includeHistory (default true).", "Sequential ids and a 15 s heartbeat; Last-Event-ID resumes.", "Ids are positions in a rebuilt stream, valid only if nothing was reordered."], ["Streams", "Log streams", "Log lines or structured entries of one run.", "History then live, live subscribed first, joined with a text-based duplicate filter.", "No gap at the seam; ends when the run ends.", "1024-line live buffer; slow reader may miss live lines."], ["Streams", "Event feed", "Everything happening, for all runs.", "GET /api/events/stream with executionId and type filters.", "Event types: NodeStatusChanged, WorkflowStatusChanged, ControlOutcome, LogLine.", "No replay, no session filter, best effort."], ["Catalogue", "Plugin catalogue with config schema", "What node types exist and how to configure them.", "GET /api/plugins and /api/plugins/{type} (ports, UI design, configSchema).", "Read-only.", "A listing failure becomes a 500 that includes exception text."], ["Catalogue", "Control-bus views and supervisors", "Live nodes, heartbeats, admin command, supervisors with counters.", "GET /api/control/..., POST .../command, GET /api/supervisors.", "Command body is 1 to 100 entries.", "Not scoped by session; counters are since startup."]], "capsLede": "Capabilities grouped by what a client wants to do. Each card says what it does, how, what you can rely on, and where it stops.", "guar": {"title": "What is enforced, and what is not", "lede": "Web keeps no state, so the interesting questions are about what it enforces at the edge, what its defaults are and what a client can rely on.", "tables": [{"title": "Which surfaces the API key protects", "lede": "The key filter checks only paths that start with /api/ and only when yukta.api-key is set.", "head": ["Surface", "Protected by yukta.api-key?", "Notes"], "rows": [["/api/** (all 42 operations)", ["part", "Only if the key is set"], "Off by default. One shared key; no roles."], ["MCP endpoint /mcp", ["lost", "No"], "Has its own key (yukta.mcp.api-key), also open by default."], ["Swagger UI and /v3/api-docs", ["lost", "No"], "Anyone who can reach the server can read the API description."], ["Actuator health, info, metrics", ["lost", "No"], "Exposed by boot settings; health details only 'when-authorized'."], ["Network reachability", ["part", "Loopback by default"], "server.address is 127.0.0.1 unless YUKTA_SERVER_ADDRESS is set; the Docker image sets 0.0.0.0."]]}, {"title": "Semantics clients can rely on", "head": ["Topic", "Guarantee"], "rows": [["Reply shape", "Every reply is an ApiResponse. Success has data; failure has error, path and a possibly empty list of field errors."], ["Start", "202 means admitted, not finished. The same Idempotency-Key (same session and workflow, inside core's window) returns the first execution id."], ["Control commands", "Reply is sent after core acknowledges; the effect is visible through status. Core applies commands per run in order."], ["Request id", "Echoed in X-Request-ID on every request that passes the key check; it is the only detail a 500 gives."], ["Error text", "5xx never contains exception text. 4xx contains core's message, so core must keep messages client-safe."], ["Paging", "Newest first for runs, alphabetical for sessions. Cursor is the id of the last item. An unknown cursor starts again from the first item."], ["Streams", "Event ids count from 0 per connection; heartbeat every 15 s; reconnect with Last-Event-ID. Live parts are best effort."], ["Validation", "Unknown JSON fields are rejected; each bad field is reported; validate answers 200 with valid:false for a bad draft."]]}, {"title": "Defaults and limits", "head": ["Setting", "Value", "Where"], "rows": [["server.address", "127.0.0.1 (Docker image: 0.0.0.0)", "boot application.yaml, Dockerfile"], ["yukta.api-key", "empty (API open)", "web ApiKeyFilter"], ["Page size", "default 500, maximum 1000; a limit below 1 means 500", "Pagination"], ["Heartbeat comment", "every 15 s", "SseStreams"], ["Live log buffer", "1024 lines per running log stream", "LogManagementController"], ["Request id", "[A-Za-z0-9-]{1,64}, else a UUID", "RequestTracingFilter"], ["Session id", "at most 256 chars, no '/', backslash or '..'", "@SessionId (core)"], ["Session name and description", "at most 256 chars each; both required", "ConfigRequest"], ["Project path", "required, at most 1024 chars, no other check", "@ProjectPath (core)"], ["Node command payload", "1 to 100 entries", "NodeCommandRequest"], ["Stop mode", "DRAIN (default), CANCEL, KILL", "WorkflowController"], ["Node stop", "immediate=false, reason 'Stopped via REST API'", "ExecutionControlController"], ["Status stream history", "includeHistory=true; core keeps 5 minutes", "ExecutionController, application.yaml"]]}, {"title": "Enforced or not", "head": ["Concern", "Status", "What happens"], "rows": [["Authentication", ["part", "Optional shared key"], "One key; no users."], ["Authorization and roles", ["lost", "None"], "Every caller can do everything, including running code-executing workflows."], ["Session ownership", ["part", "Only on routes that carry a session"], "Canonical /api/executions routes check existence only."], ["Caller identity in logs", ["lost", "None"], "Access log has method, path, status, duration and request id."], ["Rate limiting", ["lost", "None"], "No limit on request rate or on open streams in this module."], ["Request body size", ["info", "Framework default"], "No setting for it in this repository."], ["Input validation", ["ok", "At the edge"], "Shape and length are checked before core."], ["Secrets in responses", ["part", "Not redacted"], "Config is returned as stored; safe only if authors use secret references."]]}, {"title": "What the web layer remembers", "lede": "It holds nothing that matters across a restart.", "head": ["Item", "After a restart"], "rows": [["Open SSE connections", ["lost", "All drop; clients must reconnect with Last-Event-ID"]], ["Event ids", ["lost", "Positions in a rebuilt stream, not stored anywhere"]], ["Idempotency keys", ["info", "Kept by core, not web (depends on core's log)"]], ["API key", ["ok", "Read again from configuration"]], ["Sessions, runs, logs", ["info", "Owned by core; depends on its store and log settings"]]]}]}, "ref": [{"id": "ep-sessions", "title": "Endpoints: sessions, workflows and drafts", "lede": "42 operations in total; 56 routes counting 14 deprecated aliases. All paths are under /api and answer with the ApiResponse envelope unless noted.", "head": ["Method", "Path", "What it does", "Notes", "Errors"], "rows": [["POST", "/api/sessions", "Create or replace a session and its workflows", "Body: ConfigRequest. 200, no data", "400 validation, unknown field"], ["GET", "/api/sessions?limit&cursor", "Session ids, alphabetical", "Paged (X-Next-Cursor). Loads all ids per call", "-"], ["GET", "/api/sessions/summaries?limit&cursor", "Lean rows: id, name, tag names, workflow count", "Paged; loads only the page's configs, in order; unreadable sessions are skipped with a warning", "-"], ["GET", "/api/sessions/{sid}", "Details: tag names and workflow ids", "Not the full config (tag values omitted)", "404 unknown session"], ["GET", "/api/sessions/{sid}/config", "Full configuration, same shape POST accepts", "Node config returned as stored", "404"], ["GET", "/api/sessions/{sid}/workflows", "Workflow summaries: node and edge counts, latest run status", "Latest status from core", "404"], ["GET", "/api/sessions/{sid}/workflows/{wid}", "One workflow definition", "-", "404"], ["GET", "/api/sessions/{sid}/workflows/{wid}/graph", "Nodes with plugin metadata and ports, edges, topological order", "For the canvas", "404"], ["GET", "/api/sessions/{sid}/workflows/{wid}/executions?limit&cursor", "Runs of one workflow, newest first", "Paged", "404"], ["POST", "/api/sessions/validate", "Dry-run a draft workflow", "Always 200: valid, first problem, output ports per node. Catches errors itself", "400 only for a malformed body"]]}, {"id": "ep-runs", "title": "Endpoints: starting, stopping and reading runs", "lede": "Canonical routes are /api/executions/...; the /api/workflow/... forms are deprecated aliases. The CLI still calls almost all aliases; the UI calls the two status aliases.", "head": ["Method", "Path", "What it does", "Notes", "Errors"], "rows": [["POST", "/api/workflow/start", "Start a run. Header Idempotency-Key optional", "202 with data.executionId. Body: sessionId, workflowId, payload", "404 session or workflow, 429 limit, 400 body"], ["POST", "/api/workflow/{sid}/{wid}/stop?mode=", "Stop every active run of a workflow", "DRAIN (default), CANCEL or KILL. Returns signalled ids", "404"], ["GET", "/api/workflow/{sid}/history?limit&cursor", "A session's runs, newest first", "Paged; whole history loaded then cut", "404 unknown session"], ["POST", "/api/executions/{eid}/stop (alias /api/workflow/executions/{eid}/stop)", "Stop one run", "Returns the same id. No ownership check", "404"], ["POST", "/api/executions/{eid}/restart (alias /api/workflow/executions/{eid}/restart)", "Stop and start again with the original payload", "New execution id. No ownership check", "404; 500 if a restart is already in progress"], ["POST", "/api/executions/{eid}/restart/{node} (alias /api/workflow/executions/{eid}/restart/{node})", "Restart from a node using its parents' checkpoints", "New execution id", "404"], ["POST", "/api/executions/{eid}/nodes/{nid}/retry", "Restart from a failed node", "Canonical only. Existence checked", "404"], ["GET", "/api/executions/{eid} (alias /api/workflow/{sid}/status/{eid})", "Progress snapshot", "Alias carries a session and checks ownership", "404"]]}, {"id": "ep-control", "title": "Endpoints: controlling a live run", "lede": "Each answers 200 with the execution id after core acknowledges the command. Aliases are /api/workflow/{sid}/{eid}/... and /api/workflow/{sid}/{eid}/node/{nid}/...; they check ownership, the canonical routes check existence.", "head": ["Method", "Path", "What it does", "Notes", "Errors"], "rows": [["POST", "/api/executions/{eid}/pause | resume", "Pause or resume the whole run", "Alias exists", "404; 403 supervisor veto"], ["POST", "/api/executions/{eid}/nodes/{nid}/pause | resume", "Pause or resume one node", "Alias exists", "404"], ["POST", "/api/executions/{eid}/nodes/{nid}/stop?immediate=false&reason=", "Stop a node, draining or at once", "Defaults: drain, 'Stopped via REST API'. Alias exists", "404"], ["POST", "/api/executions/{eid}/nodes/{nid}/skip?skip=true", "Mark a node as pass-through, or undo", "Core rejects it for running executions. Alias exists", "400 rejected, 404"], ["POST", "/api/executions/{eid}/nodes/{nid}/step/enable | step/disable", "Turn step mode on or off", "Alias exi
