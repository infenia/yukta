<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta Web API Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0}
pre code{background:none;padding:0}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:56px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
.lede{color:var(--muted);max-width:760px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul,.card ol{padding-left:18px;margin:6px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;text-decoration:none}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"]{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"]{color:#111}}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);min-width:220px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pipe{width:100%;height:auto;display:block}
.pipe .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2;transition:fill .15s,stroke .15s}
.pipe .box text{fill:var(--text);font:600 13px var(--sans)}
.pipe .box .s{fill:var(--muted);font:12px var(--mono)}
.pipe .box.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.pipe .arrow{stroke:var(--muted);stroke-width:1.4;fill:none}
.pipe .box{cursor:pointer}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.stepbody h3{margin-top:0}
.refs{font-size:13px;color:var(--muted)}
.flag{border-left:3px solid var(--p1);background:var(--p1-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:10px;font-size:14px}
.flag.p0{border-color:var(--p0);background:var(--p0-soft)}
.pkgs{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.pkglist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:6px;padding:7px 10px;background:transparent;font-family:var(--mono);font-size:12.5px}
.pkglist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.finding{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.finding summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}
.finding summary::-webkit-details-marker{display:none}
.finding .id{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:30px}
.finding .t{font-weight:600}
.finding .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.finding .body{padding:0 14px 14px 14px;border-top:1px solid var(--line)}
.finding .body dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;margin:12px 0 0}
.finding .body dt{color:var(--muted);font-size:13px}
.finding .body dd{margin:0;min-width:0;overflow-wrap:anywhere}
.finding.done{opacity:.55}
.finding.done .t{text-decoration:line-through}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.progress .bar{flex:1;height:8px;margin:0}
.progress .bar>i{background:var(--ok)}
.empty{color:var(--muted);padding:20px;text-align:center}
.score td:nth-child(2){font-family:var(--mono);white-space:nowrap}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.pkgs{grid-template-columns:1fr}
  .finding summary{grid-template-columns:auto minmax(0,1fr)}
  .finding .meta{grid-column:1/-1}
  .finding .body dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
</nav>
<main id="main"></main>
</div>
<script>
var DATA = {"module": "web", "htmlTitle": "Yukta Web API Guide", "title": "web module guide", "date": "2026-10-09", "lede": "The REST and Server-Sent-Events boundary. Eight WebFlux controllers turn HTTP into calls on core's <code>SessionService<\/code>, <code>WorkflowService<\/code>, <code>ControlBusGateway<\/code>, <code>WorkflowGraphService<\/code> and <code>PluginLogStore<\/code>, and wrap the results in <code>ApiResponse&lt;T&gt;<\/code>.", "stats": [["48", "main files"], ["≈3.3k", "main lines"], ["34", "operations"]], "overviewHtml": "<h3>Design in one paragraph<\/h3><p>Every controller returns <code>Mono&lt;ApiResponse&lt;T&gt;&gt;<\/code>, or a <code>Flux<\/code> of <code>ServerSentEvent<\/code> for streams. Controllers do not catch errors: core throws <code>NotFoundException<\/code> (a subclass of <code>IllegalArgumentException<\/code>) for missing sessions, workflows, executions and nodes, and <code>GlobalExceptionHandler<\/code> maps 404 / 400 / 429 / 500 consistently. Request bodies are records validated with Jakarta Bean Validation, and MapStruct maps DTOs to core models. List endpoints return bare lists, paged with <code>?limit=&amp;cursor=<\/code> and an <code>X-Next-Cursor<\/code> header. Three <code>WebFilter<\/code>s run first: <code>ApiKeyFilter<\/code> (opt-in key for <code>/api/**<\/code>), <code>RequestTracingFilter<\/code> (request ID in headers, Reactor context and the log MDC) and <code>RequestLoggingFilter<\/code> (one INFO line per request). The server listens on loopback unless told otherwise. OpenAPI is served by springdoc at <code>/swagger-ui.html<\/code>.<\/p><div class=\"flag\"><b>Review status:<\/b> all 17 findings from the 2026-10-09 review (W1 … W17) are resolved. The Improvement board is kept as a record of what changed.<\/div>", "score": [["API design", "4/5", "One execution URL shape with deprecated aliases; ownership checked; paged lists"], ["Security", "3/5", "Loopback by default, optional API key, no message leaks, typed admin command. Still no per-user roles"], ["Error handling", "4.5/5", "Typed exceptions map to 404 / 400 / 429 / 500; no controller catch blocks"], ["Streaming", "4/5", "History and live are joined without gaps; IDs, Last-Event-ID and keep-alive. Duplicate removal is by message text"], ["Simplicity", "4/5", "WorkflowController went from 974 to 142 lines; no wrapper DTOs"], ["Tests", "4.5/5", "WebTestClient cases for every error path"]], "flowTitle": "Request lifecycle", "steps": [{"k": "Filters", "cls": "ApiKeyFilter · RequestTracingFilter · RequestLoggingFilter", "d": "<code>ApiKeyFilter<\/code> rejects <code>/api/**<\/code> calls without the configured key. <code>RequestTracingFilter<\/code> accepts a client <code>X-Request-ID<\/code> only if it matches <code>[A-Za-z0-9-]{1,64}<\/code>, otherwise generates one, then returns it as <code>X-Request-ID<\/code>/<code>X-Correlation-ID<\/code> and writes it to the Reactor context and the MDC. <code>RequestLoggingFilter<\/code> logs one INFO line with status and duration.", "f": ["W13", "W12"]}, {"k": "Auth", "cls": "ApiKeyFilter · server.address", "d": "Set <code>yukta.api-key<\/code> to require <code>Authorization: Bearer &lt;key&gt;<\/code> or <code>X-API-Key<\/code> on <code>/api/**<\/code>. The server binds to <code>127.0.0.1<\/code> unless <code>YUKTA_SERVER_ADDRESS<\/code> says otherwise (the Docker image sets <code>0.0.0.0<\/code>). Per-user roles are not implemented.", "f": ["W1"]}, {"k": "Bind", "cls": "@Valid @RequestBody records", "d": "JSON is bound to request records such as <code>ConfigRequest<\/code>, <code>WorkflowStartRequest<\/code> and <code>NodeCommandRequest<\/code>. Unknown properties are rejected, and each kind of malformed input gets its own message.", "f": ["W6", "W3"]}, {"k": "Map", "cls": "SessionMapper · WorkflowMapper · AppConfigMapper", "d": "MapStruct converts the DTOs to core models (<code>SessionConfigData<\/code>, <code>WorkflowDefinition<\/code>) and back.", "f": []}, {"k": "Core call", "cls": "SessionService · WorkflowService · ControlBusGateway · ExecutionAccess", "d": "Calls the reactive core APIs. Paths with a session ID go through <code>ExecutionAccess<\/code>, which reads the session's own execution record, so another session's executions and finished runs behave the same way as in the MCP tools.", "f": ["W7"]}, {"k": "Wrap", "cls": "ApiResponse.success", "d": "Successful results are wrapped in <code>{status, message, data, timestamp}<\/code>. Lists are bare arrays in <code>data<\/code>.", "f": ["W14", "W15"]}, {"k": "Errors", "cls": "GlobalExceptionHandler", "d": "No controller catches errors. <code>NotFoundException<\/code> and <code>ResourceNotFoundException<\/code> give 404, <code>IllegalArgumentException<\/code> and validation errors 400, <code>ExecutionRejectedException<\/code> 429. Anything else is a 500 with a fixed message and the request ID; the cause is logged.", "f": ["W2", "W4", "W5", "W6"]}, {"k": "Stream", "cls": "ExecutionController · LogManagementController · SseStreams", "d": "SSE: events carry sequential IDs (<code>Last-Event-ID<\/code> resumes) and a keep-alive comment every 15 s. Logs subscribe to the live feed first, read the stored history, then join them so nothing is lost at the seam.", "f": ["W8", "W9"]}], "pkgTitle": "Code explorer", "pkgs": [["ExecutionControlController", 1, 247, "Pause, resume and per-node pause/resume/stop/skip/step, at <code>/api/executions/{id}/…<\/code> and the legacy <code>/api/workflow/…<\/code> paths.", "controller/ExecutionControlController"], ["SessionConfigController", 1, 234, "Create or update a session, list sessions and summaries (paged), get one session, and its workflows.", "controller/SessionConfigController"], ["LogManagementController", 1, 175, "Log SSE streams: formatted lines and structured entries. History and live feed joined without gaps.", "controller/LogManagementController"], ["ExecutionController", 1, 167, "Stop, restart, restart-from-node, status and the status SSE stream, at both URL shapes.", "controller/ExecutionController"], ["WorkflowDetailsController", 1, 144, "Workflow graph for the React Flow canvas, plus the per-workflow execution list (paged).", "controller/WorkflowDetailsController"], ["WorkflowController", 1, 142, "Start a workflow, stop all runs of one, and a session's execution history (paged).", "controller/WorkflowController"], ["PluginController", 1, 143, "Plugin catalogue and plugin details.", "controller/PluginController"], ["ControlBusController", 1, 111, "Active nodes, the last heartbeat, and a validated admin command to a node.", "controller/ControlBusController"], ["controller helpers", 3, 209, "<code>ExecutionAccess<\/code> (session ownership), <code>Pagination<\/code> (cursor paging) and <code>SseStreams<\/code> (IDs, keep-alive).", "controller/ExecutionAccess"], ["dto", 27, 869, "Request records (4) and response records (23).", "dto"], ["exception", 3, 416, "<code>GlobalExceptionHandler<\/code>, <code>ResourceNotFoundException<\/code>, <code>ValidationException<\/code>.", "exception"], ["filter", 3, 194, "API key, request tracing and request logging.", "filter"], ["mapper", 3, 190, "MapStruct mappers for sessions, workflows and app config.", "mapper"], ["model/api", 1, 99, "<code>ApiResponse&lt;T&gt;<\/code> envelope with <code>FieldError<\/code>.", "model/api"]], "sections": [{"id": "endpoints", "title": "Endpoint map", "lede": "All 34 operations (48 routes, counting legacy aliases). Every <code>/api/workflow/…<\/code> execution route is a deprecated alias of an <code>/api/executions/…<\/code> route.", "html": "<div class=\"card tablewrap\"><table><tr><th>Method<\/th><th>Path<\/th><th>Purpose<\/th><th>Notes<\/th><\/tr><tr><td>POST<\/td><td class=\"mono\">/api/sessions<\/td><td>Create or update a session and its workflows<\/td><td>Auth: <code>yukta.api-key<\/code><\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/sessions?limit&amp;cursor<\/td><td>Session IDs, alphabetical<\/td><td>Paged<\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/sessions/summaries?limit&amp;cursor<\/td><td>Session table rows<\/td><td>Paged; loads only the page<\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/sessions/{sid}<\/td><td>Session config<\/td><td><\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/sessions/{sid}/workflows[/{wid}]<\/td><td>Workflow summaries / definition<\/td><td><\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/sessions/{sid}/workflows/{wid}/graph<\/td><td>Graph for the canvas<\/td><td><\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/sessions/{sid}/workflows/{wid}/executions<\/td><td>Executions of a workflow<\/td><td>Paged<\/td><\/tr><tr><td>GET (SSE)<\/td><td class=\"mono\">/api/sessions/{sid}/executions/{eid}/logs[/entries]<\/td><td>Log stream<\/td><td>404 for a foreign session; IDs and keep-alive<\/td><\/tr><tr><td>POST<\/td><td class=\"mono\">/api/workflow/start<\/td><td>Start an execution<\/td><td>202; 404 unknown workflow; 429 limit<\/td><\/tr><tr><td>POST<\/td><td class=\"mono\">/api/workflow/{sid}/{wid}/stop<\/td><td>Stop all executions of a workflow<\/td><td><\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/workflow/{sid}/history<\/td><td>Execution history<\/td><td>Paged<\/td><\/tr><tr><td>POST<\/td><td class=\"mono\">/api/executions/{eid}/stop|restart|restart/{node}<\/td><td>Execution lifecycle<\/td><td>Alias: /api/workflow/executions/{eid}/…<\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/executions/{eid}<\/td><td>Progress snapshot<\/td><td>Alias: /api/workflow/{sid}/status/{eid}<\/td><\/tr><tr><td>GET (SSE)<\/td><td class=\"mono\">/api/executions/{eid}/status/stream<\/td><td>Progress stream<\/td><td>Alias: /api/workflow/{sid}/status/{eid}/stream<\/td><\/tr><tr><td>POST<\/td><td class=\"mono\">/api/executions/{eid}/pause|resume<\/td><td>Workflow pause<\/td><td>Alias: /api/workflow/{sid}/{eid}/pause|resume<\/td><\/tr><tr><td>POST<\/td><td class=\"mono\">/api/executions/{eid}/nodes/{nid}/pause|resume|stop|skip|step[/enable|/disable]<\/td><td>Node control<\/td><td>Alias: /api/workflow/{sid}/{eid}/node/{nid}/…; skip is rejected by core (400)<\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/plugins[/{type}]<\/td><td>Plugin catalogue<\/td><td><\/td><\/tr><tr><td>GET<\/td><td class=\"mono\">/api/control/nodes, /control/workflows/{wid}/nodes[/{nid}/heartbeat]<\/td><td>Active nodes and heartbeat<\/td><td><\/td><\/tr><tr><td>POST<\/td><td class=\"mono\">/api/control/workflows/{wid}/nodes/{nid}/command<\/td><td>Admin command to a plugin<\/td><td>Validated body (1–100 entries); DTO response<\/td><\/tr><\/table><\/div>"}, {"id": "conventions", "title": "Conventions for new endpoints", "html": "<div class=\"grid g2\"><div class=\"card\"><h3>Target shape<\/h3><pre><code>@PostMapping(\"/executions/{id}/pause\")\npublic Mono&lt;ApiResponse&lt;ExecutionRef&gt;&gt; pause(@PathVariable String id) {\n  return controlBus.pauseWorkflow(id)\n      .thenReturn(ApiResponse.ok(new ExecutionRef(id)));\n  // no onErrorResume: core throws ResourceNotFoundException,\n  // GlobalExceptionHandler maps it to 404\n}<\/code><\/pre><\/div><div class=\"card\"><h3>Rules<\/h3><ul><li>Don't catch errors in controllers. Throw typed exceptions from core.<\/li><li>Don't branch on <code>getMessage()<\/code> text.<\/li><li>Don't send exception messages to clients on 5xx.<\/li><li>If a path has <code>sessionId<\/code>, verify that the resource belongs to it.<\/li><li>Paginate every list endpoint.<\/li><li>Rely on the request filter for logging. Don't add per-endpoint INFO logs.<\/li><li>SSE: send a heartbeat comment and an event <code>id<\/code>.<\/li><\/ul><\/div><\/div>"}], "findings": [{"id": "W1", "sev": "P0", "area": "Security", "pkg": ["SessionConfigController", "WorkflowController", "ControlBusController"], "t": "No authentication or authorisation on any endpoint", "where": "No spring-security and no SecurityWebFilterChain. POST /api/sessions, /api/workflow/**, /api/control/** are all open", "impact": "Anyone on the network can submit and run workflows, which can execute code (plugin-api A1, process-executor).", "fix": "Bind to 127.0.0.1 by default and add an API-key WebFilter. Later: OAuth2 resource server with roles.", "eff": "M", "fixed": true, "res": "server.address defaults to 127.0.0.1 (YUKTA_SERVER_ADDRESS opts in; the Docker image sets 0.0.0.0). ApiKeyFilter enforces yukta.api-key on /api/**. OAuth2 and roles remain future work."}, {"id": "W2", "sev": "P1", "area": "Security", "pkg": ["exception", "WorkflowController"], "t": "Exception messages leak to clients", "where": "handleGenericException, handleIllegalState, controller FieldError(e.getMessage())", "impact": "Internal details are exposed.", "fix": "For 5xx, return a fixed message plus the request ID and log the cause.", "eff": "S", "fixed": true, "res": "5xx responses carry a fixed message plus the request ID; causes are logged. Only NotFound, validation and illegal-argument messages reach clients."}, {"id": "W3", "sev": "P2", "area": "Security", "pkg": ["ControlBusController"], "t": "The admin command endpoint takes an arbitrary map", "where": "sendCommand(@RequestBody Map<String,Object>) returns the raw Message<?>", "impact": "Unvalidated input reaches plugins, and the internal envelope is exposed.", "fix": "A typed @Valid request, auth, and a DTO response.", "eff": "S", "fixed": true, "res": "The command body is a validated NodeCommandRequest (1–100 entries, same bare-object wire format) and the reply is a NodeCommandResponse DTO. Auth comes from W1."}, {"id": "W4", "sev": "P1", "area": "Correctness", "pkg": ["WorkflowController"], "t": "Controller error mapping turns failures into 404", "where": "start/stopWorkflow/stopExecution catch every error; restart/restartFromNode/executeControlSignal catch every IllegalArgumentException", "impact": "Validation and internal errors are reported as 'not found'.", "fix": "Delete them, throw ResourceNotFoundException in core, and let GlobalExceptionHandler map the status.", "eff": "M", "fixe
