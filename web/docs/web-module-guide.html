sts", "404"], ["POST", "/api/executions/{eid}/nodes/{nid}/step", "Let exactly one message through", "Node must be in step mode. Alias exists", "404"], ["POST", "/api/executions/{eid}/nodes/{nid}/breakpoint?field=&equals=", "Pause the node when a payload field equals a value", "Canonical only. No ownership check", "404"], ["DELETE", "/api/executions/{eid}/nodes/{nid}/breakpoint", "Clear the breakpoint", "Canonical only", "404"], ["POST", "/api/executions/{eid}/priority?priority=", "Change the priority of a run waiting for a slot", "Higher runs first. Canonical only", "400 if not waiting"], ["POST", "/api/scheduler/limits?maxConcurrent=&maxPerWorkflow=", "Set the global execution limits live", "Data: both values. 0 = no limit, negative treated as 0. Not remembered after restart", "-"]]}, {"id": "ep-streams", "title": "Endpoints: streams (Server-Sent Events)", "lede": "All send numbered events and a ': ping' comment every 15 s. Reconnect with the Last-Event-ID header.", "head": ["Method", "Path", "What it does", "Notes", "Errors"], "rows": [["GET (SSE)", "/api/executions/{eid}/status/stream?includeHistory=true (alias /api/workflow/{sid}/status/{eid}/stream)", "Progress events for one run", "History window is core's setting (5 minutes)", "404 before the stream starts"], ["GET (SSE)", "/api/sessions/{sid}/executions/{eid}/logs", "Formatted log lines: stored, then live", "Ends when the run is terminal. 1024-line live buffer", "404 unknown or foreign run"], ["GET (SSE)", "/api/sessions/{sid}/executions/{eid}/logs/entries", "Structured entries (level, stream, message)", "Same join as /logs", "404"], ["GET (SSE)", "/api/events/stream?executionId=&type=", "All execution events", "Types: NodeStatusChanged, WorkflowStatusChanged, ControlOutcome, LogLine. No replay, no session filter, best effort", "-"]]}, {"id": "ep-catalogue", "title": "Endpoints: catalogue, control bus and supervisors", "head": ["Method", "Path", "What it does", "Notes", "Errors"], "rows": [["GET", "/api/plugins", "All plugin types with category", "Handles its own errors (500 with exception text)", "500"], ["GET", "/api/plugins/{type}", "Description, usage pattern, UI design, output ports, configSchema", "404 built locally", "404"], ["GET", "/api/control/nodes", "All nodes registered on the control bus", "Not scoped by session", "-"], ["GET", "/api/control/workflows/{wid}/nodes", "Live nodes of a workflow id", "Not scoped by session", "-"], ["GET", "/api/control/workflows/{wid}/nodes/{nid}/heartbeat", "Last heartbeat message of a node", "-", "-"], ["POST", "/api/control/workflows/{wid}/nodes/{nid}/command", "Send an admin command to a live plugin", "Body is a map of 1 to 100 entries; source 'CONSOLE'. Returns the plugin's response payload", "400 body, 404 node"], ["GET", "/api/supervisors", "Supervisors and control-plane plugins in review order", "Fields: id, kind, type, order, dryRun, maxCommandsPerSecond, applied, rejected, recorded, rateLimited", "-"]]}, {"id": "errors", "title": "Error mapping", "lede": "One handler for the whole module. Every row answers with the ApiResponse error envelope.", "head": ["Exception", "Status", "Message", "Typical cause"], "rows": [["Bean-validation failure on a body", "400", "'Validation failed' with one entry per field", "Missing name, blank workflow id"], ["Malformed JSON, unknown field", "400", "'Invalid request body' with the field, or a generic reason", "workflowID typo"], ["ConstraintViolationException", "400", "'Constraint violation' with paths", "Annotated parameters"], ["ValidationException (web)", "400", "Its message and its list of errors", "Explicit validation"], ["IllegalArgumentException", "400", "The exception message", "Rejected state change, such as priority of a run that is not waiting"], ["NotFoundException (core) or ResourceNotFoundException (web)", "404", "The exception message", "Unknown session, workflow, execution or node"], ["ControlRejectedException", "403", "The supervisor's reason", "A supervisor vetoed the command"], ["ExecutionRejectedException", "429", "The exception message", "Core's execution limit, or shutting down"], ["IllegalStateException", "500", "'An unexpected error occurred. Reference: <request id>'", "Includes conflicts such as 'Restart already in progress'"], ["Any other exception", "500", "Same generic text", "Bugs and unmapped failures"]]}, {"id": "conventions", "title": "Controller conventions", "lede": "What a new endpoint should do to fit in.", "head": ["Convention", "Why"], "rows": [["Return Mono<ApiResponse<T>> (or a Flux of ServerSentEvent for streams)", "Keeps the server non-blocking and the reply shape uniform."], ["Do not catch errors; let core throw", "One handler decides the status code; no controller can leak or mis-map an error."], ["Use /api/executions/{eid}/... for execution routes", "The /api/workflow/... forms are deprecated aliases kept for the UI and CLI."], ["Call ExecutionAccess when a session is in the path", "Hides other sessions' runs behind the same 404 as unknown ones."], ["Use Pagination for lists and SseStreams for SSE", "Gives the standard limit, cursor, X-Next-Cursor, ids and heartbeat."], ["Put validation on a request record, not in the controller", "Records are immutable and validated before the method runs."], ["Write 4xx messages that are safe for a client", "Messages from core are echoed in 4xx replies."], ["Add the route to OpenAPI annotations", "Swagger UI and the UI's generated types are built from them."]]}, {"id": "aliases", "title": "Deprecated aliases and who uses them", "head": ["Alias", "Canonical route", "Used by"], "rows": [["/api/workflow/executions/{eid}/stop | restart | restart/{node}", "/api/executions/{eid}/stop | restart | restart/{node}", "CLI (UI uses the canonical form)"], ["/api/workflow/{sid}/status/{eid}", "/api/executions/{eid}", "UI and CLI"], ["/api/workflow/{sid}/status/{eid}/stream", "/api/executions/{eid}/status/stream", "UI and CLI"], ["/api/workflow/{sid}/{eid}/pause | resume", "/api/executions/{eid}/pause | resume", "CLI"], ["/api/workflow/{sid}/{eid}/node/{nid}/pause | resume | stop | skip | step | step/enable | step/disable", "/api/executions/{eid}/nodes/{nid}/...", "CLI (UI uses the canonical form)"]]}], "quality": [{"n": "Scalability", "pos": "Web keeps no state, so more instances would be easy in principle, but core holds the run state in one process and nothing here is shared. The non-blocking server handles many connections cheaply; the cost is in lists loaded in full and in streams with no cap.", "ceil": ["One core process behind all of it", "History and session lists are loaded in full then sliced", "Every open stream holds a subscription and, for logs, a 1024-line buffer, with no cap", "No rate limit on any route"], "have": ["Non-blocking WebFlux and virtual threads", "Page size capped at 1000", "Summaries load only the requested page"], "need": ["Page in the store (core), not by slicing a full list", "Limits on connections and request rate", "A multi-instance story for streams if core ever scales out"]}, {"n": "Performance", "pos": "Per-request work is small: bind, one core call, wrap. The risks are list endpoints that scale with data size and heavy streams.", "ceil": ["Page cost grows with history length (full load plus linear cursor search)", "Session summaries read configs one after another", "Log streams copy up to 1024 buffered lines per connection"], "have": ["Compile-time mappers (no reflection)", "Summaries read only one page of configs", "Heartbeats avoid reconnect storms behind proxies"], "need": ["Store-level paging by cursor", "Parallel or batched summary reads", "Load numbers for the stream endpoints (perf/ scripts exist at the repository root)"]}, {"n": "Availability", "pos": "Web has no state of its own to lose. Its availability is core's: if core is down or restarting every stream drops and clients must reconnect.", "ceil": ["Streams drop on restart; ids are not durable", "Slow readers miss live events", "No timeout or lifetime for streams"], "have": ["Heartbeat comments keep idle streams open through proxies", "Last-Event-ID resume", "500s carry a reference id for support"], "need": ["Documented reconnect behaviour for clients", "Health of the stream path under load", "Graceful stream close on shutdown"]}, {"n": "Security", "pos": "The weakest lens. Loopback by default and an optional constant-time key are sound basics, but one shared key means no identity, no roles and no audit, and the key leaves several surfaces unguarded.", "ceil": ["One shared key; anyone with it can run code through workflows", "API open by default; Docker image binds 0.0.0.0", "/mcp, Swagger, OpenAPI and actuator are outside the key", "Node config returned unredacted; 4xx echoes core messages"], "have": ["Loopback bind by default", "Constant-time key comparison", "Strict JSON and field validation", "500s carry no exception text; request ids validated"], "need": ["Per-user identity, roles and an audit trail", "A decision on guarding /mcp and docs", "Redaction of secrets in read APIs", "The UI able to send the key"]}, {"n": "Operability", "pos": "Good basics: a request id on every accepted call, one log line per request and uniform errors. Gaps: rejected calls are invisible and logs carry no caller.", "ceil": ["401s have no id and no log line", "No caller identity in logs", "No request metrics owned by this module"], "have": ["Request id in headers and every log line", "Access log with status and duration", "Uniform error envelope", "OpenAPI and Swagger UI"], "need": ["Log or count rejected requests", "Metrics for streams and 4xx/5xx rates", "Caller identity once it exists"]}, {"n": "Evolvability", "pos": "Small, consistent and well tested, but with leftovers: deprecated aliases still in use, response types that nothing uses, and two mappers that disagree on a default.", "ceil": ["14 aliases that clients still call", "11 unused response records", "Mapper duplication", "Contract is the OpenAPI plus the UI's generated types"], "have": ["Controller conventions and helpers", "Tests for every controller, mapper and filter", "Records and MapStruct keep DTOs short"], "need": ["Alias retirement plan", "Remove or move unused records", "A contract test that fails on breaking OpenAPI changes"]}], "riskNote": "Risk ids are short names. Impact (i) and effort (e) are our own 1 to 5 judgement. No backlog ids are used because the earlier review findings (W1 to W17) are all fixed.", "risks": [{"id": "sharedKey", "t": "One shared key for all of /api/**: no roles, no identity", "a": "Security", "i": 5, "e": 4, "c": ["filters", "sessions", "lifecycle", "control"], "why": "Every caller with the key can do everything: create sessions, start and stop any run, read any log, change the global limits. Some plugins run processes, scripts and SQL, so a caller who can write a workflow can run code on the server. The access log has no caller, so after an incident you cannot say who did it. Rotating the key needs a restart and changes it for every client at once.", "o": "Per-client keys with a name (logged on every request), then roles (read, run, author, admin) enforced in the filter or on routes; or delegate to an identity provider (OIDC or a gateway in front). At minimum separate 'author workflows' from 'run workflows'.", "q": "Who are the callers in practice: one trusted team, or several tenants? If one team, is a shared key plus loopback or a private network enough, and who owns that decision?"}, {"id": "openByDefault", "t": "API open by default; several surfaces outside the key", "a": "Security", "i": 4, "e": 2, "c": ["config", "filters"], "why": "With no key configured the whole API is open. The Docker image sets the bind address to 0.0.0.0, so a container started without a key is reachable and unprotected. Even with a key, the filter checks only /api/: the MCP endpoint (own key, open by default), the Swagger UI and OpenAPI document, and the actuator endpoints boot exposes stay open. The MCP tools can start and control runs, so a keyed REST API next to an open /mcp gives little protection. This is our judgement of the combined effect.", "o": "Refuse to start with a non-loopback address and no key (fail closed); guard /mcp, docs and actuator with the same filter or document why not; ship the container with a generated key.", "q": "Should the server refuse to listen on a non-loopback address without a key, even if that breaks a quick demo?"}, {"id": "uiNoKey", "t": "The bundled UI cannot send the API key", "a": "Functionality", "i": 3, "e": 2, "c": ["filters", "config"], "why": "The UI's API client sets only Content-Type; it has no way to add Authorization or X-API-Key. With a key configured, its calls would be 401 unless a proxy adds the header. So the safe configuration is awkward for the main client, which pushes operators towards leaving the key off. The CLI can send a bearer token.", "o": "Add key (or login) support to the UI; or serve the UI and API behind a reverse proxy that injects the header; or have the server serve the UI with its own session cookie.", "q": "What should authentication look like for a browser user: a pasted key, a login, or a gateway in front?"}, {"id": "ownershipGap", "t": "Ownership checks are inconsistent across routes", "a": "Security", "i": 3, "e": 2, "c": ["access", "control", "lifecycle", "streams", "catalogue"], "why": "The session check runs only on routes that carry a session in the path: the log streams and the legacy /api/workflow/{sid}/... aliases. The canonical /api/executions/... routes pass no session, so they only prove the run exists. Stop, restart and restart-from-node call no check at all. The events stream and the control-bus views have no session scope. Today every caller shares one key, so this is a consistency problem, not a hole. The danger is later: when real per-session identity arrives, retiring the aliases would silently remove the only routes that check, and the events stream would show every session's log lines.", "o": "Resolve the session from the execution on the server side (the tracker knows each run's session) and authorise against the caller's sessions in one place; add a session filter to the events stream; scope control-bus views by session.", "q": "Is a session meant to be a security boundary (tenant) or only a convenience grouping?"}, {"id": "configUnredacted", "t": "Node config returned as stored, including literal secrets", "a": "Security", "i": 3, "e": 3, "c": ["sessions"], "why": "GET /api/sessions/{sid}/config and /workflows/{wid} return node config unchanged. Core supports secret references (the decrypted: prefix, secrets from YUKTA_SECRET_ environment variables), so a careful author keeps tokens out of the definition. Nothing stops someone writing a literal API token into an HTTP node's headers. Then any reader of the API, and anything that logs responses, sees it. This is our judgement of a design weakness, not a confirmed leak.", "o": "Mask values of keys that look secret (the way core already blocks env names containing KEY or TOKEN) in read APIs; warn on save when a config contains a likely literal secret; document that secrets must be references.", "q": "Should the read API ever return a secret-looking value, or should editors work with masked values and send them back unchanged?"}, {"id": "pagingLinear", "t": "Paging slices a full list and finds the cursor by linear search", "a": "Performance", "i": 3, "e": 3, "c": ["lifecycle", "sessions"], "why": "History pages load the entire history from core and then walk it to find the cursor. Listing sessions loads and sorts every id for each page. Cost per page grows with the total, so reading a long history in pages of 100 costs roughly n pages times n items. An unknown cursor (for example the run was trimmed from history) silently restarts from the first item, so a client looping until there is no next cursor can see page 1 again, which looks like an endless loop.", "o": "Push the cursor into core and the stores (seek by id), keep the id-based cursor; return 400 or 410 for an unknown cursor instead of restarting; cap per-call work.", "q": "How long can a session's history realistically become, and does anyone page through all of it?"}, {"id": "slowReader", "t": "Event and log streams drop events for slow readers", "a": "Reliability", "i": 3, "e": 3, "c": ["streams"], "why": "The live parts use best-effort multicast feeds: if a reader does not keep up, events are dropped for that reader instead of slowing the engine. That protects the engine but means a UI can silently miss a status change or a log line. The events stream has no replay at all, and it ignores Last-Event-ID, so a reconnect cannot recover what was missed. A UI that treats the stream as complete can show a stale state.", "o": "Tell the client when it missed events (a gap marker or a lag counter) so it can refetch; add replay by sequence number for the events stream; document that streams are hints and status endpoints are the truth.", "q": "Is a missed event acceptable for the UI (it can refetch) but not for programmatic clients like the CLI or scripts?"}, {"id": "logSeam", "t": "Log stream joins history and live by text and timestamp; ids are positions", "a": "Correctness", "i": 2, "e": 3, "c": ["streams"], "why": "The seam between stored lines and live lines is closed by a heuristic: match by message text and a timestamp not after the snapshot, drop once. Two genuinely different lines with identical text in the seam window can lose one. The live buffer holds 1024 lines; a burst larger than that during the history read is lost. Event ids are positions in a stream that is rebuilt on every connect, so resuming with Last-Event-ID is exact only if history was not changed or trimmed meanwhile (for example by log retention).", "o": "Give every log line a durable sequence number in the log store and use it as the SSE id; join history and live on that number instead of text.", "q": "How much does a perfectly exact log stream matter, compared with the cost of changing the log store?"}, {"id": "legacyAliases", "t": "Deprecated /api/workflow/... aliases still in use", "a": "Evolvability", "i": 2, "e": 2, "c": ["lifecycle", "control", "access"], "why": "14 routes are aliases of canonical /api/executions/... routes. The CLI calls almost all of them and the UI still calls the two status aliases. Two route families mean double the tests and docs, and clients that never move. The aliases are also the only ones that check session ownership, so removing them without fixing the check lowers protection.", "o": "Move the CLI and UI to the canonical routes, fix the ownership check on them, announce a removal date and log alias use to see who remains.", "q": "When can we retire the aliases, and who owns migrating the CLI?"}, {"id": "localCatch", "t": "Three places catch errors themselves", "a": "Operability", "i": 2, "e": 1, "c": ["sessions", "catalogue", "errors"], "why": "The rule is that controllers never catch errors, so one handler decides what clients see. Three places break it. The validate endpoint turns every error into valid:false plus e.getMessage(), so an unexpected failure shows exception text in a 200. The plugin list turns a failure into a 500 whose message includes the exception text, which the central handler would have hidden. The session summaries endpoint logs and skips a session it cannot read, so a corrupt session simply vanishes from the table with a 200.", "o": "Let unexpected errors reach the central handler (catch only the validator's own validation exception); for summaries, return a marker row or a count of skipped sessions.", "q": "Is hiding an unreadable session from a table ever the right behaviour, or should it show as broken?"}, {"id": "noConflict", "t": "No 409: state conflicts become 500", "a": "Correctness", "i": 3, "e": 2, "c": ["errors", "lifecycle", "control"], "why": "The handler maps IllegalStateException to 500 with no message. Core uses it for real conflicts, for example 'Restart already in progress for this execution' when two restarts arrive together. The client sees a server error and a reference id for something that is a normal, retryable conflict. Monitoring that counts 5xx will flag it as an incident. The mapping is also by exception type, so any new core failure type is a 500 until someone adds a handler.", "o": "Introduce a typed conflict exception in core, map it to 409 with its message; review which IllegalStateException uses are client conflicts.", "q": "Which core failures are client-correctable, and should the web layer classify them or core?"}, {"id": "limitsEndpoint", "t": "Execution limits can be changed or removed by anyone, unvalidated", "a": "Governance", "i": 3, "e": 1, "c": ["control"], "why": "POST /api/scheduler/limits takes two integers. In core, a negative value is treated as 0 and 0 means no limit, so one call can remove the caps that protect the server. There is no validation of range, no confirmation and no record of who did it (core logs 'SetLimits(a, b)' without the caller). It changes the two global limits but not per-session ones, and the change is lost on restart.", "o": "Validate a sensible range, require an admin role, record the caller, and persist or reject changes that raise limits beyond a configured ceiling.", "q": "Should a runtime call be allowed to raise a limit above what the operator configured at startup?"}, {"id": "silent401", "t": "Rejected requests leave no trace", "a": "Operability", "i": 2, "e": 1, "c": ["filters"], "why": "The key filter runs before the request-id and access-log filters and ends the exchange itself. A 401 therefore has no X-Request-ID and no access-log line. A brute-force attempt or a mis-set client key is invisible in the log, and a caller cannot quote an id when reporting the problem.", "o": "Log (and count) rejections in the key filter with the source address and path; generate the request id before the key check.", "q": "Do we want failed-auth attempts counted and alertable, and by what source identifier?"}, {"id": "noLimits", "t": "No rate limit, stream cap or body-size setting in this module", "a": "Availability", "i": 3, "e": 3, "c": ["filters", "streams", "bind"], "why": "Nothing here limits how fast a client can call, how many streams it opens or how big a body it sends beyond framework defaults. Each log stream keeps a subscription and up to 1024 buffered lines; each events stream stays open indefinitely. A client (or a bug in one, such as a UI tab that reconnects in a loop) can consume memory and connections. Start and control endpoints can be hammered, though core's execution limits cap actual runs.", "o": "Per-client rate limits at a gateway or a filter, a cap on concurrent streams per client, a maximum stream lifetime, and an explicit body-size setting for config posts.", "q": "Do we run behind a gateway that already provides limits, or must the server protect itself?"}, {"id": "mapperDrift", "t": "Two mappers disagree on the default edge port", "a": "Correctness", "i": 2, "e": 2, "c": ["bind", "sessions"], "why": "SessionMapper (used when saving a session) turns a missing edge sourcePort into 'default'. AppConfigMapper (used by the dry-run validator) leaves it null. A draft can therefore be validated with a null port and saved with 'default'. If core treats these differently, a draft that validates could behave differently after saving. We did not confirm that core treats them differently, so this is a drift risk, not a known bug.", "o": "Use one mapper for request-to-definition conversion (or share the edge conversion) and cover it with a test that saves and validates the same payload.", "q": "Does core treat a null source port and 'default' as the same thing everywhere?"}, {"id": "deadDtos", "t": "Eleven response records in web are not used by web", "a": "Evolvability", "i": 1, "e": 1, "c": ["bind"], "why": "ControlBusStatus, SystemHealthMetrics, ErrorExample, SessionCreationGuide, PluginCreationGuide, SessionInfo, ExecutionRecord, SessionExecutionInfo, PluginRegistryEntry, PluginReference and SessionCreationResponse have tests but no use in web's main code; the mcp module has its own copies of most. They make the module look like it offers things it does not, and two copies can drift.", "o": "Delete the unused records and their tests, or move the shared ones to one module both use.", "q": "Are any of these part of a public contract (for example a client library) that makes deleting them a breaking change?"}], "adrs": [{"t": "Thin controllers; errors thrown, mapped in one place", "ctx": "A REST layer tends to grow its own rules and its own error formats per endpoint, which drift apart and sometimes leak internals.", "dec": "Controllers bind, call one core service and wrap the result. They do not catch errors. Core throws typed exceptions and GlobalExceptionHandler maps them to 400, 403, 404, 429 and 500. A 500 shows only a reference id.", "con": "Every endpoint fails in the same shape and rules live in one place (core), so REST, UI and MCP behave the same. But web depends on core's exceptions and messages, and unmapped types become 500.", "alt": "Catch and map in each controller: flexible but inconsistent and easy to leak. Return a result type instead of exceptions: explicit but noisy in reactive chains.", "rev": "a core failure needs a status the mapping cannot express (such as 409), or messages from core stop being safe to show."}, {"t": "Optional shared API key with a loopback default", "ctx": "Yukta started as a local developer tool; remote access must be possible but must not happen by accident.", "dec": "server.address defaults to 127.0.0.1. One optional key, yukta.api-key, guards /api/**; it is checked in a filter with a constant-time comparison.", "con": "Very easy to set up and a safe default on a laptop. No identity, no roles, no audit, and the Docker image binds to all interfaces, so safety depends on the operator setting the key.", "alt": "Full identity (OIDC, roles) from day one: right for multi-tenant use but heavy for a local tool. No auth and rely on a reverse proxy: simplest, but invisible in the product and easy to forget.", "rev": "more than one trusted party uses a server, or the server holds multi-tenant data, or any deployment is reachable from an untrusted network."}, {"t": "One ApiResponse envelope for success and error", "ctx": "Clients (UI, CLI, scripts, agents) need one predictable parsing path.", "dec": "Every reply is an ApiResponse with timestamp, status, message and data, or error, path and field errors. Lists are bare arrays inside data.", "con": "One parser everywhere and uniform OpenAPI. It differs from the standard ProblemDetail error format, so generic HTTP tooling does not understand it, and the status appears twice (HTTP and body).", "alt": "RFC 9457 ProblemDetail for errors and plain bodies for success: standard but two shapes. Wrapper types per endpoint: verbose and inconsistent.", "rev": "external integrations need standard error documents, or the envelope blocks streaming or large downloads."}, {"t": "Server-Sent Events with positional ids and a heartbeat", "ctx": "Clients need live status and logs; the data flows one way, from server to browser.", "dec": "SSE over plain HTTP. Events are numbered from 0 per connection, a ': ping' comment goes out every 15 s, and Last-Event-ID resumes by skipping already-seen ids. Logs subscribe to live before reading history.", "con": "Simple, proxy-friendly, automatic reconnect in browsers. Ids are positions, not durable sequence numbers, and live parts are best effort.", "alt": "WebSocket: two-way but heavier to proxy and no built-in resume. Polling: simplest but slower and more load. Message broker: durable but a large new dependency.", "rev": "clients need guaranteed, gap-free delivery or two-way interaction, or log lines get durable sequence numbers."}, {"t": "Cursor paging by item id over a loaded list", "ctx": "Lists (sessions, history) can be long; offsets break when new runs appear at the top.", "dec": "limit (default 500, max 1000) plus cursor = id of the last item; the next cursor is returned in X-Next-Cursor and the list stays a bare array. Web slices the list core returns.", "con": "Stable pages and a small client API. But cost grows with the full list, and an unknown cursor restarts at the first item.", "alt": "Offset paging: simple but shifts under inserts. Paging inside the store: efficient but needs core and store changes. Return everything: simplest, unbounded.", "rev": "a list grows past a few thousand items or paging cost shows up in latency."}, {"t": "Canonical /api/executions routes with deprecated /api/workflow aliases", "ctx": "Execution operations had grown several URL shapes; clients (UI, CLI) already depended on them.", "dec": "Every execution operation has one canonical path without a session, and the older session-carrying path stays as a deprecated alias that also checks ownership.", "con": "Existing clients keep working while the shape converges. Two route families to test, and the check and the alias are coupled.", "alt": "Hard cut: clean but breaks clients. Keep both forever: no migration but permanent clutter.", "rev": "the CLI and UI have moved, or ownership moves to server-side resolution."}, {"t": "Dry-run validate answers 200 with valid:false", "ctx": "An editor wants to check a draft on every change and show the first problem inline.", "dec": "POST /api/sessions/validate runs the real validator without saving and returns valid, the first problem and each node's output ports. Only a malformed body is a 400.", "con": "Easy for an editor, no HTTP error handling for a normal 'no'. But it needs its own error catching, which reports e.getMessage() for every kind of failure.", "alt": "Return 400 with errors: standard but treats a normal answer as an error. Validate only on save: simpler but a slower edit loop.", "rev": "validation needs to report many problems at once, or unexpected errors must not be shown to callers."}, {"t": "Web holds no state and delegates every decision to core", "ctx": "REST, the UI, the CLI and MCP must behave identically for starts, limits and control commands.", "dec": "Web keeps no state of its own and adds no rules. Limits, ordering, idempotency, supervisors and checkpoints are core's. Even ownership uses core's tracker.", "con": "No duplicated logic between REST and MCP; web is easy to test. But web cannot protect itself (no limits, no identity) unless core or a gateway does.", "alt": "Put policy (rate limits, quotas, per-user rules) in web: protects the edge but duplicates MCP's path. A shared policy layer in core: one place, more coupling.", "rev": "web needs per-client policy that MCP should not share, or the module is deployed apart from core."}], "evoLede": "A suggested order, from cheap and safe to large. Each step names the risks it addresses.", "evo": [{"id": "now", "n": "Today", "d": "Eleven controllers, three filters, one error handler. Loopback bind and an optional shared key. Streams with ids and a heartbeat. Cursor paging over full lists. Tests for every controller, mapper and filter.", "r": []}, {"id": "doors", "n": "Close the doors", "d": "Fail closed when the address is open and no key is set; guard /mcp, docs and actuator or decide why not; let the UI send the key; log and count rejected requests with a request id.", "r": ["openByDefault", "uiNoKey", "silent401"]}, {"id": "honest", "n": "Make the contract honest", "d": "Add a 409 for conflicts; stop the three local catches; validate and record limit changes; unify the edge-port default; apply ownership checks on the canonical routes and add a session filter to the events stream.", "r": ["noConflict", "localCatch", "limitsEndpoint", "mapperDrift", "ownershipGap"]}, {"id": "scale", "n": "Scale reads and streams", "d": "Page in the store; give log lines durable sequence numbers; tell slow readers they missed events; cap streams, rate and body size.", "r": ["pagingLinear", "logSeam", "slowReader", "noLimits"]}, {"id": "identity", "n": "Identity and roles", "d": "Named keys or a gateway with an identity provider, roles (read, run, author, admin), an audit of who did what, and masked secrets in read APIs.", "r": ["sharedKey", "configUnredacted"]}, {"id": "tidy", "n": "Retire aliases and dead code", "d": "Move the CLI and UI to canonical routes, remove the 14 aliases, delete the unused records.", "r": ["legacyAliases", "deadDtos"]}], "prompts": [["Security", "The same key lets a caller read a log and write a workflow that runs a shell command. Should those be one permission?", "filters", "sharedKey"], ["Security", "A container is started from the published image with no configuration. What stops a stranger on the same network from running code, and is that enough?", "config", "openByDefault"], ["Security", "Session ids look like tenant boundaries but the checks only run on some routes. What should a session mean to security?", "access", "ownershipGap"], ["Reliability", "A UI shows 'running' while the run actually finished, because the event was dropped for a slow tab. Where should the truth live?", "streams", "slowReader"], ["Correctness", "Two log lines with identical text arrive within the same millisecond around a connect. Which one should a viewer see, and how would you prove the stream correct?", "streams", "logSeam"], ["Performance", "A session has 200,000 runs of history. What does the 200th page of 500 cost, and what would you change first?", "lifecycle", "pagingLinear"], ["Operability", "On-call sees a spike of 500s. How would you tell conflicts from real bugs with today's mapping?", "errors", "noConflict"], ["Governance", "Who should be allowed to remove the execution limits at run time, and how would you know who did?", "control", "limitsEndpoint"], ["Evolvability", "The CLI uses the old routes and the UI the new ones. How do you migrate without breaking either, and what do you lose if the old routes carry the only ownership check?", "lifecycle", "legacyAliases"], ["Availability", "A client opens a thousand log streams and never reads them. What happens to memory, and what should the server do?", "streams", "noLimits"]], "gloss": [["WebFlux", "Spring's non-blocking web framework. A few event-loop threads serve many connections; code returns Mono or Flux instead of waiting.", "It is why streams are cheap, and why blocking code in a controller would be harmful."], ["Mono / Flux", "Reactor types for 'one result later' and 'many results over time'.", "Every controller returns one of them."], ["Reactive stream", "A sequence of values handled as they arrive, with the consumer able to signal how much it can take (back-pressure).", "The basis of Yukta's engine and of the SSE streams."], ["Back-pressure", "A slow consumer tells the producer to slow down, so memory stays bounded.", "The live feeds behind SSE do not use it; they drop events for slow readers instead."], ["Event loop", "A small set of threads that react to network events and must never block.", "A long blocking call in a controller would stall many requests."], ["Virtual thread", "A lightweight Java thread; enabled in boot so blocking work in plugins does not tie up real threads.", "Explains why blocking plugins do not hurt the web layer."], ["Filter (WebFilter)", "Code that wraps every HTTP exchange, before and after a controller.", "Web uses three: key, request id, access log."], ["Controller", "A class that maps URLs and HTTP methods to methods.", "Web has eleven; they hold no rules."], ["API key", "A shared secret a client sends with each call.", "The only access control in web; optional."], ["Bearer token", "An Authorization header of the form 'Authorization: Bearer <secret>'.", "One of the two accepted ways to send the key."], ["Constant-time comparison", "Comparing secrets so the time taken does not depend on where they differ.", "Stops guessing the key by timing."], ["Loopback", "The address 127.0.0.1: only the same machine can connect.", "The default bind, so a fresh install is not reachable from the network."], ["Request id", "A short unique label for one request, returned in X-Request-ID and printed in every log line.", "The only detail a 500 gives, and how support finds the cause."], ["MDC (logging context)", "A per-thread map the logger prints with each line, here holding the request id.", "Makes the id appear even when work hops threads."], ["Reactor context", "Per-subscription key-value data that travels with a reactive chain.", "Carries the request id between threads."], ["ApiResponse", "The standard JSON envelope for every reply.", "Clients parse one shape."], ["Record", "A short Java class for immutable data.", "All request and response types are records."], ["Bean Validation", "Annotations like @NotBlank and @Size that declare the rules for a field.", "Bad input is rejected at the edge with a field list."], ["MapStruct", "A tool that generates conversion code at compile time.", "Converts request records to core types without reflection."], ["GraalVM native image", "Compiles the server ahead of time to a fast-starting executable; limits reflection.", "One reason mappers are generated at build time."], ["OpenAPI / Swagger UI", "A machine-readable API description and a page that lets you try it, generated from the annotations.", "Served at /v3/api-docs and /swagger-ui.html; not behind the key."], ["Server-Sent Events (SSE)", "A one-way stream of text events over one HTTP response.", "Used for status, logs and the event feed."], ["Last-Event-ID", "A header a reconnecting SSE client sends with the last id it received.", "Lets the stream skip what the client already has."], ["Heartbeat comment", "A ': ping' line sent every 15 s on an idle stream.", "Keeps proxies from closing it as idle."], ["Replay buffer", "A bounded memory of recent items given to late subscribers.", "The log stream's live feed keeps 1024 lines so nothing written during the history read is lost."], ["Best-effort feed", "A broadcast that drops items for subscribers that cannot keep up.", "Why slow stream readers miss events."], ["Idempotency-Key", "A client-chosen header that makes a repeated request return the first result.", "Makes a retried start safe."], ["202 Accepted", "HTTP status meaning 'received, not finished'.", "What a start returns."], ["429 Too Many Requests", "HTTP status for 'slow down'.", "Core's limit refusing a start."], ["Cursor paging", "Reading a list in pages, each reply naming where to continue.", "Used for sessions and history."], ["Session", "A workspace that groups config, workflows and runs.", "The first id in many URLs."], ["Workflow", "A stored graph of nodes and edges.", "Started to make a run."], ["Execution", "One run of a workflow, with its own id.", "The id every control and stream route needs."], ["Node and port", "A node is one step; a port is a named output it can emit on, such as an error port.", "The validate reply lists each node's ports for the editor."], ["DAG / topological order", "A graph with one-way edges and no loops; a topological order lists steps so each follows its inputs.", "The graph endpoint returns it for the canvas."], ["Control bus", "Core's channel for commands to running nodes, with a registry of live nodes.", "The control views and the admin command talk to it."], ["Supervisor", "An automated reviewer (rule or AI) attached to the control bus that can approve, veto or issue commands.", "Its veto is the 403; GET /api/supervisors lists them."], ["DRAIN / CANCEL / KILL", "Stop modes: let in-flight work finish; cancel it; stop at once.", "Chosen by the mode parameter when stopping a workflow."], ["Breakpoint and step mode", "Debugging aids: pause a node on a value; hold messages and release one at a time.", "Available through the control endpoints."], ["Checkpoint", "Core's saved output of a node, used to restart a run from a node.", "Restart-from-node and retry rely on it."], ["Actuator", "Spring's built-in health, info and metrics endpoints.", "Exposed by boot and outside the key."], ["MCP", "Model Context Protocol: how AI agents call tools on a server.", "A parallel front door with its own key."]]};

 var msg=$("#copyMsg"),ta=$("#copyArea");if(!any){msg.textContent="Nothing to copy yet. Set a status or note first.";return}
 ta.hidden=false;ta.value=md;ta.rows=10;
 var done=function(){msg.textContent="Copied."},fail=function(){msg.textContent="Select the text below and copy it."};
 try{navigator.clipboard.writeText(md).then(done,fail)}catch(e){fail()}};
board();

document.addEventListener("click",function(e){var r=e.target.closest("[data-risk]");if(r){e.preventDefault();openRisk(r.getAttribute("data-risk"));return}
 var c=e.target.closest("[data-comp]");if(c){e.preventDefault();pick(c.getAttribute("data-comp"));$("#map").scrollIntoView({behavior:"smooth"})}});

if(D.prompts&&D.prompts.length){var pi=0;
 var deck=function(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
  $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}};
 deck()}
/* ---- glossary ---- */
function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
