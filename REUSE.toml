version = 1
SPDX-PackageName = "Yukta"
SPDX-PackageSupplier = "Infenia Private Limited"
SPDX-PackageDownloadLocation = "https://github.com/infenia/yukta"

[[annotations]]
path = ["build/", ".gradle/", "dist/", "ui/dist/", "target/", "node_modules/"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["**.lockfile", "**.lock", "go.mod", "go.sum", ".gitignore", "config/**/**.xml", "config/**/**.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["gradle/wrapper/**", "**.ico", "**.svg", "**.webmanifest", "ui/public/*.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [".claude/**", ".agents/**", ".codegraph/**", ".serena/**", ".idea/**", ".vscode/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports", "boot/src/main/resources/META-INF/native-image/**", "plugins/**/src/main/resources/META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports", "boot/src/main/resources/banner.txt", "test-support/src/main/resources/META-INF/services/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["examples/**/*.json", "examples/**/*.sh", "examples/11-dogfood/yk", "release/smoke-session.json", "config/mutation/baseline.json", "perf/baseline.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["bruno/**", "plugins/supervisors/rule-supervisor/rules.example.json", "config/license/**", "docs/superpowers/plans/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [".reuse/dep5", ".mcp.json", "skills-lock.json", "cli/go.mod", "cli/go.sum", "cli/.gitignore", ".gitmessage", ".git-commit-guide.md" ]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["ui/.gitignore", "ui/components.json", "ui/package.json", "ui/eslint-suppressions.json", "ui/package-lock.json", "ui/pnpm-lock.yaml", "ui/.prettierignore", "ui/.prettierrc.json", "ui/docs/design/**", "ui/src/assets/**", "ui/e2e/__snapshots__/**", "ui/e2e/test-results/**", "ui/playwright-report/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

# Copy-in shadcn/ui primitives (https://ui.shadcn.com), distributed under MIT
[[annotations]]
path = ["ui/src/components/ui/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "shadcn"
SPDX-License-Identifier = "MIT"

# Markdown and CSV test fixtures are covered here rather than with in-file headers, so no SPDX block is ever needed in them
[[annotations]]
path = ["**/*.md", "docs/**/*.mdx", "docs/docs.json", "docs/.mintignore", "docs/style.css", "docs/api/openapi.json", "release-please-config.json", ".release-please-manifest.json", "version.txt", "**/src/test/resources/**/*.csv"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Infenia Private Limited"
SPDX-License-Identifier = "Apache-2.0"

# The Plus edition is AGPL-3.0-only; its files carry the same SPDX header in the file itself. This
# entry covers the files that cannot (Markdown, resources) and must stay the last one so it wins.
[[annotations]]
path = ["plus/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Infenia Private Limited"
SPDX-License-Identifier = "AGPL-3.0-only"
