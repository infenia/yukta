version = 1
SPDX-PackageName = "Yukta"
SPDX-PackageSupplier = "Infenia Private Limited"
SPDX-PackageDownloadLocation = "https://github.com/infenia/yukta"

[[annotations]]
path = ["build/", ".gradle/", "dist/", "ui/dist/", "target/", "node_modules/"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["**.lockfile", "**.lock", "go.mod", "go.sum", ".gitignore", "config/**/**.xml", "config/**/**.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["gradle/wrapper/**", "**.ico", "**.svg", "**.webmanifest"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [".claude/**", ".agents/**", ".codegraph/**", ".serena/**", ".idea/**", ".vscode/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports", "boot/src/main/resources/META-INF/native-image/**", "plugins/**/src/main/resources/META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports", "boot/src/main/resources/banner.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["bruno/**", "config/license/**", "docs/superpowers/plans/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [".reuse/dep5", ".mcp.json", "skills-lock.json", "cli/go.mod", "cli/go.sum", "cli/.gitignore", ".gitmessage", ".git-commit-guide.md" ]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["ui/.gitignore", "ui/components.json", "ui/package.json", "ui/package-lock.json", "ui/pnpm-lock.yaml", "ui/.prettierignore", "ui/.prettierrc.json", "ui/docs/design/**", "ui/src/assets/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"
