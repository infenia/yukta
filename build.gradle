plugins {
    id 'java'
    alias(libs.plugins.spotless)
    id 'checkstyle'
    id 'pmd'
    alias(libs.plugins.spotbugs)
    id 'jacoco'
}

allprojects {
    group = 'io.jagratha'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'checkstyle'
    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    spotless {
        java {
            importOrder()
            removeUnusedImports()
            cleanthat()
            googleJavaFormat().reflowLongStrings()
            leadingTabsToSpaces(4)
            trimTrailingWhitespace()
            endWithNewline()
            targetExclude("bin/**", "build/**", "out/**")
        }
    }

    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
        ignoreFailures = false
        showViolations = true
    }

    pmd {
        toolVersion = libs.versions.pmd.get()
        ruleSets = ["${project.rootDir}/config/pmd/ruleset.xml"]
        ignoreFailures = false
        consoleOutput = true
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    // Disable quality tasks for everything except main
    tasks.configureEach { task ->
        if ((task.name.contains("Aot") || task.name.contains("Test")) && (task instanceof Checkstyle || task instanceof Pmd || task.class.name.contains("SpotBugs"))) {
            task.enabled = false
        }
    }
}

// Disable tasks for root project
tasks.withType(JavaCompile).configureEach { it.enabled = false }
tasks.withType(Test).configureEach { it.enabled = false }
tasks.withType(Checkstyle).configureEach { it.enabled = false }
tasks.withType(Pmd).configureEach { it.enabled = false }
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach { it.enabled = false }
tasks.withType(JacocoReport).configureEach { it.enabled = false }
