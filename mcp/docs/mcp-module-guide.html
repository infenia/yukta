<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta mcp Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
  <div class="others" id="others"></div>
</nav>
<main id="main"></main>

<script>
var DATA = {"module": "mcp", "title": "How Yukta mcp works, and where it can break", "htmlTitle": "Yukta mcp Guide", "date": "2026-10-12", "glance": {"lede": "The mcp module is Yukta's door for AI agents. An agent (a program driven by a language model) connects over the Model Context Protocol (MCP, an open standard for letting models call tools) and does what a person does through the REST API or the web UI: create sessions, start workflows, steer a run, read its logs and look up plugins. The module holds no state and runs no workflows itself. It checks the request, calls core, and shapes the answer so a model can use it. This page is for thinking about it, not documenting it: open a component, play a scenario, then challenge the weak spots.", "props": [["16 tools, thin by design", "Every tool is a few lines that call a provider, which calls core. The module repeats what the web layer does (ownership checks, control actions) without depending on it."], ["Stateless HTTP", "Each request stands alone at /mcp. There is no connection to keep and nothing is pushed to the agent: it polls status and logs."], ["Made for a model reader", "Errors say what to call next, lists are wrapped in records so none is cut short, and tool hints tell the client which calls only read and which can destroy."], ["Open unless you set a key", "One optional shared key guards the endpoint. It is not set in the shipped config, so protection today is mainly that the server listens on the local machine only."]], "start": [["primer", "Primer", "New here? Start with the problem, the vocabulary and one worked example: an agent debugging a failed run"], ["map", "System map", "Ten components, from the front-door filter to the plugin catalogue"], ["map", "Replay a call", "Six scenarios: debugging, creating a session, a wrong id, a bad regex, a missing key"], ["guarantees", "Limits and guarantees", "What is bounded, what is enforced, what is only a hint"], ["reference", "Tool catalogue", "All 16 tools, the control actions and the Spring AI gotchas"], ["quality", "Stress it", "Scalability, security, operability and the other lenses"], ["board", "Challenge it", "19 open risks, an impact x effort grid, your own notes"], ["adrs", "Decisions", "Eight ADRs, each with a 'revisit when' trigger"]]}, "primer": {"problem": "People run Yukta through a web UI or REST calls. AI agents (a coding assistant in an IDE, a chat app that can use tools) cannot click, and raw REST is a poor fit for them: they need to discover what exists, need arguments described in words, and need errors that tell them what to do next. The <b>mcp module<\/b> offers the same operations as <b>tools<\/b> that an agent discovers and calls through the Model Context Protocol. An agent can then say 'start workflow X, wait, read the error lines, retry the failed step' with no custom integration code.", "analogy": "Think of a staffed reception desk for robots. The building (core) already has a control room. People get in through the main entrance (REST, the UI). The robot entrance (<b>mcp<\/b>) has a clerk who checks the badge if one is required (the key filter), hands over a printed menu of what can be asked (the tool list, with each item's risk marked), makes sure you only ask about your own floor (the ownership check), rings the control room (core) and writes the answer in short plain sentences. The clerk keeps no files and forgets you between visits, so you come back and ask again whenever you want an update.", "layersTitle": "Where mcp sits", "layers": [["AI agents", "MCP clients: IDE assistants, chat apps, scripts", ""], ["boot", "Hosts the web server and sets the MCP endpoint /mcp, STATELESS, ASYNC", ""], ["mcp", "Tools, prompts, resources, the key filter. This page.", "me"], ["core", "Sessions, the control bus, plugin registry, log store: the real work", ""], ["plugin-api + plugins", "The node types a workflow is built from", ""]], "layersNote": "mcp depends on core only. It does not depend on web, so REST and MCP are two independent doors into the same engine.", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["MCP", "Model Context Protocol: an open standard where a server lists tools, prompts and resources, and an AI client calls them with JSON messages (JSON-RPC) over HTTP.", "Yukta is the server; Claude Desktop or an IDE assistant is the client."], ["Tool", "One callable operation with a name, typed arguments, a description for the model, and a typed result. Yukta has 16.", "start_workflow(sessionId, workflowId) returns the new execution id."], ["Session and workflow", "A session is a named workspace. It holds workflows: graphs of plugin nodes written as JSON. Creating a session stores its workflows; starting one runs it.", "Session 'ci' holds workflows 'build' and 'deploy'."], ["Execution", "One run of a workflow, with its own id, status, per-node progress and logs. A workflow can run many times, so it can have many executions.", "Execution e-42 of 'build' failed at node 'compile'."], ["Control bus", "The part of core that carries commands (pause, stop, skip, retry) to a run and reports its progress. mcp reaches it through one gateway object.", "control_node with action PAUSE becomes a pause command on the bus."], ["Signal, not state", "Most control tools return as soon as the command has been sent. They do not wait until the node actually changed. The agent checks the status afterwards.", "Result 'Pause signal sent.' means sent, not yet paused."], ["Ownership check", "Every tool that names an execution also names its session, and mcp confirms the two belong together. An unknown id and an id from another session give the same error.", "'Execution not found: e-9' either way, so an agent cannot probe other sessions."], ["Stateless, so poll", "The server remembers nothing between requests and cannot push updates. An agent that wants progress asks again and again.", "Call get_workflow_status every few seconds while the run is active."]], "ex": {"title": "One example, end to end", "lede": "An agent is told 'run e-42 in session ci failed, find out why and fix it'. Click a step to see what happens, why, and what can go wrong.", "labels": ["What happens", "Why it works this way", "Can go wrong"], "legend": "Green = prompt that starts the task | Blue = tool call | Grey = an error answer | Dashed red = a mistake and what it gets", "start": "status", "nodes": [{"id": "ask", "n": "Task prompt", "s": "debug-workflow", "k": "t", "x": 10, "y": 40, "does": "The client fetches the prompt 'debug-workflow' with a session id and an execution id. It returns a ready-made instruction telling the agent which tools to use, in what order.", "adds": "Prompts are text templates the server offers. They carry the know-how (use status first, then logs, then the definition) so every agent starts from the same good routine instead of guessing.", "wrong": "The prompt text mentions RESTART and RESTART_FROM_NODE but not the node-level RETRY, so an agent following it literally may restart the whole run when only one node needs a retry."}, {"id": "status", "n": "Read status", "s": "get_workflow_status", "k": "p", "x": 190, "y": 40, "does": "The agent calls get_workflow_status(sessionId=ci, executionId=e-42). It gets the overall status, per-node task status and start and end times.", "adds": "Before answering, mcp confirms that e-42 belongs to session ci by reading that session's own record. That record outlives the tracker's 10-minute index, so a run that finished an hour ago is still found.", "wrong": "A wrong session or execution id gives 'Execution not found: e-42. Use get_workflow_history to list executions.' The message is the same for an unknown id and a foreign one."}, {"id": "logs", "n": "Read the logs", "s": "get_execution_logs", "k": "p", "x": 370, "y": 40, "does": "The agent asks for the logs with filterPattern 'ERROR|Exception' and tailLines 50. It gets the last 50 matching lines, plus how many lines matched in total.", "adds": "The filter is a regular expression, compiled once and applied to each formatted line as it streams from the log store. Only the last 50 matches are kept in memory. Without tailLines the cap is 5,000 lines, so one call cannot flood the agent's context.", "wrong": "A pattern longer than 200 characters, a syntax error, or one that takes more than 50 ms on a single line is rejected with an explanation."}, {"id": "def", "n": "Read the DAG", "s": "get_workflow_details", "k": "p", "x": 550, "y": 40, "does": "The agent fetches the workflow definition (nodes, their plugin types and config, and the edges) to see what the failing node 'compile' is configured to do.", "adds": "mcp returns core's definition record as it is. It already has a clean shape, so there is no second copy to keep in sync.", "wrong": "The definition may contain sensitive configuration, and everything in it goes into the agent's context. There is no masking in this module."}, {"id": "retry", "n": "Retry the node", "s": "control_node RETRY", "k": "p", "x": 730, "y": 40, "does": "The agent calls control_node with nodeId 'compile' and action RETRY. Core starts a new execution from that node and mcp returns its id in resultExecutionIds.", "adds": "The same ownership check runs first. The tool is marked destructive so a client can ask a human before it runs. The command carries no agent identity, so the audit log cannot tell this from a human's click.", "wrong": "The result says the retry was started, not that it will succeed. There is no idempotency key, so an agent that repeats the call after a timeout may start two retries."}, {"id": "verify", "n": "Check new run", "s": "poll status + logs", "k": "p", "x": 730, "y": 150, "does": "The agent polls get_workflow_status with the new execution id until it is terminal, then reads the logs of the new run.", "adds": "The transport is stateless, so the server cannot push 'done'. Polling is the whole mechanism and every poll is an ordinary, independent request.", "wrong": "Each poll repeats the ownership read. Many agents polling many runs add load that grows with the number of pollers."}, {"id": "nf", "n": "Wrong id", "s": "isError result", "k": "e", "x": 190, "y": 150, "does": "The call fails with an error result (isError true) whose text names the id and the tool to use next.", "adds": "Errors are plain sentences, not stack traces, because a model reads them and decides its next call from them.", "wrong": "An agent that ignores the hint can loop on the same bad id. Nothing limits how often it retries."}, {"id": "rx", "n": "Bad regex", "s": "isError result", "k": "e", "x": 370, "y": 150, "does": "The call fails before any log is read, with 'Regex pattern too long', 'Invalid regex pattern: ...' or 'Regex filter is too expensive to evaluate; simplify the pattern.'", "adds": "The agent writes the regex, so it is treated as untrusted input. A pattern can make matching take exponential time (catastrophic backtracking), so each line gets a 50 ms budget.", "wrong": "A pattern that is expensive on one long line fails the whole call. The agent has to rewrite it and ask again."}], "edges": [["ask", "status"], ["status", "logs"], ["logs", "def"], ["def", "retry"], ["retry", "verify"], ["status", "nf", "err", "wrong id"], ["logs", "rx", "err", "bad regex"]], "json": {"title": "See one call on the wire", "note": "A tool call is a JSON-RPC message posted to /mcp. The integration test sends the same shape. The result lines are abbreviated.", "text": "POST /mcp   Accept: application/json, text/event-stream\n{ \"jsonrpc\": \"2.0\", \"id\": 7, \"method\": \"tools/call\",\n  \"params\": { \"name\": \"get_execution_logs\",\n    \"arguments\": { \"sessionId\": \"ci\", \"executionId\": \"e-42\",\n                   \"tailLines\": 50, \"filterPattern\": \"ERROR|Exception\" } } }\n\n=> { \"result\": { \"structuredContent\": {\n       \"executionId\": \"e-42\", \"totalLines\": 131, \"returnedLines\": 50,\n       \"lines\": [ \"[2026-10-12T09:14:03Z] [ERROR] ...\" ] } } }"}}, "wrapper": {"title": "What every tool call goes through", "lede": "Stages that always apply, whichever of the 16 tools is called.", "steps": ["Key filter on /mcp (or /sse)", "Spring AI: find the tool, bind arguments", "Tool method: one line to a provider", "Ownership check for execution tools", "Core call (control bus, session, log store)", "Record -> structured result, or error -> isError"]}, "story": {"title": "The module in plain words", "steps": [["Connect", "an agent posts a JSON-RPC message to /mcp. If a key is configured it must be in the headers."], ["Discover", "the agent asks for the tool list and sees 16 tools with descriptions, typed arguments, result schemas and read-only or destructive hints."], ["Author", "it asks for the session format, drafts a session and sends it with create_session."], ["Run", "it calls start_workflow and gets an execution id."], ["Watch", "it polls get_workflow_status and get_execution_logs, because nothing is pushed."], ["Steer", "it pauses, steps, skips, retries or stops with control_workflow and control_node. Each call is checked against the session first."], ["Learn", "it can read the overview and architecture resources, or ask for a plugin's details before writing a node."]]}, "paths": [["New to the module", "Primer, then the System map and the 'Debug a failed run' scenario, then Limits and guarantees.", "primer"], ["Reviewing security", "Quality (Security lens), then the risks on keys, identity and the session boundary, then ADRs 4, 5 and 8.", "quality"], ["Writing a client or an agent", "Reference (tool catalogue, control actions, errors), then the scenarios, then the Spring AI gotchas.", "reference"]]}, "plain": {"gate": ["A guard at the robot entrance. If a password is configured, no password means no entry. It also lets visitors who use the old address /sse in.", "The endpoint can run commands that start and stop work. Something has to stop strangers from calling it, and clients configured before the rename must keep working."], "runtime": ["The framework that speaks MCP: it lists the tools, reads the arguments, calls our method and wraps the answer or the error.", "Nobody wants to hand-write a protocol. But the framework has two bugs we must code around, and its settings (stateless, async, /mcp) decide how clients behave."], "facade": ["The menu: 16 methods, each with a name, a description, argument hints and a risk label, each doing one hand-off to a specialist.", "A model chooses tools from their text, so wording and hints are the real interface. Keeping the menu thin means the logic lives in testable specialists."], "content": ["Two canned instructions (prompts) and three reference documents (resources) that an agent can fetch without calling a tool.", "They give an agent a good first move and background reading, so it does not have to guess how Yukta works."], "owner": ["A check that the execution id you gave really belongs to the session you gave, answered with the same words whether it is unknown or someone else's.", "Without it, an agent could read or steer another session's runs just by guessing ids, or learn which ids exist from different error texts."], "runs": ["The people who start runs and press the control buttons: pause, resume, stop, restart, skip, step, retry, breakpoints.", "Agents need the same steering a person has, with required arguments checked before anything is sent so a mistake is explained instead of failing deep inside core."], "logs": ["A log reader that shows the last N matching lines of a run, with a safety fence around the search pattern.", "Logs can be huge and the agent writes the pattern. Without limits one call could flood the model's context or burn the CPU."], "sessions": ["The authoring desk: list sessions, read one, get the format guide, and create a session from structured data.", "Agents author workflows. Giving them typed input and a format guide is safer than asking them to escape JSON inside a string."], "health": ["A dashboard snapshot: sessions with active runs, the 20 most recent executions, plugin list and memory use.", "One call gives an agent the lay of the land before it picks where to look."], "plugins": ["The parts catalogue: which node types exist, what one does and what ports it has, plus a guide for writing a new one.", "An agent cannot build a workflow from node types it does not know about."]}, "mapFlag": {"label": "Highlight agent-facing input", "hint": "Dashed amber = takes input straight from an agent", "badge": "AGENT"}, "mapLegend": "Solid = main call flow | dashed = control, content or configuration. Amber badge = the component handles input an agent typed.", "comps": [{"id": "gate", "name": "Endpoint gate", "tag": "key check, /sse alias", "c": 0, "r": 0, "flag": true, "resp": "Sits in front of the web server and decides whether a request to /mcp or /sse may continue, and rewrites the old /sse address to /mcp.", "how": ["It is a web filter with the highest priority, so it runs before anything else. It looks only at two paths, /mcp and /sse. Every other path (REST, the UI) passes straight through untouched.", "If the setting yukta.mcp.api-key is empty or blank, every request is let in. If it is set, the request must carry the same value as 'Authorization: Bearer <key>' or as an 'X-API-Key' header. If the Authorization header starts with 'Bearer ' that value is used, otherwise X-API-Key is read.", "The comparison is constant-time (MessageDigest.isEqual). A normal string comparison stops at the first wrong character, and an attacker timing many requests could learn the key one character at a time.", "A missing or wrong key gets HTTP 401 with an empty body. The check runs before the alias rewrite, so /sse is guarded exactly like /mcp.", "The alias exists because the endpoint used to be called /sse (although it speaks streamable HTTP, not the older SSE protocol). Renaming it to /mcp would have broken every client already configured. The filter rewrites the path of an /sse request to /mcp and passes it on.", "This key is separate from yukta.api-key, which the web module's filter applies only to /api/** paths. Setting yukta.api-key does not protect /mcp."], "guar": "When a key is configured, no request reaches a tool without presenting it, on either path, and the compare does not leak by timing.", "state": "None except the key read once at startup. A key change needs a restart.", "ceil": "One shared secret for every client: no per-agent identity, scope, expiry or rotation without downtime. Nothing limits request rate.", "fail": "A wrong key is a bare 401. There is no lockout, no counter and no log line for repeated failures.", "set": ["yukta.mcp.api-key (empty = open)", "Authorization: Bearer <key>", "X-API-Key: <key>", "paths: /mcp, /sse (alias)"], "risks": ["apiKeyOpen", "sharedKey", "noRateLimit"]}, {"id": "runtime", "name": "Protocol runtime", "tag": "Spring AI MCP, stateless", "c": 0, "r": 1, "flag": true, "resp": "The Spring AI MCP server inside boot. It speaks the protocol, finds the tool, binds arguments from JSON, calls our method and turns the result or error into a reply.", "how": ["The settings in boot's application.yaml: server name 'yukta', protocol STATELESS, type ASYNC, stdio off, streamable-http endpoint /mcp. STATELESS means no session is kept between requests, so any request can be served without remembering earlier ones.", "ASYNC means tools return a Mono (a Reactor 'result that arrives later') instead of blocking a thread. Most tools simply forward the Mono core gives them. A few wrap a plain method call in Mono.fromCallable.", "Each tool declares generateOutputSchema = true, so the framework publishes a JSON schema of the result and returns it as structured content. A client can then read fields by name instead of parsing prose.", "Two framework bugs shape our code. A tool that returns Flux<T> has its answer cut to the first element, so a 'list sessions' tool would show one session. A tool that returns Mono<List<T>> with an output schema crashes startup. The rule is to wrap every list in a record (SessionList, WorkflowHistory, PluginList). The integration test that does real JSON-RPC calls is the only test that would catch the startup crash.", "An IllegalArgumentException thrown or emitted by a tool is turned into a tool result with isError = true and the message as text. That is how every 'not found' and 'bad argument' error reaches the agent."], "guar": "Every tool call is an independent request. A wrapper record per list means no list result is truncated.", "state": "None. Nothing about a client is kept between requests, so a restart loses nothing here and any server instance could answer any request.", "ceil": "No streaming and no server-to-client notification in stateless mode, so progress can only be polled. Request size and timeouts are the framework's defaults, not set here.", "fail": "A framework upgrade can change the behaviours we work around. A startup failure here stops the whole boot application.", "set": ["spring.ai.mcp.server.protocol: STATELESS", "spring.ai.mcp.server.type: ASYNC", "spring.ai.mcp.server.stdio: false", "spring.ai.mcp.server.streamable-http.mcp-endpoint: /mcp", "spring.ai.mcp.server.enabled: true"], "risks": ["noPush", "noRateLimit", "pmdTestOff"]}, {"id": "facade", "name": "Tool facade", "tag": "16 tools, hints, schemas", "c": 1, "r": 0, "flag": true, "resp": "The class that declares the 16 tools: names, descriptions, argument descriptions, risk hints. Each method hands over to one provider.", "how": ["Each tool is one annotated method. The description is written for the model: it says what the tool returns and which tool to call next (start_workflow says 'use the execution id with get_workflow_status and get_execution_logs'). A model picks tools mostly from these sentences.", "Hints tell the client how risky a call is. Read-only tools (11 of 16) are marked readOnly and closed-world. start_workflow and set_node_breakpoint are writes but not destructive. control_workflow, control_node and create_session are destructive, and create_session is also open-world because the workflows it installs can run commands and reach other systems. Its description asks the agent to confirm with the user first.", "Hints are advice for the client, not enforcement. A client that ignores them can call a destructive tool without asking anyone. Real enforcement is only the key filter.", "Argument handling is minimal on purpose. Enum arguments (the control action) are parsed by the framework. Required arguments that depend on the chosen action (executionId for most actions, workflowId for STOP_ALL, fromNodeId for RESTART_FROM_NODE) are checked in the provider so the error can name the action.", "list_sessions, get_workflow_history and list_plugins wrap their lists in a record. get_workflow_status and get_workflow_details return core's own records directly, because they are already clean."], "guar": "Every tool has a name, description, typed arguments, an output schema and risk hints, and the tool list is checked by the integration test.", "state": "None. Only references to the providers.", "ceil": "Sixteen tools is already a lot of text for a model to choose from. Each new tool adds to every agent's context on every connection.", "fail": "Wrong descriptions mislead agents silently: nothing tests that the wording matches behaviour. The CLAUDE.md tool list, for example, is out of date.", "set": [], "risks": ["stopParity", "noIdempotency", "docsDrift"]}, {"id": "content", "name": "Prompts & resources", "tag": "templates and reference text", "c": 1, "r": 1, "resp": "Two prompt templates and three resources an agent can fetch without calling a tool.", "how": ["Prompt 'debug-workflow' (sessionId, executionId) returns a paragraph telling the agent to read the status, then the logs (with a filterPattern such as ERROR), then the definition, name the cause, and use RESTART or RESTART_FROM_NODE if a retry fits.", "Prompt 'create-session-config' tells the agent to call get_session_creation_instructions and list_plugins, draft nodes and edges and apply them with create_session.", "Resource yukta://overview is a short description of Yukta and a typical flow. Resource yukta://architecture is a longer outline of the DAG, sessions, control bus and plugin logs. Both are fixed text inside the code.", "Resource yukta://sessions/{sessionId}/executions/{executionId}/logs is a template: the client fills in the two ids and gets the whole log (up to the 5,000-line cap) joined by newlines. It goes through the same ownership check and log reader as the tool, but takes no filter.", "The text is hand-written and is not generated from the code, so it can fall behind. The overview already lists skip and step as available, which matches the code today."], "guar": "The log resource gives the same ownership and cap protection as get_execution_logs.", "state": "None. The prompt and overview text is fixed in the code.", "ceil": "Static text cannot describe a plugin that was added later, and a 5,000-line log resource is a large single read for a client.", "fail": "A bad id gives the same isError answer as the tool. Stale prompt text sends agents to the wrong control action with no error to warn anyone.", "set": ["prompts: debug-workflow, create-session-config", "yukta://overview", "yukta://architecture", "yukta://sessions/{sessionId}/executions/{executionId}/logs"], "risks": ["docsDrift", "logInjection"]}, {"id": "owner", "name": "Ownership check", "tag": "session owns execution", "c": 2, "r": 0, "resp": "A shared step that every tool naming an execution runs first: confirm the execution exists and belongs to the named session.", "how": ["It asks the control bus for the progress of (sessionId, executionId). If nothing comes back it fails with 'Execution not found: <id>. Use get_workflow_history to list executions.' That is the same text for an unknown id and for an id owned by another session.", "The same text matters. Different messages ('no such execution' versus 'belongs to another session') would let a caller test which ids exist in sessions it does not own.", "It reads the session's own record instead of the tracker's global index. The index forgets finished runs after a time-to-live (10 minutes by default, yukta.tracker.cleanup-ttl). Reading the session record means status and logs of a run that ended an hour ago still work. An earlier version used the index and lost finished runs after 10 minutes.", "On success it passes the progress record forward. get_workflow_status simply returns it, so the check and the lookup are one step.", "It does not apply to STOP_ALL, which names a workflow rather than an execution. It also does not apply to start_workflow or get_workflow_details, which are session-scoped, not execution-scoped.", "It proves that the two ids match each other. It does not prove that the caller is allowed to touch that session: any caller who can reach the endpoint can list sessions and name any of them."], "guar": "No execution-scoped tool acts on an execution that is not recorded under the session named in the call, and unknown and foreign look identical.", "state": "None. It reads core's per-session records, which live as long as core keeps them.", "ceil": "One extra read on every execution-scoped call. Cheap in memory, but not free if the session records live in a slower store.", "fail": "If the record is gone (history trimmed, restart with an in-memory store) the answer is 'Execution not found', even for a run that genuinely existed. For the agent it looks the same as a wrong id.", "set": [], "risks": ["sessionBoundary", "noActor"]}, {"id": "runs", "name": "Run & control", "tag": "start, steer, restart", "c": 2, "r": 1, "flag": true, "resp": "Starts workflows and sends control commands to a run or one of its nodes, through core's control bus.", "how": ["start_workflow(sessionId, workflowId) asks core to validate and start. It returns the new execution id. It sends no trigger payload and no idempotency key, although the REST start accepts both.", "control_workflow takes one of six actions: PAUSE, RESUME, STOP, STOP_ALL, RESTART, RESTART_FROM_NODE. All but STOP_ALL need an executionId and pass the ownership check. STOP_ALL needs a workflowId and stops every active run of that workflow in the session in the default DRAIN mode (in-flight work finishes). RESTART and RESTART_FROM_NODE return the new execution id in resultExecutionIds.", "control_node takes ten actions: PAUSE, RESUME, STOP (optionally 'immediate'), STEP, STEP_ENABLE, STEP_DISABLE, SKIP, UNSKIP, RETRY and BREAKPOINT_CLEAR. RETRY starts a new execution from that node, so it returns a new id. The others return a result saying the signal was sent.", "set_node_breakpoint pauses a node when a payload field equals a value, for example payload.status = error. BREAKPOINT_CLEAR on control_node removes it.", "Missing arguments are caught first with action-specific text, for example 'fromNodeId is required for action RESTART_FROM_NODE.' STOP actions record the reason 'Requested via MCP' when the agent gives none.", "A 'signal sent' result means the command was emitted onto the bus. It does not mean the node is paused. The agent must read the status to see the effect."], "guar": "Required arguments are checked before anything is sent, and execution-scoped actions only reach runs of the named session.", "state": "None. State lives in core's run tracker and control bus.", "ceil": "Commands go one at a time per call. STOP_ALL is the only bulk action. Concurrency limits for runs are core's, and are off by default.", "fail": "Core errors (no such node, run already finished, no active execution to stop) pass through as isError text. The wording is core's, not shaped for agents in every case.", "set": ["WorkflowControlAction: PAUSE, RESUME, STOP, STOP_ALL, RESTART, RESTART_FROM_NODE", "NodeControlAction: PAUSE, RESUME, STOP, STEP, STEP_ENABLE, STEP_DISABLE, SKIP, UNSKIP, RETRY, BREAKPOINT_CLEAR", "default stop reason: Requested via MCP"], "risks": ["noIdempotency", "stopParity", "noActor", "signalNotState", "noRateLimit"]}, {"id": "logs", "name": "Log reader", "tag": "tail + regex, capped", "c": 2, "r": 2, "flag": true, "resp": "Reads the stored plugin logs of one execution, filters lines with the agent's regex and returns the last N matches.", "how": ["The regex is checked first: empty means no filter, longer than 200 characters is rejected, a syntax error is reported with the engine's message. It is compiled once per call and reused for every line.", "Lines stream from core's log store, each is formatted ('[timestamp] [level] ...'), tested with a 'contains a match' search, and only the last N matches are kept. N is tailLines, or 5,000 if absent or not positive, and never more than 5,000. Streaming and keeping only the tail means memory stays bounded by N lines even for a very large log.", "The result reports executionId, totalLines (how many lines matched in all), returnedLines and the lines. An agent can see that 131 lines matched and it received 50, and ask for a narrower filter instead of paging.", "Each line has a 50 ms budget in the regex engine. The text is wrapped so that reading a character past the deadline throws, which cuts off a pattern like (a+)+$ that would otherwise run for minutes. The whole call then fails with 'too expensive to evaluate; simplify the pattern.'", "The ownership check runs after the pattern check and before any line is read, so a foreign id never causes a log read.", "The resource form yukta://sessions/.../logs calls the same method with no filter and no tail."], "guar": "One call returns at most 5,000 lines, a hostile pattern cannot run longer than 50 ms per line, and a foreign execution's logs are never read.", "state": "None. The log content is held by core's log store, which depends on how that store is configured.", "ceil": "The whole execution log is still read from the store line by line. A multi-gigabyte log costs time even though little is kept. There is no paging: 5,000 lines is a hard ceiling per call.", "fail": "An expensive pattern fails the whole call, not just the slow line. Logs are raw plugin output that can contain secrets or text meant to steer a model; mcp passes them on as they are.", "set": ["tailLines (default and max 5,000)", "filterPattern (max 200 chars)", "per-line budget 50 ms"], "risks": ["logInjection", "noPaging", "sessionBoundary"]}, {"id": "sessions", "name": "Session provider", "tag": "list, read, create", "c": 3, "r": 0, "flag": true, "resp": "Lists sessions, reads one, explains the session format, and creates (or overwrites) a session from a structured configuration.", "how": ["list_sessions returns each session's id and workflow count. A session whose config cannot be loaded is left out with a warning in the server log, so one broken session does not hide the others. get_session_details returns the workflow ids of one session, or 'Session not found: ... Use list_sessions' if it is unknown.", "create_session takes a structured SessionConfigData: sessionId, name, description, initiator, optional tags and projectPath, and workflows. The framework generates the argument schema from it, so the agent sees the field names and the constraints (name and description at most 256 characters, workflows not empty). Earlier versions took a JSON string, which an agent had to escape by hand.", "It overwrites. A second create_session with the same sessionId replaces the session, and workflows the new config no longer lists are removed from it (core logs 'Removed stale workflow'). That is why the tool is marked destructive. The result lists the session id and the workflow names, with an always-empty warnings list.", "get_session_creation_instructions returns a text guide: naming rules, structure, an example, the DAG rules, the list of plugin types actually registered, and three common errors with fixes.", "Judgement: the example config in that guide does not match the real model. It uses node fields 'id', edge fields 'from', 'to', 'port', and plugin types (webhook-trigger, gradle-checker, log-aggregator) that are not registered. The real fields are nodeId, source, target, sourcePort, a workflowId and description per workflow, and plugin types such as HTTP_REQUEST. The server is set to fail on unknown JSON properties, so an agent copying the example would be rejected."], "guar": "A created session passes core's validation, and core replaces the old session's workflow set in one call. Errors come back as readable text.", "state": "None in mcp. Sessions live in core's store: memory by default (yukta.session.store-type: in-memory), so they vanish on restart unless a durable store is configured.", "ceil": "list_sessions reads one config per session with no paging. The creation guide is rebuilt on each call from the live plugin list.", "fail": "An invalid config is rejected by core's validation with its message. A teaching example that cannot validate wastes an agent's attempts.", "set": ["yukta.session.store-type (in-memory default)", "name and description max 256 chars", "sessionId constraint from core"], "risks": ["sessionGuideWrong", "overwriteSession", "noPaging", "sharedKey"]}, {"id": "health", "name": "Status aggregator", "tag": "sessions, runs, JVM", "c": 3, "r": 1, "resp": "Builds the get_control_bus_status snapshot: sessions with active run counts, the 20 most recent executions, the plugin list and JVM memory and uptime.", "how": ["The optional filter picks one part: sessions, executions, plugins or health. Anything else is refused with the list of valid filters. With no filter, all four parts are built. Parts not asked for come back empty, and the memory block shows '0', '0', '0s' placeholders.", "It reads every session once, a few at a time (8 concurrently): the config for the workflow count and the execution history. One pass feeds both the sessions list and the recent executions, so a session is not read twice. A session that fails to load is skipped with a warning.", "A run counts as active unless its status is terminal. The check uses core's own status names and also the older names COMPLETED, FAILED and WORKFLOW_STOPPED. An earlier version compared against names core never emits and so reported every run as active.", "Recent executions are sorted by start time (newest first, unknown start last) and cut to 20. Duration is 'running' for an open run, otherwise milliseconds.", "Every plugin is listed with status 'ACTIVE'. That value is fixed text, not a health check.", "Memory is used and maximum heap in MB and uptime from the JVM."], "guar": "A bad filter is refused with the valid values, one broken session does not fail the call, and the result never lists more than 20 executions.", "state": "None. Built fresh on every call.", "ceil": "Work grows with the number of sessions (and each session's history size). 8 at a time limits the load but not the total.", "fail": "A session that errors is silently missing from the totals (only a server-log warning). The result does not say it was skipped.", "set": ["filter: sessions | executions | plugins | health", "concurrency 8 sessions", "20 recent executions"], "risks": ["healthLinear", "noPaging"]}, {"id": "plugins", "name": "Plugin catalogue", "tag": "types, details, guide", "c": 3, "r": 2, "resp": "Lets an agent discover node types, read one plugin's description and ports, and fetch a how-to-write-a-plugin guide.", "how": ["list_plugins returns each registered plugin's type (such as HTTP_REQUEST) and category (trigger, processor or terminal). get_plugin_details returns the type, category, description, a usage pattern, an optional UI design and the output ports. An unknown type gives 'Plugin not found: <type>'. Type names are matched exactly, including case.", "The output ports shown come from the call without a configuration. Plugins whose ports depend on their config (a router with named branches, for example) therefore show only ['default'], which can mislead an agent wiring edges.", "Plugins also publish a typed list of configuration fields (name, type, required, default, options). get_plugin_details does not return it, so an agent has to guess config keys from the free-text usage pattern.", "get_plugin_creation_guide returns an architecture note, code templates (filter: trigger, processor, terminal, all), a validation checklist, a testing strategy and a deployment guide.", "Judgement: the guide teaches a contract the code does not have. Its templates say 'extends TriggerPlugin' and 'execute(WorkflowContext)' and the text mentions a WorkflowRegistry. In the real plugin API, triggers, processors and terminals are interfaces, with a stream-based method each (process for a processor, consume for a terminal), plus settings such as getType and validateConfig. The templates would not compile."], "guar": "The listed plugins are exactly the ones registered in core's plugin registry at that moment.", "state": "None. Reads the registry on every call.", "ceil": "Reads are cheap. The ceiling is quality: what the catalogue says is only as good as each plugin's own description.", "fail": "An unknown type is a plain error. A stale guide fails later, when an agent's generated plugin does not compile.", "set": ["templateType: trigger | processor | terminal | all"], "risks": ["pluginGuideWrong", "portsNoConfig", "configSchemaHidden"]}], "edges": [["gate", "runtime", "data", "request"], ["runtime", "facade", "data", "tool call"], ["facade", "owner", "data", "execution id"], ["owner", "runs", "data", "checked"], ["owner", "logs", "data", "checked"], ["facade", "runs", "data", "start"], ["facade", "sessions", "data", "session calls"], ["facade", "health", "data", "status call"], ["facade", "plugins", "data", "catalogue"], ["runtime", "content", "ctrl", "prompts"], ["content", "logs", "ctrl", "log resource"], ["health", "plugins", "ctrl", "plugin list"]], "scen": [{"id": "debug", "name": "Debug a failed run", "steps": [{"t": "Request passes the gate", "d": "The agent posts get_workflow_status to /mcp. The key filter sees a protected path, finds no key configured (or the right one) and lets it through. With a key set and a wrong value this is where it would stop with 401.", "c": ["gate"], "r": ["apiKeyOpen"]}, {"t": "The framework finds the tool", "d": "Spring AI matches the tool name, reads sessionId and executionId from the JSON and calls the facade method. No connection state is involved, so any request can be the first.", "c": ["runtime", "facade"], "r": []}, {"t": "Ownership and status", "d": "The ownership check reads the progress of (ci, e-42) from the session's record and returns it. The agent sees node 'compile' FAILED.", "c": ["owner"], "r": ["sessionBoundary"]}, {"t": "Logs with a filter", "d": "get_execution_logs with filterPattern 'ERROR|Exception' and tailLines 50 streams the log, keeps the last 50 matches and reports 131 matched in all. The agent knows its window is partial and can narrow the pattern.", "c": ["logs"], "r": ["logInjection", "noPaging"]}, {"t": "Retry the failed node", "d": "control_node with RETRY and nodeId 'compile' starts a new execution from that node. The reply carries the new id in resultExecutionIds. Nothing identifies the caller as an agent, and a repeated call would start a second retry.", "c": ["runs"], "r": ["noActor", "noIdempotency", "signalNotState"]}, {"t": "Poll the new run", "d": "Because nothing is pushed, the agent calls get_workflow_status on the new id until it is terminal. Each call is an independent request.", "c": ["facade", "owner"], "r": ["noPush"]}]}, {"id": "create", "name": "Create a session and run it", "steps": [{"t": "Learn the format", "d": "The agent calls get_session_creation_instructions and list_plugins. The first returns text and an example; the second returns the real plugin types. Where the two disagree, the registry is right and the example is not.", "c": ["sessions", "plugins"], "r": ["sessionGuideWrong", "configSchemaHidden"]}, {"t": "Check one plugin", "d": "get_plugin_details for a type returns description, usage pattern and ports. Ports are read without config, so a plugin with config-dependent ports shows only 'default'.", "c": ["plugins"], "r": ["portsNoConfig"]}, {"t": "Create the session", "d": "create_session takes the structured config. The tool is marked destructive and open-world, so a careful client asks the user first. Core validates and stores it. A session with the same id is replaced and its other workflows are removed.", "c": ["facade", "sessions"], "r": ["overwriteSession", "sharedKey"]}, {"t": "Start a workflow", "d": "start_workflow returns an execution id. There is no way to pass trigger data and no idempotency key. If the call times out and the agent repeats it, two runs may start.", "c": ["runs"], "r": ["noIdempotency", "stopParity"]}, {"t": "Watch it", "d": "The agent polls status and logs. When it is done the agent reports back to the user. If core has a concurrency limit and it is hit, the start fails with core's error.", "c": ["runs", "logs"], "r": ["noPush"]}]}, {"id": "foreign", "name": "Wrong or foreign execution id", "steps": [{"t": "A guessed id", "d": "An agent (or an attacker with the endpoint) calls get_workflow_status with session 'ci' and an execution id that belongs to session 'billing'.", "c": ["facade"], "r": ["sessionBoundary"]}, {"t": "The check finds nothing", "d": "The control bus holds no record of that id under 'ci', so the lookup is empty. The check cannot tell 'never existed' from 'belongs elsewhere', and that is the point.", "c": ["owner"], "r": []}, {"t": "Same answer for both", "d": "The error is 'Execution not found: <id>. Use get_workflow_history to list executions.' Whichever case it was, the text is identical, so ids cannot be probed.", "c": ["owner", "runtime"], "r": []}, {"t": "What it does not stop", "d": "The same caller can call list_sessions, name 'billing' as the session and read its runs and logs legitimately. The check keeps the pair consistent. It does not restrict who may use which session.", "c": ["sessions", "owner", "logs"], "r": ["sessionBoundary", "sharedKey"]}]}, {"id": "regex", "name": "Hostile or broken regex", "steps": [{"t": "The pattern arrives", "d": "get_execution_logs gets filterPattern '(a+)+$' from an agent that was itself fed text by an untrusted source. The agent writes patterns, so it is as untrusted as any caller.", "c": ["facade", "logs"], "r": ["logInjection"]}, {"t": "Cheap checks first", "d": "Length over 200 characters is refused. A syntax error is reported with the engine's message. Both happen before any ownership check or log read.", "c": ["logs"], "r": []}, {"t": "Compile once, match per line", "d": "The pattern is compiled once. For each line the text is wrapped with a 50 ms deadline. Reading a character past the deadline throws.", "c": ["logs"], "r": []}, {"t": "The line that explodes", "d": "On a long line of a's followed by a character that breaks the match, this pattern would take exponential time. The deadline fires and the whole call fails with 'Regex filter is too expensive to evaluate; simplify the pattern.' The server thread is released after about 50 ms.", "c": ["logs", "runtime"], "r": []}, {"t": "The agent adapts", "d": "The error text tells the agent what to do. It sends a simpler pattern. Nothing stops it from trying again immediately and repeatedly.", "c": ["runtime"], "r": ["noRateLimit"]}]}, {"id": "nokey", "name": "Key configured, key missing", "steps": [{"t": "Operator sets a key", "d": "The operator sets yukta.mcp.api-key. This is not in the shipped configuration. Out of the box the endpoint is open, and the server listens on 127.0.0.1 only unless YUKTA_SERVER_ADDRESS is changed.", "c": ["gate"], "r": ["apiKeyOpen"]}, {"t": "A request without it", "d": "A client posts to /mcp or /sse with no key or the wrong key. The filter compares in constant time and answers 401 with an empty body.", "c": ["gate"], "r": []}, {"t": "A request with it", "d": "With 'Authorization: Bearer <key>' or 'X-API-Key: <key>' the request continues. A request to /sse is rewritten to /mcp first and then served as normal.", "c": ["gate", "runtime"], "r": []}, {"t": "What a key gives", "d": "Everyone holding the key has the same powers: read every session, run and log, and install any session. No agent identity and no scope is attached to a call, so a leaked key cannot be narrowed or traced to one agent.", "c": ["gate", "runs", "sessions"], "r": ["sharedKey", "noActor"]}, {"t": "A different key on REST", "d": "yukta.api-key protects /api/** only. Setting it does not protect /mcp, and setting yukta.mcp.api-key does not protect REST. An operator who sets one may believe the other is covered.", "c": ["gate"], "r": ["apiKeyOpen"]}]}, {"id": "overview", "name": "Look around, then stop everything", "steps": [{"t": "Ask for the overview", "d": "get_control_bus_status with no filter builds all four parts: sessions with active run counts, the 20 most recent executions, the plugin list and JVM memory and uptime.", "c": ["facade", "health"], "r": []}, {"t": "Read every session", "d": "Eight sessions at a time, the aggregator reads each config and history once. A session that fails is skipped with a log warning, so the totals can be missing one without telling the agent.", "c": ["health"], "r": ["healthLinear"]}, {"t": "Pick a workflow to stop", "d": "The agent sees 3 active runs of workflow 'nightly' in session 'ci' and calls control_workflow with STOP_ALL and workflowId. No executionId is needed, so the ownership check is skipped. The session id scopes the stop.", "c": ["runs"], "r": ["stopParity"]}, {"t": "Drain, not kill", "d": "The stop uses core's default DRAIN mode: in-flight work finishes. The REST endpoint can choose CANCEL or KILL, but the tool offers no mode. The result lists the stopped execution ids.", "c": ["runs"], "r": ["stopParity", "signalNotState"]}, {"t": "Check the outcome", "d": "The reply says how many executions were stopped, not that they ended. The agent reads status to confirm.", "c": ["facade", "owner"], "r": ["signalNotState"]}]}], "intro": {"debug": "The main path: an agent diagnoses and retries a failed run, tool by tool.", "create": "How an agent learns the format, creates a session and starts a workflow, and where the guide misleads it.", "foreign": "What the ownership check protects, and what it does not.", "regex": "How agent-supplied input is fenced: length, syntax and a time budget per line.", "nokey": "The key filter in both states, and why the shipped default is open.", "overview": "A bulk read of the whole system, then a bulk stop, with their limits."}, "caps": [["Discover", "Tool list with schemas", "16 tools with descriptions, typed arguments and result schemas.", "Spring AI generates them from annotations; the output schema comes from the Java record.", "Clients can read fields by name.", "Text quality depends on hand-written descriptions."], ["Discover", "Risk hints", "Each tool is marked read-only, destructive or open-world.", "readOnlyHint, destructiveHint and openWorldHint on the tool.", "Clients can ask a human before risky calls.", "Advice only; not enforced by the server."], ["Discover", "Prompts", "debug-workflow and create-session-config.", "Templates that tell an agent which tools to use and in what order.", "Same routine for every agent.", "Static text; can lag behind tools."], ["Discover", "Resources", "Overview, architecture and an execution-log resource.", "Fixed text plus one URI template that reads logs through the log reader.", "Background reading without a tool call.", "Hand-written; log resource has no filter."], ["Author", "Session format guide", "Naming rules, structure, example and live plugin list.", "get_session_creation_instructions builds it on each call.", "Plugin list is always current.", "The inline example uses wrong field names and unregistered types."], ["Author", "Create or overwrite a session", "Installs workflows from a structured config.", "create_session passes SessionConfigData to core's applyConfig.", "Core validates; stale workflows are removed.", "Overwrites by id with no preview or diff."], ["Author", "Plugin lookup", "Types, categories, descriptions, usage and ports.", "list_plugins and get_plugin_details read the registry.", "Always matches registered plugins.", "No config schema; ports ignore config."], ["Author", "Plugin creation guide", "Templates and checklists for a new plugin.", "get_plugin_creation_guide returns text and code templates.", "A starting point.", "Templates do not compile against the real plugin API."], ["Run", "Start a workflow", "Starts a run and returns its id.", "start_workflow calls core's validate-and-start.", "Execution id only after core accepts.", "No trigger payload, no idempotency key."], ["Run", "Restart a run", "Run again whole, or from a node.", "RESTART and RESTART_FROM_NODE on control_workflow; RETRY on control_node.", "New execution id returned.", "No identity of the caller in the audit."], ["Steer", "Pause, resume, stop", "Workflow-level and node-level control.", "Commands emitted on the control bus after the ownership check.", "Only the named session's runs are reachable.", "Reports 'sent', not 'done'."], ["Steer", "Step, skip, breakpoint", "Debug-style steering of a node.", "STEP_ENABLE, STEP, STEP_DISABLE, SKIP, UNSKIP, BREAKPOINT_CLEAR and set_node_breakpoint.", "Equal to what the UI offers.", "Breakpoint compares a field to one string only."], ["Steer", "Stop all of a workflow", "Stops every active run of one workflow.", "STOP_ALL with workflowId, DRAIN mode.", "One call, session-scoped.", "No CANCEL or KILL choice."], ["Observe", "Status snapshot", "Overall and per-node progress of one run.", "get_workflow_status returns core's WorkflowProgress.", "Works for runs after the tracker's 10-minute index expires.", "Poll only."], ["Observe", "Run history", "All executions of a session with status and times.", "get_workflow_history wraps core's list in a record.", "Whole list, never truncated.", "No paging."], ["Observe", "Log tail with regex", "Last N matching lines of a run.", "Streaming filter, takeLast, 5,000-line cap, 200-char pattern, 50 ms per line.", "Bounded memory and CPU.", "Reads the whole log to find the tail."], ["Observe", "System status", "Sessions, 20 recent runs, plugins, memory.", "get_control_bus_status with optional filter.", "One broken session does not fail the call.", "Cost grows with sessions."], ["Protect", "Endpoint key", "Optional shared key on /mcp and /sse.", "Bearer or X-API-Key, constant-time compare, 401.", "Off by default; on means no key, no entry.", "One key for everyone."], ["Protect", "Execution ownership", "A run is reachable only through its own session.", "ExecutionOwnership reads the session's record; same error either way.", "No probing of ids across sessions.", "Not a caller-level permission."]], "capsLede": "Eighteen things an agent can do or rely on, grouped by what they are for.", "guar": {"title": "Limits, guarantees and what is only advice", "lede": "The mcp module keeps no state of its own, so most 'what survives' answers come from core. This section lists the fences mcp sets, what it enforces and what it only recommends.", "tables": [{"title": "Limits and defaults set in this module", "head": ["Item", "Value", "Why it exists"], "rows": [["Endpoint", "/mcp (streamable HTTP); /sse is a rewrite alias", "Old clients keep working after the rename."], ["Transport mode", "STATELESS, ASYNC, stdio off", "Any request can be served alone; no connection to track."], ["API key", ["part", "yukta.mcp.api-key, empty by default = open"], "Optional protection; shipped config does not set it."], ["Log lines per call", "5,000 maximum; default when tailLines is absent or not positive", "One call cannot flood an agent's context."], ["Regex pattern length", "200 characters", "Limits the work a pattern can ask for."], ["Regex time", "50 ms per line", "Stops catastrophic backtracking."], ["Status aggregation", "8 sessions read at a time; 20 recent executions", "Bounds the load and the answer size."], ["Default stop reason", "Requested via MCP", "Audit text when the agent gives none."], ["STOP_ALL mode", "DRAIN (fixed)", "The gateway's default; the tool has no mode argument."], ["Tracker index TTL (core)", "10 minutes (yukta.tracker.cleanup-ttl)", "Ownership reads the session record instead, so this does not hide old runs."]]}, {"title": "Enforced or only advice?", "lede": "What the server really prevents, compared with what it merely says.", "head": ["Control", "Status", "Detail"], "rows": [["Key on /mcp and /sse", ["part", "Enforced only if configured"], "Constant-time compare, 401. Off by default."], ["Execution belongs to the named session", ["ok", "Enforced"], "Same error for unknown and foreign ids."], ["Caller may use this session", ["lost", "Not enforced"], "No identity or scope. Any caller can name any session."], ["Read-only, destructive, open-world hints", ["part", "Advice"], "Honoured only by clients that choose to."], ["Confirm before create_session", ["part", "Advice"], "Stated in the description, not checked."], ["Regex length and time", ["ok", "Enforced"], "Rejects with an explanation."], ["Log size", ["ok", "Enforced"], "5,000 lines per call."], ["Request rate", ["lost", "Not enforced"], "No per-caller limit in this module."], ["Audit of who acted", ["lost", "Not recorded"], "Commands carry no ControlActor, so agent and human look alike."], ["Idempotent start", ["lost", "Not offered"], "REST supports an Idempotency-Key header; the tool does not."]]}, {"title": "Call semantics", "head": ["Topic", "Behaviour"], "rows": [["Calls are independent", "Every request stands alone. There is no session, no subscription and no push. Agents poll."], ["Control results", "'Signal sent' and 'Stopped N executions' mean the command went onto the bus. Effects show in get_workflow_status."], ["Restart and retry", "Create a new execution with a new id, returned in resultExecutionIds. The old run stays as history."], ["Errors", "Plain-text IllegalArgumentException messages, shown as isError results, usually naming the next tool to call."], ["Lists", "Always whole lists in a wrapper record (sessions, history, plugins). No paging."], ["Ordering", "Within one call, steps run in order (check, then act). Across calls no ordering is promised: two agents can race."]]}, {"title": "What survives a restart", "head": ["Item", "After the server restarts"], "rows": [["mcp itself", ["ok", "Nothing to lose: no state, no sessions, no subscriptions."]], ["Sessions and workflows", ["info", "Depends on core's store. In-memory is the default and loses them."]], ["Run history and status", ["info", "Depends on core's tracker and log configuration."]], ["Execution logs", ["info", "Depends on core's log store. If the logs are gone but the run record remains, the answer simply has no lines."]], ["The API key", ["ok", "Read from configuration at startup."]], ["An agent's polling", ["ok", "A reconnect is not needed. The next poll simply works."]]]}]}, "ref": [{"id": "tools", "title": "Tool catalogue (16)", "lede": "Hints as declared on each tool. 'read-only' also means closed-world. Required arguments are listed first.", "head": ["Tool", "What it does", "Hint", "Key parameters"], "rows": [["list_sessions", "Sessions with workflow counts (wrapped in SessionList)", "read-only", "none"], ["get_session_details", "One session and its workflow ids", "read-only", "sessionId"], ["get_session_creation_instructions", "Format guide, example, live plugin list, common errors", "read-only", "none"], ["create_session", "Create or overwrite a session from a structured config", "destructive, open-world", "config (SessionConfigData)"], ["get_workflow_details", "The DAG definition: nodes and edges", "read-only", "sessionId, workflowId"], ["start_workflow", "Start a run, return the execution id", "write, not destructive", "sessionId, workflowId"], ["get_workflow_status", "Progress snapshot with per-node status", "read-only", "sessionId, executionId"], ["get_workflow_history", "All executions of a session (wrapped in WorkflowHistory)", "read-only", "sessionId"], ["get_execution_logs", "Stored plugin logs, regex filter, tail", "read-only", "sessionId, executionId; tailLines, filterPattern"], ["control_workflow", "Pause, resume, stop, stop all, restart, restart from node", "destructive", "sessionId, action; executionId, workflowId, fromNodeId, reason"], ["control_node", "Ten node-level actions", "destructive", "sessionId, executionId, nodeId, action; immediate, reason"], ["set_node_breakpoint", "Pause a node when a field equals a value", "write, not destructive", "sessionId, executionId, nodeId, field, equalsValue"], ["list_plugins", "Plugin types and categories (wrapped in PluginList)", "read-only", "none"], ["get_plugin_details", "Description, usage pattern, UI design, output ports", "read-only", "type"], ["get_plugin_creation_guide", "Templates and checklists for writing a plugin", "read-only", "templateType (optional)"], ["get_control_bus_status", "Sessions, 20 recent executions, plugins, JVM", "read-only", "filterType (optional)"]]}, {"id": "actions", "title": "Control actions", "lede": "What each action needs and returns. 'Signal' results confirm emission, not effect.", "head": ["Tool and action", "Needs", "Returns"], "rows": [["control_workflow PAUSE / RESUME", "executionId", "Signal sent"], ["control_workflow STOP", "executionId; reason optional", "Execution stopped, with the stopped id"], ["control_workflow STOP_ALL", "workflowId (no executionId, no ownership check)", "Ids of stopped executions"], ["control_workflow RESTART", "executionId", "New execution id"], ["control_workflow RESTART_FROM_NODE", "executionId, fromNodeId", "New execution id"], ["control_node PAUSE / RESUME", "executionId, nodeId", "Signal sent"], ["control_node STOP", "executionId, nodeId; immediate, reason optional", "Signal sent"], ["control_node STEP_ENABLE / STEP_DISABLE / STEP", "executionId, nodeId", "Signal sent"], ["control_node SKIP / UNSKIP", "executionId, nodeId", "Signal sent (input passes through while skipped)"], ["control_node RETRY", "executionId, nodeId", "New execution id started from that node"], ["control_node BREAKPOINT_CLEAR", "executionId, nodeId", "Signal sent"], ["set_node_breakpoint", "executionId, nodeId, field, equalsValue", "BREAKPOINT_SET result"]]}, {"id": "gotchas", "title": "Spring AI 2.0 gotchas", "lede": "Behaviours of the framework the code is shaped around.", "head": ["Situation", "What goes wrong", "What we do"], "rows": [["A list returned as Flux<T>", "The async callback keeps only the first element, so the agent sees a list of one.", "Return Mono<WrapperRecord> (SessionList, WorkflowHistory, PluginList)."], ["Mono<List<T>> with generateOutputSchema = true", "Server startup crashes: the schema generator is given a null class for a parameterised type.", "Same wrapper records. The JSON-RPC integration test is the only one that would catch it."], ["Tool failure", "An IllegalArgumentException becomes an isError result with the message as text.", "Write the message for an agent and name the next tool to call."], ["Parameter annotations", "@McpToolParam is for tool arguments, @McpArg only for prompt arguments.", "Use each in its own place."], ["Structured results", "With generateOutputSchema the result must match the record's schema.", "Return records, not maps or strings."]]}, {"id": "errors", "title": "Error messages an agent will see", "head": ["Message", "When"], "rows": [["Execution not found: <id>. Use get_workflow_history to list executions.", "Unknown execution, or one owned by another session (identical on purpose)"], ["Session not found: <id>. Use list_sessions to see available sessions.", "get_session_details or get_workflow_history on an unknown session"], ["executionId is required for action <A>.", "A control call without an execution id"], ["fromNodeId is required for action RESTART_FROM_NODE.", "Restart-from-node without a node"], ["workflowId is required for action STOP_ALL.", "STOP_ALL without a workflow"], ["Regex pattern too long (max 200 characters).", "filterPattern over 200 characters"], ["Invalid regex pattern: <engine message>", "Regex syntax error"], ["Regex filter is too expensive to evaluate; simplify the pattern.", "More than 50 ms on one line"], ["Unsupported filter: <x>. Valid filters: sessions, executions, plugins, health; ...", "get_control_bus_status with a bad filter"], ["Plugin not found: <type>", "get_plugin_details with an unregistered type"]]}, {"id": "content", "title": "Prompts and resources", "head": ["Name", "Kind", "What it gives"], "rows": [["debug-workflow", "prompt (sessionId, executionId)", "Instruction to read status, logs and definition, find the cause, suggest a fix"], ["create-session-config", "prompt", "Instruction to read the format guide and plugin list, draft and apply a session"], ["yukta://overview", "resource", "Short description and a typical tool flow"], ["yukta://architecture", "resource", "DAG, sessions, control bus, reactive core, plugin logs"], ["yukta://sessions/{sessionId}/executions/{executionId}/logs", "resource template", "Whole log of an execution (up to 5,000 lines), one line per row"]]}], "quality": [{"n": "Scalability", "pos": "mcp is a stateless shell, so it scales as far as core does: any instance could serve any request. The pressure is that agents poll, and some calls grow with the number of sessions.", "ceil": ["Status and list tools read every session with no paging", "Polling load grows with agents x runs, because nothing is pushed", "Whole-log reads to find a tail on very large logs", "All tool descriptions are sent to every client on connect"], "have": ["No state, no sticky sessions", "8-at-a-time session reads", "Streaming tail with a 5,000-line cap"], "need": ["Paging on list and history tools", "A cheaper status path in core (one-pass summary)", "Progress notifications or a resource subscription instead of polling"]}, {"n": "Performance", "pos": "Each call is one or a few reads in core, so latency is mostly core's. The costs worth watching are log scans, the aggregate status and the ownership read on every execution call.", "ceil": ["Log filter scans every line of an execution", "Status cost is linear in sessions and history size", "Regex budget of 50 ms per line, times many lines, can still add up"], "have": ["Regex compiled once per call", "One pass per session in the aggregator", "Ownership read is a single record lookup"], "need": ["A line or time bound on the whole filter, not only per line", "Cache or summary for the status snapshot", "Server-side paging for history"]}, {"n": "Availability", "pos": "Almost nothing here can fail by itself, since there is no state. Availability is core's. mcp's own risk is a boot failure from the framework and a flood of agent calls with no rate limit.", "ceil": ["Whole app fails to start if schema generation breaks", "No rate limit per caller", "No health signal for the MCP endpoint itself"], "have": ["Stateless: a restart is invisible to a polling agent", "Broken sessions are skipped in listings"], "need": ["A per-key rate limit", "A startup smoke test that lists tools (exists: the integration test)", "Metrics for tool calls and errors"]}, {"n": "Security", "pos": "This is the lens that matters most. The endpoint can install workflows that run commands, and it ships open. The module fences agent input (regex, size), keeps ownership consistent and sets honest hints. It has no caller identity or authorisation.", "ceil": ["One shared key, optional, off by default", "No per-agent identity or scope: any caller can read and change any session", "Commands carry no actor, so audit cannot tell agent from human", "Logs and definitions go into model context unfiltered"], "have": ["Constant-time key compare when set", "Same er
