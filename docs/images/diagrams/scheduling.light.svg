<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-label="A workflow is started once and holds one open execution. SCHEDULE_TRIGGER emits a tick into it, and the nodes handle every tick as a message.">
<title>A workflow is started once and holds one open execution. SCHEDULE_TRIGGER emits a tick into it, and the nodes handle every tick as a message.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 3.78s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}10.42%{opacity:1}29.76%{opacity:1}40.48%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 3.78s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  22.62%{stroke-dashoffset:-100;opacity:1}22.63%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="980" height="300" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="980" height="300" fill="#FBFCFE"/><rect width="980" height="300" fill="url(#dots)"/></g>
<g class="graph">
<path d="M280.0,82.0 C330.0,82.0 330.0,134.8 380.0,134.8" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/>
<path d="M280.0,218.0 C330.0,218.0 330.0,165.2 380.0,165.2" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:0.41s" d="M280.0,218.0 C330.0,218.0 330.0,165.2 380.0,165.2" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<path d="M610.0,150.0 C665.0,150.0 665.0,150.0 720.0,150.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:1.31s" d="M610.0,150.0 C665.0,150.0 665.0,150.0 720.0,150.0" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<g filter="url(#soft)"><rect x="30" y="44" width="250" height="76" rx="12" fill="#677895"/><rect x="30" y="47" width="250" height="73" rx="12" fill="#DEE1E8"/><rect x="31" y="47" width="248" height="72" rx="11" fill="#FFFFFF"/></g><rect x="42" y="67.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(50 75.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.6"/><path d="M4.6 6.2 6.8 8l-2.2 1.8M8.4 10h3"/></g><text x="85" y="79.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Start once</text><text x="85" y="97.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">one REST, CLI or MCP call</text>
<g class="run" style="--at:0.00s"><rect x="30" y="180" width="250" height="76" rx="12" fill="#DD5400" opacity=".38" filter="url(#halo)"/><rect x="28.5" y="178.5" width="253" height="79" rx="13.5" fill="none" stroke="#DD5400" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="30" y="180" width="250" height="76" rx="12" fill="#DD5400"/><rect x="30" y="183" width="250" height="73" rx="12" fill="#DEE1E8"/><rect x="31" y="183" width="248" height="72" rx="11" fill="#FFFFFF"/></g><rect x="42" y="203.5" width="32" height="32" rx="8" fill="#FBEAE0"/><g transform="translate(50 211.5)" color="#DD5400" fill="none" stroke="#DD5400" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></g><text x="85" y="215.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#11161F">SCHEDULE_TRIGGER</text><text x="85" y="233.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">tick 1, 2, 3 ...</text>
<g class="run" style="--at:0.90s"><rect x="380" y="112" width="230" height="76" rx="12" fill="#376EF4" opacity=".38" filter="url(#halo)"/><rect x="378.5" y="110.5" width="233" height="79" rx="13.5" fill="none" stroke="#376EF4" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="380" y="112" width="230" height="76" rx="12" fill="#376EF4"/><rect x="380" y="115" width="230" height="73" rx="12" fill="#DEE1E8"/><rect x="381" y="115" width="228" height="72" rx="11" fill="#FFFFFF"/></g><rect x="392" y="135.5" width="32" height="32" rx="8" fill="#E7EEFE"/><g transform="translate(400 143.5)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7V6a2 2 0 0 1 2-2h8.5M11 2l2 2-2 2M13.5 9v1a2 2 0 0 1-2 2H3M5 14l-2-2 2-2"/></g><text x="435" y="147.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">One open execution</text><text x="435" y="165.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">holds one slot</text>
<g class="run" style="--at:1.80s"><rect x="720" y="112" width="230" height="76" rx="12" fill="#376EF4" opacity=".38" filter="url(#halo)"/><rect x="718.5" y="110.5" width="233" height="79" rx="13.5" fill="none" stroke="#376EF4" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="720" y="112" width="230" height="76" rx="12" fill="#376EF4"/><rect x="720" y="115" width="230" height="73" rx="12" fill="#DEE1E8"/><rect x="721" y="115" width="228" height="72" rx="11" fill="#FFFFFF"/></g><rect x="732" y="135.5" width="32" height="32" rx="8" fill="#E7EEFE"/><g transform="translate(740 143.5)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="3.6" cy="8" r="1.8"/><circle cx="12.4" cy="3.8" r="1.8"/><circle cx="12.4" cy="12.2" r="1.8"/><path d="M5.3 7.2 10.7 4.6M5.3 8.8l5.4 2.6"/></g><text x="775" y="147.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Nodes</text><text x="775" y="165.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">handle each tick</text>

</g>
<rect x=".5" y=".5" width="979" height="299" rx="13.5" fill="none" stroke="#DEE1E8"/>
