<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Each API key has a role that adds reach: a VIEWER reads, an OPERATOR also starts and steers runs, an ADMIN also defines workflows and sets limits. Separately, allow-lists bound the commands, outbound hosts and secrets a workflow can use.">
<title>Each API key has a role that adds reach: a VIEWER reads, an OPERATOR also starts and steers runs, an ADMIN also defines workflows and sets limits. Separately, allow-lists bound the commands, outbound hosts and secrets a workflow can use.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 1.76s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}19.89%{opacity:1}56.82%{opacity:1}77.27%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 1.76s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  43.18%{stroke-dashoffset:-100;opacity:1}43.19%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="880" height="440" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="880" height="440" fill="#FBFCFE"/><rect width="880" height="440" fill="url(#dots)"/></g>
<g class="graph"><rect x="20" y="24" width="480" height="392" rx="18" fill="#F9F0EC" stroke="#EAA072" stroke-width="1.5"/><rect x="44" y="112" width="432" height="280" rx="18" fill="#EDF2FD" stroke="#8FAEF8" stroke-width="1.5"/><rect x="68" y="200" width="384" height="168" rx="18" fill="#F1F3F7" stroke="#AAB3C4" stroke-width="1.5"/><text x="44" y="58" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#DD5400" text-anchor="start">ADMIN</text><text x="44" y="80" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">+ define workflows, set limits, /actuator</text><text x="68" y="146" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#376EF4" text-anchor="start">OPERATOR</text><text x="68" y="168" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">+ start, stop, steer, answer inputs</text><text x="92" y="234" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#677895" text-anchor="start">VIEWER</text><text x="92" y="256" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">read sessions, runs and logs</text><rect x="92" y="300" width="200.3" height="22" rx="11" fill="#E5E8ED" stroke="#BBC2CF"/><text x="192.14" y="315.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#677895" text-anchor="middle">sessions: a list or *</text><text x="92" y="345" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">OPERATOR and VIEWER keys only</text><text x="530" y="52" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#11161F" text-anchor="start">Workflows are bounded too</text><g filter="url(#soft)"><rect x="530" y="76" width="330" height="76" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><rect x="542" y="94" width="40" height="40" rx="10" fill="#E7EEFE"/><g transform="translate(552 104) scale(1.25)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.6"/><path d="M4.6 6.2 6.8 8l-2.2 1.8M8.4 10h3"/></g><text x="596" y="110" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#11161F" text-anchor="start">Commands</text><text x="596" y="132" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">yukta.process.allowed-commands</text><g filter="url(#soft)"><rect x="530" y="170" width="330" height="76" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><rect x="542" y="188" width="40" height="40" rx="10" fill="#E7EEFE"/><g transform="translate(552 198) scale(1.25)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2.2 2 9.8 0 12M8 2c-2 2.2-2 9.8 0 12"/></g><text x="596" y="204" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#11161F" text-anchor="start">Outbound hosts</text><text x="596" y="226" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">yukta.egress.allowed-hosts</text><g filter="url(#soft)"><rect x="530" y="264" width="330" height="76" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><rect x="542" y="282" width="40" height="40" rx="10" fill="#E7EEFE"/><g transform="translate(552 292) scale(1.25)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8 13.2 3.8v4c0 3.2-2.2 5.3-5.2 6.4-3-1.1-5.2-3.2-5.2-6.4v-4z"/><path d="M5.8 8.2 7.4 9.8 10.4 6.6"/></g><text x="596" y="298" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#11161F" text-anchor="start">Secrets</text><text x="596" y="320" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">decrypted:name, set on the server</text>

</g>
<rect x=".5" y=".5" width="879" height="439" rx="13.5" fill="none" stroke="#DEE1E8"/>
</svg>
