<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 346" width="820" height="346" role="img" aria-label="A BRANCH node looks up the value in its cases; each case names an output port, an edge with that sourcePort carries the message on, and defaultPort catches the rest.">
