<g class="run" style="--at:0.80s"><rect x="400" y="204" width="530" height="66" rx="12" fill="#677895" opacity=".38" filter="url(#halo)"/><rect x="398.5" y="202.5" width="533" height="69" rx="13.5" fill="none" stroke="#677895" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="400" y="204" width="530" height="66" rx="12" fill="#677895"/><rect x="400" y="207" width="530" height="63" rx="12" fill="#B3BCCA"/><rect x="401.5" y="207" width="527" height="61.5" rx="10.5" fill="#FFFFFF"/></g><rect x="412" y="222.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(420 230.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></g><text x="455" y="234.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">TIMED_OUT: A clock ran out</text><text x="455" y="252.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">queue, run or node</text>
<g class="run" style="--at:0.80s"><rect x="400" y="294" width="530" height="66" rx="12" fill="#677895" opacity=".38" filter="url(#halo)"/><rect x="398.5" y="292.5" width="533" height="69" rx="13.5" fill="none" stroke="#677895" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="400" y="294" width="530" height="66" rx="12" fill="#677895"/><rect x="400" y="297" width="530" height="63" rx="12" fill="#B3BCCA"/><rect x="401.5" y="297" width="527" height="61.5" rx="10.5" fill="#FFFFFF"/></g><rect x="412" y="312.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(420 320.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 2.2a3.4 3.4 0 0 0-3.8 4.6L2.2 11a1.4 1.4 0 0 0 2 2l4.2-4.2a3.4 3.4 0 0 0 4.6-3.8l-2 2-1.9-.4-.4-1.9z"/></g><text x="455" y="324.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">FAILURE: A node failed</text><text x="455" y="342.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">read its reason</text>
