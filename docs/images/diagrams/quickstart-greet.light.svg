<g class="run" style="--at:0.00s"><rect x="40" y="60" width="240" height="80" rx="12" fill="#DD5400" opacity=".38" filter="url(#halo)"/><rect x="38.5" y="58.5" width="243" height="83" rx="13.5" fill="none" stroke="#DD5400" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="40" y="60" width="240" height="80" rx="12" fill="#DD5400"/><rect x="40" y="63" width="240" height="77" rx="12" fill="#EEAA80"/><rect x="41.5" y="63" width="237" height="75.5" rx="10.5" fill="#FFFFFF"/></g><rect x="52" y="85.5" width="32" height="32" rx="8" fill="#FBEAE0"/><g transform="translate(60 93.5)" color="#DD5400" fill="none" stroke="#DD5400" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 1.8 3.6 9h4.2l-1 5.2L12.4 7H8.2z" fill="currentColor" stroke="none"/></g><text x="95" y="97.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#11161F">API_TRIGGER</text><text x="95" y="115.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">receives { name: Ada }</text>
<g class="run" style="--at:0.90s"><rect x="385" y="60" width="240" height="80" rx="12" fill="#376EF4" opacity=".38" filter="url(#halo)"/><rect x="383.5" y="58.5" width="243" height="83" rx="13.5" fill="none" stroke="#376EF4" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="385" y="60" width="240" height="80" rx="12" fill="#376EF4"/><rect x="385" y="63" width="240" height="77" rx="12" fill="#9BB6FA"/><rect x="386.5" y="63" width="237" height="75.5" rx="10.5" fill="#FFFFFF"/></g><rect x="397" y="85.5" width="32" height="32" rx="8" fill="#E7EEFE"/><g transform="translate(405 93.5)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h3l6 7h3M2 11.5h3l1.6-1.9M9.4 6.4 11 4.5h3M12 2.8l2 1.7-2 1.7M12 9.8l2 1.7-2 1.7"/></g><text x="440" y="97.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#11161F">MAPPER</text><text x="440" y="115.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">builds the greeting</text>
<g class="run" style="--at:1.80s"><rect x="730" y="60" width="240" height="80" rx="12" fill="#677895" opacity=".38" filter="url(#halo)"/><rect x="728.5" y="58.5" width="243" height="83" rx="13.5" fill="none" stroke="#677895" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="730" y="60" width="240" height="80" rx="12" fill="#677895"/><rect x="730" y="63" width="240" height="77" rx="12" fill="#B3BCCA"/><rect x="731.5" y="63" width="237" height="75.5" rx="10.5" fill="#FFFFFF"/></g><rect x="742" y="85.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(750 93.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.6"/><path d="M4.6 6.2 6.8 8l-2.2 1.8M8.4 10h3"/></g><text x="785" y="97.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#11161F">CONSOLE_TERMINAL</text><text x="785" y="115.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">Hello, Ada</text>
<rect x="22" y="193" width="10" height="10" rx="3" fill="#DD5400"/><text x="38" y="202.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#545E6F">Trigger</text><rect x="112.23" y="193" width="10" height="10" rx="3" fill="#376EF4"/><text x="128.23000000000002" y="202.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#545E6F">Processor</text><rect x="216.24" y="193" width="10" height="10" rx="3" fill="#677895"/><text x="232.24" y="202.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#545E6F">Terminal</text>
</g>
