<path d="M560.0,390.0 C625.0,390.0 625.0,390.0 690.0,390.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/>
