<g filter="url(#soft)"><rect x="350" y="350" width="210" height="80" rx="12" fill="#8E9FBE"/><rect x="350" y="353" width="210" height="77" rx="12" fill="#505A6E"/><rect x="351.5" y="353" width="207" height="75.5" rx="10.5" fill="#11161F"/></g><rect x="362" y="375.5" width="32" height="32" rx="8" fill="#252C38"/><g transform="translate(370 383.5)" color="#8E9FBE" fill="none" stroke="#8E9FBE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5 4 3h8l2 6.5V13H2z M2 9.5h3.5l1 1.6h3l1-1.6H14"/></g><text x="405" y="387.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9">Message</text><text x="405" y="405.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">payload, metadata</text>
