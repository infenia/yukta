ospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#8E9FBE" text-anchor="middle">decrypted:name</text><path d="M280 172 C310 172 320 172 346 172" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-outline)"/>
