<g class="run" style="--at:0.80s"><rect x="74" y="276" width="168" height="62" rx="12" fill="#376EF4" opacity=".38" filter="url(#halo)"/><rect x="72.5" y="274.5" width="171" height="65" rx="13.5" fill="none" stroke="#376EF4" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="74" y="276" width="168" height="62" rx="12" fill="#376EF4"/><rect x="74" y="279" width="168" height="59" rx="12" fill="#9BB6FA"/><rect x="75.5" y="279" width="165" height="57.5" rx="10.5" fill="#FFFFFF"/></g><rect x="86" y="292.5" width="32" height="32" rx="8" fill="#E7EEFE"/><g transform="translate(94 300.5)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7V6a2 2 0 0 1 2-2h8.5M11 2l2 2-2 2M13.5 9v1a2 2 0 0 1-2 2H3M5 14l-2-2 2-2"/></g><text x="129" y="304.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">until-three</text><text x="129" y="322.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">LOOP_PREDICATE</text>
