<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 372" width="790" height="372" role="img" aria-label="An assignment names the unit a supervisor owns: the whole server, a session, a workflow, only its run level, or chosen nodes. Every unit has exactly one owner.">
<title>An assignment names the unit a supervisor owns: the whole server, a session, a workflow, only its run level, or chosen nodes. Every unit has exactly one owner.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 1.76s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}19.89%{opacity:1}56.82%{opacity:1}77.27%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 1.76s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  43.18%{stroke-dashoffset:-100;opacity:1}43.19%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="790" height="372" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="790" height="372" fill="#FBFCFE"/><rect width="790" height="372" fill="url(#dots)"/></g>
<g class="graph"><rect x="18" y="16" width="540" height="340" rx="16" fill="#F1F3F7" stroke="#B1BACA"/><text x="34" y="44" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#11161F" text-anchor="start">server</text><text x="101.8" y="44" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">server-wide commands</text><rect x="36" y="62" width="504" height="276" rx="16" fill="#F1F3F7" stroke="#B1BACA"/><text x="52" y="90" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#11161F" text-anchor="start">session:&lt;id&gt;</text><text x="175.6" y="90" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">every workflow of it</text><rect x="54" y="108" width="468" height="212" rx="16" fill="#EDF2FD" stroke="#99B5F9"/><text x="70" y="136" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#11161F" text-anchor="start">workflow:&lt;s&gt;/&lt;w&gt;</text><text x="230.8" y="136" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="start">run level and every node</text><g filter="url(#soft)"><rect x="72" y="158" width="210" height="138" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><text x="86" y="186" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#11161F" text-anchor="start">run:&lt;s&gt;/&lt;w&gt;</text><text x="86" y="212" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#545E6F" text-anchor="start">the run level only</text><text x="86" y="234" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#545E6F" text-anchor="start">start, pause,</text><text x="86" y="254" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#545E6F" text-anchor="start">stop, restart</text><g filter="url(#soft)"><rect x="300" y="158" width="210" height="138" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><text x="314" y="186" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#11161F" text-anchor="start">//selector</text><text x="314" y="212" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#545E6F" text-anchor="start">some nodes:</text><text x="314" y="234" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#545E6F" text-anchor="start">a node id,</text><text x="314" y="254" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#545E6F" text-anchor="start">&lt;prefix&gt;.*,</text><text x="314" y="274" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#545E6F" text-anchor="start">group:&lt;stage&gt;</text>
<g class="live"><rect x="570" y="150" width="190" height="72" rx="12" fill="#677895" opacity=".38" filter="url(#halo)"/><rect x="568.5" y="148.5" width="193" height="75" rx="13.5" fill="none" stroke="#677895" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="570" y="150" width="190" height="72" rx="12" fill="#677895"/><rect x="570" y="153" width="190" height="69" rx="12" fill="#B3BCCA"/><rect x="571.5" y="153" width="187" height="67.5" rx="10.5" fill="#FFFFFF"/></g><rect x="582" y="171.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(590 179.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></g><text x="625" y="183.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">release-guard</text><text x="625" y="201.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">supervisor</text>
<path d="M566 186 L524 186" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/><rect x="570.0" y="262" width="151.6" height="24" rx="12" fill="#FBFCFE" stroke="#99B5F9"/><text x="645.78" y="278.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#376EF4" text-anchor="middle">one owner per unit</text><rect x="570.0" y="292" width="144.1" height="24" rx="12" fill="#FBFCFE" stroke="#F17E84"/><text x="642.0699999999999" y="308.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#E7000B" text-anchor="middle">else 409 conflict</text>
</g>
<rect x=".5" y=".5" width="789" height="371" rx="13.5" fill="none" stroke="#DEE1E8"/>
</svg>
