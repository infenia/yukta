<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 338" width="776" height="338" role="img" aria-label="An LLM_CALL with failureMode CONTINUE and routeByStatus leaves on success or failure; the failure port can lead to a second LLM_CALL with another model.">
<title>An LLM_CALL with failureMode CONTINUE and routeByStatus leaves on success or failure; the failure port can lead to a second LLM_CALL with another model.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
