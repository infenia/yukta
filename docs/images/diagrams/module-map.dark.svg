<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" role="img" aria-label="Clients reach the web, mcp and ui modules, which call core. Core uses plugin-api and plugins, messaging, persistence-postgres and workers. The boot module wires everything into one Spring Boot app.">
