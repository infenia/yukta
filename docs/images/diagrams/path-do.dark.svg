ke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.2 8.2 7.2 10.2 10.8 6"/></g><text x="316" y="217" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#F3F5F9" text-anchor="start">Verify</text><g class="live"><circle cx="436" cy="211" r="9" fill="none" stroke="#FC8C45" stroke-width="2"/></g>
