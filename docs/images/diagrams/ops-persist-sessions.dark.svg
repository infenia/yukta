linecap="round"/><text x="44" y="338" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F3F5F9" text-anchor="start">PostgreSQL</text><text x="44" y="360" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9AA5B8" text-anchor="start">Plus edition</text><g transform="translate(430 332) scale(1.25)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.2 8.2 7.2 10.2 10.8 6"/></g><g transform="translate(565 332) scale(1.25)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.2 8.2 7.2 10.2 10.8 6"/></g><g transform="translate(695 332) scale(1.25)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.2 8.2 7.2 10.2 10.8 6"/></g><g transform="translate(805 332) scale(1.25)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.2 8.2 7.2 10.2 10.8 6"/></g><g transform="translate(44 392) scale(1.0)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.2 8.2 7.2 10.2 10.8 6"/></g><text x="68" y="405" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9AA5B8" text-anchor="start">survives a restart; Disk and PostgreSQL need one switch per store</text>

