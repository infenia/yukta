<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 738 324" width="738" height="324" role="img" aria-label="A node with onError ROUTE retries a failing message, then sends it out of its error port to a dead-letter terminal, so the run carries on and still ends SUCCESS.">
<title>A node with onError ROUTE retries a failing message, then sends it out of its error port to a dead-letter terminal, so the run carries on and still ends SUCCESS.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 2.56s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}13.67%{opacity:1}39.06%{opacity:1}53.12%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 2.56s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  29.69%{stroke-dashoffset:-100;opacity:1}29.70%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
