<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="A run or node status only moves forward from PENDING to QUEUED to RUNNING, and then ends in exactly one final status: done, failed, cut short or never run.">
<title>A run or node status only moves forward from PENDING to QUEUED to RUNNING, and then ends in exactly one final status: done, failed, cut short or never run.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 2.56s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}13.67%{opacity:1}39.06%{opacity:1}53.12%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 2.56s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  29.69%{stroke-dashoffset:-100;opacity:1}29.70%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2D333D" opacity="0.9"/></pattern><clipPath id="frame"><rect width="1000" height="500" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.45"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#7F90AE"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#6FA2FF"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#FF6467"/></marker></defs>
<g clip-path="url(#frame)"><rect width="1000" height="500" fill="#0A0D14"/><rect width="1000" height="500" fill="url(#dots)"/></g>
<g class="graph"><g filter="url(#soft)"><rect x="600" y="24" width="380" height="452" rx="12" fill="#11161F" stroke="#2D333D"/></g><text x="620" y="58" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#F3F5F9" text-anchor="start">One final status</text><text x="620" y="105" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9" text-anchor="start">Done</text><rect x="740" y="88" width="78.8" height="22" rx="11" fill="#263551" stroke="#3B5584"/><text x="779.38" y="103.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#6FA2FF" text-anchor="middle">SUCCESS</text><path d="M616 142H964" stroke="#2D333D" stroke-opacity=".7"/><text x="620" y="179" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9" text-anchor="start">Failed</text><rect x="740" y="162" width="78.8" height="22" rx="11" fill="#46272F" stroke="#7C393F"/><text x="779.38" y="177.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#FF6467" text-anchor="middle">FAILURE</text><path d="M616 216H964" stroke="#2D333D" stroke-opacity=".7"/><text x="620" y="253" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9" text-anchor="start">Cut short</text><rect x="740" y="236" width="78.8" height="22" rx="11" fill="#2D3543" stroke="#495467"/><text x="779.38" y="251.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#8E9FBE" text-anchor="middle">STOPPED</text><rect x="826.76" y="236" width="96.1" height="22" rx="11" fill="#2D3543" stroke="#495467"/><text x="874.8199999999999" y="251.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#8E9FBE" text-anchor="middle">CANCELLED</text><rect x="740" y="266" width="96.1" height="22" rx="11" fill="#2D3543" stroke="#495467"/><text x="788.06" y="281.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#8E9FBE" text-anchor="middle">TIMED_OUT</text><rect x="844.12" y="266" width="78.8" height="22" rx="11" fill="#2D3543" stroke="#495467"/><text x="883.5" y="281.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#8E9FBE" text-anchor="middle">ABORTED</text><path d="M616 320H964" stroke="#2D333D" stroke-opacity=".7"/><text x="620" y="357" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9" text-anchor="start">Never ran</text><rect x="740" y="340" width="78.8" height="22" rx="11" fill="#2D3543" stroke="#495467"/><text x="779.38" y="355.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#8E9FBE" text-anchor="middle">SKIPPED</text><rect x="740" y="370" width="148.2" height="22" rx="11" fill="#2D3543" stroke="#495467"/><text x="814.1" y="385.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#8E9FBE" text-anchor="middle">UPSTREAM_FAILED</text><path d="M616 424H964" stroke="#2D333D" stroke-opacity=".7"/><path d="M514 250 H592" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-outline)"/>
<path d="M170.0,250.0 C200.0,250.0 160.0,250.0 190.0,250.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:0.36s" d="M170.0,250.0 C200.0,250.0 160.0,250.0 190.0,250.0" pathLength="100" fill="none" stroke="#6FA2FF" stroke-width="3" stroke-linecap="round"/>
<path d="M340.0,250.0 C370.0,250.0 330.0,250.0 360.0,250.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:1.16s" d="M340.0,250.0 C370.0,250.0 330.0,250.0 360.0,250.0" pathLength="100" fill="none" stroke="#6FA2FF" stroke-width="3" stroke-linecap="round"/>
<g class="run" style="--at:0.00s"><rect x="20" y="212" width="150" height="76" rx="12" fill="#8E9FBE" opacity=".38" filter="url(#halo)"/><rect x="18.5" y="210.5" width="153" height="79" rx="13.5" fill="none" stroke="#8E9FBE" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="20" y="212" width="150" height="76" rx="12" fill="#8E9FBE"/><rect x="20" y="215" width="150" height="73" rx="12" fill="#505A6E"/><rect x="21.5" y="215" width="147" height="71.5" rx="10.5" fill="#11161F"/></g><rect x="32" y="235.5" width="32" height="32" rx="8" fill="#252C38"/><g transform="translate(40 243.5)" color="#8E9FBE" fill="none" stroke="#8E9FBE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></g><text x="75" y="256.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#F3F5F9">PENDING</text>
<g class="run" style="--at:0.80s"><rect x="190" y="212" width="150" height="76" rx="12" fill="#8E9FBE" opacity=".38" filter="url(#halo)"/><rect x="188.5" y="210.5" width="153" height="79" rx="13.5" fill="none" stroke="#8E9FBE" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="190" y="212" width="150" height="76" rx="12" fill="#8E9FBE"/><rect x="190" y="215" width="150" height="73" rx="12" fill="#505A6E"/><rect x="191.5" y="215" width="147" height="71.5" rx="10.5" fill="#11161F"/></g><rect x="202" y="235.5" width="32" height="32" rx="8" fill="#252C38"/><g transform="translate(210 243.5)" color="#8E9FBE" fill="none" stroke="#8E9FBE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="2.6" rx="1"/><rect x="2" y="6.8" width="12" height="2.6" rx="1"/><rect x="2" y="10.6" width="7" height="2.6" rx="1"/></g><text x="245" y="256.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#F3F5F9">QUEUED</text>
<g class="live"><rect x="360" y="212" width="150" height="76" rx="12" fill="#FC8C45" opacity=".38" filter="url(#halo)"/><rect x="358.5" y="210.5" width="153" height="79" rx="13.5" fill="none" stroke="#FC8C45" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="360" y="212" width="150" height="76" rx="12" fill="#FC8C45"/><rect x="360" y="215" width="150" height="73" rx="12" fill="#865132"/><rect x="361.5" y="215" width="147" height="71.5" rx="10.5" fill="#11161F"/></g><rect x="372" y="235.5" width="32" height="32" rx="8" fill="#372925"/><g transform="translate(380 243.5)" color="#FC8C45" fill="none" stroke="#FC8C45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.2 12.4 8 5 12.8z" fill="currentColor" stroke="none"/></g><text x="415" y="256.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#F3F5F9">RUNNING</text>

</g>
<rect x=".5" y=".5" width="999" height="499" rx="13.5" fill="none" stroke="#2D333D"/>
</svg>
