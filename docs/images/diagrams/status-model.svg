<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1010 230" width="1010" height="230" role="img" aria-label="Run and node status only move forward: PENDING, QUEUED, RUNNING, then a terminal status.">
<title>Run and node status only move forward: PENDING, QUEUED, RUNNING, then a terminal status.</title>
<style>
.node{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.edge,.pill{opacity:0;animation:fade .9s ease forwards;animation-delay:var(--d,0s)}
@keyframes fade{to{opacity:1}}
.glow{opacity:.2;animation:breathe 5.2s ease-in-out infinite;animation-delay:var(--b,0s)}
@keyframes breathe{0%,100%{opacity:.14}50%{opacity:.72}}
.flow{stroke-dasharray:7 10;animation:flow 1.2s linear infinite}
.flow-ctl{stroke-dasharray:3 9;animation:flow-ctl 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-17}}
@keyframes flow-ctl{to{stroke-dashoffset:-12}}
.blob{animation:drift 16s ease-in-out infinite alternate}
.blob.b2{animation-duration:21s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(46px,28px)}}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .node,.edge,.pill{opacity:1!important}
  .glow{opacity:.35!important}
  .dot{display:none}
}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1226"/><stop offset="1" stop-color="#121B3B"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#F2641A"/><stop offset=".22" stop-color="#F2641A"/><stop offset=".22" stop-color="#2F6BFF"/><stop offset=".8" stop-color="#6FA2FF"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#8FA4D8" opacity=".16"/></pattern><radialGradient id="blob-a"><stop offset="0" stop-color="#2F6BFF" stop-opacity=".34"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient><radialGradient id="blob-b"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".34"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="blob-c"><stop offset="0" stop-color="#F2641A" stop-opacity=".34"/><stop offset="1" stop-color="#F2641A" stop-opacity="0"/></radialGradient><clipPath id="card"><rect width="1010" height="230" rx="24"/></clipPath><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><filter id="blur-s" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.2"/></filter><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".38"/></filter><linearGradient id="s-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD66B"/><stop offset="1" stop-color="#D97706"/></linearGradient><linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD66B" stop-opacity=".30"/><stop offset="1" stop-color="#D97706" stop-opacity=".09"/></linearGradient><marker id="m-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 L3.8,6 z" fill="#FFD66B"/></marker><linearGradient id="s-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86B4FF"/><stop offset="1" stop-color="#2F6BFF"/></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86B4FF" stop-opacity=".30"/><stop offset="1" stop-color="#2F6BFF" stop-opacity=".09"/></linearGradient><marker id="m-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 L3.8,6 z" fill="#86B4FF"/></marker><linearGradient id="s-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63EBF7"/><stop offset="1" stop-color="#0891B2"/></linearGradient><linearGradient id="g-cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63EBF7" stop-opacity=".30"/><stop offset="1" stop-color="#0891B2" stop-opacity=".09"/></linearGradient><marker id="m-cyan" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 L3.8,6 z" fill="#63EBF7"/></marker><linearGradient id="s-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52E3A4"/><stop offset="1" stop-color="#059669"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52E3A4" stop-opacity=".30"/><stop offset="1" stop-color="#059669" stop-opacity=".09"/></linearGradient><marker id="m-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 L3.8,6 z" fill="#52E3A4"/></marker></defs>
<g clip-path="url(#card)">
<rect width="1010" height="230" fill="url(#bg)"/>
<rect width="1010" height="230" fill="url(#grid)"/>
<circle class="blob" cx="121.19999999999999" cy="41.4" r="142.6" fill="url(#blob-a)"/>
<circle class="blob b2" cx="868.6" cy="197.79999999999998" r="151.8" fill="url(#blob-b)"/>
<circle class="blob" cx="505.0" cy="4.6000000000000005" r="78.2" fill="url(#blob-c)" opacity=".55"/>
<rect class="sheen" width="1010" height="3.5" fill="url(#bar)"/>
</g>
<rect x=".75" y=".75" width="1008.5" height="228.5" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1.5"/>
<g class="edge" style="--d:0.70s"><path id="p0" d="M220.0,101.0 C258.0,101.0 252.0,101.0 290.0,101.0" fill="none" stroke="#FFD66B" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><path class="flow" d="M220.0,101.0 C258.0,101.0 252.0,101.0 290.0,101.0" fill="none" stroke="#FFD66B" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><g class="dot" opacity="0"><circle r="8" fill="#FFD66B" opacity=".55" filter="url(#blur-s)"/><circle r="3.6" fill="#fff"/><circle r="2.2" fill="#FFD66B"/><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 .05 .55 .95"><mpath href="#p0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></g></g>
<g class="edge" style="--d:0.77s"><path id="p1" d="M470.0,101.0 C508.0,101.0 502.0,101.0 540.0,101.0" fill="none" stroke="#63EBF7" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" marker-end="url(#m-cyan)"/><path class="flow" d="M470.0,101.0 C508.0,101.0 502.0,101.0 540.0,101.0" fill="none" stroke="#63EBF7" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><g class="dot" opacity="0"><circle r="8" fill="#63EBF7" opacity=".55" filter="url(#blur-s)"/><circle r="3.6" fill="#fff"/><circle r="2.2" fill="#63EBF7"/><animateMotion dur="2.6s" begin="0.37s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 .05 .55 .95"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="2.6s" begin="0.37s" repeatCount="indefinite"/></g></g>
<g class="edge" style="--d:0.84s"><path id="p2" d="M720.0,101.0 C758.0,101.0 752.0,101.0 790.0,101.0" fill="none" stroke="#86B4FF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><path class="flow" d="M720.0,101.0 C758.0,101.0 752.0,101.0 790.0,101.0" fill="none" stroke="#86B4FF" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><g class="dot" opacity="0"><circle r="8" fill="#86B4FF" opacity=".55" filter="url(#blur-s)"/><circle r="3.6" fill="#fff"/><circle r="2.2" fill="#86B4FF"/><animateMotion dur="2.6s" begin="0.74s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 .05 .55 .95"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="2.6s" begin="0.74s" repeatCount="indefinite"/></g></g>
<g class="node" style="--d:0.12s"><rect class="glow" style="--b:0.00s" x="40" y="56" width="180" height="90" rx="16" fill="none" stroke="#FFD66B" stroke-width="7" filter="url(#blur)"/><rect x="40" y="56" width="180" height="90" rx="16" fill="#111A33" filter="url(#shadow)"/><rect x="40" y="56" width="180" height="90" rx="16" fill="url(#g-amber)" stroke="url(#s-amber)" stroke-width="1.8"/><path d="M54,57.5 H206" stroke="#fff" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round"/><text x="130.0" y="98.9" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="650" fill="#F4F7FF">PENDING</text><text x="130.0" y="116.0" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#A7B6D8">created, not started</text></g>
<g class="node" style="--d:0.21s"><rect class="glow" style="--b:0.55s" x="290" y="56" width="180" height="90" rx="16" fill="none" stroke="#63EBF7" stroke-width="7" filter="url(#blur)"/><rect x="290" y="56" width="180" height="90" rx="16" fill="#111A33" filter="url(#shadow)"/><rect x="290" y="56" width="180" height="90" rx="16" fill="url(#g-cyan)" stroke="url(#s-cyan)" stroke-width="1.8"/><path d="M304,57.5 H456" stroke="#fff" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round"/><text x="380.0" y="98.9" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="650" fill="#F4F7FF">QUEUED</text><text x="380.0" y="116.0" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#A7B6D8">waiting for a slot</text></g>
<g class="node" style="--d:0.30s"><rect class="glow" style="--b:1.10s" x="540" y="56" width="180" height="90" rx="16" fill="none" stroke="#86B4FF" stroke-width="7" filter="url(#blur)"/><rect x="540" y="56" width="180" height="90" rx="16" fill="#111A33" filter="url(#shadow)"/><rect x="540" y="56" width="180" height="90" rx="16" fill="url(#g-blue)" stroke="url(#s-blue)" stroke-width="1.8"/><path d="M554,57.5 H706" stroke="#fff" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round"/><text x="630.0" y="98.9" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="650" fill="#F4F7FF">RUNNING</text><text x="630.0" y="116.0" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#A7B6D8">first input arrived</text></g>
<g class="node" style="--d:0.39s"><rect class="glow" style="--b:1.65s" x="790" y="56" width="180" height="90" rx="16" fill="none" stroke="#52E3A4" stroke-width="7" filter="url(#blur)"/><rect x="790" y="56" width="180" height="90" rx="16" fill="#111A33" filter="url(#shadow)"/><rect x="790" y="56" width="180" height="90" rx="16" fill="url(#g-green)" stroke="url(#s-green)" stroke-width="1.8"/><path d="M804,57.5 H956" stroke="#fff" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round"/><text x="880.0" y="98.9" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#F4F7FF">terminal status</text><text x="880.0" y="116.0" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#A7B6D8">final, never reopens</text></g>
<text class="pill" style="--d:1.3s" x="505" y="192" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#8EA0C8">A status that would step back is ignored.</text>

<text x="988" y="214" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#fff" opacity=".22">YUKTA</text>
</svg>
