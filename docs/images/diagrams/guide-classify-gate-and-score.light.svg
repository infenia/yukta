<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 330" width="690" height="330" role="img" aria-label="Pick the decision plugin by the question: CLASSIFY picks a label, GATE answers yes or no, SCORE rates on a scale, ANOMALY spots the unusual and DEDUPE spots repeats. Each leaves on its own output ports.">
<title>Pick the decision plugin by the question: CLASSIFY picks a label, GATE answers yes or no, SCORE rates on a scale, ANOMALY spots the unusual and DEDUPE spots repeats. Each leaves on its own output ports.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 1.76s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}19.89%{opacity:1}56.82%{opacity:1}77.27%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 1.76s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  43.18%{stroke-dashoffset:-100;opacity:1}43.19%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="690" height="330" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="690" height="330" fill="#FBFCFE"/><rect width="690" height="330" fill="url(#dots)"/></g>
