<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="A search box over a reference table: the plugins VALIDATE, BRANCH and LLM_CALL, each listed with its output ports such as default, invalid, success and failure.">
<title>A search box over a reference table: the plugins VALIDATE, BRANCH and LLM_CALL, each listed with its output ports such as default, invalid, success and failure.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 1.76s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}19.89%{opacity:1}56.82%{opacity:1}77.27%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 1.76s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  43.18%{stroke-dashoffset:-100;opacity:1}43.19%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
