<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 338" width="786" height="338" role="img" aria-label="The model only suggests a tool call. The route node branches on whether it asked, the act node runs the tool from an allow-list, and a risky tool can wait for a person first.">
