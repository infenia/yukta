<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 400" width="930" height="400" role="img" aria-label="Five steps, each higher than the last: ask for a plan, save the supervisor in dry run and assign it, run and read the decisions, replay on a past run, then switch dry run off. Only the last step touches live runs.">
<title>Five steps, each higher than the last: ask for a plan, save the supervisor in dry run and assign it, run and read the decisions, replay on a past run, then switch dry run off. Only the last step touches live runs.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 1.76s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}19.89%{opacity:1}56.82%{opacity:1}77.27%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 1.76s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  43.18%{stroke-dashoffset:-100;opacity:1}43.19%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="930" height="400" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="930" height="400" fill="#FBFCFE"/><rect width="930" height="400" fill="url(#dots)"/></g>
<g class="graph"><rect x="22" y="340" width="150" height="36" rx="10" fill="#ECEFF4" stroke="#AAB3C4" stroke-dasharray="4 5"/><text x="97.0" y="363" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#677895" text-anchor="middle">nothing saved</text><rect x="206" y="340" width="518" height="36" rx="10" fill="#E7EEFD" stroke="#8FAEF8" stroke-dasharray="4 5"/><text x="465.0" y="363" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#376EF4" text-anchor="middle">dry run: nothing is sent</text><rect x="758" y="340" width="150" height="36" rx="10" fill="#F8EBE5" stroke="#EAA072" stroke-dasharray="4 5"/><text x="833.0" y="363" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#DD5400" text-anchor="middle">live</text>
<g filter="url(#soft)"><rect x="22" y="250" width="150" height="76" rx="12" fill="#FFFFFF" stroke="#9BB6FA"/></g><circle cx="44" cy="288.0" r="12" fill="#376EF4"/><text x="44" y="293.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="64" y="285.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Ask for</text><text x="64" y="303.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">a plan</text><path d="M175 288.0 L202 240.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-outline)"/><g filter="url(#soft)"><rect x="206" y="202" width="150" height="76" rx="12" fill="#FFFFFF" stroke="#9BB6FA"/></g><circle cx="228" cy="240.0" r="12" fill="#376EF4"/><text x="228" y="245.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="248" y="237.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Dry-run save</text><text x="248" y="255.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">and assign</text><path d="M359 240.0 L386 192.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-outline)"/><g filter="url(#soft)"><rect x="390" y="154" width="150" height="76" rx="12" fill="#FFFFFF" stroke="#9BB6FA"/></g><circle cx="412" cy="192.0" r="12" fill="#376EF4"/><text x="412" y="197.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="432" y="189.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Run, read</text><text x="432" y="207.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">the decisions</text><path d="M543 192.0 L570 144.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-outline)"/><g filter="url(#soft)"><rect x="574" y="106" width="150" height="76" rx="12" fill="#FFFFFF" stroke="#9BB6FA"/></g><circle cx="596" cy="144.0" r="12" fill="#376EF4"/><text x="596" y="149.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="616" y="141.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Replay on</text><text x="616" y="159.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">a past run</text><path d="M727 144.0 L754 96.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-outline)"/><g filter="url(#soft)"><rect x="758" y="58" width="150" height="76" rx="12" fill="#FFFFFF" stroke="#EEAA80"/></g><circle cx="780" cy="96.0" r="12" fill="#DD5400"/><text x="780" y="101.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="800" y="93.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Switch dry</text><text x="800" y="111.0" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">run off</text>
</g>
<rect x=".5" y=".5" width="929" height="399" rx="13.5" fill="none" stroke="#DEE1E8"/>
</svg>
