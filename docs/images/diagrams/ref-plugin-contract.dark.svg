<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="A plugin&#x27;s operations run in a fixed order: validateConfig and validateInContext when the workflow is validated, initialize and prepare when it is compiled, forNode when a run is assembled, then start, process or consume while it runs.">
<title>A plugin&#x27;s operations run in a fixed order: validateConfig and validateInContext when the workflow is validated, initialize and prepare when it is compiled, forNode when a run is assembled, then start, process or consume while it runs.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 4.16s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}8.41%{opacity:1}24.04%{opacity:1}32.69%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 4.16s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  18.27%{stroke-dashoffset:-100;opacity:1}18.28%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
