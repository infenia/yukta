<path d="M630.0,98.0 C660.0,98.0 645.0,98.0 675.0,98.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:1.96s" d="M630.0,98.0 C660.0,98.0 645.0,98.0 675.0,98.0" pathLength="100" fill="none" stroke="#6FA2FF" stroke-width="3" stroke-linecap="round"/>
