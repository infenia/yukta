ains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F3F5F9" text-anchor="start">Flux of messages</text><rect x="52" y="358" width="87.4" height="22" rx="11" fill="#2D3543" stroke="#495467"/><text x="95.72" y="373.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#8E9FBE" text-anchor="middle">Terminal</text><text x="180" y="374" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F3F5F9" text-anchor="start">consume(input, config)</text><text x="470" y="374" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9AA5B8" text-anchor="start">returns</text><text x="545" y="374" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F3F5F9" text-anchor="start">Mono&lt;Void&gt;</text><path d="M745 136 C745 170 745 190 745 224" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-outline)"/>
