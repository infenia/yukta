<g class="run" style="--at:1.60s"><rect x="378" y="42" width="168" height="60" rx="12" fill="#DD5400" opacity=".38" filter="url(#halo)"/><rect x="376.5" y="40.5" width="171" height="63" rx="13.5" fill="none" stroke="#DD5400" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="378" y="42" width="168" height="60" rx="12" fill="#DD5400"/><rect x="378" y="45" width="168" height="57" rx="12" fill="#EEAA80"/><rect x="379.5" y="45" width="165" height="55.5" rx="10.5" fill="#FFFFFF"/></g><rect x="390" y="57.5" width="32" height="32" rx="8" fill="#FBEAE0"/><g transform="translate(398 65.5)" color="#DD5400" fill="none" stroke="#DD5400" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 2.2a3.4 3.4 0 0 0-3.8 4.6L2.2 11a1.4 1.4 0 0 0 2 2l4.2-4.2a3.4 3.4 0 0 0 4.6-3.8l-2 2-1.9-.4-.4-1.9z"/></g><text x="433" y="69.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">ADMIN</text><text x="433" y="87.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">define workflows</text>
<text x="94" y="232" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#8592AA" text-anchor="middle">reads</text><text x="278" y="190" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#8592AA" text-anchor="middle">+ operates</text><text x="462" y="148" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#8592AA" text-anchor="middle">+ defines</text>
</g>
