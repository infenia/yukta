<g class="run" style="--at:0.00s"><rect x="10" y="126" width="168" height="60" rx="12" fill="#677895" opacity=".38" filter="url(#halo)"/><rect x="8.5" y="124.5" width="171" height="63" rx="13.5" fill="none" stroke="#677895" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="10" y="126" width="168" height="60" rx="12" fill="#677895"/><rect x="10" y="129" width="168" height="57" rx="12" fill="#B3BCCA"/><rect x="11.5" y="129" width="165" height="55.5" rx="10.5" fill="#FFFFFF"/></g><rect x="22" y="141.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(30 149.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></g><text x="65" y="153.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">VIEWER</text><text x="65" y="171.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">read only</text>
