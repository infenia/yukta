<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="A supervisor at the top watches a run through dashed control lines. In the run, a rule step passes its result to an AI step.">
<title>A supervisor at the top watches a run through dashed control lines. In the run, a rule step passes its result to an AI step.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 2.56s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}13.67%{opacity:1}39.06%{opacity:1}53.12%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 2.56s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  29.69%{stroke-dashoffset:-100;opacity:1}29.70%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="480" height="270" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="480" height="270" fill="#FBFCFE"/><rect width="480" height="270" fill="url(#dots)"/></g>
<g class="graph"><rect x="36" y="146" width="408" height="104" rx="16" fill="#F1F3F7" stroke="#677895" stroke-opacity=".55" stroke-dasharray="5 5" class="march"/><text x="52" y="240" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#545E6F" text-anchor="start">a run</text><path d="M240 108 C240 130 146 126 146 160" fill="none" stroke="#677895" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round" class="march" marker-end="url(#arrow-outline)"/><path d="M240 108 C240 130 340 126 340 160" fill="none" stroke="#677895" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round" class="march" marker-end="url(#arrow-outline)"/>
<path d="M240.0,199.0 C270.0,199.0 222.0,199.0 252.0,199.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:0.36s" d="M240.0,199.0 C270.0,199.0 222.0,199.0 252.0,199.0" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<g class="run" style="--at:0.00s"><rect x="52" y="170" width="188" height="58" rx="12" fill="#376EF4" opacity=".38" filter="url(#halo)"/><rect x="50.5" y="168.5" width="191" height="61" rx="13.5" fill="none" stroke="#376EF4" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="52" y="170" width="188" height="58" rx="12" fill="#376EF4"/><rect x="52" y="173" width="188" height="55" rx="12" fill="#9BB6FA"/><rect x="53.5" y="173" width="185" height="53.5" rx="10.5" fill="#FFFFFF"/></g><rect x="64" y="184.5" width="32" height="32" rx="8" fill="#E7EEFE"/><g transform="translate(72 192.5)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 14V5.5L8 2l5.5 3.5V14M5.5 14V8.5h5V14"/></g><text x="107" y="205.3" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Rule</text>
<g class="run" style="--at:0.80s"><rect x="252" y="170" width="176" height="58" rx="12" fill="#376EF4" opacity=".38" filter="url(#halo)"/><rect x="250.5" y="168.5" width="179" height="61" rx="13.5" fill="none" stroke="#376EF4" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="252" y="170" width="176" height="58" rx="12" fill="#376EF4"/><rect x="252" y="173" width="176" height="55" rx="12" fill="#9BB6FA"/><rect x="253.5" y="173" width="173" height="53.5" rx="10.5" fill="#FFFFFF"/></g><rect x="264" y="184.5" width="32" height="32" rx="8" fill="#E7EEFE"/><g transform="translate(272 192.5)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8c.5 3.4 1.8 4.7 5.2 5.2-3.4.5-4.7 1.8-5.2 5.2-.5-3.4-1.8-4.7-5.2-5.2 3.4-.5 4.7-1.8 5.2-5.2z"/><path d="M13 11.2v3M11.5 12.7h3"/></g><text x="307" y="205.3" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">AI</text>
<g class="live"><rect x="152" y="34" width="176" height="64" rx="14" fill="#677895" opacity=".30" filter="url(#halo)"/></g><g filter="url(#soft)"><rect x="154" y="36" width="172" height="60" rx="14" fill="#FFFFFF" stroke="#B3BCCA"/></g><rect x="166" y="48" width="36" height="36" rx="9" fill="#EDEFF2"/><g transform="translate(174 56) scale(1.25)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></g><text x="212" y="63" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#11161F" text-anchor="start">Supervisor</text><text x="212" y="81" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#545E6F" text-anchor="start">watches, steers</text>
</g>
<rect x=".5" y=".5" width="479" height="269" rx="13.5" fill="none" stroke="#DEE1E8"/>
</svg>
