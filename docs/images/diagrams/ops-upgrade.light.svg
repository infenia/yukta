<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="An upgrade has five steps in order: read the notes, back up what memory holds, drain, install and verify. A failed upgrade goes back by reinstalling the old release and restoring the backup.">
<title>An upgrade has five steps in order: read the notes, back up what memory holds, drain, install and verify. A failed upgrade goes back by reinstalling the old release and restoring the backup.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 1.76s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}19.89%{opacity:1}56.82%{opacity:1}77.27%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 1.76s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  43.18%{stroke-dashoffset:-100;opacity:1}43.19%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="860" height="430" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="860" height="430" fill="#FBFCFE"/><rect width="860" height="430" fill="url(#dots)"/></g>
<g class="graph"><path d="M100 92H760" stroke="#DEE1E8" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="92" r="22" fill="#FFFFFF" stroke="#376EF4" stroke-width="2"/><g transform="translate(90 82) scale(1.25)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8M6 8h8M6 12h8"/><circle cx="2.8" cy="4" r=".9" fill="currentColor"/><circle cx="2.8" cy="8" r=".9" fill="currentColor"/><circle cx="2.8" cy="12" r=".9" fill="currentColor"/></g><g filter="url(#soft)"><rect x="26" y="140" width="148" height="116" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><text x="100" y="172" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#11161F" text-anchor="middle">1  Read notes</text><text x="100" y="200" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">release notes</text><text x="100" y="222" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">check if behind</text><circle cx="265" cy="92" r="22" fill="#FFFFFF" stroke="#376EF4" stroke-width="2"/><g transform="translate(255 82) scale(1.25)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="3.8" rx="5" ry="1.9"/><path d="M3 3.8v8.4c0 1 2.2 1.9 5 1.9s5-.9 5-1.9V3.8M3 8c0 1 2.2 1.9 5 1.9S13 9 13 8"/></g><g filter="url(#soft)"><rect x="191" y="140" width="148" height="116" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><text x="265" y="172" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#11161F" text-anchor="middle">2  Back up</text><text x="265" y="200" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">export sessions</text><text x="265" y="222" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">or save the DB</text><circle cx="430" cy="92" r="22" fill="#FFFFFF" stroke="#DD5400" stroke-width="2"/><g transform="translate(420 82) scale(1.25)" color="#DD5400" fill="none" stroke="#DD5400" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="2.6" rx="1"/><rect x="2" y="6.8" width="12" height="2.6" rx="1"/><rect x="2" y="10.6" width="7" height="2.6" rx="1"/></g><g filter="url(#soft)"><rect x="356" y="140" width="148" height="116" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><text x="430" y="172" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#11161F" text-anchor="middle">3  Drain</text><text x="430" y="200" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">new starts: 429</text><text x="430" y="222" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">runs finish</text><circle cx="595" cy="92" r="22" fill="#FFFFFF" stroke="#376EF4" stroke-width="2"/><g transform="translate(585 82) scale(1.25)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8 13.6 5v6L8 14.2 2.4 11V5z M2.4 5 8 8.2 13.6 5 M8 8.2v6"/></g><g filter="url(#soft)"><rect x="521" y="140" width="148" height="116" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><text x="595" y="172" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#11161F" text-anchor="middle">4  Install</text><text x="595" y="200" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">new tag or file</text><text x="595" y="222" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">then restart</text><circle cx="760" cy="92" r="22" fill="#FFFFFF" stroke="#376EF4" stroke-width="2"/><g transform="translate(750 82) scale(1.25)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.2 8.2 7.2 10.2 10.8 6"/></g><g filter="url(#soft)"><rect x="686" y="140" width="148" height="116" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><text x="760" y="172" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#11161F" text-anchor="middle">5  Verify</text><text x="760" y="200" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">/actuator/info</text><text x="760" y="222" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#545E6F" text-anchor="middle">run a workflow</text><path d="M760 270 C760 340 265 340 265 270" fill="none" stroke="#E7000B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-danger)"/><rect x="362" y="328" width="300" height="30" rx="15" fill="#FBFCFE" stroke="#F4A4A9"/><text x="512.5" y="348" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#E7000B" text-anchor="middle">roll back: old release, restored backup</text>

</g>
