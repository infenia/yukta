<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 200" width="1010" height="200" role="img" aria-label="Run and node status only move forward: PENDING, QUEUED, RUNNING, then a terminal status.">
<title>Run and node status only move forward: PENDING, QUEUED, RUNNING, then a terminal status.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 2.88s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}13.67%{opacity:1}39.06%{opacity:1}53.12%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 2.88s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  29.69%{stroke-dashoffset:-100;opacity:1}29.70%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="1010" height="200" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="1010" height="200" fill="#FBFCFE"/><rect width="1010" height="200" fill="url(#dots)"/></g>
<g class="graph">
<path d="M230.0,88.0 C260.0,88.0 260.0,88.0 290.0,88.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:0.41s" d="M230.0,88.0 C260.0,88.0 260.0,88.0 290.0,88.0" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<path d="M490.0,88.0 C520.0,88.0 520.0,88.0 550.0,88.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:1.31s" d="M490.0,88.0 C520.0,88.0 520.0,88.0 550.0,88.0" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<path d="M750.0,88.0 C780.0,88.0 780.0,88.0 810.0,88.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/>
<g class="run" style="--at:0.00s"><rect x="30" y="50" width="200" height="76" rx="12" fill="#677895" opacity=".38" filter="url(#halo)"/><rect x="28.5" y="48.5" width="203" height="79" rx="13.5" fill="none" stroke="#677895" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="30" y="50" width="200" height="76" rx="12" fill="#677895"/><rect x="30" y="53" width="200" height="73" rx="12" fill="#DEE1E8"/><rect x="31" y="53" width="198" height="72" rx="11" fill="#FFFFFF"/></g><rect x="42" y="73.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(50 81.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></g><text x="85" y="85.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#11161F">PENDING</text><text x="85" y="103.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">created, not run</text>
<g class="run" style="--at:0.90s"><rect x="290" y="50" width="200" height="76" rx="12" fill="#677895" opacity=".38" filter="url(#halo)"/><rect x="288.5" y="48.5" width="203" height="79" rx="13.5" fill="none" stroke="#677895" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="290" y="50" width="200" height="76" rx="12" fill="#677895"/><rect x="290" y="53" width="200" height="73" rx="12" fill="#DEE1E8"/><rect x="291" y="53" width="198" height="72" rx="11" fill="#FFFFFF"/></g><rect x="302" y="73.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(310 81.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="2.6" rx="1"/><rect x="2" y="6.8" width="12" height="2.6" rx="1"/><rect x="2" y="10.6" width="7" height="2.6" rx="1"/></g><text x="345" y="85.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#11161F">QUEUED</text><text x="345" y="103.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">waiting for a slot</text>
<g class="live"><rect x="550" y="50" width="200" height="76" rx="12" fill="#DD5400" opacity=".38" filter="url(#halo)"/><rect x="548.5" y="48.5" width="203" height="79" rx="13.5" fill="none" stroke="#DD5400" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="550" y="50" width="200" height="76" rx="12" fill="#DD5400"/><rect x="550" y="53" width="200" height="73" rx="12" fill="#DEE1E8"/><rect x="551" y="53" width="198" height="72" rx="11" fill="#FFFFFF"/></g><rect x="562" y="73.5" width="32" height="32" rx="8" fill="#FBEAE0"/><g transform="translate(570 81.5)" color="#DD5400" fill="none" stroke="#DD5400" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.2 12.4 8 5 12.8z" fill="currentColor" stroke="none"/></g><text x="605" y="85.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#11161F">RUNNING</text><text x="605" y="103.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">first input arrived</text>
<g filter="url(#soft)"><rect x="810" y="50" width="170" height="76" rx="12" fill="#677895"/><rect x="810" y="53" width="170" height="73" rx="12" fill="#DEE1E8"/><rect x="811" y="53" width="168" height="72" rx="11" fill="#FFFFFF"/></g><rect x="822" y="73.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(830 81.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.2 8.2 7.2 10.2 10.8 6"/></g><text x="865" y="85.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Final status</text><text x="865" y="103.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">never reopens</text>

</g>
<rect x=".5" y=".5" width="1009" height="199" rx="13.5" fill="none" stroke="#DEE1E8"/>
</svg>
