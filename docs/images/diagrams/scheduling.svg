<g class="edge" style="--d:0.84s"><path id="p2" d="M590.0,168.0 C665.0,168.0 665.0,168.0 740.0,168.0" fill="none" stroke="#86B4FF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><path class="flow" d="M590.0,168.0 C665.0,168.0 665.0,168.0 740.0,168.0" fill="none" stroke="#86B4FF" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><g class="dot" opacity="0"><circle r="8" fill="#86B4FF" opacity=".55" filter="url(#blur-s)"/><circle r="3.6" fill="#fff"/><circle r="2.2" fill="#86B4FF"/><animateMotion dur="2.0s" begin="0.74s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 .05 .55 .95"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="2.0s" begin="0.74s" repeatCount="indefinite"/></g><g class="dot" opacity="0"><circle r="8" fill="#86B4FF" opacity=".55" filter="url(#blur-s)"/><circle r="3.6" fill="#fff"/><circle r="2.2" fill="#86B4FF"/><animateMotion dur="2.0s" begin="1.74s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 .05 .55 .95"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="2.0s" begin="1.74s" repeatCount="indefinite"/></g></g>
