<circle class="blob b2" cx="842.8" cy="283.8" r="217.8" fill="url(#blob-b)"/>
<circle class="blob" cx="490.0" cy="6.6000000000000005" r="112.2" fill="url(#blob-c)" opacity=".55"/>
<rect class="sheen" width="980" height="3.5" fill="url(#bar)"/>
</g>
