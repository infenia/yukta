<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="A workflow is started once and holds one open execution. SCHEDULE_TRIGGER emits a tick into it, and the nodes handle every tick as a message.">
<title>A workflow is started once and holds one open execution. SCHEDULE_TRIGGER emits a tick into it, and the nodes handle every tick as a message.</title>
<style>
.node{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.edge,.pill{opacity:0;animation:fade .9s ease forwards;animation-delay:var(--d,0s)}
@keyframes fade{to{opacity:1}}
.glow{opacity:.2;animation:breathe 5.2s ease-in-out infinite;animation-delay:var(--b,0s)}
@keyframes breathe{0%,100%{opacity:.14}50%{opacity:.72}}
.flow{stroke-dasharray:7 10;animation:flow 1.2s linear infinite}
.flow-ctl{stroke-dasharray:3 9;animation:flow-ctl 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-17}}
@keyframes flow-ctl{to{stroke-dashoffset:-12}}
.blob{animation:drift 16s ease-in-out infinite alternate}
.blob.b2{animation-duration:21s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(46px,28px)}}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .node,.edge,.pill{opacity:1!important}
  .glow{opacity:.35!important}
  .dot{display:none}
}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1226"/><stop offset="1" stop-color="#121B3B"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#F2641A"/><stop offset=".22" stop-color="#F2641A"/><stop offset=".22" stop-color="#2F6BFF"/><stop offset=".8" stop-color="#6FA2FF"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#8FA4D8" opacity=".16"/></pattern><radialGradient id="blob-a"><stop offset="0" stop-color="#2F6BFF" stop-opacity=".34"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient><radialGradient id="blob-b"><stop offset="0" stop-color="#F2641A" stop-opacity=".34"/><stop offset="1" stop-color="#F2641A" stop-opacity="0"/></radialGradient><radialGradient id="blob-c"><stop offset="0" stop-color="#2F6BFF" stop-opacity=".34"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient><clipPath id="card"><rect width="980" height="330" rx="24"/></clipPath><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><filter id="blur-s" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.2"/></filter><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".38"/></filter><linearGradient id="s-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86B4FF"/><stop offset="1" stop-color="#2F6BFF"/></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86B4FF" stop-opacity=".30"/><stop offset="1" stop-color="#2F6BFF" stop-opacity=".09"/></linearGradient><marker id="m-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 L3.8,6 z" fill="#86B4FF"/></marker><linearGradient id="s-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63EBF7"/><stop offset="1" stop-color="#0891B2"/></linearGradient><linearGradient id="g-cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63EBF7" stop-opacity=".30"/><stop offset="1" stop-color="#0891B2" stop-opacity=".09"/></linearGradient><marker id="m-cyan" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 L3.8,6 z" fill="#63EBF7"/></marker><linearGradient id="s-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB46B"/><stop offset="1" stop-color="#F2641A"/></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB46B" stop-opacity=".30"/><stop offset="1" stop-color="#F2641A" stop-opacity=".09"/></linearGradient><marker id="m-orange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 L3.8,6 z" fill="#FFB46B"/></marker><linearGradient id="s-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BCA3FF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BCA3FF" stop-opacity=".30"/><stop offset="1" stop-color="#7C3AED" stop-opacity=".09"/></linearGradient><marker id="m-violet" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 L3.8,6 z" fill="#BCA3FF"/></marker></defs>
