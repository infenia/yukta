<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 372" width="664" height="372" role="img" aria-label="Control commands reach a live run in order: pause and resume hold it with every time limit frozen, and a stop has three modes. DRAIN lets in-flight work finish, CANCEL cancels it and KILL ends the run at once.">
<title>Control commands reach a live run in order: pause and resume hold it with every time limit frozen, and a stop has three modes. DRAIN lets in-flight work finish, CANCEL cancels it and KILL ends the run at once.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 1.76s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}19.89%{opacity:1}56.82%{opacity:1}77.27%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 1.76s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  43.18%{stroke-dashoffset:-100;opacity:1}43.19%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2D333D" opacity="0.9"/></pattern><clipPath id="frame"><rect width="664" height="372" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.45"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#7F90AE"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#6FA2FF"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#FF6467"/></marker></defs>
<g clip-path="url(#frame)"><rect width="664" height="372" fill="#0A0D14"/><rect width="664" height="372" fill="url(#dots)"/></g>
<g class="graph">
<path d="M234.0,186.0 C297.0,186.0 297.0,58.0 360.0,58.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/>
<path d="M234.0,186.0 C297.0,186.0 297.0,144.0 360.0,144.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/>
<path d="M234.0,186.0 C297.0,186.0 297.0,230.0 360.0,230.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/>
<path d="M234.0,186.0 C297.0,186.0 297.0,316.0 360.0,316.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/>
<g class="live"><rect x="24" y="148" width="210" height="76" rx="12" fill="#6FA2FF" opacity=".38" filter="url(#halo)"/><rect x="22.5" y="146.5" width="213" height="79" rx="13.5" fill="none" stroke="#6FA2FF" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="24" y="148" width="210" height="76" rx="12" fill="#6FA2FF"/><rect x="24" y="151" width="210" height="73" rx="12" fill="#405C8F"/><rect x="25.5" y="151" width="207" height="71.5" rx="10.5" fill="#11161F"/></g><rect x="36" y="171.5" width="32" height="32" rx="8" fill="#202C43"/><g transform="translate(44 179.5)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.2 12.4 8 5 12.8z" fill="currentColor" stroke="none"/></g><text x="79" y="183.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9">a run</text><text x="79" y="201.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">commands in order</text>
<g filter="url(#soft)"><rect x="360" y="24" width="280" height="68" rx="12" fill="#8E9FBE"/><rect x="360" y="27" width="280" height="65" rx="12" fill="#505A6E"/><rect x="361.5" y="27" width="277" height="63.5" rx="10.5" fill="#11161F"/></g><rect x="372" y="43.5" width="32" height="32" rx="8" fill="#252C38"/><g transform="translate(380 51.5)" color="#8E9FBE" fill="none" stroke="#8E9FBE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></g><text x="415" y="55.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#F3F5F9">pause / resume</text><text x="415" y="73.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">time limits freeze</text>
<g filter="url(#soft)"><rect x="360" y="110" width="280" height="68" rx="12" fill="#8E9FBE"/><rect x="360" y="113" width="280" height="65" rx="12" fill="#505A6E"/><rect x="361.5" y="113" width="277" height="63.5" rx="10.5" fill="#11161F"/></g><rect x="372" y="129.5" width="32" height="32" rx="8" fill="#252C38"/><g transform="translate(380 137.5)" color="#8E9FBE" fill="none" stroke="#8E9FBE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8 13.2 3.8v4c0 3.2-2.2 5.3-5.2 6.4-3-1.1-5.2-3.2-5.2-6.4v-4z"/><path d="M5.8 8.2 7.4 9.8 10.4 6.6"/></g><text x="415" y="141.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#F3F5F9">stop DRAIN</text><text x="415" y="159.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">in-flight work finishes</text>
<g filter="url(#soft)"><rect x="360" y="196" width="280" height="68" rx="12" fill="#8E9FBE"/><rect x="360" y="199" width="280" height="65" rx="12" fill="#505A6E"/><rect x="361.5" y="199" width="277" height="63.5" rx="10.5" fill="#11161F"/></g><rect x="372" y="215.5" width="32" height="32" rx="8" fill="#252C38"/><g transform="translate(380 223.5)" color="#8E9FBE" fill="none" stroke="#8E9FBE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14V2.5M3.5 3h8.5l-1.8 3 1.8 3H3.5"/></g><text x="415" y="227.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#F3F5F9">stop CANCEL</text><text x="415" y="245.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">in-flight work cancelled</text>
<g filter="url(#soft)"><rect x="360" y="282" width="280" height="68" rx="12" fill="#8E9FBE"/><rect x="360" y="285" width="280" height="65" rx="12" fill="#505A6E"/><rect x="361.5" y="285" width="277" height="63.5" rx="10.5" fill="#11161F"/></g><rect x="372" y="301.5" width="32" height="32" rx="8" fill="#252C38"/><g transform="translate(380 309.5)" color="#8E9FBE" fill="none" stroke="#8E9FBE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 1.8 3.6 9h4.2l-1 5.2L12.4 7H8.2z" fill="currentColor" stroke="none"/></g><text x="415" y="313.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#F3F5F9">stop KILL</text><text x="415" y="331.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">ends the run at once</text>

</g>
