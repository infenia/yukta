<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="A staircase of three workflow steps, Run, Add AI and Ship, each one higher than the last, climbing to a finish flag.">
<title>A staircase of three workflow steps, Run, Add AI and Ship, each one higher than the last, climbing to a finish flag.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 3.36s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}10.42%{opacity:1}29.76%{opacity:1}40.48%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 3.36s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  22.62%{stroke-dashoffset:-100;opacity:1}22.63%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="480" height="270" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="480" height="270" fill="#FBFCFE"/><rect width="480" height="270" fill="url(#dots)"/></g>
<g class="graph"><rect x="26" y="198" width="120" height="58" rx="10" fill="#F8EBE5" stroke="#F0BC9D" stroke-dasharray="3 5"/><rect x="180" y="156" width="120" height="100" rx="10" fill="#F8EBE5" stroke="#F0BC9D" stroke-dasharray="3 5"/><rect x="334" y="114" width="120" height="142" rx="10" fill="#F8EBE5" stroke="#F0BC9D" stroke-dasharray="3 5"/>
<path d="M146.0,163.0 C176.0,163.0 150.0,121.0 180.0,121.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:0.36s" d="M146.0,163.0 C176.0,163.0 150.0,121.0 180.0,121.0" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<path d="M300.0,121.0 C330.0,121.0 304.0,79.0 334.0,79.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:1.16s" d="M300.0,121.0 C330.0,121.0 304.0,79.0 334.0,79.0" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<g class="run" style="--at:0.00s"><rect x="26" y="134" width="120" height="58" rx="12" fill="#DD5400" opacity=".38" filter="url(#halo)"/><rect x="24.5" y="132.5" width="123" height="61" rx="13.5" fill="none" stroke="#DD5400" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="26" y="134" width="120" height="58" rx="12" fill="#DD5400"/><rect x="26" y="137" width="120" height="55" rx="12" fill="#EEAA80"/><rect x="27.5" y="137" width="117" height="53.5" rx="10.5" fill="#FFFFFF"/></g><rect x="38" y="148.5" width="32" height="32" rx="8" fill="#FBEAE0"/><g transform="translate(46 156.5)" color="#DD5400" fill="none" stroke="#DD5400" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.2 12.4 8 5 12.8z" fill="currentColor" stroke="none"/></g><text x="81" y="169.3" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Run</text>
<g class="run" style="--at:0.80s"><rect x="180" y="92" width="120" height="58" rx="12" fill="#376EF4" opacity=".38" filter="url(#halo)"/><rect x="178.5" y="90.5" width="123" height="61" rx="13.5" fill="none" stroke="#376EF4" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="180" y="92" width="120" height="58" rx="12" fill="#376EF4"/><rect x="180" y="95" width="120" height="55" rx="12" fill="#9BB6FA"/><rect x="181.5" y="95" width="117" height="53.5" rx="10.5" fill="#FFFFFF"/></g><rect x="192" y="106.5" width="32" height="32" rx="8" fill="#E7EEFE"/><g transform="translate(200 114.5)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8c.5 3.4 1.8 4.7 5.2 5.2-3.4.5-4.7 1.8-5.2 5.2-.5-3.4-1.8-4.7-5.2-5.2 3.4-.5 4.7-1.8 5.2-5.2z"/><path d="M13 11.2v3M11.5 12.7h3"/></g><text x="235" y="127.3" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Add AI</text>
<g class="run" style="--at:1.60s"><rect x="334" y="50" width="120" height="58" rx="12" fill="#677895" opacity=".38" filter="url(#halo)"/><rect x="332.5" y="48.5" width="123" height="61" rx="13.5" fill="none" stroke="#677895" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="334" y="50" width="120" height="58" rx="12" fill="#677895"/><rect x="334" y="53" width="120" height="55" rx="12" fill="#B3BCCA"/><rect x="335.5" y="53" width="117" height="53.5" rx="10.5" fill="#FFFFFF"/></g><rect x="346" y="64.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(354 72.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14V2.5M3.5 3h8.5l-1.8 3 1.8 3H3.5"/></g><text x="389" y="85.3" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Ship</text>
<text x="86" y="238" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#E99766" text-anchor="middle">1</text><text x="240" y="196" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#E99766" text-anchor="middle">2</text><text x="394" y="154" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#E99766" text-anchor="middle">3</text>
</g>
<rect x=".5" y=".5" width="479" height="269" rx="13.5" fill="none" stroke="#DEE1E8"/>
</svg>
