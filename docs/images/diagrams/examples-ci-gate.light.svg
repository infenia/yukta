<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 330" width="1010" height="330" role="img" aria-label="A CI gate: a trigger starts a command, and the command&#x27;s exit code sends the run to a pass report or a fail report.">
<title>A CI gate: a trigger starts a command, and the command&#x27;s exit code sends the run to a pass report or a fail report.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 3.78s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}10.42%{opacity:1}29.76%{opacity:1}40.48%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 3.78s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  22.62%{stroke-dashoffset:-100;opacity:1}22.63%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="1010" height="330" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="1010" height="330" fill="#FBFCFE"/><rect width="1010" height="330" fill="url(#dots)"/></g>
<g class="graph">
<path d="M230.0,165.0 C280.0,165.0 280.0,165.0 330.0,165.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:0.41s" d="M230.0,165.0 C280.0,165.0 280.0,165.0 330.0,165.0" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<path d="M530.0,165.0 C615.0,165.0 615.0,78.0 700.0,78.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:1.31s" d="M530.0,165.0 C615.0,165.0 615.0,78.0 700.0,78.0" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<path d="M530.0,165.0 C615.0,165.0 615.0,252.0 700.0,252.0" fill="none" stroke="#E7000B" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" marker-end="url(#arrow-danger)"/><path class="pulse" style="--at:1.31s" d="M530.0,165.0 C615.0,165.0 615.0,252.0 700.0,252.0" pathLength="100" fill="none" stroke="#E7000B" stroke-width="3" stroke-linecap="round"/>
<g class="run" style="--at:0.00s"><rect x="30" y="127" width="200" height="76" rx="12" fill="#DD5400" opacity=".38" filter="url(#halo)"/><rect x="28.5" y="125.5" width="203" height="79" rx="13.5" fill="none" stroke="#DD5400" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="30" y="127" width="200" height="76" rx="12" fill="#DD5400"/><rect x="30" y="130" width="200" height="73" rx="12" fill="#EEAA80"/><rect x="31.5" y="130" width="197" height="71.5" rx="10.5" fill="#FFFFFF"/></g><rect x="42" y="150.5" width="32" height="32" rx="8" fill="#FBEAE0"/><g transform="translate(50 158.5)" color="#DD5400" fill="none" stroke="#DD5400" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 1.8 3.6 9h4.2l-1 5.2L12.4 7H8.2z" fill="currentColor" stroke="none"/></g><text x="85" y="162.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Trigger</text><text x="85" y="180.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">starts the run</text>
<g class="run" style="--at:0.90s"><rect x="330" y="127" width="200" height="76" rx="12" fill="#376EF4" opacity=".38" filter="url(#halo)"/><rect x="328.5" y="125.5" width="203" height="79" rx="13.5" fill="none" stroke="#376EF4" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="330" y="127" width="200" height="76" rx="12" fill="#376EF4"/><rect x="330" y="130" width="200" height="73" rx="12" fill="#9BB6FA"/><rect x="331.5" y="130" width="197" height="71.5" rx="10.5" fill="#FFFFFF"/></g><rect x="342" y="150.5" width="32" height="32" rx="8" fill="#E7EEFE"/><g transform="translate(350 158.5)" color="#376EF4" fill="none" stroke="#376EF4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.6"/><path d="M4.6 6.2 6.8 8l-2.2 1.8M8.4 10h3"/></g><text x="385" y="162.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Run command</text><text x="385" y="180.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">build and test</text>
<g class="run" style="--at:1.80s"><rect x="700" y="40" width="280" height="76" rx="12" fill="#677895" opacity=".38" filter="url(#halo)"/><rect x="698.5" y="38.5" width="283" height="79" rx="13.5" fill="none" stroke="#677895" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="700" y="40" width="280" height="76" rx="12" fill="#677895"/><rect x="700" y="43" width="280" height="73" rx="12" fill="#B3BCCA"/><rect x="701.5" y="43" width="277" height="71.5" rx="10.5" fill="#FFFFFF"/></g><rect x="712" y="63.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(720 71.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.2 8.2 7.2 10.2 10.8 6"/></g><text x="755" y="75.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Pass report</text><text x="755" y="93.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">release can go ahead</text>
<g filter="url(#soft)"><rect x="700" y="214" width="280" height="76" rx="12" fill="#677895"/><rect x="700" y="217" width="280" height="73" rx="12" fill="#B3BCCA"/><rect x="701.5" y="217" width="277" height="71.5" rx="10.5" fill="#FFFFFF"/></g><rect x="712" y="237.5" width="32" height="32" rx="8" fill="#EDEFF2"/><g transform="translate(720 245.5)" color="#677895" fill="none" stroke="#677895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14V2.5M3.5 3h8.5l-1.8 3 1.8 3H3.5"/></g><text x="755" y="249.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F">Fail report</text><text x="755" y="267.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#545E6F">pipeline stops here</text>
<rect x="580.9" y="109.5" width="68.2" height="24" rx="12" fill="#FBFCFE" stroke="#DEE1E8"/><text x="615.0" y="126.1" text-anchor="middle" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#545E6F">success</text>
<rect x="580.9" y="196.5" width="68.2" height="24" rx="12" fill="#FBFCFE" stroke="#F4A4A9"/><text x="615.0" y="213.1" text-anchor="middle" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E7000B">failure</text>
<rect x="22" y="303" width="10" height="10" rx="3" fill="#DD5400"/><text x="38" y="312.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#545E6F">Trigger</text><rect x="112.23" y="303" width="10" height="10" rx="3" fill="#376EF4"/><text x="128.23000000000002" y="312.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#545E6F">Processor</text><rect x="216.24" y="303" width="10" height="10" rx="3" fill="#677895"/><text x="232.24" y="312.5" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#545E6F">Terminal</text>
</g>
<rect x=".5" y=".5" width="1009" height="329" rx="13.5" fill="none" stroke="#DEE1E8"/>
</svg>
