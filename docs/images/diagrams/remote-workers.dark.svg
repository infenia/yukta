<g class="run" style="--at:0.90s"><rect x="690" y="214" width="240" height="76" rx="12" fill="#8E9FBE" opacity=".38" filter="url(#halo)"/><rect x="688.5" y="212.5" width="243" height="79" rx="13.5" fill="none" stroke="#8E9FBE" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="690" y="214" width="240" height="76" rx="12" fill="#8E9FBE"/><rect x="690" y="217" width="240" height="73" rx="12" fill="#2D333D"/><rect x="691" y="217" width="238" height="72" rx="11" fill="#11161F"/></g><rect x="702" y="237.5" width="32" height="32" rx="8" fill="#252C38"/><g transform="translate(710 245.5)" color="#8E9FBE" fill="none" stroke="#8E9FBE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="2.5" width="11.6" height="4.4" rx="1.2"/><rect x="2.2" y="9.1" width="11.6" height="4.4" rx="1.2"/><circle cx="5" cy="4.7" r=".7" fill="currentColor"/><circle cx="5" cy="11.3" r=".7" fill="currentColor"/></g><text x="745" y="249.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9">Worker B</text><text x="745" y="267.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">pool default</text>
<rect x="390.8" y="56.2" width="178.5" height="24" rx="12" fill="#0A0D14" stroke="#2D333D"/><text x="480.0" y="72.8" text-anchor="middle" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#9AA5B8">one channel per attempt</text>
<rect x="397.7" y="125.0" width="164.7" height="24" rx="12" fill="#0A0D14" stroke="#2D333D"/><text x="480.0" y="141.6" text-anchor="middle" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#9AA5B8">register, renew lease</text>

</g>
