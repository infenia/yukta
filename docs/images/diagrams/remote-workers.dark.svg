<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="The control plane opens one channel per attempt to each worker. Workers register and renew their lease with the control plane.">
<title>The control plane opens one channel per attempt to each worker. Workers register and renew their lease with the control plane.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 2.88s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}13.67%{opacity:1}39.06%{opacity:1}53.12%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 2.88s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  29.69%{stroke-dashoffset:-100;opacity:1}29.70%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2D333D" opacity="0.9"/></pattern><clipPath id="frame"><rect width="960" height="330" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.45"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#7F90AE"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#6FA2FF"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#FF6467"/></marker></defs>
<g clip-path="url(#frame)"><rect width="960" height="330" fill="#0A0D14"/><rect width="960" height="330" fill="url(#dots)"/></g>
<g class="graph">
<path d="M270.0,105.5 C480.0,105.5 480.0,59.0 690.0,59.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:0.41s" d="M270.0,105.5 C480.0,105.5 480.0,59.0 690.0,59.0" pathLength="100" fill="none" stroke="#6FA2FF" stroke-width="3" stroke-linecap="round"/>
<path d="M690.0,100.8 C480.0,100.8 480.0,141.2 270.0,141.2" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/>
<path d="M270.0,224.5 C480.0,224.5 480.0,271.0 690.0,271.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:0.41s" d="M270.0,224.5 C480.0,224.5 480.0,271.0 690.0,271.0" pathLength="100" fill="none" stroke="#6FA2FF" stroke-width="3" stroke-linecap="round"/>
<path d="M690.0,233.0 C480.0,233.0 480.0,188.8 270.0,188.8" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/>
<g class="run" style="--at:0.00s"><rect x="30" y="80" width="240" height="170" rx="12" fill="#6FA2FF" opacity=".38" filter="url(#halo)"/><rect x="28.5" y="78.5" width="243" height="173" rx="13.5" fill="none" stroke="#6FA2FF" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="30" y="80" width="240" height="170" rx="12" fill="#6FA2FF"/><rect x="30" y="83" width="240" height="167" rx="12" fill="#2D333D"/><rect x="31" y="83" width="238" height="166" rx="11" fill="#11161F"/></g><rect x="42" y="150.5" width="32" height="32" rx="8" fill="#202C43"/><g transform="translate(50 158.5)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h10M3 8h10M3 12h10"/><circle cx="6" cy="4" r="1.5" fill="currentColor"/><circle cx="10.5" cy="8" r="1.5" fill="currentColor"/><circle cx="5" cy="12" r="1.5" fill="currentColor"/></g><text x="85" y="162.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9">Control plane</text><text x="85" y="180.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">admits and tracks runs</text>
