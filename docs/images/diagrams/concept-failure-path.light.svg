<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 290" width="590" height="290" role="img" aria-label="A failing step first retries; when retries run out, you choose to route the message to the error port, fail the node, or drop the message.">
<title>A failing step first retries; when retries run out, you choose to route the message to the error port, fail the node, or drop the message.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 3.36s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}10.42%{opacity:1}29.76%{opacity:1}40.48%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 3.36s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  22.62%{stroke-dashoffset:-100;opacity:1}22.63%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
