<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="A trigger feeds a fast node, which feeds a slow node and another fast node. The slow node paces the fast node and the trigger.">
<title>A trigger feeds a fast node, which feeds a slow node and another fast node. The slow node paces the fast node and the trigger.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 3.78s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}10.42%{opacity:1}29.76%{opacity:1}40.48%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 3.78s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  22.62%{stroke-dashoffset:-100;opacity:1}22.63%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2D333D" opacity="0.9"/></pattern><clipPath id="frame"><rect width="960" height="380" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.45"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#7F90AE"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#6FA2FF"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#FF6467"/></marker></defs>
<g clip-path="url(#frame)"><rect width="960" height="380" fill="#0A0D14"/><rect width="960" height="380" fill="url(#dots)"/></g>
<g class="graph">
<path d="M230.0,228.0 C265.0,228.0 265.0,228.0 300.0,228.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:0.41s" d="M230.0,228.0 C265.0,228.0 265.0,228.0 300.0,228.0" pathLength="100" fill="none" stroke="#6FA2FF" stroke-width="3" stroke-linecap="round"/>
<path d="M500.0,228.0 C570.0,228.0 570.0,138.0 640.0,138.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:1.31s" d="M500.0,228.0 C570.0,228.0 570.0,138.0 640.0,138.0" pathLength="100" fill="none" stroke="#6FA2FF" stroke-width="3" stroke-linecap="round"/>
<path d="M500.0,228.0 C570.0,228.0 570.0,308.0 640.0,308.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/><path class="pulse" style="--at:1.31s" d="M500.0,228.0 C570.0,228.0 570.0,308.0 640.0,308.0" pathLength="100" fill="none" stroke="#6FA2FF" stroke-width="3" stroke-linecap="round"/>
<path d="M745.0,100.0 C745.0,22.0 400.0,112.0 400.0,190.0" fill="none" stroke="#7F90AE" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" stroke-dasharray="5 5" class="march" marker-end="url(#arrow-outline)"/>
<g class="run" style="--at:0.00s"><rect x="30" y="190" width="200" height="76" rx="12" fill="#FC8C45" opacity=".38" filter="url(#halo)"/><rect x="28.5" y="188.5" width="203" height="79" rx="13.5" fill="none" stroke="#FC8C45" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="30" y="190" width="200" height="76" rx="12" fill="#FC8C45"/><rect x="30" y="193" width="200" height="73" rx="12" fill="#2D333D"/><rect x="31" y="193" width="198" height="72" rx="11" fill="#11161F"/></g><rect x="42" y="213.5" width="32" height="32" rx="8" fill="#372925"/><g transform="translate(50 221.5)" color="#FC8C45" fill="none" stroke="#FC8C45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 1.8 3.6 9h4.2l-1 5.2L12.4 7H8.2z" fill="currentColor" stroke="none"/></g><text x="85" y="225.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9">Trigger</text><text x="85" y="243.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">emits messages</text>
<g class="run" style="--at:0.90s"><rect x="300" y="190" width="200" height="76" rx="12" fill="#6FA2FF" opacity=".38" filter="url(#halo)"/><rect x="298.5" y="188.5" width="203" height="79" rx="13.5" fill="none" stroke="#6FA2FF" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="300" y="190" width="200" height="76" rx="12" fill="#6FA2FF"/><rect x="300" y="193" width="200" height="73" rx="12" fill="#2D333D"/><rect x="301" y="193" width="198" height="72" rx="11" fill="#11161F"/></g><rect x="312" y="213.5" width="32" height="32" rx="8" fill="#202C43"/><g transform="translate(320 221.5)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h3l6 7h3M2 11.5h3l1.6-1.9M9.4 6.4 11 4.5h3M12 2.8l2 1.7-2 1.7M12 9.8l2 1.7-2 1.7"/></g><text x="355" y="225.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9">Fast node</text><text x="355" y="243.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">waits when full</text>
<g class="run" style="--at:1.80s"><rect x="640" y="100" width="210" height="76" rx="12" fill="#6FA2FF" opacity=".38" filter="url(#halo)"/><rect x="638.5" y="98.5" width="213" height="79" rx="13.5" fill="none" stroke="#6FA2FF" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="640" y="100" width="210" height="76" rx="12" fill="#6FA2FF"/><rect x="640" y="103" width="210" height="73" rx="12" fill="#2D333D"/><rect x="641" y="103" width="208" height="72" rx="11" fill="#11161F"/></g><rect x="652" y="123.5" width="32" height="32" rx="8" fill="#202C43"/><g transform="translate(660 131.5)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></g><text x="695" y="135.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9">Slow node</text><text x="695" y="153.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">takes its time</text>
<g class="run" style="--at:1.80s"><rect x="640" y="270" width="210" height="76" rx="12" fill="#6FA2FF" opacity=".38" filter="url(#halo)"/><rect x="638.5" y="268.5" width="213" height="79" rx="13.5" fill="none" stroke="#6FA2FF" stroke-width="1.5"/></g><g filter="url(#soft)"><rect x="640" y="270" width="210" height="76" rx="12" fill="#6FA2FF"/><rect x="640" y="273" width="210" height="73" rx="12" fill="#2D333D"/><rect x="641" y="273" width="208" height="72" rx="11" fill="#11161F"/></g><rect x="652" y="293.5" width="32" height="32" rx="8" fill="#202C43"/><g transform="translate(660 301.5)" color="#6FA2FF" fill="none" stroke="#6FA2FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h3l6 7h3M2 11.5h3l1.6-1.9M9.4 6.4 11 4.5h3M12 2.8l2 1.7-2 1.7M12 9.8l2 1.7-2 1.7"/></g><text x="695" y="305.8" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F3F5F9">Fast node</text><text x="695" y="323.6" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA5B8">keeps up</text>
