<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="You sit before the first run and again at the end: you ask, the assistant drafts, you review, the assistant runs it and reads the result. A failed run loops back to drafting.">
<title>You sit before the first run and again at the end: you ask, the assistant drafts, you review, the assistant runs it and reads the result. A failed run loops back to drafting.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 5.76s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}6.08%{opacity:1}17.36%{opacity:1}23.61%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 5.76s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  13.19%{stroke-dashoffset:-100;opacity:1}13.20%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
