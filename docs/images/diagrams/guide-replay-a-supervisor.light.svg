<path d="M214.0,245.0 C305.0,245.0 396.0,292.0 396.0,201.0" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#arrow-outline)"/>
