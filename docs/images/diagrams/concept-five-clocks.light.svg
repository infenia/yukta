<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="580" height="270" role="img" aria-label="Five clocks measure different spans of one run: queue wait before it starts, the run deadline over all of it, a node deadline, a node idle clock that restarts on activity, and an element timeout for one attempt.">
<title>Five clocks measure different spans of one run: queue wait before it starts, the run deadline over all of it, a node deadline, a node idle clock that restarts on activity, and an element timeout for one attempt.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 1.76s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}19.89%{opacity:1}56.82%{opacity:1}77.27%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 1.76s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  43.18%{stroke-dashoffset:-100;opacity:1}43.19%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8" opacity="1.0"/></pattern><clipPath id="frame"><rect width="580" height="270" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.1"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker></defs>
<g clip-path="url(#frame)"><rect width="580" height="270" fill="#FBFCFE"/><rect width="580" height="270" fill="url(#dots)"/></g>
<g class="graph"><g filter="url(#soft)"><rect x="12" y="12" width="556" height="246" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/></g><text x="28" y="51" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Queue wait</text><rect x="176" y="30" width="60" height="28" rx="8" fill="#E7E9EE" stroke="#A4AEBF"/><text x="244" y="50" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#545E6F" text-anchor="start">waits for a slot</text><text x="28" y="91" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Run deadline</text><rect x="236" y="70" width="312" height="28" rx="8" fill="#FAE4D6" stroke="#EB9866"/><text x="248" y="90" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#DD5400" text-anchor="start">the whole run, never resets</text><text x="28" y="131" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Node deadline</text><rect x="286" y="110" width="230" height="28" rx="8" fill="#DFE8FD" stroke="#87A8F8"/><text x="298" y="130" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#376EF4" text-anchor="start">first activity to the end</text><text x="28" y="171" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Node idle</text><rect x="326" y="150" width="190" height="28" rx="8" fill="#DFE8FD" stroke="#87A8F8"/><text x="360" y="170" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#376EF4" text-anchor="start">resets on activity</text><text x="28" y="211" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#11161F" text-anchor="start">Element timeout</text><rect x="376" y="190" width="90" height="28" rx="8" fill="#DFE8FD" stroke="#87A8F8"/><text x="474" y="210" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#545E6F" text-anchor="start">one attempt</text><path d="M176 232H548" stroke="#677895" stroke-width="1.5" marker-end="url(#arrow-outline)"/><text x="176" y="252" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#545E6F" text-anchor="start">time</text>
<g transform="translate(334 158) scale(1.0)" color="#DD5400" fill="none" stroke="#DD5400" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8.5h3l1.6-4 2.8 8 1.8-4h3.8"/></g>
</g>
<rect x=".5" y=".5" width="579" height="269" rx="13.5" fill="none" stroke="#DEE1E8"/>
</svg>
