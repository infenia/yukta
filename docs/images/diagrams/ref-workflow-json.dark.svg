<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="In a workflow&#x27;s JSON, each entry of nodes becomes a node of the graph and each entry of edges becomes a line between two nodes; an edge with sourcePort error carries the failures of its source.">
<title>In a workflow&#x27;s JSON, each entry of nodes becomes a node of the graph and each entry of edges becomes a line between two nodes; an edge with sourcePort error carries the failures of its source.</title>
<style>
.graph{animation:graph-in .45s ease-out both}
@keyframes graph-in{from{opacity:0}}
.run{opacity:0;animation:run 3.36s ease-in-out infinite;animation-delay:var(--at)}
@keyframes run{0%{opacity:0}10.42%{opacity:1}29.76%{opacity:1}40.48%,100%{opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;
  animation:pulse 3.36s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}2%{opacity:1}
  22.62%{stroke-dashoffset:-100;opacity:1}22.63%,100%{stroke-dashoffset:-100;opacity:0}}
.march{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
  .graph,.run,.live,.pulse,.march{animation:none}
  .run,.pulse{opacity:0}
  .live{opacity:.7}
}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2D333D" opacity="0.9"/></pattern><clipPath id="frame"><rect width="960" height="480" rx="14"/></clipPath><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#11161F" flood-opacity="0.45"/></filter><filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#7F90AE"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#6FA2FF"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#FF6467"/></marker></defs>
