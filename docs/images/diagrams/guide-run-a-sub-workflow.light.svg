<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 380" width="790" height="380" role="img" aria-label="The SUB_WORKFLOW node run-check starts the child workflow check and reads the outcome of the terminal the child reached. With routeByOutcome the parent leaves on success or failure.">
