<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" width="620" height="270" role="img" aria-label="Start from the task: an exact rule uses a deterministic node, choosing among known options uses a decision node, an open task uses an AI step, and anything from the last two that is hard to undo goes to a person.">
