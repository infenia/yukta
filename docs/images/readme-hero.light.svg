<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 370" width="1280" height="370" role="img" aria-label="Yukta: workflows you can trust and control">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DEE1E8" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.3" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="m"><rect width="1280" height="370" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1280" height="370" fill="#FBFCFE"/>
  <g mask="url(#m)">
    <rect width="1280" height="370" fill="url(#grid)" opacity="0.8"/>
    <rect width="1280" height="370" fill="url(#glow)"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="140" font-size="64" font-weight="600" fill="#11161F" letter-spacing="-1.8">Workflows you can trust and control.</text>
    <text x="640" y="212" font-size="25" fill="#545E6F">Write a job down once as a flowchart. Yukta runs every step as written,</text>
    <text x="640" y="250" font-size="25" fill="#545E6F">whether it is a script, a rule or an AI model, and lets you pause,</text>
    <text x="640" y="288" font-size="25" fill="#545E6F">steer or hand control to a supervisor while it runs.</text>
  </g>
</svg>
