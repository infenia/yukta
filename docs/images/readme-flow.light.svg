<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" role="img" aria-label="A workflow: a trigger starts the run, a rule validates it, an AI model classifies it, a person or supervisor approves it, and a script deploys it. Invalid or rejected runs end at Reject.">
<title>A workflow: a trigger starts the run, a rule validates it, an AI model classifies it, a person or supervisor approves it, and a script deploys it. Invalid or rejected runs end at Reject.</title>
<style>
.graph{animation:in .45s ease-out both}@keyframes in{from{opacity:0}}
.lit{opacity:0;animation:lit 8.0s ease-in-out infinite;animation-delay:var(--at)}

.pulse{stroke-dasharray:14 400;stroke-dashoffset:14;opacity:0;animation:pulse 8.0s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--at)}
@keyframes pulse{0%{stroke-dashoffset:14;opacity:0}1%{opacity:1}10.0%{stroke-dashoffset:-100;opacity:1}10.01%,100%{stroke-dashoffset:-100;opacity:0}}
.live{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.graph,.lit,.pulse,.live{animation:none}.lit,.pulse{opacity:0}.live{opacity:.8}}
.l0{animation-name:lit0}@keyframes lit0{0%{opacity:0}3%{opacity:1}8.25%{opacity:1}11.25%,100%{opacity:0}}
.l1{animation-name:lit1}@keyframes lit1{0%{opacity:0}3%{opacity:1}8.25%{opacity:1}11.25%,100%{opacity:0}}
.l2{animation-name:lit2}@keyframes lit2{0%{opacity:0}3%{opacity:1}9.5%{opacity:1}12.5%,100%{opacity:0}}
.l3{animation-name:lit3}@keyframes lit3{0%{opacity:0}3%{opacity:1}24.5%{opacity:1}27.5%,100%{opacity:0}}
.l4{animation-name:lit4}@keyframes lit4{0%{opacity:0}3%{opacity:1}9.5%{opacity:1}12.5%,100%{opacity:0}}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DEE1E8"/></pattern><clipPath id="frame"><rect width="1180" height="300" rx="14"/></clipPath><filter id="halo" x="-30%" y="-40%" width="160%" height="190%"><feGaussianBlur stdDeviation="6"/></filter>
<marker id="a-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#677895"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#376EF4"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9,5 L1,8.6 z" fill="#E7000B"/></marker>
</defs>
<g clip-path="url(#frame)"><rect width="1180" height="300" fill="#FBFCFE"/><rect width="1180" height="300" fill="url(#dots)"/></g>
<g class="graph" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<path d="M210,96.0 H280" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity=".75" stroke-linecap="round" marker-end="url(#a-edge)"/>
<path class="pulse" style="--at:0.5s" d="M210,96.0 H280" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<path d="M440,96.0 H510" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity=".75" stroke-linecap="round" marker-end="url(#a-edge)"/>
<path class="pulse" style="--at:1.7s" d="M440,96.0 H510" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<path d="M670,96.0 H740" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity=".75" stroke-linecap="round" marker-end="url(#a-edge)"/>
<path class="pulse" style="--at:3.2s" d="M670,96.0 H740" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<path d="M900,96.0 H970" fill="none" stroke="#677895" stroke-width="1.5" stroke-opacity=".75" stroke-linecap="round" marker-end="url(#a-edge)"/>
<path class="pulse" style="--at:5.7s" d="M900,96.0 H970" pathLength="100" fill="none" stroke="#376EF4" stroke-width="3" stroke-linecap="round"/>
<text x="475.0" y="87.0" font-size="12" text-anchor="middle" fill="#545E6F">valid</text>
<text x="935.0" y="87.0" font-size="12" text-anchor="middle" fill="#545E6F">approved</text>
<path d="M360.0,132 V198 Q360.0,210 372.0,210 H510" fill="none" stroke="#E7000B" stroke-width="1.5" stroke-opacity=".8" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#a-red)"/>
<path d="M820.0,132 V198 Q820.0,210 808.0,210 H670" fill="none" stroke="#E7000B" stroke-width="1.5" stroke-opacity=".8" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#a-red)"/>
<text x="382.0" y="202" font-size="12" fill="#545E6F">invalid</text>
<text x="798.0" y="202" font-size="12" text-anchor="end" fill="#545E6F">rejected</text>
<rect x="50" y="60" width="160" height="72" rx="12" fill="#FFFFFF" stroke="#DEE1E8" stroke-width="1"/><rect x="64" y="78" width="4" height="24" rx="2" fill="#677895"/><text x="80" y="93" font-size="18" font-weight="600" fill="#11161F">Trigger</text><text x="80" y="113" font-size="13" fill="#545E6F" >starts the run</text>
<g class="lit l0" style="--at:0.0s"><rect x="50" y="60" width="160" height="72" rx="12" fill="#376EF4" opacity=".35" filter="url(#halo)"/><rect x="50" y="60" width="160" height="72" rx="12" fill="none" stroke="#376EF4" stroke-width="2"/></g>
<rect x="280" y="60" width="160" height="72" rx="12" fill="#FFFFFF" stroke="#DEE1E8" stroke-width="1"/><rect x="294" y="78" width="4" height="24" rx="2" fill="#677895"/><text x="310" y="93" font-size="18" font-weight="600" fill="#11161F">Validate</text><text x="310" y="113" font-size="13" fill="#545E6F" >rule</text>
<g class="lit l1" style="--at:1.2s"><rect x="280" y="60" width="160" height="72" rx="12" fill="#376EF4" opacity=".35" filter="url(#halo)"/><rect x="280" y="60" width="160" height="72" rx="12" fill="none" stroke="#376EF4" stroke-width="2"/></g>
<rect x="510" y="60" width="160" height="72" rx="12" fill="#FFFFFF" stroke="#376EF4" stroke-width="1.5"/><rect x="524" y="78" width="4" height="24" rx="2" fill="#376EF4"/><text x="540" y="93" font-size="18" font-weight="600" fill="#11161F">Classify</text><text x="540" y="113" font-size="13" fill="#545E6F" >AI model</text>
<g class="lit l2" style="--at:2.4s"><rect x="510" y="60" width="160" height="72" rx="12" fill="#376EF4" opacity=".35" filter="url(#halo)"/><rect x="510" y="60" width="160" height="72" rx="12" fill="none" stroke="#376EF4" stroke-width="2"/></g>
<rect x="740" y="60" width="160" height="72" rx="12" fill="#FFFFFF" stroke="#DD5400" stroke-width="1.5"/><rect x="754" y="78" width="4" height="24" rx="2" fill="#DD5400"/><text x="770" y="93" font-size="18" font-weight="600" fill="#11161F">Approval</text><text x="770" y="113" font-size="13" fill="#545E6F" >person or supervisor</text>
<g class="lit l3" style="--at:3.9s"><rect x="740" y="60" width="160" height="72" rx="12" fill="#E85D0C" opacity=".35" filter="url(#halo)"/><rect x="740" y="60" width="160" height="72" rx="12" fill="none" stroke="#E85D0C" stroke-width="2"/></g>
<rect x="970" y="60" width="160" height="72" rx="12" fill="#FFFFFF" stroke="#DEE1E8" stroke-width="1"/><rect x="984" y="78" width="4" height="24" rx="2" fill="#677895"/><text x="1000" y="93" font-size="18" font-weight="600" fill="#11161F">Deploy</text><text x="1000" y="113" font-size="13" fill="#545E6F" >script</text>
<g class="lit l4" style="--at:6.4s"><rect x="970" y="60" width="160" height="72" rx="12" fill="#376EF4" opacity=".35" filter="url(#halo)"/><rect x="970" y="60" width="160" height="72" rx="12" fill="none" stroke="#376EF4" stroke-width="2"/></g>
<circle class="live" cx="884" cy="76" r="4" fill="#DD5400"/>
<rect x="510" y="188" width="160" height="44" rx="12" fill="#FFFFFF" stroke="#DEE1E8"/><rect x="524" y="198" width="4" height="24" rx="2" fill="#E7000B"/><text x="540" y="216" font-size="16" font-weight="600" fill="#11161F">Reject</text><text x="656" y="216" font-size="12" text-anchor="end" fill="#545E6F">recorded</text>
<rect x="50" y="263" width="4" height="12" rx="2" fill="#677895"/><text x="62" y="273" font-size="13" fill="#545E6F">deterministic step</text>
<rect x="240" y="263" width="4" height="12" rx="2" fill="#376EF4"/><text x="252" y="273" font-size="13" fill="#545E6F">AI step, proposes</text>
<rect x="430" y="263" width="4" height="12" rx="2" fill="#DD5400"/><text x="442" y="273" font-size="13" fill="#545E6F">person or supervisor decides</text>
</g></svg>