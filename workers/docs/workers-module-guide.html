<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta workers Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>

  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>

</nav>

<script>
var DATA = {"module": "workers", "title": "How Yukta remote workers work, and where they can break", "htmlTitle": "Yukta workers Guide", "date": "2026-10-15", "glance": {"lede": "A Yukta server normally runs every node of a workflow itself. The optional <b>workers<\/b> module lets a processor node run on another machine instead: the node's config says which pool of workers may run it, workers connect out to the server and register, and each node attempt travels over one RSocket stream. The server keeps the graph, the policies and the checkpoints; only the plugin call moves. This page is for thinking about it: open a component, play a scenario, then challenge the weak spots.", "props": [["Workers call in", "A worker connects out to the control plane and registers with a shared token. It needs no open port, so it can sit behind a firewall."], ["One stream per attempt", "A node attempt is one bidirectional RSocket channel: input flows to the worker, output and heartbeats flow back, and a stop on the server cancels the worker's pipeline."], ["Same policies as local", "Retries, onError, timeouts, pause and checkpoints wrap the remote call exactly as they wrap a local plugin, so a placed node behaves like a local one."], ["Trust is thin by default", "The default transport is plain TCP with one shared token. Mutual TLS exists but is optional, and what crosses the wire includes node config and message payloads."]], "start": [["primer", "Primer", "The problem, the vocabulary and one node attempt followed across the wire"], ["map", "System map", "Eleven components on the control plane and on the worker"], ["map", "Replay a situation", "Five scenarios: a placed node, a dead worker, a graceful stop, a failover, a stranger registering"], ["guarantees", "What carries over", "What a placed node keeps from a local one, and what it loses"], ["reference", "Settings and frames", "Every setting on each side; the frames and what they mean"], ["quality", "Stress it", "Scalability, performance, availability, security lenses"], ["board", "Challenge it", "Open risks, an impact x effort grid, your own notes"], ["adrs", "Decisions", "Seven ADRs, each with a 'revisit when' trigger"]]}, "primer": {"problem": "Some nodes are heavy or risky: they start programs, call models, run scripts or query databases. If they all run inside the one server that also holds the workflow engine, a busy node slows everything, a crashing node can take the server with it, and the machine has to be big. The workers module moves such a node onto another machine. The difficult part is keeping everything else the same: back-pressure, retries, timeouts, pause and stop must work as if the node were local, and a worker that dies in the middle must not hang the run.", "analogy": "Think of a head office that plans jobs and keeps the books, and branch offices that do the heavy work. Branches phone in to say they are open and what they can do; head office sends a job and its inputs down the open line and gets results back piece by piece. If a branch goes quiet, head office notices and gives the job to another branch.", "layersTitle": "Where workers sits", "layers": [["Clients", "REST (GET /api/workers), web UI, workflows with engine.placement", ""], ["core", "Engine, WorkerRegistry, RemoteNodes and RemoteProcessor, leader election", ""], ["workers", "RSocket server and client, the node channel, drain. This page.", "me"], ["plugin-api + plugins", "The processors that run on a worker", ""], ["RSocket / Netty", "Transport, back-pressure, TLS", ""]], "layersNote": "The module depends on core and plugin-api. Core defines the RemoteNodeExecutor interface; this module implements it. Core also holds the registry and the placement logic, so part of the story is in core.", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["Control plane", "The Yukta server that holds the graph, the policies and the checkpoints, and accepts workers.", "The normal server, started with a token."], ["Worker", "A Yukta process that connects to a control plane and runs processor nodes for it.", "One with plugin-types HTTP_REQUEST and capacity 4."], ["Pool", "A label on workers. A node asks for a pool, and only workers in that pool may run it.", "gpu, default."], ["Placement", "The node option <code>engine.placement {pool}<\/code> that sends the node to a worker.", "A PROCESS_EXECUTOR node placed in pool build."], ["Lease", "A claim on being alive that a worker renews every few seconds; if it lapses the worker disappears from the registry.", "15 seconds, renewed every 5."], ["Slot", "One node attempt a worker can run at once. Capacity is the number of slots.", "Capacity 4 means four at a time."], ["Frame", "One message on the wire: a check-in, a lease, or a piece of a node attempt.", "START, MESSAGE, COMPLETE."], ["Drain", "A worker stops taking new work and waits for running work to finish before it closes.", "Sent as a lease with draining true."]], "ex": {"title": "One node attempt, from check-in to a lost worker", "lede": "A worker checks in, a placed node is sent to it, results come back, and then the worker dies in the middle of the next attempt. Click a step to see what happens, why, and what can go wrong.", "viewBox": "0 0 880 230", "labels": ["What happens", "Why it works this way", "Can go wrong"], "legend": "Blue = this module · Grey = core · Green = the worker's plugin", "nodes": [{"id": "register", "n": "Check in", "s": "REGISTER", "k": "p", "x": 10, "y": 40, "does": "The worker's agent connects to the control plane and sends <code>REGISTER<\/code> with the token, its id, pools, plugin types and capacity. The session handler checks the token, stores the connection and answers <code>ACK<\/code>.", "adds": "The worker connects out, so it needs no open port. The token keeps strangers from registering.", "wrong": "With the default plain TCP the token and everything that follows can be read on the network. The token is shared by all workers, so any holder can register under any id."}, {"id": "lease", "n": "Stay alive", "s": "LEASE", "k": "p", "x": 190, "y": 40, "does": "Every 5 s the agent sends <code>LEASE<\/code> with the number of running nodes and a draining flag. The registry renews the lease (15 s) and answers <code>ACK<\/code>.", "adds": "A worker that dies without saying so is removed after one lease, so nothing is sent to it for long.", "wrong": "The control plane answers a lease without checking that it is still the leader, so a control plane that lost the lease but is alive keeps its workers."}, {"id": "pick", "n": "Choose a worker", "s": "pick()", "k": "e", "x": 370, "y": 40, "does": "For an attempt of a placed node, <code>pick<\/code> keeps workers of the node's pool that run the plugin type, are not draining and have a free slot, and takes the one with most free slots.", "adds": "Work goes where there is room, and only to workers that declared the plugin type.", "wrong": "The choice and the counter increment are separate steps, so two attempts chosen together can both take the last slot; the worker does not enforce its capacity."}, {"id": "send", "n": "Send the job", "s": "START + MESSAGE", "k": "p", "x": 550, "y": 40, "does": "The control plane opens a <code>node.run<\/code> channel on the worker's connection and sends <code>START<\/code> (execution id, node id, plugin type and the node config), then the input messages as JSON, then <code>COMPLETE<\/code>.", "adds": "One stream per attempt keeps back-pressure and cancellation working end to end.", "wrong": "The node config goes on the wire as written, including any literal secret in it. Payloads become plain JSON, so Java types are lost, and there is no size limit."}, {"id": "run", "n": "Worker runs it", "s": "NodeRunner", "k": "t", "x": 730, "y": 40, "does": "The runner checks the plugin type is allowed and a processor, calls <code>initialize<\/code>, <code>prepare<\/code> and <code>process<\/code> on the incoming messages, and sends each output message as a <code>MESSAGE<\/code> frame, <code>HEARTBEAT<\/code> frames when the plugin beats, then <code>COMPLETE<\/code>.", "adds": "The plugin runs exactly as it would locally, with the execution id, node id and heartbeat in the Reactor context.", "wrong": "The live log sink and the trace context are not passed, so process output is not streamed live and spans do not join the run's trace."}, {"id": "lost", "n": "Worker dies", "s": "connection closes", "k": "t", "x": 730, "y": 150, "does": "The worker process is killed while an attempt is running. The connection closes, and the control plane's channel fails with a transport error.", "adds": "The error becomes <code>Lost worker X during the attempt<\/code>, a failure the engine's retry policy can retry.", "wrong": "The effect the plugin already had on the outside world (a request sent, a file written) is not undone, so a retry can repeat it. Plugins must be idempotent on the message id."}, {"id": "retry", "n": "Retry elsewhere", "s": "next attempt", "k": "e", "x": 550, "y": 150, "does": "The retry policy runs the attempt again. The dead worker's lease has not yet lapsed, but its connection is gone, so <code>pick<\/code> finds no connection for it and chooses another worker.", "adds": "A worker failure becomes a delay, not a failed run, as long as another worker in the pool has room.", "wrong": "If no other worker qualifies, the retry fails at once with 'No connected worker', which is retried again with the node's backoff until the policy gives up."}], "edges": [["register", "lease"], ["lease", "pick"], ["pick", "send"], ["send", "run"], ["run", "lost"], ["lost", "retry"]], "start": "register", "json": {"title": "See the frames", "note": "Simplified: field names are the real record components; most are omitted when empty.", "text": "worker -> control plane   (route worker.session)\n  REGISTER {token, workerId:\"w1\", pools:[\"default\"],\n            pluginTypes:[\"HTTP_REQUEST\"], capacity:4}\n  <- ACK\n  LEASE {usedSlots:1, draining:false}   every 5 s\n  <- ACK\n\ncontrol plane -> worker   (route node.run, one channel per attempt)\n  START {executionId, nodeId, pluginType:\"HTTP_REQUEST\", config:{...}}\n  MESSAGE {message:{id, payload, metadata, ...}}\n  COMPLETE\n  <- MESSAGE {message:{...}}   HEARTBEAT   COMPLETE | ERROR {errorClass, errorMessage}"}}, "wrapper": {"title": "What happens around a placed node attempt", "lede": "Everything outside the plugin call is the same as for a local node.", "steps": ["Engine policies start the attempt (retry, timeout, onError)", "RemoteProcessor asks pick() for a worker", "One node.run channel carries input out and output back", "The worker runs the plugin and sends heartbeats", "Errors come back as a class name and message; a lost connection is a lost worker"]}, "story": {"title": "A worker's day in plain words", "steps": [["Starts", "reads its settings, connects out and checks in with the token."], ["Waits", "renews its lease every few seconds and reports how many nodes it is running."], ["Is chosen", "receives a job description and the input messages down the open line."], ["Works", "runs the plugin, sending results and heartbeats back as they appear."], ["Is stopped", "tells the control plane to send no more work, finishes what it has, then closes."], ["Is lost", "if it dies, the control plane sees the line close and the engine retries elsewhere."]]}, "paths": [["New to the module", "Primer, then the System map and the Placed node scenario, then Settings and frames in Reference.", "primer"], ["Deploying workers", "Reference (settings and the do/don't list), then Guarantees, then Risks (transport and identity).", "reference"], ["Planning high availability", "System map (Failover & drain), the Failover scenario, then Risks (deposed leader, reconnect pause).", "board"]]}, "plain": {"conf": ["The sign on the door. A few settings decide whether this server is the head office that hands out work, or a branch office that takes it.", "One jar can be either, so the operator chooses by configuration instead of installing different software."], "reg": ["The reception desk of the head office. It checks the visitor's pass, writes the name on the roster, and keeps ticking it off as long as the visitor keeps checking in.", "The head office must know which branch offices are open and how busy they are, and must not trust a stranger."], "agent": ["The branch office's phone. It calls head office, says who it is, checks in every few seconds, and redials if the line drops. Before closing it tells head office to send no more work.", "Branch offices sit behind firewalls and cannot be called; they have to call out."], "trans": ["The phone line itself, either an ordinary line or a scrambled one where both ends show an ID card.", "Work and data travel on it, so the line decides who can listen in or pretend to be head office."], "pick": ["The dispatcher. For each job it looks at the roster and sends it to the branch that can do that kind of work and has the most free desks.", "Jobs should go where there is room, and a job that needs a special skill must go to a branch that has it."], "exec": ["The courier on the head-office side. It carries the job and its inputs to the branch, brings the results back one by one, and tells the foreman if the branch goes silent.", "The rest of the engine does not need to know that the work happened somewhere else."], "runner": ["The worker at the branch. It takes the job, does it with the tools it owns, and hands each result back as it is ready.", "The branch runs only what it is set up for, and does the job the same way head office would."], "frames": ["The forms used on the line. A short one for checking in, and another for handing over a job and its results.", "Both sides must read the forms the same way or the work goes wrong silently."], "ha": ["The plan for when head office changes hands, and for when a branch closes for the evening.", "Work should neither be lost when a head office fails nor be cut off when a branch is stopped on purpose."], "tests": ["Dress rehearsals with a real head office and real branches, including pulling the plug on one.", "Network code that is not tested with real connections tends to fail the first time a connection breaks."], "native": ["A faster-starting, smaller version of the program, built ahead of time for one purpose.", "Branches are often small machines, so a small binary is attractive; this path is not proven yet."]}, "comps": [{"id": "conf", "name": "Roles & auto-configuration", "tag": "control plane or worker", "c": 0, "r": 0, "resp": "Decides from properties whether this server accepts workers (control plane) or is one (worker), and switches the matching beans on.", "how": ["With <code>yukta.workers.token<\/code> set and <code>yukta.workers.control-plane<\/code> empty, the server is a <b>control plane<\/b>: it gets the session handler, the connection map, the node executor and the <code>worker.session<\/code> controller. It also needs <code>spring.rsocket.server.port<\/code> for the RSocket server to listen.", "With <code>yukta.workers.control-plane<\/code> set (one or more <code>host:port<\/code>, comma separated), the server is a <b>worker<\/b>: it gets the <code>NodeRunner<\/code> and the <code>WorkerAgent<\/code>, which connects out. Setting both makes it a worker only. A worker without a token fails at start.", "Worker settings: <code>id<\/code>, <code>pools<\/code> (default <code>default<\/code>), <code>plugin-types<\/code> (default empty, so it runs nothing), <code>capacity<\/code> (4), <code>lease<\/code> (15 s), <code>drain-timeout<\/code> (30 s) and <code>ssl-bundle<\/code>.", "The package is <code>com.infenia.workers<\/code>, outside the application's component scan (<code>com.infenia.yukta<\/code>) on purpose: its two controllers would otherwise be scanned without their properties. The module is only on the classpath with <code>-Pyukta.workers=true<\/code>.", "The auto-configuration registers reflection hints for the two frame records and <code>DefaultMessage<\/code> for the native image."], "guar": "A control plane never runs nodes for itself through this module; a worker never accepts workers.", "state": "None. Beans are created once.", "ceil": "Role and settings are fixed at start (and, in a native image, at build time).", "fail": "A missing property gives a start-up error (token) or a silently inactive role (no port, empty plugin types).", "set": ["yukta.workers.token", "yukta.workers.control-plane", "yukta.workers.id", "yukta.workers.pools", "yukta.workers.plugin-types", "yukta.workers.capacity", "spring.rsocket.server.port"], "risks": ["nativeUnverified"]}, {"id": "reg", "name": "Registration & leases", "tag": "WorkerSessionHandler", "c": 1, "r": 0, "resp": "Accepts or refuses a worker, keeps its lease alive, and removes it when it goes.", "how": ["A worker opens one channel on the route <code>worker.session<\/code> and its first frame must be <code>REGISTER<\/code> with the shared token. The handler refuses (REJECT, then the stream ends) when the first frame is something else, when this server is not the leader, when the token differs (compared in constant time), or when the registry refuses (blank id, capacity below 1).", "On success the handler stores the worker's connection, answers <code>ACK<\/code>, and then answers every <code>LEASE<\/code> frame: <code>ACK<\/code> if core's <code>WorkerRegistry<\/code> still knows the worker and renews its lease, <code>REJECT<\/code> ('lease expired, register again') if not. Any other frame is rejected.", "When the stream ends, the handler removes the connection and the registry entry, but only the ones this registration made (compared by the registration time), so a worker that registered again is not removed by its own old stream.", "Core's <code>WorkerRegistry<\/code> keeps each worker's pools, plugin types, capacity, used slots, draining flag and lease end; a lease lasts 15 s and expired workers vanish from <code>list()<\/code>. It feeds <code>GET /api/workers<\/code> and the gauges <code>yukta.workers<\/code> and <code>yukta.worker.slots<\/code>.", "The leader check happens only at registration. A <code>LEASE<\/code> frame is answered without asking whether this server is still the leader."], "guar": "A worker is listed only while its lease is fresh; a refused worker is told why.", "state": "In memory: the registry map and the connection map. Nothing is persisted.", "ceil": "The registry is a map scanned and pruned on every <code>list()<\/code>; fine for tens of workers.", "fail": "A lost lease makes the next lease frame a REJECT, which makes the agent reconnect.", "set": ["yukta.workers.lease", "yukta.workers.token"], "risks": ["deposedKeepsWorkers", "sharedTokenIdentity"]}, {"id": "agent", "name": "Worker agent", "tag": "WorkerAgent", "c": 2, "r": 0, "resp": "Runs on a worker: connects out to the control plane, registers, renews its lease and reconnects when the connection is lost.", "how": ["It tries the configured addresses in turn, one per attempt. The first frame is <code>REGISTER<\/code> (token, id, pools, plugin types, capacity); then a <code>LEASE<\/code> frame every third of the lease (5 s) carrying the number of nodes running and whether it is draining.", "When the connection ends or the control plane answers REJECT, the agent logs a warning and reconnects with an exponential pause from 1 s to 30 s, for ever. The retry does not say that failures are 'transient', so the count is not reset after a long healthy connection; the pause reaches its maximum after a few reconnects and stays there (by Reactor's rules; not measured).", "Each reconnect calls <code>connect<\/code> again and remembers only the latest connection, so a connection that ended with a REJECT is not closed by the agent.", "<code>stop()<\/code> drains first: it sends a lease with <code>draining=true<\/code> at once, polls every 50 ms until no node is running or <code>drain-timeout<\/code> (30 s) has passed, and then disposes the connection. Attempts still running then fail on the control plane as a lost worker.", "The agent is a Spring bean with <code>initMethod=start<\/code> and <code>destroyMethod=stop<\/code>, so draining runs during application shutdown and delays it by up to the drain timeout."], "guar": "A worker that loses its control plane keeps trying to reach one; a stopping worker stops taking new work before it closes.", "state": "In memory: the current connection, the draining flag and a sink for urgent frames.", "ceil": "One lease frame per 5 s per worker.", "fail": "Connection loss is retried; a REJECT is treated like a loss; there is no give-up.", "set": ["yukta.workers.control-plane", "yukta.workers.lease", "yukta.workers.drain-timeout"], "risks": ["reconnectBackoff", "staleConnections"]}, {"id": "trans", "name": "Transport & TLS", "tag": "RSocket over TCP or TLS", "c": 3, "r": 0, "resp": "Opens the RSocket connection from the worker to the control plane, plain or with mutual TLS.", "how": ["Without <code>yukta.workers.ssl-bundle<\/code> the worker uses plain TCP. With a bundle it builds a Netty TLS client from the bundle's key manager (its certificate) and trust manager, and verifies the control plane's host name against the certificate.", "On the control plane, TLS is switched on with Spring's own RSocket server settings (<code>spring.rsocket.server.ssl.bundle<\/code> and <code>client-auth=need<\/code> for mutual TLS). The shared token is still checked in the REGISTER frame.", "The connection is established by the worker, so workers need no open inbound port. The control plane later sends node work down the same connection (it calls <code>node.run<\/code> on the worker's own responder).", "<code>WorkerConnections<\/code> maps a worker id to its connection on the control plane."], "guar": "With TLS and a trusted certificate the worker registers; an untrusted certificate or none does not (tested with certificates made by keytool).", "state": "In memory: the connection map.", "ceil": "One connection per worker; node attempts are channels on it.", "fail": "A TLS failure is a connection failure, so the agent retries with its pause.", "set": ["yukta.workers.ssl-bundle", "spring.rsocket.server.ssl.bundle"], "risks": ["plainTokenDefault", "payloadAsJson"]}, {"id": "pick", "name": "Placement & selection", "tag": "RemoteNodes, pick()", "c": 0, "r": 1, "resp": "Turns <code>engine.placement<\/code> on a node into a call to a worker, and chooses which worker.", "how": ["When a workflow is prepared, <code>RemoteNodes<\/code> replaces the plugin of a node that has <code>engine.placement<\/code> with a <code>RemoteProcessor<\/code>. The local plugin still supplies type, schema, timeouts and validation. Placement is refused on anything that is not a processor and on SESSION_MEMORY, KV_STORE, WAIT_FOR_SIGNAL and SUB_WORKFLOW (a fixed list), and fails to prepare when the workers module is not built in.", "For each attempt <code>pick<\/code> keeps the workers in the node's pool that list the plugin type, are not draining and have a free slot, and takes the one with most free slots (the smallest id on a tie). Free slots are the worker's capacity minus the larger of the used slots from its last lease and the attempts this control plane has sent to it.", "If no worker qualifies the attempt fails at once with a <code>WorkflowExecutionException<\/code> that the engine's retry policy can retry.", "The choice and the counter increment are two steps, not one atomic step."], "guar": "A node is sent only to a worker that declared the plugin type and had a free slot at the time of the choice.", "state": "In memory: the in-flight counter per worker.", "ceil": "The choice reads the registry list and sorts it for every attempt.", "fail": "No worker means an immediate, retryable failure; nothing queues.", "set": ["engine.placement"], "risks": ["capacityRace", "statefulPlacement"]}, {"id": "exec", "name": "Control-plane executor", "tag": "WorkerNodeExecutor", "c": 1, "r": 1, "resp": "Runs one node attempt on the chosen worker and splices the worker's output back into the node's stream.", "how": ["It opens one RSocket <code>requestChannel<\/code> on the route <code>node.run<\/code> over the worker's own connection and sends <code>START<\/code> (execution id, node id, plugin type, node config), then each input message as a <code>MESSAGE<\/code> frame, then <code>COMPLETE<\/code>.", "Frames coming back are handled one by one: <code>MESSAGE<\/code> becomes a message again, <code>HEARTBEAT<\/code> calls the node's heartbeat (so the idle clock restarts), <code>COMPLETE<\/code> ends the stream, <code>ERROR<\/code> becomes an exception.", "Back-pressure and cancellation are RSocket's: the control plane's demand limits the worker, and a stop or timeout on the control plane cancels the channel so the worker disposes the plugin pipeline.", "An error frame whose class is <code>IllegalArgumentException<\/code> becomes an <code>IllegalArgumentException<\/code> (bad input, never retried). Any other class becomes a <code>WorkflowExecutionException<\/code> whose text names the worker, the class and the message. An error that is not one of those two types and not from a frame (the connection closing) becomes 'Lost worker X during the attempt', which the engine can retry.", "Messages are converted to and from plain JSON maps with the application's <code>ObjectMapper<\/code>."], "guar": "Retries, onError, timeouts, pause and checkpoints keep working because they wrap this call exactly as they wrap a local plugin.", "state": "In memory: the in-flight counter per worker.", "ceil": "The control plane sees every message in both directions (it is a data hop).", "fail": "A lost worker mid-attempt is a retryable failure and the retry can land on another worker (tested, also with SIGKILL).", "set": [], "risks": ["abortLostAcrossWire", "payloadAsJson", "noTraceContext"]}, {"id": "runner", "name": "Node runner", "tag": "NodeRunner", "c": 2, "r": 1, "resp": "Runs on a worker: receives a node attempt, runs the local plugin on the incoming messages and sends the output back.", "how": ["It is a Spring <code>@Controller<\/code> with the route <code>node.run<\/code>. The first frame must be <code>START<\/code>; the plugin type must be in <code>yukta.workers.plugin-types<\/code> and must be a processor, else an <code>IllegalArgumentException<\/code> error frame comes back.", "For each attempt it calls the plugin's <code>initialize<\/code> and <code>prepare<\/code> with the node config, then <code>process<\/code> on the incoming messages. It puts the execution id, node id and a heartbeat callback into the Reactor context, as the local assembler does. It does not put the log sink or the run's trace into the context.", "Output messages go back as <code>MESSAGE<\/code> frames, then <code>COMPLETE<\/code>; any error becomes one <code>ERROR<\/code> frame with the class name and message. Plugin heartbeats become <code>HEARTBEAT<\/code> frames.", "A counter of running attempts feeds the lease frames and the drain. The runner itself enforces no capacity: it runs whatever the control plane sends."], "guar": "A worker runs only the plugin types it was started with, and only processors.", "state": "In memory: the count of running attempts.", "ceil": "Initialise and prepare run again for every attempt (a message, with per-message policies).", "fail": "Any plugin error ends the attempt with an error frame; nothing is retried on the worker.", "set": ["yukta.workers.plugin-types", "yukta.workers.capacity"], "risks": ["liveLogsLost", "perAttemptInit", "budgetPerJvm"]}, {"id": "frames", "name": "Wire frames", "tag": "WorkerFrame, NodeFrame", "c": 3, "r": 1, "resp": "Defines what crosses the wire: two small record types, one for the worker session and one for a node attempt.", "how": ["<code>WorkerFrame<\/code> has the types REGISTER, LEASE, ACK and REJECT and fields for token, worker id, pools, plugin types, capacity, used slots, draining and a message.", "<code>NodeFrame<\/code> has the kinds START, MESSAGE, HEARTBEAT, COMPLETE and ERROR and fields for execution id, node id, plugin type, config, message (a JSON map), error class and error message.", "Both are serialised as JSON by Spring's RSocket codecs. Neither carries a version. The design document also planned a SIGNAL frame, trace context, an attempt number and deadlines in START; none of these exists.", "The records, and <code>DefaultMessage<\/code>, are registered for reflection so a native image can read them."], "guar": "A frame is a plain value; once built it is not changed.", "state": "None.", "ceil": "Messages are not size-limited by the module.", "fail": "A control plane and a worker built from different versions must still agree on these two records; nothing checks it.", "set": [], "risks": ["wireVersion", "noTraceContext"]}, {"id": "ha", "name": "Failover & drain", "tag": "standbys, graceful stop", "c": 0, "r": 2, "resp": "Keeps workers attached to the right control plane and lets a worker leave without cutting off running nodes.", "how": ["With several control planes (a leader and standbys), a standby answers REGISTER with <code>REJECT 'this server is not the leader'<\/code>; the agent tries the next address after its pause, so a worker ends up on the leader and finds the new one after a failover.", "When the leader process dies, its connections close; the workers' agents reconnect (see the backoff risk) and the new leader registers them.", "When a worker is stopped it drains (stops taking work, waits for running nodes up to the drain timeout), and the control plane skips draining workers when it picks.", "A control plane that lost the lease but is still running keeps the workers it already has: it checks leadership only when a worker registers."], "guar": "A worker never gets new work after it started draining; a control plane that is a standby never registers workers.", "state": "In memory on both sides.", "ceil": "Failover takes at least the lease of the control plane plus the workers' pause.", "fail": "See the Failover and Drain scenarios.", "set": ["yukta.workers.drain-timeout", "yukta.ha.mode"], "risks": ["deposedKeepsWorkers", "reconnectBackoff"]}, {"id": "tests", "name": "Tests", "tag": "real control plane and worker", "c": 1, "r": 2, "resp": "Shows the behaviour with a real control plane and real workers, not mocks.", "how": ["Most tests start a control plane and a worker as two Spring applications in one JVM and talk over a real RSocket connection: remote node execution, lost worker, drain, follow-the-leader and the transport.", "<code>WorkersTlsTest<\/code> makes certificates with keytool and checks that a trusted worker registers and an untrusted one, or one with no certificate, does not.", "<code>ChaosTest<\/code> starts workers as separate JVMs (<code>WorkerMain<\/code>) and kills one with SIGKILL during an attempt: the attempt fails retryably and the retry runs on the other worker.", "The boot module has acceptance tests for the control plane and the worker module, run with <code>-Pyukta.workers=true<\/code>."], "guar": "The failure cases that matter (lost worker, kill -9, drain, standby) are tested.", "state": "Ports and processes started per test.", "ceil": "Not tested: a deposed leader that stays alive, a very large message, a version mismatch, a native image.", "fail": "Tests need free local ports and, for chaos, the ability to start a JVM.", "set": [], "risks": ["wireVersion", "deposedKeepsWorkers"]}, {"id": "native", "name": "Native image", "tag": "GraalVM roles", "c": 2, "r": 2, "resp": "Makes the control plane and the worker usable as native binaries.", "how": ["Spring decides property-conditioned beans when a native image is built, so a native image has to be built as the role it will have: <code>-Pyukta.workers=true -Pyukta.workers.native=control-plane<\/code> or <code>worker<\/code>. The real token, address and id are read when it starts.", "A native image built without that switch starts but takes no workers.", "Status in the module's notes: both roles build and start, and a control plane reports no workers; a native worker did not register because the frame records had no reflection hints. The hints are added but not yet verified in a native image, because the rebuild was stopped for lack of memory."], "guar": "A JVM build is the verified path; the native path is not yet verified end to end.", "state": "None.", "ceil": "A native image is fixed to one role.", "fail": "A native worker may start and not register.", "set": [], "risks": ["nativeUnverified"]}], "edges": [["conf", "reg", "ctrl", "control plane"], ["conf", "agent", "ctrl", "worker"], ["conf", "runner", "ctrl", "worker"], ["conf", "exec", "ctrl", "control plane"], ["agent", "trans", "data", "connects"], ["trans", "reg", "data", "REGISTER, LEASE"], ["reg", "pick", "data", "registry"], ["pick", "exec", "data", "chosen worker"], ["exec", "runner", "data", "node.run channel"], ["frames", "exec", "ctrl", "format"], ["frames", "runner", "ctrl", "format"], ["ha", "agent", "ctrl", "drain, reconnect"], ["ha", "reg", "ctrl", "leader check"], ["tests", "ha", "ctrl", "chaos, drain"], ["native", "conf", "ctrl", "role at build"]], "scen": [{"id": "placed", "name": "A placed node runs", "steps": [{"t": "A worker joins", "d": "The agent connects, sends REGISTER and then a LEASE every 5 s. The registry lists the worker with its pools, plugin types, capacity and used slots (<code>GET /api/workers<\/code>).", "c": ["agent", "trans", "reg"], "r": ["plainTokenDefault"]}, {"t": "The workflow is prepared", "d": "A node has <code>engine.placement {pool}<\/code>. Core replaces its plugin with a <code>RemoteProcessor<\/code>; preparing fails if the workers module is not built in, or if the node is SESSION_MEMORY, KV_STORE, WAIT_FOR_SIGNAL or SUB_WORKFLOW.", "c": ["conf", "pick"], "r": ["statefulPlacement"]}, {"t": "An attempt starts", "d": "The engine's policy starts an attempt. <code>pick<\/code> takes the worker with most free slots; the executor opens <code>node.run<\/code> and sends START with the node config, then the input messages.", "c": ["pick", "exec", "frames"], "r": ["capacityRace", "payloadAsJson"]}, {"t": "The worker runs the plugin", "d": "The runner initialises and prepares the plugin for this attempt, processes the input, and sends back each output message. Heartbeats restart the node's idle clock on the control plane.", "c": ["runner"], "r": ["perAttemptInit", "liveLogsLost", "budgetPerJvm"]}, {"t": "It ends", "d": "COMPLETE ends the stream and the node continues as a local one would: checkpoints are recorded on the control plane, the status is emitted there.", "c": ["exec"], "r": ["noTraceContext"]}]}, {"id": "lost", "name": "A worker dies mid-attempt", "steps": [{"t": "The process is killed", "d": "A worker is killed with SIGKILL during an attempt. The TCP connection closes.", "c": ["runner", "trans"], "r": []}, {"t": "The channel fails", "d": "The control plane's channel ends with a transport error. The executor turns it into <code>Lost worker X during the attempt<\/code> (a <code>WorkflowExecutionException<\/code>).", "c": ["exec"], "r": []}, {"t": "The engine retries", "d": "The node's retry policy runs the attempt again. <code>pick<\/code> no longer finds the dead worker's connection and chooses another worker of the pool. This is tested with workers in separate JVMs.", "c": ["pick", "exec"], "r": []}, {"t": "Side effects", "d": "What the plugin did before the kill (a request sent, a file written) is not undone. Execution is at-least-once; the message id and the <code>attempt<\/code> header let a plugin de-duplicate.", "c": ["runner"], "r": ["abortLostAcrossWire"]}]}, {"id": "drain", "name": "A worker is stopped on purpose", "steps": [{"t": "Stop is requested", "d": "The application shuts down; the agent's <code>stop()<\/code> sends a LEASE with <code>draining=true<\/code> at once.", "c": ["agent"], "r": []}, {"t": "No new work", "d": "The control plane marks the worker as draining and <code>pick<\/code> skips it. Nodes already running continue.", "c": ["reg", "pick"], "r": []}, {"t": "Wait for the work", "d": "The agent polls every 50 ms until no node runs or 30 s have passed. Spring's shutdown waits for it.", "c": ["agent", "ha"], "r": []}, {"t": "Close", "d": "The agent disposes its connection. Attempts still running after the timeout fail on the control plane as a lost worker and are retried.", "c": ["agent", "exec"], "r": ["reconnectBackoff"]}]}, {"id": "failover", "name": "The control plane changes leader", "steps": [{"t": "Several addresses", "d": "Workers are configured with the addresses of the leader and its standbys. A standby answers REGISTER with REJECT 'this server is not the leader'.", "c": ["conf", "reg"], "r": []}, {"t": "The leader process dies", "d": "Its connections close. Each agent logs a warning and reconnects, trying the next address on each attempt, with a pause that grows to 30 s.", "c": ["agent", "ha"], "r": ["reconnectBackoff"]}, {"t": "The new leader registers them", "d": "The standby that took the lease accepts REGISTER and lists the workers. Placed nodes can run again; attempts that were in flight failed as lost workers and are retried.", "c": ["reg", "pick"], "r": []}, {"t": "A leader that is only deposed", "d": "If the old leader lost its lease but is still running (a network split to the database), its connections stay open and it keeps answering LEASE with ACK. The workers never move, while the new leader has none.", "c": ["reg", "ha"], "r": ["deposedKeepsWorkers"]}]}, {"id": "stranger", "name": "A stranger tries to register", "steps": [{"t": "A wrong token", "d": "A client connects and sends REGISTER with a wrong token. The handler logs 'bad token', answers REJECT 'token refused' and the stream ends.", "c": ["reg"], "r": []}, {"t": "The right token, any identity", "d": "Anyone who holds the shared token can register under any worker id, pool and plugin types, and a registration with an existing id replaces the entry of that worker.", "c": ["reg"], "r": ["sharedTokenIdentity"]}, {"t": "Then the jobs arrive", "d": "The control plane sends such a worker START frames with node configs and input messages for the plugin types it claimed.", "c": ["exec", "frames"], "r": ["plainTokenDefault"]}, {"t": "With mutual TLS", "d": "If both sides use SSL bundles with client authentication, a client without a trusted certificate cannot connect at all; the token is still required.", "c": ["trans"], "r": []}]}], "intro": {"placed": "A placed processor node from workflow preparation to its last output message.", "lost": "What the control plane and the engine do when a worker disappears in the middle of an attempt.", "drain": "How a worker leaves without cutting off the nodes it is running.", "failover": "How workers find the new leader, and the case where they do not.", "stranger": "Who may register, what a registered worker can see, and what mutual TLS adds."}, "caps": [["Scale-out", "Placement by pool", "A processor node can run on a worker of a named pool.", "<code>engine.placement {pool}<\/code> replaces the plugin with a RemoteProcessor.", "Heavy nodes leave the control plane's JVM.", "Only processors; four types are refused."], ["Scale-out", "Free-slot selection", "Work goes to the worker with most free slots that has the plugin type.", "Capacity minus the larger of reported and sent attempts.", "Even load across a pool.", "Not atomic with the increment."], ["Scale-out", "Plugin allow-list per worker", "A worker runs only the types it was started with.", "<code>yukta.workers.plugin-types<\/code>, checked in the runner.", "A compromised control plane cannot make a worker run PROCESS_EXECUTOR.", "Empty list means the worker runs nothing."], ["Streaming", "End-to-end back-pressure", "A slow consumer slows the worker, and a stop cancels it.", "One RSocket channel per attempt.", "Memory stays bounded on both sides.", "The control plane carries all data."], ["Streaming", "Heartbeats", "A long-running plugin keeps its node alive.", "HEARTBEAT frames call the node's heartbeat on the control plane.", "The idle timeout works as for a local node.", "Only when the plugin beats."], ["Registry", "Leases", "Workers that go silent are removed after 15 s.", "LEASE frames every 5 s; list() prunes expired entries.", "Nothing is sent to a dead worker for long.", "Memory only."], ["Registry", "Visibility", "The list of workers with their load.", "<code>GET /api/workers<\/code>, gauges <code>yukta.workers<\/code> and <code>yukta.worker.slots<\/code>.", "Operators see capacity.", "No per-worker history."], ["Failure", "Lost worker is retryable", "A worker dying mid-attempt fails the attempt in a way the engine retries.", "Transport errors become a WorkflowExecutionException.", "The retry can land on another worker.", "At-least-once: the effect may repeat."], ["Failure", "Graceful drain", "A stopping worker finishes its running nodes first.", "Lease with draining true; poll until idle or timeout.", "A rolling restart does not cut off nodes.", "Delays shutdown by up to 30 s."], ["Security", "Token and mutual TLS", "Only holders of the token (and, with TLS, a trusted certificate) can register.", "Constant-time token compare; SSL bundle with client auth.", "Strangers are refused.", "One shared token; TLS is optional."], ["High availability", "Follows the leader", "Workers find the new control plane leader.", "Several addresses; a standby answers REJECT.", "A failover needs no operator.", "Pause up to 30 s; a deposed leader keeps its workers."], ["Packaging", "One jar, two roles", "The same build is a control plane or a worker.", "Properties choose the role; native images fix it at build time.", "No separate worker artifact.", "Native path not verified."]], "guar": {"title": "What carries over from a local node, and what does not", "lede": "A placed node is wrapped by the same engine policies as a local one; these tables say where that holds and where it stops.", "tables": [{"title": "Semantics of a placed node", "head": ["Concern", "Behaviour"], "rows": [["Back-pressure", ["ok", "RSocket request-n credit in both directions."]], ["Cancel and stop", ["ok", "A cancel on the control plane cancels the channel; the worker disposes the plugin pipeline."]], ["Idle timeout", ["ok", "Worker heartbeats restart the node's idle clock; a silent worker times out like a silent plugin."]], ["Retry, onError, failure budget", ["ok", "They wrap the remote call; a lost worker is retryable."]], ["Pause, skip, breakpoints", ["ok", "Valves run on the control plane before and after the stream."]], ["Checkpoints and resume", ["ok", "Messages pass through the control plane, so they are recorded as for a local node."]], ["Side effects", ["part", "At-least-once. An attempt may run twice if a worker dies after the effect and before COMPLETE."]], ["Error type and class", ["part", "Only IllegalArgumentException is rebuilt as itself. Every other class becomes a WorkflowExecutionException with the class in its text, so class-based retry rules and the hard-stop abort do not see the original."]], ["Payload types", ["part", "Messages cross as plain JSON values; Java types are lost."]], ["Live logs and traces", ["lost", "The log sink and the run's trace are not passed to the worker."]], ["Run budgets and rate limits", ["part", "Counted in the worker's JVM, not for the run as a whole."]]]}, {"title": "What can run on a worker", "head": ["Plugin kind", "Placed?"], "rows": [["Processors such as PROCESS_EXECUTOR, HTTP_REQUEST, SQL_QUERY, LLM_CALL, MCP_TOOL_CALL, MAPPER", ["ok", "Yes, if the worker lists the type."]], ["SESSION_MEMORY, KV_STORE, WAIT_FOR_SIGNAL, SUB_WORKFLOW", ["lost", "Refused: they keep state on the control plane."]], ["Triggers and terminals", ["lost", "Not placeable: always local."]], ["Processors that keep per-node state in memory (ANOMALY, DEDUPE windows, MCP sessions)", ["part", "Allowed, but the state lives on whichever worker ran the attempt."]]]}, {"title": "Limits and defaults", "head": ["Item", "Value"], "rows": [["Lease / renewal", "15 s (<code>yukta.workers.lease<\/code>) / every third of it"], ["Capacity", "4 slots (<code>yukta.workers.capacity<\/code>)"], ["Pools", "<code>default<\/code> (<code>yukta.workers.pools<\/code>)"], ["Plugin types", "none: a worker with an empty list runs nothing"], ["Drain timeout", "30 s"], ["Reconnect pause", "1 s growing to 30 s, no give-up"], ["Message size", "no limit set by the module"], ["Transport", "plain TCP unless <code>yukta.workers.ssl-bundle<\/code> is set"]]}]}, "ref": [{"id": "settings", "title": "Settings on each side", "lede": "A server is a control plane when it has a token and no control-plane address; a worker when it has a control-plane address.", "head": ["Property", "Side", "Meaning", "Default"], "rows": [["yukta.workers.token", "both", "Shared secret checked in REGISTER (constant time)", "none (required)"], ["spring.rsocket.server.port", "control plane", "Port the RSocket server listens on", "none"], ["spring.rsocket.server.ssl.bundle", "control plane", "SSL bundle; with client-auth=need, mutual TLS", "none"], ["yukta.workers.lease", "both", "How long a renewal keeps a worker listed", "15s"], ["yukta.workers.control-plane", "worker", "host:port, several comma separated", "none"], ["yukta.workers.id", "worker", "The worker's name in the registry", "none (required)"], ["yukta.workers.pools", "worker", "Pools the worker serves", "default"], ["yukta.workers.plugin-types", "worker", "Plugin types it will run", "empty (runs nothing)"], ["yukta.workers.capacity", "worker", "Nodes at once", "4"], ["yukta.workers.drain-timeout", "worker", "Longest wait for running nodes at stop", "30s"], ["yukta.workers.ssl-bundle", "worker", "SSL bundle for TLS to the control plane", "none (plain TCP)"], ["engine.placement {pool}", "node config", "Run this processor node on a worker of the pool", "local"], ["-Pyukta.workers=true", "build", "Include the module", "not included"], ["-Pyukta.workers.native=control-plane|worker", "native build", "Role the image is built as", "none"]]}, {"id": "frames", "title": "The frames", "lede": "Two record types; every frame has a kind and only the fields it needs.", "head": ["Frame", "Direction", "Carries", "Answer"], "rows": [["REGISTER", "worker to control plane", "token, worker id, pools, plugin types, capacity", "ACK or REJECT"], ["LEASE", "worker to control plane", "used slots, draining", "ACK or REJECT (lease expired)"], ["ACK / REJECT", "control plane to worker", "REJECT carries the reason", "none"], ["START", "control plane to worker", "execution id, node id, plugin type, node config", "MESSAGE / HEARTBEAT / COMPLETE / ERROR"], ["MESSAGE", "both", "one message as a JSON map", "none"], ["HEARTBEAT", "worker to control plane", "nothing", "none"], ["COMPLETE", "both", "nothing", "ends the stream"], ["ERROR", "worker to control plane", "error class and message", "ends the stream"]]}, {"id": "dos", "title": "Do and don't for operators", "lede": "Short rules that follow from the guarantees.", "head": ["Do", "Don't"], "rows": [["Use mutual TLS on both sides and a long random token.", "Don't run workers over plain TCP across a network you do not control."], ["Keep secrets out of node configs of placed nodes, or accept that they cross the wire.", "Don't assume <code>decrypted:<\/code> values stay on the control plane."], ["Make placed plugins idempotent on the message id.", "Don't place a node whose effect cannot safely repeat."], ["Put a load balancer or health check on the leader gauge and list every control plane in each worker.", "Don't rely on a deposed control plane releasing its workers."], ["Run the same build on the control plane and the workers.", "Don't upgrade one side alone: the frames have no version."]]}], "quality": [{"n": "Scalability", "pos": "Scales the plugin call out. The control plane still carries every message in both directions and holds all state, so it is the ceiling.", "ceil": ["The control plane is a data hop for every message", "One RSocket connection per worker", "The registry is an in-memory map scanned on each pick", "No size limit or claim check for large payloads"], "have": ["Pools, plugin types and free-slot choice", "Back-pressure and cancel end to end", "Workers need no inbound port"], "need": ["A payload limit and a reference for large bodies", "Atomic slot accounting or worker-side limits", "Autoscaling signals from the slot gauge"]}, {"n": "Performance", "pos": "Each attempt adds a round trip and a JSON conversion of every message in both directions, and an initialise and prepare on the worker.", "ceil": ["JSON conversion of every message twice", "Initialise and prepare per attempt (per message with per-message policies)", "Registry list sorted per pick"], "have": ["Streaming rather than request-reply per message", "One channel for all messages of an attempt (without per-message policies)"], "need": ["A benchmark of latency and throughput per message", "Reuse of the prepared plugin across attempts on a worker"]}, {"n": "Availability", "pos": "A dead worker is a delay, not a failed run. The weak points are the control plane, which is the single owner of state, and the time workers take to find a new leader.", "ceil": ["A deposed but running control plane keeps its workers", "The reconnect pause grows to 30 s and is not reset", "Attempts in flight at a failover fail and retry", "No queue: no worker means an immediate failure"], "have": ["Lease expiry", "Retry on another worker, tested with SIGKILL", "Graceful drain", "Several control-plane addresses"], "need": ["Check leadership on every lease", "Reset the backoff after a healthy connection", "An option to wait for a worker instead of failing"]}, {"n": "Security", "pos": "The weakest lens. Everything that makes the module safe is optional or shared: plain TCP by default, one token for all workers, and node configs and payloads on the wire.", "ceil": ["Plain TCP by default", "One shared token and self-declared worker ids", "Node config (with any literal secret) and payloads cross the wire", "A control plane can send any START to a worker for an allowed type"], "have": ["Constant-time token comparison", "Mutual TLS with host-name verification (tested)", "Per-worker allow-list of plugin types", "Processors only"], "need": ["Per-worker credentials or certificates mapped to ids", "TLS required by default when a non-loopback address is used", "A decision on where secrets are resolved (design question 3)"]}, {"n": "Operability", "pos": "One list endpoint and two gauges. Worker-side logs, meters and spans stay on the worker.", "ceil": ["Plugin meters and logs live in the worker's JVM", "No live log stream from placed nodes", "Warnings for every reconnect attempt", "No UI list of workers"], "have": ["GET /api/workers", "yukta.workers and yukta.worker.slots gauges", "Log lines for registration, refusal and worker gone"], "need": ["Forward the log sink and trace context", "Per-worker load and failure counters", "A readiness check for 'at least one worker in pool X'"]}, {"n": "Evolvability", "pos": "Two small records are the whole protocol, which is easy to change and easy to break.", "ceil": ["No version on the frames", "No SIGNAL frame, so stateful and signal plugins cannot be placed", "Control plane and worker must be the same build"], "have": ["A small, clear frame set", "Real-connection tests", "Role chosen by properties"], "need": ["A version in REGISTER and a compatibility rule", "Frames for signals, trace context and deadlines as designed", "A test that mixes two versions"]}], "risks": [{"id": "deposedKeepsWorkers", "t": "A control plane that lost the lease keeps its workers", "a": "Availability", "i": 3, "e": 2, "c": ["reg", "ha", "tests"], "why": "The leader check runs only when a worker registers. <code>WorkerSessionHandler.answer<\/code> replies <code>ACK<\/code> to every <code>LEASE<\/code> if the registry knows the worker, without asking whether this server is still the leader. If the leader loses the database lease but keeps running (a network split to the database, a long pause), its worker connections stay open and keep being renewed, while the new leader has no workers. Placed nodes on the new leader fail with 'No connected worker' until the old process stops. A crash of the old leader is handled (the connections close); this case is not, and no test covers it.", "o": "Answer a LEASE with <code>REJECT 'not the leader'<\/code> when <code>election.isLeader()<\/code> is false, so the agent reconnects to the next address; and close the connections when leadership is lost.", "q": "What do your workers do when the leader is alive but cannot reach the database?"}, {"id": "plainTokenDefault", "t": "Plain TCP is the default, and the wire carries tokens, configs and payloads", "a": "Security", "i": 4, "e": 2, "c": ["trans", "exec"], "why": "Without <code>yukta.workers.ssl-bundle<\/code> (worker) and an SSL bundle on the RSocket server (control plane) the connection is plain TCP. The shared token travels in the REGISTER frame, <code>START<\/code> carries the node config as written (including any literal API key, password or webhook url in it), and every input and output message is sent as JSON. Anyone on the path can read them, and can also play the control plane to a worker and send it START frames for the plugin types it runs. Mutual TLS is built and tested, but nothing requires it, even for a non-loopback address.", "o": "Refuse a non-loopback worker connection without TLS unless an explicit 'insecure' flag is set; document the two SSL bundles in the setup text; keep secrets out of placed nodes' configs.", "q": "Would you accept your LLM API key crossing this link in clear text?"}, {"id": "sharedTokenIdentity", "t": "One shared token, and workers choose their own identity", "a": "Security", "i": 3, "e": 3, "c": ["reg"], "why": "Every worker uses the same token, and the worker id, pools and plugin types are whatever the REGISTER frame says. Anyone with the token can register as any id: <code>registry.register<\/code> replaces an existing entry and the connection map is overwritten, so the new connection receives that worker's jobs. A token cannot be revoked for one worker, and rotating it means restarting the control plane and every worker. Two live workers with the same id also renew the same registry entry.", "o": "A token or certificate per worker, mapped to the ids and pools it may use; refuse a second registration for an id that is still alive.", "q": "How do you remove one compromised worker without touching the others?"}, {"id": "capacityRace", "t": "Slot accounting is not atomic and the worker enforces no limit", "a": "Correctness", "i": 2, "e": 2, "c": ["pick", "runner"], "why": "<code>pick<\/code> reads free slots and the caller increments the in-flight counter afterwards, in a separate step, so two attempts chosen at the same moment can both take the last slot. The worker's <code>NodeRunner<\/code> starts every attempt it receives, so the worker runs more than its capacity. The control plane also counts only its own sends; a second control plane (a standby that takes over) starts from the lease's used-slot value, which is up to 5 s old.", "o": "Reserve the slot inside the pick (compare-and-set on the counter) and have the runner refuse an attempt beyond its capacity with a retryable error.", "q": "What happens to a worker with capacity 4 that gets 12 attempts at once?"}, {"id": "liveLogsLost", "t": "Placed nodes lose their live log stream", "a": "Operability", "i": 3, "e": 2, "c": ["runner"], "why": "The control plane puts a log sink into the Reactor context of a local node so that a plugin can write log lines while it runs (PROCESS_EXECUTOR streams every output line this way). <code>NodeRunner<\/code> puts only the execution id, node id and the heartbeat into the context, so on a worker the sink is absent and the plugin uses its no-op default. A placed PROCESS_EXECUTOR node shows its output only in the final result message, not live in the log feed, <code>logs<\/code> and <code>controlbus watch<\/code>. The worker's own application log has the lines, on the worker.", "o": "Add a LOG frame (or reuse MESSAGE) from worker to control plane and give the runner a sink that sends it; or document the limit.", "q": "Does anyone watch a placed build step live?"}, {"id": "noTraceContext", "t": "START carries no trace context, deadlines or attempt number", "a": "Operability", "i": 2, "e": 3, "c": ["exec", "frames"], "why": "The design lists trace context, an attempt number and deadlines in <code>START<\/code>. The implemented START has only execution id, node id, plugin type and config. A worker's spans therefore do not join the run's <code>yukta.run<\/code> trace, the node's deadline is enforced only on the control plane (which cancels the channel), and the plugin's meters (for example token counters) are recorded in the worker's own registry and need their own scraping.", "o": "Add the trace headers to START and open the worker-side observation as a child; document that plugin meters must be collected from workers.", "q": "Where would you look for the cost of a placed LLM_CALL node?"}, {"id": "reconnectBackoff", "t": "The reconnect pause is not reset after a healthy connection", "a": "Availability", "i": 2, "e": 1, "c": ["agent", "ha"], "why": "The agent retries with <code>Retry.backoff(Long.MAX_VALUE, 1 s).maxBackoff(30 s)<\/code> on a Mono that only ever ends in an error. Without <code>transientErrors(true)<\/code> Reactor counts every failure of the process, not failures in a row, so after a few reconnects each new pause is already near 30 s (with jitter). A failover then costs a worker up to about 45 s of idle time on top of the lease, for as long as the process lives. This follows from Reactor's rules and is not measured here; the failover test covers a first failover only.", "o": "Add <code>transientErrors(true)<\/code> and reset on a successful REGISTER; log the pause.", "q": "How long can a worker sit idle after the fifth control-plane restart?"}, {"id": "abortLostAcrossWire", "t": "Errors lose their class on the way back, so a hard stop becomes a normal failure", "a": "Correctness", "i": 3, "e": 1, "c": ["exec"], "why": "An <code>ERROR<\/code> frame carries the class name and message. The executor rebuilds only <code>IllegalArgumentException<\/code>; every other class becomes a <code>WorkflowExecutionException<\/code> with the class in its text and no cause. The engine decides retry, drop and dead-letter by exception class and cause, and treats <code>RunAbortedException<\/code> (an LLM or MCP budget with <code>hardStop<\/code>) as an order to end the run. On a worker that exception arrives as a plain failure, so the budget stop can be retried or routed to a dead letter instead of ending the run, and <code>retryOn<\/code> / <code>noRetryOn<\/code> lists naming an original class do not match.", "o": "Map known classes back (at least RunAbortedException) and put the class chain in the error frame so the engine can match it; test a hardStop budget on a placed node.", "q": "Does a budget stop mean the same thing on a worker as on the control plane?"}, {"id": "payloadAsJson", "t": "Messages cross as plain JSON with no size limit", "a": "Scalability", "i": 3, "e": 4, "c": ["exec", "trans", "frames"], "why": "Each message is converted to a JSON map with the application's <code>ObjectMapper<\/code> and back to <code>DefaultMessage<\/code>. Java types in the payload and in headers (dates, byte arrays, POJOs) come back as maps, lists, numbers and text. The module sets no frame or message size limit, and there is no reference for large bodies (the design leaves the payload limit as an open decision), so a large file or a long model output goes through the control plane as one frame. The boot mapper rejects unknown properties, so a field added to the message on one side and not the other fails to convert.", "o": "Decide a payload limit and a claim-check reference above it; test a 50 MiB message and a header holding a date.", "q": "What is the largest message a placed node will see?"}, {"id": "wireVersion", "t": "The wire protocol has no version and is not tested across builds", "a": "Evolvability", "i": 3, "e": 3, "c": ["frames", "tests"], "why": "<code>WorkerFrame<\/code> and <code>NodeFrame<\/code> are the whole protocol and neither carries a version. A control plane and a worker built from different commits must agree on the record components and on <code>DefaultMessage<\/code>; a mismatch shows up as a conversion error or a field silently ignored, depending on the mapper settings. Rolling upgrades of a pool, which are the normal case, have no rule and no test.", "o": "Send a protocol version in REGISTER and refuse an incompatible worker with a clear reason; add a test that pairs the previous release's frames with the current handler.", "q": "Can you upgrade the control plane before the workers?"}, {"id": "statefulPlacement", "t": "The 'local only' list is a fixed set of four types", "a": "Correctness", "i": 2, "e": 2, "c": ["pick"], "why": "<code>RemoteNodes<\/code> refuses SESSION_MEMORY, KV_STORE, WAIT_FOR_SIGNAL and SUB_WORKFLOW. Other plugins that keep state in memory per node or per process are allowed: the ANOMALY and DEDUPE windows, AGGREGATE's partial batch, the MCP session cache. On a worker that state lives in whichever worker ran the attempt, and with per-message policies each message is its own attempt, so windows and batches see partial data and a retry on another worker starts empty. A new stateful plugin is placeable until someone adds it to the list.", "o": "Make 'local only' a flag on the plugin (as the design says) instead of a list in core, and mark the window-based plugins.", "q": "Which of your plugins keep anything between messages?"}, /* ---- prompts ---- */
if(D.prompts&&D.prompts.length){var pi=0;
 var deck=function(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
  $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}};
 deck()}
/* ---- glossary ---- */
function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
</script>
</body>
</html>
