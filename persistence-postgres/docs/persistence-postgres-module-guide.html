<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta persistence-postgres Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
  <div class="others" id="others"></div>
</nav>
<main id="main"></main>
</div>
<script>
var DATA = {"module": "persistence-postgres", "title": "How Yukta keeps its state in PostgreSQL, and where it can break", "htmlTitle": "Yukta persistence-postgres Guide", "date": "2026-10-15", "glance": {"lede": "By default Yukta keeps its definitions, sessions, run history and node outputs in memory or in files on one server. <b>persistence-postgres<\/b> is the optional module that moves them into PostgreSQL, adds a leader lease so two servers can share the database, and holds the small state of KV_STORE and SESSION_MEMORY nodes. It has no engine logic: it implements storage interfaces that core and plugin-api define. This page is for thinking about it: open a component, play a scenario, then challenge the weak spots.", "props": [["Same interfaces, other backend", "Every store implements an interface from core or plugin-api, so the engine does not know whether it talks to memory, files or PostgreSQL."], ["Documents in JSONB", "Definitions, log events, messages and chat turns are stored as JSONB with a few key columns. A change to a Java record rarely needs a migration."], ["Selected by properties", "Each store has its own switch. A deployment can be half durable, for example PostgreSQL definitions with in-memory checkpoints."], ["Not a transaction layer", "Most operations are one statement, but multi-step ones (apply a session, remove a workflow, rewrite the log) are not wrapped in a transaction."]], "start": [["primer", "Primer", "The problem, the vocabulary and one run followed through the database"], ["map", "System map", "Nine components and what each one stores"], ["map", "Replay a situation", "Five scenarios: a normal run, a crash, a failover, startup recovery, a restart of chat and counters"], ["guarantees", "What survives a crash", "Per kind of data, what is durable and what is only best effort"], ["reference", "Tables and settings", "Every table, who writes it, who cleans it; the property that selects each store"], ["quality", "Stress it", "Scalability, performance, availability, security lenses"], ["board", "Challenge it", "Open risks, an impact x effort grid, your own notes"], ["adrs", "Decisions", "Seven ADRs, each with a 'revisit when' trigger"]]}, "primer": {"problem": "A Yukta server forgets everything when it restarts unless it writes state somewhere: the workflow designs, which sessions exist, which runs started and ended, what each node produced. Files work for one server. They do not work when two servers should share one state, and they are awkward to query. This module writes the same state into PostgreSQL instead, and adds one more thing files cannot do easily: a lease that tells several servers which one is in charge.", "analogy": "Think of an office that used to keep its records in a filing cabinet on one desk. This module moves the cabinet into a shared records room: any clerk can use it, and a duty roster on the door says which clerk is on duty. The clerks still do their jobs the same way; only where the paper lives has changed.", "layersTitle": "Where persistence-postgres sits", "layers": [["Clients", "REST, web UI, MCP agents, the CLI", ""], ["core", "Engine, scheduler, startup recovery and the store interfaces", ""], ["plugin-api", "The KeyValueStore, SessionHistoryStore and NodeCheckpointStore interfaces", ""], ["persistence-postgres", "Implements them on PostgreSQL. This page.", "me"], ["PostgreSQL", "R2DBC at run time, Flyway over JDBC for the schema", ""]], "layersNote": "The module depends on core and plugin-api. Nothing depends on it except the application (boot), which includes it only when built with -Pyukta.persistence=postgres.", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["Store", "A class that keeps one kind of data behind an interface. Core asks for a store; it does not care which one it gets.", "The workflow definition store."], ["R2DBC", "A non-blocking way to talk to a database from Reactor code. Statements return a Mono or Flux instead of blocking a thread.", "DatabaseClient.sql(...).fetch()."], ["Flyway", "A tool that runs numbered SQL scripts once each, to build and change the schema.", "V3__node_checkpoints.sql."], ["JSONB", "A PostgreSQL column type that stores a JSON document in a binary form. Key order is not kept; the database can compare documents.", "A whole workflow definition in one cell."], ["Execution log", "An append-only list of run events. Startup recovery reads it to find runs that never ended.", "RUN_STARTED, NODE_FINISHED, RUN_FINISHED."], ["Checkpoint", "The recorded output of one node of one run, and a stamp saying the node ended normally.", "What the HTTP node returned."], ["Lease", "A claim that expires unless it is renewed. Whoever holds it acts as the leader.", "One row, renewed every 5 seconds."], ["Fencing number", "A number that grows each time the lease changes hands, so a late write from an old holder could be recognised and refused.", "Held in the lease row; not yet checked by any write."]], "ex": {"title": "One run, from its start to a resume after a crash", "lede": "A workflow run is logged, each node leaves its output, the server crashes, and a restart finds the run and resumes it. Click a step to see what happens, why, and what can go wrong.", "viewBox": "0 0 880 230", "labels": ["What happens", "Why it works this way", "Can go wrong"], "legend": "Blue = this module · Grey = core · Green = the database", "nodes": [{"id": "start", "n": "Run starts", "s": "execution log", "k": "p", "x": 10, "y": 40, "does": "Core appends <code>RUN_STARTED<\/code> with the start payload. <code>append<\/code> only queues the event; the single writer thread inserts it, together with other waiting events, into <code>execution_log<\/code>.", "adds": "The start is logged before the run does any work, so a crash right after still leaves a trace that the run existed and what its input was.", "wrong": "If the queue of 10,000 events is full the event is dropped and only an error line says so; the run then has no start in the log and cannot be resumed."}, {"id": "save", "n": "Node output", "s": "checkpoint save", "k": "p", "x": 190, "y": 40, "does": "Each message a node produces is inserted as a row in <code>node_checkpoint<\/code> (JSONB). A failed insert marks the node incomplete in <code>node_checkpoint_state<\/code>.", "adds": "A later restart from this node can replay the recorded messages instead of running the upstream nodes again.", "wrong": "Messages come back as plain JSON values (maps, lists, numbers, text), not the Java types the node produced."}, {"id": "done", "n": "Node ends", "s": "end marker", "k": "p", "x": 370, "y": 40, "does": "After the last message core calls <code>markComplete<\/code>: a second statement sets <code>done<\/code> for the node. Only a node with that stamp is skipped by a resume.", "adds": "The stamp separates a node that finished from one that was cut off while writing, which is what makes a resume safe.", "wrong": "The stamp is a separate statement from the last message. A crash between them makes the node run again, so its side effects must tolerate that (at-least-once)."}, {"id": "finish", "n": "Run ends", "s": "execution log", "k": "p", "x": 550, "y": 40, "does": "Core appends <code>RUN_FINISHED<\/code> (or aborted). Every 10,000 appended events the writer also trims the table to the newest 500 runs.", "adds": "Trimming keeps the table from growing without limit, and it never removes a run that has a start and no end.", "wrong": "The trim groups the whole table by execution id each time; on a large log it is a heavy statement on the single writer thread."}, {"id": "crash", "n": "Server crashes", "s": "process dies", "k": "e", "x": 730, "y": 40, "does": "The JVM stops. Events still in the in-memory queue are gone; everything already inserted is in PostgreSQL.", "adds": "PostgreSQL commits each statement on its own, so what was written is durable without any extra step.", "wrong": "Up to 10,000 queued events can be lost with the process. A run whose end event was among them looks interrupted."}, {"id": "recover", "n": "Restart recovery", "s": "readAll, replaceAll", "k": "e", "x": 730, "y": 150, "does": "On start (or when a standby takes over) core reads the whole log, marks runs without an end ABORTED, and rewrites the log without the oldest runs with <code>replaceAll<\/code>: delete every row, then insert the kept events one by one.", "adds": "The rewrite keeps the log bounded and records the abort of each interrupted run.", "wrong": "The rewrite is not in a transaction. A crash after the delete and before the inserts finish loses the log, and with it the means to resume anything."}, {"id": "resume", "n": "Resume", "s": "checkpoint read", "k": "p", "x": 550, "y": 150, "does": "<code>ExecutionResumer<\/code> reads the log for the run's payload, asks <code>isFinished<\/code> for each node, replays the recorded output of finished nodes with <code>getAll<\/code> and runs the rest again.", "adds": "Finished work is not repeated and the run continues from where it was cut off.", "wrong": "<code>isFinished<\/code> is a blocking call per node (up to 30 s each if the database is slow), and a timeout counts as unfinished, so that node runs again."}], "edges": [["start", "save"], ["save", "done"], ["done", "finish"], ["finish", "crash"], ["crash", "recover"], ["recover", "resume"]], "start": "start", "json": {"title": "See the rows", "note": "Simplified: the real tables hold JSONB documents; the columns are the real ones.", "text": "execution_log (seq, execution_id, event)\n  101  e-7  {\"type\":\"RUN_STARTED\",\"payload\":{...}}\n  102  e-7  {\"type\":\"NODE_FINISHED\",\"nodeId\":\"fetch\"}\n  (crash: no RUN_FINISHED)\n\nnode_checkpoint (seq, execution_id, node_id, message)\n  55   e-7  fetch  {\"id\":\"m1\",\"payload\":{...}}\n\nnode_checkpoint_state (execution_id, node_id, done, incomplete)\n  e-7  fetch  true   false\n  e-7  parse  false  false     <- cut off: runs again on resume\n\nleader_lease (name, holder, fencing, expires_at)\n  leader  server-a  3  2026-10-15 14:03:20+00"}}, "wrapper": {"title": "What happens around every write", "lede": "Core calls a small interface; this module turns it into a statement.", "steps": ["Core calls the store interface (append, save, put, ...)", "The value is written as JSON by Spring's ObjectMapper", "One statement runs over R2DBC (batched for the log)", "A failure is logged; most stores then carry on with a safe default", "Reads parse the JSON back into the record (plain values for payloads)"]}, "story": {"title": "A run's state in plain words", "steps": [["Designed", "a workflow definition is saved; the identical definition twice adds no version."], ["Started", "the log records the start and the input before any node runs."], ["Producing", "each node leaves its output rows; a stamp is set when the node ends."], ["Ended or cut off", "the log records the end; if the server dies first, the run has no end."], ["Found again", "on the next start the log is read and the run is marked aborted, or resumed."], ["Trimmed", "old runs are deleted once there are more than 500; runs without an end are kept."]]}, "paths": [["New to the module", "Primer, then the System map and the Normal run scenario, then Tables and settings in Reference.", "primer"], ["Operating it", "Reference (settings and the do/don't list), then Guarantees to see what survives a crash, then Risks.", "reference"], ["Planning high availability", "System map (Leader lease), the Failover scenario, then Risks (fencing, recovery rewrite).", "board"]]}, "plain": {"conf": ["The switchboard. Based on a few settings it plugs the PostgreSQL versions of each store into the application in place of the built-in ones.", "A deployment chooses per kind of data whether it lives in memory, in files or in a database, without any code change."], "conn": ["The two phone lines to the database: a fast non-blocking one the stores use while running, and an ordinary one used once at start to build the tables.", "Flyway cannot use the non-blocking line, so a second set of connection settings is unavoidable."], "flyway": ["The builder's blueprints. Numbered scripts that create each table exactly once, in order, the first time a server starts against a database.", "Everyone, including a new server joining later, ends up with the same tables, and nobody edits the database by hand."], "small": ["Two small notebooks: one for counters and flags that workflows keep, one for chat conversations.", "Without them these notes are lost when the server restarts, and a second server could not see them."], "defs": ["The library of workflow designs and the file of session settings. Each design keeps its last twenty versions.", "Designs survive a restart, and an operator can look at an old version or roll back to it."], "log": ["The captain's logbook: when a run began, when each step ended and when the run finished.", "After a crash the logbook is how the server knows which runs were interrupted and which can be resumed."], "ckpt": ["The shelf where each step leaves its finished work, with a stamp when the step is completely done.", "A run can restart from a step, or continue after a crash, without redoing steps that already finished."], "lead": ["A single key to the control room that servers hand to each other. Whoever holds it runs workflows; the key must be shown again every few seconds or it is taken away.", "Two servers must never both start the same work; a standby must notice quickly when the active one is gone."], "tests": ["The practice runs on a real database, plus the rule that every line is tested.", "Database code that is only tested with fakes tends to fail on the first real statement."]}, "comps": [{"id": "conf", "name": "Auto-configuration", "tag": "which stores exist", "c": 0, "r": 0, "resp": "Decides, from properties, which store beans the application gets: PostgreSQL ones, or none (then the in-memory and file defaults in core stay).", "how": ["<code>PostgresPersistenceAutoConfiguration<\/code> is registered through <code>AutoConfiguration.imports<\/code>. Its three always-on beans (workflow definitions, session config, execution log) exist when <code>yukta.session.store-type=postgres<\/code>.", "Four more beans are switched on one by one: <code>yukta.restart.store-type=postgres<\/code> (node checkpoints), <code>yukta.ha.mode=postgres<\/code> (leader lease), <code>yukta.kv.store-type=postgres<\/code> (KV_STORE state) and <code>yukta.session-memory.store-type=postgres<\/code> (chat history). So a deployment can be half on PostgreSQL.", "The log store takes <code>yukta.execution-log.retained-runs<\/code> (500) and <code>compact-after<\/code> (10,000); the lease takes <code>yukta.ha.instance-id<\/code> (random if unset) and <code>yukta.ha.lease<\/code> (15 s); the history store takes an optional <code>yukta.session-memory.ttl<\/code>.", "The module is only on the classpath when the application is built with <code>-Pyukta.persistence=postgres<\/code>, so the choice is made twice: at build time and by properties."], "guar": "With the matching property set, the matching bean exists; without it, core's default store is used.", "state": "None. Beans are created once at start.", "ceil": "Nothing checks that the properties agree: the session store can be PostgreSQL while checkpoints stay in memory, which is a half-durable deployment.", "fail": "A missing <code>spring.r2dbc.url<\/code> fails the application at start. A wrong <code>store-type<\/code> value silently selects the default store.", "set": ["yukta.session.store-type", "yukta.restart.store-type", "yukta.ha.mode", "yukta.kv.store-type", "yukta.session-memory.store-type", "yukta.session-memory.ttl"], "risks": ["halfDurable"]}, {"id": "conn", "name": "Connections & drivers", "tag": "R2DBC + JDBC", "c": 1, "r": 0, "resp": "Provides the two connections the module needs: R2DBC for all run-time statements and JDBC for Flyway.", "how": ["At run time every store uses Spring's <code>DatabaseClient<\/code> over R2DBC (<code>spring.r2dbc.url<\/code>). Flyway has no R2DBC support, so the schema is migrated over JDBC from <code>spring.flyway.url<\/code> with <code>spring.flyway.user<\/code> and <code>spring.flyway.password<\/code>.", "The driver jars are <code>runtimeOnly<\/code>: the R2DBC PostgreSQL driver, the PostgreSQL JDBC driver and the Flyway PostgreSQL module.", "The R2DBC driver pulls in scram-client 3.2, which has a high-severity advisory; the build pins scram-client and scram-common to 3.3 with a constraint.", "Several stores wait for the database on the calling thread (see the Blocking calls risk): they convert a Mono to a future and wait with a timeout (10 s for history and lease, 30 s for checkpoints and the log)."], "guar": "Every statement has a timeout where it blocks; a timeout is logged and turned into a safe default.", "state": "The connection pool belongs to Spring Boot's R2DBC auto-configuration, not to this module.", "ceil": "Pool size and R2DBC pool metrics are not set or exposed here.", "fail": "An unreachable database makes writes fail (logged) and reads return empty or \"unfinished\"; the application keeps running.", "set": ["spring.r2dbc.url", "spring.flyway.url", "spring.flyway.user", "spring.flyway.password"], "risks": ["twoConnections", "blockingCalls"]}, {"id": "flyway", "name": "Schema migrations", "tag": "V1 to V6", "c": 2, "r": 0, "resp": "Creates and evolves the nine tables. Each migration is a numbered SQL file that runs once per database.", "how": ["V1 creates <code>workflow_definition<\/code>, <code>workflow_definition_revision<\/code>, <code>session_config<\/code> and <code>execution_log<\/code> (with an index on execution id). V2 adds the version <code>note<\/code>. V3 adds <code>node_checkpoint<\/code> and <code>node_checkpoint_state<\/code>. V4 adds <code>leader_lease<\/code>. V5 adds <code>kv_entry<\/code>. V6 adds <code>session_history<\/code>.", "Flyway runs on every server at start. It locks the schema history table, so two servers starting together do not both migrate.", "All state is stored as JSONB documents plus a few key columns, so most changes to the Java records need no migration; a migration is needed only for a new table or column.", "There are no down scripts. Nothing is partitioned, and the only indexes besides the primary keys are on <code>execution_log(execution_id)<\/code> and <code>node_checkpoint(execution_id, node_id, seq)<\/code>."], "guar": "A migration that ran is never run again; the schema history records it.", "state": "The <code>flyway_schema_history<\/code> table in the same database.", "ceil": "Forward-only: a bad migration is fixed by another migration or by hand.", "fail": "A failing migration stops the application at start, before any store is used.", "set": ["spring.flyway.*"], "risks": ["noMigrationPlan", "noRetention"]}, {"id": "small", "name": "KV and chat history", "tag": "two small stores", "c": 3, "r": 0, "resp": "Keep the state of KV_STORE nodes and the chat history of SESSION_MEMORY nodes in PostgreSQL, so both survive a restart and are shared by servers.", "how": ["<code>R2dbcKeyValueStore<\/code> (table <code>kv_entry<\/code>, key + JSONB value) implements the plugin-api <code>KeyValueStore<\/code>. <code>put<\/code> and <code>incr<\/code> are single statements: a counter is incremented in the database, so concurrent increments do not lose updates. <code>incr<\/code> on a value that is not a whole number turns the database error into an <code>IllegalArgumentException<\/code>.", "The size cap (<code>maxEntries<\/code>) is a condition inside the insert: it counts all rows, and refuses a new key when the count has reached the cap. The count and the insert are one statement but not serialised against other inserts, so two concurrent new keys can both pass.", "<code>R2dbcSessionHistoryStore<\/code> (table <code>session_history<\/code>, session id + JSONB turns) implements <code>SessionHistoryStore<\/code>. Its calls block the calling thread, up to 10 s; a failure is logged and the chat goes on from memory.", "With <code>yukta.session-memory.ttl<\/code>, every save also deletes the sessions whose <code>updated_at<\/code> is older than the ttl. A load does not check the ttl."], "guar": "Counters are exact; a history save never fails the chat.", "state": "Tables <code>kv_entry<\/code> and <code>session_history<\/code>.", "ceil": "The ttl delete scans the table on every save (no index on <code>updated_at<\/code>); the KV cap counts all rows on every new key.", "fail": "A database failure on the history store means the history lives only in memory until the next successful save.", "set": ["yukta.kv.store-type", "yukta.session-memory.store-type", "yukta.session-memory.ttl"], "risks": ["kvCapRace", "historyTtlScan", "blockingCalls"]}, {"id": "defs", "name": "Definitions & sessions", "tag": "workflow definitions, session config", "c": 0, "r": 1, "resp": "Stores the workflow definitions of each session with their newest 20 versions, and the session's own settings.", "how": ["<code>R2dbcWorkflowDefinitionStore.save<\/code> is one statement: it writes a new row in <code>workflow_definition_revision<\/code> unless the stored definition is identical (compared as JSONB), and upserts the current row. A second statement then deletes all but the newest 20 revisions of that workflow. The revision id comes from the time and the definition, and is ordered as text.", "<code>saveNote<\/code> sets the note on one version (an empty note is stored as null) and fails with Not Found if the version does not exist. <code>findRevision<\/code> and <code>revisions<\/code> back the web diff and rollback endpoints.", "<code>R2dbcSessionConfigStore<\/code> keeps name, description, project path, initiator, initiated time and tags in <code>session_config<\/code>. Initiator, description, initiated time and tags are set only while still empty. The execution timeout and the log directories are not stored: they come from <code>SessionConfigProperties<\/code> for every session.", "Applying a session config writes the row, then saves each workflow one after the other. The store has no way to delete a session row, and the interface has no delete either.", "<code>getAllConfigs<\/code> runs about seven queries for one session. <code>getSessionIds<\/code> lists sessions that have a config row, so definitions without a row are not listed."], "guar": "Saving an identical definition adds no version; at most 20 versions per workflow are kept.", "state": "Tables <code>workflow_definition<\/code>, <code>workflow_definition_revision<\/code> and <code>session_config<\/code>.", "ceil": "Removing a workflow or a session's workflows is two statements; applying a session is several. None of it is in a transaction.", "fail": "A failure between statements leaves a partly applied session (the config row replaced, some workflows saved) or a workflow with versions but no current row.", "set": ["yukta.session.store-type"], "risks": ["noTransactions", "noDelete", "sessionConfigGaps"]}, {"id": "log", "name": "Execution log", "tag": "run history, resume source", "c": 1, "r": 1, "resp": "Records the start and end of runs, node ends, control commands and idempotency keys, so a restart can mark interrupted runs ABORTED and resume them.", "how": ["<code>append<\/code> puts an event in a queue (10,000 events) and asks one writer thread to drain it. The writer inserts up to 100 events per statement; if a batch fails it writes the events one by one and logs the ones that still fail. When the queue is full the event is dropped and an error is logged.", "Reads (<code>readAll<\/code>) and rewrites (<code>replaceAll<\/code>) run on the same writer thread, after the pending events, so they see everything appended before them. <code>readAll<\/code> loads every row into memory and skips rows it cannot parse.", "<code>replaceAll<\/code> is used by startup and takeover recovery to rewrite the log without the oldest runs. It deletes every row and then inserts the kept events one at a time, each with its own statement and a 30 s wait, with no transaction.", "After every <code>compact-after<\/code> (10,000) appended events the writer trims the table to the newest <code>retained-runs<\/code> (500) runs by their last event, never dropping a run that has a start but no end, and keeps the newest 500 scheduler entries (execution id <code>scheduler<\/code>).", "If an event's payload cannot be written as JSON, the event is stored without the payload and a warning says that the run cannot be resumed."], "guar": "Events of one run keep their order (the sequence column); a run without an end is never trimmed.", "state": "Table <code>execution_log<\/code>: a sequence number, the execution id and the event as JSONB. In memory: the queue and a counter since the last compaction.", "ceil": "One writer thread, one statement at a time. Compaction groups the whole table by execution id every 10,000 events.", "fail": "A full queue or a failing insert loses events silently as far as the run is concerned; a crash inside <code>replaceAll<\/code> loses the log.", "set": ["yukta.execution-log.retained-runs", "yukta.execution-log.compact-after"], "risks": ["logReplaceAll", "logDropsEvents", "compactionCost", "readsWholeSets"]}, {"id": "ckpt", "name": "Node checkpoints", "tag": "outputs and end markers", "c": 2, "r": 1, "resp": "Stores what each node of a run produced and whether it ended normally, so a run can restart from a node or resume after a crash.", "how": ["<code>save<\/code> inserts one row per message in <code>node_checkpoint<\/code> (JSONB). If the insert fails the node is marked <em>incomplete<\/em> in <code>node_checkpoint_state<\/code>, so a restart that needs this node is refused instead of replaying part of it.", "<code>markComplete<\/code> sets the <em>done<\/em> flag in a second table, after the last message; if that fails the node is marked incomplete instead and a resume will run it again. <code>isFinished<\/code> is true only when done is set and incomplete is not.", "<code>isComplete<\/code> and <code>isFinished<\/code> are plain (blocking) methods in the interface, so they wait for the database up to 30 s; a timeout is treated as <em>unfinished<\/em>, which is the safe side for a resume.", "<code>get<\/code> reads all rows of the node and takes the last one. <code>getAll<\/code> streams the rows in order. <code>clear<\/code> deletes the rows and the state of a run, and lowers the byte counter.", "The byte counter (<code>bytesHeld<\/code>, shown as a core meter) counts characters on save and bytes on clear, only in this JVM."], "guar": "A node counts as finished only when its end marker is durable; a failed save makes the node incomplete.", "state": "Tables <code>node_checkpoint<\/code> and <code>node_checkpoint_state<\/code>; the counter is in memory.", "ceil": "The end marker is a separate statement from the last message, so there is a short window between them.", "fail": "A database failure marks nodes incomplete, which makes a restart from them impossible but never replays half an output.", "set": ["yukta.restart.store-type"], "risks": ["noTransactions", "blockingCalls", "readsWholeSets", "heldBytesDrift"]}, {"id": "lead", "name": "Leader lease", "tag": "one active server", "c": 3, "r": 1, "resp": "Lets several servers share the database while only one admits runs, and lets another take over when the leader stops.", "how": ["One row in <code>leader_lease<\/code> holds the name, the holder, a fencing number and an expiry. Each server runs one statement every third of a lease (5 s by default): it inserts the row or, if it is the holder or the lease has expired, takes it and renews the expiry. The fencing number grows by one when the holder changes.", "The expiry uses the database clock. A server counts itself the leader only while the time since it <em>sent<\/em> its last successful renewal is shorter than the lease, measured with a local monotonic clock, so a server that cannot reach the database stops being leader before another can take over.", "When a server becomes leader it runs the registered takeover actions on another thread (core uses this for recovery and auto-resume). A server that stops releases the lease by setting its expiry in the past, waiting up to 10 s.", "<code>fencingToken()<\/code> exposes the number, but nothing in this module or in core uses it to reject a write from an old leader. The gauge <code>yukta.leader<\/code> is 1 on the leader."], "guar": "Two servers never both believe they hold a lease that has not expired, as long as the local clock does not run slow relative to the database clock.", "state": "The row in <code>leader_lease<\/code>; in memory the validity time, the fencing number and the takeover list.", "ceil": "One tiny statement per 5 s per server; no contention beyond that.", "fail": "A leader paused for longer than the lease (a long stop-the-world pause) can still finish a write after another server has taken over.", "set": ["yukta.ha.mode", "yukta.ha.lease", "yukta.ha.instance-id"], "risks": ["fencingUnused", "logReplaceAll"]}, {"id": "tests", "name": "Tests & build", "tag": "Testcontainers", "c": 1, "r": 2, "resp": "Shows each store works against a real PostgreSQL 18, and keeps the module at full coverage.", "how": ["Every store has a test class that runs against a PostgreSQL container started by Testcontainers (<code>postgres:18-alpine<\/code>); the base class migrates the schema with Flyway and empties all nine tables before each test.", "The lease tests cover a graceful hand-over, a crashed holder replaced after its lease, an unreachable database ending leadership after the holder's own lease, and a failing takeover action not stopping others. The boot module has a Postgres acceptance test, run with <code>-Pyukta.persistence=postgres<\/code>.", "The build applies the library conventions, so the module has the same Checkstyle, PMD, SpotBugs and 100% per-class coverage gates as the others."], "guar": "Behaviour that needs a database is tested against a real one, not a mock.", "state": "A container started once per test JVM and stopped at exit.", "ceil": "The tests need Docker. They start from an empty database, so no test upgrades an older schema that already holds data.", "fail": "Without Docker the container is not started and the tests fail in the base class.", "set": [], "risks": ["noMigrationPlan"]}], "edges": [["conf", "defs", "ctrl", "creates"], ["conf", "log", "ctrl", "creates"], ["conf", "ckpt", "ctrl", "creates"], ["conf", "lead", "ctrl", "creates"], ["conf", "small", "ctrl", "creates"], ["conn", "defs", "data", "statements"], ["conn", "log", "data", "statements"], ["conn", "ckpt", "data", "statements"], ["conn", "lead", "data", "lease row"], ["conn", "small", "data", "statements"], ["flyway", "conn", "ctrl", "JDBC"], ["flyway", "defs", "ctrl", "schema"], ["tests", "flyway", "ctrl", "migrates"]], "scen": [{"id": "normal", "name": "A normal run", "steps": [{"t": "The design is saved", "d": "An operator applies a session. The session row is upserted, then each workflow is saved in its own statement: a new version row unless the definition is identical, the current row replaced, and all but the newest 20 versions pruned in a second statement.", "c": ["defs"], "r": ["noTransactions"]}, {"t": "The run is logged", "d": "Core appends <code>RUN_STARTED<\/code>. The event waits in the queue, and the writer thread inserts it with its neighbours in one batched statement.", "c": ["log"], "r": ["logDropsEvents"]}, {"t": "Nodes leave output", "d": "Each message is inserted into <code>node_checkpoint<\/code>. When the node ends, a second statement stamps it done.", "c": ["ckpt"], "r": ["noTransactions"]}, {"t": "The run ends", "d": "Core appends the end event. The run's outputs stay for a restart until the run falls out of the archive of retained executions (10 by default); then core clears them with two deletes, and the call waits up to 30 s.", "c": ["log", "ckpt"], "r": ["blockingCalls"]}, {"t": "The table is trimmed", "d": "After 10,000 appended events the writer deletes all but the newest 500 runs. A run that started and has no end is never deleted.", "c": ["log"], "r": ["compactionCost"]}]}, {"id": "crash", "name": "The server crashes mid-run", "steps": [{"t": "The process dies", "d": "Events waiting in the in-memory queue are lost with the process. Everything already inserted is durable.", "c": ["log"], "r": ["logDropsEvents"]}, {"t": "Node state on disk", "d": "Finished nodes have their output rows and a done stamp. The node that was running has some rows and no stamp.", "c": ["ckpt"], "r": []}, {"t": "The next start", "d": "Flyway checks the schema, the stores are created, and recovery reads the log: a run with a start and no end is marked ABORTED.", "c": ["flyway", "conf", "log"], "r": ["readsWholeSets"]}, {"t": "Resume (optional)", "d": "With auto-resume, each aborted run is resumed once: finished nodes replay their recorded output, the rest run again. Each <code>isFinished<\/code> is a blocking query.", "c": ["ckpt"], "r": ["blockingCalls"]}]}, {"id": "failover", "name": "Failover to a standby", "steps": [{"t": "Two servers, one lease", "d": "Both run the renewal statement every 5 s. One has the row, the other's statement changes nothing and it counts itself a standby.", "c": ["lead"], "r": []}, {"t": "The leader stops", "d": "A graceful stop sets the expiry in the past; a crash leaves the lease to run out (15 s). The standby's next renewal then takes the row and raises the fencing number.", "c": ["lead"], "r": []}, {"t": "Takeover actions run", "d": "The new leader runs the registered actions on another thread: startup recovery (mark the old leader's runs ABORTED, rewrite the log) and, if set, auto-resume.", "c": ["lead", "log"], "r": ["logReplaceAll"]}, {"t": "A paused old leader", "d": "If the old leader was only paused (a long garbage collection, a frozen VM), it may wake and finish a write it had already started. Nothing in the database refuses a write carrying an old fencing number.", "c": ["lead"], "r": ["fencingUnused"]}]}, {"id": "recovery", "name": "Startup recovery rewrites the log", "steps": [{"t": "Read everything", "d": "Recovery calls <code>readAll<\/code>: every row of the log is loaded into memory, parsed, and rows that fail to parse are skipped with a warning.", "c": ["log"], "r": ["readsWholeSets"]}, {"t": "Decide what to keep", "d": "It keeps the newest 500 runs, marks the ones without an end ABORTED, and clears the checkpoints of the runs it drops.", "c": ["log", "ckpt"], "r": []}, {"t": "Replace the log", "d": "<code>replaceAll<\/code> deletes all rows and inserts the kept events one by one, each waiting up to 30 s. There is no transaction around the delete and the inserts.", "c": ["log"], "r": ["logReplaceAll"]}, {"t": "If it is cut short", "d": "A crash, a lost connection or a leader change between the delete and the last insert leaves a partial log. The runs that could be resumed are gone from it.", "c": ["log", "lead"], "r": ["logReplaceAll", "fencingUnused"]}]}, {"id": "state", "name": "Counters and chat survive a restart", "steps": [{"t": "A counter is incremented", "d": "<code>incr<\/code> adds to the stored whole number in one statement, so two servers incrementing together lose nothing. If a value is not a whole number the database error becomes an IllegalArgumentException.", "c": ["small"], "r": []}, {"t": "The cap is checked", "d": "A new key is accepted only if the table has fewer rows than <code>maxEntries<\/code>. Two new keys arriving together can both pass the check.", "c": ["small"], "r": ["kvCapRace"]}, {"t": "A chat turn is saved", "d": "The history of the session is written as one JSONB cell. With a ttl, the same call then deletes expired sessions by scanning the table.", "c": ["small"], "r": ["historyTtlScan", "blockingCalls"]}, {"t": "After a restart", "d": "The plugin loads the history again from the table; a failure to read is logged and the chat starts empty.", "c": ["small", "conf"], "r": ["halfDurable"]}]}], "intro": {"normal": "One run from the saved design to the trimmed log, in the order the statements run.", "crash": "What is on disk when the process dies, and what the next start does with it.", "failover": "How a standby takes the lease, and what the lease does not protect against.", "recovery": "The startup rewrite of the execution log, and why it is the most fragile statement sequence in the module.", "state": "The small stores for counters and chat: what is atomic, what is capped, what is cleaned."}, "caps": [["Definitions", "Durable workflow designs", "Definitions survive a restart and are shared by servers.", "Table <code>workflow_definition<\/code>, JSONB.", "Operators keep their work; a standby sees the same designs.", "Not in a transaction with the session row."], ["Definitions", "Twenty versions with notes", "Each workflow keeps its newest 20 saved versions, each with an optional note.", "Table <code>workflow_definition_revision<\/code>; an identical save adds none.", "Diff and rollback in the UI, CLI-less audit of changes.", "Version order is by a time-based id from the saving server's clock."], ["Sessions", "Session settings", "Name, description, project path, initiator, initiated time and tags per session.", "Table <code>session_config<\/code>; some fields are set only while empty.", "The session list survives a restart.", "Timeout and log directories are not stored; no way to delete a session."], ["Run history", "Batched execution log", "Run starts, node ends and control commands in PostgreSQL.", "One writer thread; up to 100 events per insert.", "Runs interrupted by a crash can be found and resumed.", "10,000-event queue; events are dropped when it is full."], ["Run history", "Bounded log", "The table is trimmed to the newest 500 runs.", "A delete every 10,000 appended events; open runs are never removed.", "The table does not grow without limit.", "The trim scans the whole table."], ["Run history", "Unserialisable payloads tolerated", "A run whose start payload cannot be written as JSON is still logged.", "The event is stored without the payload and a warning is logged.", "A bad payload does not break the run.", "Such a run cannot be resumed."], ["Node state", "Per-message checkpoints", "Every message a node produces is stored in order.", "Table <code>node_checkpoint<\/code> with a sequence number; large messages are stored out of line by PostgreSQL.", "Restart from a node and resume after a crash, with no size cap.", "Reads load a node's whole output."], ["Node state", "Durable end marker", "A node counts as finished only with a stamp.", "Table <code>node_checkpoint_state<\/code>: <code>done<\/code> and <code>incomplete<\/code>.", "A resume never replays half an output.", "Set in a separate statement from the last message."], ["Node state", "Failure marks incomplete", "A failed save or a failed stamp makes the node incomplete.", "The state row gets <code>incomplete = true<\/code>.", "A restart from that node is refused instead of wrong.", "The refusal is only visible as an error to the caller."], ["High availability", "Leader lease", "One server at a time admits runs.", "One row; renewed every third of the lease; expiry from the database clock.", "A standby takes over within about one lease.", "The fencing number is not checked by any write."], ["High availability", "Takeover actions", "Registered actions run when a server becomes leader.", "Run on another thread; a failing action does not stop the others.", "Recovery and auto-resume start without a human.", "Live approval waits and queued starts are not restored (core)."], ["Plugin state", "KV store", "State of KV_STORE nodes in a table.", "<code>incr<\/code> and <code>put<\/code> as single statements.", "Counters are exact across servers.", "The size cap can be passed by concurrent new keys."], ["Plugin state", "Chat history", "Chat history of SESSION_MEMORY in a table, with an optional ttl.", "One JSONB cell per session, replaced on every turn.", "Conversations survive a restart and are shared.", "The ttl is applied on write only and scans the table."], ["Schema", "Versioned schema", "Six numbered migrations build the tables.", "Flyway over JDBC at start.", "A new server joins an existing database safely.", "Forward-only."]], "guar": {"title": "What survives a crash, and what is only best effort", "lede": "Each store has its own switch, so the table assumes the matching switch is set. PostgreSQL commits every statement on its own; nothing here uses a multi-statement transaction.", "tables": [{"title": "Enforced by the module", "lede": "Each rule is applied in a statement or in the store's code and is covered by a test.", "head": ["Rule", "Guarantee"], "rows": [["Schema exists before use", ["ok", "Flyway migrates at start; the application does not start if a migration fails."]], ["Identical definition adds no version", ["ok", "The insert of a version is skipped when the stored definition is equal as JSONB."]], ["At most 20 versions per workflow", ["ok", "A second statement prunes after every save; between the two statements 21 can exist."]], ["Log order within a run", ["ok", "A sequence column orders reads; one writer thread inserts in queue order."]], ["A run without an end is never trimmed", ["ok", "The compaction statement excludes executions that have a start and no end."]], ["Counter atomicity", ["ok", "<code>incr<\/code> adds inside one statement."]], ["KV size cap", ["part", "Checked inside the insert, but not serialised against concurrent inserts."]], ["Node counted finished only with a durable stamp", ["ok", "<code>isFinished<\/code> needs done and not incomplete; unknown or timed out counts as unfinished."]], ["Single leader", ["part", "True while every server's clock is sound and the holder is not paused; no write is fenced."]]]}, {"title": "What survives a restart or a crash", "lede": "Compare with the in-memory and file defaults in core.", "head": ["Data", "With PostgreSQL"], "rows": [["Workflow definitions and versions", ["ok", "Durable."]], ["Session settings", ["ok", "Durable; the timeout and directories come from properties."]], ["Execution log", ["part", "Durable once inserted. Events still queued (up to 10,000), dropped on overflow or failing to insert are lost."]], ["Node outputs", ["ok", "Durable per message; a node is finished only with its stamp."]], ["Leader lease", ["ok", "Expires by itself; a new holder is chosen without help."]], ["KV_STORE state", ["ok", "Durable and shared (with the KV switch set)."]], ["Chat history", ["ok", "Durable and shared (with the history switch set); a failed save leaves it only in memory."]], ["Live approval waits, queued starts, scheduler slots", ["lost", "Not stored here (core keeps them in memory)."]]]}, {"title": "Limits and defaults", "head": ["Item", "Value"], "rows": [["Retained runs", "500 (<code>yukta.execution-log.retained-runs<\/code>)"], ["Compaction after", "10,000 appended events (<code>compact-after<\/code>)"], ["Log queue / batch", "10,000 events / 100 per insert"], ["Statement waits", "Log 30 s; checkpoint state and clear 30 s; history 10 s; lease 10 s"], ["Versions per workflow", "20"], ["Lease / renewal", "15 s / every 5 s (<code>yukta.ha.lease<\/code>)"], ["Log writer shutdown wait", "5 s"], ["KV entries", "Set by the KV_STORE node (default 10,000)"], ["Chat history ttl", "None unless <code>yukta.session-memory.ttl<\/code> is set"]]}]}, "ref": [{"id": "tables", "title": "Tables, writers and cleaners", "lede": "Nine tables from six migrations. 'Cleaned by' says what removes rows; 'nothing' means no code in this module or in core does.", "head": ["Table", "Migration", "Written by", "Read by", "Cleaned by"], "rows": [["workflow_definition", "V1", "Definition store (save)", "find, findAll", "remove, removeAll (no caller in core)"], ["workflow_definition_revision", "V1, V2 (note)", "save, saveNote", "revisions, findRevision", "prune to 20 after each save; remove"], ["session_config", "V1", "Session config store", "getAllConfigs, getSessionIds", "nothing (the interface has no delete)"], ["execution_log", "V1", "Log writer thread", "readAll at recovery and resume", "compaction; replaceAll"], ["node_checkpoint", "V3", "Checkpoint save", "get, getAll", "clear when the run leaves the archive of retained executions; recovery for dropped runs"], ["node_checkpoint_state", "V3", "markComplete, failed saves", "isComplete, isFinished", "clear"], ["leader_lease", "V4", "Every server, every 5 s", "The same statement", "nothing (one row)"], ["kv_entry", "V5", "KV store put, incr", "get", "remove (by the plugin)"], ["session_history", "V6", "History save", "load", "ttl delete on save (if set)"]]}, {"id": "settings", "title": "Settings that choose a store", "lede": "Set the build flag once, then one property per kind of data.", "head": ["Setting", "Selects", "Default"], "rows": [["-Pyukta.persistence=postgres (build)", "Puts this module on the classpath", "Not included"], ["yukta.session.store-type=postgres", "Definitions, session config and the execution log", "in-memory"], ["yukta.restart.store-type=postgres", "Node checkpoints", "files if <code>yukta.restart.dir<\/code>, else memory"], ["yukta.ha.mode=postgres", "The leader lease", "single server"], ["yukta.kv.store-type=postgres", "KV_STORE state", "memory"], ["yukta.session-memory.store-type=postgres", "SESSION_MEMORY history", "memory or a directory"], ["spring.r2dbc.url", "Run-time connection", "none"], ["spring.flyway.url / user / password", "Migration connection (JDBC)", "none"]]}, {"id": "dos", "title": "Do and don't for operators", "lede": "Short rules that follow from the guarantees.", "head": ["Do", "Don't"], "rows": [["Set every switch you need: a PostgreSQL log with in-memory checkpoints cannot resume a run.", "Don't assume one property makes everything durable."], ["Give Flyway an account that may change the schema, and the application an account that may not.", "Don't run the application with the schema owner's password."], ["Run a database backup that includes all nine tables together.", "Don't restore only some of them: the log, the checkpoints and the definitions refer to each other."], ["Watch the error lines 'event dropped' and 'Batch insert failed' in the log.", "Don't treat the lack of an error in the UI as proof the log is complete."], ["Run the failover test in your environment before relying on a standby.", "Don't rely on the fencing number: nothing checks it yet."]]}], "quality": [{"n": "Scalability", "pos": "Fine for one control plane and a few hundred runs. The log has one writer thread, the lease is one row, and several operations load or scan whole tables.", "ceil": ["One writer thread and one statement at a time for the execution log", "Compaction and recovery scan the whole log", "Reads of the log and of a node's output load everything into memory", "Per-session history and KV counts scan their tables"], "have": ["Batched inserts of up to 100 events", "Large messages are stored out of line by PostgreSQL", "Trim to the newest runs, never open ones"], "need": ["Indexes for the ttl delete and the compaction query", "Stream reads (a cursor) instead of loading whole sets", "Partition or archive the log if runs are many"]}, {"n": "Performance", "pos": "Single statements are cheap. The costly parts are the one-by-one rewrite at recovery, blocking reads on the resume path, and queries that count or group whole tables.", "ceil": ["replaceAll inserts events one per round trip", "isFinished and isComplete are one query each, per node, blocking", "getAllConfigs runs about seven queries for a session", "get reads every row of a node to return the last"], "have": ["Batch insert for the log", "Upserts in one statement for counters and history", "Timeouts on every blocking wait"], "need": ["Batch or bulk the recovery rewrite", "Fetch only the last checkpoint row", "A benchmark for log append rate and resume time"]}, {"n": "Availability", "pos": "A crash is recoverable and a standby can take over, but the pieces that make this safe are the least protected: the rewrite is not atomic and the fencing number is unused.", "ceil": ["The log can lose queued events with the process", "A crash inside replaceAll loses the log", "A paused leader can still write after a takeover", "The database is a single point of failure (no failover logic here)"], "have": ["Lease with an expiry from the database clock", "Local validity measured from the time of sending", "Release of the lease on graceful stop", "Takeover actions isolated from each other"], "need": ["A transactional rewrite of the log", "Fencing checks on writes by the old leader", "Durable acknowledgement for the run-end event"]}, {"n": "Security", "pos": "No authentication of its own: it trusts the database account it is given. The data it stores can include payloads, definitions with literal secrets and chat history.", "ceil": ["Definitions, payloads and chat turns are stored as plain JSON", "One database account for the application; Flyway may use the same", "No row-level separation between sessions", "Secrets typed into a workflow config are stored as written"], "have": ["Values are always bound as parameters; the few column names that are concatenated into a statement come from constants in the code", "A pinned, patched scram-client", "Constant statement timeouts"], "need": ["Separate migration and runtime accounts, documented", "Encryption at rest and in transit settings in the setup text", "Redaction of secret-like config before storage (see web and plugins)"]}, {"n": "Operability", "pos": "Little visibility: one gauge for the leader and nothing for the stores themselves.", "ceil": ["No metrics for append rate, queue depth, dropped events, statement time or lock waits", "No health indicator for the stores", "The checkpoint byte counter drifts and restarts at zero", "No tool to inspect or repair a damaged log"], "have": ["The yukta.leader gauge", "Log lines for dropped events, failed batches and failed trims", "Spring Boot's own R2DBC and Flyway integration"], "need": ["Meters for queue depth, drops and write latency", "A health check that runs a trivial query", "A documented backup and restore procedure"]}, {"n": "Evolvability", "pos": "Easy to add a store (one class, one migration, one bean). Hard parts are changing a stored JSON shape and moving a deployment to a newer schema while it holds data.", "ceil": ["Forward-only migrations", "Stored JSON shapes are the Java records; a rename changes what old rows mean", "Tests start from an empty schema"], "have": ["Small classes, one per interface", "JSONB keeps most changes out of migrations", "Auto-configuration with one switch per store"], "need": ["A test that migrates a database holding V1 data to the latest version", "A version field inside stored documents", "A rule for removing a column or table"]}], "risks": [{"id": "logReplaceAll", "t": "The startup log rewrite is not atomic", "a": "Reliability", "i": 4, "e": 2, "c": ["log", "lead"], "why": "Startup recovery and takeover recovery call <code>ExecutionLogStore.replaceAll<\/code> with the runs to keep. In this module it runs <code>DELETE FROM execution_log<\/code> and then one <code>INSERT<\/code> per kept event, each waited for up to 30 s, with no transaction. A crash, a lost connection or a leader change after the delete leaves the log empty or partial. The log is what tells recovery which runs were interrupted and what their start payload was, so every run that could have been resumed is lost at once. With up to 500 runs of many events each, the window is also long (one round trip per event). The previous leader, if still alive, may append while the delete is running.", "o": "Do the rewrite in one transaction, or delete only the rows that fall outside the kept runs instead of replacing everything; batch the inserts.", "q": "What would you lose if the server died while recovery was rewriting the log, and how would you know?"}, {"id": "logDropsEvents", "t": "Execution log events can be lost without the run knowing", "a": "Reliability", "i": 3, "e": 3, "c": ["log"], "why": "<code>append<\/code> puts the event in a queue of 10,000 and returns. If the queue is full the event is dropped and an error line is logged. A batch that fails is retried one event at a time, and an event that still fails is logged and skipped. Events still in the queue die with the process. The run itself is told nothing, so a lost <code>RUN_STARTED<\/code> means the run cannot be resumed and a lost <code>RUN_FINISHED<\/code> makes a finished run look interrupted.", "o": "Count dropped and failed events in a meter and alert on it; for the start and end events wait for the insert (or retry) before the run continues; raise the queue only if the cause is bursts.", "q": "Is a lost run-end event acceptable, given that recovery then marks a finished run ABORTED?"}, {"id": "fencingUnused", "t": "The fencing number is produced but never checked", "a": "Reliability", "i": 3, "e": 3, "c": ["lead"], "why": "The lease row carries a fencing number that grows with every change of holder, and <code>fencingToken()<\/code> returns it, but no write in this module or in core uses it. A leader that was paused longer than the lease (a long stop-the-world pause, a suspended VM, a network stall after it checked <code>isLeader()<\/code>) can still finish a write after another server has become leader. The local validity check protects against a server that cannot reach the database, not against one that is stuck between the check and the write.", "o": "Pass the token with the writes that matter (the log append, checkpoint writes, definition saves) and refuse a write whose token is older than the one in the lease row, for example by comparing in the same statement.", "q": "Which write would hurt most if an old leader finished it after a takeover?"}, {"id": "noTransactions", "t": "Multi-step operations are not transactional", "a": "Correctness", "i": 3, "e": 3, "c": ["defs", "ckpt"], "why": "These operations are several statements with no transaction: removing a workflow (versions, then the current row), removing all workflows of a session, applying a session config (the row, then each workflow), a save followed by the prune of old versions, and a checkpoint save followed by the end marker. A failure in between leaves a workflow with versions and no current row, a half-applied session, 21 versions, or a node with all its output and no stamp (which a resume handles by running the node again). There are no foreign keys either, so nothing in the database notices.", "o": "Wrap the multi-step methods in a transaction with Spring's <code>TransactionalOperator<\/code> (R2DBC supports it), or merge them into single statements; add foreign keys with cascading deletes where the tables are parent and child.", "q": "After a failed apply, would an operator be able to tell which workflows of the session were saved?"}, {"id": "blockingCalls", "t": "Several store calls wait for the database on the calling thread", "a": "Performance", "i": 3, "e": 3, "c": ["conn", "ckpt", "small"], "why": "<code>isComplete<\/code> and <code>isFinished<\/code> (30 s), <code>clear<\/code> (30 s), the history <code>load<\/code> and <code>save<\/code> (10 s) and the lease release (10 s) convert a Mono to a future and wait. The interfaces they implement are blocking by design, so the module cannot make them non-blocking by itself. On a Reactor or event-loop thread a slow database holds that thread for the whole wait, once per node on a resume, and a timeout is silently treated as 'unfinished' or 'empty'.", "o": "Make the interfaces reactive (see the plugin-api guide) or have the callers run these methods on the blocking scheduler; meter the wait time.", "q": "How many nodes does your largest run have, and what is the database latency on a bad day?"}, {"id": "compactionCost", "t": "Trimming the log scans the whole table", "a": "Performance", "i": 3, "e": 3, "c": ["log"], "why": "Every 10,000 appended events the writer runs a delete whose subqueries group the whole <code>execution_log<\/code> by execution id (ordering by the maximum sequence) and test each run for a start without an end with <code>bool_or<\/code> over the JSONB <code>type<\/code>. There is no index on the event type, so it reads every row. It runs on the single writer thread, so appends queue up behind it, and the queue holds only 10,000 events.", "o": "Store the event type (and an 'open run' flag) in real columns with an index; trim by a time or sequence bound instead of grouping everything; run the trim in a separate task.", "q": "How long does the trim take with 500 runs of 2,000 events each, and what happens to the queue meanwhile?"}, {"id": "readsWholeSets", "t": "Reads load whole sets into memory", "a": "Scalability", "i": 3, "e": 3, "c": ["log", "ckpt"], "why": "<code>readAll<\/code> loads every row of the execution log (up to 500 runs) at start and at every takeover; <code>get<\/code> on a checkpoint reads every row of the node to return the last one; <code>getAll<\/code> collects a node's output on resume; <code>findAll<\/code> loads all definitions of a session. Memory use and latency grow with the amount of history, and a very large node output is held in memory on resume (the table has no size cap on purpose).", "o": "Read the log in a cursor and process run by run; fetch only the last row for <code>get<\/code> (order by sequence descending, limit 1); stream node output into the replay.", "q": "What is the largest node output you expect to replay?"}, {"id": "historyTtlScan", "t": "The chat-history ttl is a table scan on every save", "a": "Performance", "i": 2, "e": 1, "c": ["small"], "why": "With <code>yukta.session-memory.ttl<\/code> set, each save runs <code>DELETE FROM session_history WHERE updated_at &lt; now() - ...<\/code>, and the table has no index on <code>updated_at<\/code>, so every chat turn scans the table. The delete happens only on a save, so with no traffic expired sessions stay, and <code>load<\/code> does not check the ttl, so an expired session is still returned until some other session is saved.", "o": "Add an index on <code>updated_at<\/code> (a V7 migration); delete at most every N seconds, or in a scheduled task; check the age in <code>load<\/code>.", "q": "Is a conversation older than the ttl allowed to reappear?"}, {"id": "kvCapRace", "t": "The KV size cap is not exact and counts all rows on each new key", "a": "Correctness", "i": 2, "e": 2, "c": ["small"], "why": "A new key is inserted only if <code>count(*)<\/code> of the table is below <code>maxEntries<\/code>. Two concurrent statements can both read a count below the cap (the default isolation does not serialise them) and both insert, so the cap can be passed by the number of concurrent writers. The count is also taken for every new key. The table is shared by every KV_STORE node of every workflow, and keys are only separated by the optional namespace.", "o": "Document the cap as approximate, or serialise new-key inserts with an advisory lock; keep a counter row instead of counting.", "q": "Does anything depend on the cap being exact?"}, {"id": "noDelete", "t": "Sessions can never be deleted from the database", "a": "Functionality", "i": 2, "e": 3, "c": ["defs"], "why": "The <code>SessionConfigStore<\/code> interface has no delete, so rows in <code>session_config<\/code> stay for ever. <code>WorkflowDefinitionStore.removeAll<\/code> exists in every store but has no caller in core. Run history of a deleted session is trimmed only by the global 500-run rule. Anyone who needs to remove a tenant's data (a customer asks) must delete from nine tables by hand.", "o": "Add a session delete to the interface and implement it for all stores (definitions, config, log events of the session's runs, checkpoints, history) in one transaction.", "q": "How would you answer a request to delete everything about one session?"}, {"id": "noRetention", "t": "Nothing expires rows apart from the log trim and the optional chat ttl", "a": "Operability", "i": 2, "e": 3, "c": ["flyway"], "why": "Checkpoints are cleared when core evicts a run from its archive of retained executions (10 by default) and for runs dropped at recovery, but a run that never reaches either path leaves its rows. <code>kv_entry<\/code> grows with distinct keys. <code>session_config<\/code> and its definitions only grow. <code>workflow_definition_revision<\/code> is bounded to 20 per workflow, but not the number of workflows. There is no sweep, no size alert and no documented clean-up job.", "o": "Add a periodic clean-up of checkpoint rows whose run is not in the log, document the sizes to watch, and add them to the metrics.", "q": "Which table will be the largest after a year, and who looks at it?"}, {"id": "twoConnections", "t": "Migration and run time use two sets of connection settings, often the same account", "a": "Security", "i": 2, "e": 2, "c": ["conn"], "why": "Flyway needs a JDBC URL, user and password; the application needs an R2DBC URL. Nothing in the module separates the two accounts, and the simplest setup uses one account for both, so the running application can alter or drop tables, and an SQL injection somewhere else in the application would have the same reach. The settings are two places that can drift (a changed host or database name in one).", "o": "Document two accounts (migrator with DDL rights, application with data rights only) and show the grants; fail at start if the application account can create tables, as an option.", "q": "Who holds the password of the database owner, and where is it written?"}, {"id": "halfDurable", "t": "Each store has its own switch, so a deployment can be half durable", "a": "Operability", "i": 3, "e": 2, "c": ["conf", "small"], "why": "Five properties select five groups of stores, and nothing checks that they agree. PostgreSQL definitions with in-memory checkpoints look durable but cannot resume a run; <code>yukta.ha.mode=postgres<\/code> without PostgreSQL checkpoints lets a standby take over but not continue a run from its recorded output (auto-resume then reruns everything); a typo in a <code>store-type<\/code> value silently selects the default.", "o": "At start, log one line listing which store is in use for each kind of data; warn when HA is on and checkpoints are not in PostgreSQL; refuse unknown store-type values.", "q": "Can an operator tell from the running server which stores are durable?"}, {"id": "noStoreMetrics", "t": "The stores report almost nothing about themselves", "a": "Operability", "i": 2, "e": 2, "c": ["conn", "log"], "why": "The module registers one meter, <code>yukta.leader<\/code>. There is no health indicator, no meter for the log queue depth, dropped or failed events, statement time, retries or lock waits. The only signals are log lines. Combined with the silent defaults ('unfinished', 'empty', 'event dropped') a degraded database can look healthy from outside.", "o": "Add meters (queue depth, drops, failed batches, statement latency) and a health indicator that runs a trivial query with a short timeout.", "q": "What would page you if the log writer stopped inserting?"}, {"id": "heldBytesDrift", "t": "The checkpoint byte counter is per JVM and mixes units", "a": "Operability", "i": 1, "e": 1, "c": ["ckpt"], "why": "<code>bytesHeld()<\/code> (shown as the core meter <code>yukta.checkpoint.bytes<\/code>) adds the length of the JSON text in characters on save and subtracts the database's byte count on clear, in this JVM only. It starts at zero after a restart although the table holds data, and on a standby it stays zero. With non-ASCII payloads characters and bytes differ.", "o": "Compute the value from the table on demand (a sum of octet_length), or label the meter as 'written by this process'.", "q": ""}, {"id": "sessionConfigGaps", "t": "Session settings are partly not stored and read with many queries", "a": "Functionality", "i": 2, "e": 2, "c": ["defs"], "why": "The execution timeout and the log directories returned for a session come from the global <code>SessionConfigProperties<\/code>, not from the table, so a per-session setting cannot be kept. <code>getAllConfigs<\/code> runs about seven queries for one session, and <code>getSessionIds<\/code> lists only sessions that have a config row, so a session that has definitions but no row is invisible. Initiator, description, initiated time and tags are written only while empty, but an apply replaces the initiated time each time.", "o": "Store the per-session values or drop them from the interface; read a session in one query; list ids from the union of both tables.", "q": ""}, {"id": "noMigrationPlan", "t": "Migrations are forward-only and never tested on data", "a": "Evolvability", "i": 2, "e": 3, "c": ["flyway", "tests"], "why": "Six migrations exist and the test support runs them on an empty database. There are no down scripts, and no test upgrades a database that already holds data written by an older version. The stored JSON documents have no version field, so a renamed record component changes what old rows mean without any migration noticing.", "o": "Add an upgrade test that loads rows written by the previous release and migrates them; add a version field to stored documents; document how to roll back (restore a backup).", "q": "How would you roll back a release that includes a bad migration?"}], "riskNote": "Risk ids are descriptive names. No backlog identifiers apply: this is the first guide for the module, written on 2026-10-15 from the code of main. Items worded 'looks' or 'can' are judgement from reading the statements, not measured defects.", "adrs": [{"t": "R2DBC at run time, Flyway over JDBC for the schema", "ctx": "The engine is reactive; Flyway has no R2DBC support.", "dec": "Stores use Spring's DatabaseClient over R2
