xecution log", "ctx": "Events must keep their order and must not slow down the engine.", "dec": "A queue and one thread that inserts in batches and also does reads, rewrites and trims.", "con": "Ordered, cheap and simple to reason about; one slow statement (a trim, a rewrite) delays all appends and can overflow the queue.", "alt": "Insert on the calling thread: simple but couples engine speed to the database. A message broker: durable but another system.", "rev": "the queue overflows in normal operation."}, {"t": "Blocking waits behind the blocking interfaces", "ctx": "NodeCheckpointStore.isFinished, SessionHistoryStore and the log store are plain methods in their interfaces.", "dec": "Implement them by waiting on the reactive statement with a timeout, and fall back to a safe value.", "con": "Works with callers that are not reactive; occupies the calling thread and hides a slow database behind 'unfinished' or 'empty'.", "alt": "Make the interfaces reactive: cleaner, a change in core and plugin-api.", "rev": "the waits show up in latency, or a caller runs on an event-loop thread."}, {"t": "Store checkpoints one row per message, no size cap", "ctx": "A restart needs a node's whole output and nodes can produce large messages.", "dec": "Insert each message as a JSONB row; PostgreSQL stores large values out of line.", "con": "No cap and no special handling for large messages; resume loads the output into memory.", "alt": "Files (the other store) with their own caps; an object store with references for large payloads.", "rev": "payload sizes require a claim-check reference."}], "evo": [{"id": "now", "n": "Today", "d": "Nine tables, seven stores, a lease. Statements are single and safe; recovery rewrites and multi-step operations are not atomic; the fencing number is unused.", "r": []}, {"id": "safe", "n": "Make recovery safe", "d": "Transactional rewrite of the log, durable start and end events, transactions for the multi-step operations.", "r": ["logReplaceAll", "logDrop  var msg=$("#copyMsg"),ta=$("#copyArea");if(!any){msg.textContent="Nothing to copy yet. Set a status or note first.";return}
 ta.hidden=false;ta.value=md;ta.rows=10;
 var done=function(){msg.textContent="Copied."},fail=function(){msg.textContent="Select the text below and copy it."};
 try{navigator.clipboard.writeText(md).then(done,fail)}catch(e){fail()}};
board();

document.addEventListener("click",function(e){var r=e.target.closest("[data-risk]");if(r){e.preventDefault();openRisk(r.getAttribute("data-risk"));return}
 var c=e.target.closest("[data-comp]");if(c){e.preventDefault();pick(c.getAttribute("data-comp"));$("#map").scrollIntoView({behavior:"smooth"})}});

if(D.prompts&&D.prompts.length){var pi=0;
 var deck=function(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
  $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}};
 deck()}
/* ---- glossary ---- */
function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
