# pnpm 12 fails the install on dependency build scripts nobody approved.
# msw only runs in Node here (msw/node), so its postinstall (copies the browser worker) is not needed.
allowBuilds:
  msw: false

# jsdom and another dev dependency pin undici and systeminformation exactly, below the patched releases (Dependabot alerts).
# Drop these once their parents ship the fixed range.
overrides:
  "undici@>=7 <8": 7.30.1
  "undici@>=8": 8.12.2
  systeminformation: 5.33.16

# eslint, typescript-eslint, ts-morph and socks pin versions below the patched releases (OSV: GHSA-g3hv-75wg-m249,
# GHSA-mrhx-c7xc-m3w5, GHSA-rxp7-6hxx-x8q5). Dev-only paths. Drop these once their parents ship the fixed range.
  "minimatch@>=7 <11": 11.0.5
  "zod@<4.6.6": 4.6.7
  "ip-address@<10.7.4": 10.7.6
