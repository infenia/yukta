y header. fetchApi adds neither, and a browser EventSource cannot set headers at all. The result: the app loads and then every call fails, and the error text on the home page ('Check that the Yukta server is running') points the operator the wrong way. Re-checked 2026-10-15: still open. There is also no handling of 401/403 anywhere in the UI (the only status check is 429), and boot's ExposureGuard requires a key whenever the server is not on loopback, so every non-local deployment hits this. Evidence: ui/src/lib/apiClient.ts:48-51, ui/src/hooks/useEventSourceJson.ts:47, web ApiKeyFilter.java:122-125.", "o": "A key prompt kept in memory or sessionStorage and added by fetchApi; replace EventSource with fetch-based streaming that can send headers; or a same-origin session cookie issued by the server; or a reverse proxy that injects the header. At minimum, show a 'server requires an API key' message on 401/403.", "q": "How are remote operators meant to use the UI when a key is required, and is a single shared key acceptable for browsers?"}, {"id": "startRetryKey", "t": "Start retry gets a new Idempotency-Key", "a": "Correctness", "i": 3, "e": 1, "c": ["api", "run"], "why": "In my reading of the code, mutations are configured to retry once and the key is generated inside the function that sends the request, so a retried start carries a different key. The point of the key is that a repeated start returns the first run. Example: the first request is accepted but the response is lost; the retry has a new key, so a second run starts. The same retry setting also repeats Restart and 'Restart from here', which have no key. Wider than the start call: mutations default to retry:1 (ui/src/lib/queryClient.ts:15), so signal (approve/reject), rollback, version notes and stop/skip are also repeated after a timeout. A 409/403/429 is retried pointlessly and delays the error shown. Since #392 the server answers a second signal on the same key within 5 s as NOT_WAITING (a double-submit guard, SignalWaits.DUPLICATE_WINDOW), so a retried approval no longer lands twice, but the retry then reports a conflict although the first attempt succeeded.", "o": "Set mutations retry to 0 (start is covered by its Idempotency-Key once the key is created per click, useExecutionControl.ts:41); or retry only on network errors.", "q": "Is a duplicate run harmful for your workflows, and should the UI ever retry a start automatically?"}, {"id": "legacyAliases", "t": "Status calls use deprecated server paths", "a": "Evolvability", "i": 2, "e": 1, "c": ["api", "run"], "why": "The status snapshot and the status stream use /api/workflow/{session}/status/..., which the server marks deprecated in favour of /api/executions/{id} and /api/executions/{id}/status/stream. The E2E mocks use the same legacy paths. When the aliases are removed the run view silently stops updating. Start, history and the workflow-wide stop have no replacement path, so they are not deprecated. Still open: getWorkflowProgress.ts:12 and useExecutionProgress.ts:51; e2e mocks in ui/e2e/fixtures.ts:259,266.", "o": "Switch the two calls and the mocks to /api/executions/...; add a note in the OpenAPI deprecation window.", "q": "When is the server planning to remove the legacy aliases, and who tells the UI?"}, {"id": "replayNoLastId", "t": "Reconnects replay everything", "a": "Performance", "i": 3, "e": 3, "c": ["live", "logs", "run"], "why": "The server numbers events, honours Last-Event-ID and sends a keep-alive every 15 s, but each reconnect creates a brand new EventSource without the id. A run with 100,000 stored log lines is re-sent in full on every reconnect, and the UI must then discard it. On a flaky network that multiplies bandwidth and server work. Now affects three streams: logs, status and results (useExecutionResults.ts:71). The server honours Last-Event-ID on all of them (LogManagementController.java:78,107, ExecutionController.java:152, ExecutionResultController.java:64).", "o": "Let the browser's own reconnect run while readyState is CONNECTING (it sends Last-Event-ID); close and back off only when CLOSED. Track the last event id per stream and send it (a header with fetch streaming, or a query parameter if the server accepts one); or let the browser's built-in reconnect do it instead of creating a new source.", "q": "How long can a run's log be, and how often do operators' connections drop?"}, {"id": "logDedupe", "t": "Log de-duplication by content (judgement)", "a": "Correctness", "i": 2, "e": 2, "c": ["logs"], "why": "In our view, comparing time, plugin, stream and text is fragile in two ways. Two real lines that are identical and share a timestamp become one, so a loop printing the same message looks shorter than it was. And the remembered keys are capped at 2,000, so on a run with more lines a reconnect can re-add old lines the set already forgot, pushing the real tail out of the 2,000-line buffer. Update: the cap is now MAX_LOG_ENTRIES = 20,000 (useExecutionLogs.ts:10,57), so the forgotten-key problem starts past 20,000 lines instead of 2,000. The key is still timestamp|pluginId|stream|message; server event ids are not used.", "o": "Use the server's event ids to drop replays, which also makes the content key unnecessary; or add a sequence number to log entries.", "q": "Do operators rely on exact line counts, for example to spot a loop?"}, {"id": "pollControl", "t": "Control page polls though an event stream exists", "a": "Scalability", "i": 2, "e": 2, "c": ["ops"], "why": "The Control page fetches the node list and the supervisor table every 5 seconds per open browser. The server already offers /api/events/stream, which carries node and workflow status changes and control outcomes. With many operators this is steady background load, and changes still appear up to 5 s late. Note the stream is not replayed and a slow reader misses events, so the counters would still need an occasional snapshot. Update: now four 5 s polls: ControlPage.tsx:54, SupervisorsPanel.tsx:33, ControlAuditPanel.tsx:25 and PendingApprovals.tsx:26. Nothing opens /api/events/stream.", "o": "Open the events stream and refetch only when a relevant event arrives, keeping a slow poll as a safety net.", "q": "How many people will keep the Control page open at once?"}, {"id": "deadSanitiser", "t": "Sanitiser dependency and docs are out of step", "a": "Governance", "i": 2, "e": 1, "c": ["build", "builder"], "why": "dompurify is still in package.json, but nothing in src imports it, there is no renderNodeHtml function, and the plugin node HTML (uiDesign) is typed but never rendered. The guides and the server's CSP comment still say plugin HTML is sanitised. If someone later renders uiDesign.html they will assume a safe path exists. Meanwhile the dependency adds supply-chain surface for no use. Still open: ui/package.json:64 lists dompurify; no import in ui/src; plugin-api UiDesign.java:9 and ui-improvements.md:21 still claim sanitising.", "o": "Remove the dependency and the claims, or, if plugin HTML will be rendered, add one audited render function with a test and keep the CSP.", "q": "Is rendering plugin-supplied HTML still on the roadmap?"}, {"id": "iconGap", "t": "Decision plugins fall back to the category icon", "a": "Functionality", "i": 1, "e": 1, "c": ["design", "builder", "ops"], "why": "The plugin icon map has no entry for CLASSIFY, GATE, SCORE, ASK, ANOMALY or DEDUPE, which exist as plugin types. They draw the generic processor icon, so on a canvas six different decision steps look identical. The map is hand-edited and the font must be rebuilt for each new icon, so every new plugin repeats this chore. Still open: pluginIcons.ts:7-33 has no CLASSIFY, GATE, SCORE, ASK, ANOMALY or DEDUPE.", "o": "Add the six entries and rerun pnpm run icons; longer term let a plugin declare its icon name in its metadata.", "q": "Should the server own plugin presentation (icon, colour) so the UI needs no per-plugin change?"}, {"id": "noTestGate", "t": "Unit tests are not part of check or CI", "a": "Governance", "i": 3, "e": 2, "c": ["build"], "why": "There are 75 Vitest files and a 100% coverage threshold in the config, but in build.gradle.kts the unit tests are commented out of 'check', and I found no Vitest call in the CI workflow. The CI runs ':ui:build' (type checks, build, size guard) and a separate Playwright job. A regression covered only by a unit test can merge unnoticed. The old guide's '98% coverage' is therefore unverified by any gate. Still open: ui/build.gradle.kts:81-85 (dependsOn(pnpmTest) commented out); .github/workflows/ci.yml has no Vitest step; now 81 test files with 100% thresholds in vitest.config.ts:27-31.", "o": "Add pnpmTest to 'check' and run coverage in CI; run the API types check in a job that boots the server.", "q": "Is the threshold of 100% meant to be a hard gate, and who owns it?"}, {"id": "wholeSessionSave", "t": "Builder saves the whole session, last write wins", "a": "Correctness", "i": 3, "e": 3, "c": ["builder"], "why": "Save sends the complete session (every workflow and the tags) to POST /api/sessions, which replaces the stored one. Example: Ana and Ben both open session 'ci'. Ana edits workflow build and saves. Ben, who loaded the session earlier, edits workflow deploy and saves: Ana's change to build is overwritten with Ben's older copy. The editor loads fresh data but there is no version check at save time. Update: the new Versions panel lets someone recover an overwritten edit by hand, but it does not prevent the overwrite (WorkflowEditorPage.tsx:149-152, no ETag or version check).", "o": "A version or ETag the server compares on save; a per-workflow update endpoint; or a conflict message.", "q": "Will more than one person edit a session at the same time?"}, {"id": "freeStatus", "t": "Statuses are free strings and mapped by hand", "a": "Evolvability", "i": 3, "e": 3, "c": ["status", "api"], "why": "The server publishes statuses as plain text, so the type checker cannot say when a new one appears. The mapper then shows an unknown node status as 'pending' and an unknown run status as 'unknown', quietly. Example: a new status meaning 'waiting for approval' would show as pending and the Pause button's logic would be wrong. The generated API types make every field optional, so hand-written types remain the working types. Still open: statusMapper.ts:69-82 maps unknown statuses to pending/unknown; ui/src/types/api.generated.ts is not imported anywhere.", "o": "Publish a status enum from core and generate unions; add a visible 'unknown status' state with the raw word; fail a test when a new server status is not mapped.", "q": "Who is the owner of the status vocabulary, core or the UI?"}, {"id": "stopAllRuns", "t": "Three of four Stop choices hit all runs", "a": "Operability", "i": 3, "e": 2, "c": ["run"], "why": "'Drain', 'Cancel' and 'Kill all runs' call the workflow-wide stop, which stops every active run of that workflow, including runs started by other people or by a schedule. The menu label says 'all runs' and a confirmation dialog follows, but the dialog text is generic ('This cannot be undone'). An operator wanting to stop only the run on screen with KILL has no such option. Still open: RunControls.tsx:152-157 and the generic confirm at :185 (no count of affected runs). The per-run stop takes no mode, so a per-run Kill is not possible.", "o": "Offer the stop modes per run (if the server supports them), and name the number of affected runs in the confirmation.", "q": "Is stopping every run of a workflow a common need, or a footgun?"}, {"id": "uiGaps", "t": "Operations that exist only in REST", "a": "Functionality", "i": 2, "e": 3, "c": ["run", "builder", "shell"], "why": "Done since the last review: pending approvals (approvals.ts, PendingApprovals.tsx) and workflow versions with diff, rollback and notes (versions.ts, WorkflowVersionsPanel.tsx). Still REST/MCP only: delete for sessions or workflows (SessionRowActionsMenu.tsx has only View Details), breakpoints add/clear, priority, scheduler limits, recovering an aborted run (/executions/{id}/recover), run search (GET /api/executions) and GET /api/workers (ExecutionControlController.java:91,285,348,361,377; WorkersController.java:32). Operators fall back to curl or MCP for these.", "o": "Prioritise by operator pain: recover and delete first, then breakpoints and limits; keep the rest as documented REST.", "q": "Which of these would an operator reach for first during an incident?"}, {"id": "pagingCaps", "t": "No paging beyond one page everywhere", "a": "Scalability", "i": 2, "e": 2, "c": ["ops", "run", "api"], "why": "History asks for 50 runs and ignores the cursor header, the run picker shows whatever the server returns (default 500), and the session list loads every summary then pages 10 at a time in the browser. A busy session loses older runs from view, and a deployment with thousands of sessions pays a large first call. Still open, and the server now has history filters (workflowId, status, text, since, until, X-Next-Cursor) that the UI does not use: HistoryPage.tsx:16,22, getWorkflowExecutions.ts:11-12, getSessionSummaries.ts:8.", "o": "Follow X-Next-Cursor with a 'load more'; add server filters for status and time; page sessions on the server.", "q": "How many sessions and runs per workflow do you expect after a year?"}, {"id": "noDraftGuard", "t": "Unsaved builder edits vanish silently", "a": "Operability", "i": 2, "e": 2, "c": ["builder", "shell"], "why": "The draft is held in memory. A click on a header link, the Back button or a reload discards it and I found no confirmation or draft storage in the code. Large node configurations typed into JSON boxes are costly to lose. Still open: no useBlocker, beforeunload or draft storage in ui/src.", "o": "A router blocker with a confirm prompt and/or a draft saved to sessionStorage.", "q": "Would auto-saving a draft in the browser be acceptable, or must unsaved work never leave the page?"}, {"id": "rollbackStaleDraft", "t": "After a rollback, Save can undo the rollback", "a": "Correctness", "i": 4, "e": 1, "c": ["builder", "run"], "why": "Rollback invalidates only ['sessions', sid, 'workflows'] (WorkflowVersionsPanel.tsx:62-65), but the editor reads ['sessions', sid, 'config'] (WorkflowEditorPage.tsx:377-381) and seeds its draft with useState (line 72). With cached data the editor renders at once and keeps the old draft after the refetch arrives. Example: roll back to v3, open the editor, press Save: the pre-rollback definition is written again. The same stale draft appears for changes made from the CLI or MCP.", "o": "Invalidate ['sessions', sid] on rollback; key the editor by the fetched data's update time or wait for isFetching to be false before seeding the draft.", "q": "Should the editor warn when the stored definition changed while it was open?"}, {"id": "dedupeEviction", "t": "Dedupe forgets evicted entries, so replay re-adds them", "a": "Correctness", "i": 3, "e": 2, "c": ["live", "logs", "run"], "why": "Logs: the seen-set is trimmed together with the buffer (useExecutionLogs.ts:57-59). Results: duplicates are checked only against the 500 events still held (useExecutionResults.ts:52-55). After more than 20,000 lines or 500 result events, a reconnect replays evicted entries; they pass dedupe and are appended out of order, and the 'earlier lines hidden' count is overstated. NODE_END and EXECUTION_END events also count toward the 500 cap, so they can push out real RESULT events.", "o": "Keep the highest server sequence or SSE id seen and drop anything at or below it; fixing replayNoLastId removes most of the problem.", "q": "Is a reordered line after a very long run acceptable?"}, {"id": "noteInQuery", "t": "Version notes travel in the URL", "a": "Security", "i": 2, "e": 2, "c": ["api", "run"], "why": "The note is a query parameter (versions.ts:57-59, WorkflowVersionController.java:152-153). Notes end up in access and proxy logs, and long notes fail on URL-length limits.", "o": "Send a JSON body {version, note} (server and client) and add a maxLength to the input (WorkflowVersionsPanel.tsx:121).", "q": "Can notes contain anything sensitive?"}, {"id": "approvalUx", "t": "Approvals: no confirm, no reason, one shared pending flag", "a": "Functionality", "i": 3, "e": 2, "c": ["run", "ops"], "why": "Reject fires at once (PendingApprovals.tsx:74-79). The data (reason) parameter the server accepts (ExecutionControlController.java:322) is never sent, 'since' is fetched but not shown, and one decide.isPending disables every row (lines 69, 76). The server now treats a repeat decision within 5 s as a duplicate and answers NOT_WAITING (#392); the UI has no handling for that answer, so a double click or an automatic retry shows an error for a decision that was applied.", "o": "Confirm on reject with an optional reason; show 'waiting 3m' from since; track pending per row. Treat NOT_WAITING/409 right after a decision as 'already answered' and refresh the list.", "q": "Who may approve, and should the reason be mandatory?"}, {"id": "approvalPoll", "t": "Approvals and audit are polled whatever the need", "a": "Scalability", "i": 2, "e": 2, "c": ["run", "ops"], "why": "PendingApprovals.tsx:23-27 polls the whole session every 5 s even with no live run, and filters by workflow in the browser (lines 39-41). The audit panel hard-codes limit=50 with no paging or executionId filter, although the server supports it (ControlAuditPanel.tsx:18, ControlAuditController.java:55).", "o": "Enable the approvals query only while an execution is non-terminal; add an execution filter or link from a run to its audit rows; or use the event stream.", "q": "How many sessions and operators will have the page open at once?"}, {"id": "e2eMocksGap", "t": "New endpoints are not mocked in the E2E fixtures", "a": "Governance", "i": 3, "e": 2, "c": ["build", "run"], "why": "ui/e2e/fixtures.ts:253-270 mocks graph, executions, status and logs, but not /approvals, /result the confirmation, warn when the run is not terminal.", "q": "Should rollback be blocked while a run is live?"}], "adrs": [{"t": "A single-page app served from the same jar and origin", "ctx": "Operators need a web UI, but Yukta is deployed as one Spring Boot app, often as a native image.", "dec": "Build the React app to static files, copy them into the ui jar and let boot serve them with an index.html fallback and a CSP.", "con": "One artifact to deploy, no CORS, caching rules are simple (hashed assets for a year, index.html never cached). The API cannot be reached from a differently hosted UI without extra work, and the app needs the API key story solved on the same origin.", "alt": "A separately hosted front end or CDN: easier independent releases but needs CORS, two deployments and a second auth story. Server-rendered pages (templates): less JavaScript, but poor fit for live graphs and streams.", "rev": "UI and server need independent release cycles, or the UI must be offered as a hosted product."}, {"t": "Live data over server-sent events with replay and client de-duplication", "ctx": "Runs are long and operators want immediate status and logs.", "dec": "Use EventSource streams. On every connection the server replays history, the client reconnects with backoff and drops repeats.", "con": "Simple server and client code, works through most proxies, and a missed message is repaired by the replay. Costs: replay on each reconnect, no resume token used, no headers for authentication.", "alt": "WebSockets: two-way and can carry auth, but need a handshake protocol, more server code and are harder through proxies. Polling: simplest, but laggy and wasteful at scale.", "rev": "Streams must carry authentication, or reconnect cost for long logs becomes noticeable."}, {"t": "One status chokepoint over free-text server statuses", "ctx": "The server exposes statuses as strings, and different screens would otherwise interpret them differently.", "dec": "All translation happens in one mapper; unknown values degrade to pending or unknown instead of crashing.", "con": "Easy to fix a quirk once (as with NODE_STOPPED). Quiet failure on new statuses and manual upkeep.", "alt": "A generated enum from OpenAPI: safer, but impossible until core publishes one. Interpreting status words in each component: faster to write, guaranteed to drift.", "rev": "Core publishes a status enum (the backlog item the code refers to as core S1)."}, {"t": "Form-based builder driven by plugin schemas, not drag-and-drop", "ctx": "Plugins come and go and each has different settings. A drawing editor would need a design per plugin.", "dec": "Edit one workflow with lists and dropdowns and generate each node's form from its config schema; preview on the same canvas as the run view; validate on the server.", "con": "New plugins work immediately and the validity rules stay on the server. Editing large graphs is slow and the experience is plainer than a canvas editor.", "alt": "A drag-and-drop canvas editor: friendlier but a large build with custom node UIs. Raw JSON editing only: trivial, but error-prone and not discoverable.", "rev": "Operators build graphs of dozens of nodes routinely, or non-technical users become the main audience."}, {"t": "Hand-written types as working types, generated types as a drift check", "ctx": "OpenAPI-generated types mark every field optional, which makes them awkward to use.", "dec": "Keep readable hand-written types; generate the OpenAPI types into the repo and fail the type check if a hand-written type and its server schema stop having the same fields.", "con": "Pleasant code and still protection against renamed fields. Two sources of truth; the regeneration check needs a running server and is not in the normal build.", "alt": "Use the generated types directly: single source but optional-everywhere noise. No types from the server: simplest, but the bugs that motivated this (wrong error shape, wrong status set) return.", "rev": "The server marks required fields in OpenAPI, so the generated types become usable."}, {"t": "Hard size budgets with lazy routes and vendor chunks", "ctx": "The first version shipped a 3.96 MB icon font and a single 887 KB script.", "dec": "Lazy-load all routes but the home page, split vendor code, subset the icon font, and fail the build above 300 KB per script or 100 KB for the font.", "con": "Regressions are caught at build time. The budget measures bytes, not time, and icons need a manual regeneration step.", "alt": "Reviewer vigilance only: cheap but regresses silently. A full performance budget with Lighthouse in CI: more accurate but slower and flakier.", "rev": "A chunk legitimately needs to exceed 300 KB, or the build moves to a different bundler with different chunking."}, {"t": "Five minute query cache plus invalidation on change, no refocus refetch", "ctx": "Most data (sessions, graphs, plugin list) changes rarely, and the hot data (status, logs) is streamed.", "dec": "Keep fresh data for 5 minutes, disable refetch on window focus, invalidate related queries after our own mutations, retry once.", "con": "Fast navigation and few requests. Other users' changes appear late and the blanket retry affects mutations.", "alt": "Always refetch on mount: always correct, many requests. Short polling everywhere: simple, but load grows with users.", "rev": "Multiple operators edit the same sessions, or stale lists cause real mistakes."}, {"t": "Design tokens in Tailwind 4 with copied-in shadcn components on Base UI", "ctx": "A consistent look with dark mode and little custom CSS, without locking into a component library's release cycle.", "dec": "Define tokens in CSS, copy shadcn primitives into the repo, use Material Symbols from a self-hosted subset and enforce usage by convention.", "con": "Full control and a small bundle. Upgrading a primitive is a manual copy with three fixes, and nothing machine-enforces the token rules.", "alt": "A packaged component library: fastest to start, heavier and harder to restyle. Hand-written CSS: maximum control, no shared system.", "rev": "The brand or accessibility needs change enough that the tokens no longer fit, or the manual copy upkeep becomes costly."}], "evo": [{"id": "now", "n": "Today", "d": "A same-origin SPA served by boot. Streams and REST work with no key. Builder, plugins, history and control pages exist; unit tests run only by hand.", "r": []}, {"id": "auth", "n": "Make it usable on a protected server", "d": "Choose a browser auth model, make fetch and the streams carry it, and show a clear 'sign in' state instead of 'server not running'.", "r": ["noAuthHeader"]}, {"id": "safe", "n": "Safer actions", "d": "One idempotency key per click, no automatic retry of non-idempotent calls, per-run stop modes, a draft guard and a version check on save.", "r": ["startRetryKey", "stopAllRuns", "noDraftGuard", "wholeSessionSave"]}, {"id": "events", "n": "Use the event model fully", "d": "Resume streams with Last-Event-ID, switch to /api/executions/... paths and drive the Control page from the global event stream.", "r": ["replayNoLastId", "logDedupe", "legacyAliases", "pollControl"]}, {"id": "contract", "n": "Tighten the contract", "d": "When core publishes a status enum, generate unions, take icons from plugin metadata and run the unit and type-drift checks in CI.", "r": ["freeStatus", "iconGap", "noTestGate", "deadSanitiser"]}, {"id": "reach", "n": "Close the REST gap", "d": "Add delete, run search, paging and resume as operators ask for them (approvals and versions are done).", "r": ["uiGaps", "pagingCaps"]}], "prompts": [["Security", "Your server is exposed to the team and a key is required. Walk through what the first screen shows and how an operator recovers. What would you build?", "api", "noAuthHeader"], ["Reliability", "A start request times out in the browser but the server accepted it. What does the user see, how many runs exist after the retry, and how would you prove it?", "run", "startRetry .", "Gives the left-to-right layout."], ["DAG", "Directed acyclic graph: nodes joined by one-way edges with no loops.", "The shape of every Yukta workflow."], ["Trigger / Processor / Terminal", "The three kinds of node: start, transform, end.", "Their colours are orange, blue and slate on the canvas."], ["Config schema", "A plugin's own list of settings with types, defaults and descriptions.", "Drives the generated forms."], ["Engine policy", "Per-node failure and timing options (onError, retry, trigger rule, timeouts, failure budget) handled by the engine, not the plugin.", "The 'Error handling and retries' panel edits it."], ["Idempotency-Key", "A header that makes a repeated start return the first run instead of starting another.", "The UI sends a fresh one per click."], ["Stop modes (DRAIN, CANCEL, KILL)", "Gentle, cancelling and immediate ways to stop a run.", "Workflow-wide in the UI's menu."], ["Control bus and supervisor", "The channel through which commands reach runs, and the automated watchers that send commands.", "Shown on the Control page."], ["API key", "A shared secret the server can require in a header on every /api call.", "The UI does not send one."], ["CSP (Content-Security-Policy)", "A response header that tells the browser which sources of scripts, styles and connections are allowed.", "Limits what injected content could do."], ["Tailwind CSS and design tokens", "A utility-class styling system, with colours, spacing and type defined once as named variables.", "Enables dark mode and consistent look."], ["shadcn / Base UI", "Copy-in component source (shadcn) built on unstyled, accessible primitives (Base UI).", "The buttons, menus and tables."], ["Material Symbols subset", "The icon font reduced to just the glyphs used.", "13.7 KB instead of 3.96 MB; must be regenerated when icons change."], ["OpenAPI and openapi-typescript", "OpenAPI describes the server's endpoints; the tool turns that description into TypeScript types.", "Used for the drift ch $("#boardBody").addEventListener("click",function(e){var d=e.target.closest("[data-open]");if(d)openRisk(d.getAttribute("data-open"))});
$("#vList").onclick=function(){view="list";$("#vList").setAttribute("aria-pressed","true");$("#vGrid").setAttribute("aria-pressed","false");board()};
$("#vGrid").onclick=function(){view="grid";$("#vGrid").setAttribute("aria-pressed","true");$("#vList").setAttribute("aria-pressed","false");board()};
$("#statFilter").onchange=function(e){stF=e.target.value;board()};
$("#rq").oninput=function(e){rq=e.target.value.trim().toLowerCase();board()};
function openRisk(id){view="list";$("#vList").setAttribute("aria-pressed","true");$("#vGrid").setAttribute("aria-pressed","false");aOn={};attrs.forEach(function(a){aOn[a]=true});$$("#attrFilters button").forEach(function(b){b.setAttribute("aria-pressed","true")});stF="";rq="";$("#statFilter").value="";$("#rq").value="";board();
 var d=$("#r-"+id);if(d){d.open=true;d.classList.add("hl");d.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(function(){d.classList.remove("hl")},2000)}}
$("#copyBtn").onclick=function(){var md="# Yukta "+MOD+": my architecture notes\n\n";var any=false;D.risks.forEach(function(r){var n=notes[r.id];if(!n)return;any=true;md+="## "+r.t+"\n- Attribute: "+r.a+" · impact "+r.i+" · effort "+r.e+"\n"+(n.s?"- Status: "+n.s+"\n":"")+(n.n?"- Note: "+n.n.replace(/\n/g,"\n  ")+"\n":"")+"\n"});
 var msg=$("#copyMsg"),ta=$("#copyArea");if(!any){msg.textContent="Nothing to copy yet. Set a status or note first.";return}
 ta.hidden=false;ta.value=md;ta.rows=10;
 var done=function(){msg.textContent="Copied."},fail=function(){msg.textContent="Select the text below and copy it."};
 try{navigator.clipboard.writeText(md).then(done,fail)}catch(e){fail()}};
board();

/* ---- jumps ---- */
document.addEventListener("click",function(e){var r=e.target.closest("[data-risk]");if(r){e.preventDefault();openRisk(r.getAttribute("data-risk"));return}
 var c=e.target.closest("[data-comp]");if(c){e.preventDefault();pick(c.getAttribute("data-comp"));$("#map").scrollIntoView({behavior:"smooth"})}});
document.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target;if(t.matches&&t.matches("a.chip,.dot")){e.preventDefault();t.click?t.click():0}});

/* ---- prompts ---- */
if(D.prompts&&D.prompts.length){var pi=0;
 var deck=function(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
  $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}};
 deck()}
/* ---- glossary ---- */
function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
</script>
</body>
</html>
