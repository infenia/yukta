<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta ui Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
  <div class="others" id="others"></div>
</nav>
<main id="main"></main>
</div>
<script>
var DATA = {"module": "ui", "title": "How the Yukta ui works, and where it can break", "htmlTitle": "Yukta ui Guide", "date": "2026-10-15", "glance": {"lede": "The ui is the browser app operators use to work with Yukta: list sessions, build and edit workflows through forms, start, pause and stop runs, and watch a live graph with progress and logs. It is a React single-page app (one HTML page that draws every screen in the browser) that talks to the server only through the REST and live-stream endpoints under /api. This page is for thinking about it: open a component, play a scenario, then challenge the weak spots.", "props": [["Thin client", "The UI holds no business rules. The server decides what is valid; the UI shows it, sends commands, and mirrors the status the server reports."], ["Live by streaming", "Progress and logs arrive over server-sent events (a one-way live stream). The page reconnects after a drop and tolerates replayed history."], ["Forms, not drawing", "Workflows are built with forms driven by each plugin's own config schema. The graph is a preview, not an editor."], ["One jar, same origin", "The built app is copied into the ui jar and served by boot with a Content-Security-Policy, so there is no CORS and no separate web host."]], "start": [["primer", "Primer", "New here? Start with the problem, the vocabulary and one worked example: opening a run and watching it live"], ["map", "System map", "Ten components and how data and commands flow between them"], ["map", "Replay a visit", "Five scenarios: watch a run, a dropped stream, build and save, steer, and a protected server"], ["guarantees", "What the UI keeps", "Timings, caps and what is lost on a reload"], ["reference", "Lookup tables", "Routes, the endpoints the UI calls, status mapping, bundle sizes, commands"], ["quality", "Stress it", "Scalability, performance, availability, security lenses"], ["board", "Challenge it", "Open risks, an impact x effort grid, your own notes"], ["adrs", "Decisions", "Eight ADRs, each with a 'revisit when' trigger"]]}, "primer": {"problem": "Yukta runs workflows (graphs of steps) on a server. People still need to see them: which sessions exist, what a workflow looks like, which run is in progress, which step failed, what the logs say, and they need buttons to start, pause or stop a run. Without a UI they would do this with curl and by reading JSON. The <b>ui<\/b> module is that screen. It is a React app built once into static files, served by the Yukta server, and it asks the server for everything it shows.", "analogy": "Think of a cockpit display for an aircraft whose engine lives elsewhere. The display (<b>ui<\/b>) has no engine of its own. It reads gauges (<b>REST snapshots<\/b>), listens to a live telemetry feed (<b>SSE streams<\/b>) and sends commands over a wire (<b>POST calls<\/b>). If the wire is cut the display goes stale, it cannot invent data, and it must reconnect and catch up when the wire returns.", "layersTitle": "Where the ui sits", "layers": [["Operator's browser", "Opens the app, clicks, watches", ""], ["ui", "The React app. This page.", "me"], ["boot", "Serves the built files, falls back to index.html for app routes, sets the CSP", ""], ["web", "The /api REST and SSE endpoints the app calls", ""], ["core + plugins", "Run the workflows; the UI never talks to them directly", ""]], "layersNote": "The ui knows only the HTTP contract of web. It does not know how runs execute, and it ships no plugin code.", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["Session", "A workspace that groups workflows, runs and configuration. The home page lists sessions; a session page lists its workflows.", "Example: one team's CI pipelines."], ["Workflow and run", "A <b>workflow<\/b> is a graph of nodes and edges stored on the server. A <b>run<\/b> (execution) is one live execution of it, with its own id and status.", "Run controls act on one run; the workflow page shows its history."], ["Node and plugin", "A <b>node<\/b> is one step. Its <b>plugin type<\/b> (HTTP_REQUEST, LLM_CALL...) decides what it does and which settings it has. Kinds: trigger, processor, terminal.", "The Plugins page lists every type and its settings."], ["ApiResponse envelope", "Every REST answer wraps its payload in an object with status, message, data and optional field errors. The API client unwraps it so callers see only the data or a thrown error.", "A 400 arrives as an ApiError carrying the server's message and a list of field errors."], ["Query cache", "TanStack Query keeps fetched data in memory, keyed by name. Data is 'fresh' for 5 minutes, so moving between pages does not refetch.", "Saving a workflow invalidates the cache so lists refresh."], ["SSE stream and replay", "Server-sent events: the browser opens one long HTTP request and the server pushes lines. On every (re)connect the server replays history first, so the page must ignore duplicates.", "Progress frames are whole snapshots, so repeats are harmless; log lines need de-duplication."], ["Config schema", "Each plugin describes its settings (name, type, required, default). The builder turns that list into form fields, so a new plugin needs no UI change.", "SECRET fields show the placeholder decrypted:key."], ["Stop modes", "DRAIN lets in-flight work finish, CANCEL cancels it, KILL ends it at once. In the UI three of the four Stop choices apply to every run of the workflow, not just the one on screen.", "'Drain all runs' is a workflow-wide action."]], "ex": {"title": "One example, end to end", "lede": "You open a workflow's run page and watch a run live. Click a step to see what happens, why, and where it can go wrong.", "viewBox": "0 0 880 230", "labels": ["What happens", "Why", "Can go wrong"], "legend": "Green = you · Blue = the page's own code · Grey = a live stream from the server", "nodes": [{"id": "open", "n": "Open run page", "s": "you", "k": "t", "x": 10, "y": 40, "does": "You open /sessions/demo/workflow/main, perhaps from the History page, whose links add ?exec=<run id>. The server returns the one index.html for any path that is not /api, /assets or similar.", "adds": "A single page app has one real file; the browser router decides which screen to draw. boot also adds a Content-Security-Policy header so the page can only load scripts and connect to its own origin.", "wrong": "If the server was started with yukta.api-key (needed for remote access) the page loads but every /api call then answers 401, because the UI sends no key (risk noAuthHeader)."}, {"id": "load", "n": "Load page code", "s": "lazy route", "k": "p", "x": 190, "y": 40, "does": "The router downloads the code for this route only now: the run page, with React Flow (the graph drawing library) and dagre (the layout library).", "adds": "Keeps the first download small. The build fails if any JavaScript file is over 300 KB, so no single route can bloat the app unnoticed.", "wrong": "On a slow network the area stays empty until the file arrives. In our view a tab left open across a deploy can fail to load a route, because file names carry a content hash that changes per build."}, {"id": "fetch", "n": "Fetch graph+runs", "s": "REST + cache", "k": "p", "x": 370, "y": 40, "does": "Two GET calls: the workflow graph and the list of its runs. The API client builds the URL with ids encoded, unwraps the envelope and hands the data to TanStack Query.", "adds": "Results are cached for 5 minutes, so coming back to this page is instant. A failed query is retried once.", "wrong": "Because of the 5 minute cache, a graph changed by someone else can look old for up to 5 minutes. Saving from this browser tab invalidates the cache, other people's saves do not."}, {"id": "pick", "n": "Pick a run", "s": "?exec= param", "k": "p", "x": 550, "y": 40, "does": "If the URL has ?exec=<id> and that run is in the list, it is shown. Otherwise the newest run is shown. With no runs at all the page shows the never-run state.", "adds": "Keeping the choice in the URL makes a run linkable and survives a reload. Changing it replaces the history entry, so the Back button is not filled with run switches.", "wrong": "A run id that is not in the fetched list (for example an old run beyond the server's page of 500) silently falls back to the newest run."}, {"id": "prog", "n": "Progress stream", "s": "SSE, server", "k": "e", "x": 730, "y": 40, "does": "The page fetches one status snapshot, then, if the run is not finished, opens a stream to /api/workflow/{session}/status/{run}/stream?includeHistory=true. Each frame is the whole progress object (run status plus every node's status).", "adds": "Because each frame is a full snapshot the newest simply replaces the previous, so replayed or repeated frames do no harm. The stream is closed when the run is finished (a terminal status and an end time).", "wrong": "If the connection drops, the hook waits 1 s, then 2 s, 4 s... up to 30 s and opens a new stream. The server supports resuming from a Last-Event-ID, but a new stream never sends one, so the server replays from the start (risk replayNoLastId)."}, {"id": "logs", "n": "Log stream", "s": "SSE, server", "k": "e", "x": 730, "y": 150, "does": "A second stream, .../executions/{run}/logs/entries, sends stored log lines first and then live ones. Lines are collected for 100 ms and added in one go, kept to the newest 2,000, and drawn in a scrolling list with fixed 20 px rows.", "adds": "Batching means a burst of 500 lines causes one redraw instead of 500. Only the visible rows exist in the page, so 2,000 lines stay cheap.", "wrong": "Replay after a reconnect is removed by comparing time, plugin, stream and text. Two genuinely identical lines in the same instant collapse into one, and runs with more than 2,000 lines can show old lines again after a reconnect (risk logDedupe)."}, {"id": "paint", "n": "Paint the DAG", "s": "dagre + status", "k": "p", "x": 550, "y": 150, "does": "dagre arranges nodes left to right; each node is drawn as a card whose colour and icon come from its status. An edge animates while its source has completed and its target is running.", "adds": "Raw server statuses are turned into six UI states (completed, running, pending, failed, paused, skipped) in exactly one file, so every screen agrees.", "wrong": "A node status the mapper does not know shows as 'pending', quietly. Statuses are free text on the server until core defines an enumeration."}, {"id": "steer", "n": "Pause a node", "s": "you", "k": "t", "x": 370, "y": 150, "does": "The node's menu offers only actions that fit its status: a running node can be paused, stopped, skipped or put in step mode; a failed node can be retried. Clicking sends POST /api/executions/{run}/nodes/{node}/pause.", "adds": "The UI does not mark the node paused itself. It waits for the server to confirm through the next progress frame, so the screen never shows a state the server did not report.", "wrong": "In our view, while the progress stream is reconnecting the click can seem to do nothing, because streamed state takes precedence over the refetched snapshot."}], "edges": [["open", "load"], ["load", "fetch"], ["fetch", "pick"], ["pick", "prog"], ["prog", "paint"], ["prog", "logs"], ["paint", "steer"]], "start": "prog", "json": {"title": "See one progress frame", "note": "Simplified: only the fields the UI reads. Statuses are plain strings; the values shown are examples.", "text": "{ \"executionId\": \"e-42\", \"sessionId\": \"demo\", \"workflowId\": \"main\",\n  \"status\": \"RUNNING\", \"controlState\": null,\n  \"startTime\": \"2026-10-12T09:00:00Z\", \"endTime\": null,\n  \"tasks\": [\n    { \"nodeId\": \"fetch\",  \"module\": \"HTTP_REQUEST\", \"status\": \"SUCCESS\" },\n    { \"nodeId\": \"review\", \"module\": \"LLM_CALL\",     \"status\": \"RUNNING\",\n      \"metadata\": { \"progress\": 40 } },\n    { \"nodeId\": \"notify\", \"module\": \"NOTIFY_TERMINAL\", \"status\": \"PENDING\" } ] }"}}, "wrapper": {"title": "What the API client wraps around every REST call", "lede": "Screens write one line to fetch; this chain always runs.", "steps": ["Build the URL: the api tag encodes every id", "Send with a JSON content type, keeping caller headers", "Parse the body; a non-JSON error page falls back to the status text", "Not ok: throw ApiError with message and field errors", "Ok: return only the data field", "TanStack Query caches it: fresh 5 min, kept 10 min, one retry"]}, "story": {"title": "A visit in plain words", "steps": [["Arrive", "the browser gets index.html and a small main bundle; the router draws the Sessions list from one GET."], ["Browse", "choosing a session or workflow downloads that route's code and its data; cached data is reused for 5 minutes."], ["Build", "the editor fetches the whole session, lets you change one workflow with forms, validates it on the server and saves the whole session."], ["Run", "Run sends a start request with a fresh Idempotency-Key and opens the new run's live streams."], ["Watch", "streams update the graph, the node list and the log panel; every status passes through one mapping."], ["Steer", "Pause, Resume, Stop, Restart and per-node actions are POST calls; the result shows up as the next streamed status."], ["Look around", "Plugins shows what can be built, History lists recent runs, Control shows supervisors and control-bus nodes (refreshed every 5 s)."]]}, "paths": [["New to the module", "Primer, then the Map and the 'Watch a run' scenario, then Guarantees for the numbers, then pick one risk and read its components.", "primer"], ["Reviewing for improvements", "Quality lenses, then Risks (start with noAuthHeader and startRetryKey), then Decisions for what you would revisit.", "quality"], ["Planning remote or multi-user use", "Map (network-facing view), the 'Protected server' scenario, Guarantees (what is enforced), Evolution path.", "guarantees"]]}, "plain": {"shell": ["The building and the signposts. It draws the header, the breadcrumb and the footer, and decides which screen to show for each address. Heavy screens are fetched only when you first visit them.", "A single page app needs something to map addresses to screens and to keep the first download small, so the home page is quick even though the run page needs a graph library."], "api": ["The phone line to the server. Every REST call from every screen goes through it: it builds the address, sends the request, unwraps the answer and turns failures into readable errors.", "Every screen would otherwise repeat the same chores: encode ids, parse the envelope, turn errors into messages, cache answers. Doing it once keeps behaviour and error text consistent."], "live": ["A radio that keeps listening to the server. It opens a live stream, hands each message to the screen, and if the signal drops it retries with growing pauses.", "Runs last minutes or hours. Polling would be wasteful and laggy; a stream gives instant updates, but only if dropped connections are handled."], "run": ["The cockpit for one workflow: the graph, a side panel of steps, run buttons, a run picker and a log terminal, all showing one selected run.", "Operators need one place to see what a run is doing and to steer it without leaving the page."], "builder": ["The workflow editor. You create a session, add nodes from a list, connect them with dropdowns, fill each node's settings in a generated form, check it with the server and save.", "Writing workflow JSON by hand is error-prone. Generating forms from each plugin's schema means new plugins are editable without any UI change."], "ops": ["Three look-around pages: Plugins (what you can build with), History (recent runs of a session) and Control (supervisors and control-bus nodes).", "Operators need to discover plugins, find an old run and check what the automation watchers are doing."], "status": ["The translator for status words. The server says things like RUNNING, NODE_STOPPED or UPSTREAM_FAILED; this turns them into six states the screen can draw.", "If every screen interpreted raw words itself they would drift apart. One translator is also where the known quirks (NODE_STOPPED means the run goes on) live."], "logs": ["The scrolling terminal for a run. It collects lines from the log stream, removes repeats, keeps the newest 2,000 and draws only the rows you can see.", "A chatty run can emit thousands of lines. Drawing each one would freeze the tab."], "design": ["The paint and the icons. Colours, spacing, type sizes and dark mode are defined once as named tokens, and the icons come from a tiny font file.", "Consistent look, dark mode and a small download without each screen styling things by hand."], "build": ["The factory and the delivery truck. It compiles the app, enforces size and license rules, packs the result into the ui jar, and boot serves it.", "Guards in the build catch problems (oversized files, missing license headers, a mismatched version) before they reach users."]}, "comps": [{"id": "shell", "name": "Shell & Routing", "tag": "layout, lazy routes", "c": 0, "r": 0, "resp": "Draws the header, breadcrumb and footer and maps each address to a screen. All routes except the home page are loaded on demand.", "how": ["The routes are: / (session list; /sessions redirects there), /sessions/new, /sessions/:sessionId, /sessions/:sessionId/workflow/:workflowId (the run view), the same path plus /edit (the builder), /plugins, /history and /control. The header links Sessions, Plugins, History and Control.", "Every route except the session list is declared lazy: its code is downloaded the first time you visit. Example: the run view needs React Flow and dagre, about 257 KB; users who only browse sessions never download it.", "boot serves index.html for any GET that is not /api, /actuator, /mcp, /v3, /swagger-ui, /webjars, /sse or a static file pattern (js, css, fonts, images, json, webmanifest). Without that fallback, reloading /sessions/demo would give a 404, because that path exists only in the browser.", "index.html is sent with no-cache and a Content-Security-Policy (default-src 'self'; inline styles allowed; no objects, no framing). Files under /assets are hashed and cached for a year. The theme (light, dark or system) is read from localStorage by a tiny script before the app loads, to avoid a flash.", "Breadcrumbs link the 'Sessions' crumb to /sessions, which redirects to /. The run page can replace its crumb text with the workflow description."], "guar": "An unknown address inside the app shows the shell, never a server 404; a file path that does not exist is a real 404, not the app.", "state": "Only the URL and the theme choice (localStorage key 'theme'). Everything else is rebuilt from the server on reload.", "ceil": "Each route is a separate download, so the first visit to a heavy page pays a round trip. The build budget keeps any one file under 300 KB.", "fail": "If a route file fails to download, that screen does not render. There is no custom error boundary that I found in the router setup; the router's default error screen applies.", "set": ["boot: SpaWebFluxConfig (fallback and CSP)", "Vite dev server proxies /api, /sse and /actuator to :8080"], "risks": ["uiGaps"], "flag": false}, {"id": "api", "name": "API Client & Cache", "tag": "fetchApi, errors, queries", "c": 1, "r": 0, "resp": "The single path for REST calls: builds safe URLs, unwraps the response envelope, turns failures into typed errors and caches answers.", "how": ["fetchApi sends the request with a JSON content type. Headers passed by the caller are merged on top, so an Idempotency-Key does not drop the content type. It reads the JSON body even on errors; if the body is not JSON (a 502 page from a proxy) it falls back to the status text.", "A non-2xx answer throws ApiError carrying the server's message and a list of field errors (field and message). Example: saving with a bad session id shows 'sessionId: must not be blank'. A 204 returns nothing; a successful non-JSON body is an error.", "The api tagged template builds paths such as api`/api/sessions/${id}` and URL-encodes every value. An id containing '/' or '?' therefore cannot reach a different endpoint. The action suffix of node commands (for example step/enable) comes from a closed list and is appended unencoded on purpose.", "TanStack Query is configured with: fresh for 5 minutes, kept 10 minutes after last use, no refetch on window focus, and one retry for queries and for mutations. Mutations such as start and stop also invalidate the status and workflow-list queries on success.", "fetchApi adds no Authorization or X-API-Key header and no credentials option. The server's ApiKeyFilter requires one on every /api/ request when yukta.api-key is set."], "guar": "Every REST failure reaches the screen as an Error with a readable message; ids are always encoded.", "state": "The query cache is in memory only: gone on reload.", "ceil": "The 5 minute freshness means other people's changes can be invisible for that long. One retry for mutations can repeat a non-idempotent call (risk startRetryKey).", "fail": "A network failure rejects the fetch and is shown by the screen's own error state (for example 'Failed to load sessions' with a retry button).", "set": ["queryClient: staleTime 5 min, gcTime 10 min, retry 1", "pnpm run api:types (regenerate OpenAPI types)"], "risks": ["noAuthHeader", "startRetryKey", "legacyAliases", "freeStatus", "pagingCaps"], "flag": true}, {"id": "live", "name": "Live Stream Hook", "tag": "EventSource + backoff", "c": 2, "r": 0, "resp": "Subscribes the page to a server-sent-event stream, parses each frame as JSON and reconnects after errors.", "how": ["The hook takes a URL (or null to stay idle) and a callback. Changing the URL closes the old stream and opens a new one; leaving the page closes it.", "A frame that is not valid JSON is dropped and the stream carries on. Example: a keep-alive comment or a half-written frame cannot crash the page.", "On an error the hook closes the stream and, if reconnecting is allowed, opens a new one after 1 s, doubling each time up to 30 s. The counter resets once a connection opens, so a long outage does not leave the next blip with a 30 s delay.", "The server numbers events and honours a Last-Event-ID header and sends a keep-alive every 15 s. The hook closes the browser's built-in EventSource and creates a new one on each retry, so the browser never sends Last-Event-ID. Every reconnect therefore replays from the start and the consumers remove duplicates.", "An EventSource cannot set request headers. Any scheme that needs an Authorization header on the stream would need a different transport."], "guar": "At most one open stream per URL; a closed page leaves no stream or timer behind.", "state": "Connection status (connecting, open, error) in memory. Nothing survives a reload.", "ceil": "Each open run page holds two long-lived HTTP connections (progress and logs). Browsers limit connections per host over HTTP/1.1 (six is typical), so several run pages open in tabs can starve each other.", "fail": "When the server ends a log stream at run end, the browser sees an error and the hook reconnects (while the run is not yet seen as finished) and replays everything, which is then de-duplicated.", "set": ["RECONNECT_BASE_MS 1000, RECONNECT_MAX_MS 30000"], "risks": ["replayNoLastId", "noAuthHeader"], "flag": true}, {"id": "run", "name": "Run View", "tag": "canvas, progress, controls", "c": 3, "r": 0, "resp": "The workflow page: a React Flow graph, a progress side panel, run controls, a run picker and the log terminal, all for one selected run.", "how": ["On load it fetches the workflow graph and the run list, selects the run from ?exec= or the newest, then combines a status snapshot with the live progress stream. The stream is opened only while the run is not finished.", "The graph is laid out left to right by dagre with nodes 240 by 96 px and fixed spacing. Nodes cannot be dragged or connected here. A node shows its status icon, a progress percentage when the plugin reports one in its metadata, and output port handles; an edge animates when its source is completed and its target is running.", "RunControls: Run opens a dialog for an optional JSON payload (it must be a JSON object) and sends POST /api/workflow/start with a fresh Idempotency-Key. Pause and Resume are enabled by the run's status; Restart is enabled for a finished run.", "Stop has four choices. 'Stop this run' stops the selected run. 'Drain', 'Cancel' and 'Kill all runs' call the workflow-wide stop with the matching mode, so they also stop runs started by other people. Each asks for confirmation first.", "NodeControlsMenu lists only the actions that fit the node's current state, for example Retry only for a failed node and 'Restart from here' for any node that has started. The page shows the new state only when the server's next progress frame reports it.", "A 429 from start shows 'The scheduler is at its limit. Try again shortly.' Other errors show the server's message."], "guar": "Buttons are enabled only for states where they make sense, and destructive stops ask for confirmation.", "state": "Selected run in the URL; panel open/closed and log filters in memory. Run data is never stored in the browser.", "ceil": "The graph is drawn in the browser; very large workflows (the server allows up to 500 nodes) mean hundreds of React Flow nodes and animated edges. The run list is whatever the server returns (default up to 500) with no paging.", "fail": "If the graph or run list fails to load, the page shows 'Failed to load workflow' with no retry button.", "set": ["?exec=<executionId>", "POST /api/workflow/start, /api/executions/{id}/{action}"], "risks": ["startRetryKey", "stopAllRuns", "replayNoLastId", "legacyAliases", "uiGaps"], "flag": true}, {"id": "builder", "name": "Workflow Builder", "tag": "forms from config schema", "c": 0, "r": 1, "resp": "Creates sessions and edits one workflow at a time through forms: nodes, edges, per-node settings and the engine failure policy.", "how": ["'New session' asks for id, name, description, initiator and project path, saves a starter workflow (an API_TRIGGER wired to a CONSOLE_TERMINAL, because a session needs at least one workflow) and opens the editor on it.", "The editor loads the complete session from GET /api/sessions/{id}/config (always fresh, staleness 0) so that saving does not lose tags or other workflows. You pick a plugin type, press Add node (ids are generated like http-request-1), and add edges with three dropdowns: source, port and target.", "Selecting a node shows the plugin's config schema as a form: text, number, checkbox, choice list and expression box. LIST and MAP settings are edited as JSON that is applied only when it parses. SECRET settings take a placeholder such as decrypted:<key> instead of the value. A plugin with no schema gets a raw JSON editor and its usage text. An empty field is removed so the plugin default applies.", "Every node also has an 'Error handling and retries' panel for the engine policy: onError (FAIL, CONTINUE, ROUTE), trigger rule (ALL_SUCCESS, ALL_DONE, ONE_SUCCESS), retry, element timeout, deadline and failure budget.", "Validate sends only the current workflow to POST /api/sessions/validate. The server uses the same rules as execution and answers valid or not with the first problem and each node's output ports, which fill the edge port dropdown. Save validates first and, if valid, sends the whole session to POST /api/sessions, then opens the run view.", "The canvas preview is the same React Flow canvas as the run view, fed from the draft."], "guar": "A workflow is saved only after the server validated it moments before; the UI never decides validity itself.", "state": "The draft lives only in memory: leaving the page or reloading discards it. Only Save writes to the server.", "ceil": "The edge editor is dropdown based, so graphs with many nodes are tedious. Saving replaces the whole session, so two editors of the same session overwrite each other.", "fail": "Validation or save errors are shown inline (field errors joined as 'field: message'). A failed save leaves the draft intact.", "set": ["POST /api/sessions/validate, POST /api/sessions, GET /api/sessions/{id}/config", "GET /api/plugins and /api/plugins/{type}"], "risks": ["wholeSessionSave", "noDraftGuard", "iconGap", "uiGaps"], "flag": true}, {"id": "ops", "name": "Oversight Pages", "tag": "plugins, history, control", "c": 1, "r": 1, "resp": "Three pages for discovery and oversight: the plugin catalogue, recent runs of a session, and supervisors and control-bus nodes.", "how": ["Plugins: a filterable list grouped as Triggers, Processors, Terminals. The detail shows description, output ports, a table of config fields (name, type, description, required star), the usage pattern and a preview of how the node looks on the canvas. The selected type is kept in ?type=.", "History: pick a session (default the first) and see its newest 50 runs from GET /api/workflow/{session}/history?limit=50. Each id links to the run page with ?exec=. The server pages with a cursor; the UI asks for one page of 50 and does not follow the cursor.", "Control: lists node names registered on the control bus (GET /api/control/nodes, or per workflow). Typing a workflow id enables a Heartbeat button per node. A Supervisors table (GET /api/supervisors) shows each supervisor or control plane with kind, type, order, live or dry-run mode, rate cap and counts of applied, refused, recorded and dropped commands since startup.", "Both the node list and the supervisor table refetch every 5 seconds while the page is open."], "guar": "Read-only: these pages change nothing on the server.", "state": "No local state beyond filters and the selected item.", "ceil": "Each open Control page makes two requests every 5 seconds per browser. History shows at most 50 runs per session.", "fail": "Each list has its own error state with a retry button; a failed heartbeat shows 'No heartbeat'.", "set": ["GET /api/plugins, /api/workflow/{session}/history, /api/control/nodes, /api/supervisors"], "risks": ["pollControl", "pagingCaps", "iconGap"], "flag": true}, {"id": "status", "name": "Status Mapping", "tag": "one translation point", "c": 2, "r": 1, "resp": "Turns the server's free-text statuses into the UI's states, in one file.", "how": ["Node statuses map to six UI states: completed, running, pending, failed, paused, skipped. Example: SUCCESS is completed; FAILURE, TIMED_OUT and ABORTED are failed; STOPPED, CANCELLED and UPSTREAM_FAILED are skipped (the node did not run because of something else); an unknown word shows as pending.", "Run statuses map to coarse buckets (running, success, failure, stopped, paused, pending, unknown). The buttons use them: Pause needs 'running', Resume needs 'paused'.", "NODE_STOPPED is special. When one node is stopped the server writes NODE_STOPPED as the whole run's status while the other nodes keep going. The mapper therefore treats it as running, not as finished. Before this was fixed, stopping one node made the page stop following a live run.", "A separate list decides which statuses are terminal, meaning the run is over. The progress stream is closed and the Restart button is enabled only for these. A live control state (PAUSED, STOPPING) overrides the shown status while the run is not terminal.", "The statuses are plain strings in the server's OpenAPI document, so a typo or a new status is not caught by the type checker."], "guar": "Every screen gets the same meaning for a status, because nothing else interprets raw words.", "state": "None. Pure functions.", "ceil": "A new server status needs a code change here, and until then it renders as pending or unknown.", "fail": "Unknown input degrades quietly instead of failing. That avoids crashes but can hide a new state.", "set": [], "risks": ["freeStatus"], "flag": false}, {"id": "logs", "name": "Log Terminal", "tag": "batch, cap, virtualise", "c": 3, "r": 1, "resp": "Collects the log stream into a bounded buffer and draws only the visible rows.", "how": ["Incoming entries are held in a small queue and added to the screen once every 100 ms. A burst of 500 lines costs one redraw.", "Each entry gets a key made of timestamp, plugin id, stream and message. A key already seen is dropped, which removes the history the server replays after each reconnect. The set of remembered keys is itself capped at 2,000.", "The list keeps the newest 2,000 entries. Rows are 20 px high and drawn through a virtual list: only rows in view plus a margin of 20 exist in the page.", "The panel offers a text filter, auto-scroll, line wrapping (rows are then measured instead of fixed), copy and clear. Levels get colours: WARN, ERROR and DEBUG each have a colour token."], "guar": "Memory and page size stay bounded however long the run is.", "state": "The 2,000-line buffer is in memory and resets when you switch runs.", "ceil": "Because of the 2,000 cap, long runs show only the tail; the rest is on the server.", "fail": "Dropped duplicates look like missing lines when two real lines are identical and share a timestamp.", "set": ["MAX_LOG_ENTRIES 20000, LOG_FLUSH_MS 100, row height 20 px"], "risks": ["logDedupe", "replayNoLastId"], "flag": false}, {"id": "design", "name": "Design System", "tag": "tokens, shadcn, icons", "c": 0, "r": 2, "resp": "Defines colours, type, spacing, dark mode, shared page pieces and the icon font once, for every screen.", "how": ["Tailwind CSS 4 is configured in CSS, not in a JavaScript file. Colours are variables (oklch values) with light and dark sets, plus Material-style alias names such as on-surface. The brand colours come from the logo: blue (primary), slate (neutrals) and orange (the 'attention' pulse of a running node).", "Plugin categories have their own colours (trigger orange, processor blue, terminal slate), used only on the canvas, the plugin catalogue and edges. Node effects (glow, flowing edges) are switched off when the user prefers reduced motion.", "Components such as button, input, table and dropdown are copied-in shadcn primitives built on Base UI. Re-adding one needs three fixes by hand: the cn import path, Material Symbols instead of lucide-react, and the license header.", "Icons are Material Symbols Outlined from a self-hosted subset. A script scans src for icon names, asks Google Fonts for a font with just those glyphs and writes src/assets/material-symbols-subset.woff2 (about 13.7 KB now, versus 3.96 MB for the full font).", "Fonts are Inter Variable and JetBrains Mono, packaged from npm. Minimum text size is 12 px. Shared pieces: PageHeader, StateMessage, CodeBlock and StatusChip."], "guar": "No screen hardcodes a colour for status or logs; dark mode and reduced motion are honoured everywhere the tokens are used.", "state": "The theme choice is stored in localStorage; the rest is static.", "ceil": "pnpm run icons needs network access, and an icon added without regenerating the font shows as blank text.", "fail": "A missing glyph renders as its raw name. The build only checks the font's size, not its contents.", "set": ["pnpm run icons, pnpm run favicons", "src/index.css (@theme tokens)"], "risks": ["iconGap"], "flag": false}, {"id": "build", "name": "Build & Serving", "tag": "Vite, Gradle, guards", "c": 1, "r": 2, "resp": "Compiles and checks the app, packs it into the ui jar and defines the rules that keep it small and licensed.", "how": ["pnpmBuild runs: type check of source, type check of tests, vite build, then a size check. The output dist/ is copied into the jar under static/, and boot serves it. The Gradle task depends on pnpmInstall, so Node and pnpm come from the build, not from the machine.", "The size check fails the build if any JavaScript file is over 300,000 bytes or the icon font is over 100,000 bytes. Vite splits vendor code into stable chunks (react, tanstack, router and ui-kit) so they stay cached across releases.", "A compile-time test fails the type check when a hand-written UI type and the matching server schema stop having the same fields. 'pnpm run api:types -- --check' fails when the committed generated types are stale, but it needs a running server, so it is not part of the normal build.", "':ui:check' runs two guards: validateHeaders (every source file under src, the config files and index.html must carry the SPDX license header) and verifyPackageVersion (package.json's version must equal the Gradle project version).", "Unit tests (Vitest with Testing Library, a 100% threshold configured for coverage) run with ':ui:pnpmTest' or 'pnpm test'. E2E tests (Playwright against mocked APIs) run with ':ui:pnpmTestE2e -PrunE2e=true' and in a CI job. In build.gradle.kts the unit tests are commented out of 'check'."], "guar": "A build that produces an oversized chunk, an oversized icon font, a file without a license header or a mismatched version number fails.", "state": "dist/ and build/ are generated output.", "ceil": "The build needs Node tooling and, for icons and API types, network or a running server.", "fail": "A failure stops the Gradle build, so the jar is not produced.", "set": ["./gradlew :ui:build", "./gradlew :ui:pnpmTest", "./gradlew :ui:pnpmTestE2e -PrunE2e=true", "pnpm run lint:headers"], "risks": ["noTestGate", "deadSanitiser"], "flag": false}], "mapFlag": {"label": "Highlight server calls", "hint": "Dashed amber = makes requests to the server's /api (and sends no credentials)", "badge": "NET"}, "mapLegend": "Solid arrows are the main data flow; dashed arrows are commands, routing and build-time wiring.", "edges": [["shell", "api", "data", "screens call"], ["api", "run", "data", "snapshots"], ["live", "status", "data", "frames"], ["status", "run", "data", "UI states"], ["live", "logs", "data", "log frames"], ["logs", "run", "data", "log lines"], ["builder", "api", "data", "validate, save"], ["ops", "api", "data", "poll every 5 s"], ["run", "api", "ctrl", "commands"], ["shell", "builder", "ctrl", "lazy route"], ["shell", "ops", "ctrl", "lazy route"], ["design", "shell", "ctrl", "tokens"], ["build", "shell", "ctrl", "bundle"]], "scen": [{"id": "watch", "name": "Watch a run", "steps": [{"t": "Open the run page", "d": "The browser gets index.html (with the CSP header) and the router lazily downloads the run view with React Flow and dagre. Lazy loading keeps the home page small.", "c": ["shell", "build"], "r": []}, {"t": "Fetch the graph and the runs", "d": "Two GETs go through fetchApi, which encodes ids and unwraps the envelope. TanStack Query caches the answers for 5 minutes.", "c": ["run", "api"], "r": ["pagingCaps"]}, {"t": "Choose a run, take a snapshot", "d": "The ?exec= value or the newest run is selected and its status is fetched. If it is not finished, the progress stream is opened with includeHistory=true.", "c": ["run", "api", "live"], "r": ["legacyAliases"]}, {"t": "Frames arrive, the graph repaints", "d": "Each frame replaces the previous snapshot. Every node status goes through the mapper and dagre positions the cards; running nodes pulse and edges flow.", "c": ["live", "status", "run"], "r": ["freeStatus"]}, {"t": "Logs batch in", "d": "The log stream pushes history, then live lines. They are batched every 100 ms, de-duplicated, capped at 2,000 and drawn through a virtual list.", "c": ["live", "logs", "run"], "r": ["logDedupe"]}, {"t": "The run ends", "d": "A terminal status with an end time closes the progress stream and refreshes the workflow list and run history so status chips update.", "c": ["run", "api"], "r": []}]}, {"id": "reconnect", "name": "A dropped stream", "steps": [{"t": "The connection breaks", "d": "The server restarts, a proxy times out or Wi-Fi switches. The browser raises an error on the stream.", "c": ["live"], "r": []}, {"t": "Close and wait", "d": "The hook closes the failed stream and waits 1 s (then 2, 4... up to 30 s). Closing it cleanly stops the browser from reconnecting on its own, so the hook controls timing.", "c": ["live"], "r": []}, {"t": "Open a new stream", "d": "A new EventSource is created. It cannot reuse the old connection and sends no Last-Event-ID, so the server starts from the beginning.", "c": ["live"], "r": ["replayNoLastId"]}, {"t": "Replay is absorbed", "d": "Progress frames are full snapshots, so the latest simply wins. Log lines are compared by time, plugin, stream and text and repeats are dropped.", "c": ["live", "logs", "status"], "r": ["logDedupe"]}, {"t": "Back to normal", "d": "Once a connection opens, the retry counter resets to 1 s. If the run finished meanwhile, no stream is reopened.", "c": ["live", "run"], "r": []}]}, {"id": "build", "name": "Build and save a workflow", "steps": [{"t": "Create a session", "d": "The form posts a session with a starter workflow (a trigger wired to a console terminal) to POST /api/sessions and opens the editor.", "c": ["builder", "api"], "r": []}, {"t": "Load the draft", "d": "The editor fetches the complete session configuration with no caching. The complete session is needed because saving replaces it: anything missing would be deleted.", "c": ["builder", "api"], "r": ["wholeSessionSave"]}, {"t": "Add nodes and edges", "d": "Choose a plugin type, add a node and fill the generated form from the plugin's schema. Connect nodes with dropdowns. The preview canvas redraws the draft.", "c": ["builder", "ops"], "r": ["iconGap"]}, {"t": "Validate", "d": "The current workflow goes to POST /api/sessions/validate. The server uses the same checks as execution and returns the first problem plus each node's output ports, which fill the edge port list.", "c": ["builder", "api"], "r": []}, {"t": "Save", "d": "Save validates once more, then posts the whole session with this workflow replaced. On success the 'sessions' cache is invalidated and the run view opens.", "c": ["builder", "api", "shell"], "r": ["wholeSessionSave"]}, {"t": "Navigate away by accident", "d": "A click on any header link or a reload throws away an unsaved draft without a prompt.", "c": ["builder", "shell"], "r": ["noDraftGuard"]}]}, {"id": "steer", "name": "Start, steer and stop", "steps": [{"t": "Run with a payload", "d": "The Run dialog takes an optional JSON object. The UI sends POST /api/workflow/start with a new random Idempotency-Key. If the server is at its limit it answers 429 and the UI shows a friendly message.", "c": ["run", "api"], "r": ["startRetryKey"]}, {"t": "Follow the new run", "d": "On success the page selects the returned execution id and opens its streams.", "c": ["run", "live"], "r": []}, {"t": "Pause or act on a node", "d": "A POST is sent. The UI changes nothing itself; the next progress frame carries the new state (PAUSED), which the mapper turns into a paused node.", "c": ["run", "status", "live"], "r": []}, {"t": "Stop", "d": "'Stop this run' calls /api/executions/{id}/stop. 'Drain', 'Cancel' and 'Kill all runs' call /api/workflow/{session}/{workflow}/stop?mode=... and affect every active run of that workflow. A confirmation dialog comes first.", "c": ["run", "api"], "r": ["stopAllRuns"]}, {"t": "Restart", "d": "Restart is enabled for a finished run, and 'Restart from here' for a node; both start a new run and the page jumps to the new id.", "c": ["run", "api"], "r": ["startRetryKey"]}]}, {"id": "remote", "name": "A protected server", "steps": [{"t": "The operator exposes the server", "d": "To reach Yukta from another machine the operator sets YUKTA_SERVER_ADDRESS=0.0.0.0 and yukta.api-key. With a key set, every /api request must carry Authorization: Bearer or X-API-Key.", "c": ["build"], "r": []}, {"t": "The page still loads", "d": "index.html and the assets are not under /api, so they are served without a key. The operator sees the app shell.", "c": ["shell"], "r": []}, {"t": "The first call is refused", "d": "fetchApi sends no key, so the session list request gets 401. The home page shows 'Failed to load sessions' and advises checking that the server is running, which does not help.", "c": ["api"], "r": ["noAuthHeader"]}, {"t": "Streams cannot be fixed with a header", "d": "A browser EventSource cannot send headers, so even a UI that attached a key to fetch calls could not authenticate the progress and log streams the same way.", "c": ["live"], "r": ["noAuthHeader"]}, {"t": "Workarounds today", "d": "Run the UI behind a reverse proxy that injects the header, or use the dev proxy locally. Both sit outside this module.", "c": ["shell", "api"], "r": []}]}], "intro": {"watch": "One visit to a run page, from the first request to the run finishing. Use it first to learn the pieces.", "reconnect": "What happens when a live stream drops, and why duplicates are expected.", "build": "How a workflow is created, edited, checked by the server and saved, and where drafts can be lost.", "steer": "Starting, pausing, stopping and restarting a run, and why the screen only changes when the server says so.", "remote": "Why the bundled UI cannot work against a server that requires an API key (a failure scenario)."}, "caps": [["Sessions and builder", "Session list and details", "Find sessions and their workflows.", "One summaries call; the table filters and pages 10 per page in the browser. A session page lists workflow cards.", "Filters never need a server call.", "All summaries are loaded at once."], ["Sessions and builder", "Create a session", "Start a new workspace.", "A form posts a session with a starter workflow, then opens the editor.", "A session always has one workflow.", "No way to delete or rename a session in the UI."], ["Sessions and builder", "Schema-driven node forms", "Edit any plugin's settings without custom UI.", "Fields for text, number, boolean, choice and expression; JSON for lists and maps; a decrypted:key placeholder for secrets.", "New plugins are editable immediately.", "A plugin with no schema falls back to raw JSON."], ["Sessions and builder", "Server-side validation", "Check a draft before saving.", "POST /api/sessions/validate runs the execution rules and returns each node's ports.", "The UI never has its own validity rules.", "Only the current workflow is validated before Save."], ["Run view", "Live DAG canvas", "See the run on the graph.", "dagre layout, React Flow rendering, status colours, flowing edges, progress percent from node metadata.", "Layout is deterministic for a given graph.", "Drawn entirely in the browser."], ["Run view", "Run controls", "Start, pause, resume, stop, restart.", "Buttons enable by run status; Stop offers this run or drain, cancel, kill for all runs; confirmation first.", "No double-click guard other than the pending state.", "Three of four stop choices are workflow-wide."], ["Run view", "Per-node actions", "Control one step.", "Pause, resume, stop, skip, retry, step mode and 'restart from here', listed by node state.", "Menu shows only valid actions.", "No breakpoint or priority controls, although REST has them."], ["Run view", "Run picker and links", "Jump to any recent run.", "A dropdown plus ?exec= in the URL; History links use the same parameter.", "A run is linkable.", "Unknown ids fall back to the newest run."], ["Live data", "Progress stream", "Follow status as it changes.", "SSE with a snapshot first and full-snapshot frames; closes when the run is finished.", "Repeated frames are harmless.", "Uses the legacy /api/workflow/... path."], ["Live data", "Log stream and terminal", "Read logs live.", "Batched every 100 ms, 2,000-line cap, de-duplicated, virtual list with filter, wrap, copy and clear.", "Bounded memory.", "Only the newest 20,000 lines are kept."], ["Live data", "Reconnect with backoff", "Survive a dropped connection.", "Retry after 1 s, doubling to 30 s; counter resets on success; malformed frames are ignored.", "A blip does not freeze the page forever.", "No resume token; full replay each time."], ["Oversight", "Plugin catalogue", "Learn what can be built.", "Grouped list, config table, usage text and a canvas preview; filter by name.", "Always matches the server's plugins.", "Decision plugins use the generic category icon."], ["Oversight", "Run history", "Find earlier runs.", "Newest 50 runs of a chosen session, linking to the run page.", "One call per session.", "No search, no paging, no filter by status."], ["Oversight", "Control bus and supervisors", "See the automation.", "Nodes on the control bus with optional heartbeat; supervisors with mode, rate cap and command counters. Polled every 5 s.", "Auto-refreshing view.", "Read-only; polling rather than events."], ["Platform", "Design tokens and dark mode", "One consistent look.", "Tailwind 4 tokens, light and dark sets, reduced-motion support, shadcn on Base UI.", "No hardcoded status or log colours.", "Brand colours are fixed to the logo."], ["Platform", "Small downloads", "Fast first load.", "Lazy routes, vendor chunks, a 13.7 KB icon font, a build that fails above 300 KB per script.", "Budgets are enforced on every build.", "Budgets cover size, not speed."], ["Platform", "Safe URLs and errors", "No wrong-endpoint surprises.", "Ids are URL-encoded; the server's message and field errors reach the user.", "Ids with / or ? stay inside their segment.", "One generic retry for all mutations."], ["Platform", "Typed contract", "Catch drift with the server.", "Types generated from the OpenAPI document plus a compile-time check that hand-written types match.", "A renamed server field breaks the build.", "Generated types mark every field optional, so hand-written types stay in use."], ["Run page", "Versions panel", "Review and restore earlier saved definitions.", "Lists saved versions, compares one with the current definition, rolls back, and edits version notes (WorkflowVersionsPanel.tsx; versions.ts).", "A rollback is a normal server save and is audited by the server.", "Editor can keep a stale draft after a rollback (rollbackStaleDraft)."], ["Run page", "Pending approvals strip", "Answer approval steps without leaving the run.", "Polls the session's open approvals every 5 s and sends approve/reject through the signal endpoint (PendingApprovals.tsx; approvals.ts).", "Decisions go through the server's review and audit.", "No confirm, no reason, polls with no live run (approvalUx, approvalPoll)."], ["Run page", "RESULT block", "See what reaches the terminal nodes live.", "Streams /api/sessions/{s}/executions/{e}/results and shows typed payloads as text (ExecutionResultBlock.tsx; useExecutionResults.ts).", "Text only; no HTML is injected.", "Newest 500 events kept; reconnects replay (dedupeEviction)."], ["Control", "Audit table", "See who did what.", "GET /api/control/audit?limit=50, polled every 5 s (ControlAuditPanel.tsx).", "Shows server-recorded actor and outcome.", "Fixed 50 rows, no filter or paging."], ["Run page", "Log buffer", "Keep long runs readable.", "Newest 20,000 lines; a pill shows how many earlier lines are hidden (useExecutionLogs.ts, LogsPanel.tsx).", "Bounded memory.", "Older lines are only available from the server."]], "guar": {"title": "What the UI keeps, and what it enforces", "lede": "The UI owns no durable data. This section lists its timings and limits, what vanishes on a reload, and which rules are enforced by the code or the build and which are not.", "tables": [{"title": "What survives a reload", "lede": "Everything about runs and workflows lives on the server and is fetched again.", "head": ["Browser state", "After a reload or crash"], "rows": [["Theme choice (light, dark, system)", ["ok", "Kept in localStorage ('theme')"]], ["Selected run (?exec=) and selected plugin (?type=)", ["ok", "In the URL, so shareable and kept"]], ["Query cache (sessions, graphs, runs)", ["lost", "Memory only; refetched on demand"]], ["Log buffer (newest 20,000 lines)", ["part", "Gone, rebuilt from the server's replay when the page reopens"]], ["Builder draft (unsaved changes)", ["lost", "Lost on reload or navigation, with no warning"]], ["Open streams and retry timers", ["lost", "Closed when the page unloads"]], ["Run, workflow and session data", ["info", "Not stored in the browser at all"]]]}, {"title": "Timings and limits", "lede": "Values taken from the code. Changing one means a code change, there are no runtime settings.", "head": ["Item", "Value", "Effect"], "rows": [["Query fresh time (staleTime)", "5 minutes", "No refetch when returning to a page within 5 minutes"], ["Query keep time (gcTime)", "10 minutes", "Unused data is dropped after that"], ["Retries", "1 for queries and for mutations", "A failed call is repeated once (default delay applies)"], ["Refetch on window focus", "Off", "Returning to the tab does not refresh"], ["Stream reconnect delay", "1 s doubling to 30 s", "Resets when a connection opens"], ["Log flush", "Every 100 ms", "One redraw per batch"], ["Log buffer and dedupe memory", "2,000 entries each", "Older lines are dropped"], ["Log row height", "20 px, 20 rows overscan", "Virtual list; measured when wrapping"], ["History per session", "50 runs", "Cursor paging not used"], ["Control page and supervisors table", "Refetch every 5 s", "Two requests per interval per open page"], ["Session list page size", "10, in the browser", "All summaries are loaded first"], ["Workflow description field", "256 characters", "Input limit in the editor"], ["JS chunk budget", "300,000 bytes each", "Build fails above it"], ["Icon font budget", "100,000 bytes", "Build fails above it"]]}, {"title": "Enforced or not", "head": ["Rule", "Status"], "rows": [["Ids are URL-encoded in REST paths", ["ok", "Enforced by the api tag; a test covers it"]], ["Workflow validity", ["ok", "Decided by the server at validate and save time, not by the UI"]], ["Same-origin scripts only", ["ok", "Content-Security-Policy on index.html (inline styles allowed)"]], ["Authentication", ["lost", "The UI sends no credentials; with yukta.api-key set all calls fail"]], ["Who may start, stop or edit", ["lost", "No role checks in the UI; every control is shown to every visitor"]], ["Bundle size, header and version rules", ["ok", "Enforced by build and ':ui:check'"]], ["Unit tests and coverage", ["part", "A 100% threshold is configured, but I found no call in ':ui:check' or CI that runs it"]], ["API type drift", ["part", "Compile-time check on every build; regeneration check needs a running server"]], ["Status vocabulary", ["part", "Free strings; unknown values degrade to pending or unknown"]], ["Unsaved builder draft", ["lost", "No warning before it is discarded"]]]}]}, "ref": [{"id": "routes", "title": "Routes", "lede": "All routes are defined in one router file. Only the session list is in the main bundle.", "head": ["Path", "Screen", "Notes"], "rows": [["/", "Session list", "Table with text filter and pagination in the browser. /sessions redirects here."], ["/sessions/new", "New session form", "Lazy. Saves a starter workflow, then opens the editor."], ["/sessions/:sessionId", "Session details", "Lazy. Info panel and workflow cards."], ["/sessions/:sessionId/workflow/:workflowId", "Run view", "Lazy. ?exec= selects the run."], ["/sessions/:sessionId/workflow/:workflowId/edit", "Workflow builder", "Lazy. Form-based."], ["/plugins", "Plugin catalogue", "Lazy. ?type= selects the plugin."], ["/history", "Run history", "Lazy. Newest 50 runs of the chosen session."], ["/control", "Control bus", "Lazy. Supervisors and nodes, refetched every 5 s."]]}, {"id": "endpoints", "title": "Endpoints the UI calls", "lede": "Everything goes to the same origin under /api. Paths marked legacy are deprecated aliases on the server; the replacement exists.", "head": ["Call", "Used by", "Notes"], "rows": [["GET /api/sessions/summaries", "Session list, History", "All sessions in one answer."], ["GET /api/sessions/{id}", "Session details", ""], ["GET /api/sessions/{id}/workflows", "Workflow cards, run list refresh", ""], ["GET /api/sessions/{id}/config", "Builder", "The complete session, the shape POST /api/sessions accepts."], ["POST /api/sessions/validate", "Builder", "200 with valid=false for a bad draft."], ["POST /api/sessions", "Builder", "Replaces the whole session."], ["GET /api/sessions/{id}/workflows/{wid}/graph", "Run view", "Nodes, edges, ports, categories."], ["GET /api/sessions/{id}/workflows/{wid}/executions", "Run view", "No limit passed; server default 500."], ["GET /api/workflow/{sid}/status/{eid}", "Run view", "Legacy; replacement is GET /api/executions/{eid}."], ["SSE /api/workflow/{sid}/status/{eid}/stream?includeHistory=true", "Run view", "Legacy; replacement is /api/executions/{eid}/status/stream."], ["SSE /api/sessions/{sid}/executions/{eid}/logs/entries", "Run view", "History first, then live."], ["POST /api/workflow/start", "Run controls", "Idempotency-Key header; 202 with the execution id; 429 at the limit."], ["POST /api/workflow/{sid}/{wid}/stop?mode=", "Run controls", "All runs of the workflow; DRAIN, CANCEL or KILL."], ["GET /api/workflow/{sid}/history?limit=50", "History", "Server also sends X-Next-Cursor, which the UI ignores."], ["POST /api/executions/{eid}/pause | resume | stop | restart", "Run controls", ""], ["POST /api/executions/{eid}/restart/{nodeId}", "Node menu", "Starts a new run from that node."], ["POST /api/executions/{eid}/nodes/{nid}/pause | resume | stop | skip | retry | step | step/enable | step/disable", "Node menu", ""], ["GET /api/plugins, GET /api/plugins/{type}", "Plugins, Builder", "Type, category, ports, config schema, usage."], ["GET /api/control/nodes, /api/control/workflows/{wid}/nodes, .../nodes/{nid}/heartbeat", "Control", ""], ["GET /api/supervisors", "Control", "Counters since startup."]]}, {"id": "status", "title": "Status mapping", "lede": "Raw server status to what the screen shows. 'Terminal' means the run is over.", "head": ["Raw status", "Node shows as", "Run bucket", "Terminal run?"], "rows": [["SUCCESS", "completed", "success", "yes"], ["RUNNING, NODE_RESUMED, NODE_STEPPED", "running", "running", "no"], ["FAILURE, ERROR, TIMED_OUT, ABORTED", "failed", "failure", "yes"], ["PAUSED, NODE_PAUSED", "paused", "paused", "no"], ["NODE_STOPPED", "skipped", "running (the run goes on)", "no"], ["STOPPED, CANCELLED, WORKFLOW_STOPPED", "skipped", "stopped", "yes"], ["UPSTREAM_FAILED", "skipped", "unknown", "yes"], ["STOPPING", "unknown to node map (pending)", "stopped (shown as control state)", "no"], ["PENDING, QUEUED", "pending", "pending", "no"], ["anything else", "pending", "unknown", "no"]]}, {"id": "budget", "title": "Bundle budget", "lede": "Measured from the ui/dist/assets folder present in the working tree when this page was written (it may be older than the sources). The build fails if a script exceeds 300,000 bytes or the icon font exceeds 100,000 bytes. The previous guide recorded: icon subset 11,188 B (full font 3,960,036 B), WorkflowDetailsPage chunk 272,541 B, and a single 887,435 B script before splitting.", "head": ["File", "Bytes", "Role"], "rows": [["layout-*.js", "257,430", "Run view shared code, includes React Flow and dagre (lazy)"], ["react-*.js", "218,840", "React vendor chunk"], ["tanstack-*.js", "176,700", "Query, Table, Virtual vendor chunk"], ["ui-kit-*.js", "128,919", "Base UI vendor chunk"], ["router-*.js", "93,376", "React Router vendor chunk"], ["index-*.js", "56,278", "Main app code"], ["WorkflowDetailsPage-*.js", "23,014", "Run view page (lazy)"], ["WorkflowEditorPage-*.js", "12,006", "Builder page (lazy)"], ["SessionDetailsPage-*.js", "7,992", "Session page (lazy)"], ["PluginsPage-*.js", "5,509", "Plugins page (lazy)"], ["material-symbols-subset-*.woff2", "13,696", "Icon font subset"], ["index-*.css", "64,869", "App styles"], ["layout-*.css", "15,413", "React Flow styles"]]}, {"id": "dev", "title": "Commands and rules", "head": ["Command or rule", "What it does"], "rows": [["cd ui && pnpm dev", "Vite dev server on :5173 with hot reload; proxies /api, /sse, /actuator to :8080"], ["./gradlew :boot:bootRun", "Backend on :8080 for the dev server"], ["./gradlew :ui:build", "Type check, vite build, size check; packs dist/ into the jar"], ["./gradlew :ui:pnpmTest or pnpm test", "Vitest unit and component tests"], ["./gradlew :ui:pnpmTestE2e -PrunE2e=true", "Playwright E2E with mocked APIs (browsers must be installed)"], ["pnpm coverage", "Coverage report; thresholds in vitest.config.ts are 100%"], ["pnpm run icons", "Rebuild the icon font after adding an icon name anywhere in src (needs network)"], ["pnpm run api:types [-- --check]", "Regenerate or verify the OpenAPI types (needs a running server)"], ["pnpm run lint:headers", "Check SPDX headers (also run by ':ui:check')"], ["Rule: all HTTP through fetchApi", "Build URLs with the api tag so ids are encoded"], ["Rule: live data through useEventSourceJson", "Consumers must tolerate replayed history"], ["Rule: map statuses only in statusMapper.ts", "Never interpret raw status words elsewhere"], ["Rule: colours via tokens", "Use success, warning, terminal and log-* tokens; never hardcode black or neutral grays"]]}], "quality": [{"n": "Scalability", "pos": "The static files scale trivially (served by boot, cached for a year when hashed). What scales poorly is per-user load on the server and per-page work in the browser: every open page holds streams and some pages poll.", "ceil": ["Two long-lived streams per open run page; browsers limit connections per host", "Control page polls two endpoints every 5 s per browser", "Session list loads every session summary and pages in the browser", "Large graphs (the server allows 500 nodes) mean hundreds of animated canvas nodes"], "have": ["Hashed, long-cached assets", "Log buffer and virtual list keep memory bounded", "5 minute cache avoids repeat fetches"], "need": ["Use the global events stream instead of polling for Control", "Server paging for sessions and runs", "Level-of-detail or collapsing for very large graphs"]}, {"n": "Performance", "pos": "A small first load (lazy routes, split vendor files, a 13.7 KB icon font) and cheap live updates (batched logs, virtual list, whole-snapshot progress).", "ceil": ["Every progress frame replaces the whole snapshot and re-lays out the graph", "Reconnect replays the full history of a run", "Largest single script about 257 KB; total first load for the run view is several hundred KB", "Dedupe and filtering touch up to 2,000 strings per update"], "have": ["Build-time budgets per chunk and for the icon font", "100 ms log batching", "Fixed-height virtual rows"], "need": ["Use Last-Event-ID so reconnects resume instead of replaying", "Re-layout only when the graph changes, not on every status frame", "A speed budget (not only a size budget)"]}, {"n": "Availability", "pos": "The UI is stateless, so it recovers by reloading. Its job is to degrade clearly when the server is away or a stream drops.", "ceil": ["Run page shows a blank error message with no retry if the graph or run list fails", "Streams reopen only while the run is not finished; a long outage during a run relies on the 30 s backoff cap", "An unsaved builder draft is lost on any reload", "No offline or stale-while-error view beyond the 5 minute cache"], "have": ["Stream reconnect with backoff", "Error states with retry on most lists", "Same-origin deployment, so nothing else to be down"], "need": ["Retry on the run page", "Unsaved-changes guard or local draft storage", "A visible 'live updates paused' indicator"]}, {"n": "Security", "pos": "Browser-side defences are reasonable (CSP, URL-encoded ids, no HTML injection paths in the code). The larger gaps are that the app cannot authenticate and shows every control to everyone.", "ceil": ["No credentials sent: unusable once yukta.api-key is set", "EventSource cannot carry headers, so streams cannot use the same scheme", "No role awareness: every visitor sees Stop, Kill and Save", "CSP allows inline styles (needed by React Flow)"], "have": ["CSP: same-origin scripts and connections, no framing", "Ids URL-encoded", "Secrets entered as decrypted:<key> placeholders, not values"], "need": ["A login or key flow plus a stream transport that can authenticate", "Role-based hiding of destructive controls once the server has roles", "Remove or use the unused sanitiser dependency deliberately"]}, {"n": "Operability", "pos": "Good visibility of runs, weak visibility into the UI itself. Failures are shown to the user but not reported anywhere.", "ceil": ["No client-side error or performance reporting", "Unit tests do not run in ':ui:check' or CI as far as I found", "Icons and API types need manual commands (network, running server)", "No pages for resuming an aborted run, breakpoints, scheduler limits or priority"], "have": ["Control page with supervisor counters and heartbeats", "CI E2E job with screenshot baselines", "Build guards for size, headers and version"], "need": ["Run Vitest in CI and enforce the coverage threshold", "CI step for the API types check", "Surfaces for the operations that exist only in REST"]}, {"n": "Evolvability", "pos": "Feature folders, one API client and one status mapper keep change local. Weak points are hand-maintained mappings (statuses, icons) and legacy endpoint paths.", "ceil": ["Statuses are free strings, so the mapper can drift from core", "Plugin icon map must be edited for each new plugin", "Deprecated /api/workflow/... paths are hard-coded in hooks and E2E mocks", "Generated types are all-optional, so hand-written types duplicate the contract"], "have": ["Compile-time check that hand-written and generated types agree", "Schema-driven forms need no change per plugin", "Design tokens in one CSS file"], "need": ["Status enum from core, then generated unions", "Icon (and colour) from plugin metadata instead of a UI-side map", "Move to the /api/executions/... paths"]}], "risks": [{"id": "noAuthHeader", "t": "The bundled UI cannot authenticate (S)", "a": "Security", "i": 5, "e": 3, "c": ["api", "live"], "why": "When yukta.api-key is set, which the project requires for remote access, the server answers 401 to every /api request that has no Authorization: Bearer or X-API-Ke
