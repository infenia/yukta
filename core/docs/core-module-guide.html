<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta Core Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}
</style>
</head>

<script>
var DATA = {
glance:{
 lede:"Core is Yukta's engine and control plane: it takes a workflow definition (a DAG of trigger, processor and terminal nodes), runs it as a live stream of messages, lets people and programs steer it while it runs, and remembers enough to explain or resume it afterwards. This page is for thinking about it, not documenting it: open a component, play a scenario, then challenge the weak spots.",
 props:[
  ["Streaming DAG","Each edge is a Reactor stream. A slow consumer slows its producers (back-pressure), so memory stays bounded without queues between nodes."],
  ["One JVM brain","Admission, command ordering, run state and signal waits live in one process. Plugins may block on virtual threads, but nothing is shared across servers yet."],
  ["At-least-once","A node's end is durable, a side effect before it can repeat after a crash. Exactly-once is impossible; plugins de-duplicate on the message id."],
  ["Pluggable durability","Memory by default; files or PostgreSQL by configuration. What survives a restart depends on the profile (see Guarantees)."]
 ],
 start:[["map","System map","Ten components and how data and commands flow between them"],["map","Replay a run","Seven scenarios: overload, failure, crash, supervisor..."],["guarantees","What survives a crash","Switch deployment profile and watch the table change"],["quality","Stress it","Scalability, performance, availability, security lenses"],["board","Challenge it","28 open risks, an impact x effort grid, your own notes"],["adrs","Decisions","Eight ADRs, each with a 'revisit when' trigger"]]
},
comps:[
{id:"entry",name:"Entry & Admission",tag:"front door, slots, queue",c:0,r:0,mem:true,
 resp:"Receives start, restart and recover requests and decides whether, when and in what order a run may begin.",
 how:["A start loads the definition, prepares it (shared across concurrent starts), then asks the scheduler for a slot before an execution id is handed out. Two starts racing for the last slot cannot both succeed.","The scheduler enforces global, per-workflow and per-session limits. A start that does not fit either waits (QUEUE) or is refused with HTTP 429 (REJECT or queue full).","Waiting starts are ordered by payload priority, then by the session with the fewest running runs, so one busy session cannot starve others.","An Idempotency-Key makes a retried start return the first execution id (default 10 min window; survives restart with the file log).","Shutdown stops admitting, refuses the queue and gives running runs 30 s."],
 guar:"No run id without a slot; a repeated start with the same key never doubles; refusals are counted by reason.",
 state:"Slots and the queue are in memory. Idempotency keys ride the execution log when one is configured. Limits changed at run time are logged but not restored on startup.",
 ceil:"One scheduler in one JVM; the queue defaults to 100 entries; no limits at all by default.",
 fail:"Crash: queued starts vanish, running ones become ABORTED on the next boot.",
 set:["yukta.execution.max-concurrent / -per-workflow / -per-session","yukta.execution.on-limit (QUEUE|REJECT)","yukta.execution.queue-capacity (100), queue-timeout","yukta.start.idempotency-ttl (10m)"],
 risks:["spof","restartRace","limits28","blockStart","reviewBypass"]},
{id:"def",name:"Definition & Preparation",tag:"store, validate, compile",c:1,r:0,mem:false,
 resp:"Keeps workflow definitions and versions, and turns one into a runnable, validated graph.",
 how:["Definitions live in memory, files (atomic, fsynced) or PostgreSQL, with the newest 20 versions per workflow and rollback.","The validator rejects cycles, duplicate nodes/edges, unknown output ports, graphs over 500 nodes or 2000 edges and malformed failure policies, naming node and option.","The compiler builds one assembler per node; the result is cached by definition content, and only cached if the definition is still the stored one.","Every run records a content hash of its graph (definitionVersion) so progress, archive and log agree on which version ran."],
 guar:"A bad graph fails before any plugin runs; a run is pinned to the content it started with.",
 state:"Durable with file or PostgreSQL stores; the prepared cache is memory only and can be rebuilt.",
 ceil:"Preparation cost grows with graph size; capped at 500 nodes and 2000 edges.",
 fail:"Editing a definition while runs are live does not affect them; a resume is refused if the definition changed.",
 set:["yukta.session.store-type = in-memory | file | postgres"],
 risks:["prepAlign","versions21"]},
{id:"engine",name:"Stream Engine",tag:"node runtime and policies",c:2,r:0,mem:true,
 resp:"Runs every node as a pipeline: merge parents, gate input, call the plugin, apply failure and time policy, fan out to children.",
 how:["Join rule per node: ALL_SUCCESS, ALL_DONE or ONE_SUCCESS decides what a failed parent means.","A valve in front of each node implements pause, step n, breakpoint and skip. Pause holds at one element on per-message nodes.","Failure policy ('engine' config): retry with backoff and jitter, retry by exception class, element timeout, onError FAIL/CONTINUE/ROUTE to an error port, failure budget, node deadline. A message produces all of its output or none.","Time: an idle clock that restarts on every input, output, attempt or heartbeat; pause-aware; plugin-declared defaults; expression timeouts settled on the first message.","Every child subscribes before the source connects, and the slowest child sets the pace."],
 guar:"Back-pressure end to end; node status only moves forward (PENDING < QUEUED < RUNNING < an end state); a late event cannot reopen a finished node.",
 state:"Run state, valves, failure ledger and activity clocks are in memory per run.",
 ceil:"A fan-out is paced by its slowest branch; a subtree that stops reading stalls siblings until the idle timeout; per-message nodes buffer one message's output when retry or ROUTE is on.",
 fail:"A node failure marks its descendants UPSTREAM_FAILED, not FAILURE; only the node that failed reports FAILURE.",
 set:["engine.retry / onError / trigger / elementTimeoutMs / deadlineMs / failureBudget (per node)","timeoutSeconds (per node)"],
 risks:["spof","failfast","backpressure25","payload23","remote"]},
{id:"plugin",name:"Plugin Boundary",tag:"the extension seam",c:3,r:0,mem:true,
 resp:"The contract between the engine and the work a node does: triggers produce, processors transform, terminals consume.",
 how:["A plugin sees a stream of messages and a Reactor context (executionId, nodeId, heartbeat, result collector). It never sees the engine policy options.","Long silent work calls the heartbeat to keep its node alive; blocking plugins run on a virtual-thread scheduler.","Signals and approvals: a plugin can be handed a named signal through the same ordered, audited path as other commands (e.g. WAIT_FOR_SIGNAL).","Safety rails at the edge: environment reads are allow-listed, scripts get a restricted Java surface, process execution can be limited to an allow-list of commands."],
 guar:"With retry or onError the plugin is called once per message and gets a stable id plus an attempt header, so it can de-duplicate side effects.",
 state:"Plugin-local state is the plugin's business; signal waits, KV_STORE and similar are in memory.",
 ceil:"Plugins run in the engine JVM today: a heavy or untrusted plugin competes with the control plane.",
 fail:"IllegalArgumentException means bad input and is never retried.",
 set:["yukta.process.allowed-commands","yukta.variables.allowed"],
 risks:["procDefault","logPath","signals14","toolGuard","memStore","llmBudget","remote"]},
{id:"super",name:"Supervisors",tag:"rules, AI, custom code",c:0,r:1,mem:false,
 resp:"Programs that watch every run and steer it: a rule engine, an AI agent or your own bean, in or out of process.",
 how:["Each supervisor gets the global event feed through a bounded buffer (256) and returns control commands; a slow supervisor drops events and never slows the tracker.","Commands are rate limited (20/s), can be dry-run, are applied with the supervisor id as actor, and a supervisor never sees the outcome of its own commands.","Reviewers can refuse any command, human or automated; first refusal wins and the caller gets 403.","External agents use the SSE event stream plus REST/MCP control endpoints, with no JVM code."],
 guar:"A misbehaving supervisor is isolated: failures resubscribe with backoff and never block a run.",
 state:"Stateless apart from its own logic; command counts are metrics.",
 ceil:"Events are best effort, so a supervisor can miss a transition under load.",
 fail:"A supervisor can react to the events caused by its own commands and loop, capped only by the rate limit.",
 set:["yukta.supervisor.max-commands-per-second (20)","yukta.supervisor.dry-run","yukta.supervisor.rules.file"],
 risks:["supLoop","rbac15"]},
{id:"control",name:"Control Plane",tag:"commands, order, audit",c:1,r:1,mem:true,
 resp:"The ordered, acknowledged way to change a run that is already going.",
 how:["Commands (pause, resume, step, breakpoint, skip, retry node, stop DRAIN/CANCEL/KILL, restart, restart from node, signal, priority, limits) go through one FIFO queue per run.","The caller is acknowledged once the command is applied; each is recorded as CONTROL_APPLIED or CONTROL_REJECTED.","Stop is cooperative first: DRAIN lets in-flight work finish, CANCEL cuts, KILL is immediate.","Restart-from-node re-runs a node and its descendants and replays the recorded output of the nodes feeding it."],
 guar:"Per-run ordering, ack and audit for every command on a known run.",
 state:"Pending commands and valves in memory; the audit trail goes to the execution log.",
 ceil:"A single batched consumer; fine for human and supervisor rates, not designed as a high-volume API.",
 fail:"Limit and priority changes and one node command endpoint skip the reviewer chain today.",
 set:["yukta.supervisor.* (reviewers)"],
 risks:["reviewBypass","rbac15","restartRace"]},
{id:"obs",name:"Observation",tag:"tracker, progress, telemetry",c:2,r:1,mem:true,
 resp:"Turns what happens in a run into ordered state, live progress streams and metrics.",
 how:["One ordered event queue: state events are never dropped; log lines are best effort (over 10 000 waiting are dropped and counted).","A batched consumer feeds progress snapshots (REST, SSE, MCP), per-plugin meters and the run history the UI shows.","Each run is one trace observation with a child per node; a terminal sweep closes anything left open.","Key meters: node executions and duration, retries, run duration, queue wait, running/queued gauges, rejections by reason, checkpoint bytes, dropped events."],
 guar:"Ordered, complete state events; run and node timelines that agree with the log.",
 state:"All in memory; the newest runs are restored from the log after a restart.",
 ceil:"Unbounded state queue and per-session state that is never evicted: memory grows with sessions and event storms.",
 fail:"Tracker overflow cannot stop tracking (bounded sinks use offer, not emit).",
 set:["tracing: add a Micrometer tracer to the classpath"],
 risks:["evict21","trackerQ26","trackerSize27","spof"]},
{id:"dur",name:"Durability",tag:"log, checkpoints, recovery",c:2,r:2,mem:false,
 resp:"Makes a run explainable and resumable after the process dies.",
 how:["Execution log: run start (with payload), end, control audit and idempotency keys, written by one writer thread with compaction to the newest runs.","Checkpoints: each node's output, with a durable end marker written and forced before completion moves downstream. Memory store is capped by messages and bytes; the file store keeps everything.","Recovery on boot marks unfinished runs ABORTED and restores history. A resume claims the run once, replays nodes with an end marker and re-runs the rest.","The archive keeps the last N finished runs restartable (graph, payload, outputs)."],
 guar:"Resume trusts the end marker, never the log; a node over its cap refuses restart rather than replaying part of its output.",
 state:"Durable only if directories (or PostgreSQL for the log) are configured.",
 ceil:"Checkpoints are files or memory, not PostgreSQL; file I/O is on a single writer thread; log events are not fsynced.",
 fail:"A side effect in the instant before the end marker can repeat after a crash.",
 set:["yukta.execution-log.dir, retained-runs (500), compact-after (10000)","yukta.restart.dir, retained-executions (10), messages-per-node (200), bytes-per-node (4 MiB)"],
 risks:["cpstore","exactlyOnce22","logDur24","payload23"]},
{id:"persist",name:"Persistence Backends",tag:"memory, files, PostgreSQL",c:3,r:2,mem:false,
 resp:"The storage behind sessions, definitions and the log; chosen by one property.",
 how:["In-memory (default), file (atomic, fsynced) or PostgreSQL via R2DBC at run time with Flyway migrations over JDBC.","PostgreSQL backs session config, definitions with versions and the execution log; build it in with -Pyukta.persistence=postgres.","The log store interface is blocking, so the PostgreSQL log uses one writer thread and trims to the newest runs."],

scen:[
{id:"happy",name:"Happy path",steps:[
 {t:"A start request arrives",d:"The caller posts a start, optionally with an Idempotency-Key. The gateway loads the stored definition; a repeated key returns the first execution id.",c:["entry","def"],r:[]},
 {t:"Prepare once, share it",d:"The graph is validated (cycles, ports, size limits, policies) and compiled. Concurrent starts of the same content share one preparation, and the result is cached only if the definition is still current.",c:["def"],r:["prepAlign"]},
 {t:"Admission",d:"After preparing and before an id exists, the scheduler grants a slot or queues or refuses the start. No slot, no run.",c:["entry"],r:["restartRace"]},
 {t:"Wire the graph",d:"Each node gets merge, input valve, plugin, idle clock and broadcast. Every edge subscribes before the source connects so nothing is missed.",c:["engine"],r:[]},
 {t:"Messages flow",d:"Triggers produce, processors transform per message with the Reactor context (execution, node, heartbeat), terminals consume. The slowest child paces the whole fan-out.",c:["engine","plugin"],r:["backpressure25","payload23"]},
 {t:"Observe and record",d:"Ordered state events feed progress, SSE and meters. Each node's output is checkpointed and, when the node completes, a durable end marker is written before completion moves on.",c:["engine","obs","dur"],r:["trackerQ26","cpstore"]},
 {t:"Finish",d:"Terminals complete, the run ends SUCCESS, the slot is released, the end is logged and the archive keeps the run restartable.",c:["entry","obs","dur"],r:["logDur24"]}]},
{id:"overload",name:"Overload",steps:[
 {t:"A burst of starts",d:"Many starts arrive at once. With no limits configured (the default) all of them run; the only brake is the JVM.",c:["entry"],r:["spof"]},
 {t:"Limits kick in",d:"Global, per-workflow and per-session caps decide who runs. A start that does not fit waits (status QUEUED) or is refused with 429.",c:["entry"],r:["limits28"]},
 {t:"Fair, prioritised queue",d:"Waiting starts are ordered by payload priority, then by the session with the fewest running runs, then arrival. An operator can change a queued run's priority or the limits live.",c:["entry","control"],r:["reviewBypass"]},
 {t:"Queue full or too old",d:"Beyond the queue capacity (default 100) or a queue timeout the start ends refused or TIMED_OUT, counted by reason in a rejection metric.",c:["entry","obs"],r:[]},
 {t:"Shutdown under load",d:"Nothing new is admitted, queued starts are refused, running ones get 30 s to finish; the rest are ABORTED on next boot.",c:["entry","dur"],r:["spof"]}]},
{id:"failure",name:"Node failure",steps:[
 {t:"A message fails in a processor",d:"The plugin throws for one message. Nothing it emitted for that message is released yet: a message yields all of its output or none.",c:["engine","plugin"],r:["exactlyOnce22"]},
 {t:"Retry with backoff",d:"Exponential backoff with jitter re-runs the plugin for that message, by exception class if configured. Bad input (IllegalArgumentException) is not retried. Every attempt counts as activity.",c:["engine"],r:[]},
 {t:"Route the poison message",d:"With onError ROUTE the message, tagged with attempts, exception and time, goes to the error port and on to any dead-letter terminal. CONTINUE drops it; FAIL ends the node.",c:["engine"],r:[]},
 {t:"Failure budget",d:"If more than N messages fail in a window, the node fails instead of dropping or routing the next one, so a broken dependency cannot turn into silent data loss.",c:["engine","obs"],r:[]},
 {t:"Joins decide what a failed parent means",d:"ALL_SUCCESS fails the join, ALL_DONE continues with the others, ONE_SUCCESS fails only if every parent failed. Descendants of a failed node end UPSTREAM_FAILED.",c:["engine"],r:[]},
 {t:"The weak spot: a terminal that dies",d:"If a subtree stops reading because its terminal failed, siblings stall through back-pressure and the run only fails at the idle timeout.",c:["engine"],r:["failfast"]}]},
{id:"operator",name:"Operator steers",steps:[
 {t:"Pause",d:"The command enters the run's FIFO; the valve stops pulling input, in-flight elements finish, and all timers freeze so a pause never causes a timeout.",c:["control","engine"],r:[]},
 {t:"Step and breakpoint",d:"Step n lets exactly n elements through then pauses. A breakpoint holds a node at the first element whose payload or metadata matches.",c:["control","engine"],r:[]},
 {t:"Skip or retry a node",d:"A processor can be skipped at run time (messages bypass the plugin); a node that ended FAILURE or TIMED_OUT can be re-run with its recorded input plus everything behind it.",c:["control","engine","dur"],r:["restartRace"]},
 {t:"Review and audit",d:"Reviewers may refuse any command (403). Every command on a known run is logged as applied or rejected, with the actor.",c:["control","dur"],r:["reviewBypass","rbac15"]},
 {t:"Stop",d:"DRAIN lets work finish with a deadline, CANCEL cancels, KILL is immediate. The run ends STOPPED and its slot is released.",c:["control","engine","entry"],r:[]}]},
{id:"supervisor",name:"Supervisor intervenes",steps:[
 {t:"Events are published",d:"The tracker and command outcomes feed one global event stream. Delivery is best effort and never blocks a run.",c:["obs"],r:["trackerQ26"]},
 {t:"A supervisor receives them",d:"Each supervisor reads through a bounded buffer of 256 on its own scheduler. If it is slow, events are dropped and counted, not queued.",c:["obs","super"],r:[]},
 {t:"It answers with commands",d:"A rule (JSON + SpEL), an AI agent or a bean returns control commands; they are rate limited to 20/s, can be dry-run and carry the supervisor id as actor.",c:["super","control"],r:["rbac15"]},
 {t:"Reviewers and the loop",d:"Reviewers can still refuse. But a supervisor sees the status events its own command causes (pause becomes PAUSED) and can chase its own tail, limited only by the rate cap.",c:["control","engine","super"],r:["supLoop"]}]},
{id:"crash",name:"Crash and resume",steps:[
 {t:"The JVM dies mid-run",d:"Memory is gone: tracker, scheduler slots, queued starts, signal waits. On disk (if configured): the log with the start payload, and checkpoint outputs with end markers.",c:["engine","obs","dur"],r:["spof","logDur24"]},
 {t:"Boot recovery",d:"Unfinished runs are marked ABORTED, the newest runs are restored into history, idempotency keys are reloaded so a retrying client still gets its first id.",c:["dur","persist","entry"],r:[]},
 {t:"Someone asks to resume",d:"The resumer claims the run exactly once; it is refused if the run was not aborted, was already resumed or its definition changed. It is a core call today: there is no REST or MCP endpoint for it yet.",c:["entry","control"],r:[]},
 {t:"Replay what finished, re-run the rest",d:"Nodes with a durable end marker replay their recorded output; the others run again from their inputs. Without file stores nothing is resumable.",c:["dur","engine"],r:["cpstore"]},
 {t:"The at-least-once window",d:"A side effect executed between the plugin acting and the marker being written can happen twice. Only plugin-side idempotency on the message id closes it.",c:["plugin","dur"],r:["exactlyOnce22"]}]},
{id:"sub",name:"Sub-workflow fan-out",steps:[
 {t:"A node starts a child per message",d:"SUB_WORKFLOW calls the start path with the child id as a normal run; it carries depth and the parent id, and nesting stops at 5.",c:["plugin","sub","entry"],r:[]},
 {t:"Children need slots",d:"Each child is admitted like any run. With max-concurrent too small the parent holds a slot while its children wait for one: a deadlock until a timeout.",c:["entry","sub"],r:["subDeadlock"]},
 {t:"Results flow back",d:"Terminal nodes of the child feed a collector; the parent node emits executionId and results[]. A failing child fails the node and the parent's failure policy applies.",c:["sub","engine"],r:[]},
 {t:"Stopping the parent",d:"The children keep running: no cascading cancel yet, and run history does not link parent and child.",c:["control","sub"],r:["subDeadlock"]}]}

risks:[
{id:"spof",t:"Control state lives in one process",a:"Availability",i:5,e:5,c:["entry","engine","obs","control"],why:"Tracker, scheduler slots, queued starts and signal waits vanish with the JVM. Durable files let you resume, not stay up.",o:"Active/standby with a PostgreSQL lease and a checkpoint store in PostgreSQL (F11 phase 6); or accept downtime and document the recovery time.",q:"What outage duration can your users tolerate, and is resume-after-restart enough for that?",ph:"p6"},
{id:"cpstore",t:"Checkpoints are not in PostgreSQL",a:"Availability",i:4,e:4,c:["dur","persist"],why:"Resume needs a local directory even when the rest is in PostgreSQL, which blocks stateless deployment and standby.",o:"Move the store behind the same interface; decide large payloads (claim check or TOAST); the store has blocking completeness checks to rework.",q:"Is a pod restart on another node a supported scenario?",ph:"f10"},
{id:"remote",t:"No scale-out of node execution",a:"Scalability",i:5,e:5,c:["engine","plugin"],why:"CPU and IO heavy plugins compete with the control plane in one JVM.",o:"Remote workers (design written): control plane keeps the DAG and policies, workers run processor nodes over a bidirectional stream.",q:"Transport, packaging, secrets, first plugins and payload limit are still undecided. Which has the highest cost to reverse?",ph:"p2"},
{id:"exactlyOnce22",t:"Exactly-once is impossible",a:"Reliability",i:4,e:5,c:["dur","plugin"],why:"A side effect between the plugin acting and the end marker can repeat; remote workers widen the window.",o:"Keep at-least-once, publish idempotency patterns, add result caching keyed by message id (F12).",q:"Which of your plugins can safely run twice, and which cannot?",ph:""},
{id:"payload23",t:"Large payloads are carried through the engine",a:"Performance",i:4,e:4,c:["engine","dur"],why:"Every message is in memory and in checkpoints; over the cap a restart is refused. Remote workers make the control plane a data hop.",o:"Claim-check references to an object store or large objects; a frame size limit.",q:"What is the largest message you expect in a year?",ph:"f10"},
{id:"failfast",t:"A dead branch stalls its siblings (B16)",a:"Reliability",i:3,e:3,c:["engine"],why:"If a subtree stops reading, back-pressure stops siblings and the run fails only at the idle timeout.",o:"On a downstream cancel-with-error, propagate failure to the run immediately.",q:"Should one failed terminal always fail the whole run?",ph:""},
{id:"backpressure25",t:"Slowest child paces every fan-out",a:"Performance",i:3,e:3,c:["engine"],why:"By design: safe, but a slow audit sink can throttle the main path.",o:"A per-edge buffer or drop policy for non-critical branches, chosen explicitly.",q:"Which consumers are allowed to fall behind?",ph:""},
{id:"evict21",t:"Finished sessions are never evicted (B21)",a:"Scalability",i:3,e:2,c:["obs"],why:"Memory grows with the number of sessions; evicting would drop history the UI shows.",o:"Max-sessions or TTL with history served from the log.",q:"What is the retention promise for run history?",ph:""},
{id:"trackerQ26",t:"State event queue is unbounded",a:"Scalability",i:3,e:2,c:["obs"],why:"State events are never dropped, so an event storm becomes memory growth rather than data loss.",o:"Alert on queue depth; consider coalescing progress events.",q:"Would you rather lose events or run out of memory?",ph:""},
{id:"trackerSize27",t:"Tracker is large; run status has no forward-only guard (B27)",a:"Evolvability",i:2,e:2,c:["obs"],why:"Node status is guarded, run status is not; the class is about 1000 lines.",o:"Extract history and cleanup projections; add the same guard to run status.",q:"",ph:""},
{id:"supLoop",t:"Supervisors can loop on their own effects (B25)",a:"Reliability",i:2,e:2,c:["super"],why:"Pause causes a PAUSED event the supervisor sees again; capped only by the rate limit.",o:"Tag events caused by a command with its actor and let the host filter them.",q:"",ph:""},
{id:"blockStart",t:"Blocking file work on the start path (B19)",a:"Performance",i:2,e:1,c:["entry"],why:"Archive cleanup clears checkpoint files before the run's scheduler hop.",o:"Defer the whole execute call.",q:"",ph:""},
{id:"prepAlign",t:"Validator and assembler disagree in corners (B26)",a:"Correctness",i:2,e:2,c:["def"],why:"What counts as a terminal differs; a failed checkpoint save fails a node while a failed end marker does not.",o:"Align the checks; no caller triggers it today.",q:"",ph:""},
{id:"restartRace",t:"Restart has the start-time slot race (R1)",a:"Correctness",i:3,e:2,c:["entry","control"],why:"Check-then-acquire on restart can exceed a limit by one.",o:"Reserve the slot before returning the new id, as starts do.",q:"",ph:""},
{id:"reviewBypass",t:"Limit/priority commands skip reviewers and audit (B4)",a:"Security",i:3,e:3,c:["control","entry"],why:"Some commands do not pass the reviewer chain; one node command is keyed by workflow, not run.",o:"New sealed command types in the plugin API with processors.",q:"Is the reviewer chain a security boundary or a convenience?",ph:""},
{id:"limits28",t:"Runtime limit changes are not restored",a:"Operability",i:2,e:1,c:["entry"],why:"After a restart the limits revert to configuration.",o:"Reload the latest limit change from the log, or treat configuration as the source of truth and say so.",q:"",ph:""},
{id:"logPath",t:"Path traversal in a log reader (S3)",a:"Security",i:3,e:1,c:["plugin"],why:"Execution id is not validated; the reader is not wired yet.",o:"Fix before wiring.",q:"",ph:""},
{id:"procDefault",t:"Command allow-list is opt-in (S4)",a:"Security",i:4,e:2,c:["plugin"],why:"With the list unset any executable can run from a workflow.",o:"Deny by default in the next major release; keep a migration switch.",q:"Who can author workflows today, and are they trusted?",ph:""},
{id:"rbac15",t:"Roles stop at REST (F3)",a:"Security",i:4,e:3,c:["control","super"],why:"MCP has one key; no tenant scoping or key rotation; no who-did-what view.",o:"Roles for MCP, hashed rotating keys, per-session scoping, audit view in the UI.",q:"Is this multi-tenant, and if so where is the isolation boundary?",ph:""},
{id:"signals14",t:"Approval waits are in memory (F2)",a:"Reliability",i:3,e:3,c:["plugin","dur"],why:"A resumed run waits again; a signal before the wait is refused; no UI for pending approvals.",o:"Durable waits in the checkpoint store, queued signals, an approvals page.",q:"How long do your approvals take, hours or days?",ph:""},
{id:"llmBudget",t:"Budgets stop at one plugin (F4)",a:"Governance",i:3,e:3,c:["plugin"],why:"No per-provider rate limit, no budget across MCP calls, no hard stop of the run.",o:"A shared budget service keyed by run and provider.",q:"",ph:""},
{id:"toolGuard",t:"Tool and prompt guards are thin (F5)",a:"Security",i:3,e:3,c:["plugin"],why:"Allow-lists exist per node; no gateway-level allowlist, argument rules or prompt-injection filters.",o:"Gateway-level policy plus input/output filters.",q:"",ph:""},
{id:"subDeadlock",t:"Sub-workflow slot deadlock (F6)",a:"Reliability",i:4,e:3,c:["sub","entry"],why:"Parent waits on children that wait for the parent's slot; no cascade cancel; no parent/child history.",o:"Let a child borrow its parent's slot; cascade stop; link runs in history.",q:"",ph:""},
{id:"memStore",t:"Agent memory is partly volatile (F7)",a:"Reliability",i:3,e:3,c:["plugin"],why:"KV_STORE is memory; chat history has no TTL and loads whole files; no shared or vector memory.",o:"Database backend after F10, eviction policy.",q:"",ph:"f10"},
{id:"agentLoop",t:"Agent loop is incomplete (F8)",a:"Functionality",i:2,e:2,c:["plugin"],why:"Tool results return as a plain user turn; tools/list is first page only; no streaming.",o:"Proper tool-role turns, pagination, an example loop workflow.",q:"",ph:""},
{id:"versions21",t:"Version history lacks diff and pinning (F9)",a:"Functionality",i:2,e:2,c:["def"],why:"No MCP tools, no diff, no notes, no UI.",o:"Expose versions through MCP and UI; pin a run to a version.",q:"",ph:""},

function saveN(id,k,v){var n=notes[id]||{};n[k]=v;if(!n.s&&!n.n)delete notes[id];else notes[id]=n;store.set("yk-arch-notes",notes)}
function board(){var vis=visible(),b=$("#boardBody");
 if(!vis.length){b.innerHTML='<div class="card refs" style="text-align:center">No risks match these filters.</div>';return}
 if(view==="grid"){var cell=100,m=40,s="",cnt={};
  [1,2,3,4,5].forEach(function(){});
  s+='<rect class="q" x="'+m+'" y="10" width="'+cell*2.5+'" height="'+cell*2.5+'"/><rect class="q" x="'+(m+cell*2.5)+'" y="10" width="'+cell*2.5+'" height="'+cell*2.5+'" style="fill:var(--accent-soft)"/><rect class="q" x="'+m+'" y="'+(10+cell*2.5)+'" width="'+cell*2.5+'" height="'+cell*2.5+'"/><rect class="q" x="'+(m+cell*2.5)+'" y="'+(10+cell*2.5)+'" width="'+cell*2.5+'" height="'+cell*2.5+'"/>';
  s+='<text class="ql" x="'+(m+8)+'" y="28">High impact, low effort: do first</text><text class="ql" x="'+(m+cell*2.5+8)+'" y="28">High impact, high effort: plan</text><text class="ql" x="'+(m+8)+'" y="'+(10+cell*5-8)+'">Low impact, low effort: fill in</text><text class="ql" x="'+(m+cell*2.5+8)+'" y="'+(10+cell*5-8)+'">Low impact, high effort: question</text>';
  s+='<text class="ql" x="'+(m+cell*2.5)+'" y="'+(cell*5+36)+'" text-anchor="middle">Effort →</text><text class="ql" transform="translate(12 '+(10+cell*2.5)+') rotate(-90)" text-anchor="middle">Impact →</text>';
  vis.forEach(function(r){var k=r.i+"-"+r.e,j=cnt[k]=(cnt[k]||0),dx=(j%3-1)*22,dy=(Math.floor(j/3)-0.5)*22;cnt[k]++;var x=m+(r.e-0.5)*cell+dx,y=10+(5-r.i+0.5)*cell+dy;
   s+='<g class="dot" data-open="'+r.id+'" tabindex="0" role="button" aria-label="'+esc(r.t)+'"><circle cx="'+x+'" cy="'+y+'" r="11" fill="'+(r.i>=4?"var(--p0)":r.i===3?"var(--p1)":"var(--p3)")+'"/><text x="'+x+'" y="'+(y+3)+'" text-anchor="middle">'+(D.risks.indexOf(r)+1)+'</text></g>'});
  b.innerHTML='<div class="card"><svg class="matrix" viewBox="0 0 '+(m+cell*5+10)+' '+(cell*5+50)+'" role="img" aria-label="Impact versus effort">'+s+'</svg><p class="refs">Dots are numbered by their order in the list view; click one to open it. Red = impact 4-5, amber = 3, grey = lower.</p></div>';return}
 b.innerHTML=vis.map(function(r){var n=notes[r.id]||{};return '<details class="item" id="r-'+r.id+'"><summary><span class="id">'+(D.risks.indexOf(r)+1)+'</span><span class="t">'+esc(r.t)+'</span><span class="meta"><span class="pill '+(r.i>=4?"P0":r.i===3?"P1":"P3")+'">impact '+r.i+'</span><span class="pill P3">effort '+r.e+'</span><span class="pill P2">'+r.a+'</span>'+(n.s?'<span class="pill okp">'+n.s+'</span>':"")+'</span></summary><div class="body"><dl><dt>Why it matters</dt><dd>'+r.why+'</dd><dt>Options</dt><dd>'+r.o+'</dd>'+(r.q?'<dt>Think about</dt><dd><div class="callout q" style="margin:0">'+r.q+'</div></dd>':"")+'<dt>Components</dt><dd>'+r.c.map(compChip).join("")+'</dd><dt>Your status</dt><dd><select data-st="'+r.id+'" aria-label="Status"><option value="">Unset</option>'+["Idea","Investigating","Planned"].map(function(s){return '<option'+(n.s===s?" selected":"")+'>'+s+'</option>'}).join("")+'</select></dd><dt>Your note</dt><dd><textarea data-nt="'+r.id+'" placeholder="Your thinking...">'+esc(n.n||"")+'</textarea></dd></dl></div></details>'}).join("")}
$("#boardBody").addEventListener("change",function(e){var id=e.target.getAttribute("data-st");if(id){saveN(id,"s",e.target.value)}});
$("#boardBody").addEventListener("input",function(e){var id=e.target.getAttribute("data-nt");if(id)saveN(id,"n",e.target.value)});
$("#boardBody").addEventListener("click",function(e){var d=e.target.closest("[data-open]");if(d)openRisk(d.getAttribute("data-open"))});
$("#vList").onclick=function(){view="list";$("#vList").setAttribute("aria-pressed","true");$("#vGrid").setAttribute("aria-pressed","false");board()};
$("#vGrid").onclick=function(){view="grid";$("#vGrid").setAttribute("aria-pressed","true");$("#vList").setAttribute("aria-pressed","false");board()};
$("#statFilter").onchange=function(e){stF=e.target.value;board()};
$("#rq").oninput=function(e){rq=e.target.value.trim().toLowerCase();board()};
function openRisk(id){view="list";$("#vList").setAttribute("aria-pressed","true");$("#vGrid").setAttribute("aria-pressed","false");aOn={};attrs.forEach(function(a){aOn[a]=true});$$("#attrFilters button").forEach(function(b){b.setAttribute("aria-pressed","true")});stF="";rq="";$("#statFilter").value="";$("#rq").value="";board();
 var d=$("#r-"+id);if(d){d.open=true;d.classList.add("hl");d.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(function(){d.classList.remove("hl")},2000)}}
$("#copyBtn").onclick=function(){var md="# Yukta core: my architecture notes\n\n";var any=false;D.risks.forEach(function(r){var n=notes[r.id];if(!n)return;any=true;md+="## "+r.t+"\n- Attribute: "+r.a+" · impact "+r.i+" · effort "+r.e+"\n"+(n.s?"- Status: "+n.s+"\n":"")+(n.n?"- Note: "+n.n.replace(/\n/g,"\n  ")+"\n":"")+"\n"});
 var msg=$("#copyMsg"),ta=$("#copyArea");if(!any){msg.textContent="Nothing to copy yet. Set a status or note first.";return}
 ta.hidden=false;ta.value=md;ta.rows=10;
 var done=function(){msg.textContent="Copied."},fail=function(){msg.textContent="Select the text below and copy it."};
 try{navigator.clipboard.writeText(md).then(done,fail)}catch(e){fail()}};
board();

/* ---- risk and component jumps ---- */
document.addEventListener("click",function(e){var r=e.target.closest("[data-risk]");if(r&&!r.closest("#boardBody")||(r&&r.closest("#boardBody")&&false)){e.preventDefault();openRisk(r.getAttribute("data-risk"));return}
 var c=e.target.closest("[data-comp]");if(c){e.preventDefault();pick(c.getAttribute("data-comp"));$("#map").scrollIntoView({behavior:"smooth"})}});
document.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target;if(t.matches&&t.matches("a.chip,.dot")){e.preventDefault();t.click?t.click():0}});

/* ---- prompts ---- */
var pi=0;
function deck(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
 $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}}
deck();

/* ---- nav ---- */
var links=$$("nav.side a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
</script>
</body>
</html>
