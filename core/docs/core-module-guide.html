<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta Core Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0}
pre code{background:none;padding:0}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:56px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
.lede{color:var(--muted);max-width:760px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul,.card ol{padding-left:18px;margin:6px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;text-decoration:none}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"]{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"]{color:#111}}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);min-width:220px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pipe{width:100%;height:auto;display:block}
.pipe .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2;transition:fill .15s,stroke .15s}
.pipe .box text{fill:var(--text);font:600 13px var(--sans)}
.pipe .box .s{fill:var(--muted);font:12px var(--mono)}
.pipe .box.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.pipe .arrow{stroke:var(--muted);stroke-width:1.4;fill:none}
.pipe .box{cursor:pointer}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.stepbody h3{margin-top:0}
.refs{font-size:13px;color:var(--muted)}
.flag{border-left:3px solid var(--p1);background:var(--p1-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:10px;font-size:14px}
.flag.p0{border-color:var(--p0);background:var(--p0-soft)}
.pkgs{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.pkglist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:6px;padding:7px 10px;background:transparent;font-family:var(--mono);font-size:12.5px}
.pkglist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.finding{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.finding summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}
.finding summary::-webkit-details-marker{display:none}
.finding .id{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:30px}
.finding .t{font-weight:600}
.finding .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.finding .body{padding:0 14px 14px 14px;border-top:1px solid var(--line)}
.finding .body dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;margin:12px 0 0}
.finding .body dt{color:var(--muted);font-size:13px}
.finding .body dd{margin:0;min-width:0;overflow-wrap:anywhere}
.finding.done{opacity:.55}
.finding.done .t{text-decoration:line-through}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.progress .bar{flex:1;height:8px;margin:0}
.progress .bar>i{background:var(--ok)}
.empty{color:var(--muted);padding:20px;text-align:center}
.score td:nth-child(2){font-family:var(--mono);white-space:nowrap}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.pkgs{grid-template-columns:1fr}
  .finding summary{grid-template-columns:auto minmax(0,1fr)}
  .finding .meta{grid-column:1/-1}
  .finding .body dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
</nav>
<main id="main"></main>
</div>
<script>
var DATA = {"module": "core", "htmlTitle": "Yukta Core Guide", "title": "Core module guide (round 2)", "date": "2026-10-10", "lede": "Yukta's DAG engine and control plane, re-reviewed against the goal of a <b>super-efficient, resilient, richly controllable<\/b> orchestrator. This guide covers the execution pipeline, the 20 classic DAG pitfalls compared with Airflow, Temporal, Argo and Flink, the target control model, node state machine and time model, and the round-2 improvement board.", "stats": [["13.3k", "main lines"], ["93", "test classes"], ["32/36", "round-1 items closed"]], "overviewHtml": "<h3>Where the engine stands<\/h3><p>After round 1, the streaming core is sound. Status is typed and control state is separate. Broadcast uses <code>publish()<\/code> with real backpressure and connects only after every edge has subscribed. Dead control code is gone. Round 2 found the remaining weaknesses in <b>time<\/b> (timeouts start at subscription and count upstream and pause time), <b>state<\/b> (nodes aren't finalised; events aren't ordered), <b>control<\/b> (step loses credits, pause leaks, commands aren't acknowledged, stop is a hard cancel), and <b>durability<\/b> (everything in memory; restart-from-node broken). Five issues were reproduced against the real classes.<\/p><div class=\"flag p0\"><b>Read first:<\/b> <a href=\"#f-R1\" data-jump=\"R1\">R1<\/a>. With default config, any step longer than 30 s fails the run.<\/div>", "score": [["Streaming and backpressure", "3 → 4.5", "publish() broadcast"], ["Status model", "2 → 3.5", "Typed; node terminal states missing"], ["Time semantics", "1.5", "R1, R2"], ["Failure semantics", "2.5", "Fail-fast only"], ["Control plane", "2 → 2.5", "Credits, acks, drain"], ["Restart and recovery", "2 → 1.5", "R4, R10"], ["Governance", "2 → 2.5", "No admission"], ["Simplicity", "2.5 → 4", "Builders and dead code removed"], ["Observability", "2", "Logs only"]], "flowTitle": "Execution pipeline (round 2)", "steps": [{"k": "Admit", "cls": "ControlBusGateway.startWorkflow", "d": "Loads the definition, prepares it (or takes it from the cache), then <code>execute(...).subscribe()<\/code> fire-and-forget. No limits, no queue, no idempotency key.", "f": ["R11", "R15", "R14"]}, {"k": "Prepare", "cls": "WorkflowPreparator · WorkflowValidator", "d": "Validates, builds the adjacency maps, initialises plugins, sorts with Kahn, and compiles one assembler per node.", "f": ["R12"]}, {"k": "Register", "cls": "ExecutionControlFactory · Registry", "d": "Per-run stop sinks, pause valves and skip flags. Registered until the run ends; runs are not durable.", "f": ["R10"]}, {"k": "Assemble", "cls": "*AssemblerStrategy · NodeStreams", "d": "Each node: merge parents → pre-controls → plugin → <code>timeout(30 s)<\/code> and status → post-controls (pause valve) → broadcast.", "f": ["R1", "R5", "R8"]}, {"k": "Connect", "cls": "NodeBroadcast · ExecutionResources", "d": "Every edge subscribes, then <code>publish()<\/code> connects, so the slowest child sets the pace. All node clocks start here.", "f": ["R1", "R13"]}, {"k": "Run", "cls": "WorkflowOrchestrator.runTracked", "d": "<code>firstWithSignal(run, stop)<\/code>; a stop cancels everything at once. Run timeout counts paused time.", "f": ["R2", "R7"]}, {"k": "Control", "cls": "ControlBusService → Dispatcher → Processor", "d": "Commands are queued, batched, priority-sorted and applied without an ack. Restart only works for runs that are still active.", "f": ["R9", "R4", "R5"]}, {"k": "Track", "cls": "DefaultTaskTrackerService", "d": "Three independently batched sinks feed progress and SSE. Nodes aren't finalised on cancel.", "f": ["R3", "R6", "R16"]}, {"k": "Finish", "cls": "runTracked doFinally", "d": "Unregisters the control and clears the checkpoints, so restart-from-node of this run is no longer possible.", "f": ["R4", "R10"]}], "pkgs": [["service/orchestrator", 1, 292, "WorkflowOrchestrator: execute, restartFromNode, and runTracked (start → body → firstWithSignal(stop) → finish → cleanup).", "com.infenia.yukta.service.orchestrator"], ["service/orchestrator/preparator", 2, 307, "WorkflowPreparator (validate → build maps → init plugins → Kahn sort → compile) and TopologicalSortService.", "com.infenia.yukta.service.orchestrator.preparator"], ["service/orchestrator/validator", 1, 392, "WorkflowValidator: unknown edges, categories, entry and end points, cycles (recursive DFS), plugin contexts and configs.", "com.infenia.yukta.service.orchestrator.validator"], ["service/orchestrator/compiler", 2, 438, "WorkflowCompiler (assemblers, template) and ExecutionResources (Mono.using, run timeout, connectors).", "com.infenia.yukta.service.orchestrator.compiler"], ["service/orchestrator/strategy", 5, 603, "Trigger, Processor and Terminal assembler strategies plus StreamAssemblyHelper (context, lifecycle, controls).", "com.infenia.yukta.service.orchestrator.strategy"], ["service/orchestrator/stream", 3, 374, "NodeStreams (timeout and status), NodeBroadcast (publish/connect after every edge subscribes), StreamTopologyDecorator.", "com.infenia.yukta.service.orchestrator.stream"], ["service/orchestrator/assembly", 2, 251, "AssemblyContext and ExecutionContextBuilder (Reactor context keys).", "com.infenia.yukta.service.orchestrator.assembly"], ["service/orchestrator/tracker", 2, 1206, "TaskTrackerService and DefaultTaskTrackerService: typed status, ControlState, three batched sinks, SSE projections, history cap.", "com.infenia.yukta.service.orchestrator.tracker"], ["service/control", 3, 661, "ControlBusService (batched, priority-sorted command bus), ExecutionControl (stop sinks, valves) and the snapshot.", "com.infenia.yukta.service.control"], ["service/control/gateway", 3, 1298, "ControlBusGateway façade: start, stop, pause, step, restart, watch, history.", "com.infenia.yukta.service.control.gateway"], ["service/control/processor", 12, 1018, "One processor per command; they mutate ExecutionControl and report ControlState.", "com.infenia.yukta.service.control.processor"], ["service/control/directive", 4, 322, "DirectiveDispatcher plus heartbeat, statistics and signal handlers.", "com.infenia.yukta.service.control.directive"], ["service/control/valve", 1, 120, "ReactiveControlValve: pause, resume and step (step credits are lost, R5).", "com.infenia.yukta.service.control.valve"], ["service/control/store", 4, 329, "ExecutionControlRegistry/Store and ActivePluginRegistry.", "com.infenia.yukta.service.control.store"], ["service/control/factory", 1, 76, "ExecutionControlFactory: per-node sinks, valves and skip flags.", "com.infenia.yukta.service.control.factory"], ["service/store", 1, 56, "InMemoryNodeCheckpointStore: last message per node, cleared at run end.", "com.infenia.yukta.service.store"], ["service/workflow/store", 4, 331, "WorkflowDefinitionStore and PreparedWorkflowCache (Caffeine).", "com.infenia.yukta.service.workflow.store"], ["service/session/store", 4, 999, "Session config: file (atomic writes) or in-memory.", "com.infenia.yukta.service.session.store"], ["model/execution", 6, 185, "TaskStatus (with STOPPED), ControlState, TaskProgress, WorkflowProgress, summaries.", "com.infenia.yukta.model.execution"], ["config", 2, 101, "AppConfiguration: virtual-thread bounded-elastic scheduler, control store.", "com.infenia.yukta.config"], ["util", 2, 407, "VariableResolver (env/sys allow-listing) and MapUtils.", "com.infenia.yukta.util"]], "sections": [{"id": "pitfalls", "title": "DAG pitfalls: R&D matrix", "lede": "Twenty failure modes that mature orchestrators design for, how they solve them, and where Yukta stands. Sources: Airflow trigger rules, Temporal event history, Flink checkpointing, Argo retries and synchronization (links in core-improvements.md §7).", "html": "<div class=\"card tablewrap\"><table><tr><th>#<\/th><th>Pitfall<\/th><th>Established solution<\/th><th>Yukta<\/th><th>Next step<\/th><\/tr><tr><td>1<\/td><td><b>Cycles and malformed graphs<\/b><\/td><td>Reject at definition time with precise errors<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>Duplicate ids/edges, port names, size limits (R12)<\/td><\/tr><tr><td>2<\/td><td><b>Join after a branch never fires (dead path)<\/b><\/td><td>Airflow trigger rules; none_failed_min_one_success after branches<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>No hang (merge completes), but no trigger rules (R8); emit SKIPPED (R3)<\/td><\/tr><tr><td>3<\/td><td><b>Fan-out to a slow child<\/b><\/td><td>Credit-based flow control (Flink), bounded buffers<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>publish(bufferSize) limits the parent to the slowest child<\/td><\/tr><tr><td>4<\/td><td><b>Late subscriber misses data<\/b><\/td><td>Start the source only when all consumers are ready<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>NodeBroadcast connects after every edge subscribes<\/td><\/tr><tr><td>5<\/td><td><b>Timeouts count queue wait and pause time<\/b><\/td><td>Separate schedule-to-start, start-to-close and heartbeat timeouts (Temporal)<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Idle timeout runs from subscription (R1, R2)<\/td><\/tr><tr><td>6<\/td><td><b>Long-running work looks dead<\/b><\/td><td>Activity heartbeats with a heartbeat timeout<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Add a plugin heartbeat API<\/td><\/tr><tr><td>7<\/td><td><b>A transient failure fails the run<\/b><\/td><td>Retry with backoff, cap and jitter (Argo, Temporal, Airflow)<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Per-node retry policy (R8)<\/td><\/tr><tr><td>8<\/td><td><b>Retries duplicate side effects<\/b><\/td><td>Idempotency keys; at-least-once plus idempotent work<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>messageId plus attempt header; documented semantics<\/td><\/tr><tr><td>9<\/td><td><b>Fail-fast vs partial results<\/b><\/td><td>fail_fast / all_done / error handlers<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>onError FAIL, CONTINUE or ROUTE(error) (R8)<\/td><\/tr><tr><td>10<\/td><td><b>A crash loses state<\/b><\/td><td>Event-sourced history replay (Temporal); checkpoints (Flink)<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Execution event log plus recovery (R10)<\/td><\/tr><tr><td>11<\/td><td><b>Re-running part of a graph<\/b><\/td><td>Clear downstream (Airflow); reset (Temporal)<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Descendant-subgraph restart with replay (R4)<\/td><\/tr><tr><td>12<\/td><td><b>Definition changes under running runs<\/b><\/td><td>Versioning and patch markers<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Content-hash version per run (R14)<\/td><\/tr><tr><td>13<\/td><td><b>Unbounded concurrency<\/b><\/td><td>Argo parallelism and semaphores; Airflow pools<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Admission scheduler with limits (R11)<\/td><\/tr><tr><td>14<\/td><td><b>Cancellation doesn&#x27;t reach the work<\/b><\/td><td>Cooperative cancel, then forced<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>Drain, cancel and kill modes (R7)<\/td><\/tr><tr><td>15<\/td><td><b>Control commands race or reorder<\/b><\/td><td>Signals serialised per workflow (Temporal)<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Per-execution FIFO with acks (R9)<\/td><\/tr><tr><td>16<\/td><td><b>Can&#x27;t see why it&#x27;s slow or stuck<\/b><\/td><td>Per-task metrics and traces<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>Micrometer and OpenTelemetry (R16)<\/td><\/tr><tr><td>17<\/td><td><b>A poison message blocks the stream<\/b><\/td><td>Dead-letter queue, error ports<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>ROUTE(error) plus a DLQ terminal (R8)<\/td><\/tr><tr><td>18<\/td><td><b>UI shows a finished run with running nodes<\/b><\/td><td>One ordered history per execution<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Single ordered event log (R6)<\/td><\/tr><tr><td>19<\/td><td><b>Large payloads in every buffer<\/b><\/td><td>Claim-check pattern<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>Use the ClaimCheckStore SPI<\/td><\/tr><tr><td>20<\/td><td><b>Starvation and priority<\/b><\/td><td>Priority queues and weights<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>Priority on queued runs (R11)<\/td><\/tr><\/table><\/div>"}, {"id": "control", "title": "Control model: target vs today", "lede": "Every command goes through one per-execution FIFO queue. It's idempotent (commandId), acknowledged (APPLIED, REJECTED or NOOP) and recorded in the execution log.", "html": "<div class=\"card tablewrap\"><table><tr><th>Command<\/th><th>Target semantics<\/th><th>Today<\/th><th><\/th><\/tr><tr><td><b>Pause run / node<\/b><\/td><td>Stop pulling input; in-flight elements finish; timers suspended<\/td><td>Output-side filterWhen (up to 256 elements leak); timers keep counting<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><tr><td><b>Resume<\/b><\/td><td>Release the gate<\/td><td>Works<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Step n<\/b><\/td><td>Exactly n input elements, then pause<\/td><td>Credits are lost (2 steps → 0 pass)<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><tr><td><b>Breakpoint (new)<\/b><\/td><td>Pause when a predicate matches an element<\/td><td>—<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><tr><td><b>Skip node<\/b><\/td><td>Pass-through or SKIPPED, propagated by trigger rules<\/td><td>Rejected at runtime<\/td><td><span class=\"pill P2\">partial<\/span><\/td><\/tr><tr><td><b>Stop run<\/b><\/td><td>DRAIN → CANCEL → KILL with a deadline<\/td><td>Hard cancel only<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><tr><td><b>Stop node<\/b><\/td><td>DRAIN or CANCEL a single node<\/td><td>Safe and immediate sinks work<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Retry node (new)<\/b><\/td><td>Re-run a failed node with its recorded input<\/td><td>—<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><tr><td><b>Restart run<\/b><\/td><td>New run, same version and payload<\/td><td>Works (doesn&#x27;t pin the version)<\/td><td><span class=\"pill P2\">partial<\/span><\/td><\/tr><tr><td><b>Restart from node<\/b><\/td><td>Descendants only; boundary inputs replayed<\/td><td>Broken (wrong key; running runs only; last message only; topological cut)<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><tr><td><b>Set concurrency / priority (new)<\/b><\/td><td>Adjust limits on queued or running runs<\/td><td>—<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><tr><td><b>Inject message (new)<\/b><\/td><td>Push a message onto an edge for debugging<\/td><td>—<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><\/table><\/div>"}, {"id": "states", "title": "Node state machine", "html": "<div class=\"card\"><pre><code>PENDING ──first input / trigger start──▶ RUNNING ──complete──▶ SUCCESS\n   │                                 │ ├─error, retries left──▶ RETRYING ──▶ RUNNING\n   │                                 │ ├─error, exhausted─────▶ FAILURE ──onError=ROUTE──▶ error port\n   │                                 │ ├─timeout──────────────▶ TIMED_OUT\n   │                                 │ ├─pause────────────────▶ PAUSED ──resume──▶ RUNNING\n   │                                 │ └─cancel / stop────────▶ CANCELLED\n   ├─all inputs complete, none received────────────▶ SKIPPED\n   ├─upstream failed, trigger rule not met─────────▶ UPSTREAM_FAILED\n   └─run ended before the node started─────────────▶ CANCELLED\n\nRun: QUEUED → RUNNING → SUCCESS | FAILURE | STOPPED | TIMED_OUT | ABORTED (crash)<\/code><\/pre>\n<p class=\"refs\">Today: TaskStatus = PENDING, RUNNING, SUCCESS, FAILURE, ERROR, STOPPED, and nodes are never finalised (R3).<\/p><\/div>"}, {"id": "time", "title": "Time model", "lede": "Clocks start when work starts, not when the graph is wired, and every clock is pause-aware.", "html": "<div class=\"card tablewrap\"><table><tr><th>Timer<\/th><th>Starts<\/th><th>Pauses<\/th><th>Default<\/th><th>Today<\/th><\/tr><tr><td>Queue wait<\/td><td>Admission<\/td><td>—<\/td><td>Reported only<\/td><td>No queue<\/td><\/tr><tr><td>Node processing (per element)<\/td><td>Element received<\/td><td>Yes<\/td><td>Plugin-declared<\/td><td>—<\/td><\/tr><tr><td>Node idle<\/td><td>First input / last output<\/td><td>Yes<\/td><td><b>Off<\/b><\/td><td>30 s from <b>subscription<\/b>, counts upstream and pause (R1, R2)<\/td><\/tr><tr><td>Node deadline<\/td><td>First input<\/td><td>Yes<\/td><td>None<\/td><td>—<\/td><\/tr><tr><td>Plugin heartbeat<\/td><td>heartbeat() call<\/td><td>Yes<\/td><td>Off<\/td><td>No API<\/td><\/tr><tr><td>Run deadline<\/td><td>RUNNING<\/td><td>Yes<\/td><td>Session timeout<\/td><td>Session timeout; counts pause<\/td><\/tr><\/table><\/div>"}, {"id": "architecture", "title": "Target backbone: execution event log", "html": "<div class=\"grid g2\"><div class=\"card\"><h3>Execution event log (target backbone)<\/h3><pre><code>execution_event(seq, execution_id, ts, type,\n                node_id, status, attempt, command_id, data)\n\nRUN_QUEUED · RUN_STARTED · NODE_STARTED\nNODE_OUTPUT(ref) · NODE_FINISHED(status) · NODE_RETRY\nCONTROL_REQUESTED · CONTROL_APPLIED · CONTROL_REJECTED\nLOG(ref) · RUN_FINISHED<\/code><\/pre><\/div><div class=\"card\"><h3>Why one log solves five findings<\/h3><ul>\n<li><b>R6 ordering:<\/b> one writer per execution; SSE ends after RUN_FINISHED.<\/li>\n<li><b>R9 control:<\/b> commands and results are events, applied in FIFO order and auditable.<\/li>\n<li><b>R10 recovery:<\/b> on boot, replay the log and mark orphaned runs ABORTED, or resume them.<\/li>\n<li><b>R4 restart:<\/b> NODE_OUTPUT gives every boundary edge's full history for replay.<\/li>\n<li><b>R14 versions:<\/b> RUN_STARTED records the definition hash.<\/li>\n<\/ul><p class=\"refs\">Storage: pluggable ExecutionLogStore; memory, then JSONL file, then SQLite or Postgres. Batched appends.<\/p><\/div><\/div>"}, {"id": "round1", "title": "Round-1 findings: status", "lede": "Checked in code at <code>a26f3dbd<\/code>.", "html": "<div class=\"card tablewrap\"><table><tr><th>ID<\/th><th>Finding<\/th><th>Status<\/th><\/tr><tr><td>C1<\/td><td>Control status strings crash the tracker<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C2<\/td><td>Stop reported as SUCCESS<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C3<\/td><td>Two owners of terminal status<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C4<\/td><td>Duplicate FAILURE<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C5<\/td><td>Runtime skip no-op<\/td><td><span class=\"pill P2\">rejected; skip unavailable<\/span><\/td><\/tr><tr><td>C6<\/td><td>Step mode no-op<\/td><td><span class=\"pill P2\">wired; credits lost (R5)<\/span><\/td><\/tr><tr><td>C7<\/td><td>Terminal timeout no-op<\/td><td><span class=\"pill P2\">applied; wrong clock (R1)<\/span><\/td><\/tr><tr><td>C8<\/td><td>Broadcast bypasses backpressure<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C9<\/td><td>Shared plugin init/shutdown<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C10<\/td><td>NPE on a bad edge<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C11<\/td><td>Unknown restart node<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C12<\/td><td>Duplicate plugin types<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C13<\/td><td>Unbounded tracker memory<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C14<\/td><td>Unsafe publication<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C15<\/td><td>Fire-and-forget execution<\/td><td><span class=\"pill P0\">open → R11<\/span><\/td><\/tr><tr><td>C16<\/td><td>Non-atomic config writes<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C17<\/td><td>Stopping twice throws<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>C18<\/td><td>Secret blacklist<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>P1<\/td><td>Fixed virtual pool<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>P2<\/td><td>Idle heartbeat timers<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>P3<\/td><td>Payload log echo<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>P4<\/td><td>Checkpoint ordering<\/td><td><span class=\"pill P2\">ordered; last message only (R4)<\/span><\/td><\/tr><tr><td>P5<\/td><td>Busy-loop sinks<\/td><td><span class=\"pill P0\">open → R17<\/span><\/td><\/tr><tr><td>P6<\/td><td>O(N·E) compile<\/td><td><span class=\"pill P0\">open → R17<\/span><\/td><\/tr><tr><td>S1–S10 (not S7)<\/td><td>Typing, dedupe, builders, dead code<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>S7<\/td><td>Logging volume<\/td><td><span class=\"pill P0\">open → R17<\/span><\/td><\/tr><tr><td>T1–T3, T5<\/td><td>Tests<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td>T4, T6<\/td><td>Step/skip E2E, concurrent same-type plugins<\/td><td><span class=\"pill P0\">open<\/span><\/td><\/tr><\/table><\/div>"}], "findings": [{"id": "R1", "sev": "P0", "area": "Time", "pkg": ["service/orchestrator/stream", "service/orchestrator/strategy"], "t": "Node timeouts include upstream wait time (verified)", "where": "NodeStreams source.timeout(30 s default) on output; terminal safeInput.timeout; every node subscribes at start", "impact": "Any step over 30 s fails the run; PROCESS_EXECUTOR (300 s) and LLM_CALL (120 s) are killed at 30 s. Probe: a 1 s timeout over a 2 s upstream → TimeoutException.", "fix": "Processing, idle and deadline timers that start on first input; idle off by default; plugins declare realistic defaults.", "eff": "M"}, {"id": "R2", "sev": "P1", "area": "Time", "pkg": ["service/control/valve", "service/orchestrator/compiler"], "t": "Pause counts against timeouts (verified)", "where": "Valve filterWhen holds elements while downstream and run timeouts keep counting", "impact": "Pausing longer than any downstream timeout fails the run. Probe: a paused parent → child timed out after 1 s.", "fix": "Pause-aware clocks: suspend or subtract paused time.", "eff": "M"}, {"id": "R3", "sev": "P1", "area": "State", "pkg": ["service/orchestrator/stream", "service/orchestrator/tracker", "model/execution"], "t": "Node outcomes are never finalised (verified)", "where": "NodeStreams has no doOnCancel; no sweep in finishWorkflow; no CANCELLED/SKIPPED/UPSTREAM_FAILED/TIMED_OUT", "impact": "Nodes stay RUNNING forever after a stop or sibling failure; unreached nodes stay PENDING.", "fix": "Node state machine, doOnCancel, and a final sweep from the run outcome.", "eff": "M"}, {"id": "R4", "sev": "P1", "area": "Restart", "pkg": ["service/control/processor", "service/orchestrator", "service/store"], "t": "Restart-from-node is broken in four ways (verified: keying)", "where": "collectMap(Message::getSourceNodeId); registry lookup of running runs only; last message only; topological-index cut", "impact": "The restart node receives no input; failed runs can't be restarted; split outputs are lost; independent branches re-run with empty input.", "fix": "Key by parentNodeId now; then a durable per-edge output log and descendant-subgraph restart.", "eff": "L"}, {"id": "R5", "sev": "P1", "area": "Control", "pkg": ["service/control/valve", "service/control"], "t": "Step loses credits; pause leaks in-flight work (verified: step)", "where": "allowPassage captures stepCounter per element; valves are post-plugin filterWhen with 256 prefetch", "impact": "step 2 → 0 elements passed; the plugin keeps processing after pause.", "fix": "Permit-counter valve on the input side (true backpressure).", "eff": "M"}, {"id": "R6", "sev": "P1", "area": "State", "pkg": ["service/orchestrator/tracker"], "t": "Task and workflow events aren't ordered relative to each other", "where": "Three sinks, each batched independently on parallel; status stream takeUntil(terminal)", "impact": "The stream closes before the final node events; the UI shows a finished run with running nodes.", "fix": "A single ordered per-execution event log.", "eff": "L"}, {"id": "R7", "sev": "P1", "area": "Control", "pkg": ["service/orchestrator"], "t": "'Safe stop' is a hard cancel", "where": "runTracked firstWithSignal(safeStop) cancels the whole run", "impact": "In-flight processes and HTTP calls are killed; there's no drain.", "fix": "DRAIN (default, with a deadline) → CANCEL → KILL.", "eff": "M"}, {"id": "R8", "sev": "P1", "area": "Failure", "pkg": ["service/orchestrator/stream", "service/orchestrator/strategy"], "t": "Failure handling is fail-fast only", "where": "Flux.merge fan-in; no engine retry, error port, trigger rules or DLQ", "impact": "One flaky call fails a large run; branch failures can't be handled.", "fix": "Per-node retry with backoff and jitter, onError FAIL/CONTINUE/ROUTE, join trigger rules, mergeDelayError.", "eff": "L"}, {"id": "R9", "sev": "P1", "area": "Control", "pkg": ["service/control", "service/control/directive", "service/control/gateway"], "t": "Control isn't acknowledged, ordered or idempotent", "where": "emit() succeeds on enqueue; batch sorted by priority; processor errors swallowed; check-then-act", "impact": "200 OK for commands that fail; pause and resume can be reordered.", "fix": "Per-execution FIFO queue, commandId, CommandResult ack, audit in the log.", "eff": "M"}, {"id": "R10", "sev": "P1", "area": "Durability", "pkg": ["service/orchestrator/tracker", "service/control/store", "service/store"], "t": "Nothing is durable", "where": "Tracker, registry, checkpoints and history are all in memory", "impact": "A JVM restart loses running and finished runs with no trace.", "fix": "Append-only execution log; recovery marks orphaned runs ABORTED; then resume.", "eff": "L"}, {"id": "R11", "sev": "P2", "area": "Governance", "pkg": ["service/control/gateway", "config"], "t": "No admission control, limits or graceful shutdown (C15)", "where": "execute().subscribe() with the Disposable dropped; scheduler queue Integer.MAX_VALUE; prepare stampede", "impact": "Overload, noisy neighbours, abrupt shutdown.", "fix": "ExecutionScheduler with global and per-workflow limits, a queue policy, SmartLifecycle drain, and cached prepare.", "eff": "M"}, {"id": "R12", "sev": "P2", "area": "Validation", "pkg": ["service/orchestrator/validator"], "t": "Validator gaps", "where": "Duplicate nodeIds/edges allowed; sourcePort not checked; no size limits; recursive DFS", "impact": "Misleading 'cycle' errors, double delivery, silently dead edges, stack overflow.", "fix": "Explicit checks; reuse Kahn's result for the cycle check.", "eff": "S"}, {"id": "R13", "sev": "P2", "area": "Concurrency", "pkg": ["service/orchestrator/compiler", "service/orchestrator/stream"], "t": "Disposables list isn't thread-safe", "where": "ArrayList appended from subscriber threads while dispose copies it", "impact": "Rare CME or leaked connections.", "fix": "Disposables.composite().", "eff": "S"}, {"id": "R14", "sev": "P2", "area": "Versioning", "pkg": ["service/workflow/store"], "t": "No definition versioning", "where": "Executions don't record the definition hash", "impact": "History and restart may use a different graph.", "fix": "Content hash per run; restart pins the version.", "eff": "S"}, {"id": "R15", "sev": "P2", "area": "Governance", "pkg": ["service/workflow", "service/control/gateway"], "t": "Starts aren't idempotent", "where": "No Idempotency-Key on start", "impact": "A client retry starts a duplicate run.", "fix": "Idempotency-Key with a dedupe window.", "eff": "S"}, {"id": "R16", "sev": "P3", "area": "Observability", "pkg": ["service/orchestrator"], "t": "No metrics or tracing", "where": "Logs only", "impact": "Can't diagnose slow or stuck nodes.", "fix": "Micrometer timers and gauges plus OpenTelemetry spans.", "eff": "M"}, {"id": "R17", "sev": "P3", "area": "Clean-up", "pkg": ["service/orchestrator/tracker", "service/control"], "t": "Remaining round-1 items", "where": "P5 busy-loop sinks, P6 O(N·E) compile, S7 log volume, 11 coverage exceptions, T4/T6 tests", "impact": "Minor CPU and noise.", "fix": "Fold into R6; otherwise small fixes.", "eff": "S"}], "road": [["1 · Correct time", ["R1", "R2"], "Long steps and pauses no longer fail runs"], ["2 · Truthful state", ["R3", "R6"], "Terminal node states; ordered streams"], ["3 · Precise control", ["R5", "R9", "R7"], "Backpressure pause, exact step, acknowledged FIFO, drain"], ["4 · Failure semantics", ["R8"], "Retries, error ports, trigger rules, DLQ"], ["5 · Durability and restart", ["R10", "R4", "R14"], "Event log, recovery, correct restart, versions"], ["6 · Governance", ["R11", "R15"], "Admission, limits, priority, idempotent start"], ["7 · Observability and polish", ["R16", "R12", "R13", "R17"], "Metrics, traces, complete validation"]]};

 '<div class="progress"><span id="progTxt"></span><div class="bar"><i id="progBar" style="width:0"></i></div><button type="button" id="resetBtn">Reset ticks</button></div>'+
 '<div class="filters" id="sevFilters"><span class="lbl">Severity</span></div><div class="filters" id="areaFilters"><span class="lbl">Area</span></div>'+
 '<div class="filters"><input type="search" id="q" placeholder="Search class, keyword…" aria-label="Search findings"><button type="button" id="hideDone" aria-pressed="false">Hide done</button><button type="button" id="expandAll">Expand all</button></div><div id="findingList"></div></section>'+
 '<section id="roadmap"><h2>Roadmap</h2><div class="card tablewrap"><table id="roadTable"><thead><tr><th>Phase</th><th>Items</th><th>Outcome</th><th>Done</th></tr></thead><tbody></tbody></table></div></section>';
document.getElementById("main").innerHTML=h;

/* flow */
if(D.steps&&D.steps.length){
  var NS="http://www.w3.org/2000/svg",g=document.getElementById("pipeBoxes"),S=D.steps,n=S.length,W=112,gap=Math.max(12,Math.floor((980-n*W)/Math.max(1,n-1)));
  var total=n*W+(n-1)*gap;document.getElementById("pipe").setAttribute("viewBox","0 30 "+Math.max(total,300)+" 130");
  S.forEach(function(s,i){var x=i*(W+gap),y=i%2?100:40,grp=document.createElementNS(NS,"g");
    grp.setAttribute("class","box");grp.setAttribute("data-i",i);grp.setAttribute("tabindex","0");grp.setAttribute("role","button");grp.setAttribute("aria-label",s.k);
    grp.innerHTML='<rect x="'+x+'" y="'+y+'" width="'+W+'" height="50" rx="8"/><text x="'+(x+W/2)+'" y="'+(y+22)+'" text-anchor="middle">'+esc(s.k)+'</text><text class="s" x="'+(x+W/2)+'" y="'+(y+39)+'" text-anchor="middle">step '+(i+1)+'</text>';
    g.appendChild(grp);
    if(i<n-1){var nx=(i+1)*(W+gap),ny=(i+1)%2?100:40,p=document.createElementNS(NS,"path");p.setAttribute("class","arrow");
      p.setAttribute("d","M"+(x+W)+","+(y+25)+" C"+(x+W+gap/2)+","+(y+25)+" "+(nx-gap/2)+","+(ny+25)+" "+nx+","+(ny+25));g.insertBefore(p,g.firstChild)}
    grp.addEventListener("click",function(){showStep(i)});
    grp.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();showStep(i)}})});
  var sb=document.getElementById("stepBtns");
  S.forEach(function(s,i){var b=document.createElement("button");b.type="button";b.textContent=(i+1)+". "+s.k;b.setAttribute("role","tab");b.onclick=function(){showStep(i)};sb.appendChild(b)});
  var showStep=function(i){var s=S[i];
    [].forEach.call(g.querySelectorAll(".box"),function(el){el.classList.toggle("on",+el.getAttribute("data-i")===i)});
    [].forEach.call(sb.children,function(b,j){b.setAttribute("aria-pressed",j===i?"true":"false");b.setAttribute("aria-selected",j===i?"true":"false")});
    var r=(s.f||[]).map(byId).filter(Boolean),p0=r.some(function(f){return f.sev==="P0"});
    document.getElementById("stepBody").innerHTML='<h3>'+(i+1)+'. '+esc(s.k)+'</h3><div class="refs mono">'+esc(s.cls||"")+'</div><p>'+s.d+'</p>'+
      (r.length?'<div class="flag'+(p0?" p0":"")+'"><b>Findings here:</b> '+r.map(function(f){return pillFor(f.id)+" "+esc(f.t)}).join(" · ")+'</div>':"")};
  showStep(0);
}
/* packages */
if(D.pkgs&&D.pkgs.length){
  var P=D.pkgs,maxL=Math.max.apply(null,P.map(function(p){return p[2]})),pl=document.getElementById("pkgList");
  P.forEach(function(p,i){var b=document.createElement("button");b.type="button";var c=F.filter(function(f){return (f.pkg||[]).indexOf(p[0])>=0}).length;
    b.innerHTML='<span style="min-width:0;flex:1"><span>'+esc(p[0])+'</span><span class="bar"><i style="width:'+(p[2]/maxL*100)+'%"></i></span></span><span style="margin-left:8px;color:var(--muted)">'+(c?c+"⚑":"")+'</span>';
    b.onclick=function(){showPkg(i)};pl.appendChild(b)});
  var showPkg=function(i){var p=P[i];[].forEach.call(pl.children,function(b,j){b.setAttribute("aria-pressed",j===i?"true":"false")});
    var fs=F.filter(function(f){return (f.pkg||[]).indexOf(p[0])>=0});
    document.getElementById("pkgDetail").innerHTML='<h3 class="mono" style="margin-top:0">'+esc(p[4]||p[0])+'</h3><p class="refs">'+p[1]+' files · '+p[2]+' lines</p><p>'+p[3]+'</p>'+
      (fs.length?'<h3>Findings ('+fs.length+')</h3><ul style="padding-left:18px;margin:0">'+fs.map(function(f){return '<li>'+pillFor(f.id)+' '+esc(f.t)+'</li>'}).join("")+'</ul>':'<p class="refs">No findings.</p>')};
  showPkg(0);
}
/* findings */
var SEVS=["P0","P1","P2","P3"].filter(function(s){return F.some(function(f){return f.sev===s})}),AREAS=[];
F.forEach(function(f){if(AREAS.indexOf(f.area)<0)AREAS.push(f.area)});
var sevOn={},areaOn={},hideDone=false;SEVS.forEach(function(s){sevOn[s]=true});AREAS.forEach(function(a){areaOn[a]=true});
function chip(c,label,cb){var b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed","true");
  b.onclick=function(){var v=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",v?"true":"false");cb(v);render()};c.appendChild(b)}
SEVS.forEach(function(s){chip(document.getElementById("sevFilters"),s,function(v){sevOn[s]=v})});
AREAS.forEach(function(a){chip(document.getElementById("areaFilters"),a,function(v){areaOn[a]=v})});
var q=document.getElementById("q");q.oninput=render;
var hd=document.getElementById("hideDone");hd.onclick=function(){hideDone=!hideDone;hd.setAttribute("aria-pressed",hideDone?"true":"false");render()};
document.getElementById("expandAll").onclick=function(){var ds=document.querySelectorAll("#findingList details"),o=!(ds[0]&&ds[0].open);[].forEach.call(ds,function(d){d.open=o})};
document.getElementById("resetBtn").onclick=function(){done={};store.set(KEY,done);render()};
function render(){var t=q.value.trim().toLowerCase();
  var list=F.filter(function(f){if(!sevOn[f.sev]||!areaOn[f.area])return false;if(hideDone&&done[f.id])return false;
    if(t&&(f.id+" "+f.t+" "+f.where+" "+f.impact+" "+f.fix+" "+(f.pkg||[]).join(" ")).toLowerCase().indexOf(t)<0)return false;return true});
  var el=document.getElementById("findingList");
  el.innerHTML=list.length?list.map(function(f){return '<details class="finding'+(done[f.id]?" done":"")+'" id="f-'+f.id+'"><summary><span class="id">'+f.id+'</span>'+
    '<input type="checkbox" aria-label="Mark '+f.id+' done" data-id="'+f.id+'"'+(done[f.id]?" checked":"")+'><span class="t">'+esc(f.t)+'</span>'+
    '<span class="meta"><span class="pill '+f.sev+'">'+f.sev+'</span><span class="pill P3">'+esc(f.area)+'</span><span class="pill P3">effort '+f.eff+'</span></span></summary>'+
    '<div class="body"><dl><dt>Where</dt><dd class="mono">'+esc(f.where)+'</dd><dt>Impact</dt><dd>'+esc(f.impact)+'</dd><dt>Fix</dt><dd>'+esc(f.fix)+'</dd>'+
    ((f.pkg||[]).length?'<dt>Area</dt><dd class="mono">'+esc(f.pkg.join(", "))+'</dd>':"")+'</dl></div></details>'}).join("")
    :'<div class="empty">No findings match these filters.</div>';
  [].forEach.call(el.querySelectorAll("input[type=checkbox]"),function(cb){cb.onclick=function(e){e.stopPropagation()};
    cb.onchange=function(){if(cb.checked)done[cb.dataset.id]=true;else delete done[cb.dataset.id];store.set(KEY,done);render()}});
  var k=Object.keys(done).filter(byId).length;
  document.getElementById("progTxt").textContent=k+" / "+F.length+" done";
  document.getElementById("progBar").style.width=(k/F.length*100)+"%";
  document.getElementById("statFindings").textContent=F.length-k;
  document.querySelector("#roadTable tbody").innerHTML=D.road.map(function(r){var d=r[1].filter(function(id){return done[id]}).length;
    return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+r[1].map(pillFor).join(" ")+'</td><td>'+esc(r[2])+'</td><td class="mono">'+d+'/'+r[1].length+'</td></tr>'}).join("")}
render();
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("[data-jump]");if(!a)return;e.preventDefault();
  var id=a.getAttribute("data-jump");SEVS.forEach(function(s){sevOn[s]=true});AREAS.forEach(function(x){areaOn[x]=true});hideDone=false;q.value="";
  [].forEach.call(document.querySelectorAll("#sevFilters button,#areaFilters button"),function(b){b.setAttribute("aria-pressed","true")});
  hd.setAttribute("aria-pressed","false");render();var d=document.getElementById("f-"+id);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"})}});
var links=document.querySelectorAll("nav.side a");
[].forEach.call(links,function(l){l.addEventListener("click",function(e){var t=document.querySelector(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)
  [].forEach.call(links,function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});
  [].forEach.call(document.querySelectorAll("main section"),function(s){io.observe(s)})}
})();
</script>
</body>
</html>
