<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta Core Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}
</style>

<script>
var DATA = {
plain:{
entry:["The front desk. Every request to start a workflow arrives here. It checks the request is not a duplicate, makes sure there is room, and only then lets the run begin.","Without it a burst of requests would start everything at once and swamp the server, and a client that retries after a network glitch would run the job twice."],
def:["The library and the inspector. It stores each workflow's definition with its history and, before a run, checks the graph makes sense and turns it into something runnable.","Catching a broken workflow (a loop, a connection to nowhere) before it starts is far cheaper than finding out halfway through."],
engine:["The factory floor. It connects the nodes with streams of messages and wraps every node with the rules for retries, timeouts, pausing and what to do when something fails.","Plugin authors should write only business logic. The hard behaviour (back-pressure, failure handling, clocks) lives here once instead of in every plugin."],
plugin:["The sockets where the real work plugs in: calling an API, asking an LLM, running a script, waiting for a human. The engine treats them all the same way.","New capabilities can be added without touching the engine, and engine policy stays out of plugin code."],
super:["Automated watchers. Small programs (a rule file, an AI agent, your own code) watch everything that happens and can press the same buttons an operator can.","Operations can be automated, for example pause everything when errors spike, without hard-coding it into the engine."],
control:["The control room's switchboard. Every instruction to a live run (pause, step, skip, stop) goes through here in order, is confirmed to the caller and is written to an audit trail.","Steering a running stream is full of races. One ordered, acknowledged channel makes it predictable and auditable."],
obs:["The dashboard feed. It watches what every node is doing and turns it into live progress, history and metrics.","You cannot operate what you cannot see, and the UI, SSE and MCP clients all need the same consistent, ordered view."],
dur:["The black-box recorder. It records each run and each node's output so that after a crash you can see what happened and continue from where it stopped.","Long or expensive runs (LLM calls, paid APIs) should not have to start over after a restart."],
persist:["Where things are physically kept: in memory, in files, or in PostgreSQL. One setting chooses.","Different deployments need different durability, and this keeps the engine independent of the choice."],
expr:["The mail room and the safe. Placeholders in a step's settings are filled in with real values just before the step runs, and passwords come from the environment, never from the workflow file.","A workflow can be written once and reused with different data, and secrets stay out of stored definitions."],
sub:["A workflow step that is itself another workflow, like calling a function.","Reuse and composition, and the building block for agents that plan their own steps."]
},
intro:{
happy:"One start request travels from the front door to a finished run. Use it first to learn the vocabulary.",
overload:"What happens when more work arrives than the server should run at once.",
failure:"How a failing step is retried, quarantined or allowed to fail the run, and one place where that design is weak.",
operator:"How a person steers a run that is already going, using the same channel automation uses.",
supervisor:"How an automated watcher (rules or AI) observes runs and intervenes, and how it is kept from hurting them.",
crash:"What is lost and what is kept when the server dies mid-run, and how a run is continued afterwards.",
sub:"How one workflow calls another and why that needs care with limits."
},
adrAlt:[
"Queues or a message broker between nodes: decouples speeds but needs sizing and persistence, and loses end-to-end back-pressure.",
"Put state in a database or cluster framework from day one: more resilient, but adds latency and operational weight early on.",
"Aim for exactly-once with a transactional outbox per node: only works where the target system supports it.",
"fsync every log event: slower, and still does not tell you a node's output is complete.",
"Accept any order and reconcile later: UI glitches such as a finished run with running nodes.",
"Hard-coded alert rules in the engine, or separate APIs for people and automation: two paths to keep safe.",
"JDBC with a thread pool, or a document database: simpler to start, blocks threads or loses relational history.",
"Run whole workflows on workers (loses per-node isolation, control must be proxied) or active/standby only (does not scale out)."
],
primer:{
 problem:"Teams automate multi-step jobs: receive an event, ask an LLM, call an API, wait for a person, notify someone. Written as ad-hoc scripts, these have no retries, no visibility, no way to pause or stop them, and no way to continue after a crash. Yukta lets you describe the steps once, as a graph, and runs them reliably. <b>Core</b> is the engine inside the Yukta server that executes those graphs and lets you steer them while they run.",
 analogy:"Think of a factory line with a control room. Stations (<b>nodes</b>) are joined by conveyor belts (<b>streams</b>) that stop when the next station is busy. A foreman (the <b>control plane</b>) can pause the line, step it one item at a time, or stop it. Cameras and monitors (<b>observation</b>) show what is happening, automated watchers (<b>supervisors</b>) can press the foreman's buttons, and a logbook (the <b>execution log</b> and <b>checkpoints</b>) lets you work out after a power cut where the line had got to.",
 layers:[["Clients","REST, web UI, MCP agents, CLI",""],["web / mcp / ui","Translate requests into calls on core",""],["core","The engine and control plane. This page.","me"],["plugin-api + plugins","The contract and the actual node types",""],["boot","Wires it into one Spring Boot app",""]],
 concepts:[
  ["Workflow","A graph written as JSON: nodes and the edges between them. It is stored once and can be run many times.","Example: triage a support ticket."],
  ["Node","One step. Three kinds: a <b>trigger</b> starts the flow (no input), a <b>processor</b> transforms messages, a <b>terminal</b> ends a branch (saves, sends, notifies).","Example: an LLM call is a processor."],
  ["Edge and port","A connection from one node's output to another's input. A node can also have an <b>error port</b> that carries failed messages.","Edge from classify with sourcePort error goes to a dead-letter terminal."],
  ["Message","The unit of data flowing along edges: a payload, headers and a stable id. A trigger may emit many messages in one run.","One ticket = one message."],
  ["Run (execution)","One live execution of a workflow, with its own execution id, status (QUEUED, RUNNING, SUCCESS...) and per-node status.","Started by a REST call; ends when every terminal completes or the run fails or is stopped."],
  ["Session","A tenant-like scope that groups workflows, runs and configuration. Limits and fairness apply per session.","One team or one user's workspace."],
  ["Plugin","Code that gives a node its behaviour. The engine never needs to know what a plugin does, only the contract.","LLM_CALL, HTTP_REQUEST, PROCESS_EXECUTOR."],
  ["Engine policy","An optional block inside any node's config that the engine reads and plugins never see: retry, onError, timeouts, failure budget.","See the example workflow below."]
 ],
 exMeta:"Simplified: the field names of the node and edge JSON are illustrative; the engine block is real.",
 exJson:"{ \"nodes\": [\n    { \"id\": \"ticket\",   \"kind\": \"trigger\",   \"type\": \"(a webhook trigger)\" },\n    { \"id\": \"classify\", \"kind\": \"processor\", \"type\": \"LLM_CALL\",\n      \"config\": { \"engine\": {\n         \"retry\":   { \"maxAttempts\": 3, \"backoffMs\": 200 },\n         \"onError\": \"ROUTE\" } } },\n    { \"id\": \"approve\",  \"kind\": \"processor\", \"type\": \"WAIT_FOR_SIGNAL\" },\n    { \"id\": \"update\",   \"kind\": \"processor\", \"type\": \"HTTP_REQUEST\" },\n    { \"id\": \"done\",     \"kind\": \"terminal\" },\n    { \"id\": \"deadletter\", \"kind\": \"terminal\" } ],\n  \"edges\": [\n    { \"from\": \"ticket\",   \"to\": \"classify\" },\n    { \"from\": \"classify\", \"to\": \"approve\" },\n    { \"from\": \"approve\",  \"to\": \"update\" },\n    { \"from\": \"update\",   \"to\": \"done\" },\n    { \"from\": \"classify\", \"sourcePort\": \"error\", \"to\": \"deadletter\" } ] }",
 ex:[
  {id:"ticket",n:"Ticket arrives",s:"trigger",k:"t",x:10,y:40,does:"Waits for something to happen (here a new support ticket) and emits one message carrying the ticket data.",adds:"Starts the node's clocks and records its status. A trigger has no input, so it keeps the default 30 s idle timeout unless the plugin declares another.",wrong:"A source that is quiet for a long time looks dead. Long silent work should call the heartbeat or use a longer timeout."},
  {id:"classify",n:"Classify",s:"LLM_CALL",k:"p",x:190,y:40,does:"Sends the ticket text to a language model and returns a category.",adds:"Retries a failed call up to 3 times with growing delay (not for bad input), enforces a per-attempt timeout and the run's token budget, and sends a message that still fails to the error port tagged with attempts, exception and time. A message yields all of its output or none.",wrong:"One call may overshoot the budget; there is no rate limit shared across nodes (F4); retries mean the plugin can see the same message twice."},
  {id:"approve",n:"Approve",s:"WAIT_FOR_SIGNAL",k:"p",x:370,y:40,does:"Holds each message until a person or a supervisor sends an approve or reject signal (default wait one hour).",adds:"Delivers the signal through the same ordered, audited command path as pause or stop, extends the node timeout by the wait plus 30 s, and freezes the clocks while the run is paused.",wrong:"The wait lives in memory: after a restart a resumed run waits again, and a signal sent before the node waits is refused (F2)."},
  {id:"update",n:"Update ticket",s:"HTTP_REQUEST",k:"p",x:550,y:40,does:"Calls the ticketing system to set the category.",adds:"Timeout is the request timeout plus 5 s, checkpoints the output, and the message id stays the same on every attempt.",wrong:"A crash between the request and the node's end marker can repeat the call. The plugin or the target must de-duplicate on the message id."},

gloss:[
["DAG","Directed acyclic graph: nodes joined by one-way edges with no loops. The shape of every workflow.","Loops are rejected at definition time."],
["Trigger / Processor / Terminal","The three node kinds: start, transform, end.","Only processors can have retry and onError policy."],
["Error port and dead letter","A separate output of a node that carries messages that failed, so they can be saved instead of lost.","Needs onError ROUTE and an edge with sourcePort error."],
["Message and message id","The unit of data on an edge. The id is stable across retries.","Use it as the idempotency key in plugins."],
["Run / execution / execution id","One live execution of a workflow and its identifier.","Everything (control, audit, logs) is keyed by it."],
["Session","A scope grouping workflows, runs and limits.","Fair queueing is per session."],
["Reactive stream (Reactor, Flux)","A pipeline of data that moves as the consumer asks for it. Yukta is built on Project Reactor.","The reason slow consumers slow producers instead of filling memory."],
["Back-pressure","A slow consumer making upstream producers wait.","Keeps memory bounded; also means one slow branch can slow a fan-out."],
["Fan-out","One node feeding several children.","Paced by the slowest child."],
["Join rule","What a node with several parents does when a parent fails: ALL_SUCCESS, ALL_DONE or ONE_SUCCESS.","Avoids a join that never fires."],
["Valve","A gate in front of a node that implements pause, step, skip and breakpoints.","Why pausing is exact and cheap."],
["Idle timeout and heartbeat","A node fails if silent too long; a plugin doing long silent work calls a heartbeat to say it is alive.","The most common cause of surprising TIMED_OUT."],
["Deadline","The longest a node (or the run) may take in total, whatever its activity.","Not restarted by output or heartbeat."],
["Retry, backoff, jitter","Re-run a failed message after a growing, slightly random delay.","Jitter stops many retries hitting a service together."],
["Failure budget","If too many messages fail in a time window, fail the node instead of quietly dropping more.","Guards against silent data loss with CONTINUE or ROUTE."],
["Admission / scheduler","The gate that decides whether a start may run now, wait or be refused (HTTP 429).","Limits are off by default."],
["Idempotency key","A caller-supplied key that makes a repeated start return the first run instead of starting another.","Safe client retries."],
["Idempotent plugin","A plugin whose repeated execution for the same message has the same effect as one.","How at-least-once delivery stays correct."],
["At-least-once","A step may run more than once but never zero times (after it was started). Exactly-once is not achievable here.","Plugins must tolerate duplicates."],
["Control plane","The part that manages runs (admit, order commands, steer) as opposed to the data plane that moves messages.","Today lives in one JVM."],
["Command and FIFO","An instruction to a live run, applied in first-in-first-out order per run and acknowledged.","No command races."],
["Reviewer","A hook that can refuse any command before it runs; the caller gets HTTP 403.","A policy point for humans and automation alike."],
["Supervisor","A program that watches the event feed and returns commands, in or out of the JVM.","Rate limited, isolated, can be dry-run."],
["Execution log","An append-only record of run starts, ends, control commands and idempotency keys.","Memory by default; file or PostgreSQL if configured."],
["Checkpoint","A node's recorded output, kept so it can be replayed instead of recomputed.","Memory is capped; file keeps everything."],
["Durable end marker","A small file written and forced to disk with a node's output when the node completes.","What a resume trusts to skip a node."],
["ABORTED","The status given on boot to a run that never finished because the process died.","Candidates for resume."],
["Restart vs resume","Restart starts a new run (optionally from one node) using recorded outputs; resume continues an aborted run after a crash.","Resume needs file stores and an unchanged definition."],
["Definition version (content hash)","A fingerprint of the graph a run used, stored with the run.","Lets you tell which version ran."],
["Claim check","Passing a reference to big data instead of the data itself.","Planned for large payloads."],
["Virtual threads","Cheap threads used so blocking plugins do not tie up the event loop.","Why blocking plugins are allowed."],
["Observation / span","A timed record of work (one for the run, one per node) that becomes a trace when a tracer is present.","Needs a Micrometer tracer on the classpath."],
["SSE","Server-sent events: a one-way live stream to browsers and agents.","How progress and the event feed are delivered."],
["MCP","Model Context Protocol: how AI agents call tools; Yukta exposes control through it.","Another client of the same gateway."],
["R2DBC and Flyway","Non-blocking database access at run time, and versioned schema migrations.","How PostgreSQL support is built."],
["Remote worker","A separate process that runs a node on the control plane's behalf (designed, not built).","The planned scale-out path."],
["API key and role","A shared secret that guards the REST API (and, separately, MCP). Named keys carry a role: VIEWER reads, OPERATOR steers runs, ADMIN does everything.","The audit shows the key name as the actor."],
["Host and Origin check","A server-side test of which website name and page a request came from, so a page in the operator's browser cannot drive a local server (CSRF, DNS rebinding).","Done by HostOriginFilter while no API key is set: unknown Host or foreign Origin on a non-GET gets 403 (yukta.allowed-hosts, yukta.allowed-origins)."],
["Expression (${...})","A placeholder in a node's configuration that is filled from the message, the run or the environment just before the node runs.","See Expressions & Secrets."],
["B16, S4, F6 ...","IDs in core/docs/plans/09-backlog.md and 11-remediation-plan.md: B = bug, S = security, F = feature, R = restart.","Used in the Risks section."]
],
glance:{
 lede:"Core is Yukta's engine and control plane: it takes a workflow definition (a DAG of trigger, processor and terminal nodes), runs it as a live stream of messages, lets people and programs steer it while it runs, and remembers enough to explain or resume it afterwards. This page is for thinking about it, not documenting it: open a component, play a scenario, then challenge the weak spots.",
 props:[
  ["Streaming DAG","Each edge is a Reactor stream. A slow consumer slows its producers (back-pressure), so memory stays bounded without queues between nodes."],
  ["One JVM brain","Admission, command ordering, run state and signal waits live in one process. Plugins may block on virtual threads, but nothing is shared across servers yet."],
  ["At-least-once","A node's end is durable, a side effect before it can repeat after a crash. Exactly-once is impossible; plugins de-duplicate on the message id."],
  ["Pluggable durability","Memory by default; files or PostgreSQL by configuration. What survives a restart depends on the profile (see Guarantees)."]
 ],

comps:[
 {
  "id": "entry",
  "name": "Entry & Admission",
  "tag": "front door, slots, queue",
  "c": 0,
  "r": 0,
  "mem": true,
  "resp": "Receives start, restart and recover requests and decides whether, when and in what order a run may begin.",
  "how": [
   "A start request first loads the stored definition and prepares it (checks and compiles the graph). If several requests for the same workflow arrive together, they share one preparation instead of each doing the work.",
   "Then it asks the scheduler for a slot, which is permission to run. The caller receives an execution id only after a slot is granted. Example: the limit is 5 and 5 runs are active. A run finishes, freeing one slot, and two new requests arrive at that same moment. Exactly one gets the slot and an id; the other waits in the queue or gets HTTP 429. If ids were handed out before the slot check, both requests could get one and the limit would be exceeded.",
   "The scheduler can cap total concurrent runs, runs per workflow and runs per session (a team or user workspace). All caps are off by default. A start that does not fit either waits in a queue (status QUEUED) or is refused at once with HTTP 429 ('too many requests'), depending on the on-limit setting.",
   "The queue is ordered by an optional priority number in the start payload (higher first). Within the same priority, the next free slot goes to the session with the fewest runs right now, so one busy session cannot keep everyone else waiting.",
   "A client can send an Idempotency-Key header. If its network drops and it sends the same start again with the same key (same session and workflow, within 10 minutes), it gets the first run's id back instead of starting a second run. With the file log the keys survive a restart.",
   "On shutdown it stops accepting starts, refuses everything still queued and gives running runs 30 seconds to finish."
  ],
  "guar": "No run gets an id without a slot, a repeated start with the same key never starts a second run, and every refusal is counted by reason.",
  "state": "The slots and the queue are held in memory. Idempotency keys are saved in the execution log when one is configured. Limits changed at run time are logged but not restored after a restart.",
  "ceil": "One scheduler in one server process. The queue holds 100 starts by default and there are no limits at all until you set some.",
  "fail": "If the server crashes, queued starts lose their place in line. With a file or PostgreSQL log their start was already recorded, so they are marked ABORTED on the next boot together with the running ones, and can be recovered.",
  "set": [
   "yukta.execution.max-concurrent / -per-workflow / -per-session",
   "yukta.execution.on-limit (QUEUE|REJECT)",
   "yukta.execution.queue-capacity (100), queue-timeout",
   "yukta.start.idempotency-ttl (10m)"
  ],
  "risks": [
   "spof",
   "restartRace",
   "limits28",
   "blockStart",
   "idemCap"
  ]
 },
 {
  "id": "def",
  "name": "Definition & Preparation",
  "tag": "store, validate, compile",
  "c": 1,
  "r": 0,
  "mem": false,
  "resp": "Keeps workflow definitions and versions, and turns one into a validated, runnable graph.",
  "how": [
   "Definitions are stored per workflow together with the newest 20 versions, so you can roll back. Storage is memory, files or PostgreSQL.",
   "Before a run, a validator checks the graph and refuses it with a message naming the node and the option at fault. It rejects loops, duplicate nodes or edges, connections to an output port the plugin does not have, graphs over 500 nodes or 2000 edges, and badly formed failure policies (for example a retry delay longer than the node's timeout).",
   "The compiler then turns the graph into a runnable form, one assembler per node. The result is cached by the content of the definition. It is kept only if the stored definition has not changed in the meantime, so an old compile can never overwrite a newer edit.",
   "Each run records a fingerprint (hash) of the graph it used. Progress, history and the log all carry it, so you can always tell which version a run executed.",
   "Session, workflow, node and path identifiers are checked by Bean Validation annotations at the orchestrator boundary, which checks the shape of an identifier (for example a session id may not contain path separators) before it is used."
  ],
  "guar": "A broken graph is refused before any plugin runs, and a run always keeps the version it started with.",
  "state": "Definitions are durable with the file or PostgreSQL store. The compiled cache lives in memory and is simply rebuilt.",
  "ceil": "Preparation cost grows with graph size, so graphs are capped at 500 nodes and 2000 edges.",
  "fail": "Editing a workflow does not change runs already in progress, and a resume is refused if the definition changed since the run started.",
  "set": [
   "yukta.session.store-type = in-memory | file | postgres"
  ],
  "risks": [
   "prepAlign",
   "versions21"
  ]
 },
 {
  "id": "engine",
  "name": "Stream Engine",
  "tag": "node runtime and policies",
  "c": 2,
  "r": 0,
  "mem": true,
  "resp": "Runs every node as a pipeline: merge parents, gate input, call the plugin, apply failure and time policy, fan out to children.",
  "how": [
   "Joining: a node with several parents needs a rule for when one parent fails. ALL_SUCCESS (default) fails the node too, ALL_DONE carries on with the parents that worked, and ONE_SUCCESS carries on unless every parent failed.",
   "Valve: each node has a gate in front of it. It implements pause (stop taking new messages; the one being processed finishes), step (let exactly n messages through, then pause), breakpoint (hold when a message matches a condition) and skip (pass messages through without calling the plugin).",
   "Failure policy: a node's optional 'engine' config can retry a failed message with growing delays, give up on a message that takes too long, send a failed message to an error output, or fail the whole node if too many messages fail. With retry or error routing on, a message's output is held back until it is complete, so a failed attempt never leaves half a result downstream.",
   "Clocks: a node fails if it is silent for too long (idle timeout). Any input, output, retry attempt or heartbeat resets that clock, and pausing freezes it so a pause never causes a timeout. Plugins can declare their own default.",
   "Wiring: every child subscribes before the source starts, so no early message is lost, and the slowest child decides how fast data flows. This is back-pressure: a slow consumer makes upstream wait instead of buffering without limit."
  ],
  "guar": "Data flows with back-pressure end to end. A node's status only moves forward (PENDING, QUEUED, RUNNING, then an end state), so a late or out-of-order event can never reopen a finished node.",
  "state": "Each run's state, gates, failure counters and clocks are held in memory.",
  "ceil": "A fan-out (one node feeding several) moves at the speed of its slowest branch. If one branch stops reading because its terminal failed, its siblings stall until the idle timeout. With retry or error routing, one message's output is buffered until its attempt ends.",
  "fail": "When a node fails, the nodes behind it are marked UPSTREAM_FAILED rather than FAILURE, so only the node that actually failed shows FAILURE.",
  "set": [
   "engine.retry / onError / trigger / elementTimeoutMs / deadlineMs / failureBudget (per node)",
   "timeoutSeconds (per node)"
  ],
  "risks": [
   "spof",
   "failfast",
   "backpressure25",
   "payload23",
   "remote"
  ]
 },
 {
  "id": "plugin",
  "name": "Plugin Boundary",
  "tag": "the extension seam",
  "c": 3,
  "r": 0,
  "mem": true,
  "resp": "The contract between the engine and the work a node does: triggers produce messages, processors transform them, terminals consume them.",
  "how": [
   "A plugin receives a stream of messages and a context holding the execution id, the node id, a heartbeat function and, for sub-workflows, a result collector. It never sees the engine's own policy options.",
   "A plugin that does long, silent work (say a ten-minute script) calls the heartbeat now and then to tell the engine it is alive; otherwise the idle timeout would fail it. Blocking plugins run on virtual threads, which are cheap threads that do not tie up the main event loop.",
   "A named signal, for example 'approved', can be sent to a running plugin through the same ordered, audited path as other commands. WAIT_FOR_SIGNAL uses this to hold a message until a person decides.",
   "Safety rails: workflows may read only allow-listed environment variables, scripts may use only a small set of Java classes, and process execution can be limited to named commands. The expression and script engines are not part of core: expressions run in plugin-api and scripts in the script plugin (see Expressions & Secrets)."
  ],
  "guar": "With retry or error routing on, the plugin is called once per message and receives a stable message id plus an attempt counter (1, 2, 3...). Retries repeat the same id, so a plugin can use it to avoid doing the same side effect twice.",
  "state": "State inside a plugin is the plugin's own business. Signal waits and KV_STORE are held in memory.",
  "ceil": "Plugins run inside the same server process today, so a heavy or untrusted plugin competes with the engine for CPU and memory.",
  "fail": "Throwing IllegalArgumentException means 'bad input' and is never retried.",
  "set": [
   "yukta.process.allowed-commands",
   "yukta.process.allow-any (off)",
   "yukta.script.timeout-ms (10000)",
   "yukta.mcp-client.allowed-tools, max-argument-bytes, deny-argument-patterns",
   "yukta.llm.deny-input-patterns, deny-output-patterns, max-input-chars",
   "YUKTA_LIMITS_MAX_BODY (1MB, 413 above)",
   "yukta.api-key, yukta.api-keys[].{name,key,role,sessions}; key may be sha256:<hex>",
   "yukta.allowed-hosts, yukta.allowed-origins",
   "yukta.variables.allowed"
  ],
  "risks": [
   "signals14",
   "memStore",
   "llmBudget",
   "remote"
  ]
 },
 {
  "id": "super",
  "name": "Supervisors",
  "tag": "rules, AI, custom code",
  "c": 0,
  "r": 1,
  "mem": false,
  "resp": "Programs that watch every run and steer it: a rule engine, an AI agent or your own code, inside or outside the server.",
  "how": [
   "A supervisor receives every execution event (run started, node failed, ...) through a small buffer of 256. If it is too slow, events are dropped and counted, so a slow supervisor never slows the engine.",
   "It answers with commands such as pause. Commands are limited to 20 per second, can be run in dry-run mode (recorded but not applied) and are tagged with the supervisor's id so the audit shows who did it. A supervisor does not see the results of its own commands.",
   "Reviewers are separate hooks that can veto any command, from a person or a supervisor, before it runs. The first reviewer to refuse wins, and the caller gets HTTP 403.",
   "Not everything has to run inside the server: an external agent can read the same events as a live SSE stream and send commands through REST or MCP."
  ],
  "guar": "A misbehaving supervisor is contained: if it crashes it is restarted after a delay, and it can never block a run.",
  "state": "Supervisors hold no engine state; their command counts are exposed as metrics.",
  "ceil": "Event delivery is best effort, so a supervisor can miss events when it is overloaded.",
  "fail": "A supervisor sees the status change caused by its own command (a pause produces a PAUSED event) and may react to it again, so it can loop. Only the 20 per second cap limits it.",
  "set": [
   "yukta.supervisor.max-commands-per-second (20)",
   "yukta.supervisor.dry-run",
   "yukta.supervisor.rules.file"
  ],
  "risks": [
   "supLoop"
  ]
 },
 {
  "id": "control",
  "name": "Control Plane",
  "tag": "commands, order, audit",
  "c": 1,
  "r": 1,
  "mem": true,
  "resp": "The ordered, acknowledged way to change a run that is already going.",
  "how": [
   "Commands include pause, resume, step, breakpoint, skip, retry node, stop, restart, restart from node, signal, change priority and change limits. All commands for one run enter one queue and are applied one after another in the order sent (first in, first out).",
   "The caller gets an answer only once the command has actually been applied, and every run command is written to the log as applied or rejected, with who sent it.",
   "Stop has three strengths: DRAIN lets work already in progress finish (with a deadline), CANCEL cancels it, KILL ends it immediately.",
   "Restart from node re-runs one node and everything after it, replaying the recorded outputs of the nodes before it, so earlier work is not repeated. Retry node does the same for a node that failed.",
   "A second, older channel exists beside run commands: the plugin-level control bus, which carries heartbeats, statistics and raw signals to a node's plugin. It is keyed by workflow and node, bypasses the reviewers and is not audited like run commands. Live control handles and their valves are kept in an execution control store built by a factory per run."
  ],
  "guar": "Commands for one run are applied in order, acknowledged and audited.",
  "state": "Pending commands and the gates are in memory. The audit trail is written to the execution log.",
  "ceil": "One batch consumer handles commands: ample for people and supervisors, not designed as a high-volume API.",
  "fail": "Changing limits or priority is written to the log but does not pass the reviewers, and the raw per-node command endpoint is neither reviewed nor audited and is keyed by workflow and node, not by run. Through it an approval wait can be released unseen. Over REST, limits need ADMIN and priority OPERATOR.",
  "set": [
   "yukta.supervisor.* (reviewers)"
  ],
  "risks": [
   "restartRace",
   "cmdCancel",
   "ctlKey"
  ]
 },
 {
  "id": "obs",
  "name": "Observation",
  "tag": "tracker, progress, telemetry",
  "c": 2,
  "r": 1,
  "mem": true,
  "resp": "Turns what happens in a run into ordered state, live progress streams and metrics.",
  "how": [
   "Every change (a node started, finished, failed) becomes an event in one ordered queue. State events are never dropped. Log lines are lower priority: if more than 10,000 are waiting, extra ones are dropped and counted.",
   "A single consumer reads the queue in batches and updates progress snapshots, run history and metrics. REST, SSE streams and MCP all read these snapshots.",
   "Each run is recorded as one trace observation with one child per node. When a tracing library is present they become a proper trace of the run.",
   "Useful meters: node durations and outcomes, retries, run duration, time spent queued, running and queued run counts, rejected starts by reason, checkpoint bytes and dropped events.",
   "Two helpers sit beside it: a cache of recent progress snapshots per run (30 minutes at most) that lets a late SSE client catch up, and the plugin log store, which copies tracker log lines into memory by default. A file-based plugin log reader and writer exist but are not wired into the application."
  ],
  "guar": "State events are complete and in order, and the run and node timelines agree with the log.",
  "state": "Everything is in memory. After a restart the newest runs are restored from the log.",
  "ceil": "State events are never dropped and their queue has no size limit, and per-session state is never evicted, so memory grows with the number of sessions and during event storms.",
  "fail": "The queue cannot overflow and silently stop tracking: bounded channels use a non-terminating 'offer' instead of 'emit'.",
  "set": [
   "tracing: add a Micrometer tracer to the classpath"
  ],
  "risks": [
   "evict21",
   "trackerQ26",
   "trackerSize27",
   "spof"

 },
 {
  "id": "dur",
  "name": "Durability",
  "tag": "log, checkpoints, recovery",
  "c": 2,
  "r": 2,
  "mem": false,
  "resp": "Makes a run explainable and resumable after the process dies.",
  "how": [
   "Execution log: an append-only record of run starts (including the input payload), run ends, control commands and idempotency keys. One writer thread does the disk work, and the file is shrunk to the newest runs from time to time.",
   "Checkpoints: the output of every node is recorded. When a node finishes normally, a tiny 'done' marker file is written and forced to disk together with its output before downstream nodes continue. The memory version is capped by message count and size; the file version keeps everything.",
   "After a crash, on boot, runs that never finished are marked ABORTED and recent history is restored. Someone can then resume an aborted run: nodes with a done marker replay their recorded output and the others run again.",
   "The archive keeps the last 10 finished runs (graph, input, outputs) so they can be restarted."
  ],
  "guar": "A resume trusts only the done marker, never the log. A node whose output exceeded the memory cap refuses a restart rather than replaying part of its output, unless a spill directory is set: then the node's whole output moves to files and replays complete.",
  "state": "Durable only if you configure directories (or PostgreSQL for the log).",
  "ceil": "Checkpoints are files or memory, not PostgreSQL. All file I/O runs on one writer thread, and log events are not fsynced (forced to disk).",
  "fail": "There is a tiny window: if a plugin performs a side effect and the process dies before the done marker is written, that node runs again after a resume and the side effect can happen twice.",
  "set": [
   "yukta.execution-log.dir, retained-runs (500), compact-after (10000)",
   "yukta.restart.dir, retained-executions (10), messages-per-node (200), bytes-per-node (4 MiB), spill-dir (off)"
  ],
  "risks": [

 },
 {
  "id": "persist",
  "name": "Persistence Backends",
  "tag": "memory, files, PostgreSQL",
  "c": 3,
  "r": 2,
  "mem": false,
  "resp": "The storage behind sessions, definitions and the log, chosen by one property.",
  "how": [
   "In-memory is the default and loses everything on restart. File storage writes atomically and forces data to disk. PostgreSQL is accessed through R2DBC (non-blocking access) at run time, with Flyway applying the schema migrations.",
   "PostgreSQL currently holds session config, workflow definitions with their versions and the execution log. Enable it by building with -Pyukta.persistence=postgres and setting the store type.",
   "The log interface is blocking, so the PostgreSQL log goes through one writer thread. It trims to the newest runs and never drops a run that has no end recorded."
  ],
  "guar": "Behaviour is the same behind each store; the choice only changes what survives a restart.",
  "state": "Durable by definition, except the in-memory option.",
  "ceil": "Connection pool tuning, health checks and native-image support for R2DBC and Flyway are not finished.",
  "fail": "Node checkpoints still use files or memory even with PostgreSQL.",

  ],

 },
 {
  "id": "sub",
  "name": "Sub-workflows",
  "tag": "runs that start runs",
  "c": 3,
  "r": 1,
  "mem": true,
  "resp": "Lets one workflow call another stored workflow for each message, enabling composition and agent-style plans.",
  "how": [
   "A SUB_WORKFLOW node starts another stored workflow of the same session for every message it receives. The child is an ordinary run with its own execution id, subject to the same limits, tracking and audit.",
   "The child's start payload carries its nesting depth and the parent's id; nesting is limited to 5 levels. The results from the child's terminal nodes are collected, and the parent node emits the child's id and results.",
   "If the child fails, the node fails, so the parent's failure policy (retry, route, ...) applies."
  ],
  "guar": "A child is an ordinary run: tracked, limited and audited.",

 {
  "id": "expr",
  "name": "Expressions & Secrets",
  "tag": "${...} values, secrets",
  "c": 0,
  "r": 2,
  "mem": false,
  "resp": "Resolves the ${...} values in a node's configuration against the current message and run, and hands out secrets by name.",
  "how": [
   "A node's configuration can contain ${...} placeholders. The resolver in core replaces them for each message: payload fields (${payload.x}), message metadata (${metadata.key}), and typed values such as ${payload.secs:int}; an untyped value stays text. A timeout written as an expression is only known when the first message arrives, so the node starts with the default and is re-timed then.",
   "Environment and system values are read only from an allow-list: YUKTA_VAR_* variables, yukta.var.* properties, a few harmless names and anything listed in yukta.variables.allowed. Names that look like secrets stay blocked even when listed.",
   "Secrets are written decrypted:name. The default provider reads the environment variable YUKTA_SECRET_NAME, so values never appear in the workflow definition. ${context.x} reads a plain text, number or flag from the run's Reactor context; keys starting yukta. and object values are hidden.",
   "The evaluators are not part of core. Conditions and mappings run through the expression utility in plugin-api, and scripts through a sandboxed JavaScript engine in the script plugin (only java.time and a few value classes are visible to scripts)."
  ],
  "guar": "A workflow cannot read an environment variable or system property outside the allow-list, and secret-looking names are never exposed.",
  "state": "Nothing is stored: values are resolved per message from the message, the run context and the environment.",
  "ceil": "Expression and script evaluation have no time or size limit of their own, so one expression or script can use a lot of CPU or memory. The context lookup is not restricted to a list of keys.",
  "fail": "A node whose configuration cannot be resolved fails that message like any other plugin failure, so retry and error routing apply.",
  "set": [
   "yukta.variables.allowed / YUKTA_VARIABLES_ALLOWED",
   "YUKTA_VAR_* and YUKTA_SECRET_* environment variables"
  ],
  "risks": [
  ]
 }

scen:[
{id:"happy",name:"Happy path",steps:[
 {t:"A start request arrives",d:"The caller posts a start, optionally with an Idempotency-Key. The gateway loads the stored definition; a repeated key returns the first execution id.",c:["entry","def"],r:[]},
 {t:"Prepare once, share it",d:"The graph is validated (cycles, ports, size limits, policies) and compiled. Concurrent starts of the same content share one preparation, and the result is cached only if the definition is still current.",c:["def"],r:["prepAlign"]},
 {t:"Admission",d:"After preparing, and before any execution id exists, the scheduler grants a slot, queues the start or refuses it. Handing out the id only after the slot is granted means two requests arriving together can never both take the last slot.",c:["entry"],r:["restartRace"]},
 {t:"Wire the graph",d:"Each node gets its wrapper (merge parents, valve, plugin call, clocks, broadcast; see the primer) and each edge becomes a stream. All consumers subscribe first and the sources start last, so no early message is lost.",c:["engine"],r:[]},
 {t:"Messages flow",d:"Triggers produce, processors transform per message with the Reactor context (execution, node, heartbeat), terminals consume. The slowest child paces the whole fan-out.",c:["engine","plugin"],r:["backpressure25","payload23"]},
 {t:"Observe and record",d:"Ordered state events feed progress, SSE and meters. Each node's output is checkpointed and, when the node completes, a durable end marker is written before completion moves on.",c:["engine","obs","dur"],r:["trackerQ26","cpstore"]},
 {t:"Finish",d:"Terminals complete, the run ends SUCCESS, the slot is released, the end is logged and the archive keeps the run restartable.",c:["entry","obs","dur"],r:["logDur24"]}]},
{id:"overload",name:"Overload",steps:[
 {t:"A burst of starts",d:"Many start requests arrive at once. With no limits configured (the default) all of them run at the same time, and the only brake is the server itself running out of resources.",c:["entry"],r:["spof"]},
 {t:"Limits kick in",d:"Global, per-workflow and per-session caps decide who runs. A start that does not fit waits (status QUEUED) or is refused with 429.",c:["entry"],r:["limits28"]},
 {t:"Fair, prioritised queue",d:"Waiting starts are ordered by payload priority, then by the session with the fewest running runs, then arrival. An operator can change a queued run's priority or the limits live.",c:["entry","control"],r:[]},
 {t:"Queue full or too old",d:"Beyond the queue capacity (default 100) or a queue timeout the start ends refused or TIMED_OUT, counted by reason in a rejection metric.",c:["entry","obs"],r:[]},
 {t:"Shutdown under load",d:"Nothing new is admitted, queued starts are refused, running ones get 30 s to finish; the rest are ABORTED on next boot.",c:["entry","dur"],r:["spof"]}]},
{id:"failure",name:"Node failure",steps:[
 {t:"A message fails in a processor",d:"The plugin throws an error for one message. Anything it produced for that message is held back, so nothing downstream ever sees half a result.",c:["engine","plugin"],r:["exactlyOnce22"]},
 {t:"Retry with backoff",d:"Exponential backoff with jitter re-runs the plugin for that message, by exception class if configured. Bad input (IllegalArgumentException) is not retried. Every attempt counts as activity.",c:["engine"],r:[]},
 {t:"Route the poison message",d:"With onError ROUTE the message, tagged with attempts, exception and time, goes to the error port and on to any dead-letter terminal. CONTINUE drops it; FAIL ends the node.",c:["engine"],r:[]},
 {t:"Failure budget",d:"If more than N messages fail in a window, the node fails instead of dropping or routing the next one, so a broken dependency cannot turn into silent data loss.",c:["engine","obs"],r:[]},
 {t:"Joins decide what a failed parent means",d:"ALL_SUCCESS fails the join, ALL_DONE continues with the others, ONE_SUCCESS fails only if every parent failed. Descendants of a failed node end UPSTREAM_FAILED.",c:["engine"],r:[]},
 {t:"The weak spot: a terminal that dies",d:"If a subtree stops reading because its terminal failed, siblings stall through back-pressure and the run only fails at the idle timeout.",c:["engine"],r:["failfast"]}]},
{id:"operator",name:"Operator steers",steps:[
 {t:"Pause",d:"The command enters the run's FIFO; the valve stops pulling input, in-flight elements finish, and all timers freeze so a pause never causes a timeout.",c:["control","engine"],r:[]},
 {t:"Step and breakpoint",d:"Step n lets exactly n elements through then pauses. A breakpoint holds a node at the first element whose payload or metadata matches.",c:["control","engine"],r:[]},
 {t:"Skip or retry a node",d:"A processor can be skipped at run time (messages bypass the plugin); a node that ended FAILURE or TIMED_OUT can be re-run with its recorded input plus everything behind it.",c:["control","engine","dur"],r:["restartRace"]},
 {t:"Review and audit",d:"Reviewers may refuse any command (403). Every command on a known run is logged as applied or rejected, with the actor.",c:["control","dur"],r:[]},
 {t:"Stop",d:"DRAIN lets work finish with a deadline, CANCEL cancels, KILL is immediate. The run ends STOPPED and its slot is released.",c:["control","engine","entry"],r:[]}]},
{id:"supervisor",name:"Supervisor intervenes",steps:[
 {t:"Events are published",d:"The tracker and command outcomes feed one global event stream. Delivery is best effort and never blocks a run.",c:["obs"],r:["trackerQ26"]},
 {t:"A supervisor receives them",d:"Each supervisor reads through a bounded buffer of 256 on its own scheduler. If it is slow, events are dropped and counted, not queued.",c:["obs","super"],r:[]},
 {t:"It answers with commands",d:"A rule (JSON + SpEL), an AI agent or a bean returns control commands; they are rate limited to 20/s, can be dry-run and carry the supervisor id as actor.",c:["super","control"],r:[]},
 {t:"Reviewers and the loop",d:"Reviewers can still refuse a command. But a supervisor also sees the status change its own command causes (a pause produces a PAUSED event) and may react to it again, chasing its own tail. Only the rate cap limits this.",c:["control","engine","super"],r:["supLoop"]}]},
{id:"crash",name:"Crash and resume",steps:[
 {t:"The JVM dies mid-run",d:"Memory is gone: tracker, scheduler slots, queued starts, signal waits. On disk (if configured): the log with the start payload, and checkpoint outputs with end markers.",c:["engine","obs","dur"],r:["spof","logDur24"]},
 {t:"Boot recovery",d:"Unfinished runs are marked ABORTED, the newest runs are restored into history, idempotency keys are reloaded so a retrying client still gets its first id.",c:["dur","persist","entry"],r:[]},
 {t:"Someone asks to resume",d:"The resumer claims the run exactly once; it is refused if the run was not aborted, was already resumed or its definition changed. Over REST it is <code>POST /api/executions/{id}/recover</code> (409 when refused), over MCP <code>control_workflow</code> with action RECOVER.",c:["entry","control"],r:[]},
 {t:"Replay what finished, re-run the rest",d:"Nodes with a durable end marker replay their recorded output; the others run again from their inputs. Without file stores nothing is resumable.",c:["dur","engine"],r:["cpstore"]},
 {t:"The at-least-once window",d:"A side effect executed between the plugin acting and the marker being written can happen twice. Only plugin-side idempotency on the message id closes it.",c:["plugin","dur"],r:["exactlyOnce22"]}]},
{id:"sub",name:"Sub-workflow fan-out",steps:[
 {t:"A node starts a child per message",d:"SUB_WORKFLOW calls the start path with the child id as a normal run; it carries depth and the parent id, and nesting stops at 5.",c:["plugin","sub","entry"],r:[]},
 {t:"Children need slots",d:"Each child is admitted like any run. With max-concurrent too small the parent holds a slot while its children wait for one: a deadlock until a timeout.",c:["entry","sub"],r:["subDeadlock"]},
 {t:"Results flow back",d:"Terminal nodes of the child feed a collector; the parent node emits executionId and results[]. A failing child fails the node and the parent's failure policy applies.",c:["sub","engine"],r:[]},
 {t:"Stopping the parent",d:"The children keep running: no cascading cancel yet, and run history does not link parent and child.",c:["control","sub"],r:["subDeadlock"]}]}

risks:[
{id:"spof",t:"Control state lives in one process",a:"Availability",i:5,e:5,c:["entry","engine","obs","control"],why:"Tracker, scheduler slots, queued starts and signal waits vanish with the JVM. Durable files let you resume, not stay up.",o:"Active/standby with a PostgreSQL lease and a checkpoint store in PostgreSQL (F11 phase 6); or accept downtime and document the recovery time.",q:"What outage duration can your users tolerate, and is resume-after-restart enough for that?",ph:"p6"},
{id:"cpstore",t:"Checkpoints are not in PostgreSQL",a:"Availability",i:4,e:4,c:["dur","persist"],why:"Resume needs a local directory even when the rest is in PostgreSQL, which blocks stateless deployment and standby.",o:"Move the store behind the same interface; decide large payloads (claim check or TOAST); the store has blocking completeness checks to rework.",q:"Is a pod restart on another node a supported scenario?",ph:"f10"},
{id:"remote",t:"No scale-out of node execution",a:"Scalability",i:5,e:5,c:["engine","plugin"],why:"CPU and IO heavy plugins compete with the control plane in one JVM.",o:"Remote workers (design written): control plane keeps the DAG and policies, workers run processor nodes over a bidirectional stream.",q:"Transport, packaging, secrets, first plugins and payload limit are still undecided. Which has the highest cost to reverse?",ph:"p2"},
{id:"exactlyOnce22",t:"Exactly-once is impossible",a:"Reliability",i:4,e:5,c:["dur","plugin"],why:"A side effect between the plugin acting and the end marker can repeat; remote workers widen the window.",o:"Keep at-least-once, publish idempotency patterns, add result caching keyed by message id (F12).",q:"Which of your plugins can safely run twice, and which cannot?",ph:""},
{id:"payload23",t:"Large payloads are carried through the engine",a:"Performance",i:4,e:4,c:["engine","dur"],why:"Every message is in memory and in checkpoints; over the cap a restart is refused unless a spill directory moves the overflow to files. Remote workers make the control plane a data hop.",o:"Claim-check references to an object store or large objects; a frame size limit.",q:"What is the largest message you expect in a year?",ph:"f10"},
{id:"failfast",t:"A dead branch stalls its siblings (B16)",a:"Reliability",i:3,e:3,c:["engine"],why:"If a subtree stops reading, back-pressure stops siblings and the run fails only at the idle timeout.",o:"On a downstream cancel-with-error, propagate failure to the run immediately.",q:"Should one failed terminal always fail the whole run?",ph:""},
{id:"backpressure25",t:"Slowest child paces every fan-out",a:"Performance",i:3,e:3,c:["engine"],why:"By design: safe, but a slow audit sink can throttle the main path.",o:"A per-edge buffer or drop policy for non-critical branches, chosen explicitly.",q:"Which consumers are allowed to fall behind?",ph:""},
{id:"evict21",t:"Finished sessions are never evicted (B21)",a:"Scalability",i:3,e:2,c:["obs"],why:"Finished runs are capped at 100 per session, but the session entries themselves are never removed (removeSession has no caller), so memory grows with the number of sessions.",o:"Call removeSession when a session is deleted; add a max-sessions or TTL policy with history served from the log.",q:"What is the retention promise for run history?",ph:""},
{id:"trackerQ26",t:"State event queue is unbounded",a:"Scalability",i:3,e:2,c:["obs"],why:"State events are never dropped, so an event storm becomes memory growth rather than data loss.",o:"Alert on queue depth; consider coalescing progress events.",q:"Would you rather lose events or run out of memory?",ph:""},
{id:"trackerSize27",t:"Tracker is large; run status has no forward-only guard (B27)",a:"Evolvability",i:2,e:2,c:["obs"],why:"Node status is guarded, run status is not: a second terminal event finalizes the run again and writes a second end to the log. The class is about 1000 lines (split into smaller classes in open PRs #365 and #366).",o:"Return early once a run is terminal; extract history and cleanup projections.",q:"",ph:""},
{id:"supLoop",t:"Supervisors can loop on their own effects (B25)",a:"Reliability",i:2,e:2,c:["super"],why:"The host hides the supervisor's own command outcomes, but status events carry no actor, so the PAUSED caused by its pause is still delivered; capped only by the rate limit.",o:"Add the causing actor to status events and let the host filter them.",q:"",ph:""},
{id:"blockStart",t:"Blocking file work on the sub-workflow start path (B19)",a:"Performance",i:1,e:1,c:["entry","sub"],why:"Fixed for starts and restarts (archiving now happens on subscription, off the caller's thread). It remains for sub-workflow starts, which do not hop to another scheduler.",o:"Subscribe the sub-workflow start on boundedElastic.",q:"",ph:""},
{id:"prepAlign",t:"Validator and assembler disagree in corners (B26)",a:"Correctness",i:2,e:2,c:["def"],why:"What counts as a terminal differs; a failed checkpoint save fails a node while a failed end marker does not.",o:"Align the checks; no caller triggers it today.",q:"",ph:""},
{id:"restartRace",t:"Restart has the start-time slot race (R1)",a:"Correctness",i:3,e:2,c:["entry","control"],why:"Check-then-acquire on restart can exceed a limit by one.",o:"Reserve the slot before returning the new id, as starts do.",q:"",ph:""},
{id:"limits28",t:"Runtime limit changes are not restored",a:"Operability",i:2,e:1,c:["entry"],why:"After a restart the limits revert to configuration.",o:"Reload the latest limit change from the log, or treat configuration as the source of truth and say so.",q:"",ph:""},
{id:"signals14",t:"Approval waits are in memory (F2)",a:"Reliability",i:3,e:3,c:["plugin","dur"],why:"A resumed run waits again; a signal before the wait is refused; no UI for pending approvals.",o:"Durable waits in the checkpoint store, queued signals, an approvals page.",q:"How long do your approvals take, hours or days?",ph:""},
{id:"llmBudget",t:"Budgets stop at one plugin (F4)",a:"Governance",i:3,e:3,c:["plugin"],why:"No per-provider rate limit, no budget across MCP calls, no hard stop of the run.",o:"A shared budget service keyed by run and provider.",q:"",ph:""},
{id:"subDeadlock",t:"Sub-workflow slot deadlock (F6)",a:"Reliability",i:4,e:3,c:["sub","entry"],why:"Parent waits on children that wait for the parent's slot; no cascade cancel; no parent/child history.",o:"Let a child borrow its parent's slot; cascade stop; link runs in history.",q:"",ph:""},
{id:"memStore",t:"Agent memory is partly volatile (F7)",a:"Reliability",i:3,e:3,c:["plugin"],why:"KV_STORE is memory; chat history has no TTL and loads whole files; no shared or vector memory.",o:"Database backend after F10, eviction policy.",q:"",ph:"f10"},
{id:"agentLoop",t:"Agent loop is incomplete (F8)",a:"Functionality",i:2,e:2,c:["plugin"],why:"Tool results return as a plain user turn; tools/list is first page only; no streaming.",o:"Proper tool-role turns, pagination, an example loop workflow.",q:"",ph:""},
{id:"versions21",t:"Version history lacks diff and pinning (F9)",a:"Functionality",i:2,e:2,c:["def"],why:"No MCP tools, no diff, no notes, no UI.",o:"Expose versions through MCP and UI; pin a run to a version.",q:"",ph:""},
{id:"logDur24",t:"Log events are not fsynced",a:"Reliability",i:2,e:2,c:["dur"],why:"A power loss can lose the last few events (the node end marker is separate and forced).",o:"Optional fsync per batch; or document as accepted.",q:"Is losing the last second of audit acceptable?",ph:""},
{id:"writerThread27",t:"Single writer thread for the log",a:"Performance",i:2,e:2,c:["persist"],why:"The store interface is blocking; PostgreSQL goes through one thread.",o:"Batch inserts or make the interface reactive.",q:"",ph:""},
{id:"logGrow",t:"Default execution log never shrinks (B28)",a:"Scalability",i:3,e:1,c:["dur","persist"],why:"Without a log directory the log is a copy-on-write list that keeps every start payload and event, so memory grows without bound and every append copies the list.",o:"A bounded structure that trims to the newest runs, never dropping a run without an end, as the file log does.",q:"Is anyone running a long-lived server on the default store?",ph:""},
{id:"cmdCancel",t:"A cancelled command breaks ordering and audit (B29)",a:"Reliability",i:3,e:1,c:["control"],why:"When a queued command's caller disconnects, its place is released at once, so the next command can run beside the one still in progress; the cancelled command is not recorded as applied or rejected.",o:"Release the place only after the previous command ends; record cancellations.",q:"",ph:""},
{id:"ctlKey",t:"Plugin-level control keyed by workflow and node (B30)",a:"Correctness",i:2,e:2,c:["control"],why:"Heartbeats, statistics and raw node commands use workflow plus node as key, so two sessions or runs with the same ids share state.",o:"Include the session or execution id in the key.",q:"",ph:""},
{id:"idemCap",t:"Idempotency cache has no size cap (B31)",a:"Scalability",i:2,e:1,c:["entry"],why:"A client sending a new key per request keeps one cached entry per key for the whole window, so memory follows the request rate.",o:"Cap the cache size.",q:"",ph:""},
{id:"childCancel",t:"A cancelled child may never end (B33, to confirm)",a:"Reliability",i:3,e:2,c:["sub","control"],why:"When a parent node is cancelled, the child's cleanup unregisters it but does not record a final status. Deduced from the code; needs a test first.",o:"Test the cancel path, then finish the child as cancelled.",q:"",ph:""},
{id:"histCache",t:"Run progress history is unbounded (B34)",a:"Scalability",i:4,e:1,c:["obs"],why:"Every status event stores a full snapshot of all node states for up to 30 minutes, with no count cap on the history or the cache. A large run, or many runs, grows memory with events times nodes.",o:"Cap the history per run (keep the last snapshot), set a maximum cache size, optionally coalesce snapshots.",q:"How many late-joining viewers need every intermediate step?",ph:""},
{id:"ckptIO",t:"Durable runs pay a file open per message (P1)",a:"Performance",i:3,e:3,c:["dur"],why:"With a restart directory each message is appended by opening the file on another thread, and a resume reads a node's whole output into memory. Not measured yet.",o:"Measure first; keep one appender per node and stream the reads.",q:"What message rate must a durable run sustain?",ph:""},
{id:"gaps12",t:"Capability gaps (F12)",a:"Functionality",i:2,e:4,c:["engine"],why:"Saga compensation, node result caching, A2A agent card, eval node, backfill, run search, secrets manager, auto-resume.",o:"Pull in on demand.",q:"Which one would a design partner ask for first?",ph:""}

adrs:[
{t:"Reactor stream per edge with back-pressure",ctx:"Fan-out and slow consumers must not blow memory or reorder data.",dec:"Each edge is a Reactor stream, subscribed before the source connects; no queue between nodes.",con:"Bounded memory and simple semantics; slowest child paces the fan-out; stalls propagate.",rev:"a non-critical branch must not slow the main path, or streams must cross machines."},
{t:"Single JVM with in-memory control state",ctx:"Fast to build, easy to reason about ordering.",dec:"Scheduler, tracker, valves and command queues are memory structures; durability is added behind interfaces.",con:"Low latency and simple code; crash loses live state; no standby.",rev:"availability needs exceed restart plus resume."},
{t:"At-least-once with idempotent plugins",ctx:"Exactly-once across plugin side effects cannot be guaranteed.",dec:"Retries and resumes may repeat work; message id is stable and an attempt header is supplied.",con:"Honest guarantee; plugin authors carry the burden.",rev:"a node type needs transactions with its target."},
{t:"Durable node end marker, not log fsync",ctx:"A resume must not trust events that were queued but never forced.",dec:"The end marker is written and forced together with the output before completion moves downstream.",con:"Resume skips only truly finished nodes; small window remains before the marker.",rev:"checkpoints move to a database with its own commit semantics."},
{t:"Forward-only node status",ctx:"Events arrive late and out of order.",dec:"Status only moves PENDING < QUEUED < RUNNING < an end state; metadata is still merged.",con:"UIs never show a finished run with running nodes; some late information is ignored.",rev:"re-opening a node becomes a feature (e.g. retry shown as the same node)."},
{t:"Supervisors and reviewers on one control bus",ctx:"Humans, rules and AI should steer runs through the same safe path.",dec:"Every command is ordered, reviewable and audited; supervisors are isolated and rate limited.",con:"One enforcement point; commands that bypass it are bugs.",rev:"commands need per-tenant policy outside the JVM."},
{t:"PostgreSQL through R2DBC, schema by Flyway",ctx:"The engine is reactive; schema needs to be versioned.",dec:"R2DBC at run time, Flyway over JDBC for migrations, one module, selected by property.",con:"Non-blocking access; two connection styles to configure; native-image metadata needed.",rev:"a second database or sharding is needed."},
{t:"Remote workers as node invocation (proposed)",ctx:"Scale-out is needed without moving the DAG.",dec:"The control plane keeps graph and policy and calls workers per node attempt over a bidirectional stream; workers connect out.",con:"All policies carry over; control plane remains a data hop and a single point of failure until phase 6.",rev:"payloads grow beyond the frame limit, or latency to workers matters."}],

function whatRender(){var runs=wv.runs,n=wv.nodes,kb=wv.kb,f=[];

 if(kb>1024)f.push(["Stream Engine","P0","Messages over 1 MiB are copied through memory and checkpoints on every node; consider a claim-check before this."]);
 if(runs*n>5000)f.push(["Observation","P1",(runs*n)+" live nodes produce a high event rate into one unbounded state queue; watch the tracker queue and drop counters."]);
 f.push(["Stream Engine",kb>256?"P1":"okp","Fan-out is paced by the slowest child, so throughput is that of the slowest branch, not the average."]);
 $("#whatOut").innerHTML='<table>'+f.map(function(x){return '<tr><td style="width:190px"><span class="pill '+x[1]+'">'+x[0]+'</span></td><td>'+x[2]+'</td></tr>'}).join("")+'</table><p class="refs">Rule-based hints from the documented defaults and caps; load test before trusting any number.</p>'}

var notes=store.get("yk-arch-notes")||{},view="list",aOn={},stF="",rq="",attrs=[];
D.risks.forEach(function(r){if(attrs.indexOf(r.a)<0)attrs.push(r.a)});attrs.forEach(function(a){aOn[a]=true});
var ab=$("#attrFilters");attrs.forEach(function(a){var b=document.createElement("button");b.type="button";b.textContent=a;b.setAttribute("aria-pressed","true");b.onclick=function(){aOn[a]=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",aOn[a]);board()};ab.appendChild(b)});

function visible(){return D.risks.filter(function(r){var n=notes[r.id]||{};if(!aOn[r.a])return false;if(stF==="none"?!!n.s:(stF&&n.s!==stF))return false;if(rq&&(r.t+" "+r.why+" "+r.o+" "+r.id).toLowerCase().indexOf(rq)<0)return false;return true}).sort(sortR)}

function board(){var vis=visible(),b=$("#boardBody");
 if(!vis.length){b.innerHTML='<div class="card refs" style="text-align:center">No risks match these filters.</div>';return}
 if(view==="grid"){var cell=100,m=40,s="",cnt={};
  [1,2,3,4,5].forEach(function(){});
  s+='<rect class="q" x="'+m+'" y="10" width="'+cell*2.5+'" height="'+cell*2.5+'"/><rect class="q" x="'+(m+cell*2.5)+'" y="10" width="'+cell*2.5+'" height="'+cell*2.5+'" style="fill:var(--accent-soft)"/><rect class="q" x="'+m+'" y="'+(10+cell*2.5)+'" width="'+cell*2.5+'" height="'+cell*2.5+'"/><rect class="q" x="'+(m+cell*2.5)+'" y="'+(10+cell*2.5)+'" width="'+cell*2.5+'" height="'+cell*2.5+'"/>';
  s+='<text class="ql" x="'+(m+8)+'" y="28">High impact, low effort: do first</text><text class="ql" x="'+(m+cell*2.5+8)+'" y="28">High impact, high effort: plan</text><text class="ql" x="'+(m+8)+'" y="'+(10+cell*5-8)+'">Low impact, low effort: fill in</text><text class="ql" x="'+(m+cell*2.5+8)+'" y="'+(10+cell*5-8)+'">Low impact, high effort: question</text>';
  s+='<text class="ql" x="'+(m+cell*2.5)+'" y="'+(cell*5+36)+'" text-anchor="middle">Effort →</text><text class="ql" transform="translate(12 '+(10+cell*2.5)+') rotate(-90)" text-anchor="middle">Impact →</text>';
  vis.forEach(function(r){var k=r.i+"-"+r.e,j=cnt[k]=(cnt[k]||0),dx=(j%3-1)*22,dy=(Math.floor(j/3)-1.5)*22;cnt[k]++;var x=m+(r.e-0.5)*cell+dx,y=10+(5-r.i+0.5)*cell+dy;
   s+='<g class="dot" data-open="'+r.id+'" tabindex="0" role="button" aria-label="'+esc(r.t)+'"><circle cx="'+x+'" cy="'+y+'" r="11" fill="'+(r.i>=4?"var(--p0)":r.i===3?"var(--p1)":"var(--p3)")+'"/><text x="'+x+'" y="'+(y+3)+'" text-anchor="middle">'+(D.risks.indexOf(r)+1)+'</text></g>'});
  b.innerHTML='<div class="card"><svg class="matrix" viewBox="0 0 '+(m+cell*5+10)+' '+(cell*5+50)+'" role="img" aria-label="Impact versus effort">'+s+'</svg><p class="refs">Dots are numbered by their order in the list view; click one to open it. Red = impact 4-5, amber = 3, grey = lower.</p></div>';return}
 b.innerHTML=vis.map(function(r){var n=notes[r.id]||{};return '<details class="item" id="r-'+r.id+'"><summary><span class="id">'+(D.risks.indexOf(r)+1)+'</span><span class="t">'+esc(r.t)+'</span><span class="meta"><span class="pill '+(r.i>=4?"P0":r.i===3?"P1":"P3")+'">impact '+r.i+'</span><span class="pill P3">effort '+r.e+'</span><span class="pill P2">'+r.a+'</span>'+(n.s?'<span class="pill okp">'+n.s+'</span>':"")+'</span></summary><div class="body"><dl><dt>Why it matters</dt><dd>'+r.why+'</dd><dt>Options</dt><dd>'+r.o+'</dd>'+(r.q?'<dt>Think about</dt><dd><div class="callout q" style="margin:0">'+r.q+'</div></dd>':"")+'<dt>Components</dt><dd>'+r.c.map(compChip).join("")+'</dd><dt>Your status</dt><dd><select data-st="'+r.id+'" aria-label="Status"><option value="">Unset</option>'+["Idea","Investigating","Planned"].map(function(s){return '<option'+(n.s===s?" selected":"")+'>'+s+'</option>'}).join("")+'</select></dd><dt>Your note</dt><dd><textarea data-nt="'+r.id+'" placeholder="Your thinking...">'+esc(n.n||"")+'</textarea></dd></dl></div></details>'}).join("")}
