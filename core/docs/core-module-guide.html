<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta Core Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0}
pre code{background:none;padding:0}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:56px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
.lede{color:var(--muted);max-width:760px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul,.card ol{padding-left:18px;margin:6px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;text-decoration:none}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"]{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"]{color:#111}}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);min-width:220px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pipe{width:100%;height:auto;display:block}
.pipe .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2;transition:fill .15s,stroke .15s}
.pipe .box text{fill:var(--text);font:600 13px var(--sans)}
.pipe .box .s{fill:var(--muted);font:12px var(--mono)}
.pipe .box.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.pipe .arrow{stroke:var(--muted);stroke-width:1.4;fill:none}
.pipe .box{cursor:pointer}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.stepbody h3{margin-top:0}
.refs{font-size:13px;color:var(--muted)}
.flag{border-left:3px solid var(--p1);background:var(--p1-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:10px;font-size:14px}
.flag.p0{border-color:var(--p0);background:var(--p0-soft)}
.pkgs{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.pkglist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:6px;padding:7px 10px;background:transparent;font-family:var(--mono);font-size:12.5px}
.pkglist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.finding{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.finding summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}
.finding summary::-webkit-details-marker{display:none}
.finding .id{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:30px}
.finding .t{font-weight:600}
.finding .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.finding .body{padding:0 14px 14px 14px;border-top:1px solid var(--line)}
.finding .body dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;margin:12px 0 0}
.finding .body dt{color:var(--muted);font-size:13px}
.finding .body dd{margin:0;min-width:0;overflow-wrap:anywhere}
.finding.done{opacity:.55}
.finding.done .t{text-decoration:line-through}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.progress .bar{flex:1;height:8px;margin:0}
.progress .bar>i{background:var(--ok)}
.empty{color:var(--muted);padding:20px;text-align:center}
.score td:nth-child(2){font-family:var(--mono);white-space:nowrap}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.pkgs{grid-template-columns:1fr}
  .finding summary{grid-template-columns:auto minmax(0,1fr)}
  .finding .meta{grid-column:1/-1}
  .finding .body dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
</nav>
<main id="main"></main>
</div>
<script>
var DATA = {"module": "core", "htmlTitle": "Yukta Core Guide", "title": "Core module guide (round 3)", "date": "2026-10-10", "lede": "Yukta's DAG engine and control plane after the round-2 phases landed: the execution pipeline as built, the 20 classic DAG pitfalls compared with Airflow, Temporal, Argo and Flink (updated), the implemented control model, node state machine and time model, and the <b>round-3 improvement board<\/b> (R18–R29).", "stats": [["15.5k", "main lines"], ["103", "test classes"], ["17/17", "round-2 items reviewed"]], "overviewHtml": "<h3>Where the engine stands<\/h3><p>Round 2 is merged: timeouts are anchored and exactly pause-aware, every node ends in a terminal state, events are ordered, control is acknowledged and FIFO, failures can be retried or routed, runs are durable at start and end and restartable, and admission is governed. Round 3 re-checked each item against the code and found <b>no data-corrupting bug<\/b>, but it did find a <b>silent tracking failure<\/b> (R18), an <b>unmet acceptance criterion<\/b> (R19) and a <b>metrics tag defect<\/b> (R20). Three findings were reproduced with probe tests.<\/p><div class=\"flag p0\"><b>Read first:<\/b> <a href=\"#f-R18\" data-jump=\"R18\">R18<\/a>. A burst of log events can overflow the tracker's event sink; it then stops tracking every run until restart.<\/div>", "score": [["Streaming and backpressure", "4.5", "Pause leaks the downstream prefetch (R24)"], ["Status model", "3.5 → 4.5", "Ordered, final states; sink can overflow (R18)"], ["Time semantics", "1.5 → 3.5", "Anchored, exact pause; plugin defaults missing (R19)"], ["Failure semantics", "2.5 → 4", "Retry, error port, join rule (R26)"], ["Control plane", "2.5 → 4", "Exact step, FIFO, acks, drain; no audit (R25)"], ["Restart and recovery", "1.5 → 3.5", "Correct restart; in-memory archive (R25)"], ["Governance", "2.5 → 4", "Limits and queue; restart bypasses them (R23)"], ["Simplicity", "4", "—"], ["Observability", "2 → 2.5", "Metrics tag defect (R20); no tracing"]], "flowTitle": "Execution pipeline (as built)", "steps": [{"k": "Admit", "cls": "DefaultControlBusGateway.startWorkflow", "d": "Loads the definition, refuses with 429 when the <code>ExecutionScheduler<\/code> cannot admit or queue it, de-duplicates by <code>Idempotency-Key<\/code>, shares one prepare per workflow, then runs the execution asynchronously. Restart paths skip this check.", "f": ["R23", "R27"]}, {"k": "Prepare", "cls": "WorkflowPreparator · WorkflowValidator", "d": "Validates (duplicate ids/edges, ports, size limits, Kahn cycle check, engine policies), initialises plugins, sorts and compiles one assembler per node.", "f": ["R28"]}, {"k": "Register", "cls": "ExecutionControlFactory · ExecutionArchive", "d": "Per-run stop sinks, pause valves and the archive entry (graph, payload, definition hash) that keeps the run restartable; the start is written to the execution log.", "f": ["R22", "R25"]}, {"k": "Assemble", "cls": "*AssemblerStrategy · NodeStreams · NodePolicies", "d": "Each node: merge parents (join rule) → input gate (permit valve) → plugin, per message with retry and error routing when configured → idle clock and status → broadcast.", "f": ["R19", "R21", "R24", "R26"]}, {"k": "Connect", "cls": "NodeBroadcast · ExecutionResources", "d": "Every edge subscribes, then <code>publish()<\/code> connects, so the slowest child sets the pace. The connector disposables are kept in a thread-safe list.", "f": []}, {"k": "Admit slot", "cls": "ExecutionScheduler · WorkflowOrchestrator.runTracked", "d": "The run waits (status <code>QUEUED<\/code>) for a slot, then runs the body racing the stop signal; the permit is released however the run ends.", "f": ["R23"]}, {"k": "Control", "cls": "ControlBusService → CommandSequencer → Processor", "d": "Commands are applied in per-execution FIFO order and the caller is acknowledged once applied. Stop is <code>DRAIN<\/code> (default), <code>CANCEL<\/code> or <code>KILL<\/code>.", "f": ["R18", "R25", "R28"]}, {"k": "Track", "cls": "DefaultTaskTrackerService", "d": "One ordered <code>TrackerEvent<\/code> sink with one batched consumer feeds progress, SSE and metrics; terminal sweep finalises open nodes; run end is written to the execution log.", "f": ["R18", "R20", "R22"]}, {"k": "Finish", "cls": "runTracked doFinally · ExecutionRecovery", "d": "Unregisters the control; the archive keeps the run restartable. After a crash <code>ExecutionRecovery<\/code> marks unfinished runs <code>ABORTED<\/code> (history only).", "f": ["R25"]}], "pkgs": [["service/orchestrator", 2, 427, "WorkflowOrchestrator (execute, restartFromNode, runTracked with scheduler permit) and RestartPlan.", "com.infenia.yukta.service.orchestrator"], ["service/orchestrator/preparator", 2, 307, "WorkflowPreparator (validate → build maps → init plugins → Kahn sort → compile) and TopologicalSortService.", "com.infenia.yukta.service.orchestrator.preparator"], ["service/orchestrator/validator", 1, 452, "WorkflowValidator: unknown/duplicate nodes and edges, ports, size limits, categories, entry/end points, Kahn cycle check, engine policies, plugin configs.", "com.infenia.yukta.service.orchestrator.validator"], ["service/orchestrator/compiler", 2, 457, "WorkflowCompiler (assemblers, template) and ExecutionResources (Mono.using, pause-aware run deadline, connectors).", "com.infenia.yukta.service.orchestrator.compiler"], ["service/orchestrator/strategy", 5, 652, "Trigger, Processor and Terminal assembler strategies plus StreamAssemblyHelper (context, lifecycle, controls).", "com.infenia.yukta.service.orchestrator.strategy"], ["service/orchestrator/stream", 5, 540, "NodeStreams (idle timeout and status), NodeActivity (idle clock), NodePolicies (retry/onError), NodeBroadcast, StreamTopologyDecorator.", "com.infenia.yukta.service.orchestrator.stream"], ["service/orchestrator/assembly", 2, 251, "AssemblyContext and ExecutionContextBuilder (Reactor context keys).", "com.infenia.yukta.service.orchestrator.assembly"], ["service/orchestrator/tracker", 2, 1287, "TaskTrackerService and DefaultTaskTrackerService: ordered TrackerEvent sink, terminal sweep, SSE projections, history cap, node metrics.", "com.infenia.yukta.service.orchestrator.tracker"], ["service/control", 6, 1086, "ControlBusService, CommandSequencer (per-execution FIFO + ack), ExecutionControl (stop sinks, valves, stopRequested), ExecutionScheduler (limits, queue, graceful stop).", "com.infenia.yukta.service.control"], ["service/control/gateway", 4, 1465, "ControlBusGateway façade, StartIdempotency, shared prepare: start, stop (with mode), pause, step, restart, watch, history.", "com.infenia.yukta.service.control.gateway"], ["service/control/processor", 12, 1101, "One processor per command; stop supports DRAIN/CANCEL/KILL; restart reads the archive.", "com.infenia.yukta.service.control.processor"], ["service/control/directive", 4, 355, "DirectiveDispatcher (dispatchOrdered) plus heartbeat, statistics and signal handlers.", "com.infenia.yukta.service.control.directive"], ["service/control/valve", 1, 136, "ReactiveControlValve: permit counter (FLOWING / HELD / STEPPING with banked credits).", "com.infenia.yukta.service.control.valve"], ["service/control/store", 4, 329, "ExecutionControlRegistry/Store and ActivePluginRegistry.", "com.infenia.yukta.service.control.store"], ["service/control/factory", 1, 77, "ExecutionControlFactory: per-node sinks, valves and skip flags.", "com.infenia.yukta.service.control.factory"], ["service/store", 1, 125, "InMemoryNodeCheckpointStore: all messages per node up to a cap, completeness flag.", "com.infenia.yukta.service.store"], ["service/archive", 3, 192, "ExecutionArchive (last N executions: graph, payload), ArchivedExecution, DefinitionVersion (content hash).", "com.infenia.yukta.service.archive"], ["service/log", 5, 433, "ExecutionLogStore SPI, in-memory and JSONL stores, ExecutionRecovery (marks unfinished runs ABORTED, trims, restores history).", "com.infenia.yukta.service.log"], ["service/workflow/store", 4, 331, "WorkflowDefinitionStore and PreparedWorkflowCache (Caffeine).", "com.infenia.yukta.service.workflow.store"], ["service/session/store", 4, 999, "Session config: file (atomic writes) or in-memory.", "com.infenia.yukta.service.session.store"], ["model/execution", 6, 210, "TaskStatus (incl. QUEUED, CANCELLED, TIMED_OUT, SKIPPED, UPSTREAM_FAILED, ABORTED), ControlState, TaskProgress, WorkflowProgress.", "com.infenia.yukta.model.execution"], ["model/workflow", 9, 430, "Workflow definition and prepared-workflow model, NodePolicy (engine config).", "com.infenia.yukta.model.workflow"], ["event", 4, 106, "TrackerEvent (sealed): task, workflow and log events.", "com.infenia.yukta.event"], ["config", 2, 101, "AppConfiguration: virtual-thread bounded-elastic scheduler, control store.", "com.infenia.yukta.config"], ["util", 2, 407, "VariableResolver (env/sys allow-listing) and MapUtils.", "com.infenia.yukta.util"]], "sections": [{"id": "pitfalls", "title": "DAG pitfalls: R&D matrix", "lede": "Twenty failure modes that mature orchestrators design for, how they solve them, and where Yukta stands after round 2. Sources are linked in core-improvements.md §7.", "html": "<div class=\"card tablewrap\"><table><tr><th>#<\/th><th>Pitfall<\/th><th>Established solution<\/th><th>Yukta<\/th><th>Notes<\/th><\/tr><tr><td>1<\/td><td><b>Cycles and malformed graphs<\/b><\/td><td>Reject at definition time with precise errors<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Cycles, duplicates, ports, size limits<\/td><\/tr><tr><td>2<\/td><td><b>Join after a branch never fires (dead path)<\/b><\/td><td>Airflow trigger rules<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>ALL_SUCCESS / ALL_DONE; no ONE_SUCCESS<\/td><\/tr><tr><td>3<\/td><td><b>Fan-out to a slow child<\/b><\/td><td>Credit-based flow control (Flink)<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>publish(bufferSize)<\/td><\/tr><tr><td>4<\/td><td><b>Late subscriber misses data<\/b><\/td><td>Start the source only when consumers are ready<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>NodeBroadcast connects after every edge subscribes<\/td><\/tr><tr><td>5<\/td><td><b>Timeouts count queue wait and pause time<\/b><\/td><td>Separate schedule-to-start, start-to-close, heartbeat (Temporal)<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>Anchored and pause-aware; plugin defaults missing (R19)<\/td><\/tr><tr><td>6<\/td><td><b>Long-running work looks dead<\/b><\/td><td>Activity heartbeats<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>No heartbeat API (R19)<\/td><\/tr><tr><td>7<\/td><td><b>A transient failure fails the run<\/b><\/td><td>Retry with backoff and jitter<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>engine.retry (see R26)<\/td><\/tr><tr><td>8<\/td><td><b>Retries duplicate side effects<\/b><\/td><td>Idempotency keys; at-least-once<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>No attempt/messageId header (R28)<\/td><\/tr><tr><td>9<\/td><td><b>Fail-fast vs partial results<\/b><\/td><td>fail_fast / all_done / error handlers<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>engine.onError<\/td><\/tr><tr><td>10<\/td><td><b>A crash loses state<\/b><\/td><td>Event-sourced history; checkpoints<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>Start/end durable, no resume (R22, R25)<\/td><\/tr><tr><td>11<\/td><td><b>Re-running part of a graph<\/b><\/td><td>Clear downstream; reset<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>RestartPlan<\/td><\/tr><tr><td>12<\/td><td><b>Definition changes under running runs<\/b><\/td><td>Versioning<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Hash per run (stale prepare race: R27)<\/td><\/tr><tr><td>13<\/td><td><b>Unbounded concurrency<\/b><\/td><td>Parallelism limits, pools<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>ExecutionScheduler (restart bypass: R23)<\/td><\/tr><tr><td>14<\/td><td><b>Cancellation doesn't reach the work<\/b><\/td><td>Cooperative cancel, then forced<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>DRAIN / CANCEL / KILL<\/td><\/tr><tr><td>15<\/td><td><b>Control commands race or reorder<\/b><\/td><td>Signals serialised per workflow<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>FIFO + ack<\/td><\/tr><tr><td>16<\/td><td><b>Can't see why it's slow or stuck<\/b><\/td><td>Per-task metrics and traces<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>Metrics tag defect (R20); no tracing<\/td><\/tr><tr><td>17<\/td><td><b>A poison message blocks the stream<\/b><\/td><td>Dead-letter queue, error ports<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>ROUTE to the error port<\/td><\/tr><tr><td>18<\/td><td><b>UI shows a finished run with running nodes<\/b><\/td><td>One ordered history<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>Ordered, but the sink can die (R18)<\/td><\/tr><tr><td>19<\/td><td><b>Large payloads in every buffer<\/b><\/td><td>Claim-check pattern<\/td><td><span class=\"pill P2\">partial<\/span><\/td><td>Count-bounded checkpoints only (R25)<\/td><\/tr><tr><td>20<\/td><td><b>Starvation and priority<\/b><\/td><td>Priority queues and weights<\/td><td><span class=\"pill P0\">gap<\/span><\/td><td>No priority<\/td><\/tr><\/table><\/div>"}, {"id": "control", "title": "Control model: target vs today", "lede": "Every command goes through one per-execution FIFO queue. It's idempotent (commandId), acknowledged (APPLIED, REJECTED or NOOP) and recorded in the execution log.", "html": "<div class=\"card tablewrap\"><table><tr><th>Command<\/th><th>Target semantics<\/th><th>Today<\/th><th><\/th><\/tr><tr><td><b>Pause run / node<\/b><\/td><td>Stop pulling input; in-flight elements finish; timers suspended<\/td><td>Input-side permit gate; pause-aware timers; up to the downstream prefetch (32) still passes (R24)<\/td><td><span class=\"pill P2\">partial<\/span><\/td><\/tr><tr><td><b>Resume<\/b><\/td><td>Release the gate<\/td><td>Works<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Step n<\/b><\/td><td>Exactly n input elements, then pause<\/td><td>Exact (banked credits)<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Breakpoint (new)<\/b><\/td><td>Pause when a predicate matches<\/td><td>—<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><tr><td><b>Skip node<\/b><\/td><td>Pass-through or SKIPPED<\/td><td>Pre-start skip only; rejected at runtime<\/td><td><span class=\"pill P2\">partial<\/span><\/td><\/tr><tr><td><b>Stop run<\/b><\/td><td>DRAIN → CANCEL → KILL with a deadline<\/td><td>Implemented; mode not selectable from REST/MCP (R28)<\/td><td><span class=\"pill P2\">partial<\/span><\/td><\/tr><tr><td><b>Stop node<\/b><\/td><td>DRAIN or CANCEL a single node<\/td><td>Works<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Retry node (new)<\/b><\/td><td>Re-run a failed node with its recorded input<\/td><td>—<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><tr><td><b>Restart run<\/b><\/td><td>New run, same version and payload<\/td><td>Works; bypasses admission control (R23)<\/td><td><span class=\"pill P2\">partial<\/span><\/td><\/tr><tr><td><b>Restart from node<\/b><\/td><td>Descendants only; boundary inputs replayed<\/td><td>Works for finished and failed runs while the archive holds them<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Command ack / idempotency / audit<\/b><\/td><td>APPLIED, REJECTED; commandId; recorded in the log<\/td><td>Ack and FIFO done; no commandId, no audit (R25)<\/td><td><span class=\"pill P2\">partial<\/span><\/td><\/tr><tr><td><b>Set concurrency / priority (new)<\/b><\/td><td>Adjust limits on queued or running runs<\/td><td>Static limits only<\/td><td><span class=\"pill P0\">gap<\/span><\/td><\/tr><\/table><\/div>"}, {"id": "states", "title": "Node state machine", "html": "<div class=\"card\"><pre><code>PENDING ──QUEUED (waiting for a slot)──▶ PENDING\nPENDING ──first input / trigger start──▶ RUNNING ──complete──▶ SUCCESS\n   │                                 │ ├─error (after retries)─▶ FAILURE ──onError=ROUTE──▶ error port\n   │                                 │ ├─timeout──────────────▶ TIMED_OUT\n   │                                 │ └─cancel / stop────────▶ CANCELLED\n   ├─run succeeded, node never ran────────────────▶ SKIPPED\n   ├─run failed, node never ran───────────────────▶ UPSTREAM_FAILED\n   └─run stopped before the node started──────────▶ CANCELLED\n\nRun: QUEUED → RUNNING → SUCCESS | FAILURE | STOPPED | TIMED_OUT | ABORTED (after a crash)<\/code><\/pre>\n<p class=\"refs\">Control state (PAUSED, STEPPING, STOPPING) is separate from status. Retries do not show as a separate node status.<\/p><\/div>"}, {"id": "time", "title": "Time model", "lede": "Clocks start when work starts, not when the graph is wired, and every clock is pause-aware.", "html": "<div class=\"card tablewrap\"><table><tr><th>Timer<\/th><th>Starts<\/th><th>Pauses<\/th><th>Default<\/th><th>Today<\/th><\/tr><tr><td>Queue wait<\/td><td>Admission<\/td><td>—<\/td><td>Reported (QUEUED)<\/td><td>Done<\/td><\/tr><tr><td>Node processing (per element)<\/td><td>Element received<\/td><td>Yes<\/td><td>Plugin-declared<\/td><td><b>Not built<\/b> (R19)<\/td><\/tr><tr><td>Node idle<\/td><td>First input / last output<\/td><td>Yes (exact)<\/td><td>30 s (plugin default)<\/td><td>Done; no plugin overrides the default (R19); clock is costly per message (R21)<\/td><\/tr><tr><td>Node deadline<\/td><td>First input<\/td><td>Yes<\/td><td>None<\/td><td>Not built<\/td><\/tr><tr><td>Plugin heartbeat<\/td><td>heartbeat() call<\/td><td>Yes<\/td><td>Off<\/td><td>Not built (R19)<\/td><\/tr><tr><td>Run deadline<\/td><td>RUNNING<\/td><td>Yes (exact)<\/td><td>Session timeout<\/td><td>Done<\/td><\/tr><\/table><\/div>"}, {"id": "architecture", "title": "Execution log: what exists and what is missing", "html": "<div class=\"grid g2\"><div class=\"card\"><h3>Built<\/h3><ul><li><code>ExecutionLogStore<\/code> SPI with in-memory and JSONL stores.<\/li><li>RUN_STARTED (with definition hash) and RUN_FINISHED / RUN_ABORTED records.<\/li><li><code>ExecutionRecovery<\/code> on boot: marks unfinished runs ABORTED, trims, restores history.<\/li><li>The tracker's ordered <code>TrackerEvent<\/code> sink is the single in-memory source of truth for progress.<\/li><\/ul><\/div><div class=\"card\"><h3>Missing<\/h3><ul><li>Node output and control events in the log (R25).<\/li><li>Compaction and a non-blocking writer (R22).<\/li><li>A safe tracker sink: log lines must not share a queue with state (R18).<\/li><li>Persisting the archive/checkpoints so restart survives a reboot (R25).<\/li><\/ul><p class=\"refs\">Storage options after JSONL: SQLite or Postgres behind the same SPI.<\/p><\/div><\/div>"}, {"id": "round1", "title": "Round 1 and 2: verification", "lede": "Each item re-checked against the code on <code>main<\/code> @ <code>813796d8<\/code>.", "html": "<div class=\"card tablewrap\"><table><tr><th>ID<\/th><th>Finding<\/th><th>Status<\/th><\/tr><tr><td>R1<\/td><td>Timeouts count upstream wait<\/td><td><span class=\"pill P2\">partly fixed (R19)<\/span><\/td><\/tr><tr><td>R2<\/td><td>Pause counts against timeouts<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R3<\/td><td>Node outcomes never finalised<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R4<\/td><td>Restart-from-node broken<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R5<\/td><td>Step loses credits; pause leaks<\/td><td><span class=\"pill P2\">mostly fixed (R24)<\/span><\/td><\/tr><tr><td>R6<\/td><td>Events not ordered<\/td><td><span class=\"pill P2\">fixed; sink can overflow (R18)<\/span><\/td><\/tr><tr><td>R7<\/td><td>Safe stop is a hard cancel<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R8<\/td><td>Fail-fast only<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R9<\/td><td>Control not acked or idempotent<\/td><td><span class=\"pill P2\">mostly fixed (R25)<\/span><\/td><\/tr><tr><td>R10<\/td><td>Nothing durable<\/td><td><span class=\"pill P2\">partly fixed (R22, R25)<\/span><\/td><\/tr><tr><td>R11<\/td><td>No admission control<\/td><td><span class=\"pill okp\">fixed (R23)<\/span><\/td><\/tr><tr><td>R12<\/td><td>Validator gaps<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R13<\/td><td>Disposables not thread-safe<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R14<\/td><td>No definition versioning<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R15<\/td><td>Starts not idempotent<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R16<\/td><td>No metrics<\/td><td><span class=\"pill P2\">defective (R20)<\/span><\/td><\/tr><tr><td>R17<\/td><td>Round-1 leftovers<\/td><td><span class=\"pill P2\">open (R29)<\/span><\/td><\/tr><tr><td>C15<\/td><td>Fire-and-forget execution<\/td><td><span class=\"pill okp\">fixed by ExecutionScheduler<\/span><\/td><\/tr><tr><td>P5<\/td><td>Busy-loop sinks<\/td><td><span class=\"pill P2\">open (R18, R21)<\/span><\/td><\/tr><tr><td>P6<\/td><td>O(N·E) compile scan<\/td><td><span class=\"pill P3\">open (R29)<\/span><\/td><\/tr><tr><td>S7<\/td><td>Logging volume<\/td><td><span class=\"pill P3\">open (R29)<\/span><\/td><\/tr><tr><td>T4, T6<\/td><td>Step/skip E2E; concurrent same-type plugins<\/td><td><span class=\"pill P3\">open (R29)<\/span><\/td><\/tr><\/table><\/div>"}], "findings": [{"id": "R18", "sev": "P1", "area": "Tracking", "pkg": ["service/orchestrator/tracker", "service/control"], "t": "Tracker event sink can overflow and permanently stop all tracking (reproduced)", "where": "DefaultTaskTrackerService.eventSink: multicast onBackpressureBuffer(4096) carries task, workflow AND log events via emitNext(busyLooping 100 ms); ControlBusService.controlSink likewise (256)", "impact": "Overflow terminates the sink with OverflowException; the consumer subscribe() has no error handler, so every later emit returns FAIL_TERMINATED. A chatty plugin can stop status, progress and SSE for all runs until restart, silently.", "fix": "Separate bounded drop-and-count path for log lines; unbounded or caller-backpressured queue for state events; error handler + resubscribe on every long-lived subscribe(); dropped counter and queue-depth gauge.", "eff": "M"}, {"id": "R19", "sev": "P1", "area": "Time", "pkg": ["service/orchestrator/compiler", "plugins"], "t": "A single long step still hits the 30 s timeout; no plugin declares a default", "where": "WorkflowCompiler.getNodeTimeout uses timeoutSeconds or plugin.getDefaultTimeout(); no plugin overrides it; idle clock is touched on input/output only", "impact": "A process or LLM call silent for more than 30 s fails with TIMED_OUT, so round 2's '60 s step succeeds with default config' acceptance is not met. Not reproduced.", "fix": "Plugin-declared defaults (process-executor, llm-call, http-request); per-element processing timeout; heartbeat() on the plugin context; optional node deadline.", "eff": "M"}, {"id": "R20", "sev": "P2", "area": "Observability", "pkg": ["service/orchestrator/stream", "service/orchestrator/strategy", "service/orchestrator/tracker"], "t": "Node metrics and UI 'module' are always 'default'", "where": "NodeStreams and TerminalNodeAssemblerStrategy emit DEFAULT_TASK_ID as the module; recordNode tags metrics with it", "impact": "All nodes share one time series, so per-plugin latency and failure rates cannot be read.", "fix": "Emit the plugin type as the module; tag metrics with plugin type and status only (never nodeId or executionId).", "eff": "S"}, {"id": "R21", "sev": "P2", "area": "Efficiency", "pkg": ["service/orchestrator/stream"], "t": "Activity clock costs about 2–3 µs per message per call site (measured)", "where": "NodeActivity.touch() emits into a replay-latest sink; each emission makes switchMap re-create a Flux.interval; called twice per message per node", "impact": "200k touches took about 410 ms warm. A 20-node chain adds about 80 µs and 40 timer tasks per message, capping throughput near 12k msg/s.", "fix": "touch() = one AtomicLong write; one periodic check per node counting only unpaused ticks.", "eff": "M"}, {"id": "R22", "sev": "P2", "area": "Durability", "pkg": ["service/log", "service/orchestrator"], "t": "JSONL execution log grows without bound and does blocking I/O on the wrong threads", "where": "JsonlExecutionLogStore.append opens/appends/closes per event; trimmed only at startup; called from the subscriber thread and the tracker consumer on Schedulers.parallel()", "impact": "Unbounded disk growth; blocking file I/O on event-loop and shared parallel threads delays all timers; no fsync (undocumented).", "fix": "Single writer thread with batching; rotate or compact by runs/size; document durability.", "eff": "M"}, {"id": "R23", "sev": "P2", "area": "Governance", "pkg": ["service/control/processor"], "t": "Restart paths bypass admission control", "where": "RestartCommandProcessor and RestartFromNodeCommandProcessor subscribe orchestrator.execute/restartFromNode directly; only startWorkflow calls assertCanAccept", "impact": "With on-limit=REJECT a restart is acknowledged, then the new run fails with 'Execution limit reached'.", "fix": "Call assertCanAccept in both processors before creating the new execution.", "eff": "S"}, {"id": "R24", "sev": "P2", "area": "Control", "pkg": ["service/orchestrator/strategy"], "t": "Pause still lets a downstream prefetch of elements through", "where": "applyPassageGate is concatMap(…,1) but the per-message channelInput.concatMap uses prefetch 32", "impact": "Up to 32 already-passed elements are processed after a pause. Not reproduced.", "fix": "concatMap(fn, 1) on the per-message path; document the residual for stream-shaped plugins.", "eff": "S"}, {"id": "R25", "sev": "P2", "area": "Durability", "pkg": ["service/archive", "service/store", "service/control"], "t": "No command audit or id; archive and checkpoints are in memory and count-bounded", "where": "Only RUN_STARTED/FINISHED are logged; ExecutionArchive and InMemoryNodeCheckpointStore are in memory; limits are message counts", "impact": "Commands are not auditable or de-duplicable; runs cannot be restarted after a reboot; large payloads can exhaust memory.", "fix": "Log CONTROL_* events with an optional commandId; bound checkpoints by bytes and spill to the claim-check store; decide whether restart-after-reboot is a goal.", "eff": "L"}, {"id": "R26", "sev": "P2", "area": "Failure", "pkg": ["service/orchestrator/stream"], "t": "Engine retry interacts badly with the idle clock", "where": "NodePolicies.apply retries with backoff; the idle clock sees no activity during attempts or backoff; every exception is retried", "impact": "A 20 s plugin with maxAttempts 3 under a 30 s timeout times out in attempt 2; non-transient errors are retried.", "fix": "Touch the clock on each attempt; add retryOn/noRetryOn; warn when maxBackoffMs exceeds the node timeout.", "eff": "S"}, {"id": "R27", "sev": "P2", "area": "Governance", "pkg": ["service/control/gateway", "service/workflow/store"], "t": "A prepare in flight can re-populate the cache with a stale definition", "where": "prepareShared puts into PreparedWorkflowCache after the definition may have been replaced; invalidation does not clear the preparing map", "impact": "Later starts run the old graph for the cache TTL (10 min). Narrow race, not reproduced.", "fix": "Key the shared prepare and the cache by definition hash, or clear the preparing entry on invalidate.", "eff": "S"}, {"id": "R28", "sev": "P3", "area": "Hardening", "pkg": ["service/control", "service/control/gateway", "service/orchestrator/validator"], "t": "Small hardening items", "where": "Drain timer never disposed; StartIdempotency scans the map per call; hasPort runs before validateConfig; stop mode and definition version not in REST/MCP; no ONE_SUCCESS rule or dead-letter plugin; no attempt/messageId header; scheduler gauges not registered", "impact": "Minor leaks and gaps; retried side effects cannot be de-duplicated by plugins.", "fix": "Dispose the timer on run end; Caffeine expireAfterWrite; expose mode/version; add the missing join rules and header; register gauges.", "eff": "S"}, {"id": "R29", "sev": "P3", "area": "Clean-up", "pkg": ["service/orchestrator", "build"], "t": "Open round-1 items and test gaps", "where": "P5, P6, S7, T4, T6; 11 coverage exceptions (WorkflowOrchestrator branch 0.87); no end-to-end acceptance tests or throughput benchmark", "impact": "Regressions in the round-2 guarantees would not be caught automatically.", "fix": "Turn each acceptance criterion into an integration test; add a throughput test; retire coverage exceptions.", "eff": "M"}], "road": [["8 · Make tracking safe", ["R18", "R21", "R22"], "Tracker cannot die; cheap activity clock; non-blocking log"], ["9 · Limits and tags", ["R20", "R23", "R24", "R26", "R27"], "Right metric tags, restart honours limits, tighter pause, safer retry"], ["10 · Plugin-aware time", ["R19"], "Long steps work with default config"], ["11 · Durability and polish", ["R25", "R28", "R29"], "Audit trail, bounded checkpoints, end-to-end tests"]]};

 '<div class="progress"><span id="progTxt"></span><div class="bar"><i id="progBar" style="width:0"></i></div><button type="button" id="resetBtn">Reset ticks</button></div>'+

/* flow */
if(D.steps&&D.steps.length){
  var NS="http://www.w3.org/2000/svg",g=document.getElementById("pipeBoxes"),S=D.steps,n=S.length,W=112,gap=Math.max(12,Math.floor((980-n*W)/Math.max(1,n-1)));
  var total=n*W+(n-1)*gap;document.getElementById("pipe").setAttribute("viewBox","0 30 "+Math.max(total,300)+" 130");
  S.forEach(function(s,i){var x=i*(W+gap),y=i%2?100:40,grp=document.createElementNS(NS,"g");
    grp.setAttribute("class","box");grp.setAttribute("data-i",i);grp.setAttribute("tabindex","0");grp.setAttribute("role","button");grp.setAttribute("aria-label",s.k);
    grp.innerHTML='<rect x="'+x+'" y="'+y+'" width="'+W+'" height="50" rx="8"/><text x="'+(x+W/2)+'" y="'+(y+22)+'" text-anchor="middle">'+esc(s.k)+'</text><text class="s" x="'+(x+W/2)+'" y="'+(y+39)+'" text-anchor="middle">step '+(i+1)+'</text>';
    g.appendChild(grp);
    if(i<n-1){var nx=(i+1)*(W+gap),ny=(i+1)%2?100:40,p=document.createElementNS(NS,"path");p.setAttribute("class","arrow");
      p.setAttribute("d","M"+(x+W)+","+(y+25)+" C"+(x+W+gap/2)+","+(y+25)+" "+(nx-gap/2)+","+(ny+25)+" "+nx+","+(ny+25));g.insertBefore(p,g.firstChild)}
    grp.addEventListener("click",function(){showStep(i)});
    grp.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();showStep(i)}})});
  var sb=document.getElementById("stepBtns");
  S.forEach(function(s,i){var b=document.createElement("button");b.type="button";b.textContent=(i+1)+". "+s.k;b.setAttribute("role","tab");b.onclick=function(){showStep(i)};sb.appendChild(b)});
  var showStep=function(i){var s=S[i];
    [].forEach.call(g.querySelectorAll(".box"),function(el){el.classList.toggle("on",+el.getAttribute("data-i")===i)});
    [].forEach.call(sb.children,function(b,j){b.setAttribute("aria-pressed",j===i?"true":"false");b.setAttribute("aria-selected",j===i?"true":"false")});
    var r=(s.f||[]).map(byId).filter(Boolean),p0=r.some(function(f){return f.sev==="P0"});
    document.getElementById("stepBody").innerHTML='<h3>'+(i+1)+'. '+esc(s.k)+'</h3><div class="refs mono">'+esc(s.cls||"")+'</div><p>'+s.d+'</p>'+
      (r.length?'<div class="flag'+(p0?" p0":"")+'"><b>Findings here:</b> '+r.map(function(f){return pillFor(f.id)+" "+esc(f.t)}).join(" · ")+'</div>':"")};
  showStep(0);
}
/* packages */
if(D.pkgs&&D.pkgs.length){
  var P=D.pkgs,maxL=Math.max.apply(null,P.map(function(p){return p[2]})),pl=document.getElementById("pkgList");
  P.forEach(function(p,i){var b=document.createElement("button");b.type="button";var c=F.filter(function(f){return (f.pkg||[]).indexOf(p[0])>=0}).length;
    b.innerHTML='<span style="min-width:0;flex:1"><span>'+esc(p[0])+'</span><span class="bar"><i style="width:'+(p[2]/maxL*100)+'%"></i></span></span><span style="margin-left:8px;color:var(--muted)">'+(c?c+"⚑":"")+'</span>';
    b.onclick=function(){showPkg(i)};pl.appendChild(b)});
  var showPkg=function(i){var p=P[i];[].forEach.call(pl.children,function(b,j){b.setAttribute("aria-pressed",j===i?"true":"false")});
    var fs=F.filter(function(f){return (f.pkg||[]).indexOf(p[0])>=0});
    document.getElementById("pkgDetail").innerHTML='<h3 class="mono" style="margin-top:0">'+esc(p[4]||p[0])+'</h3><p class="refs">'+p[1]+' files · '+p[2]+' lines</p><p>'+p[3]+'</p>'+
      (fs.length?'<h3>Findings ('+fs.length+')</h3><ul style="padding-left:18px;margin:0">'+fs.map(function(f){return '<li>'+pillFor(f.id)+' '+esc(f.t)+'</li>'}).join("")+'</ul>':'<p class="refs">No findings.</p>')};
  showPkg(0);
}
/* findings */
var SEVS=["P0","P1","P2","P3"].filter(function(s){return F.some(function(f){return f.sev===s})}),AREAS=[];
F.forEach(function(f){if(AREAS.indexOf(f.area)<0)AREAS.push(f.area)});
var sevOn={},areaOn={},hideDone=false;SEVS.forEach(function(s){sevOn[s]=true;});AREAS.forEach(function(a){areaOn[a]=true});
function chip(c,label,cb){var b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed","true");
  b.onclick=function(){var v=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",v?"true":"false");cb(v);render()};c.appendChild(b)}
SEVS.forEach(function(s){chip(document.getElementById("sevFilters"),s,function(v){sevOn[s]=v})});
AREAS.forEach(function(a){chip(document.getElementById("areaFilters"),a,function(v){areaOn[a]=v})});
var q=document.getElementById("q");q.oninput=render;
var hd=document.getElementById("hideDone");hd.onclick=function(){hideDone=!hideDone;hd.setAttribute("aria-pressed",hideDone?"true":"false");render()};
document.getElementById("expandAll").onclick=function(){var ds=document.querySelectorAll("#findingList details"),o=!(ds[0]&&ds[0].open);[].forEach.call(ds,function(d){d.open=o})};
document.getElementById("resetBtn").onclick=function(){done={};store.set(KEY,done);render()};
function render(){var t=q.value.trim().toLowerCase();
  var list=F.filter(function(f){if(!sevOn[f.sev]||!areaOn[f.area])return false;if(hideDone&&done[f.id])return false;
    if(t&&(f.id+" "+f.t+" "+f.where+" "+f.impact+" "+f.fix+" "+(f.pkg||[]).join(" ")).toLowerCase().indexOf(t)<0)return false;return true});
  var el=document.getElementById("findingList");
  el.innerHTML=list.length?list.map(function(f){return '<details class="finding'+(done[f.id]?" done":"")+'" id="f-'+f.id+'"><summary><span class="id">'+f.id+'</span>'+
    '<input type="checkbox" aria-label="Mark '+f.id+' done" data-id="'+f.id+'"'+(done[f.id]?" checked":"")+'><span class="t">'+esc(f.t)+'</span>'+
    '<span class="meta"><span class="pill '+f.sev+'">'+f.sev+'</span><span class="pill P3">'+esc(f.area)+'</span><span class="pill P3">effort '+f.eff+'</span></span></summary>'+
    '<div class="body"><dl><dt>Where</dt><dd class="mono">'+esc(f.where)+'</dd><dt>Impact</dt><dd>'+esc(f.impact)+'</dd><dt>Fix</dt><dd>'+esc(f.fix)+'</dd>'+
    ((f.pkg||[]).length?'<dt>Area</dt><dd class="mono">'+esc(f.pkg.join(", "))+'</dd>':"")+'</dl></div></details>'}).join("")
    :'<div class="empty">No findings match these filters.</div>';
  [].forEach.call(el.querySelectorAll("input[type=checkbox]"),function(cb){cb.onclick=function(e){e.stopPropagation()};
    cb.onchange=function(){if(cb.checked)done[cb.dataset.id]=true;else delete done[cb.dataset.id];store.set(KEY,done);render()}});
  var k=Object.keys(done).filter(byId).length;
  document.getElementById("progTxt").textContent=k+" / "+F.length+" done";
  document.getElementById("progBar").style.width=(k/F.length*100)+"%";
  document.getElementById("statFindings").textContent=F.length-k;
  document.querySelector("#roadTable tbody").innerHTML=D.road.map(function(r){var d=r[1].filter(function(id){return done[id]}).length;
    return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+r[1].map(pillFor).join(" ")+'</td><td>'+esc(r[2])+'</td><td class="mono">'+d+'/'+r[1].length+'</td></tr>';}).join("");}
render();
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("[data-jump]");if(!a)return;e.preventDefault();
  var id=a.getAttribute("data-jump");SEVS.forEach(function(s){sevOn[s]=true;});AREAS.forEach(function(x){areaOn[x]=true;});hideDone=false;q.value="";
  [].forEach.call(document.querySelectorAll("#sevFilters button,#areaFilters button"),function(b){b.setAttribute("aria-pressed","true");});
  hd.setAttribute("aria-pressed","false");render();var d=document.getElementById("f-"+id);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"});}});
var links=document.querySelectorAll("nav.side a");
[].forEach.call(links,function(l){l.addEventListener("click",function(e){var t=document.querySelector(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)
  [].forEach.call(links,function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});
  [].forEach.call(document.querySelectorAll("main section"),function(s){io.observe(s)});}
})();
</script>
</body>
</html>
