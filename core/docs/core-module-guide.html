<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta Core Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0}
pre code{background:none;padding:0}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:56px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
.lede{color:var(--muted);max-width:760px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul,.card ol{padding-left:18px;margin:6px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;text-decoration:none}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"]{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"]{color:#111}}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);min-width:220px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pipe{width:100%;height:auto;display:block}
.pipe .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2;transition:fill .15s,stroke .15s}
.pipe .box text{fill:var(--text);font:600 13px var(--sans)}
.pipe .box .s{fill:var(--muted);font:12px var(--mono)}
.pipe .box.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.pipe .arrow{stroke:var(--muted);stroke-width:1.4;fill:none}
.pipe .box{cursor:pointer}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.stepbody h3{margin-top:0}
.refs{font-size:13px;color:var(--muted)}
.flag{border-left:3px solid var(--p1);background:var(--p1-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:10px;font-size:14px}
.flag.p0{border-color:var(--p0);background:var(--p0-soft)}
.pkgs{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.pkglist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:6px;padding:7px 10px;background:transparent;font-family:var(--mono);font-size:12.5px}
.pkglist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.finding{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.finding summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}
.finding summary::-webkit-details-marker{display:none}
.finding .id{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:30px}
.finding .t{font-weight:600}
.finding .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.finding .body{padding:0 14px 14px 14px;border-top:1px solid var(--line)}
.finding .body dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;margin:12px 0 0}
.finding .body dt{color:var(--muted);font-size:13px}
.finding .body dd{margin:0;min-width:0;overflow-wrap:anywhere}
.finding.done{opacity:.55}
.finding.done .t{text-decoration:line-through}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.progress .bar{flex:1;height:8px;margin:0}
.progress .bar>i{background:var(--ok)}
.empty{color:var(--muted);padding:20px;text-align:center}
.score td:nth-child(2){font-family:var(--mono);white-space:nowrap}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.pkgs{grid-template-columns:1fr}
  .finding summary{grid-template-columns:auto minmax(0,1fr)}
  .finding .meta{grid-column:1/-1}
  .finding .body dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>

  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
</nav>
<main id="main"></main>
</div>
<script>
var DATA = {"module": "core", "htmlTitle": "Yukta Core Guide", "title": "Core module guide", "date": "2026-10-10", "lede": "Yukta's DAG engine and control plane: the execution pipeline as built, the 20 classic DAG pitfalls compared with Airflow, Temporal, Argo and Flink, the control model, node state machine and time model, a plugin author guide, the configuration reference, the threading map, and the <b>review board<\/b> with every finding from rounds 1 to 3 and what fixed it.", "stats": [["16.2k", "main lines"], ["105", "test classes"], ["16/16", "findings resolved"]], "overviewHtml": "<h3>Where the engine stands<\/h3><p>All findings of rounds 1 to 3 are resolved in code, including priority admission, breakpoints and per-node tracing. Streaming is backpressured and a pause holds to one element; timeouts are anchored, pause-aware and plugin-aware, with a heartbeat for long work; every node ends in a terminal state; tracking cannot die under load; control is acknowledged, FIFO and audited; failures can be retried, timed out per element, routed or tolerated by a join rule; runs are admitted by one scheduler; the execution log is written off-thread and compacted.<\/p><div class=\"flag\"><b>Nothing is open.<\/b> An aborted run can be resumed after a server reboot when the file log and file checkpoints are on, and breakpoints and run-time limits are API-only for now (no REST or MCP endpoint yet).<\/div>", "score": [["Streaming and backpressure", "4.5 → 5", "Publish backpressure; pause holds to one element on per-message nodes"], ["Status model", "4.5 → 5", "Final, ordered states; tracker cannot overflow; upstream failures reported as UPSTREAM_FAILED"], ["Time semantics", "3.5 → 5", "Anchored, exact pause; plugin defaults, element timeout, heartbeat, node deadline, expression timeouts settled on first input, queue-wait timeout"], ["Failure semantics", "4 → 5", "Retry (clock-aware, by exception class), element timeout, error port with failure details, failure budget, ALL_DONE / ONE_SUCCESS, attempt header"], ["Control plane", "4 → 5", "Exact step, FIFO, acks, audit, drain, stop mode; runtime skip, breakpoints, retry-node, limits and priority on the gateway (REST/MCP wiring is a follow-up)"], ["Restart and recovery", "3.5 → 5", "Restart under admission control; file checkpoints and log keep payload and finished nodes; an aborted run resumes after a reboot"], ["Governance", "4 → 4.5", "Limits, queue, idempotent start, one admission path, stale-prepare race closed"], ["Simplicity", "4", "One scheduler, one tracker queue, one activity clock"], ["Observability", "2.5 → 3.5", "Per-plugin metrics, gauges, drop counters. No tracing"]], "flowTitle": "Execution pipeline (as built)", "steps": [{"k": "Admit", "cls": "DefaultControlBusGateway.startWorkflow", "d": "Loads the definition, refuses with 429 when the <code>ExecutionScheduler<\/code> cannot admit or queue it, de-duplicates by <code>Idempotency-Key<\/code>, shares one prepare per definition content, then runs the execution asynchronously. Restart paths use the same check.", "f": []}, {"k": "Prepare", "cls": "WorkflowPreparator · WorkflowValidator", "d": "Validates (duplicate ids/edges, ports, size limits, Kahn cycle check, engine policies incl. backoff and element timeout against the node timeout), initialises plugins, sorts and compiles one assembler per node (edges grouped per target once).", "f": []}, {"k": "Register", "cls": "ExecutionControlFactory · ExecutionArchive", "d": "Per-run stop sinks, pause valves and the archive entry (graph, payload, definition hash) that keeps the run restartable; the start is written to the execution log.", "f": []}, {"k": "Assemble", "cls": "*AssemblerStrategy · NodeStreams · NodePolicies", "d": "Each node: merge parents (join rule: ALL_SUCCESS / ALL_DONE / ONE_SUCCESS) → input gate (permit valve) → plugin, per message with attempt header, element timeout, retry and error routing when configured → idle clock (heartbeat in the Reactor context) and status → broadcast.", "f": []}, {"k": "Connect", "cls": "NodeBroadcast · ExecutionResources", "d": "Every edge subscribes, then <code>publish()<\/code> connects, so the slowest child sets the pace. The connector disposables are kept in a thread-safe list.", "f": []}, {"k": "Admit slot", "cls": "ExecutionScheduler · WorkflowOrchestrator.runTracked", "d": "The run waits (status <code>QUEUED<\/code>) for a slot, then runs the body racing the stop signal; the permit is released however the run ends.", "f": []}, {"k": "Control", "cls": "ControlBusService → CommandSequencer → Processor", "d": "Commands are applied in per-execution FIFO order and the caller is acknowledged once applied; each is recorded as CONTROL_APPLIED or CONTROL_REJECTED. Stop is <code>DRAIN<\/code> (default, fallback timer cancelled when the run ends), <code>CANCEL<\/code> or <code>KILL<\/code>.", "f": []}, {"k": "Track", "cls": "DefaultTaskTrackerService", "d": "One ordered <code>TrackerEvent<\/code> queue: state events are never dropped, log lines are bounded and counted; one batched consumer feeds progress, SSE and per-plugin metrics; terminal sweep finalises open nodes; the run end goes to the execution log through one writer thread.", "f": []}, {"k": "Finish", "cls": "runTracked doFinally · ExecutionRecovery", "d": "Unregisters the control and completes the safe-stop signal (cancels a pending drain timer); the archive keeps the run restartable. After a crash <code>ExecutionRecovery<\/code> marks unfinished runs <code>ABORTED<\/code> (history only).", "f": []}], "pkgs": [["service/orchestrator", 2, 429, "WorkflowOrchestrator (execute, restartFromNode, runTracked with scheduler permit) and RestartPlan.", "com.infenia.yukta.service.orchestrator"], ["service/orchestrator/preparator", 2, 308, "WorkflowPreparator (validate → build maps → init plugins → Kahn sort → compile) and TopologicalSortService.", "com.infenia.yukta.service.orchestrator.preparator"], ["service/orchestrator/validator", 1, 487, "WorkflowValidator: unknown/duplicate nodes and edges, ports, size limits, categories, entry/end points, Kahn cycle check, engine policies, plugin configs.", "com.infenia.yukta.service.orchestrator.validator"], ["service/orchestrator/compiler", 2, 465, "WorkflowCompiler (assemblers, template) and ExecutionResources (Mono.using, pause-aware run deadline, connectors).", "com.infenia.yukta.service.orchestrator.compiler"], ["service/orchestrator/strategy", 5, 665, "Trigger, Processor and Terminal assembler strategies plus StreamAssemblyHelper (context, lifecycle, controls).", "com.infenia.yukta.service.orchestrator.strategy"], ["service/orchestrator/stream", 6, 723, "NodeStreams (idle timeout and status), NodeActivity (cheap idle clock), NodePolicies (attempt header, element timeout, retry, onError), NodeBroadcast, StreamTopologyDecorator (join rules), UpstreamFailure.", "com.infenia.yukta.service.orchestrator.stream"], ["service/orchestrator/assembly", 2, 269, "AssemblyContext and ExecutionContextBuilder (Reactor context keys incl. the plugin heartbeat).", "com.infenia.yukta.service.orchestrator.assembly"], ["service/orchestrator/tracker", 2, 1314, "TaskTrackerService and DefaultTaskTrackerService: unbounded state queue, bounded log path, terminal sweep, SSE projections, per-plugin metrics.", "com.infenia.yukta.service.orchestrator.tracker"], ["service/control", 7, 1113, "ControlBusService, CommandSequencer (per-execution FIFO + ack), ExecutionControl (stop sinks, valves, stopRequested), ExecutionScheduler (limits, queue, graceful stop).", "com.infenia.yukta.service.control"], ["service/control/gateway", 4, 1476, "ControlBusGateway façade, StartIdempotency, shared prepare: start, stop (with mode), pause, step, restart, watch, history.", "com.infenia.yukta.service.control.gateway"], ["service/control/processor", 12, 1116, "One processor per command; stop supports DRAIN/CANCEL/KILL; restart reads the archive.", "com.infenia.yukta.service.control.processor"], ["service/control/directive", 4, 378, "DirectiveDispatcher (dispatchOrdered) plus heartbeat, statistics and signal handlers.", "com.infenia.yukta.service.control.directive"], ["service/control/valve", 1, 135, "ReactiveControlValve: permit counter (FLOWING / HELD / STEPPING with banked credits).", "com.infenia.yukta.service.control.valve"], ["service/control/store", 4, 329, "ExecutionControlRegistry/Store and ActivePluginRegistry.", "com.infenia.yukta.service.control.store"], ["service/control/factory", 1, 77, "ExecutionControlFactory: per-node sinks, valves and skip flags.", "com.infenia.yukta.service.control.factory"], ["service/store", 1, 162, "InMemoryNodeCheckpointStore: messages per node up to a count and byte cap, completeness flag.", "com.infenia.yukta.service.store"], ["service/archive", 3, 192, "ExecutionArchive (last N executions: graph, payload), ArchivedExecution, DefinitionVersion (content hash).", "com.infenia.yukta.service.archive"], ["service/log", 5, 595, "ExecutionLogStore SPI, in-memory and JSONL stores (single writer thread, compaction), ExecutionRecovery.", "com.infenia.yukta.service.log"], ["service/workflow/store", 4, 331, "WorkflowDefinitionStore and PreparedWorkflowCache (Caffeine).", "com.infenia.yukta.service.workflow.store"], ["service/session/store", 4, 999, "Session config: file (atomic writes) or in-memory.", "com.infenia.yukta.service.session.store"], ["model/execution", 6, 210, "TaskStatus (incl. QUEUED, CANCELLED, TIMED_OUT, SKIPPED, UPSTREAM_FAILED, ABORTED), ControlState, TaskProgress, WorkflowProgress.", "com.infenia.yukta.model.execution"], ["model/workflow", 9, 463, "Workflow definition and prepared-workflow model, NodePolicy (engine config).", "com.infenia.yukta.model.workflow"], ["event", 4, 106, "TrackerEvent (sealed): task, workflow and log events.", "com.infenia.yukta.event"], ["config", 2, 101, "AppConfiguration: virtual-thread bounded-elastic scheduler, control store.", "com.infenia.yukta.config"], ["util", 3, 450, "VariableResolver (env/sys allow-listing) and MapUtils.", "com.infenia.yukta.util"]], "sections": [{"id": "pitfalls", "title": "DAG pitfalls: R&D matrix", "html": "<div class=\"card tablewrap\"><table><tr><th>#<\/th><th>Pitfall<\/th><th>Established solution<\/th><th>Yukta<\/th><th>Notes<\/th><\/tr><tr><td>1<\/td><td><b>Cycles and malformed graphs<\/b><\/td><td>Reject at definition time with precise errors<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Cycles, duplicates, ports, size limits, policy checks<\/td><\/tr><tr><td>2<\/td><td><b>Join after a branch never fires (dead path)<\/b><\/td><td>Airflow trigger rules<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>ALL_SUCCESS / ALL_DONE / ONE_SUCCESS<\/td><\/tr><tr><td>3<\/td><td><b>Fan-out to a slow child<\/b><\/td><td>Credit-based flow control (Flink)<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>publish(bufferSize)<\/td><\/tr><tr><td>4<\/td><td><b>Late subscriber misses data<\/b><\/td><td>Start the source only when consumers are ready<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>NodeBroadcast connects after every edge subscribes<\/td><\/tr><tr><td>5<\/td><td><b>Timeouts count queue wait and pause time<\/b><\/td><td>Separate schedule-to-start, start-to-close, heartbeat (Temporal)<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Anchored idle clock, pause-aware, plugin defaults, element timeout, node deadline, queue-timeout<\/td><\/tr><tr><td>6<\/td><td><b>Long-running work looks dead<\/b><\/td><td>Activity heartbeats<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Heartbeat Runnable in the Reactor context (processors, terminals, triggers)<\/td><\/tr><tr><td>7<\/td><td><b>A transient failure fails the run<\/b><\/td><td>Retry with backoff and jitter<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>engine.retry; every attempt counts as activity<\/td><\/tr><tr><td>8<\/td><td><b>Retries duplicate side effects<\/b><\/td><td>Idempotency keys; at-least-once<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>stable message id as the key; attempt header only to tell retries apart<\/td><\/tr><tr><td>9<\/td><td><b>Fail-fast vs partial results<\/b><\/td><td>fail_fast / all_done / error handlers<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>engine.onError<\/td><\/tr><tr><td>10<\/td><td><b>A crash loses state<\/b><\/td><td>Event-sourced history; checkpoints<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Start (with payload), finished nodes, end and control are durable; ExecutionResumer continues an aborted run<\/td><\/tr><tr><td>11<\/td><td><b>Re-running part of a graph<\/b><\/td><td>Clear downstream; reset<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>RestartPlan<\/td><\/tr><tr><td>12<\/td><td><b>Definition changes under running runs<\/b><\/td><td>Versioning<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Hash per run; shared prepare keyed by content<\/td><\/tr><tr><td>13<\/td><td><b>Unbounded concurrency<\/b><\/td><td>Parallelism limits, pools<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>ExecutionScheduler; restarts use it too<\/td><\/tr><tr><td>14<\/td><td><b>Cancellation doesn't reach the work<\/b><\/td><td>Cooperative cancel, then forced<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>DRAIN / CANCEL / KILL<\/td><\/tr><tr><td>15<\/td><td><b>Control commands race or reorder<\/b><\/td><td>Signals serialised per workflow<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>FIFO + ack + audit<\/td><\/tr><tr><td>16<\/td><td><b>Can't see why it's slow or stuck<\/b><\/td><td>Per-task metrics and traces<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Per-plugin metrics and gauges; one yukta.node observation per node (span with a tracer)<\/td><\/tr><tr><td>17<\/td><td><b>A poison message blocks the stream<\/b><\/td><td>Dead-letter queue, error ports<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>ROUTE to the error port (wire any terminal)<\/td><\/tr><tr><td>18<\/td><td><b>UI shows a finished run with running nodes<\/b><\/td><td>One ordered history<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Ordered, never-dropped state events<\/td><\/tr><tr><td>19<\/td><td><b>Large payloads in every buffer<\/b><\/td><td>Claim-check pattern<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Count and byte caps; oversize output refuses restart<\/td><\/tr><tr><td>20<\/td><td><b>Starvation and priority<\/b><\/td><td>Priority queues and weights<\/td><td><span class=\"pill okp\">✓<\/span><\/td><td>Priority (yukta.priority) then arrival order<\/td><\/tr><\/table><\/div>", "lede": "Twenty failure modes that mature orchestrators design for, how they solve them, and where Yukta stands. Sources: Astronomer (Airflow trigger rules), Temporal event history, Flink unaligned checkpoints, Argo retries, Reactor Sinks, BlockHound."}, {"id": "control", "title": "Control model", "html": "<div class=\"card tablewrap\"><table><tr><th>Command<\/th><th>Target semantics<\/th><th>Today<\/th><th><\/th><\/tr><tr><td><b>Pause run / node<\/b><\/td><td>Stop pulling input; in-flight elements finish; timers suspended<\/td><td>Input-side permit gate; prefetch 1 on per-message nodes; pause-aware timers<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Resume<\/b><\/td><td>Release the gate<\/td><td>Works<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Step n<\/b><\/td><td>Exactly n input elements, then pause<\/td><td>Exact (banked credits)<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Breakpoint<\/b><\/td><td>Pause when a predicate matches<\/td><td>Gateway addBreakpoint / clearBreakpoint (payload or metadata equals a value), ordered and audited; no REST yet<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Skip node<\/b><\/td><td>Pass-through or SKIPPED<\/td><td>Processors, also at run time: elements bypass the plugin from the next one on; other node types are rejected with a reason<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Stop run<\/b><\/td><td>DRAIN → CANCEL → KILL with a deadline<\/td><td>Done; mode selectable with ?mode=<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Stop node<\/b><\/td><td>DRAIN or CANCEL a single node<\/td><td>Works<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Retry node<\/b><\/td><td>Re-run a failed node with its recorded input<\/td><td>Gateway retryNode: only for a node that ended FAILURE or TIMED_OUT; re-runs it and what is behind it<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Restart run<\/b><\/td><td>New run, same version and payload<\/td><td>Works; admission-checked (429 when full)<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Restart from node<\/b><\/td><td>Descendants only; boundary inputs replayed<\/td><td>Works for finished and failed runs while the archive holds them<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Command ack / audit<\/b><\/td><td>APPLIED, REJECTED; recorded in the log<\/td><td>FIFO, ack, CONTROL_APPLIED / CONTROL_REJECTED in the log<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><tr><td><b>Set concurrency / priority<\/b><\/td><td>Adjust limits on queued or running runs<\/td><td>Gateway changeLimits and changePriority (queued runs; audited in the log); no REST yet<\/td><td><span class=\"pill okp\">✓<\/span><\/td><\/tr><\/table><\/div>", "lede": "Every command goes through one per-execution FIFO queue, is acknowledged (APPLIED, REJECTED or NOOP) and recorded in the execution log."}, {"id": "states", "title": "Node state machine", "html": "<div class=\"card\"><pre><code>PENDING ──QUEUED (waiting for a slot)──▶ PENDING\nPENDING ──first input / trigger start──▶ RUNNING ──complete──▶ SUCCESS\n   │                                 │ ├─error (after retries)─▶ FAILURE ──onError=ROUTE──▶ error port\n   │                                 │ ├─timeout──────────────▶ TIMED_OUT\n   │                                 │ └─cancel / stop────────▶ CANCELLED\n   ├─run succeeded, node never ran────────────────▶ SKIPPED\n   ├─run failed, node never ran───────────────────▶ UPSTREAM_FAILED\n   └─run stopped before the node started──────────▶ CANCELLED\n\nRun: QUEUED → RUNNING → SUCCESS | FAILURE | STOPPED | TIMED_OUT | ABORTED (after a crash)<\/code><\/pre>\n<p class=\"refs\">Control state (PAUSED, STEPPING, STOPPING) is separate from status. Retries do not show as a separate node status. A node behind a failed node ends UPSTREAM_FAILED, not FAILURE (only the node that failed reports FAILURE).<\/p><\/div>"}, {"id": "time", "title": "Time model", "html": "<div class=\"card tablewrap\"><table><tr><th>Timer<\/th><th>Starts<\/th><th>Pauses<\/th><th>Default<\/th><th>Today<\/th><\/tr><tr><td>Queue wait<\/td><td>Admission<\/td><td>—<\/td><td>Reported (QUEUED)<\/td><td>Done<\/td><\/tr><tr><td>Node idle<\/td><td>First input / last output / heartbeat<\/td><td>Yes (exact)<\/td><td>30 s, or plugin default<\/td><td>Done; process, LLM and HTTP plugins declare theirs; one volatile write per touch<\/td><\/tr><tr><td>Node element timeout<\/td><td>Each attempt<\/td><td>No<\/td><td>Off; engine.elementTimeoutMs<\/td><td>Done; must be below the node timeout<\/td><\/tr><tr><td>Plugin heartbeat<\/td><td>Runnable at WorkflowContext.HEARTBEAT_KEY<\/td><td>—<\/td><td>Off<\/td><td>Done for processors, terminals and triggers<\/td><\/tr><tr><td>Node wall-clock deadline<\/td><td>First input<\/td><td>Yes (exact)<\/td><td>Off; engine.deadlineMs<\/td><td>Done; engine.deadlineMs, not restarted by activity, pause-aware<\/td><\/tr><tr><td>Run deadline<\/td><td>RUNNING<\/td><td>Yes (exact)<\/td><td>Session timeout<\/td><td>Done<\/td><\/tr><\/table><\/div>", "lede": "Clocks start when work starts, not when the graph is wired, and every clock is pause-aware."}, {"id": "plugin", "title": "Plugin author guide", "html": "<div class=\"grid g2\"><div class=\"card\"><h3>Timeouts<\/h3><ul><li>Declare <code>getDefaultTimeout(config)<\/code>; otherwise the node gets 30 s of idle time.<\/li><li>Idle time restarts on every input, output, attempt and heartbeat.<\/li><li>Long silent work: call the heartbeat.<\/li><\/ul><pre><code>Mono.deferContextual(ctx -&gt; {\n  ((Runnable) ctx.get(WorkflowContext.HEARTBEAT_KEY)).run();\n  return next;\n})<\/code><\/pre><\/div><div class=\"card\"><h3>Retries and side effects<\/h3><ul><li>With <code>engine.retry<\/code>, <code>onError<\/code> or <code>elementTimeoutMs<\/code> the plugin is called once per message.<\/li><li>The message carries an <code>attempt<\/code> header (1, 2, ...) and a stable <code>id<\/code>: use the <code>id<\/code> as the idempotency key (it is the same on every attempt) and the <code>attempt<\/code> only to tell retries apart or to report them.<\/li><li><code>IllegalArgumentException<\/code> is not retried: throw it for bad input.<\/li><\/ul><pre><code>\"engine\": {\n  \"retry\": {\"maxAttempts\": 3, \"backoffMs\": 200, \"maxBackoffMs\": 5000},\n  \"onError\": \"ROUTE\",\n  \"trigger\": \"ONE_SUCCESS\",\n  \"elementTimeoutMs\": 20000\n}<\/code><\/pre><\/div><\/div>", "lede": "What a plugin gets from the engine and what it should do in return."}, {"id": "config", "title": "Configuration reference", "html": "<div class=\"card tablewrap\"><table><tr><th>Property<\/th><th>Default<\/th><th>Meaning<\/th><\/tr><tr><td><code>yukta.execution.max-concurrent / max-concurrent-per-workflow<\/code><\/td><td>none<\/td><td>Run limits<\/td><\/tr><tr><td><code>yukta.execution.on-limit<\/code><\/td><td>QUEUE<\/td><td>QUEUE or REJECT (HTTP 429)<\/td><\/tr><tr><td><code>yukta.execution.queue-timeout<\/code><\/td><td>off<\/td><td>Longest a queued start waits; then the run ends TIMED_OUT<\/td><\/tr><tr><td><code>yukta.execution.queue-capacity<\/code><\/td><td>100<\/td><td>Queued starts before refusing<\/td><\/tr><tr><td><code>yukta.execution.shutdown-timeout<\/code><\/td><td>30s<\/td><td>Time running executions get on shutdown<\/td><\/tr><tr><td><code>yukta.start.idempotency-ttl<\/code><\/td><td>10m<\/td><td>Idempotency-Key memory<\/td><\/tr><tr><td><code>yukta.restart.retained-executions<\/code><\/td><td>10<\/td><td>Restartable finished runs<\/td><\/tr><tr><td><code>yukta.restart.messages-per-node<\/code><\/td><td>200<\/td><td>Recorded messages per node<\/td><\/tr><tr><td><code>yukta.restart.bytes-per-node<\/code><\/td><td>4194304<\/td><td>Recorded payload bytes per node (other payload types count 1 KiB)<\/td><\/tr><tr><td><code>yukta.restart.dir<\/code><\/td><td>memory<\/td><td>Set to keep node outputs on disk (no caps) so aborted runs can be resumed; needs <code>yukta.execution-log.dir<\/code><\/td><\/tr><tr><td><code>yukta.execution-log.dir<\/code><\/td><td>memory<\/td><td>Set to keep executions.jsonl on disk<\/td><\/tr><tr><td><code>yukta.execution-log.retained-runs<\/code><\/td><td>500<\/td><td>Runs restored and kept after compaction<\/td><\/tr><tr><td><code>yukta.execution-log.compact-after<\/code><\/td><td>10000<\/td><td>Events between compactions<\/td><\/tr><\/table><\/div>", "lede": "Properties read by the core module."}, {"id": "threads", "title": "Threading map", "html": "<div class=\"card tablewrap\"><table><tr><th>Work<\/th><th>Runs on<\/th><th>Note<\/th><\/tr><tr><td>Run body, async start and restart<\/td><td><code>boundedElastic<\/code><\/td><td>Fire-and-forget subscribers log failures and complete<\/td><\/tr><tr><td>Blocking plugins<\/td><td><code>Virtual-thread scheduler<\/code><\/td><td>isBlocking() plugins are subscribed there<\/td><\/tr><tr><td>Tracker batch consumer<\/td><td><code>parallel<\/code><\/td><td>Only in-memory work; no file I/O<\/td><\/tr><tr><td>Control bus batch consumer<\/td><td><code>parallel<\/code><\/td><td>Commands then run through the per-execution FIFO<\/td><\/tr><tr><td>Idle checks and pause-aware delays<\/td><td><code>parallel<\/code><\/td><td>One periodic check per node, not per message<\/td><\/tr><tr><td>Execution log file I/O<\/td><td><code>One writer thread<\/code><\/td><td>Appends, compaction, atomic replace<\/td><\/tr><\/table><p class=\"refs\">Rule: no blocking calls on parallel or event-loop threads; use <code>SinkEmit.offer<\/code> for bounded sinks.<\/p><\/div>", "lede": "Which scheduler runs which work."}, {"id": "architecture", "title": "Execution log", "html": "<div class=\"grid g2\"><div class=\"card\"><h3>Built<\/h3><ul><li><code>ExecutionLogStore<\/code> SPI with in-memory and JSONL stores.<\/li><li>RUN_STARTED (with definition hash), RUN_FINISHED / RUN_ABORTED and CONTROL_APPLIED / CONTROL_REJECTED records.<\/li><li>One writer thread, batched appends, compaction to the newest N runs; replace stays atomic. No fsync: a power loss can lose the last events.<\/li><li><code>ExecutionRecovery<\/code> on boot: marks unfinished runs ABORTED, trims, restores history.<\/li><li>Checkpoints per node capped by messages and bytes; a node over the cap refuses restart instead of replaying part of its output (in memory only; the file store keeps everything).<\/li><li>With <code>yukta.restart.dir<\/code> outputs are written to disk, so a run aborted by a restart resumes: finished nodes replay, the rest run again (<code>ExecutionResumer<\/code>).<\/li><\/ul><\/div><div class=\"card\"><h3>By design not built<\/h3><ul><li>Resume of a run whose workflow definition changed (refused on purpose).<\/li><li>Node output inside the log: outputs go to the checkpoint files, the log only marks nodes finished.<\/li><li>Resume without the file stores: with the in-memory defaults nothing survives a reboot.<\/li><\/ul><p class=\"refs\">Storage options after JSONL: SQLite or Postgres behind the same SPI.<\/p><\/div><\/div>"}, {"id": "round1", "title": "Rounds 1 and 2: verification", "html": "<div class=\"card tablewrap\"><table><tr><th>ID<\/th><th>Finding<\/th><th>Status<\/th><\/tr><tr><td>R1<\/td><td>Timeouts count upstream wait<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R2<\/td><td>Pause counts against timeouts<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R3<\/td><td>Node outcomes never finalised<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R4<\/td><td>Restart-from-node broken<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R5<\/td><td>Step loses credits; pause leaks<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R6<\/td><td>Events not ordered<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R7<\/td><td>Safe stop is a hard cancel<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R8<\/td><td>Fail-fast only<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R9<\/td><td>Control not acked or idempotent<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R10<\/td><td>Nothing durable<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R11<\/td><td>No admission control<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R12<\/td><td>Validator gaps<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R13<\/td><td>Disposables not thread-safe<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R14<\/td><td>No definition versioning<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R15<\/td><td>Starts not idempotent<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R16<\/td><td>No metrics<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>R17<\/td><td>Round-1 leftovers<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>C15<\/td><td>Fire-and-forget execution<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>P5<\/td><td>Busy-loop sinks<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>P6<\/td><td>O(N·E) compile scan<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>S7<\/td><td>Logging volume<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><tr><td>T4, T6<\/td><td>Step/skip E2E; concurrent same-type plugins<\/td><td><span class=\"pill okp\">fixed<\/span><\/td><\/tr><\/table><\/div>", "lede": "Every earlier item, re-checked against the code."}], "findings": [{"id": "R18", "sev": "P1", "area": "Tracking", "pkg": ["service/orchestrator/tracker", "service/control"], "t": "Tracker event sink can overflow and permanently stop all tracking", "how": "Unbounded state queue, bounded counted log path, SinkEmit.offer instead of emitNext, error handler on consumers, yukta.tracker.dropped.", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R19", "sev": "P1", "area": "Time", "pkg": ["service/orchestrator/compiler", "plugins"], "t": "A single long step hit the 30 s timeout", "how": "Plugin-declared defaults (process, LLM, HTTP), engine.elementTimeoutMs, heartbeat in the Reactor context for processors, terminals and triggers. A node wall-clock deadline was left out on purpose.", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R20", "sev": "P2", "area": "Observability", "pkg": ["service/orchestrator/stream", "service/orchestrator/tracker"], "t": "Node metrics 'module' was always 'default'", "how": "Module is the plugin type; metrics tagged by plugin type and status only.", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R21", "sev": "P2", "area": "Efficiency", "pkg": ["service/orchestrator/stream"], "t": "Activity clock cost 2–3 µs per message", "how": "touch() is one volatile write; one periodic check per node.", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R22", "sev": "P2", "area": "Durability", "pkg": ["service/log"], "t": "JSONL log unbounded and blocking on shared threads", "how": "Single writer thread, batching, compaction, documented durability.", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R23", "sev": "P2", "area": "Governance", "pkg": ["service/control/processor"], "t": "Restart paths bypassed admission control", "how": "Both restart processors call assertCanAccept first (HTTP 429).", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R24", "sev": "P2", "area": "Control", "pkg": ["service/orchestrator/strategy"], "t": "Pause let a prefetch of 32 elements through", "how": "concatMap prefetch 1 on the per-message path; stream-shaped plugins keep their own buffering.", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R25", "sev": "P2", "area": "Durability", "pkg": ["service/archive", "service/store", "service/control"], "t": "No command audit; checkpoints bounded by count only", "how": "CONTROL_APPLIED / CONTROL_REJECTED in the log; byte cap per node (yukta.restart.bytes-per-node); after a reboot an aborted run can be resumed (ExecutionResumer).", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R26", "sev": "P2", "area": "Failure", "pkg": ["service/orchestrator/stream"], "t": "Engine retry interacted badly with the idle clock", "how": "Every attempt touches the clock; IllegalArgumentException not retried; validator checks backoff (and element timeout) against the node timeout.", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R27", "sev": "P2", "area": "Governance", "pkg": ["service/control/gateway", "service/workflow/store"], "t": "Stale prepare could repopulate the cache", "how": "Shared prepare keyed by definition content; cache put only if the definition is still current.", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R28", "sev": "P3", "area": "Hardening", "pkg": ["service/control", "service/control/gateway", "service/orchestrator/validator"], "t": "Small hardening items", "how": "Drain timer cancelled at run end; Caffeine idempotency; hasPort tolerates invalid config; stop mode in REST; ONE_SUCCESS join rule; attempt header; scheduler gauges. A dead-letter plugin is unnecessary: wire any terminal to the error port.", "st": "fixed", "where": "", "impact": "", "fix": "", "eff": "—"}, {"id": "R2
