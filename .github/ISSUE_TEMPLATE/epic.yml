name: Epic
description: A plan or evolution path, delivered through sub-issues. For maintainers
type: Epic
labels: ["epic"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
  - type: input
    id: design
    attributes:
      label: Design doc
      description: Link to the plan under design/, if there is one.
  - type: textarea
    id: phases
    attributes:
      label: Phases
      description: One line per phase. Each becomes a sub-issue; link them under this issue.
