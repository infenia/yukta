name: Dogfood finding
description: A Yukta defect noticed while Yukta ran its own checks (examples/11-dogfood)
type: Bug
labels: ["dogfood", "needs-triage"]
body:
  - type: input
    id: workflow
    attributes:
      label: Workflow and execution
      description: Workflow id and execution id, e.g. quick-check, f44043ba-...
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed vs. expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, or "not reproduced" with what was tried.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - boot
        - build (build logic, Gradle, CI)
        - cli
        - core
        - mcp
        - messaging
        - plugin-api
        - plugins
        - plus
        - persistence-postgres
        - workers
        - ui
        - web
        - documentation
        - not sure
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 (fix now)
        - P1
        - P2
        - P3 (clean-up)
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit the run was on.
