rules:
  dangerous-triggers:
    ignore:
      # Only reads run metadata via the API and posts a comment; never checks out PR code.
      - compliance-summary.yml
      # Signs contributors through the CLA assistant action; never checks out or runs PR code.
      - cla.yml
      # Acts only on scheduled runs of main; reads run metadata and artifacts, never PR code.
      - nightly-report.yml
  archived-uses:
    ignore:
      # The CLA assistant is archived upstream but pinned by SHA; replace it with a maintained
      # CLA action when one is chosen.
      - cla.yml
