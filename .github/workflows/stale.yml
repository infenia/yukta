name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 0 * * *' # 5:30 AM IST (00:00 UTC)
  workflow_dispatch: # Allow manual trigger

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale issues and pull requests
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues configuration
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed in 14 days if no further activity occurs. If this issue is still relevant,
            please comment to keep it open.
          close-issue-message: |
            This issue has been automatically closed because it was stale for 14 days.
            Feel free to reopen if you believe this should remain open.
          close-issue-reason: 'not_planned'

          # Pull request configuration
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity.
            It will be closed in 7 days if no further activity occurs. If you'd like to keep it open,
            please push new commits or leave a comment.
          close-pr-message: |
            This pull request has been automatically closed because it was stale for 7 days.
            Feel free to reopen if you plan to continue working on it.

          # Exemptions
          exempt-issue-labels: 'blocked,pinned,epic'
          exempt-pr-labels: 'blocked,pinned,work-in-progress'

          # Behavior
          operations-per-run: 30
          remove-stale-when-updated: true
          remove-stale-when-commented: true
