name: OpenSSF Scorecard

on:
  # Re-evaluate when branch protection settings change
  branch_protection_rule:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1' # Monday 8:30 AM IST (03:00 UTC)
  workflow_dispatch:

# Every trigger targets the default branch; cancel superseded runs so an
# older overlapping analysis cannot publish stale results last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read           # Checkout (explicit; required if repo goes private)
      security-events: write   # Upload results to code scanning
      id-token: write          # Publish results to the OpenSSF REST API

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
          category: 'OpenSSF Scorecard'
