name: OpenSSF Scorecard

on:
  # Re-evaluate when branch protection settings change
  branch_protection_rule:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1' # Monday 8:30 AM IST (03:00 UTC)
  workflow_dispatch:

# Every trigger targets the default branch; cancel superseded runs so an
# older overlapping analysis cannot publish stale results last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read           # Checkout (explicit; required if repo goes private)
      security-events: write   # Upload results to code scanning
      id-token: write          # Publish results to the OpenSSF REST API

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: results.sarif
          category: 'OpenSSF Scorecard'
