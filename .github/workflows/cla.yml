name: CLA

# Asks outside contributors to sign the Contributor License Agreement (CLA.md or
# CLA-corporate.md) and records the signature on the cla-signatures branch. It never checks out or
# runs code from the pull request.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        startsWith(github.event.comment.body, 'I have read the CLA Document')))
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/infenia/yukta/blob/main/CLA.md
          branch: cla-signatures
          allowlist: arun-infenia,engineering-infenia,claude,*[bot]
