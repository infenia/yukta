name: Perf weekly

# A long soak (4 h) and a load ramp (200 starts/s) against the native binary of main, in a container with fixed
# resources (perf/run.sh). Fails on a stuck run, a lost tracker event, a success rate under 99% or server memory that
# keeps rising after the first 10 minutes (perf/compare.sh). Hosted runners stop a job after 6 hours and their CPU is
# shared, so the soak is capped at 4 h (build time included) and numbers vary between runs: the checks are
# relative ones. Moving it to a self-hosted runner means changing runs-on and raising DURATION.
# The binary is the quick native build (NATIVE_QUICK=1), the one native-smoke.yml builds, not the release build.
on:
  schedule:
    - cron: '47 21 * * 0' # Sunday, 3:17 AM IST on Monday (21:47 UTC)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the native binary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The hosted runner has little free disk; the native build and its builder image need several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Native compile (quick)
        env:
          NATIVE_QUICK: '1'
          NATIVE_HEAP: 12g
        run: release/build-server.sh

      - name: Keep the binary for the runs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-weekly-binary
          path: dist/linux-amd64/yukta
          retention-days: 1
          if-no-files-found: error

  soak:
    name: Soak (4 h)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-weekly-binary
          path: dist/linux-amd64

      - name: Soak (10 starts/s, 4 h)
        env:
          DURATION: 4h
          RATE: '10'
          BINARY: dist/linux-amd64/yukta
        run: |
          chmod +x "$BINARY"
          perf/run.sh soak

      - name: Check the soak for a memory leak
        run: |
          echo '{}' > "$RUNNER_TEMP/none.json"
          perf/compare.sh "$(ls -dt perf/reports/soak/* | head -1)" "$RUNNER_TEMP/none.json"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-weekly-soak-${{ github.run_id }}
          path: |
            perf/reports/*/*/summary.json
            perf/reports/*/*/meta.json
            perf/reports/*/*/container-stats.csv
            perf/reports/*/*/server.log
            perf/reports/*/*/diagnostics.txt
            perf/reports/*/*/k6.log
          if-no-files-found: warn
          retention-days: 30

  load:
    name: Load ramp
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-weekly-binary
          path: dist/linux-amd64

      - name: Load (ramp to 200 starts/s, 10 min hold)
        env:
          RATE: '200'
          HOLD: 10m
          BINARY: dist/linux-amd64/yukta
        run: |
          chmod +x "$BINARY"
          perf/run.sh load

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-weekly-load-${{ github.run_id }}
          path: |
            perf/reports/*/*/summary.json
            perf/reports/*/*/meta.json
            perf/reports/*/*/container-stats.csv
            perf/reports/*/*/server.log
            perf/reports/*/*/diagnostics.txt
            perf/reports/*/*/k6.log
          if-no-files-found: warn
          retention-days: 30
