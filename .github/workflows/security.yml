name: Security Scanning (Trivy)

on:
  # Blocking on main: HIGH/CRITICAL findings fail the run
  push:
    branches: [ "main" ]

  # On PRs, secrets and HIGH/CRITICAL vulnerabilities that have a fix are blocking (an unfixed CVE
  # cannot be acted on, so it only blocks on main); the dependency-review job in ci.yml also gates
  # newly-introduced vulnerable dependencies.
  pull_request:
    branches: [ "main" ]
  merge_group:  # merge queue: required checks must also run on the queued commit
    types: [checks_requested]

  # Weekly rescan of main so newly-published CVEs in unchanged
  # dependencies still surface.
  schedule:
    - cron: '0 1 * * 1' # Monday 6:30 AM IST (01:00 UTC)

  # Manual trigger for on-demand security scans
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TRIVY_SKIP_DIRS: '.git,.gradle,build,**/build,node_modules,**/node_modules,jte-classes'

jobs:
  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write    # For SARIF uploads
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          # Unique key per run so the freshest DB is re-saved; restore-keys
          # picks up the most recent previous DB.
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan for secrets (blocking)
        run: |
          echo "▶ Scanning repository for leaked secrets..."
          trivy fs --scanners secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs "$TRIVY_SKIP_DIRS" .
          echo "✓ No high/critical secrets detected"

      - name: Vulnerability & misconfiguration scan (SARIF)
        run: |
          echo "▶ Scanning dependencies and configs for vulnerabilities..."
          trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 0 \
            --skip-dirs "$TRIVY_SKIP_DIRS" \
            --format sarif --output trivy-results.sarif .

      # SARIF upload needs security-events:write, which fork PRs don't get.
      - name: Upload Trivy SARIF to GitHub Security
        if: |
          always() && hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'Trivy Security Scan'

      - name: Report vulnerabilities (table)
        run: |
          trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 0 \
            --skip-dirs "$TRIVY_SKIP_DIRS" --format table .

      - name: Enforce vulnerability gate
        env:
          # PRs: only findings with a fix; main / schedule / manual: everything
          UNFIXED: ${{ github.event_name == 'pull_request' && '--ignore-unfixed' || '' }}
        run: |
          echo "▶ Enforcing HIGH/CRITICAL vulnerability gate..."
          # shellcheck disable=SC2086 # UNFIXED is a flag or empty, so it is intentionally unquoted
          trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 $UNFIXED \
            --skip-dirs "$TRIVY_SKIP_DIRS" --quiet .
          echo "✓ No high/critical vulnerabilities"

      - name: Generate SBOM (CycloneDX)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          echo "▶ Generating CycloneDX SBOM from the repository..."
          trivy fs --format cyclonedx --output sbom-yukta.cdx.json \
            --skip-dirs "$TRIVY_SKIP_DIRS" .
          echo "✓ SBOM generation complete"

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            trivy-results.sarif
            sbom-yukta.cdx.json
          retention-days: 30
          if-no-files-found: warn
