name: Dependency submission

# No Gradle lock file is committed, so GitHub cannot see transitive dependencies from the build files.
# This submits the resolved graph, which feeds Dependabot alerts and dependency review.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the dependency submission API requires it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper
          dependency-graph: generate-and-submit

      # Resolving every configuration of every project is enough; nothing is compiled.
      - name: Resolve dependencies
        run: ./gradlew dependencies --quiet --console=plain > /dev/null
