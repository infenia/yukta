name: PR project status

# Puts a pull request on the Yukta Roadmap project as In review (In progress while it is a draft)
# instead of the Triage the project's "Item added to project" workflow gives every item. Needs the
# same GitHub App and variables as issue-triage.yml (see .github/PROJECT.md); without them it does
# nothing.
on:
  pull_request:
    types: [opened, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  status:
    name: Set PR status
    if: ${{ !startsWith(github.head_ref, 'release-please--') && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Run the default branch's script, never the PR's.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Mint the project token
        id: app
        if: vars.YUKTA_PROJECT_APP_CLIENT_ID != '' && vars.YUKTA_PROJECT_NUMBER != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUKTA_PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUKTA_PROJECT_APP_KEY }}
          permission-organization-projects: write

      - name: Set the status
        if: steps.app.outputs.token != ''
        env:
          PROJECT_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.YUKTA_PROJECT_NUMBER }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          . .github/scripts/project-lib.sh
          status="In review"
          [ "$IS_DRAFT" = true ] && status="In progress"
          agent=Human
          [[ $PR_BODY == *"Generated with [Claude Code]"* ]] && agent=Claude
          # Agent is the project's single-select field; skipped (not fatal) if it does not exist.
          project_add_item "$PR_URL" Status="$status" Agent="$agent"
