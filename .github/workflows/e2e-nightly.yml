name: E2E nightly

# The end-to-end tiers that need a server process of their own: yukta-cli against the boot jar
# (cli/e2e) and the web UI in a browser against it (ui/e2e/real). Nightly, on demand, and on a pull
# request that carries the `ci:e2e` label. The Java tier (the e2e module) runs in ci.yml on every PR
# that touches a platform module. The e2e-coverage job runs all three against one server with the
# JaCoCo agent (nightly and on demand only) and uploads the integration coverage to Codecov.
# Failures open the nightly tracking issue (nightly-report.yml).
on:
  schedule:
    - cron: '47 1 * * *' # daily, 7:17 AM IST (01:47 UTC)
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli-e2e:
    name: CLI end-to-end
    # a pull request only when it is labelled ci:e2e
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The server jar embeds the UI, so its Gradle build runs pnpm; the CLI tests need Go.
      - uses: ./.github/actions/setup-build
        with:
          go: true
          node: true

      - name: Build the server jar
        run: ./gradlew :boot:bootJar -q --console=plain

      - name: Start the server
        run: release/e2e-server.sh start

      - name: Run the CLI end-to-end tests
        run: |
          YUKTA_E2E_URL=$(release/e2e-server.sh url) \
          YUKTA_E2E_KEY=$(release/e2e-server.sh key) \
          make -C cli e2e

      - name: Stop the server
        if: always()
        run: release/e2e-server.sh stop

      - name: Upload the server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-e2e-server-log
          path: build/e2e-server/server.log
          retention-days: 7

  ui-real:
    name: UI against a real server
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          node: true

      - name: Build the server jar
        run: ./gradlew :boot:bootJar -q --console=plain

      - name: Install Chromium
        run: pnpm --dir ui exec playwright install --with-deps chromium

      - name: Start the server
        run: release/e2e-server.sh start

      - name: Run the real-server Playwright tests
        run: |
          YUKTA_URL=$(release/e2e-server.sh url) \
          YUKTA_API_KEY=$(release/e2e-server.sh key) \
          YUKTA_VIEWER_KEY=$(release/e2e-server.sh viewer-key) \
          pnpm --dir ui test:e2e:real

      - name: Stop the server
        if: always()
        run: release/e2e-server.sh stop

      - name: Upload the report, traces and server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-real-report
          path: |
            ui/playwright-report
            ui/test-results
            build/e2e-server/server.log
          retention-days: 7

  # One server with the JaCoCo agent; the Java suite, the CLI tests and the UI journeys all run against it,
  # and stopping it writes the exec file. Informational: nothing here gates, and the unit floors are unchanged.
  e2e-coverage:
    name: Integration coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          go: true
          node: true

      - name: Build the server jar and the JaCoCo agent
        run: ./gradlew :boot:bootJar :e2e:jacocoAgentJar -q --console=plain

      - name: Install Chromium
        run: pnpm --dir ui exec playwright install --with-deps chromium

      - name: Start the server with the JaCoCo agent
        env:
          JAVA_TOOL_OPTIONS: -javaagent:${{ github.workspace }}/e2e/build/jacoco-agent/jacocoagent.jar=destfile=${{ github.workspace }}/build/e2e-server/jacoco.exec,includes=com.infenia.yukta.*
        run: |
          mkdir -p build/e2e-server
          release/e2e-server.sh start

      - name: Run the three tiers against it
        run: |
          export YUKTA_E2E_URL=$(release/e2e-server.sh url) YUKTA_E2E_KEY=$(release/e2e-server.sh key)
          ./gradlew :e2e:test -Pyukta.e2e.url="$YUKTA_E2E_URL" -Pyukta.e2e.key="$YUKTA_E2E_KEY"
          make -C cli e2e
          YUKTA_URL="$YUKTA_E2E_URL" YUKTA_API_KEY="$YUKTA_E2E_KEY" \
          YUKTA_VIEWER_KEY=$(release/e2e-server.sh viewer-key) \
          pnpm --dir ui test:e2e:real

      # Stopping the server (SIGTERM) is what writes the exec file.
      - name: Stop the server
        if: always()
        run: release/e2e-server.sh stop

      - name: Build the report
        run: ./gradlew :e2e:e2eCoverageReport -q --console=plain

      - name: Upload the coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: e2e/build/reports/jacoco/e2e/jacocoE2e.xml
          flags: e2e
          fail_ci_if_error: false

      - name: Upload the report and the server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-coverage
          path: |
            e2e/build/reports/jacoco/e2e
            build/e2e-server/server.log
          retention-days: 14
