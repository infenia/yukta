name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # 5:30 AM IST (00:00 UTC)

# Cancel superseded runs on PRs only; main / scheduled runs always complete
# so the Gradle cache and dependency graph submissions stay consistent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned OpenGrep version — bump deliberately, keep builds reproducible
  OPENGREP_VERSION: v1.25.0
  # Keep in sync with the trivy version pinned in security.yml
  TRIVY_VERSION: v0.72.0

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 0: Lint workflow files (fail fast on syntax errors)
  # ─────────────────────────────────────────────
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Lint YAML workflows
        run: |
          pip install yamllint
          yamllint .github/workflows/

  # ─────────────────────────────────────────────
  # Job 1: Detect which modules were changed.
  # This is always fast (~5s) and only does file-diff analysis.
  # ─────────────────────────────────────────────
  changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            # Root / build infrastructure — any change here forces a full build
            root:
              - '.github/workflows/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'build-logic/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'lombok.config'
              - 'config/**'

            # Every Gradle module in settings.gradle.kts must be listed here,
            # otherwise a PR touching only that module skips CI entirely.
            core:
              - 'core/**'
            web:
              - 'web/**'
            boot:
              - 'boot/**'
            messaging:
              - 'messaging/**'
            plugin-api:
              - 'plugin-api/**'
            mcp:
              - 'mcp/**'
            ui:
              - 'ui/**'
            cli:
              - 'cli/**'
            api-trigger:
              - 'plugins/triggers/api-trigger/**'
            constant-source:
              - 'plugins/triggers/constant-source/**'
            oneshot-trigger:
              - 'plugins/triggers/oneshot-trigger/**'
            console-terminal:
              - 'plugins/terminals/console-terminal/**'
            internal-core:
              - 'plugins/processors/internal/internal-core/**'
            process-executor:
              - 'plugins/processors/process-executor/**'

  # ─────────────────────────────────────────────
  # Job 2: Build and quality-gate changed modules.
  #
  # On PR:   rebuild & check changed modules plus everything that
  #          depends on them (buildDependents), so cross-module
  #          regressions are caught before merge.
  #          If root files changed (e.g. ci.yml, build-logic) → full build.
  #
  # On push to main / scheduled: full build of every module
  #          (tests + Checkstyle + PMD + SpotBugs + JaCoCo verification).
  # ─────────────────────────────────────────────
  build:
    name: Build & Check
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write          # For test result annotations
    # Skip entirely on PRs where nothing relevant changed
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.root == 'true' ||
      needs.changes.outputs.modules != '[]'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # The cli module shells out to `go` directly (goBuild, goTest,
      # goCoverageCheck, goVet, goLint, ...); without this the runner's
      # ambient/unpinned Go was hitting "go: no such tool covdata" during
      # coverage generation for the cmd/yukta package.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm globally
        run: npm install -g pnpm@10.30.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          # Use the exact Gradle version from your wrapper
          gradle-version: wrapper
          # Dependency graph submission is handled by the dedicated
          # dependency-submission job below, which always resolves the FULL
          # graph. Submitting from here would produce partial snapshots on
          # PRs that only build changed modules.
          dependency-graph: disabled
          cache-provider: enhanced                     # Default, best performance
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Build reporting (very useful)
          build-scan-publish: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache OpenGrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-opengrep
        with:
          path: ~/.opengrep
          key: opengrep-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENGREP_VERSION }}

      - name: Install OpenGrep
        if: steps.cache-opengrep.outputs.cache-hit != 'true'
        run: |
          echo "▶ Installing OpenGrep $OPENGREP_VERSION (not found in cache)..."
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/$OPENGREP_VERSION/install.sh \
            | bash -s -- -v "$OPENGREP_VERSION"
          echo "▶ OpenGrep installation complete"

      - name: Setup OpenGrep PATH
        run: |
          # Add to PATH for this step and export for subsequent steps
          export PATH="$HOME/.opengrep/cli/latest:$HOME/.local/bin:$PATH"

          # Verify opengrep is available
          which opengrep
          opengrep --version

          # Persist PATH for all subsequent steps in this job
          echo "$HOME/.opengrep/cli/latest" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "▶ OpenGrep PATH configured and verified"

      - name: Cache Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-trivy
        with:
          path: ~/.local/bin/trivy
          key: trivy-${{ runner.os }}-${{ runner.arch }}-${{ env.TRIVY_VERSION }}

      - name: Install Trivy
        if: steps.cache-trivy.outputs.cache-hit != 'true'
        run: |
          echo "▶ Installing Trivy $TRIVY_VERSION (not found in cache)..."
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/$TRIVY_VERSION/contrib/install.sh \
            | sh -s -- -b ~/.local/bin "$TRIVY_VERSION"
          echo "▶ Trivy installation complete"

      - name: Verify Trivy is available
        run: |
          # ~/.local/bin was already added to GITHUB_PATH by the OpenGrep PATH step
          which trivy
          trivy --version

      - name: Verify dependency lock files are up-to-date
        run: |
          echo "▶ Verifying lock files match resolved dependencies..."
          # Create a temporary directory to write fresh locks
          mkdir -p /tmp/fresh-locks

          # Resolve dependencies and write locks to temp (this will fail if locks are violated)
          # We use boot:compileAotJava which exercises the full Spring Boot AOT compilation path
          set +e
          ./gradlew boot:compileAotJava --write-locks --no-configuration-cache 2>&1 | tee /tmp/gradle-verify.log
          GRADLE_EXIT=$?
          set -e

          # Check for "which is not part of the dependency lock state" errors
          if grep -q "which is not part of the dependency lock state" /tmp/gradle-verify.log; then
            echo "❌ Lock files are out of date - new dependencies detected."
            echo "Run locally: ./gradlew boot:compileAotJava --write-locks --no-configuration-cache"
            echo "Then commit the updated gradle.lockfile files."
            exit 1
          fi

          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "⚠ Gradle verification failed with exit code $GRADLE_EXIT"
            exit $GRADLE_EXIT
          fi

          echo "✓ Lock files are current and valid"

      - name: Full build (push to main / schedule / root change on PR)
        if: |
          github.event_name != 'pull_request' ||
          needs.changes.outputs.root == 'true'
        run: |
          echo "▶ Running full build (all modules: tests + quality gates)"
          # On PRs, skip Trivy (vulnerability database downloads timeout in CI)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew build jacocoTestReport -x trivy
          else
            ./gradlew build jacocoTestReport
          fi

      - name: Partial build (PR — changed modules and their dependents)
        if: |
          github.event_name == 'pull_request' &&
          needs.changes.outputs.root != 'true' &&
          needs.changes.outputs.modules != '[]'
        env:
          CHANGED_MODULES: ${{ needs.changes.outputs.modules }}
        run: |
          echo "▶ Changed modules: $CHANGED_MODULES"

          TASKS=""

          # Library modules use buildDependents so that everything that
          # consumes them is rebuilt and re-tested too. Leaf modules
          # (nothing depends on them) just run their own build.
          for module in $(echo "$CHANGED_MODULES" | jq -r '.[]'); do
            case $module in
              "core")
                TASKS="$TASKS :core:buildDependents" ;;
              "web")
                TASKS="$TASKS :web:buildDependents" ;;
              "messaging")
                TASKS="$TASKS :messaging:buildDependents" ;;
              "plugin-api")
                TASKS="$TASKS :plugin-api:buildDependents" ;;
              "mcp")
                TASKS="$TASKS :mcp:buildDependents" ;;
              "api-trigger")
                TASKS="$TASKS :plugins:triggers:api-trigger:buildDependents" ;;
              "constant-source")
                TASKS="$TASKS :plugins:triggers:constant-source:buildDependents" ;;
              "oneshot-trigger")
                TASKS="$TASKS :plugins:triggers:oneshot-trigger:buildDependents" ;;
              "console-terminal")
                TASKS="$TASKS :plugins:terminals:console-terminal:buildDependents" ;;
              "internal-core")
                TASKS="$TASKS :plugins:processors:internal:internal-core:buildDependents" ;;
              "process-executor")
                TASKS="$TASKS :plugins:processors:process-executor:buildDependents" ;;
              "boot")
                TASKS="$TASKS :boot:build" ;;
              "cli")
                TASKS="$TASKS :cli:build" ;;
              "ui")
                TASKS="$TASKS :ui:build" ;;
              *)
                echo "❌ Unrecognized module '$module' — add a task mapping for it in this step"
                exit 1 ;;
            esac
          done

          if [ -n "$TASKS" ]; then
            echo "▶ Executing: ./gradlew $TASKS jacocoTestReport -x trivy"
            ./gradlew $TASKS jacocoTestReport -x trivy
          else
            echo "▶ No module tasks matched — nothing to build"
          fi

      # Surface test results directly in the run summary / annotations
      - name: Publish test result summary
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: true
          require_tests: false
          detailed_summary: true

      # Coverage tracking on main (Codecov is free for open source).
      # Requires the CODECOV_TOKEN repository secret; harmless until it is set.
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Upload test and quality reports (helpful for debugging)
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Job 3: Submit the FULL dependency graph (feeds Dependabot alerts and
  # the dependency-review job). Runs resolution only — no compile/test —
  # so it is fast and always complete, even when the build job only
  # rebuilds changed modules. Skipped for fork PRs (read-only token).
  # ─────────────────────────────────────────────
  dependency-submission:
    name: Submit Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # Required to submit the dependency graph
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # cli/build.gradle.kts shells out to `go`; keep the toolchain
      # available in case any of its tasks touch configuration/resolution.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm globally
        run: npm install -g pnpm@10.30.1

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          gradle-version: wrapper
          dependency-graph-continue-on-failure: true   # Don't fail CI if submission fails
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

  # ─────────────────────────────────────────────
  # Job 4: Fail PRs that introduce known-vulnerable dependencies.
  # Compares the dependency graph snapshots submitted by the
  # dependency-submission job. Skipped for fork PRs (they cannot
  # submit snapshots).
  # ─────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    needs: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Review new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Licenses are validated separately by Licensee with a curated allowlist
          license-check: false
          comment-summary-in-pr: on-failure
          # Both base and head snapshots come from the dependency-submission
          # job (always a full graph), so a warning just means the base
          # snapshot hasn't landed yet — retrying briefly is safe.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  # ─────────────────────────────────────────────
  # Job: E2E Tests (Playwright + Screenshots)
  # Only runs when UI module changes
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      contains(fromJson(needs.changes.outputs.modules), 'ui') &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ui
        run: |
          pnpm test:e2e \
            --project=chromium \
            --reporter=html \
            --reporter=json \
            --reporter=junit \
            --reporter=github
        env:
          CI: true
          BASE_URL: http://localhost:5173

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: playwright-videos
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'ui/test-results/results.json';
            if (!fs.existsSync(resultsPath)) {
              return;
            }
            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const stats = results.stats || {
              tests: 0, passes: 0, failures: 0, duration: 0
            };
            const status = stats.failures === 0
              ? '✅ All tests passed'
              : '❌ Tests failed';
            const table = '| Metric | Value |\n'
              + '|--------|-------|\n'
              + `| Total Tests | ${stats.tests || 0} |\n`
              + `| Passed | ${stats.passes || 0} |\n`
              + `| Failed | ${stats.failures || 0} |\n`
              + `| Duration | ${((stats.duration || 0) / 1000).toFixed(1)}s |`;
            const comment = `## ${status}\n\n${table}\n\n<details>\n`
              + '<summary>View detailed report</summary>\n\n'
              + '[Download Playwright Report]'
              + '(https://github.com/${{ github.repository }}/actions/runs/'
              + '${{ github.run_id }})\n\n</details>';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true
