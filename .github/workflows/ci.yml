name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # 5:30 AM IST (00:00 UTC)

# Optional: concurrency to cancel in-progress runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Explicit permissions - required for Dependency Graph
permissions:
  contents: write        # Required to submit dependency graph
  checks: write          # For test results
  pull-requests: write   # Optional but useful

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Detect which modules were changed.
  # This is always fast (~5s) and only does file-diff analysis.
  # ─────────────────────────────────────────────
  changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Root / build infrastructure — any change here forces a full build
            root:
              - '.github/workflows/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'build-logic/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'lombok.config'
              - 'config/**'

            # Application modules (only boot, core, web)
            core:
              - 'core/**'
            web:
              - 'web/**'
            boot:
              - 'boot/**'
            messaging:
              - 'messaging/**'
            cli:
              - 'cli/**'
            oneshot-trigger:
              - 'plugins/triggers/oneshot-trigger/**'
            process-executor:
              - 'plugins/processors/process-executor/**'

  # ─────────────────────────────────────────────
  # Job 2: Build and quality-gate changed modules.
  #
  # On PR:   only rebuild & check modules that changed.
  #          If root files changed (e.g. ci.yml, build-logic) → full build.
  #
  # On push to main / scheduled:  always run the full build to ensure
  #          no cross-module regressions were introduced by the merge.
  # ─────────────────────────────────────────────
  build:
    name: Build & Check
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip entirely on PRs where nothing relevant changed
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.root == 'true' ||
      needs.changes.outputs.modules != '[]'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Use the exact Gradle version from your wrapper
          gradle-version: wrapper
          # Enables submission of dependency graph to GitHub
          # Only submit on main branch to reduce noise
          dependency-graph: generate-submit-and-upload
          dependency-graph-continue-on-failure: true   # Don't fail build if submission fails
          cache-provider: enhanced                     # Default, best performance
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Build reporting (very useful)
          build-scan-publish: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Latest OpenGrep Version
        id: opengrep-version
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/opengrep/opengrep/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "▶ Latest OpenGrep version: $LATEST_VERSION"

      - name: Cache OpenGrep
        uses: actions/cache@v6
        id: cache-opengrep
        with:
          path: ~/.opengrep
          key: opengrep-${{ runner.os }}-${{ runner.arch }}-${{ steps.opengrep-version.outputs.version }}
          restore-keys: |
            opengrep-${{ runner.os }}-${{ runner.arch }}-
            opengrep-${{ runner.os }}-

      - name: Install OpenGrep
        if: steps.cache-opengrep.outputs.cache-hit != 'true'
        run: |
          echo "▶ Installing OpenGrep (not found in cache)..."
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "▶ OpenGrep installation complete"

      - name: Setup OpenGrep PATH
        run: |
          # Add to PATH for this step and export for subsequent steps
          export PATH="$HOME/.opengrep/cli/latest:$HOME/.local/bin:$PATH"

          # Verify opengrep is available
          which opengrep
          opengrep --version

          # Persist PATH for all subsequent steps in this job
          echo "$HOME/.opengrep/cli/latest" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "▶ OpenGrep PATH configured and verified"

      - name: Verify dependency lock files are up-to-date
        run: |
          echo "▶ Verifying lock files match resolved dependencies..."
          # Create a temporary directory to write fresh locks
          mkdir -p /tmp/fresh-locks

          # Resolve dependencies and write locks to temp (this will fail if locks are violated)
          # We use boot:compileAotJava which exercises the full Spring Boot AOT compilation path
          set +e
          ./gradlew boot:compileAotJava --write-locks --no-configuration-cache 2>&1 | tee /tmp/gradle-verify.log
          GRADLE_EXIT=$?
          set -e

          # Check for "which is not part of the dependency lock state" errors
          if grep -q "which is not part of the dependency lock state" /tmp/gradle-verify.log; then
            echo "❌ Lock files are out of date - new dependencies detected."
            echo "Run locally: ./gradlew boot:compileAotJava --write-locks --no-configuration-cache"
            echo "Then commit the updated gradle.lockfile files."
            exit 1
          fi

          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "⚠ Gradle verification failed with exit code $GRADLE_EXIT"
            exit $GRADLE_EXIT
          fi

          echo "✓ Lock files are current and valid"

      - name: Full build (push to main / schedule / root change on PR)
        if: |
          github.event_name != 'pull_request' ||
          needs.changes.outputs.root == 'true'
        run: |
          echo "▶ Running full build"
          ./gradlew boot:build

      - name: Partial build (PR — only changed modules)
        if: |
          github.event_name == 'pull_request' &&
          needs.changes.outputs.root != 'true' &&
          needs.changes.outputs.modules != '[]'
        env:
          CHANGED_MODULES: ${{ needs.changes.outputs.modules }}
        run: |
          echo "▶ Changed modules: $CHANGED_MODULES"

          TASKS=""

          add_module_tasks() {
            local prefix="$1"
            TASKS="$TASKS ${prefix}:build"
          }

          for module in $(echo "$CHANGED_MODULES" | jq -r '.[]'); do
            case $module in
              "core")
                add_module_tasks ":core" ;;
              "web")
                add_module_tasks ":web" ;;
              "boot")
                add_module_tasks ":boot" ;;
              "messaging")
                add_module_tasks ":messaging" ;;
              "cli")
                add_module_tasks ":cli" ;;
              "oneshot-trigger")
                add_module_tasks ":plugins:triggers:oneshot-trigger" ;;
              "process-executor")
                add_module_tasks ":plugins:processors:process-executor" ;;
            esac
          done

          if [ -n "$TASKS" ]; then
            echo "▶ Executing: ./gradlew $TASKS"
            ./gradlew $TASKS
          else
            echo "▶ No module tasks matched — nothing to build"
          fi

      # Upload test reports (helpful for debugging)
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 1
