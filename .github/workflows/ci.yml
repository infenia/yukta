name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # 5:30 AM IST (00:00 UTC)

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Detect which modules were changed.
  # This is always fast (~5s) and only does file-diff analysis.
  # ─────────────────────────────────────────────
  changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Root / build infrastructure — any change here forces a full build
            root:
              - '.github/workflows/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'build-logic/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'lombok.config'
              - 'config/**'

            # Application modules
            plugin-api:
              - 'plugin-api/**'
            core:
              - 'core/**'
            web:
              - 'web/**'
            mcp:
              - 'mcp/**'
            ui:
              - 'ui/**'
            boot:
              - 'boot/**'

            # Plugin modules
            plugins-build-tools-common:
              - 'plugins/build-tools/common/**'
            plugins-build-tools-gradle:
              - 'plugins/build-tools/gradle/**'
            plugins-processors-internal-internal-core:
              - 'plugins/processors/internal/internal-core/**'
            plugins-processors-scripting:
              - 'plugins/processors/scripting/**'
            plugins-triggers-api-trigger:
              - 'plugins/triggers/api-trigger/**'
            plugins-triggers-constant-source:
              - 'plugins/triggers/constant-source/**'
            plugins-terminals-console-terminal:
              - 'plugins/terminals/console-terminal/**'

  # ─────────────────────────────────────────────
  # Job 2: Build and quality-gate changed modules.
  #
  # On PR:   only rebuild & check modules that changed.
  #          If root files changed (e.g. ci.yml, build-logic) → full build.
  #
  # On push to main / scheduled:  always run the full build to ensure
  #          no cross-module regressions were introduced by the merge.
  # ─────────────────────────────────────────────
  build:
    name: Build & Check
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip entirely on PRs where nothing relevant changed
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.root == 'true' ||
      needs.changes.outputs.modules != '[]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Playwright runtime dependencies
        run: npx playwright@1.49.0 install --with-deps chromium

      - name: Full build (push to main / schedule / root change on PR)
        if: |
          github.event_name != 'pull_request' ||
          needs.changes.outputs.root == 'true'
        run: |
          echo "▶ Running full build"
          ./gradlew build spotlessCheck check

      - name: Partial build (PR — only changed modules)
        if: |
          github.event_name == 'pull_request' &&
          needs.changes.outputs.root != 'true' &&
          needs.changes.outputs.modules != '[]'
        env:
          CHANGED_MODULES: ${{ needs.changes.outputs.modules }}
        run: |
          echo "▶ Changed modules: $CHANGED_MODULES"

          TASKS=""

          add_module_tasks() {
            local prefix="$1"
            TASKS="$TASKS ${prefix}:build ${prefix}:spotlessCheck ${prefix}:check"
          }

          for module in $(echo "$CHANGED_MODULES" | jq -r '.[]'); do
            case $module in
              "plugin-api")
                add_module_tasks ":plugin-api" ;;
              "core")
                add_module_tasks ":core" ;;
              "web")
                add_module_tasks ":web" ;;
              "mcp")
                add_module_tasks ":mcp" ;;
              "ui")
                add_module_tasks ":ui" ;;
              "boot")
                add_module_tasks ":boot" ;;
              "plugins-build-tools-common")
                add_module_tasks ":plugins:build-tools:common" ;;
              "plugins-build-tools-gradle")
                add_module_tasks ":plugins:build-tools:gradle" ;;
              "plugins-processors-internal-internal-core")
                add_module_tasks ":plugins:processors:internal:internal-core" ;;
              "plugins-processors-scripting")
                add_module_tasks ":plugins:processors:scripting" ;;
              "plugins-triggers-api-trigger")
                add_module_tasks ":plugins:triggers:api-trigger" ;;
              "plugins-triggers-constant-source")
                add_module_tasks ":plugins:triggers:constant-source" ;;
              "plugins-terminals-console-terminal")
                add_module_tasks ":plugins:terminals:console-terminal" ;;
            esac
          done

          if [ -n "$TASKS" ]; then
            echo "▶ Executing: ./gradlew $TASKS"
            ./gradlew $TASKS
          else
            echo "▶ No module tasks matched — nothing to build"
          fi
