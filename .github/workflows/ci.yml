name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:  # merge queue: required checks must also run on the queued commit
    types: [checks_requested]
  schedule:
    - cron: '0 0 * * *' # 5:30 AM IST (00:00 UTC) — nightly full run; failures open an issue (nightly-report.yml)
  workflow_dispatch:  # manual full run

# Cancel superseded runs on PRs only; main / scheduled runs always complete
# so the Gradle cache and dependency graph submissions stay consistent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned OpenGrep version — bump deliberately, keep builds reproducible
  OPENGREP_VERSION: v1.25.0
  OPENGREP_SHA256: 9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 0: Lint workflow files (fail fast on syntax errors)
  # ─────────────────────────────────────────────
  lint-workflows:
    name: Lint Workflows
    # Release PRs skip PR CI; the merge queue runs the full gate on the queued commit.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint YAML workflows
        run: |
          pip install --require-hashes -r .github/requirements/yamllint.txt
          yamllint .github/workflows/

      - name: Check the labels (labels.yml defines every label the automation applies)
        run: python3 .github/scripts/sync-labels.py --check

      - name: Check the docs site holds product docs only (backlog lives in GitHub issues)
        run: |
          if [ -e docs/internal ] || grep -rnE '\]\(/internal(/|#|\))' docs --include='*.mdx'; then
            echo "::error::docs/internal and links to /internal are gone: file bugs, risks and plans as GitHub issues (.github/PROJECT.md)"
            exit 1
          fi

      - name: Check the module graph (every project() dependency is an included module)
        run: .github/scripts/ci-tasks.sh --check

      - name: Lint shell scripts (shellcheck)
        run: shellcheck -x -P .github/scripts .github/scripts/*.sh

      - name: Test the shard planner
        run: .github/scripts/ci-tasks.test.sh

      - name: Test the project helpers and issue triage
        run: .github/scripts/project-lib.test.sh

      - name: Test the mutation score ratchet
        run: .github/scripts/mutation-ratchet.test.sh
      - name: Test the perf comparison
        run: perf/compare.test.sh

      - name: Test the failure tracking (auto-found)
        run: .github/scripts/auto-found.test.sh

      - name: Lint workflows (actionlint)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Audit workflows (zizmor)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          min-severity: high   # medium findings are mostly pin-comment style; tighten later

  # ─────────────────────────────────────────────
  # Verify gradle-wrapper.jar is an official Gradle release (supply-chain guard)
  # ─────────────────────────────────────────────
  wrapper-validation:
    name: Validate Gradle Wrapper
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  # ─────────────────────────────────────────────
  # Job 1: Decide what to build (.github/scripts/ci-tasks.sh).
  # PR: the changed modules plus every module that depends on them (read from the build files),
  # or everything when a root/build file changed or the PR has the `ci:full` label.
  # main / schedule / dispatch: everything.
  # ─────────────────────────────────────────────
  changes:
    name: Detect Changed Modules
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read    # read the PR's labels for `ci:full`
    outputs:
      full: ${{ steps.plan.outputs.full }}
      shards: ${{ steps.plan.outputs.shards }}
      lint: ${{ steps.plan.outputs.lint }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      # A PR checks out its merge commit: HEAD^1 is the base tip, so HEAD^1..HEAD is exactly the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Plan shards
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          full=true
          if [ "$EVENT" = pull_request ]; then
            # Read labels live (not from the event payload) so "add ci:full, re-run" works.
            labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
            if grep -qx 'ci:full' <<<"$labels"; then
              echo "PR has the ci:full label: full build"
            else
              full=false
            fi
          fi
          if [ "$full" = true ]; then
            plan=$(FULL=true .github/scripts/ci-tasks.sh </dev/null)
          else
            plan=$(git diff --name-only HEAD^1 HEAD | .github/scripts/ci-tasks.sh)
          fi
          jq . <<<"$plan"
          {
            echo "full=$(jq -r .full <<<"$plan")"
            echo "shards=$(jq -c .shards <<<"$plan")"
            echo "lint=$(jq -r .lint <<<"$plan")"
            echo "e2e=$(jq -r .e2e <<<"$plan")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Build plan"
            echo
            echo "- Full build: \`$(jq -r .full <<<"$plan")\`"
            echo "- Changed: $(jq -r '.changed | if length == 0 then "none" else map("`\(.)`") | join(", ") end' <<<"$plan")"
            echo "- Built (changed + dependents): $(jq -r '.affected | length' <<<"$plan") modules"
            echo "- Shards: $(jq -r '[.shards[].name] | if length == 0 then "none" else join(", ") end' <<<"$plan")"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # Job 2a: Fail-fast lint. Checkstyle, PMD and OpenGrep on the affected modules, so a style
  # violation is reported in a few minutes instead of after the full test run.
  # Skipped on full runs: every shard's `build` runs the same checks, and on all 30 modules this
  # job (~7 min) was slower than any shard, so it only lengthened the run.
  # When it does run, ci-tasks.sh makes the shards `-x` these exact tasks, so no check runs twice.
  # ─────────────────────────────────────────────
  lint:
    name: Fast Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.changes.outputs.lint != '' && needs.changes.outputs.full != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # spotlessCheck reaches the ui module, whose Gradle tasks run pnpm.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper
          dependency-graph: disabled
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Install OpenGrep
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/$OPENGREP_VERSION/opengrep_manylinux_x86"
          echo "$OPENGREP_SHA256  $HOME/.local/bin/opengrep" | sha256sum -c -
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/opengrep" --version

      - name: Spotless, Checkstyle, PMD, OpenGrep
        env:
          LINT_TASKS: ${{ needs.changes.outputs.lint }}
        run: |
          set -f
          # shellcheck disable=SC2086 # LINT_TASKS is intentionally word-split
          ./gradlew spotlessCheck $LINT_TASKS --continue

  # ─────────────────────────────────────────────
  # Job 2b: Build and quality-gate, sharded so the shards run in parallel.
  #
  # The `changes` job decides which shards exist (see .github/scripts/ci-tasks.sh):
  #   PR:   changed modules and their dependents; every module when a root file changed.
  #   main / schedule / dispatch: every module (tests + Checkstyle + PMD + SpotBugs + JaCoCo).
  # ─────────────────────────────────────────────
  build:
    name: Build & Check (${{ matrix.name }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write          # For test result annotations
    if: needs.changes.outputs.shards != '[]'
    strategy:
      fail-fast: false       # let every shard report, so one run shows all the failures
      matrix:
        include: ${{ fromJson(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # The cli module shells out to `go` directly (goBuild, goTest, goCoverageCheck, ...); without
      # a pinned Go the runner's ambient one hit "go: no such tool covdata" during coverage.
      #
      # The cache key covers cli/Makefile because it pins golangci-lint, gosec and govulncheck, which
      # `go run` compiles on first use; keying on go.sum alone froze the cache before they were built.
      - name: Set up Go
        if: matrix.name == 'cli'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: |
            cli/go.sum
            cli/Makefile

      # boot depends on the ui module, so the shards that build boot or ui need Node and pnpm.
      - name: Set up Node.js
        if: contains(fromJson('["platform", "ui", "postgres-acceptance", "plus-acceptance", "workers-acceptance"]'), matrix.name)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up pnpm
        if: contains(fromJson('["platform", "ui", "postgres-acceptance", "plus-acceptance", "workers-acceptance"]'), matrix.name)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1

      # Cache the pnpm store (every run was downloading all ~650 packages: "reused 0"). Done with
      # actions/cache rather than setup-node's `cache: pnpm`, whose post step errors when a shard
      # never runs `pnpm install`.
      - name: Locate pnpm store
        id: pnpm-store
        if: contains(fromJson('["platform", "ui", "postgres-acceptance", "plus-acceptance", "workers-acceptance"]'), matrix.name)
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: contains(fromJson('["platform", "ui", "postgres-acceptance", "plus-acceptance", "workers-acceptance"]'), matrix.name)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper
          # Dependency graph submission is handled by the dedicated dependency-submission job,
          # which always resolves the FULL graph.
          dependency-graph: disabled
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Pinned binary + sha256 (bump both together with OPENGREP_VERSION)
      - name: Install OpenGrep
        if: contains(fromJson('["platform", "infra", "plugins"]'), matrix.name)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/$OPENGREP_VERSION/opengrep_manylinux_x86"
          echo "$OPENGREP_SHA256  $HOME/.local/bin/opengrep" | sha256sum -c -
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/opengrep" --version

      # Trivy only gates main / scheduled runs (PRs get the report-only scan in security.yml).
      - name: Install Trivy
        if: matrix.name == 'platform' && github.event_name != 'pull_request'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0 # keep in sync with security.yml
          cache: true

      # Nightly and manual runs retry failed tests (-PretryFlakyTests) so the report can tell flaky
      # tests from broken ones; the build still fails on either. PRs and main never retry.
      - name: Gradle build (${{ matrix.name }})
        env:
          GRADLE_ARGS: ${{ matrix.args }}
          EVENT: ${{ github.event_name }}
        run: |
          set -f   # args contain globs (--tests *Foo); they are for Gradle, not the shell
          case $EVENT in schedule|workflow_dispatch) GRADLE_ARGS="$GRADLE_ARGS -PretryFlakyTests" ;; esac
          echo "▶ ./gradlew $GRADLE_ARGS"
          # shellcheck disable=SC2086 # GRADLE_ARGS is intentionally word-split
          ./gradlew $GRADLE_ARGS

      - name: Publish test result summary
        if: always() && !contains(fromJson('["cli", "ui"]'), matrix.name)
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: true
          require_tests: false
          detailed_summary: true

      # Coverage tracking on main (Codecov is free for open source).
      # Requires the CODECOV_TOKEN repository secret; harmless until it is set.
      - name: Upload coverage to Codecov
        if: |
          matrix.name != 'ui' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: ${{ matrix.name }}

      # Upload test and quality reports (helpful for debugging)
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-reports-${{ matrix.name }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Job 3: Submit the FULL dependency graph (feeds Dependabot alerts and
  # the dependency-review job). Runs resolution only — no compile/test —
  # so it is fast and always complete, even when the build job only
  # rebuilds changed modules. Skipped for fork PRs (read-only token).
  # ─────────────────────────────────────────────
  dependency-submission:
    name: Submit Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # Required to submit the dependency graph
    if: |
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-please--')))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # No Go here: resolving dependencies never runs the cli module's `go` tasks, and a Go cache
      # saved from this job would be restored (and then never refreshed) by the cli shard.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper
          dependency-graph-continue-on-failure: true   # Don't fail CI if submission fails
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

  # ─────────────────────────────────────────────
  # Job 4: Fail PRs that introduce known-vulnerable dependencies.
  # Compares the dependency graph snapshots submitted by the
  # dependency-submission job. Skipped for fork PRs (they cannot
  # submit snapshots).
  # ─────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    needs: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Review new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Licenses are validated separately by Licensee with a curated allowlist
          license-check: false
          comment-summary-in-pr: on-failure
          # Both base and head snapshots come from the dependency-submission
          # job (always a full graph), so a warning just means the base
          # snapshot hasn't landed yet — retrying briefly is safe.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  # ─────────────────────────────────────────────
  # Job: E2E Tests (Playwright + Screenshots)
  # Runs when the UI module changed, and on every full run (main, nightly, dispatch)
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not on push to main: the merge queue just ran the same tree through this job.
    # (The queue runs the full plan, e2e included, on the tree that lands; this holds only while the
    # main-branch ruleset has no bypass actor. Add one and e2e must run on push again.)
    if: needs.changes.outputs.e2e == 'true' && github.event_name != 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      # Reporters (html, json -> test-results/results.json, junit, github) come from playwright.config.ts;
      # passing --reporter here would replace that list and drop the json output path.
      - name: Run E2E tests
        working-directory: ui
        run: pnpm test:e2e --project=chromium
        env:
          CI: true
          BASE_URL: http://localhost:5173

      # Retries make a flaky test exit 0, so surface them instead of letting them pass unnoticed.
      - name: Summarize E2E results
        if: always()
        working-directory: ui
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const file = 'test-results/results.json';
          if (!fs.existsSync(file)) {
            console.log('### E2E: no results.json was produced');
            process.exit(0);
          }
          const { stats } = JSON.parse(fs.readFileSync(file, 'utf8'));
          const secs = ((stats.duration || 0) / 1000).toFixed(1);
          console.log('### E2E results (Playwright)\n');
          console.log('| Passed | Failed | Flaky | Skipped | Duration |');
          console.log('|--------|--------|-------|---------|----------|');
          console.log(`| ${stats.expected} | ${stats.unexpected} | ${stats.flaky} | ${stats.skipped} | ${secs}s |`);
          if (stats.flaky > 0) {
            console.error(`::warning title=Flaky E2E tests::${stats.flaky} test(s) only passed on retry`);
          }
          NODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-videos
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Single required check for branch protection. Jobs skipped by path
  # filtering count as success; failures or cancellations fail the gate.
  # ─────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint-workflows, wrapper-validation, changes, lint, build, dependency-submission, dependency-review, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
