name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # 5:30 AM IST (00:00 UTC)

# Cancel superseded runs on PRs only; main / scheduled runs always complete
# so the Gradle cache and dependency graph submissions stay consistent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned OpenGrep version — bump deliberately, keep builds reproducible
  OPENGREP_VERSION: v1.25.0
  OPENGREP_SHA256: 9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 0: Lint workflow files (fail fast on syntax errors)
  # ─────────────────────────────────────────────
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint YAML workflows
        run: |
          pip install --require-hashes -r .github/requirements/yamllint.txt
          yamllint .github/workflows/

      - name: Check every Gradle module has a CI path filter
        run: |
          status=0
          while read -r mod; do
            path="${mod//://}"
            if ! grep -qF "'$path/**'" .github/workflows/ci.yml; then
              echo "::error::Module '$mod' has no path filter in ci.yml (changes job)"
              status=1
            fi
          done < <(sed -n 's/^include("\(.*\)")/\1/p' settings.gradle.kts)
          exit $status

      - name: Lint workflows (actionlint)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Audit workflows (zizmor)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: high   # medium findings are mostly pin-comment style; tighten later

  # ─────────────────────────────────────────────
  # Verify gradle-wrapper.jar is an official Gradle release (supply-chain guard)
  # ─────────────────────────────────────────────
  wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  # ─────────────────────────────────────────────
  # Job 1: Detect which modules were changed.
  # This is always fast (~5s) and only does file-diff analysis.
  # ─────────────────────────────────────────────
  changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            # Root / build infrastructure — any change here forces a full build
            root:
              - '.github/workflows/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'build-logic/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'lombok.config'
              - 'config/**'

            # Every Gradle module in settings.gradle.kts must be listed here,
            # otherwise a PR touching only that module skips CI entirely.
            core:
              - 'core/**'
            web:
              - 'web/**'
            boot:
              - 'boot/**'
            persistence-postgres:
              - 'persistence-postgres/**'
            workers:
              - 'workers/**'
            messaging:
              - 'messaging/**'
            plugin-api:
              - 'plugin-api/**'
            mcp:
              - 'mcp/**'
            ui:
              - 'ui/**'
            cli:
              - 'cli/**'
            api-trigger:
              - 'plugins/triggers/api-trigger/**'
            constant-source:
              - 'plugins/triggers/constant-source/**'
            console-terminal:
              - 'plugins/terminals/console-terminal/**'
            internal-core:
              - 'plugins/processors/internal/internal-core/**'
            process-executor:
              - 'plugins/processors/process-executor/**'
            http-request:
              - 'plugins/processors/http-request/**'
            llm-call:
              - 'plugins/processors/llm-call/**'
            mcp-tool-call:
              - 'plugins/processors/mcp-tool-call/**'
            session-memory:
              - 'plugins/processors/session-memory/**'
            decision:
              - 'plugins/processors/decision/**'
            script-js:
              - 'plugins/processors/internal/script-js/**'
            rule-supervisor:
              - 'plugins/supervisors/rule-supervisor/**'
            file-io:
              - 'plugins/processors/file-io/**'
            sql-query:
              - 'plugins/processors/sql-query/**'
            schedule-trigger:
              - 'plugins/triggers/schedule-trigger/**'
            notify-terminal:
              - 'plugins/terminals/notify-terminal/**'
            rule-control-plane:
              - 'plugins/control-planes/rule-control-plane/**'
            model-control-plane:
              - 'plugins/control-planes/model-control-plane/**'
            rules-first-control-plane:
              - 'plugins/control-planes/rules-first-control-plane/**'

  # ─────────────────────────────────────────────
  # Job 2: Build and quality-gate changed modules.
  #
  # On PR:   rebuild & check changed modules plus everything that
  #          depends on them (buildDependents), so cross-module
  #          regressions are caught before merge.
  #          If root files changed (e.g. ci.yml, build-logic) → full build.
  #
  # On push to main / scheduled: full build of every module
  #          (tests + Checkstyle + PMD + SpotBugs + JaCoCo verification).
  # ─────────────────────────────────────────────
  build:
    name: Build & Check
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write          # For test result annotations
    # Skip entirely on PRs where nothing relevant changed
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.root == 'true' ||
      needs.changes.outputs.modules != '[]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      # The cli module shells out to `go` directly (goBuild, goTest,
      # goCoverageCheck, goVet, goLint, ...); without this the runner's
      # ambient/unpinned Go was hitting "go: no such tool covdata" during
      # coverage generation for the cmd/yukta package.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # Use the exact Gradle version from your wrapper
          gradle-version: wrapper
          # Dependency graph submission is handled by the dedicated
          # dependency-submission job below, which always resolves the FULL
          # graph. Submitting from here would produce partial snapshots on
          # PRs that only build changed modules.
          dependency-graph: disabled
          cache-provider: enhanced                     # Default, best performance
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Build reporting (very useful)
          build-scan-publish: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Pinned binary + sha256 (bump both together with OPENGREP_VERSION)
      - name: Install OpenGrep
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/$OPENGREP_VERSION/opengrep_manylinux_x86"
          echo "$OPENGREP_SHA256  $HOME/.local/bin/opengrep" | sha256sum -c -
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/opengrep" --version

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0 # keep in sync with security.yml
          cache: true

      - name: Verify dependency lock files are up-to-date
        run: |
          # Lockfiles are only enforced once they are committed; with none tracked there is nothing to drift.
          if [ -z "$(git ls-files '*gradle.lockfile')" ]; then
            echo "No gradle.lockfile files are committed; skipping lock verification"
            exit 0
          fi
          echo "▶ Verifying lock files match resolved dependencies..."
          ./gradlew boot:compileAotJava --write-locks --no-configuration-cache
          # git status (not git diff) so a new module's uncommitted lockfile is caught too
          if [ -n "$(git status --porcelain -- '**/gradle.lockfile' 'gradle.lockfile')" ]; then
            git status --porcelain -- '**/gradle.lockfile' 'gradle.lockfile'
            echo "❌ Lock files are out of date."
            echo "Run locally: ./gradlew boot:compileAotJava --write-locks --no-configuration-cache"
            echo "Then commit the updated gradle.lockfile files."
            exit 1
          fi

          echo "✓ Lock files are current and valid"

      - name: Full build (push to main / schedule / root change on PR)
        if: |
          github.event_name != 'pull_request' ||
          needs.changes.outputs.root == 'true'
        run: |
          echo "▶ Running full build (all modules: tests + quality gates)"
          # On PRs, skip Trivy (vulnerability database downloads timeout in CI)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew build jacocoTestReport -x trivy
          else
            ./gradlew build jacocoTestReport
          fi

      - name: Partial build (PR — changed modules and their dependents)
        if: |
          github.event_name == 'pull_request' &&
          needs.changes.outputs.root != 'true' &&
          needs.changes.outputs.modules != '[]'
        env:
          CHANGED_MODULES: ${{ needs.changes.outputs.modules }}
        run: |
          echo "▶ Changed modules: $CHANGED_MODULES"

          TASKS=""

          # Library modules use buildDependents so that everything that
          # consumes them is rebuilt and re-tested too. Leaf modules
          # (nothing depends on them) just run their own build.
          for module in $(echo "$CHANGED_MODULES" | jq -r '.[]'); do
            case $module in
              "core")
                TASKS="$TASKS :core:buildDependents" ;;
              "web")
                TASKS="$TASKS :web:buildDependents" ;;
              "messaging")
                TASKS="$TASKS :messaging:buildDependents" ;;
              "plugin-api")
                TASKS="$TASKS :plugin-api:buildDependents" ;;
              "mcp")
                TASKS="$TASKS :mcp:buildDependents" ;;
              "api-trigger")
                TASKS="$TASKS :plugins:triggers:api-trigger:buildDependents" ;;
              "constant-source")
                TASKS="$TASKS :plugins:triggers:constant-source:buildDependents" ;;
              "console-terminal")
                TASKS="$TASKS :plugins:terminals:console-terminal:buildDependents" ;;
              "internal-core")
                TASKS="$TASKS :plugins:processors:internal:internal-core:buildDependents" ;;
              "process-executor")
                TASKS="$TASKS :plugins:processors:process-executor:buildDependents" ;;
              "http-request")
                TASKS="$TASKS :plugins:processors:http-request:buildDependents" ;;
              "llm-call")
                TASKS="$TASKS :plugins:processors:llm-call:buildDependents" ;;
              "mcp-tool-call")
                TASKS="$TASKS :plugins:processors:mcp-tool-call:buildDependents" ;;
              "session-memory")
                TASKS="$TASKS :plugins:processors:session-memory:buildDependents" ;;
              "decision")
                TASKS="$TASKS :plugins:processors:decision:buildDependents" ;;
              "script-js")
                TASKS="$TASKS :plugins:processors:internal:script-js:buildDependents" ;;
              "rule-supervisor")
                TASKS="$TASKS :plugins:supervisors:rule-supervisor:buildDependents" ;;
              "file-io")
                TASKS="$TASKS :plugins:processors:file-io:buildDependents" ;;
              "sql-query")
                TASKS="$TASKS :plugins:processors:sql-query:buildDependents" ;;
              "schedule-trigger")
                TASKS="$TASKS :plugins:triggers:schedule-trigger:buildDependents" ;;
              "notify-terminal")
                TASKS="$TASKS :plugins:terminals:notify-terminal:buildDependents" ;;
              "rule-control-plane")
                TASKS="$TASKS :plugins:control-planes:rule-control-plane:buildDependents" ;;
              "model-control-plane")
                TASKS="$TASKS :plugins:control-planes:model-control-plane:buildDependents" ;;
              "rules-first-control-plane")
                TASKS="$TASKS :plugins:control-planes:rules-first-control-plane:buildDependents" ;;
              "boot")
                TASKS="$TASKS :boot:build" ;;
              "cli")
                TASKS="$TASKS :cli:build" ;;
              "ui")
                TASKS="$TASKS :ui:build" ;;
              *)
                echo "❌ Unrecognized module '$module' — add a task mapping for it in this step"
                exit 1 ;;
            esac
          done

          if [ -n "$TASKS" ]; then
            echo "▶ Executing: ./gradlew $TASKS jacocoTestReport -x trivy"
            # shellcheck disable=SC2086 # TASKS is intentionally word-split
            ./gradlew $TASKS jacocoTestReport -x trivy
          else
            echo "▶ No module tasks matched — nothing to build"
          fi

      # Surface test results directly in the run summary / annotations
      # The default build runs without the PostgreSQL module; this runs the full application against a
      # real PostgreSQL (Testcontainers) with it, so the schema, the R2DBC stores and the Flyway
      # migrations are exercised through the application, not only module by module.
      - name: PostgreSQL acceptance test
        if: |
          github.event_name != 'pull_request' ||
          needs.changes.outputs.root == 'true' ||
          contains(needs.changes.outputs.modules, 'persistence-postgres') ||
          contains(needs.changes.outputs.modules, 'boot')
        run: ./gradlew -Pyukta.persistence=postgres :boot:test --tests '*PostgresPersistenceAcceptanceTest'

      - name: Publish test result summary
        if: always()
        uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3 # v6.6.0
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: true
          require_tests: false
          detailed_summary: true

      # Coverage tracking on main (Codecov is free for open source).
      # Requires the CODECOV_TOKEN repository secret; harmless until it is set.
      - name: Upload coverage to Codecov
        if: |
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Upload test and quality reports (helpful for debugging)
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Job 3: Submit the FULL dependency graph (feeds Dependabot alerts and
  # the dependency-review job). Runs resolution only — no compile/test —
  # so it is fast and always complete, even when the build job only
  # rebuilds changed modules. Skipped for fork PRs (read-only token).
  # ─────────────────────────────────────────────
  dependency-submission:
    name: Submit Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # Required to submit the dependency graph
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      # cli/build.gradle.kts shells out to `go`; keep the toolchain
      # available in case any of its tasks touch configuration/resolution.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper
          dependency-graph-continue-on-failure: true   # Don't fail CI if submission fails
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

  # ─────────────────────────────────────────────
  # Job 4: Fail PRs that introduce known-vulnerable dependencies.
  # Compares the dependency graph snapshots submitted by the
  # dependency-submission job. Skipped for fork PRs (they cannot
  # submit snapshots).
  # ─────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    needs: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Review new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Licenses are validated separately by Licensee with a curated allowlist
          license-check: false
          comment-summary-in-pr: on-failure
          # Both base and head snapshots come from the dependency-submission
          # job (always a full graph), so a warning just means the base
          # snapshot hasn't landed yet — retrying briefly is safe.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  # ─────────────────────────────────────────────
  # Job: E2E Tests (Playwright + Screenshots)
  # Only runs when UI module changes
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      contains(fromJson(needs.changes.outputs.modules), 'ui') &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ui
        run: |
          pnpm test:e2e \
            --project=chromium \
            --reporter=html \
            --reporter=json \
            --reporter=junit \
            --reporter=github
        env:
          CI: true
          BASE_URL: http://localhost:5173

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-videos
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'ui/test-results/results.json';
            if (!fs.existsSync(resultsPath)) {
              return;
            }
            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const stats = results.stats || {
              tests: 0, passes: 0, failures: 0, duration: 0
            };
            const status = stats.failures === 0
              ? '✅ All tests passed'
              : '❌ Tests failed';
            const table = '| Metric | Value |\n'
              + '|--------|-------|\n'
              + `| Total Tests | ${stats.tests || 0} |\n`
              + `| Passed | ${stats.passes || 0} |\n`
              + `| Failed | ${stats.failures || 0} |\n`
              + `| Duration | ${((stats.duration || 0) / 1000).toFixed(1)}s |`;
            const comment = `## ${status}\n\n${table}\n\n<details>\n`
              + '<summary>View detailed report</summary>\n\n'
              + '[Download Playwright Report]'
              + '(https://github.com/${{ github.repository }}/actions/runs/'
              + '${{ github.run_id }})\n\n</details>';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Single required check for branch protection. Jobs skipped by path
  # filtering count as success; failures or cancellations fail the gate.
  # ─────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint-workflows, wrapper-validation, changes, build, dependency-submission, dependency-review, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
