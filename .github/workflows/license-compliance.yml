name: License Compliance Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  reuse-compliance:
    name: REUSE License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v6

  gradle-license-validation:
    name: Dependency License Validation (Licensee)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate dependency licenses (Licensee)
        id: validate
        run: |
          echo "▶ Validating all dependency licenses against Apache-2.0 policy..."
          ./gradlew licensee
          echo "✓ All dependencies passed license validation"

      - name: Upload Licensee reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licensee-reports
          path: |
            **/build/reports/licensee/
          retention-days: 30
          if-no-files-found: warn

      - name: Comment license validation result (if PR)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const licenseeOutcome = '${{ steps.validate.outcome }}';
            const statusIcon = licenseeOutcome === 'success' ? '✅' : '❌';

            const comment = `## 📋 License Compliance Report

            ### Checks Performed:
            - ${statusIcon} Licensee Dependency Validation (Apache-2.0 compatible licenses)
            - ℹ️ REUSE License Headers (separate job)
            - ℹ️ Trivy License Scanning (separate job)

            ### Details:
            ${licenseeOutcome === 'success'
              ? 'All dependency licenses are validated to be Apache 2.0 compatible using **Licensee**.\n\nAllowed license families:\n- Apache-2.0 and compatible (MIT, BSD variants, ISC)\n- Java ecosystem (EPL, CDDL, GPL with classpath exception)\n- Other permissive licenses (MPL-2.0, WTFPL)'
              : '⚠️ License validation failed. Check the workflow run for details.'}

            For detailed reports, see the artifacts attached to this workflow run.

            ---
            *Generated by License Compliance Bot*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  trivy-license-scan:
    name: Trivy License Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy license scanning
        # Using master for latest stable; check https://github.com/aquasecurity/trivy-action/releases for updates
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-license-results.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'
          skip-dirs: 'node_modules,build,.gradle,.git'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-license-results.sarif') != ''
        with:
          sarif_file: 'trivy-license-results.sarif'
          category: 'Trivy License Scan'

      - name: Install Trivy
        continue-on-error: true
        run: |
          echo "▶ Installing Trivy..."
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Generate Trivy license report (human-readable)
        continue-on-error: true
        run: |
          echo "▶ Generating Trivy license report..."
          trivy fs --format table --severity MEDIUM,HIGH,CRITICAL . 2>&1 | grep -i license || echo "No license issues found"
          echo "✓ Trivy license scan complete"
