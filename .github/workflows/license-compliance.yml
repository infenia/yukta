name: License Compliance Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reuse-compliance:
    name: REUSE License Headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

  gradle-license-validation:
    name: Dependency License Validation (Licensee)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          gradle-version: wrapper
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate dependency licenses (Licensee)
        id: validate
        run: |
          echo "▶ Validating all dependency licenses against Apache-2.0 policy..."
          ./gradlew licensee
          echo "✓ All dependencies passed license validation"

      - name: Publish result to job summary
        if: always()
        run: |
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            {
              echo "### ✅ Dependency licenses validated (Licensee)"
              echo ""
              echo "All dependency licenses are Apache-2.0 compatible."
              echo ""
              echo "Allowed license families: Apache-2.0 and compatible (MIT, BSD"
              echo "variants, ISC), Java ecosystem (EPL, CDDL, GPL with classpath"
              echo "exception), other permissive licenses (MPL-2.0, WTFPL)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ Dependency license validation failed"
              echo ""
              echo "See the \`licensee-reports\` artifact on this run for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Licensee reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licensee-reports
          path: |
            **/build/reports/licensee/
          retention-days: 30
          if-no-files-found: warn

  trivy-license-scan:
    name: Trivy License Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Trivy license scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'sarif'
          output: 'trivy-license-results.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'
          skip-dirs: 'node_modules,build,.gradle,.git'

      # SARIF upload needs security-events:write, which fork PRs don't get.
      - name: Upload Trivy SARIF to GitHub Security
        if: |
          always() && hashFiles('trivy-license-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: 'trivy-license-results.sarif'
          category: 'Trivy License Scan'
