name: Native smoke

# Builds the native server with -Ob (NATIVE_QUICK=1) and runs the Quickstart workflow against it
# (release/smoke-test.sh) and then the e2e suite (:e2e:test against the binary), so missing reflection
# or resource entries show up between releases and not when the release build fails. The real release
# build (release.yml) runs the same checks, and release/console-smoke.sh checks the daemon commands and
# the console.
on:
  schedule:
    - cron: '43 2 * * *' # daily, 8:13 AM IST (02:43 UTC)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Native binary runs the Quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The hosted runner has little free disk; the native build and its builder image need several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The 12g builder heap on a 16 GB runner leaves little for the OS and the linker; swap turns an
      # OOM kill late in the build into a slower step.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/extra.swap
          sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap
          sudo swapon /mnt/extra.swap
          swapon --show
          free -m

      - name: Native compile (quick)
        env:
          NATIVE_QUICK: '1'
          NATIVE_HEAP: 12g
        run: release/build-server.sh

      # JDK, Gradle, Node and pnpm. The e2e suite is Gradle; boot (a dependency of the e2e module) builds the
      # UI, and the UI test drives a real browser against the native server (Chromium, below).
      - uses: ./.github/actions/setup-build

      - name: Install the UI test dependencies
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      # The examples run commands (sh, echo) and a Python pager stand-in, which a default server refuses.
      # The server has an ADMIN key, which the e2e suite needs, and a high /api rate limit (a system
      # property: the suite sends more than the 1200 requests a minute one key may).
      - name: Smoke test, e2e suite, examples and UI
        env:
          YUKTA_PLUGINS_ENABLED: all
          YUKTA_PROCESS_ALLOWED_COMMANDS: sh,echo,shuf,python3
          YUKTA_API_KEYS_0_NAME: e2e
          YUKTA_API_KEYS_0_KEY: native-smoke-key
          YUKTA_API_KEYS_0_ROLE: ADMIN
          YUKTA_API_KEYS_0_SESSIONS_0: '*'
          # example 16 runs two scripted agents from its harness presets
          YUKTA_AI_PRESETS_DIR: ${{ github.workspace }}/examples/3-paid-tools/16-agent-console/agent-harnesses
        run: |
          dist/linux-amd64/yukta -Dyukta.rate-limit-per-minute=100000 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          release/smoke-test.sh http://127.0.0.1:9858 native-smoke-key
          ./gradlew :e2e:test -Pyukta.e2e.url=http://127.0.0.1:9858 -Pyukta.e2e.key=native-smoke-key
          release/examples-smoke.sh http://127.0.0.1:9858 native-smoke-key
          YUKTA_API_KEY=native-smoke-key release/ui-smoke.sh http://127.0.0.1:9858

      - name: Upload the e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-smoke-e2e-report
          path: e2e/build/reports/tests/test
          retention-days: 7

      # Run modes of the same binary: daemon commands and the console on a pseudo-terminal. Here and
      # not on pull requests, because it needs the native build above.
      - name: Run modes (daemon and console)
        run: release/console-smoke.sh dist/linux-amd64/yukta
