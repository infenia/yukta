name: Compliance & Quality Summary

# Runs after each monitored workflow completes for a PR commit and
# maintains a single sticky summary comment on the PR (updated in place,
# never duplicated).
on:
  workflow_run:
    workflows:
      - "Java CI with Gradle"
      - "License Compliance Check"
      - "Security Scanning (Trivy)"
    types: [completed]

# The monitored workflows finish close together, so several aggregator
# runs can race on the same PR and duplicate the sticky comment.
# Serialize per PR branch; the newest run regenerates the full table,
# so superseded runs are safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  aggregate-report:
    name: Generate Unified Compliance Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only summarize runs that belong to a pull request
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Post or update unified summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const MARKER = '<!-- compliance-quality-summary -->';
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;

            // Resolve the PR this run belongs to (payload is empty for
            // some fork scenarios — fall back to matching the head SHA).
            let prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              const match = prs.data.find(p => p.head.sha === headSha);
              if (match) prNumber = match.number;
            }
            if (!prNumber) {
              core.info(`No open PR found for ${headSha}; skipping summary.`);
              return;
            }

            // Job names come from the PR's workflow files, so treat them as
            // untrusted: escape Markdown link/table syntax and strip newlines.
            const escapeMd = (s) => String(s)
              .replace(/\\/g, '\\\\')
              .replace(/[[\]|]/g, '\\$&')
              .replace(/[\r\n]+/g, ' ');

            const statusIcon = (s) => ({
              success: '✅',
              failure: '❌',
              cancelled: '🚫',
              skipped: '⏭️',
              neutral: '⚠️'
            }[s] ?? '⏳');

            const workflows = [
              { id: 'ci.yml', title: 'Build & Quality Gates' },
              { id: 'license-compliance.yml', title: 'License Compliance' },
              { id: 'security.yml', title: 'Security Scanning' }
            ];

            const rows = [];
            for (const wf of workflows) {
              let latest;
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf.id,
                  head_sha: headSha,
                  per_page: 1
                });
                latest = runs.data.workflow_runs[0];
              } catch (error) {
                core.warning(`Could not list runs for ${wf.id}: ${error.message}`);
              }
              if (!latest) {
                rows.push(`| ${wf.title} | _pending_ | ⏳ PENDING |`);
                continue;
              }
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: latest.id,
                per_page: 100
              });
              for (const job of jobs.data.jobs) {
                const conclusion = job.conclusion ?? 'in_progress';
                rows.push(
                  `| ${wf.title} | [${escapeMd(job.name)}](${job.html_url}) | ` +
                  `${statusIcon(conclusion)} ${conclusion.toUpperCase().replace('_', ' ')} |`
                );
              }
            }

            const body = [
              MARKER,
              '## 📋 Compliance & Quality Summary',
              '',
              `_Last updated for commit \`${headSha.substring(0, 7)}\`_`,
              '',
              '| Workflow | Job | Status |',
              '|----------|-----|--------|',
              ...rows,
              '',
              '---',
              '*Generated by the Compliance & Quality Summary workflow.',
              'Detailed reports are attached as artifacts on each linked run.*'
            ].join('\n');

            // Sticky comment: update the existing summary if present
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated summary comment ${existing.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
              core.info(`Created summary comment on PR #${prNumber}`);
            }
