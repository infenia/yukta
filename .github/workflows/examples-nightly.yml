name: Examples nightly

# Starts the server from this commit and runs every example (examples/run-all.sh) against it, so a
# merge that breaks an example (and the docs that quote it) is found the same night. Examples that
# need something the runner lacks, such as an LLM endpoint, print SKIP and do not fail the run.
# Failures open the nightly tracking issue (nightly-report.yml).
on:
  schedule:
    - cron: '23 1 * * *' # daily, 6:53 AM IST (01:23 UTC)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  examples:
    name: Run the examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The server jar embeds the UI, so its Gradle build runs pnpm.
      - uses: ./.github/actions/setup-build

      - name: Build the server jar
        run: ./gradlew :boot:bootJar -q --console=plain

      # Loopback only, on a free port with a random ADMIN key. The examples run commands
      # (PROCESS_EXECUTOR), which a default server refuses, so this throwaway server allows any
      # executable.
      - name: Start the server
        env:
          YUKTA_E2E_ALLOW_ANY: 'true'
        run: release/e2e-server.sh start

      - name: Run the examples
        run: |
          YUKTA_URL=$(release/e2e-server.sh url) \
          YUKTA_API_KEY=$(release/e2e-server.sh key) \
          examples/run-all.sh

      - name: Stop the server
        if: always()
        run: release/e2e-server.sh stop

      - name: Upload the server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: examples-server-log
          path: build/e2e-server/server.log
          retention-days: 7
