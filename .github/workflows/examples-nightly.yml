name: Examples nightly

# Starts the server from this commit and runs every example (examples/run-all.sh) against it, so a
# merge that breaks an example (and the docs that quote it) is found the same night. Examples that
# need something the runner lacks, such as an LLM endpoint, print SKIP and do not fail the run.
# Failures open the nightly tracking issue (nightly-report.yml).
on:
  schedule:
    - cron: '23 1 * * *' # daily, 6:53 AM IST (01:23 UTC)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  examples:
    name: Run the examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      # The server jar embeds the UI, so its Gradle build runs pnpm.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper
          dependency-graph: disabled
          cache-provider: enhanced

      - name: Build the server jar
        run: ./gradlew :boot:bootJar -q --console=plain

      # Loopback only. The examples run commands (PROCESS_EXECUTOR), which a default server refuses,
      # so this throwaway server allows any executable.
      - name: Start the server
        env:
          YUKTA_PROCESS_ALLOW_ANY: 'true'
        run: |
          jar=$(ls boot/build/libs/boot-*.jar | grep -v -- '-plain.jar' | head -n 1)
          nohup java -jar "$jar" > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"' && exit 0
            sleep 2
          done
          echo "::error::the server never reported UP"
          exit 1

      # 11-dogfood runs this repository's own Gradle check, which CI already does elsewhere.
      - name: Run the examples
        env:
          EXAMPLES_SKIP: 11-dogfood
        run: examples/run-all.sh

      - name: Upload the server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: examples-server-log
          path: server.log
          retention-days: 7
