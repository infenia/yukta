name: Perf nightly

# Builds the native binary of main (the quick build, as perf-weekly.yml), runs the k6 perf test (2 min) and a 30 minute
# soak against it in a container with fixed resources (perf/run.sh), and fails on: a stuck run, a lost tracker event,
# a success rate under 99%, a median or p99 above the baseline, or server memory that keeps rising (perf/compare.py
# says how much each may move).
# The baseline is the last green run of main (cache), which absorbs the speed of the hosted runner; until there is
# one it is perf/baseline.json. Each failure becomes an issue (auto-found.sh). The weekly long run is perf-weekly.yml.
on:
  schedule:
    - cron: '23 20 * * *' # daily, 1:53 AM IST (20:23 UTC)
  workflow_dispatch:
    inputs:
      persistence:
        description: 'memory, or postgres (Plus binary, every store in PostgreSQL; no baseline compare, no new baseline)'
        type: choice
        options: [memory, postgres]
        default: memory

env:
  PERSISTENCE: ${{ inputs.persistence || 'memory' }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  perf:
    name: Perf and soak against the native binary
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write # file a finding as an issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0

      # The p95 of the last green run of main; the key is new every run, so the post step saves this run's
      # result (written below) only when every step passed.
      - name: Restore the baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: perf/.baseline
          key: perf-nightly-native-baseline-${{ github.run_id }}
          restore-keys: perf-nightly-native-baseline-

      # The hosted runner has little free disk; the native build and its builder image need several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The 12g builder heap on a 16 GB runner leaves little for the OS and the linker; swap turns an
      # OOM kill late in the build into a slower step.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/extra.swap
          sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap
          sudo swapon /mnt/extra.swap

      # Built once, before the tests; every perf/run.sh below runs this binary (BINARY).
      - name: Native compile (quick)
        env:
          NATIVE_QUICK: '1'
          NATIVE_HEAP: 12g
        run: |
          if [ "$PERSISTENCE" = postgres ]; then
            export YUKTA_BUILD_FLAGS='-Pyukta.persistence=postgres -Pyukta.workers=true'
          fi
          release/build-server.sh
          echo "BINARY=$PWD/dist/linux-amd64/yukta" >> "$GITHUB_ENV"

      - name: Perf test (10 starts/s, 2 min)
        run: |
          perf/run.sh perf

      # The baseline is a memory run: a PostgreSQL report is compared by hand (perf/README.md).
      - name: Compare the perf test with the baseline
        id: compare-perf
        if: env.PERSISTENCE == 'memory'
        continue-on-error: true
        run: |
          mkdir -p perf/.baseline
          base=perf/.baseline/baseline.json
          [ -f "$base" ] || base=perf/baseline.json
          reports=(perf/reports/perf/*)
          python3 -I perf/compare.py "${reports[-1]}" --baseline "$base" \
            --findings findings-perf.json --write-baseline perf/.baseline/baseline.new.json

      - name: Soak (10 starts/s, 30 min)
        env:
          DURATION: 30m
          RATE: '10'
        run: |
          perf/run.sh soak

      # The soak has no latency baseline of its own; stuck runs, success and its memory trend are checked.
      - name: Check the soak
        id: compare-soak
        continue-on-error: true
        run: |
          echo '{}' > "$RUNNER_TEMP/none.json"
          reports=(perf/reports/soak/*)
          python3 -I perf/compare.py "${reports[-1]}" --baseline "$RUNNER_TEMP/none.json" \
            --findings findings-soak.json

      # 1,000 open input requests, 500 answers in 30 s (the quick native build, -Ob, cannot take a 10 s burst:
      # 396 answers sent, answer p95 9 s, #2471) and 50 clients reading the open requests.
      # The thresholds are in perf/k6/inputs.js (answer and read p95 under 2 s, no lost request,
      # no answered run left running, heap under 1.5 GB); a missed one fails the step.
      - name: Input requests under load
        id: inputs
        continue-on-error: true
        env:
          ANSWER_SECONDS: '30'
        run: |
          perf/run.sh inputs

      - name: Name the input requests finding
        if: steps.inputs.outcome == 'failure'
        run: |
          jq -n '[{key: "perf#inputs", title: "Input requests under load: a threshold failed", severity: "High",
                   module: "core", detail: "A threshold of perf/k6/inputs.js failed; see k6.log in the perf-nightly artifact.",
                   repro: "perf/run.sh inputs"}]' > findings-inputs.json

      # One issue per finding (.github/scripts/auto-found.sh), then the job fails so the run is red.
      - name: File what was found
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          FAILED: ${{ contains(steps.*.outcome, 'failure') }}
        run: |
          jq -s 'add // []' findings-*.json > findings.json 2>/dev/null || echo '[]' > findings.json
          CONCLUSION=$([ "$FAILED" = true ] && echo failure || echo success) .github/scripts/auto-found.sh < findings.json

      - name: Fail when a check failed
        if: steps.compare-perf.outcome == 'failure' || steps.compare-soak.outcome == 'failure' || steps.inputs.outcome == 'failure'
        run: exit 1

      # Only a run that passed every step becomes the next baseline (the cache is saved by the post step).
      - name: Keep this run as the next baseline
        if: github.ref == 'refs/heads/main' && env.PERSISTENCE == 'memory'
        run: mv perf/.baseline/baseline.new.json perf/.baseline/baseline.json

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-nightly-${{ github.run_id }}
          path: |
            perf/reports/*/*/summary.json
            perf/reports/*/*/meta.json
            perf/reports/*/*/container-stats.csv
            perf/reports/*/*/server.log
            perf/reports/*/*/diagnostics.txt
            perf/reports/*/*/k6.log
          if-no-files-found: warn
          retention-days: 30
