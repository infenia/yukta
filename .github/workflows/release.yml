name: Release

on:
  push:
    tags: [ "v*" ]
  # The tag is created by release-please (release-please.yml) when the release PR is merged.
  workflow_dispatch:   # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # build provenance (keyless signing)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache: false   # release artifacts must not depend on shared caches

      - name: Version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$IS_TAG" = true ] && [ "v$version" != "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build-all

      - name: Checksums
        working-directory: cli/build
        run: sha256sum yukta-cli-* > SHA256SUMS

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cli/build/yukta-cli-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-binaries
          path: cli/build/
          if-no-files-found: error

  server:
    name: Server ${{ matrix.platform }}
    # GraalVM native-image cannot cross-compile: each platform needs a host of its own architecture
    # (linux-arm64 would be one more entry here, on ubuntu-24.04-arm). The images, the packages and
    # the signing happen on the release machine (release/release.sh).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
    timeout-minutes: 180   # records a PGO profile (instrumented build + examples), then builds
    permissions:
      contents: read
      id-token: write       # build provenance (keyless signing)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The hosted runner has little free disk; the native build and its builder image need several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Builds inside the pinned Oracle GraalVM image, the same way the release machine does. It first
      # records a PGO profile on this runner (release/pgo-profile.sh), so the profile matches the commit.
      # NATIVE_HEAP is lowered from 16g in case the hosted runner has less memory.
      - name: Native compile
        env:
          NATIVE_HEAP: 12g
          NATIVE_PGO_REQUIRED: 1   # a release without a recorded profile is a different binary: fail
        run: release/build-server.sh

      # Starts the binary, then runs the Quickstart workflow against it (release/smoke-test.sh), so a
      # native image whose expressions or reflection data are broken cannot be released.
      - name: Smoke test
        run: |
          dist/${{ matrix.platform }}/yukta &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          release/smoke-test.sh http://127.0.0.1:8080

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.platform }}/yukta

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error

  # Packages, image, checksums and signatures, uploaded to the draft release-please made. Same
  # script as the release machine (release/release.sh), so a failed hosted server build can still be
  # released by hand. Signing is keyless: cosign uses this workflow's identity, no browser, no key.
  assemble:
    name: Package, sign, upload
    # A manual (workflow_dispatch) run must never push or sign, even when started on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [cli, server]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # upload to the draft release
      packages: write       # push the image to GHCR
      id-token: write       # keyless signing as this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0   # release.sh checks that HEAD is exactly the tag

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: dist/cli

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-linux-amd64
          path: dist/linux-amd64

      - name: Package, push the image, sign, upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x dist/linux-amd64/yukta dist/cli/yukta-cli-*
          # release-please marks every draft a prerelease; only a version with a "-" is one.
          case "$TAG" in *-*) pre=true ;; *) pre=false ;; esac
          gh release edit "$TAG" --prerelease="$pre"
          release/release.sh "${TAG#v}" --skip-server --publish

  # Installs what was just uploaded the way a user would, before anyone publishes the draft.
  verify:
    name: Test the draft
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # reading a draft release needs write access
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: release

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Checksums and signature
        run: |
          mkdir -p "$RUNNER_TEMP/rel/$TAG"
          gh release download "$TAG" -R "$REPO" -D "$RUNNER_TEMP/rel/$TAG"
          cd "$RUNNER_TEMP/rel/$TAG"
          sha256sum -c SHA256SUMS   # also fails when a listed file is missing from the draft
          cosign verify-blob --bundle SHA256SUMS.sigstore.json SHA256SUMS \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Install on a clean machine
        run: |
          (cd "$RUNNER_TEMP/rel" && python3 -m http.server 8765 --bind 127.0.0.1 &)
          sleep 2
          docker run --rm --network host -v "$RUNNER_TEMP/rel/$TAG:/rel:ro" ubuntu:24.04 bash -euc "
            apt-get update -qq && apt-get install -y -qq curl >/dev/null
            curl -fsSL http://127.0.0.1:8765/$TAG/install.sh | YUKTA_DOWNLOAD_BASE=http://127.0.0.1:8765 sh
            yukta-cli --version   # root installs to /usr/local/bin
            apt-get install -y -qq /rel/*.deb >/dev/null"

      - name: Pull the image logged out and run the Quickstart
        run: |
          DOCKER_CONFIG="$(mktemp -d)"   # no credentials: proves the package is public
          export DOCKER_CONFIG
          image="ghcr.io/$REPO:${TAG#v}"
          docker pull "$image"
          docker run -d --rm --name ytest -p 127.0.0.1:18081:8080 -e YUKTA_API_KEY=x "$image"
          trap 'docker rm -f ytest >/dev/null 2>&1 || true' EXIT
          release/smoke-test.sh http://127.0.0.1:18081 x
