name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:   # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # build provenance (keyless signing)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache: false   # release artifacts must not depend on shared caches

      - name: Version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.event_name == 'push' }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$IS_TAG" = true ] && [ "v$version" != "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build-all

      - name: Checksums
        working-directory: cli/build
        run: sha256sum yukta-cli-* > SHA256SUMS

      - name: Attest build provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cli/build/yukta-cli-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-binaries
          path: cli/build/
          if-no-files-found: error

  server:
    name: Server ${{ matrix.platform }}
    # GraalVM native-image cannot cross-compile: each platform needs a host of its own architecture
    # (linux-arm64 would be one more entry here, on ubuntu-24.04-arm). The images, the packages and
    # the signing happen on the release machine (release/release.sh).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
    timeout-minutes: 180   # records a PGO profile (instrumented build + examples), then builds
    permissions:
      contents: read
      id-token: write       # build provenance (keyless signing)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The hosted runner has little free disk; the native build and its builder image need several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Builds inside the pinned Oracle GraalVM image, the same way the release machine does. It first
      # records a PGO profile on this runner (release/pgo-profile.sh), so the profile matches the commit.
      # NATIVE_HEAP is lowered from 16g in case the hosted runner has less memory.
      - name: Native compile
        env:
          NATIVE_HEAP: 12g
        run: release/build-server.sh

      # Kept for audit and to rebuild a release the same way; the build never reads an old one.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pgo-profile-${{ matrix.platform }}
          path: boot/pgo/yukta.iprof
          if-no-files-found: warn
          retention-days: 90

      - name: Smoke test
        run: |
          dist/${{ matrix.platform }}/yukta &
          pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then kill "$pid"; exit 0; fi
            sleep 2
          done
          kill "$pid" || true
          echo "::error::server did not report UP"
          exit 1

      - name: Attest build provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.platform }}/yukta

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error

  publish:
    name: GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [cli, server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          draft: true   # the release machine adds packages and images, then publishes
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
