name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:   # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # build provenance (keyless signing)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache: false   # release artifacts must not depend on shared caches

      - name: Build all platforms
        working-directory: cli
        run: make build-all

      - name: Checksums
        working-directory: cli/build
        run: sha256sum yukta-cli-* > SHA256SUMS

      - name: Attest build provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cli/build/yukta-cli-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-binaries
          path: cli/build/
          if-no-files-found: error

  server-linux-arm64:
    name: Server linux/arm64
    # GraalVM native-image cannot cross-compile, so arm64 needs an arm64 host. The amd64 server,
    # the images, the packages and the signing happen on the release machine (release/release.sh).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write       # build provenance (keyless signing)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Builds inside the pinned GraalVM image, the same way the release machine does.
      # NATIVE_HEAP is lowered from 16g in case the hosted runner has less memory.
      - name: Native compile
        env:
          NATIVE_HEAP: 12g
        run: release/build-server.sh

      - name: Smoke test
        run: |
          dist/linux-arm64/yukta &
          pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then kill "$pid"; exit 0; fi
            sleep 2
          done
          kill "$pid" || true
          echo "::error::server did not report UP"
          exit 1

      - name: Attest build provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/linux-arm64/yukta

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-linux-arm64
          path: dist/linux-arm64/
          if-no-files-found: error

  publish:
    name: GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [cli, server-linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          draft: true   # the release machine adds packages and images, then publishes
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
