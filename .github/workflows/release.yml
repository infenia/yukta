name: Release

on:
  push:
    tags: [ "v*" ]
  # The tag is created by release-please (release-please.yml) when the release PR is merged.
  # Weekly rehearsal: the same dry run as a manual one, the full -O3 build on every platform, so a build
  # that broke on macOS or Windows (native-smoke.yml covers linux-amd64 only) shows up before the release
  # PR is merged, not after the tag exists.
  schedule:
    - cron: '17 21 * * 6' # Sunday 2:47 AM IST (Saturday 21:17 UTC)
  workflow_dispatch:   # dry run: builds everything, publishes nothing
    inputs:
      platforms:
        description: 'Server platforms to build, comma separated (empty: all), e.g. windows-amd64'
        default: ''
      quick:
        description: 'Build the macOS and Windows servers with -Ob (fast, for finding build problems)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # build provenance (keyless signing)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache: false   # release artifacts must not depend on shared caches

      - name: Version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$IS_TAG" = true ] && [ "v$version" != "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build-all

      - name: Checksums
        run: |
          source release/lib.sh
          write_build_marker cli/build   # release.sh refuses a CLI build of another version or commit
          cd cli/build && sha256sum yukta-cli-* > SHA256SUMS

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cli/build/yukta-cli-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-binaries
          path: cli/build/
          if-no-files-found: error

  # The servers to build: all of them, or the ones named in the manual run's "platforms" input.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          ONLY: ${{ inputs.platforms }}
        run: |
          all='[
            {"platform":"linux-amd64","runner":"ubuntu-latest"},
            {"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},
            {"platform":"darwin-amd64","runner":"macos-15-intel","heap":"10g"},
            {"platform":"windows-amd64","runner":"windows-latest","heap":"12g"}]'
          picked="$(jq -c --arg only "$ONLY" \
            '[.[] | . as $p | select($only == "" or ($only | split(",") | index($p.platform)))]' <<<"$all")"
          [ "$picked" != "[]" ] || { echo "::error::no platform matches '$ONLY'"; exit 1; }
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"

  server:
    name: Server ${{ matrix.platform }}
    needs: plan
    # GraalVM native-image cannot cross-compile: each platform needs a host of its own architecture
    # (ubuntu-24.04-arm is free for public repositories). macOS is built for Intel: the build needs about
    # 11 GB of memory, the free Apple silicon runner (macos-latest) has 7 GB and macos-15-intel has 14 GB.
    # Apple silicon runs that binary through Rosetta 2 (install.sh picks it). The images, the packages and the signing
    # happen in the assemble job (release/release.sh).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: 120   # one native build, about 35 min
    defaults:
      run:
        shell: bash   # also on Windows (Git Bash)
    permissions:
      contents: read
      id-token: write       # build provenance (keyless signing)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The hosted runner has little free disk; the native build and its builder image need several GB.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Builds inside the pinned Oracle GraalVM image, the same way the release machine does. No PGO
      # profile is recorded here: the instrumented build runs out of memory or hangs on the hosted runner
      # (alpha.2, alpha.3), so the binary is -O3 with the profile Graal infers itself (GraalNN). To
      # release with a recorded profile, record it with release/pgo-profile.sh on a machine with
      # enough memory and rebuild with NATIVE_PGO_PROFILE=<file>, or use a larger runner here.
      # NATIVE_HEAP is lowered from 16g in case the hosted runner has less memory.
      - name: Native compile
        if: runner.os == 'Linux'
        timeout-minutes: 75   # alpha.2 built in about 30 min; a stall fails here, not after hours
        env:
          NATIVE_HEAP: 12g
          NATIVE_PGO: 0
        run: release/build-server.sh

      # Oracle GraalVM (-O3, same as the Docker builder image). On Windows the action also sets up the
      # MSVC toolchain native-image needs.
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        if: runner.os != 'Linux'
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # In CI the Gradle build uses the system Node.js and pnpm (build-logic node-conventions). The
      # Linux job gets them from the Docker image build, which downloads its own.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: runner.os != 'Linux'
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: runner.os != 'Linux'
        with:
          version: 12.16.1

      # No PGO profile and no static link here (both are Linux/Docker only), -O3 with GraalNN.
      - name: Native compile (${{ matrix.platform }})
        if: runner.os != 'Linux'
        timeout-minutes: 90
        run: |
          ./gradlew nativeCompile -x test --no-daemon -Pnative.heap=${{ matrix.heap }} ${{ inputs.quick && '-Pnative.quick' || '' }}
          source release/lib.sh
          out="dist/${{ matrix.platform }}"
          mkdir -p "$out"
          cp boot/build/native/nativeCompile/yukta* "$out/"   # yukta or yukta.exe, plus any shared libraries
          write_build_marker "$out"

      # Starts the binary, then runs the Quickstart workflow against it (release/smoke-test.sh), so a
      # native image whose expressions or reflection data are broken cannot be released.
      - name: Smoke test
        run: |
          dist/${{ matrix.platform }}/yukta${{ runner.os == 'Windows' && '.exe' || '' }} &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          release/smoke-test.sh http://127.0.0.1:9858

      # native-image wrote the bill of materials next to the binary (--enable-sbom=embed,export). Checked
      # on every run, so a rehearsal fails when it is missing, not the release.
      - name: SBOM was exported
        env:
          SBOM: dist/${{ matrix.platform }}/yukta.sbom.json
        run: jq -e '.bomFormat == "CycloneDX" and (.components | length > 50)' "$SBOM"

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.platform }}/yukta${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Attest the SBOM
        if: github.ref_type == 'tag'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/${{ matrix.platform }}/yukta${{ runner.os == 'Windows' && '.exe' || '' }}
          sbom-path: dist/${{ matrix.platform }}/yukta.sbom.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error

  # Packages, image, checksums and signatures, uploaded to the draft release-please made. Same
  # script as the release machine (release/release.sh), so a failed hosted server build can still be
  # released by hand. Signing is keyless: cosign uses this workflow's identity, no browser, no key.
  assemble:
    name: Package, sign, upload
    # A manual (workflow_dispatch) run must never push or sign, even when started on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [cli, server]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # upload to the draft release
      packages: write       # push the image to GHCR
      id-token: write       # keyless signing as this workflow
      attestations: write   # build provenance of the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0   # release.sh checks that HEAD is exactly the tag

      # This job signs as the workflow, so it must only run for a commit that went through review:
      # a v* tag on a branch commit would otherwise get a valid signature for its own release.yml.
      - name: The tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not a commit on main; nothing is signed"; exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: dist/cli

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-linux-amd64
          path: dist/linux-amd64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-linux-arm64
          path: dist/linux-arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-darwin-amd64
          path: dist/darwin-amd64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-windows-amd64
          path: dist/windows-amd64

      # build-image.sh smoke tests the arm64 image here, on an amd64 machine, under QEMU.
      - name: Enable arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Package, push the image, sign, upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x dist/*/yukta dist/windows-amd64/yukta.exe dist/cli/yukta-cli-*
          # release-please marks every draft a prerelease; only a version with a "-" is one.
          case "$TAG" in *-*) pre=true ;; *) pre=false ;; esac
          gh release edit "$TAG" --prerelease="$pre"
          release/release.sh "${TAG#v}" --skip-server --publish

      # Provenance for the image index (the digest cosign signed), stored next to it in the registry, so
      # `gh attestation verify oci://ghcr.io/<repo>:<version>` works like it does for the binaries.
      - name: Image digest
        id: image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:${TAG#v}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest for $IMAGE:${TAG#v}"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # Installs what was just uploaded the way a user would, before anyone publishes the draft.
  verify:
    name: Test the draft
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # reading a draft release needs write access
      attestations: read    # gh attestation verify
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            release
            cli

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cli/go.mod'
          cache: false

      - name: Checksums and signature
        run: |
          mkdir -p "$RUNNER_TEMP/rel/$TAG"
          gh release download "$TAG" -R "$REPO" -D "$RUNNER_TEMP/rel/$TAG"
          cd "$RUNNER_TEMP/rel/$TAG"
          sha256sum -c SHA256SUMS   # also fails when a listed file is missing from the draft
          cosign verify-blob --bundle SHA256SUMS.sigstore.json SHA256SUMS \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # Everything the release claims to have attested or signed, checked the way a user would: a broken
      # attestation or image signature stops here, while the release is still a draft.
      - name: Build provenance of the binaries
        run: |
          cd "$RUNNER_TEMP/rel/$TAG"
          tar -xzf "yukta-${TAG#v}-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          for file in yukta-cli-* "$RUNNER_TEMP/yukta-${TAG#v}-linux-amd64/yukta"; do
            gh attestation verify "$file" -R "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" --source-ref "refs/tags/$TAG"
          done
          # The server's bill of materials: attached to the release, and attested for the binary.
          jq -e '.components | length > 50' "yukta-${TAG#v}-linux-amd64.sbom.json" >/dev/null
          gh attestation verify "$RUNNER_TEMP/yukta-${TAG#v}-linux-amd64/yukta" -R "$REPO" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$REPO/.github/workflows/release.yml" --source-ref "refs/tags/$TAG"

      # A second, independent build of the CLI from the tag must give the released bytes (cli/Makefile:
      # -trimpath, no cgo, no timestamps), so the binaries can be checked against the source by anyone.
      - name: CLI binaries are reproducible
        run: |
          make -C cli build-all VERSION="${TAG#v}"
          (cd cli/build && sha256sum yukta-cli-*) > "$RUNNER_TEMP/rebuilt"
          (cd "$RUNNER_TEMP/rel/$TAG" && sha256sum -c "$RUNNER_TEMP/rebuilt")

      - name: Image signature and provenance
        run: |
          image="ghcr.io/$REPO:${TAG#v}"
          cosign verify "$image" \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          gh attestation verify "oci://$image" -R "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml" --source-ref "refs/tags/$TAG"

      - name: Install on a clean machine
        run: |
          (cd "$RUNNER_TEMP/rel" && python3 -m http.server 8765 --bind 127.0.0.1 &)
          sleep 2
          docker run --rm --network host -v "$RUNNER_TEMP/rel/$TAG:/rel:ro" ubuntu:24.04 bash -euc "
            apt-get update -qq && apt-get install -y -qq curl >/dev/null
            curl -fsSL http://127.0.0.1:8765/$TAG/install.sh | YUKTA_DOWNLOAD_BASE=http://127.0.0.1:8765 sh
            yukta-cli --version   # root installs to /usr/local/bin
            apt-get install -y -qq /rel/*_amd64.deb >/dev/null"

      - name: Pull the image logged out and run the Quickstart
        run: |
          DOCKER_CONFIG="$(mktemp -d)"   # no credentials: proves the package is public
          export DOCKER_CONFIG
          image="ghcr.io/$REPO:${TAG#v}"
          docker pull "$image"
          docker run -d --rm --name ytest -p 127.0.0.1:18081:9858 \
            -e YUKTA_API_KEYS_0_NAME=admin -e YUKTA_API_KEYS_0_KEY=x \
            -e YUKTA_API_KEYS_0_ROLE=ADMIN "$image"
          trap 'docker rm -f ytest >/dev/null 2>&1 || true' EXIT
          release/smoke-test.sh http://127.0.0.1:18081 x
