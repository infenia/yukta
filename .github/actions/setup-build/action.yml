name: Set up the build
description: >-
  JDK, Gradle and, on request, Node with pnpm (and its store cache), Go and OpenGrep. The only place that
  holds the Java, Node and pnpm versions.

inputs:
  node:
    description: 'Set up Node.js and pnpm (the ui module, and boot which builds it) and cache the pnpm store'
    default: 'true'
  go:
    description: 'Set up Go from cli/go.mod (the cli module)'
    default: 'false'
  gradle:
    description: 'Set up Gradle (wrapper) with the enhanced cache; saved on main only'
    default: 'true'
  opengrep:
    description: 'Install the pinned OpenGrep binary'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '25'
        distribution: 'temurin'

    # The cli module shells out to `go` directly (goBuild, goTest, goCoverageCheck, ...); without
    # a pinned Go the runner's ambient one hit "go: no such tool covdata" during coverage.
    #
    # The cache key covers cli/Makefile because it pins golangci-lint, gosec and govulncheck, which
    # `go run` compiles on first use; keying on go.sum alone froze the cache before they were built.
    - name: Set up Go
      if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'cli/go.mod'
        cache-dependency-path: |
          cli/go.sum
          cli/Makefile

    - name: Set up Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'

    - name: Set up pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: ui/package.json

    # Cached with actions/cache rather than setup-node's `cache: pnpm`, whose post step errors when a
    # job never runs `pnpm install`.
    - name: Locate pnpm store
      id: pnpm-store
      if: inputs.node == 'true'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      if: inputs.node == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    # Dependency graph submission is handled by the dedicated dependency-submission job, which always
    # resolves the FULL graph.
    - name: Setup Gradle
      if: inputs.gradle == 'true'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      with:
        gradle-version: wrapper
        dependency-graph: disabled
        cache-provider: enhanced
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    # Pinned binary + sha256: bump both together.
    - name: Install OpenGrep
      if: inputs.opengrep == 'true'
      shell: bash
      env:
        OPENGREP_VERSION: v1.25.0
        OPENGREP_SHA256: 9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33
      # zizmor: a fixed path in $HOME and a sha256-checked binary; no input reaches GITHUB_PATH.
      run: | # zizmor: ignore[github-env]
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o "$HOME/.local/bin/opengrep" \
          "https://github.com/opengrep/opengrep/releases/download/$OPENGREP_VERSION/opengrep_manylinux_x86"
        echo "$OPENGREP_SHA256  $HOME/.local/bin/opengrep" | sha256sum -c -
        chmod +x "$HOME/.local/bin/opengrep"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/opengrep" --version
