# --- PR type (from the PR title, .github/workflows/pr-title.yml; used by .github/release.yml) -----------------------------------------
- name: type/feature
  color: a2eeef
  description: PR whose title type is feat (set by the PR title check)
- name: type/bugfix
  color: d73a4a
  description: PR whose title type is fix (set by the PR title check)
- name: type/chore
  color: ededed
  description: PR whose title type is chore, ci, build, style, perf or revert
- name: type/refactor
  color: ededed
  description: PR whose title type is refactor (set by the PR title check)
- name: type/docs
  color: "0075ca"
  description: PR whose title type is docs (set by the PR title check)
- name: type/test
  color: ededed
  description: PR whose title type is test (set by the PR title check)

# --- Legacy kind labels (issue types replace them; kept for old issues and PRs) -----------------
- name: bug
  color: d73a4a
  description: Something isn't working (prefer the Bug issue type)
- name: enhancement
  color: a2eeef
  description: New feature or request (prefer the Feature issue type)

# --- Dependencies (.github/dependabot.yml) -------------------------------------------------------
- name: dependencies
  color: "0366d6"
  description: Pull requests that update a dependency file
- name: dependabot
  color: "0366d6"
  description: Opened by Dependabot; the project's Auto-add filter skips it
- name: java
  color: ffa221
  description: Pull requests that update java code
- name: github-actions
  color: "000000"
  description: Pull requests that update GitHub Actions code
- name: go
  color: 16e2e2
  description: Pull requests that update go code
- name: javascript
  color: "168700"
  description: Pull requests that update javascript code
- name: docker
  color: 21ceff
  description: Pull requests that update docker code
- name: python
  color: 2b67c6
  description: Pull requests that update python code
