- name: terminals
  color: c2e0c6
  description: Terminal plugins (plugins/terminals)
- name: jte
  color: c2e0c6
  description: JTE templates in ui
- name: tailwind
  color: c2e0c6
  description: Tailwind CSS in ui
- name: frontend
