[versions]
springBoot = "4.0.2"
springDependencyManagement = "1.1.7"
graalvmBuildtools = "0.11.4"
spotless = "8.2.1"
lombok = "9.2.0"
mapstruct = "1.6.3"
springAi = "2.0.0-M2"
springdoc = "2.8.5"
lombokMapstructBinding = "0.2.0"
checkstyle = "13.2.0"
pmd = "7.21.0"
spotbugs = "6.4.8"
jacksonDataformatYaml = "2.18.2"
jte = "3.1.12"

[libraries]
spring-boot-starter = { group = "org.springframework.boot", name = "spring-boot-starter", version.ref = "springBoot" }
spring-boot-autoconfigure = { group = "org.springframework.boot", name = "spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot-starter-webflux = { group = "org.springframework.boot", name = "spring-boot-starter-webflux", version.ref = "springBoot" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation", version.ref = "springBoot" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator", version.ref = "springBoot" }
spring-boot-configuration-processor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor", version.ref = "springBoot" }
jackson-dataformat-yaml = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-yaml", version.ref = "jacksonDataformatYaml" }
mapstruct = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { group = "org.mapstruct", name = "mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { group = "org.projectlombok", name = "lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }
spring-ai-mcp-server = { group = "org.springframework.ai", name = "spring-ai-starter-mcp-server", version.ref = "springAi" }
springdoc-openapi = { group = "org.springdoc", name = "springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
jte-starter = { group = "gg.jte", name = "jte-spring-boot-starter-3", version.ref = "jte" }
jte-runtime = { group = "gg.jte", name = "jte-runtime", version.ref = "jte" }
jte-core = { group = "gg.jte", name = "jte", version.ref = "jte" }
lombok = { group = "org.projectlombok", name = "lombok", version = "1.18.36" }

# Testing
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-starter-webflux-test = { group = "org.springframework.boot", name = "spring-boot-starter-webflux-test", version.ref = "springBoot" }
spring-boot-starter-jackson-test = { group = "org.springframework.boot", name = "spring-boot-starter-jackson-test", version.ref = "springBoot" }
reactor-test = { group = "io.projectreactor", name = "reactor-test" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
graalvm-buildtools-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvmBuildtools" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
jte = { id = "gg.jte.gradle", version.ref = "jte" }
