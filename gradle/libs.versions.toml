[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
graalvmBuildtools = "1.1.14"
spotless = "8.10.3"
lombok = "9.8.0"
mapstruct = "1.6.3"
springAi = "2.0.0"
springdoc = "3.1.1"
lombokMapstructBinding = "0.2.0"
checkstyle = "13.2.0"
pmd = "7.21.0"
spotbugs = "6.5.12"
errorprone = "2.50.0"
errorpronePlugin = "5.1.1"
cyclonedx = "3.5.0"
handlebars = "4.5.5"
graalvmPolyglot = "25.4.4.1.1"
nodeGradle = "7.1.0"
node = "24.13.1"
pnpm = "10.30.1"
picocli = "4.7.7"
caffeine = "3.3.0"
licensee = "1.14.1"
jacoco = "0.8.14"
netty = "4.2.18.Final"

[libraries]
h2 = { group = "com.h2database", name = "h2", version = "2.5.252" }
spring-boot-starter = { group = "org.springframework.boot", name = "spring-boot-starter" }
spring-boot-autoconfigure = { group = "org.springframework.boot", name = "spring-boot-autoconfigure" }
spring-boot-starter-webflux = { group = "org.springframework.boot", name = "spring-boot-starter-webflux" }
spring-boot-starter-webclient = { group = "org.springframework.boot", name = "spring-boot-starter-webclient" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
spring-boot-configuration-processor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor", version.ref = "springBoot" }
jackson-databind = { group = "tools.jackson.core", name = "jackson-databind" }
jackson-dataformat-yaml = { group = "tools.jackson.dataformat", name = "jackson-dataformat-yaml" }
mapstruct = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { group = "org.mapstruct", name = "mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { group = "org.projectlombok", name = "lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }
spring-ai-mcp-server-webflux = { group = "org.springframework.ai", name = "spring-ai-starter-mcp-server-webflux" }
spring-ai-client-chat = { group = "org.springframework.ai", name = "spring-ai-client-chat" }
spring-ai-openai = { group = "org.springframework.ai", name = "spring-ai-openai" }
spring-ai-anthropic = { group = "org.springframework.ai", name = "spring-ai-anthropic" }
spring-ai-ollama = { group = "org.springframework.ai", name = "spring-ai-ollama" }
springdoc-openapi = { group = "org.springdoc", name = "springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
handlebars = { group = "com.github.jknack", name = "handlebars", version.ref = "handlebars" }
graalvm-polyglot = { group = "org.graalvm.polyglot", name = "polyglot", version.ref = "graalvmPolyglot" }
graalvm-js = { group = "org.graalvm.polyglot", name = "js", version.ref = "graalvmPolyglot" }
lombok = { group = "org.projectlombok", name = "lombok", version = "1.18.48" }
spring-boot-devtools = { group = "org.springframework.boot", name = "spring-boot-devtools" }
picocli = { group = "info.picocli", name = "picocli", version.ref = "picocli" }
picocli-codegen = { group = "info.picocli", name = "picocli-codegen", version.ref = "picocli" }
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine" }
errorprone = { group = "com.google.errorprone", name = "error_prone_core", version.ref = "errorprone" }
errorprone-annotations = { group = "com.google.errorprone", name = "error_prone_annotations", version.ref = "errorprone" }

# Netty - override for CVE-2026-59901, CVE-2026-55831, CVE-2026-55833, CVE-2026-56745, CVE-2026-56816
netty-codec-compression = { group = "io.netty", name = "netty-codec-compression", version.ref = "netty" }
netty-codec-http = { group = "io.netty", name = "netty-codec-http", version.ref = "netty" }
netty-codec-http3 = { group = "io.netty", name = "netty-codec-http3", version.ref = "netty" }

# PostgreSQL persistence (versions managed by the Spring Boot BOM)
spring-boot-starter-data-r2dbc = { group = "org.springframework.boot", name = "spring-boot-starter-data-r2dbc" }
spring-boot-starter-flyway = { group = "org.springframework.boot", name = "spring-boot-starter-flyway" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql" }
postgresql-jdbc = { group = "org.postgresql", name = "postgresql" }
r2dbc-postgresql = { group = "org.postgresql", name = "r2dbc-postgresql" }

# Testing
testcontainers-postgresql = { group = "org.testcontainers", name = "testcontainers-postgresql" }
testcontainers-junit = { group = "org.testcontainers", name = "testcontainers-junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
spring-boot-starter-actuator-test = { group = "org.springframework.boot", name = "spring-boot-starter-actuator-test" }
spring-boot-starter-validation-test = { group = "org.springframework.boot", name = "spring-boot-starter-validation-test" }
spring-boot-starter-webclient-test = { group = "org.springframework.boot", name = "spring-boot-starter-webclient-test" }
spring-boot-starter-webflux-test = { group = "org.springframework.boot", name = "spring-boot-starter-webflux-test" }
spring-boot-starter-jackson-test = { group = "org.springframework.boot", name = "spring-boot-starter-jackson-test" }
reactor-core = { group = "io.projectreactor", name = "reactor-core" }
spring-expression = { group = "org.springframework", name = "spring-expression" }
reactor-test = { group = "io.projectreactor", name = "reactor-test" }
awaitility = { group = "org.awaitility", name = "awaitility", version = "4.3.0" }
[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
graalvm-buildtools-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvmBuildtools" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "nodeGradle" }
errorprone-gradle = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
