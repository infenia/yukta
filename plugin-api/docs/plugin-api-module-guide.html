able from the Reactor context key yukta.heartbeat, and set getDefaultTimeout(config) honestly."], ["Clean up on cancel", "Use doOnCancel or doFinally on the stream; do not rely on shutdown(config), which is never called."]]}], "quality": [{"n": "Scalability", "pos": "Barely applies to the module itself: it is interfaces and a few static helpers with no threads or I/O. What it does decide is the scaling shape of everything built on it: one shared plugin instance per type, streams per node, and a single in-process supervisor host.", "ceil": ["One shared instance per type means plugin code must be safe under many concurrent nodes; a field-based cache becomes a contention point", "The expression cache has one lock around parsing and lookup, shared by every plugin in the process", "Supervisor events are handled one at a time per control-plane plugin", "Sync checkpoint calls (clear, isComplete, isFinished) would block threads on a remote store"], "have": ["Virtual-thread offload for blocking plugins through one flag", "Bounded expression cache (1000)", "Per-config timeout and buffer hooks"], "need": ["A concurrency test kit that runs a plugin under many nodes", "A non-blocking checkpoint interface for database stores", "A cache with less lock contention if expression use grows"]}, {"n": "Performance", "pos": "The helpers sit on the hot path of every message that uses expressions, and parse-once-evaluate-many keeps that cheap. Everything else is interface calls; the cost is in the plugins.", "ceil": ["Each evaluation builds a new evaluation context", "Cache miss parses under the cache lock", "No evaluation timeout: a heavy expression costs whatever it costs", "Messages are immutable; every with-er call copies the envelope"], "have": ["Pre-parse hook (preParse) and parse cache", "Default buffer size hook per plugin", "isBlocking keeps blocking work off reactive threads"], "need": ["A benchmark of expression evaluation under load", "Optional per-evaluation time limit", "A guidance note on when to use preParse in prepare"]}, {"n": "Availability", "pos": "Not a runtime component, so it has no uptime of its own. It shapes availability through the supervisor SPI, where a hung reviewer or a slow decide() can stall command handling for a run or a plugin.", "ceil": ["review() has no timeout, and commands of one run wait their turn", "decide() handled one event at a time per plugin; a hang stalls that plugin's feed", "Event feed is best effort and has no replay after a missed event", "shutdown is never called, so resources of shared plugins live until the process ends"], "have": ["A failing review counts as a denial instead of an allow", "Supervisor failures are retried with backoff and never stop runs", "A failing decide() counts as no opinion"], "need": ["A review time limit with a defined outcome", "A stop that cannot be vetoed or delayed", "A documented bound for decide() enforced by the default supervise"]}, {"n": "Security", "pos": "This is where the module matters most: it holds the sandbox for user-written expressions, the veto on control commands, and the secret interface. Authentication itself is not here.", "ceil": ["Expression evaluation has no time or size limit and can still call any public method of reachable objects", "SecretProvider has no caller identity, so it cannot scope secrets per plugin or session", "UiDesign is raw HTML supplied by plugin code and rendered by the UI", "Review vetoes depend on supervisors being present and correct"], "have": ["Restricted evaluation context: no static calls, constructors or bean references, with tests", "Breakpoint conditions are declarative, not code", "SECRET field type and decrypted:<key> convention", "Denial on review error"], "need": ["An expression budget (time and size)", "Secret access scoped by plugin and audited", "A sanitising or sandboxed rendering of UiDesign HTML"]}, {"n": "Operability", "pos": "The module offers metrics hooks (a reporter interface) and an actor in the command audit, but ships no tooling for plugin authors: no test kit, no lifecycle that tells a plugin when to clean up.", "ceil": ["No test fixtures for plugin authors", "pmdTest is disabled", "A plugin cannot know it is being stopped except by stream cancel", "Config schema and the code that reads it are kept aligned by hand"], "have": ["PluginMetricsReporter with a NOOP default and per-node OK/ERROR counts through PluginGuard", "Actor id in the command audit (ControlActor)", "Tests that pin defaults and sandbox rules"], "need": ["A test kit (harness and message builders)", "A conformance test every plugin can run", "Re-enable pmdTest"]}, {"n": "Evolvability", "pos": "This is the module's biggest long-term risk: a wide set of defaults that every plugin silently relies on, no version marker, and plugins that also compile against core internals.", "ceil": ["Adding an abstract method breaks every plugin; adding a command breaks every exhaustive switch", "No SPI version, so mismatches show up as runtime errors", "Plugins import VariableResolver, MapUtils, PluginRegistry and the tracker from core", "WorkflowDirective has one member, so its sealed hierarchy gives little extension room yet"], "have": ["Default methods for new hooks", "Sealed types that make missing handling a compile error", "Small module with few dependencies"], "need": ["Move the shared helpers plugins need into plugin-api or a support module", "An SPI version constant and a startup check", "A decision on whether directives or processor-side effects are the extension seam"]}], "risks": [{"id": "reviewNoTimeout", "t": "A hung reviewer blocks commands, including a human stop", "a": "Availability", "i": 4, "e": 2, "c": ["sup", "cmds"], "why": "review() has no time limit in the SPI, and core's reviewer does not add one. Core runs the commands of one run one after another, and the review is part of each command's turn. If one supervisor's review never completes (an external call stalls), later commands for that run wait behind it, including a StopWorkflow from a person. All runs are affected if the reviewer hangs on every call. The same wait now also covers the two commands added for the scheduler (SetLimitsCommand, SetPriorityCommand), which pass through review too, so a hung reviewer can block an operator who is trying to change the limits during an overload.", "o": "Add a timeout to each review in core and define the outcome (deny, or allow for stop); exempt StopWorkflow from review or give it a short-circuit; require implementers to use a timeout and test for it.", "q": "When a safety check cannot answer, should the command be allowed or denied, and should a stop ever be vetoable?"}, {"id": "decideStall", "t": "decide() has no enforced time bound", "a": "Reliability", "i": 3, "e": 2, "c": ["sup"], "why": "ControlPlanePlugin.supervise handles events one at a time (concatMap). The Javadoc asks decide() to finish in bounded time, but nothing enforces it. A model call that hangs stalls every later event for that plugin, so the plugin stops reacting while looking healthy.", "o": "Apply a default timeout in the default supervise (timeout counts as no opinion); expose the limit as a setting; surface a stalled-plugin metric.", "q": "Is a single stuck decision better handled by skipping to the next event or by failing the whole supervisor so it resubscribes?"}, {"id": "orderOpposite", "t": "Two opposite ordering rules", "a": "Evolvability", "i": 2, "e": 1, "c": ["sup", "proc"], "why": "Supervisor order(): lowest runs first. ControlSignalProcessor getPriority(): highest wins. A developer who sets 'priority 1 = most important' on both gets the reverse of what they meant on one of them. Built-ins use 10-20 for processors, so a wrong guess is easy.", "o": "Rename to make direction obvious (reviewOrder, overridePriority); or align both to one rule; add a startup log of the effective order.", "q": "Would aligning the two rules be worth a breaking change, given how few external implementers exist today?"}, {"id": "spelLimits", "t": "Expression sandbox: allow-list done, still no time budget and a shared lock", "a": "Security", "i": 3, "e": 2, "c": ["spel"], "why": "Done: expressions can call only a short allow-list of methods (SafeMethodResolver: about 40 names such as length, contains, substring, plus every type in java.time), so repeat, getClass and the methods of a payload object are not found; tested. Still open: (1) no evaluation time or size budget, and the allow-list still holds <code>matches<\/code>, <code>split<\/code> and <code>substring<\/code>, so a regex with catastrophic backtracking, or a call on a very large string, runs to completion on whichever thread evaluates it; (2) the parsed-expression cache is a synchronized LinkedHashMap, so <code>computeIfAbsent<\/code> parses while holding its one lock and a slow parse delays every other plugin; (3) no expression length limit was found in the validators.", "o": "Evaluate with a time and size budget (or on a bounded pool); refuse <code>matches<\/code> with an expression-supplied pattern or run it with a bounded input; parse outside the lock (a concurrent cache); limit expression length at validation.", "q": "Who writes expressions today: only trusted authors, or any API caller? That decides how much of this matters."}, {"id": "sharedInstance", "t": "Statelessness of the shared instance is documented, not enforced", "a": "Correctness", "i": 3, "e": 3, "c": ["contract", "ctx", "spel", "guard"], "why": "One object serves every node, workflow and session, and initialize and prepare run again for each node on that same object. A plugin that stores config in a field works in a demo with one node and mixes up settings with two. Nothing in the interface or the tests catches it.", "o": "A conformance test plugins can run (two nodes, different configs, interleaved); an instance-per-node factory option; or pass a per-node context object into each call.", "q": "Should the contract move state into an explicit per-node object, accepting a larger interface, or keep the shared instance and add enforcement tests?"}, {"id": "shutdownNever", "t": "shutdown(config) is on the contract but never called", "a": "Operability", "i": 2, "e": 2, "c": ["contract"], "why": "The interface advertises a cleanup hook, and the Javadoc says the engine does not call it. An author who skims the interface leaks a connection pool or scheduled task, and nothing warns.", "o": "Remove the method, or call it for each plugin once at application stop; mark it deprecated with a clear message in the meantime.", "q": "Is any plugin relying on it today, and would a once-per-plugin lifecycle hook (not per node) be more honest?"}, {"id": "coreDependency", "t": "Plugins still depend on core internals (G18)", "a": "Evolvability", "i": 4, "e": 3, "c": ["pkg", "contract"], "why": "Still 11 plugin build files depend on :core, and the coupling grew a little: plugin sources have 26 imports of VariableResolver (15 files; was 24), 10 of MapUtils (10 files; was 9), 4 of PluginRegistry (2 files) and 4 of DefaultTaskTrackerService (2 files). So a plugin is not only coupled to this contract but to engine classes that can change, which defeats the point of a separate SPI and blocks third-party plugins. The direction is right in the new code: the run budget ledger (RunBudgets) and the approval waits (SignalWaits) were put into plugin-api so that plugins need no core class for them; the resolver and the map helpers have not been moved yet.", "o": "Move the resolver and map helpers into plugin-api or a new support module; expose the registry and tracker through small SPI interfaces; add a dependency check that fails if a plugin imports core.", "q": "Which of the four core classes is a real engine service and which is just a utility that landed in the wrong module?"}, {"id": "noVersion", "t": "No SPI version marker", "a": "Evolvability", "i": 3, "e": 2, "c": ["contract", "pkg"], "why": "The contract has no version constant or capability flag. A plugin built against an older plugin-api can fail with an obscure link error at runtime, and the engine cannot say which plugin is incompatible. This matters once plugins ship separately from the server.", "o": "Add an SPI version constant and a Plugin.apiVersion() default; check at startup and name the plugin; adopt semantic versioning of the module with a compatibility test.", "q": "Do we expect plugins built outside this repository, and if so how long must an old plugin keep working?"}, {"id": "directiveOnlyStop", "t": "WorkflowDirective has only Stop", "a": "Evolvability", "i": 2, "e": 3, "c": ["proc"], "why": "The directive layer is meant as the place where processors hand an action to the dispatcher, but only Stop exists. Every other built-in processor performs its work itself and returns nothing, so a custom processor cannot express 'pause' as a directive and the sealed hierarchy adds ceremony without extension room.", "o": "Either grow the directive set (pause, resume, restart, and so on) and make built-ins return them, or simplify the SPI to a plain apply function.", "q": "Is the directive layer the intended extension seam, or a leftover from an earlier design?"}, {"id": "deadHooks", "t": "Unused optimiser hooks on the contract", "a": "Functionality", "i": 2, "e": 1, "c": ["contract"], "why": "isComputationallyHeavy and suppressOptimizationHint are documented as used by validators for performance hints. Nothing in core or web calls them; one built-in plugin reads its own. Authors implement them for no effect, and the old guide's claim that they are 'used' is misleading.", "o": "Either implement the validator hint they were meant for, or remove them from the interface.", "q": "Is a graph optimisation hint something users want, or should the filter plugin keep its own check?"}, {"id": "onSignalLoose", "t": "Node signals are untyped", "a": "Functionality", "i": 2, "e": 3, "c": ["contract", "cmds"], "why": "onControlSignal takes a raw Message and returns one. A caller must know by convention which payloads a plugin understands. The 16 typed commands go to the engine, not to plugins, so plugin-specific actions have no typed shape, no schema in the descriptor and no discovery. Update: the approval flow now has a convention (SignalWaits: a payload map with executionId, nodeId, name, decision, data, answered ACCEPTED, QUEUED or NOT_WAITING), and a typed SignalNodeCommand carries it to the plugin. That fixes the shape for approvals only; another plugin still has no way to declare the signals it accepts.", "o": "Let a plugin declare the signals it accepts in its descriptor (name and payload schema); validate before delivery; consider a typed plugin-command record.", "q": "Do callers need to discover a plugin's signals at run time, or are they always scripted per plugin?"}, {"id": "eventsBestEffort", "t": "Supervisors can miss events", "a": "Reliability", "i": 3, "e": 3, "c": ["sup"], "why": "The feed drops events for a slow subscriber and has no replay. A supervisor that must react to every failure (or every ControlOutcome) cannot be sure it saw them. Drops are counted in a metric, but the supervisor itself is not told.", "o": "Tell the supervisor how many events it missed; offer a durable cursor-based feed from the execution log; mark which supervisors need reliable delivery and size their buffer.", "q": "Is it acceptable for an automated safety rule to miss an event under load, or should critical rules read from the durable log?"}, {"id": "storeSync", "t": "Some checkpoint calls are synchronous", "a": "Performance", "i": 3, "e": 3, "c": ["store"], "why": "clear, isComplete and isFinished return plain values, while save and get return Monos. This is no longer only a prediction: <code>R2dbcNodeCheckpointStore<\/code> now answers isComplete and isFinished by querying the database on the calling thread (its Javadoc says they are blocking in the interface), on the path that decides what a resume skips. The new <code>SessionHistoryStore<\/code> SPI is blocking by design as well (load and save return plain values; the PostgreSQL implementation waits up to 10 s on the calling thread). <code>KeyValueStore<\/code> is reactive, so the newest store SPI shows the intended shape.", "o": "Add reactive versions (clear returns Mono, isComplete and isFinished return Mono<Boolean>, SessionHistoryStore returns Mono) with the current ones deprecated; or document that stores must answer from local memory and mark the plugins that call them as blocking.", "q": "Will the database-backed store cache these answers locally, or should the contract become fully non-blocking?"}, {"id": "secretThin", "t": "Secret lookup has no caller identity or scope", "a": "Security", "i": 3, "e": 3, "c": ["store"], "why": "getSecret(key) takes only a key. The provider cannot tell which plugin, workflow or session is asking, so it cannot grant one team's secrets only to that team, and it cannot audit who read what. In our view this limits multi-tenant use.", "o": "Pass a context (session, workflow, plugin type) to the provider; log access; support per-session allow lists.", "q": "Are secrets expected to be global to the server, or per session or tenant?"}, {"id": "noTestKit", "t": "No test kit for plugin authors", "a": "Operability", "i": 3, "e": 3, "c": ["pkg"], "why": "The java-test-fixtures plugin is applied but the module has no fixtures. Every plugin author re-creates message builders and a way to run a plugin like the engine (context keys, heartbeat, subscribeOn). Mistakes there make unit tests pass for plugins that fail in a real run.", "o": "Ship fixtures: a message factory, a harness that sets the Reactor context and runs the validation hooks, and a conformance suite (statelessness, ports, config checks).", "q": "What is the smallest harness that would have caught the bugs we saw in plugins so far?"}, {"id": "pmdOff", "t": "PMD is disabled for the test sources", "a": "Governance", "i": 1, "e": 2, "c": ["pkg"], "why": "pmdTest is switched off with a note to re-enable it. The module's tests are the only guard on the sandbox and the defaults, and they are not held to the same rules as the main code.", "o": "Fix the test-source violations and re-enable the task.", "q": "Is the backlog small enough to clear in one change?"}, {"id": "uiHtml", "t": "UiDesign is raw HTML from plugin code (G22)", "a": "Security", "i": 2, "e": 2, "c": ["meta"], "why": "A plugin returns a block of HTML with width and height, which the UI draws. Many plugins repeat nearly identical HTML. A plugin from another team could inject script into the page that shows it. Today all plugins are in the repository, which limits the risk.", "o": "Replace the HTML with a small data record (colour, icon, label) that the UI renders; or sanitise or sandbox the HTML.", "q": "Will third parties supply plugins that appear in the same UI as trusted ones?"}, {"id": "budgetLedger", "t": "Run budgets are per JVM, in memory, and can overshoot", "a": "Governance", "i": 3, "e": 3, "c": ["guard", "store"], "why": "<code>RunBudgets.shared()<\/code> is one static ledger that LLM_CALL and MCP_TOOL_CALL use to stop a run that loops on a model. Four limits follow from its code. (1) The check and the add are separate steps: <code>exceeded<\/code> runs before a call and <code>add<\/code> after it, so calls running at the same time (a node's default concurrency is 256) all pass the check and the run can spend far more than the limit, not just one call more. (2) It keeps the newest 10,000 keys (each agent name is a key of its own), so on a busy server an old but still running run is forgotten and starts again from zero. (3) It is in memory: a resumed run, a restarted server or a new leader starts at zero. (4) It lives in the JVM that runs the plugin, so a node placed on a worker counts against that worker's ledger, not the run's.", "o": "Reserve before the call (add an estimate, then correct it) so concurrent calls see each other; keep a run's entry until the run ends instead of evicting by count; write the totals to the checkpoint store, or at least log them, so a resume restores them; decide whether budgeted plugins may be placed on workers.", "q": "Is a budget a hard guarantee or an estimate? Which one does your finance team expect?"}, {"id": "signalWaitsShared", "t": "Approval waits are one static, in-memory, size-capped object", "a": "Reliability", "i": 2, "e": 2, "c": ["cmds", "proc"], "why": "<code>SignalWaits.shared()<\/code> serves every plugin and run in the JVM. Waits and early signals live in memory only, so a restart or a leader change loses them (the core guide lists this). The cap of 100 early signals is global: one run that fills it makes an early signal for any other run answer NOT_WAITING for up to ten minutes, which core turns into HTTP 409. The signal payload is read with <code>String.valueOf<\/code>, so a missing executionId, nodeId or name becomes the text 'null' and is matched as a key.", "o": "Cap early signals per execution as well as in total; reject a payload that lacks the three key fields; list open waits from a store when one exists (core F2).", "q": "How many approvals can wait at once on your busiest server, and how long?"}], "riskNote": "IDs such as G18 and G22 refer to the plugins module's improvements list, which cross-references this module. The rest are findings from reading the code. Review of 2026-10-15 against main: no risk was closed; the SpEL sandbox risk is partly closed (method allow-list), the store risk is now concrete (PostgreSQL stores), the core-coupling risk grew slightly, and two risks were added for the new shared run-budget and approval-wait helpers.", "adrs": [{"t": "Plugins are Reactor functions over streams, in three kinds", "ctx": "Nodes of a workflow move many messages and must react to a slow consumer without unbounded queues.", "dec": "A trigger returns a Flux, a processor maps Flux to Flux, a terminal consumes a Flux into a Mono. The plugin sees the whole stream, not one message at a time.", "con": "Back-pressure and cancellation come from Reactor for free, and plugins can batch, window or merge. Authors must know Reactor, and a plugin that blocks can stall a thread.", "alt": "A per-message callback (simple, but no batching, no streaming and ordering is the plugin's problem) or a plugin-owned thread pool (hides back-pressure and costs threads).", "rev": "most plugins turn out to be per-message and the Reactor learning curve blocks contributors."}, {"t": "One shared instance per plugin type; settings passed on each call", "ctx": "Plugins are discovered as Spring beans and many nodes can use the same type at once.", "dec": "Core keeps one object per type. Every method receives the node's config. initialize and prepare are repeatable and must not hold state.", "con": "Cheap, simple lookup and no per-node object lifecycle. State mistakes are easy and unchecked; shutdown has no per-node meaning so it is never called.", "alt": "An instance per node (clear state, but a lifecycle and memory cost per node and a factory abstraction) or a per-node context object passed in (explicit, but a larger interface).", "rev": "plugin bugs from shared state keep appearing, or plugins need real per-node resources such as a connection."}, {"t": "Defaults for almost every hook", "ctx": "The interface should stay usable as hooks are added.", "dec": "Only getType and the stream method are required; every other method has a safe default.", "con": "Plugins are tiny and new hooks do not break old plugins. Unused or misleading hooks stay (shutdown, the optimiser hints) and behaviour can change silently.", "alt": "Abstract base classes (hide the interface but force inheritance) or opt-in capability interfaces (honest, but more types and instanceof checks).", "rev": "the number of rarely used hooks makes the contract hard to learn."}, {"t": "Control commands are a closed sealed set of records", "ctx": "Pause, stop, skip, step and restart must go through one channel so they can be ordered, audited and offered to people and programs.", "dec": "A sealed interface of 13 records, each naming its run, with validation in the constructors of the risky ones (SetBreakpoint).", "con": "Exhaustive switches and compile-time safety; easy to serialise and log. The set cannot be extended by plugins.", "alt": "A string command name with a map of arguments (open, but no compile-time check and easy typos) or an open interface (extensible, but no exhaustive handling).", "rev": "plugins need their own operator commands handled by the engine."}, {"t": "Highest priority wins; one processor per command", "ctx": "Operators need to override how a command behaves without editing the engine.", "dec": "Of the processors that accept a command, only the highest getPriority() handles it. Built-ins use 10-20.", "con": "Simple and predictable; overriding is one class. No chaining, so audit around a built-in means re-implementing it. Direction is the opposite of supervisor review order.", "alt": "A chain of interceptors (composable, but order and error rules are complex) or events only (no override).", "rev": "two features want to wrap the same command."}, {"t": "Supervisors are plugins with an event feed and a veto", "ctx": "Automation should react to runs and steer them, but must not be able to harm them or act unchecked.", "dec": "ExecutionSupervisor gets events and emits the same commands as an operator; any supervisor can deny any command; core isolates, rate limits and audits them. The feed is best effort.", "con": "One safe path for human and machine actions, with an audit by actor. Events can be missed and a hung reviewer can block (see risks). The model-based control planes use the same SPI as rule engines.", "alt": "External agents only through REST and SSE (isolation by process, but latency and no veto) or hard-coded rules in the engine (fast, but not extensible).", "rev": "supervisors need guaranteed delivery or must run out of process."}, {"t": "Expressions run in a restricted SpEL context behind one helper", "ctx": "Users write conditions and mappings in workflow settings. Evaluating them with the full expression context allowed arbitrary code on the server (found in an earlier review).", "dec": "All plugins call SpelUtils, which uses the restricted evaluation context with read-only property access and instance methods, and keeps a bounded parse cache.", "con": "One place to harden and test. Still no time budget and instance methods remain.", "alt": "A custom expression language (tighter, but cost and learning) or no expressions (simple, but less flexible).", "rev": "expressions come from untrusted callers, or a cheaper or safer language is needed."}, {"t": "Storage behind interfaces with evolvable defaults", "ctx": "Where checkpoints and secrets live differs per deployment, and the first version of the checkpoint store only kept the last message.", "dec": "NodeCheckpointStore and SecretProvider are interfaces; later hooks (getAll, isComplete, markComplete, isFinished) were added as default methods so earlier stores kept compiling.", "con": "Core can switch memory, file and database stores. Some defaults are weak (isFinished is false) and some calls are synchronous.", "alt": "A concrete class (simple, but fixed storage) or a general key-value store interface (flexible, but vague contracts for completeness and durability).", "rev": "a remote store needs fully non-blocking calls."}], "evo": [{"id": "now", "n": "Today", "d": "A small, working SPI with 16 commands, a supervisor and control-plane SPI, an expression sandbox with a method allow-list, and shared helpers for run budgets and approval waits. Open work is mostly bounds on control calls and expressions, decoupling plugins from core, and tooling for authors.", "r": []}, {"id": "e1", "n": "Bound the control path", "d": "Add review and decide timeouts with a defined outcome, protect stop from being delayed, and align the two ordering rules.", "r": ["reviewNoTimeout", "decideStall", "orderOpposite"]}, {"id": "e2", "n": "Make plugins independent of core", "d": "Move the resolver and map helpers into plugin-api or a support module, expose the registry and tracker through small SPIs, and add an SPI version with a startup check.", "r": ["coreDependency", "noVersion"]}, {"id": "e3", "n": "Tools for plugin authors", "d": "Ship test fixtures with a conformance suite, re-enable PMD for tests, and either call shutdown or remove it.", "r": ["noTestKit", "sharedInstance", "pmdOff", "shutdownNever"]}, {"id": "e4", "n": "Harden expressions and secrets", "d": "Evaluation time budget (the method allow-list is done), parse outside the lock, a run budget that is reserved before the call, scoped and audited secret access, and a data-only UiDesign.", "r": ["spelLimits", "secretThin", "uiHtml", "budgetLedger"]}, {"id": "e5", "n": "Typed and reactive extension seams", "d": "Non-blocking store calls (the PostgreSQL stores now make this concrete), declared node signals, and a decision on the directive layer and the unused optimiser hooks.", "r": ["storeSync", "onSignalLoose", "directiveOnlyStop", "deadHooks", "eventsBestEffort", "signalWaitsShared"]}], "evoLede": "A suggested order. Step 1 comes first because it protects the ability to stop a run.", "prompts": [["Availability", "A supervisor's review calls a slow policy service. What should happen to a human's stop command while it waits?", "sup", "reviewNoTimeout"], ["Evolvability", "You must add a 17th control command. List everything in the repository that breaks and decide if that is a feature or a cost.", "cmds", "directiveOnlyStop"], ["Correctness", "Write the smallest test that proves a plugin is safe to share between two nodes with different configs.", "contract", "sharedInstance"], ["Security", "Name three expressions you would try against the sandbox that are not in the tests. Which layer would stop each?", "spel", "spelLimits"], function curveFor(a,b,ia,ib){var ca=ctr(ia),cb=ctr(ib),clear=function(q){for(var t=0.08;t<0.93;t+=0.06){var x=(1-t)*(1-t)*ca[0]+2*(1-t)*t*q[0]+t*t*cb[0],y=(1-t)*(1-t)*ca[1]+2*(1-t)*t*q[1]+t*t*cb[1];if(hitsBox(x,y,ia,ib))return false}return true};
 var mid=[(ca[0]+cb[0])/2,(ca[1]+cb[1])/2];if(clear(mid))return mid;
 var dx=cb[0]-ca[0],dy=cb[1]-ca[1],len=Math.sqrt(dx*dx+dy*dy)||1,nx=-dy/len,ny=dx/len;
 for(var k=1;k<=5;k++){var off=k*45,cands=[[mid[0]+nx*off,mid[1]+ny*off],[mid[0]-nx*off,mid[1]-ny*off]];for(var j=0;j<2;j++)if(clear(cands[j]))return cands[j]}
 return mid}
var sv="";
D.edges.forEach(function(e){var a=ctr(e[0]),b=ctr(e[1]),via=e[4]||curveFor(a,b,e[0],e[1]),mx=0.25*a[0]+0.5*via[0]+0.25*b[0],my=0.25*a[1]+0.5*via[1]+0.25*b[1];
 sv+='<path class="edge '+e[2]+'" data-e="'+e[0]+'>'+e[1]+'" d="M'+a[0]+','+a[1]+' Q'+via[0]+','+via[1]+' '+b[0]+','+b[1]+'"/>'});
D.comps.forEach(function(c){var p=pos(c);sv+='<g class="box'+(c.flag?" mem":"")+'" data-c="'+c.id+'" tabindex="0" role="button" aria-label="'+esc(c.name)+'"><rect x="'+p.x+'" y="'+p.y+'" width="'+W+'" height="'+H+'" rx="10"/><text class="n" x="'+(p.x+W/2)+'" y="'+(p.y+33)+'" text-anchor="middle">'+esc(c.name)+'</text><text class="s" x="'+(p.x+W/2)+'" y="'+(p.y+53)+'" text-anchor="middle">'+esc(c.tag)+'</text><text class="ram" x="'+(p.x+W-8)+'" y="'+(p.y+15)+'" text-anchor="end">'+esc((D.mapFlag&&D.mapFlag.badge)||"FLAG")+'</text></g>'});
D.edges.forEach(function(e){var a=ctr(e[0]),b=ctr(e[1]),via=e[4]||curveFor(a,b,e[0],e[1]),mx=0.25*a[0]+0.5*via[0]+0.25*b[0],my=0.25*a[1]+0.5*via[1]+0.25*b[1];if(e[3]){var ex=mx,ey=my;if(!hitsBox(ex,ey,null,null)){sv+='<text class="el" x="'+ex+'" y="'+(ey-4)+'" text-anchor="middle">'+e[3]+'</text>'}}});
sv+='<text class="leg" x="20" y="'+(VH-6)+'">'+(D.mapLegend||"Solid = data path · Dashed = control and event path")+'</text>';
svg.innerHTML=sv;
$("#compChips").innerHTML=D.comps.map(function(c){return '<button type="button" data-cb="'+c.id+'">'+esc(c.name)+'</button>'}).join("");
$("#modeBar").innerHTML='<span class="lbl">Mode</span><button type="button" data-m="explore">Explore components</button>'+D.scen.map(function(s){return '<button type="button" data-m="'+s.id+'">'+esc(s.name)+'</button>'}).join("");
if(D.mapFlag)$("#memBtn").onclick=function(){var on=$("#memBtn").getAttribute("aria-pressed")!=="true";$("#memBtn").setAttribute("aria-pressed",on);svg.classList.toggle("showmem",on)};
function scenOf(id){for(var i=0;i<D.scen.length;i++)if(D.scen[i].id===id)return D.scen[i]}
function dl(c){var o=[["Guarantees",c.guar],["State",c.state],["Ceiling",c.ceil],["On failure",c.fail]];return '<dl>'+o.map(function(x){return '<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>'}).join("")+((c.set&&c.set.length)?'<dt>Settings</dt><dd>'+c.set.map(function(s){return '<code>'+s+'</code>'}).join("<br>")+'</dd>':"")+'</dl>'}
function paint(){
 $$("#modeBar button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-m")===mode?"true":"false")});
 $$(".box",svg).forEach(function(g){var id=g.getAttribute("data-c");g.classList.toggle("on",mode==="explore"&&id===sel);g.classList.toggle("act",mode!=="explore"&&active.indexOf(id)>=0)});
 $$(".edge",svg).forEach(function(p){var e=p.getAttribute("data-e").split(">");p.classList.toggle("act",mode!=="explore"&&active.indexOf(e[0])>=0&&active.indexOf(e[1])>=0)});
 $$("#compChips button").forEach(function(b){b.classList.toggle("sel",mode==="explore"&&b.getAttribute("data-cb")===sel)});
 var el=$("#panel");
 if(mode==="explore"){var c=C[sel],pl=(D.plain&&D.plain[c.id])||["",""];el.innerHTML='<h3>'+esc(c.name)+'</h3><p class="refs">'+esc(c.tag)+'</p><div class="plain"><b>In plain words.</b> '+pl[0]+'<br><span class="refs"><b>Why it exists:</b> '+pl[1]+'</span></div><p>'+c.resp+'</p><div class="cols"><div><h4>How it works</h4><ul>'+c.how.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div><div>'+dl(c)+'<h4>Risks here</h4>'+((c.risks||[]).map(riskChip).join("")||'<span class="refs">None recorded.</span>')+'</div></div>'}
 else{var s=scenOf(mode),st=s.steps[step];el.innerHTML='<h3>'+esc(s.name)+' · step '+(step+1)+' of '+s.steps.length+'</h3><p class="refs">'+((D.intro&&D.intro[s.id])||"")+'</p><h4>'+esc(st.t)+'</h4><p>'+st.d+'</p><h4>Components</h4>'+st.c.map(compChip).join("")+((st.r&&st.r.length)?'<h4>What could go wrong</h4>'+st.r.map(riskChip).join(""):"")+'<div class="stepnav"><button type="button" id="prevS"'+(step===0?" disabled":"")+'>Back</button><div class="dots">'+s.steps.map(function(_,i){return '<i class="'+(i<=step?"d":"")+'"></i>'}).join("")+'</div><button type="button" id="nextS"'+(step===s.steps.length-1?" disabled":"")+'>Next</button></div>';
  $("#prevS").onclick=function(){step--;active=s.steps[step].c;paint()};$("#nextS").onclick=function(){step++;active=s.steps[step].c;paint()}}
}
function setMode(m){mode=m;step=0;active=m==="explore"?[]:scenOf(m).steps[0].c;paint()}
function pick(id){sel=id;mode="explore";active=[];paint()}
$("#modeBar").addEventListener("click",function(e){var b=e.target.closest("[data-m]");if(b)setMode(b.getAttribute("data-m"))});
$("#compChips").addEventListener("click",function(e){var b=e.target.closest("[data-cb]");if(b)pick(b.getAttribute("data-cb"))});
svg.addEventListener("click",function(e){var g=e.target.closest("[data-c]");if(g)pick(g.getAttribute("data-c"))});
svg.addEventListener("keydown",function(e){var g=e.target.closest&&e.target.closest("[data-c]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick(g.getAttribute("data-c"))}});
paint();

/* ---- caps ---- */
if(D.caps&&D.caps.length){var groups=[];D.caps.forEach(function(c){if(groups.indexOf(c[0])<0)groups.push(c[0])});var gOn="";
 var capRender=function(){$("#capGrid").innerHTML=D.caps.filter(function(c){return !gOn||c[0]===gOn}).map(function(c){return '<div class="card cap"><div class="grp">'+c[0]+'</div><h3>'+c[1]+'</h3><p>'+c[2]+'</p><p class="refs">'+c[3]+'</p><p class="g">Guarantee: '+c[4]+'</p><p class="l">Limit: '+c[5]+'</p></div>'}).join("")};
 var capFilters=function(){var bar=$("#capFilters");$$("button",bar).forEach(function(b){b.remove()});["All"].concat(groups).forEach(function(g){var b=document.createElement("button");b.type="button";b.textContent=g;b.setAttribute("aria-pressed",(g==="All"&&!gOn)||g===gOn?"true":"false");b.onclick=function(){gOn=g==="All"?"":g;capFilters();capRender()};bar.appendChild(b)})};
 capFilters();capRender()}

/* ---- guarantees ---- */
if(D.guar){var prof=store.get("yk-prof-"+MOD);if(typeof prof!=="number"||!D.guar.profiles||prof<0||prof>=D.guar.profiles.length)prof=D.guar.defaultProfile||0;
 var guarRender=function(){if(D.guar.profiles){var pb=$("#profBar");$$("button",pb).forEach(function(b){b.remove()});D.guar.profiles.forEach(function(p,i){var b=document.createElement("button");b.type="button";b.textContent=p;b.setAttribute("aria-pressed",i===prof?"true":"false");b.onclick=function(){prof=i;store.set("yk-prof-"+MOD,i);guarRender()};pb.appendChild(b)})}
  D.guar.tables.forEach(function(t,i){var head=t.head,rows=t.rows;if(t.profiled){head=[t.head[0],t.head[1]];rows=t.rows.map(function(r){return [r[0],r[1+prof]]})}$("#gt"+i).innerHTML=table(head,rows)})};
 guarRender()}

/* ---- quality ---- */
if(D.quality&&D.quality.length){var qi=0;
 var qRender=function(){var tb=$("#qTabs");tb.innerHTML=D.quality.map(function(q,i){return '<button type="button" role="tab" data-q="'+i+'" aria-pressed="'+(i===qi)+'">'+q.n+'</button>'}).join("");
  var q=D.quality[qi],li=function(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>'};
  $("#qBody").innerHTML='<div class="card"><p style="margin-top:0">'+q.pos+'</p></div><div class="grid g3" style="margin-top:12px"><div class="card"><h3>Ceilings</h3>'+li(q.ceil)+'</div><div class="card"><h3>Levers today</h3>'+li(q.have)+'</div><div class="card"><h3>Needs design work</h3>'+li(q.need)+'</div></div>'};
 $("#qTabs").addEventListener("click",function(e){var b=e.target.closest("[data-q]");if(b){qi=+b.getAttribute("data-q");qRender()}});qRender()}

/* ---- board ---- */
var notes=store.get(NK)||{},view="list",aOn={},stF="",rq="",attrs=[];
D.risks.forEach(function(r){if(attrs.indexOf(r.a)<0)attrs.push(r.a)});attrs.forEach(function(a){aOn[a]=true});
var ab=$("#attrFilters");attrs.forEach(function(a){var b=document.createElement("button");b.type="button";b.textContent=a;b.setAttribute("aria-pressed","true");b.onclick=function(){aOn[a]=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",aOn[a]);board()};ab.appendChild(b)});
function sortR(a,b){return b.i-a.i||a.e-b.e}
function visible(){return D.risks.filter(function(r){var n=notes[r.id]||{};if(!aOn[r.a])return false;if(stF==="none"?!!n.s:(stF&&n.s!==stF))return false;if(rq&&(r.t+" "+r.why+" "+r.o+" "+r.id).toLowerCase().indexOf(rq)<0)return false;return true}).sort(sortR)}
function saveN(id,k,v){var n=notes[id]||{};n[k]=v;if(!n.s&&!n.n)delete notes[id];else notes[id]=n;store.set(NK,notes)}
function board(){var vis=visible(),b=$("#boardBody");
 if(!vis.length){b.innerHTML='<div class="card refs" style="text-align:center">No risks match these filters.</div>';return}
 if(view==="grid"){var cell2=100,m=40,s="",cnt={};
  s+='<rect class="q" x="'+m+'" y="10" width="'+cell2*2.5+'" height="'+cell2*2.5+'"/><rect class="q" x="'+(m+cell2*2.5)+'" y="10" width="'+cell2*2.5+'" height="'+cell2*2.5+'" style="fill:var(--accent-soft)"/><rect class="q" x="'+m+'" y="'+(10+cell2*2.5)+'" width="'+cell2*2.5+'" height="'+cell2*2.5+'"/><rect class="q" x="'+(m+cell2*2.5)+'" y="'+(10+cell2*2.5)+'" width="'+cell2*2.5+'" height="'+cell2*2.5+'"/>';
  s+='<text class="ql" x="'+(m+8)+'" y="28">High impact, low effort: do first</text><text class="ql" x="'+(m+cell2*2.5+8)+'" y="28">High impact, high effort: plan</text><text class="ql" x="'+(m+8)+'" y="'+(10+cell2*5-8)+'">Low impact, low effort: fill in</text><text class="ql" x="'+(m+cell2*2.5+8)+'" y="'+(10+cell2*5-8)+'">Low impact, high effort: question</text>';
  s+='<text class="ql" x="'+(m+cell2*2.5)+'" y="'+(cell2*5+36)+'" text-anchor="middle">Effort →</text><text class="ql" transform="translate(12 '+(10+cell2*2.5)+') rotate(-90)" text-anchor="middle">Impact →</text>';
  vis.forEach(function(r){var k=r.i+"-"+r.e,j=cnt[k]=(cnt[k]||0),dx=(j%3-1)*22,dy=(Math.floor(j/3)-0.5)*22;cnt[k]++;var x=m+(r.e-0.5)*cell2+dx,y=10+(5-r.i+0.5)*cell2+dy;
   s+='<g class="dot" data-open="'+r.id+'" tabindex="0" role="button" aria-label="'+esc(r.t)+'"><circle cx="'+x+'" cy="'+y+'" r="11" fill="'+(r.i>=4?"var(--p0)":r.i===3?"var(--p1)":"var(--p3)")+'"/><text x="'+x+'" y="'+(y+3)+'" text-anchor="middle">'+(D.risks.indexOf(r)+1)+'</text></g>'});
  b.innerHTML='<div class="card"><svg class="matrix" viewBox="0 0 '+(m+cell2*5+10)+' '+(cell2*5+50)+'" role="img" aria-label="Impact versus effort">'+s+'</svg><p class="refs">Dots are numbered by their order in the list view; click one to open it. Red = impact 4-5, amber = 3, grey = lower.</p></div>';return}
 b.innerHTML=vis.map(function(r){var n=notes[r.id]||{};return '<details class="item" id="r-'+r.id+'"><summary><span class="id">'+(D.risks.indexOf(r)+1)+'</span><span class="t">'+esc(r.t)+'</span><span class="meta"><span class="pill '+(r.i>=4?"P0":r.i===3?"P1":"P3")+'">impact '+r.i+'</span><span class="pill P3">effort '+r.e+'</span><span class="pill P2">'+r.a+'</span>'+(n.s?'<span class="pill okp">'+n.s+'</span>':"")+'</span></summary><div class="body"><dl><dt>Why it matters</dt><dd>'+r.why+'</dd><dt>Options</dt><dd>'+r.o+'</dd>'+(r.q?'<dt>Think about</dt><dd><div class="callout q" style="margin:0">'+r.q+'</div></dd>':"")+'<dt>Components</dt><dd>'+(r.c||[]).map(compChip).join("")+'</dd><dt>Your status</dt><dd><select data-st="'+r.id+'" aria-label="Status"><option value="">Unset</option>'+["Idea","Investigating","Planned"].map(function(s){return '<option'+(n.s===s?" selected":"")+'>'+s+'</option>'}).join("")+'</select></dd><dt>Your note</dt><dd><textarea data-nt="'+r.id+'" placeholder="Your thinking...">'+esc(n.n||"")+'</textarea></dd></dl></div></details>'}).join("")}
$("#boardBody").addEventListener("change",function(e){var id=e.target.getAttribute("data-st");if(id){saveN(id,"s",e.target.value)}});
$("#boardBody").addEventListener("input",function(e){var id=e.target.getAttribute("data-nt");if(id)saveN(id,"n",e.target.value)});
$("#boardBody").addEventListener("click",function(e){var d=e.target.closest("[data-open]");if(d)openRisk(d.getAttribute("data-open"))});
$("#vList").onclick=function(){view="list";$("#vList").setAttribute("aria-pressed","true");$("#vGrid").setAttribute("aria-pressed","false");board()};
$("#vGrid").onclick=function(){view="grid";$("#vGrid").setAttribute("aria-pressed","true");$("#vList").setAttribute("aria-pressed","false");board()};
$("#statFilter").onchange=function(e){stF=e.target.value;board()};
$("#rq").oninput=function(e){rq=e.target.value.trim().toLowerCase();board()};
function openRisk(id){view="list";$("#vList").setAttribute("aria-pressed","true");$("#vGrid").setAttribute("aria-pressed","false");aOn={};attrs.forEach(function(a){aOn[a]=true});$$("#attrFilters button").forEach(function(b){b.setAttribute("aria-pressed","true")});stF="";rq="";$("#statFilter").value="";$("#rq").value="";board();
 var d=$("#r-"+id);if(d){d.open=true;d.classList.add("hl");d.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(function(){d.classList.remove("hl")},2000)}}
$("#copyBtn").onclick=function(){var md="# Yukta "+MOD+": my architecture notes\n\n";var any=false;D.risks.forEach(function(r){var n=notes[r.id];if(!n)return;any=true;md+="## "+r.t+"\n- Attribute: "+r.a+" · impact "+r.i+" · effort "+r.e+"\n"+(n.s?"- Status: "+n.s+"\n":"")+(n.n?"- Note: "+n.n.replace(/\n/g,"\n  ")+"\n":"")+"\n"});
 var msg=$("#copyMsg"),ta=$("#copyArea");if(!any){msg.textContent="Nothing to copy yet. Set a status or note first.";return}
 ta.hidden=false;ta.value=md;ta.rows=10;
 var done=function(){msg.textContent="Copied."},fail=function(){msg.textContent="Select the text below and copy it."};
 try{navigator.clipboard.writeText(md).then(done,fail)}catch(e){fail()}};
board();

/* ---- jumps ---- */
document.addEventListener("click",function(e){var r=e.target.closest("[data-risk]");if(r){e.preventDefault();openRisk(r.getAttribute("data-risk"));return}
 var c=e.target.closest("[data-comp]");if(c){e.preventDefault();pick(c.getAttribute("data-comp"));$("#map").scrollIntoView({behavior:"smooth"})}});
document.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target;if(t.matches&&t.matches("a.chip,.dot")){e.preventDefault();t.click?t.click():0}});

/* ---- prompts ---- */
if(D.prompts&&D.prompts.length){var pi=0;
 var deck=function(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
  $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}};
 deck()}
/* ---- glossary ---- */
function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
</script>
