<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta plugin-api Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
  <div class="others" id="others"></div>
</nav>
<main id="main"></main>

<script>
var DATA = {"module": "plugin-api", "title": "How Yukta plugin-api works, and where it can break", "htmlTitle": "Yukta plugin-api Guide", "date": "2026-10-15", "glance": {"lede": "plugin-api is the contract between Yukta's engine and the code that does the actual work. Every node in a workflow (call an API, ask a model, wait for a person) is a plugin that implements one of three small interfaces here, and every supervisor that watches or steers runs implements another. The module holds almost no logic of its own: it holds the shape of the conversation. This page is for thinking about that contract: open a component, replay a scenario, then challenge the weak spots.", "props": [["Three small shapes", "A trigger produces a stream of messages, a processor turns one stream into another, a terminal consumes a stream. Everything else on the interface has a safe default, so a plugin can be three methods long."], ["One shared instance", "Core creates one object per plugin type and uses it for every node, workflow and session. State must travel in the config argument, not in fields. This is documented, not enforced."], ["Control as data", "Pause, stop, skip, step, restart and breakpoints are 16 typed commands. Supervisors (rules, models, your code) read events and emit the same commands, and can also veto any command."], ["A thin, sandboxed toolbox", "Expression evaluation, failure routing and config checks are shared helpers, so plugins do not each invent them. The expression helper cannot call static code or construct objects."]], "start": [["primer", "Primer", "The problem, the vocabulary and one plugin followed from startup to stop"], ["map", "System map", "Ten components: contract, metadata, commands, supervisors, stores, helpers"], ["map", "Replay a scenario", "A plugin lifecycle, a bad config, a failure, an operator stop, a supervisor, a hung reviewer"], ["reference", "Contract table", "Every method, its default and who calls it, plus a write-a-plugin checklist"], ["quality", "Stress it", "Scalability, security and evolvability lenses (some barely apply to an interface module)"], ["board", "Challenge it", "14 open risks on an impact x effort grid"], ["adrs", "Decisions", "Eight decisions with the condition that should make us revisit each"], ["glossary", "Glossary", "Plain definitions of every term used here"]]}, "primer": {"problem": "Yukta runs workflows: graphs of steps such as 'receive a webhook, classify with a model, call an API, notify someone'. The engine (core) should not know how to call every API or model, and the people who write those steps should not need to know how the engine schedules, retries or stops things. <b>plugin-api<\/b> is the agreement between the two sides. It is a small Java library of interfaces and helpers that core, the REST layer and the built-in plugins all compile against. A new plugin is a class that implements one interface; the engine discovers it and calls it.", "analogy": "Think of a power socket standard. The socket (this module) defines the shape of the pins, the voltage and what a safety cut-off looks like. Appliances (plugins) can be anything as long as they fit. The building (core) provides power and can cut it. There is also a smoke detector standard (supervisors): any detector that fits the socket can listen to what is happening and trip a breaker, and a second kind of device can refuse to let a breaker be tripped.", "layersTitle": "Where plugin-api sits", "layers": [["plugins", "The code that does the work: HTTP_REQUEST, LLM_CALL, rule-based control planes. They implement this contract.", ""], ["plugin-api", "The contract: three plugin kinds, control commands, supervisor and store interfaces, small helpers. This page.", "me"], ["core", "The engine. Finds plugins, validates and runs them, applies control commands, hosts supervisors.", ""], ["web / mcp / ui", "Read plugin descriptors and config schemas to build forms and API answers, and send control commands.", ""], ["messaging", "The Message type that flows through every plugin. plugin-api exposes it to its users.", ""]], "layersNote": "plugin-api has no running code of its own: no threads, no server, no database. Its only dependencies are Reactor (streams), the jakarta annotations, the messaging module, and Spring's expression library (kept private).", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["Plugin", "A class that gives a workflow node its behaviour. It has a unique type string (for example HTTP_REQUEST) that workflow definitions refer to.", "A node of type LLM_CALL is run by the one plugin object whose getType() returns LLM_CALL."], ["Three kinds", "A <b>trigger<\/b> starts data flowing (no input). A <b>processor<\/b> receives a stream and returns a stream. A <b>terminal<\/b> receives a stream and finishes it (save, send, notify).", "A webhook is a trigger, a classifier is a processor, an email sender is a terminal."], ["Message and port", "The unit of data passed between plugins: a payload plus headers. A plugin can have several named output ports; the default port is called 'default'.", "A filter has ports match and discard; failed messages go out on a port named 'error'."], ["Shared instance", "Core creates one plugin object per type and reuses it for every node. Settings arrive as a map on every call, so the object itself must hold no per-node state.", "Two LLM_CALL nodes with different prompts use the same Java object and different config maps."], ["Config and descriptor", "A node's settings are a plain map. A plugin may describe itself (text, usage, a small HTML picture) and declare its fields so the UI can draw a form instead of a raw JSON box.", "A field list says 'url: required string, method: one of GET/POST'."], ["Control command", "A typed instruction to a live run, such as pause the workflow, skip a node or stop. There are exactly 13, defined here as a closed list.", "StopWorkflowCommand with mode DRAIN."], ["Supervisor", "A watcher that receives events from all runs and may emit control commands, and may also approve or refuse any command before it runs.", "A rule says 'if a node fails 3 times, pause the workflow'."], ["Checkpoint", "The last message each node produced in a run, kept by a store so a run can be restarted from a node without redoing the earlier work.", "Restart from node C replays the saved outputs of C's direct parents."]], "ex": {"title": "One plugin, from startup to stop", "lede": "A processor plugin called HTTP_REQUEST used in one workflow. Click a stage to see what happens, why, and what can go wrong.", "viewBox": "0 0 880 230", "labels": ["What happens", "Why it is built this way", "Can go wrong"], "legend": "Green = before the run · Blue = during the run · Grey = ending · Dashed red = failure route", "start": "run", "nodes": [{"id": "register", "n": "Registered", "s": "startup", "k": "t", "x": 10, "y": 40, "does": "At startup Spring collects every Plugin bean into a list and core puts them in a map keyed by getType(). One object per type is kept.", "adds": "A map keyed by type makes lookups trivial for every later step. Two plugins with the same type would make a workflow ambiguous, so core refuses to start and names both classes.", "wrong": "A plugin that keeps per-node state in a field works in a demo with one node and breaks when two nodes share the object. Nothing checks this."}, {"id": "validate", "n": "Validated", "s": "config + graph", "k": "t", "x": 190, "y": 40, "does": "When a workflow is validated (before it runs), core calls validateConfig(config) for every node, then validateInContext(context, config) with the node's incoming and outgoing edges. Both return a Mono that errors if the settings or the graph position are wrong.", "adds": "Failing here means the user sees 'url is required' immediately, not after half the workflow has run. The context lets a plugin check things the config cannot show, such as 'I need exactly one incoming edge'.", "wrong": "A plugin that skips validation turns a typo into a runtime error deep in a run. ConfigValidation has helpers (positive number, required text) to make the checks one line."}, {"id": "prepare", "n": "Prepared", "s": "initialize, prepare", "k": "t", "x": 370, "y": 40, "does": "Right before a run, core calls initialize(config) and then prepare(config) for each node. A plugin pre-parses expressions or warms a cache here.", "adds": "Parsing once up front keeps the hot path fast. SpelUtils.preParse(expression) fills a bounded cache of 1000 parsed expressions.", "wrong": "These methods run again for every node that uses the same plugin, on the same shared object. If one stores its argument in a field, the last node wins."}, {"id": "run", "n": "Runs", "s": "process(input, config)", "k": "p", "x": 550, "y": 40, "does": "Core calls process(input, config) once per run of the node. The plugin returns a stream of output messages. A plugin that blocks (a database call) says isBlocking() is true and core runs it on a virtual thread.", "adds": "The engine, not the plugin, owns the timeout (the node's timeoutSeconds, else getDefaultTimeout(config), 30 s unless overridden), the buffer size (default 1024) and thread choice. A long job tells the engine it is alive through the heartbeat so the idle timeout restarts.", "wrong": "A blocking call in a plugin that said isBlocking() is false ties up a shared reactive thread. A long silent step with no heartbeat looks dead and times out."}, {"id": "fail", "n": "Failure routed", "s": "PluginGuard", "k": "p", "x": 730, "y": 40, "does": "When the HTTP call fails, a plugin that wraps its work in PluginGuard.guard(...) either raises the error (FailureMode ERROR, the default) or re-emits the input message on the port named 'error' with failure details (FailureMode CONTINUE).", "adds": "One shared helper gives every plugin the same two behaviours and the same OK/ERROR metric counts. A downstream node on the error port can then retry, alert or store the failed message.", "wrong": "A plugin that invents its own error convention breaks routing: a workflow author cannot rely on 'error' meaning the same everywhere."}, {"id": "signal", "n": "Control signal", "s": "onControlSignal", "k": "p", "x": 370, "y": 150, "does": "An operator sends a message addressed to one node (workflow id plus node id). Core looks up the live plugin and calls onControlSignal(message). The plugin may reply with a message or nothing.", "adds": "This is separate from the 16 typed commands (pause, stop). Those go to the engine; this one goes to the plugin itself, for plugin-specific actions.", "wrong": "The payload is an untyped message and the contract does not describe which signals a plugin understands, so callers must know by convention."}, {"id": "stop", "n": "Stopped", "s": "StopWorkflowCommand", "k": "e", "x": 550, "y": 150, "does": "A StopWorkflowCommand (mode DRAIN, CANCEL or KILL) is turned into a Stop directive and applied. DRAIN stops the triggers and lets in-flight work finish; CANCEL and KILL cancel the streams at once, which a plugin sees as an ordinary Reactor cancel signal.", "adds": "Cancel is the only stop signal a plugin sees, so cleanup belongs in doOnCancel or doFinally on the stream they return.", "wrong": "A plugin that ignores cancel keeps working after the run ended, for example an open HTTP call."}, {"id": "shutdown", "n": "Shutdown?", "s": "never called", "k": "e", "x": 730, "y": 150, "does": "The contract has shutdown(config) for releasing resources. Core never calls it, because the one shared object serves every workflow.", "adds": "Release long-lived resources through the owning Spring bean's lifecycle (for example a @PreDestroy method), not through this method.", "wrong": "A plugin author reading the interface assumes shutdown runs and leaks a connection pool."}], "edges": [["register", "validate"], ["validate", "prepare"], ["prepare", "run"], ["run", "fail", "err", "error"], ["run", "signal"], ["signal", "stop"], ["stop", "shutdown"]], "json": {"title": "A minimal processor in Java", "note": "Real signatures. Note the payload accessor is payload(), and config is read inside the call, not stored.", "text": "@Component\npublic class UppercasePlugin implements ProcessorPlugin {\n  public String getType() { return \"UPPERCASE\"; }\n\n  public Flux<Message<?>> process(\n      Flux<Message<?>> input, Map<String, Object> config) {\n    return input.map(m -> m.withPayload(String.valueOf(m.payload()).toUpperCase()));\n  }\n}"}}, "wrapper": {"title": "What always applies when core runs a plugin", "lede": "The plugin author writes only the behaviour. These steps happen around it for every node, and they are the reason the interface can stay small.", "steps": ["Found by its unique type string", "Config and graph position validated", "initialize and prepare called", "process / start / consume called, on a virtual thread if blocking", "Timeout from node config or plugin default, restarted by heartbeat"]}, "story": {"title": "plugin-api in plain words", "steps": [["Describe", "A plugin says its type, its kind and optionally its settings and a short description."], ["Register", "Core collects every plugin object and refuses to start if two share a type."], ["Check", "Before a run, the plugin is asked whether the settings and the node's place in the graph make sense."], ["Run", "The plugin turns an input stream into an output stream; the engine wraps timeouts, threads and counts around it."], ["Fail", "If a call fails, a helper either raises the error or sends the message down the 'error' port."], ["Steer", "Operators and supervisors send typed commands; processors turn them into actions; supervisors can veto."], ["Remember", "A store keeps each node's last output so a run can restart from the middle."]]}, "paths": [["New to the module", "Primer, then the plugin lifecycle scenario on the map, then the contract table in Reference.", "primer"], ["Writing a plugin", "Reference (contract table and checklist), then Guarantees (what is enforced and what is only convention).", "reference"], ["Reviewing for improvements", "Quality lenses, then the risk board, then Decisions for what you would revisit.", "quality"]]}, "plain": {"contract": ["The socket every workflow node plugs into. Three flavours (start, transform, finish) share a base with a long list of optional hooks, all with safe defaults.", "Without one agreed shape, the engine would need custom code for every kind of step, and plugin authors would have to learn the engine's insides."], "meta": ["The name tag and form definition of a plugin: a description, a usage note, an optional small HTML picture, and a list of settings with types and defaults.", "The UI, the REST API and agents need to show what a plugin does and how to configure it without running it or reading its code."], "ctx": ["Two small pieces of information about a node: where it sits in the graph (its neighbours) and a way for a long job to say 'I am still alive'.", "A plugin cannot judge a graph rule without seeing its edges, and a long step looks dead to the engine unless it can signal progress."], "spel": ["The shared calculator for expressions written in workflow settings, such as a filter condition. It reads data and calls simple methods but cannot start programs or create objects.", "Workflow definitions come from users and over the network. Without a sandbox, an expression could run arbitrary code on the server."], "guard": ["Shared helpers for the boring parts of a plugin: what to do when a call fails (stop, or route to the error port), counting successes and failures, checking numeric settings, and a small set of error types.", "Each plugin would otherwise invent its own error convention and its own config checks, and workflows could not rely on any of them."], "cmds": ["The complete, closed list of instructions you can give a live run: pause, resume, stop, skip, step, restart, set a breakpoint. Each is a small typed record that names its target run.", "A closed list of typed commands can be checked by the compiler, logged, replayed and offered to humans, scripts and supervisors alike."], "proc": ["The hook for customising what a command does. A processor accepts one command type and either does the work itself or returns an action (a directive). If several accept the same command, the one with the highest priority wins.", "Operators need to override or extend command behaviour (add audit, change a restart) without editing the engine."], "sup": ["The slot for automated watchers. A supervisor receives a feed of events from every run and may emit commands, and may also approve or refuse any command. A control-plane plugin is a simpler form that judges one event at a time.", "People cannot watch every run. Automation (rules, a model, your own code) should be able to react, but with a veto so it cannot act unchecked."], "store": ["Two storage interfaces: one keeps each node's last output for a run (so you can restart in the middle), the other looks up a secret by name.", "Core must not care whether outputs live in memory, files or a database, and plugins must not carry credentials in workflow definitions."], "pkg": ["How the module is built and tested: its dependencies, its tests, and the (so far empty) test-fixtures setup meant to help plugin authors.", "Every plugin and the engine compile against this library, so its dependencies and its test coverage decide how safe changes are."]}, "comps": [{"id": "contract", "name": "Plugin contract", "tag": "Plugin + 3 kinds", "c": 0, "r": 0, "flag": true, "resp": "Defines what every workflow node plugin must provide and what it may override. The base interface Plugin has two required members (a unique type string and a category); each kind adds one required stream method.", "how": ["Three kinds extend the base. A trigger implements start(config) and returns a Flux of messages (a Flux is a stream of zero or more items). A processor implements process(input, config) and returns a Flux. A terminal implements consume(input, config) and returns a Mono (a result that completes once) that finishes when everything was consumed. The category (TRIGGER, PROCESSOR, TERMINAL) is filled in by the kind, so an author does not write it.", "Everything else has a default. Timeout 30 seconds, buffer size 1024, one output port named 'default', not blocking, validation passes, initialize/prepare/shutdown do nothing, no control-signal handling. A plugin that overrides nothing but the two required members is valid. Example: the three-line uppercase processor in the primer.", "Two defaults take the node's config: getOutputPorts(config) and getDefaultTimeout(config). They exist because the answer can depend on settings. A router whose ports come from its config returns different ports per node; an LLM call with retries returns a longer timeout than a plain HTTP call, so the engine does not cut it off at 30 seconds.", "isBlocking() tells core how to run the plugin. If true, core subscribes it on a virtual thread (a cheap thread that can wait on I/O without hogging a CPU thread). If false (default), the plugin runs on the reactive threads and must never block. The plugin does not choose the thread itself.", "Core keeps one shared instance per type. At startup the registry builds a map from getType() to the object and throws if two plugins share a type, naming both classes, so a conflict is a startup failure, not a wrong node at runtime. Because one object serves every node, per-node settings must come from the config argument on each call.", "Validation has two hooks. validateConfig(config) checks settings alone. validateInContext(context, config) also sees the node's incoming and outgoing edges. Both return a Mono that errors on failure. initialize and prepare run once per node before a run, on the same shared object, so they must be repeatable and only warm caches."], "guar": "The compiler guarantees that a plugin supplies a type, a category and its stream method. Core guarantees unique types at startup. Statelessness of the shared instance is a rule in the Javadoc, not something the code checks.", "state": "None in this module. Interfaces only. Whatever a plugin keeps in its own fields is lost on restart and shared across all nodes of its type.", "ceil": "The contract has 18 members, which is a lot for a plugin author to learn, though only 3 are required. Adding a new default method is safe; adding an abstract one breaks every plugin.", "fail": "A plugin that returns a Flux that errors fails its node; engine policy then applies. shutdown(config) exists but core never calls it, and isComputationallyHeavy and suppressOptimizationHint are not read by core.", "set": ["getType()", "getCategory() (filled by the kind)", "getDefaultTimeout(config), default 30 s", "getDefaultBufferSize(), default 1024", "isBlocking(), default false"], "risks": ["sharedInstance", "shutdownNever", "deadHooks", "noVersion", "onSignalLoose"]}, {"id": "meta", "name": "Metadata & schema", "tag": "describe, ConfigField, UiDesign", "c": 1, "r": 0, "resp": "Lets a plugin describe itself and its settings without being run, so UIs, REST and agents can list and configure plugins.", "how": ["describe() returns a PluginDescriptor with three parts: a description, a usage pattern (free text, such as a sample config), and an optional UiDesign. The default is an empty descriptor, so describing is optional.", "UiDesign carries a small block of HTML plus a width and height. The UI draws it as the node's picture. Many plugins repeat nearly the same HTML (colour, icon, label), which is a known duplication in the plugins module.", "getConfigSchema() returns a list of ConfigField entries: name, type, required flag, default, allowed options and a one-line description. Types are STRING, NUMBER, BOOLEAN, ENUM, LIST, MAP, EXPRESSION and SECRET. EXPRESSION means 'edit as a SpEL or template text in a code-style box'; SECRET means 'the value should be a decrypted:<key> reference, not the credential itself'.", "If the schema is empty (the default) the UI falls back to a raw JSON editor and the usage pattern text. So a plugin with no schema still works, but the form is poorer.", "Three factory methods keep declarations short: required(name, type, description), optional(name, type, default, description) and choice(name, required, default, description, options...) which produces an ENUM."], "guar": "Field options are copied into an immutable list. Descriptor and schema are read-only data with safe empty defaults.", "state": "None. Read by web (the plugin list endpoint) and by the graph service that describes workflows.", "ceil": "The schema is flat: no nested objects, no conditional fields (show field B only if field A is X), and no validation rules beyond required and the options list.", "fail": "The schema is not checked against what the plugin really reads. If the code reads a key the schema omits, the UI form hides a real setting; the module's CLAUDE.md asks authors to keep names in step by hand.", "set": ["ConfigField.Type: STRING NUMBER BOOLEAN ENUM LIST MAP EXPRESSION SECRET", "PluginCategory: TRIGGER PROCESSOR TERMINAL"], "risks": ["uiHtml"]}, {"id": "ctx", "name": "Graph context, liveness", "tag": "WorkflowContext, heartbeat", "c": 0, "r": 1, "resp": "Gives a plugin two pieces of engine information: the edges around its node during validation, and a way to report liveness during a long run.", "how": ["WorkflowContext holds the node id, the list of outgoing edges and the list of incoming edges. Each edge records source, target and the optional source port. Core builds it for each node during validation and passes it to validateInContext. The constructor copies the lists, so later changes by the caller are not seen.", "A plugin can use the context to enforce a graph rule. Example: a JOIN-like plugin rejects a workflow in which it has fewer than two incoming edges, with a clear message, before anything runs.", "The heartbeat is a Reactor context entry under the key 'yukta.heartbeat'. Its value is a Runnable. A long-running plugin reads it with Mono.deferContextual and runs it now and then. Each call restarts the node's idle timeout. Example: a 10-minute process step that prints progress every minute calls the heartbeat each time so it is not declared dead after 30 seconds of silence.", "The key is absent outside a workflow run (for instance in a unit test), so plugins must handle a missing key. Core also puts execution, node, workflow and session ids in the same Reactor context under its own keys; those are core's, not defined here."], "guar": "The context is immutable once built. The heartbeat only restarts the idle clock; it does not extend a hard overall limit.", "state": "None. The heartbeat is per subscription and lives only for the run.", "ceil": "Only direct neighbours are visible, not the whole graph, so a plugin cannot check a rule like 'there is a terminal somewhere downstream'.", "fail": "If a plugin never beats and works silently longer than its idle timeout, the engine times the node out as if it were dead.", "set": ["WorkflowContext.HEARTBEAT_KEY = yukta.heartbeat"], "risks": ["sharedInstance"]}, {"id": "spel", "name": "Expression sandbox", "tag": "SpelUtils (SpEL, cached)", "c": 1, "r": 1, "flag": true, "resp": "Evaluates the expressions that users write in workflow settings (a filter condition, a branch rule, a mapping) against a message, inside a restricted context.", "how": ["It uses Spring's SpEL (Spring Expression Language, a small expression syntax) with a SimpleEvaluationContext, the restricted variant. Allowed: read properties, read map keys, call a short list of safe methods (such as name.startsWith('x'); about 40 names plus everything in java.time), and use variables passed in (#n). Not allowed: static access T(java.lang.System), constructors (new java.io.File), and bean references (@someBean). Tests assert each of these is rejected, including 'a'.getClass().forName(...).", "Why this matters: expressions come from workflow definitions, which come from users over REST or MCP. The original design used the full evaluation context, which let a workflow author run any Java code on the server. The restricted context closed that hole (an old review finding, now fixed).", "Parsed expressions are cached in a least-recently-used map of at most 1000 entries, so the same expression text is parsed once. The cache is guarded by one lock. preParse(text) lets a plugin parse during prepare; blank text is ignored.", "Two entry points: evaluateSync(expression, root[, variables]) returns the value directly, and evaluate(...) wraps it in a Mono that runs when subscribed. A fresh evaluation context is built per call, so variables set by one call never leak into the next (a test checks this).", "The result type is chosen by the caller through generics, with no check. A caller that expects a Boolean and gets a String fails with a ClassCastException at the call site."], "guar": "No static calls, no object construction, no bean access, no property writes; variables never leak between calls; the parse cache never exceeds 1000 entries.", "state": "A process-wide static cache of parsed expressions, lost on restart (it only saves parsing time).", "ceil": "One lock around the cache, and parsing happens while holding it. There is no evaluation timeout: an expression that loops through a large collection runs until it finishes.", "fail": "A bad expression throws a SpEL exception; nothing is cached for it. Callers should surface it as a config error in validateConfig by parsing early.", "set": ["MAX_CACHED = 1000 (not configurable)"], "risks": ["spelLimits", "sharedInstance"]}, {"id": "guard", "name": "Failure & config helpers", "tag": "PluginGuard, FailureMode", "c": 0, "r": 2, "resp": "Shared building blocks so every plugin handles failure, metrics and config checking the same way: PluginGuard, FailureMode, PluginMetricsReporter, ConfigValidation, ResultCollector, MessageMapper and three exception types.", "how": ["FailureMode has two values. ERROR (default) lets the exception fail the node. CONTINUE turns the failure into a message. FailureMode.from(value) parses a config text case-insensitively; null gives ERROR; anything else throws an IllegalArgumentException that lists the valid values.", "PluginGuard.guard(operation, input, mode, reporter, metric) wraps one message's work. On success it counts OK. On failure it counts ERROR and then either re-raises (ERROR mode) or returns the original input with failure details attached (the plugin's node id, the exception class name and its message) and its source port set to 'error' (CONTINUE mode). A downstream edge from the 'error' port can then deal with it. PluginGuard.counted(flux, ...) only counts, for plugins that handle failures themselves.", "PluginMetricsReporter is a one-method interface: increment(nodeId, metric, tag). The default NOOP drops everything. Core supplies a real one; the tag is OK or ERROR here, and plugin-specific words such as MATCH or DISCARD elsewhere.", "ConfigValidation gives fail-fast readers: positiveLong, positiveInt (also checks the int range) and requiredString. They reject zero, negatives, fractions, infinity and values too large to store, so a config of 1e30 cannot silently become a wrong number.", "ResultCollector is a thread-safe bucket used by sub-workflow execution to gather final messages from terminal nodes. MessageMapper is a two-method interface for converting a message payload to a domain object and back while keeping headers. The exceptions (WorkflowExecutionException, plus FilterEvaluationException and NoMatchingBranchException) give plugins a technology-neutral error type."], "guar": "Using guard gives the same two failure behaviours and the same metric counts in every plugin that uses it. Config readers never return an out-of-range number.", "state": "None, except ResultCollector, which holds messages in memory for the life of one sub-workflow call.", "ceil": "Adoption is by choice. A plugin that ignores these helpers is still valid; nothing forces consistency. The error port name 'error' is a string constant, not a type.", "fail": "In CONTINUE mode the failure message leaves through port 'error'. If no edge uses that port, the message is not delivered anywhere useful, so a workflow author must wire it.", "set": ["PluginGuard.ERROR_PORT = error", "FailureMode ERROR | CONTINUE (parsed from config text)", "ConfigValidation: positiveLong, positiveInt, requiredString"], "risks": ["sharedInstance", "budgetLedger"]}, {"id": "cmds", "name": "Control commands", "tag": "sealed set of 16 commands", "c": 2, "r": 0, "resp": "Defines every instruction an operator, API caller or supervisor can send to a live run, as a closed list of typed records.", "how": ["ExecutionControlCommand is a sealed interface: the list of allowed types is fixed in the declaration, so a switch over it needs no default branch and adding a command makes every switch fail to compile until it handles the new one. Every command names its target run through executionId().", "Run-level: PauseWorkflow, ResumeWorkflow, StopWorkflow (with a reason and a StopMode), Restart and RestartFromNode (both carry a pre-generated id for the new run, so the caller can poll it at once). Node-level: PauseNode, ResumeNode, StopNode (immediate or drain, with reason), SkipNode (true or false), EnableStepMode, DisableStepMode, StepNode, and SetBreakpoint. That is 13 in total.", "StopMode has three values. DRAIN (default) stops the triggers and lets work in flight finish, cancelling it if it does not finish before the drain deadline. CANCEL cancels every node's subscription at once so plugins can clean up. KILL cancels and also removes the execution, so later commands for it are refused.", "SetBreakpoint takes a field and a text. The field must be 'payload', 'payload.some.path' or 'metadata.key', and the node holds before the first element whose value's text equals the given text. The record's constructor rejects any other field, and rejects a field without a value. A null field clears the breakpoint. The condition is declarative on purpose: it can arrive from a remote caller, so it must not be code.", "ControlActor.CONTEXT_KEY ('yukta.control.actor') names the Reactor context entry that carries who sent a command. It is empty for API callers and holds the supervisor's id for supervisor commands, which is how the audit log writes 'PauseWorkflowCommand [by my-supervisor]'.", "SkipNode on a running run only works for processors; core rejects other node types. It takes effect from the next element, and an element already inside the plugin finishes normally."], "guar": "The set is closed and checked by the compiler; SetBreakpoint cannot be built with an invalid field; StopWorkflow never has a null mode.", "state": "None here. Commands are values. Core orders them per run, applies them and logs them.", "ceil": "Adding a command is a breaking change for every exhaustive switch in the repo, by design. The list is fixed at compile time, so a third-party plugin cannot define its own command type.", "fail": "A command for an unknown run is rejected by core with a not-found error. Commands whose processor throws are recorded as rejected.", "set": ["StopMode DRAIN | CANCEL | KILL", "ControlActor.CONTEXT_KEY = yukta.control.actor"], "risks": ["reviewNoTimeout", "onSignalLoose", "signalWaitsShared"]}, {"id": "proc", "name": "Command processing", "tag": "ControlSignalProcessor", "c": 3, "r": 0, "flag": true, "resp": "The extension point that turns a command into an action: the interface a processor implements, the priority rule, and the directive type a processor may return.", "how": ["A ControlSignalProcessor answers canProcess(command) with true or false and implements process(command), which returns a Mono of a WorkflowDirective, an empty Mono, or an error. Spring beans of this type are collected by core's directive dispatcher.", "When several processors accept a command, the one with the highest getPriority() handles it and the rest are skipped. The default is 0; the built-in processors use values from 10 to 20. To override a built-in, a custom processor must return more than that built-in's priority (above 20 beats all). Example: a processor with priority 30 that turns Restart into RestartFromNode for specific nodes.", "A processor can act in two ways. It can do the work itself and return an empty Mono (this is what most built-ins do for pause, skip and so on). Or it can return a directive for the dispatcher to apply. The only directive today is Stop(reason), so only 'stop this run' can be handed back; everything else is done inside the processor.", "Ordering and acknowledgement are core's job, not this interface's: core runs the commands of one run strictly one after another, tells the caller when the command was applied or rejected, and records it."], "guar": "Exactly one processor handles each command (the highest priority among those that accept). The directive set is sealed, so the dispatcher's switch is exhaustive.", "state": "None.", "ceil": "No chain: a second processor cannot add audit around a first. If two accept at equal priority, the winner is the first one in Spring's bean list; the contract does not define that.", "fail": "If no processor accepts a command, core fails the call with 'No processor registered for command'. A processor error becomes a rejection recorded in the log.", "set": ["getPriority(), default 0; built-ins 10-20", "WorkflowDirective.Stop(reason)"], "risks": ["orderOpposite", "directiveOnlyStop", "signalWaitsShared"]}, {"id": "sup", "name": "Supervisor SPI", "tag": "supervise, review, decide", "c": 2, "r": 1, "flag": true, "resp": "Lets automated decision makers (rule engines, models, custom code) watch execution events, emit commands, and approve or refuse any command.", "how": ["ExecutionSupervisor has three members: id() (unique, used in audit and metrics), supervise(events) which receives the event stream and returns commands, and review(request) which returns Allow or Deny for any command. The default review allows everything and the default order() is 0.", "The events are four types: NodeStatusChanged, WorkflowStatusChanged, ControlOutcome (a command was applied or rejected, with who sent it) and LogLine. The feed is best effort by design: a supervisor that cannot keep up misses events instead of slowing the runs. Core counts drops in yukta.tracker.dropped.", "Review is a veto in a line. Core asks the supervisors in order() sequence, lowest first, and the first denial refuses the command. If a supervisor's review throws an error, that counts as a denial ('review failed'). The caller gets a rejection (HTTP 403) and the log records it. Example: a supervisor denies StopWorkflow for runs tagged 'billing' unless sent by a human.", "ControlPlanePlugin is the simple form: implement decide(event) which returns a ControlDecision (a list of commands, a confidence from 0 to 1, and a source RULE or MODEL). Its supervise handles events one at a time in order, treats an error from decide as no opinion, and emits the commands. Core reads only the commands; confidence and source are for the plugins that combine decisions (a rules-first plugin consults rules before a model).", "Core isolates supervisors: it subscribes each once at startup, resubscribes after a failure with backoff from 1 second up to 1 minute, rate limits commands (20 per second per supervisor by default), supports dry-run (commands are only recorded), and does not deliver a supervisor's own command outcomes back to it. These limits live in core's SupervisorHost, not here.", "ControlRequest carries the command and the actor (a supervisor id, or null for an API caller). Decision is a record of allowed and a reason, with Decision.ALLOW and Decision.deny(reason)."], "guar": "Every command, human or automated, can be vetoed; a failing reviewer denies rather than allows; a supervisor failure never stops a run.", "state": "None here. Core holds subscriptions and counters in memory.", "ceil": "decide() handles one event at a time per plugin, so the speed of one slow decision (a model call) caps the plugin's event rate. The event feed has no replay.", "fail": "review() has no timeout in the contract or in core's reviewer; a review that never completes blocks later commands for that run. A decide() that never completes stalls all later events for that plugin. The Javadoc asks authors to bound both.", "set": ["yukta.supervisor.max-commands-per-second (core, default 20)", "yukta.supervisor.dry-run (core, default false)", "GET /api/supervisors (core)"], "risks": ["reviewNoTimeout", "decideStall", "orderOpposite", "eventsBestEffort"]}, {"id": "store", "name": "Store SPIs", "tag": "NodeCheckpointStore, Secret", "c": 3, "r": 1, "flag": true, "resp": "Two storage interfaces that core implements: NodeCheckpointStore (each node's output per run) and SecretProvider (credential lookup).", "how": ["NodeCheckpointStore.save(executionId, nodeId, message) records the last message a node emitted; get returns it. When a run is restarted from a node, core reads the checkpoint of that node's direct parents and replays them as synthetic input, so earlier nodes do not run again.", "Three methods have defaults so older stores keep compiling. getAll returns every message a node produced (the default knows only the last). isComplete says whether nothing was dropped (a store with a size cap reports false once it has dropped, so a restart never replays half an output as if whole). markComplete and isFinished record and report that a node ended normally and all its output is safe; a durable store must make the marker survive a crash before its Mono completes.", "The engine calls markComplete once when a node's stream completes (never for a failure or a stop) and waits for it before passing the completion on. A failure writing the marker must not fail the run: the node is simply reported as not finished.", "clear(executionId) releases a run's checkpoints and is called when a run finishes. The implementations must be thread-safe.", "SecretProvider has one method, getSecret(key), returning a Mono of the secret text. A config value written as decrypted:<key> is resolved through it. Core's default reads environment variables with a fixed prefix YUKTA_SECRET_, so a workflow cannot read arbitrary environment variables. A deployment can supply its own bean to use a vault."], "guar": "isComplete and isFinished let a restart avoid replaying partial or unfinished output. Durable stores must persist before markComplete's Mono completes.", "state": "None in this module. Core ships memory and file implementations; what survives a restart depends on which one is configured.", "ceil": "clear, isComplete and isFinished are plain synchronous calls, so a store backed by a remote database would block a thread on each. save, get and getAll are reactive.", "fail": "Missing checkpoints give an empty result. A store failure on markComplete is swallowed by design.", "set": ["yukta.secret env prefix YUKTA_SECRET_ (core default provider)"], "risks": ["storeSync", "secretThin", "budgetLedger"]}, {"id": "pkg", "name": "Build & test setup", "tag": "dependencies, tests", "c": 1, "r": 2, "resp": "Declares what the library depends on and how it is tested, since every other module compiles against it.", "how": ["Dependencies: reactor-core, the jakarta annotation API and the messaging module are exposed to everything that uses plugin-api (api scope). spring-expression is internal (implementation scope), so plugins do not get Spring's expression classes for free.", "Core exposes plugin-api to its own users with api scope, so web, mcp and boot get it transitively.", "Tests are plain JUnit 5 with Reactor's StepVerifier. They cover the defaults of the contract, PluginGuard, FailureMode, ConfigField, the sandbox (rejected expressions, cache bound), the checkpoint defaults, the command records, the supervisor defaults and the control-plane plugin.", "The java-test-fixtures plugin is applied but the module has no fixtures source, so a plugin author gets no ready-made test kit (a fake Message factory, a harness that runs a plugin as the engine would).", "pmdTest is switched off with a note until test-source PMD violations are fixed. Checkstyle and SpotBugs still apply."], "guar": "The tests pin the sandbox and the documented defaults, so a change in them fails the build.", "state": "None.", "ceil": "No version marker exists on the contract, so a plugin built against an older release cannot declare what it needs and can only fail at runtime.", "fail": "A change to a default method's behaviour can silently change every plugin that relied on it; only tests in this module guard that.", "set": ["./gradlew :plugin-api:test"], "risks": ["noVersion", "noTestKit", "pmdOff", "coreDependency"]}], "mapFlag": {"label": "Highlight documented-only rules", "hint": "Amber = a rule that the Javadoc states but the code does not enforce", "badge": "CONV"}, "edges": [["contract", "meta", "data", "describes"], ["contract", "ctx", "data", "graph checks"], ["contract", "spel", "data", "expressions"], ["contract", "guard", "data", "failures"], ["ctx", "contract", "ctrl", "heartbeat"], ["cmds", "proc", "data", "converted by"], ["proc", "store", "ctrl", "restart reads"], ["sup", "cmds", "data", "emits"], ["sup", "cmds", "ctrl", "vetoes"], ["cmds", "sup", "ctrl", "outcomes"], ["pkg", "contract", "ctrl", "builds"]], "scen": [{"id": "life", "name": "Life of a plugin", "steps": [{"t": "Registered at startup", "d": "Spring gives core every Plugin bean. The registry maps getType() to the object and refuses to start on a duplicate type, naming both classes. One object will serve every node of that type.", "c": ["contract"], "r": ["sharedInstance"]}, {"t": "Checked before the run", "d": "For each node core calls validateConfig(config) and then validateInContext(context, config). A plugin rejects a missing url or a wrong number of incoming edges here, so the user sees the problem at once.", "c": ["contract", "ctx"], "r": []}, {"t": "Initialised and prepared", "d": "initialize(config) then prepare(config) run for every node. The plugin parses its expressions once, through the sandbox's cache, so the run is not slowed by parsing.", "c": ["contract", "spel"], "r": ["spelLimits"]}, {"t": "Runs with engine policy", "d": "process(input, config) returns a stream. A blocking plugin is subscribed on a virtual thread. The node's timeoutSeconds or the plugin's default timeout (30 s unless overridden) is the idle limit; heartbeats restart it.", "c": ["contract", "ctx"], "r": []}, {"t": "Gets a control signal", "d": "An API call addressed to workflow and node reaches onControlSignal(message). The plugin may answer with a message. Typed commands such as pause go to the engine instead.", "c": ["contract", "cmds"], "r": ["onSignalLoose"]}, {"t": "Never told to shut down", "d": "At the end of a run the stream completes or is cancelled. shutdown(config) is not called by the engine; long-lived resources must be released by the Spring bean's own lifecycle.", "c": ["contract"], "r": ["shutdownNever"]}]}, {"id": "badconfig", "name": "A bad config is caught early", "steps": [{"t": "A user saves bad settings", "d": "A workflow node has a numeric setting (a limit) with the value 1e30. Nothing runs yet.", "c": ["contract"], "r": []}, {"t": "The plugin validates", "d": "validateConfig calls ConfigValidation.positiveLong. The helper rejects the value because it is above the largest whole number a long can hold, which would otherwise silently saturate.", "c": ["guard", "contract"], "r": []}, {"t": "A graph rule is checked", "d": "validateInContext receives the node's edges. A plugin that needs two inputs and has one returns an error Mono naming the node, so the whole workflow fails validation with a clear message.", "c": ["ctx", "contract"], "r": []}, {"t": "The UI form helps earlier", "d": "If the plugin declared ConfigField entries (NUMBER, required, default), the form already restricts input. If it declared none, the user sees a raw JSON box and only learns of the problem at validation.", "c": ["meta"], "r": ["uiHtml"]}, {"t": "Why not at run time", "d": "Failing before the run avoids a half-finished run and a confusing error deep in a stream. The cost is that plugin authors must write the checks; a plugin that skips them still loads.", "c": ["contract", "guard"], "r": []}]}, {"id": "failure", "name": "A plugin call fails", "steps": [{"t": "The call throws", "d": "An HTTP plugin gets a 500 from the target service while processing one message.", "c": ["contract"], "r": []}, {"t": "The guard counts it", "d": "PluginGuard.guard reports ERROR for this node and metric (OK would have been counted on success). The counts let operators see the failure rate per node.", "c": ["guard"], "r": []}, {"t": "ERROR or CONTINUE", "d": "In ERROR mode (default) the exception propagates and the engine's policy for the node (retry, fail the run) applies. In CONTINUE mode the original message is re-emitted with the failure details and sourcePort 'error'.", "c": ["guard"], "r": []}, {"t": "The error port is wired or not", "d": "If the workflow has an edge from the node's 'error' port, a downstream node handles the failed message. If not, nothing consumes it. The plugin cannot know which case it is in.", "c": ["guard", "ctx"], "r": []}, {"t": "Silent long work", "d": "A different failure: a plugin works for minutes without emitting anything and never calls the heartbeat. The engine's idle timeout fires and the node is marked timed out although the work was fine.", "c": ["ctx", "contract"], "r": []}]}, {"id": "command", "name": "An operator stops a run", "steps": [{"t": "A command is built", "d": "An API caller sends a stop. It becomes StopWorkflowCommand(executionId, reason, mode). A null mode becomes DRAIN, so a caller who says nothing gets the gentle option.", "c": ["cmds"], "r": []}, {"t": "Supervisors review it", "d": "Core asks every ExecutionSupervisor, lowest order() first, to review the command. The first denial refuses it with HTTP 403 and the log records it. An erroring reviewer counts as a denial.", "c": ["sup"], "r": ["reviewNoTimeout", "orderOpposite"]}, {"t": "A processor handles it", "d": "Of the processors that accept this command, the one with the highest priority runs. The built-in stop processor returns a Stop directive.", "c": ["proc"], "r": ["orderOpposite"]}, {"t": "The directive is applied", "d": "The dispatcher switches on the sealed directive: Stop unregisters the run and signals it to stop. DRAIN lets in-flight work finish; CANCEL and KILL cancel at once.", "c": ["proc", "cmds"], "r": ["directiveOnlyStop"]}, {"t": "The outcome is an event", "d": "A ControlOutcome event (applied or rejected, by whom) goes onto the event feed and the log. Supervisors see it, except the supervisor that sent the command.", "c": ["sup", "cmds"], "r": ["eventsBestEffort"]}, {"t": "Restart reads checkpoints", "d": "If the command had been RestartFromNode, the processor would read the checkpoints of that node's direct parents from the NodeCheckpointStore and replay them as input.", "c": ["proc", "store"], "r": ["storeSync"]}]}, {"id": "supervisor", "name": "A supervisor pauses a run", "steps": [{"t": "Subscribed once", "d": "At startup core subscribes the supervisor to the event feed. Events caused by its own commands are filtered out so it cannot answer itself.", "c": ["sup"], "r": []}, {"t": "An event arrives", "d": "A NodeStatusChanged event says node 'classify' is FAILURE. For a ControlPlanePlugin, decide(event) is called for this one event, and events are handled strictly one at a time.", "c": ["sup"], "r": ["decideStall"]}, {"t": "A decision is made", "d": "A rule plugin returns ControlDecision with PauseWorkflowCommand, confidence 1 and source RULE. A model plugin might return a lower confidence and source MODEL, or no commands at all.", "c": ["sup"], "r": []}, {"t": "Core applies it with limits", "d": "The command carries the supervisor's id as actor. Core allows at most 20 per second per supervisor by default; extra ones are recorded as rate-limited. In dry-run mode every command is only recorded.", "c": ["sup", "cmds"], "r": []}, {"t": "Other supervisors may veto", "d": "Because the pause is an ordinary command, every supervisor's review() sees it, including a safety supervisor that denies pauses on critical workflows.", "c": ["sup"], "r": ["reviewNoTimeout"]}, {"t": "Slow supervisor, missed events", "d": "If the supervisor is slow, the feed drops events for it and counts the drops. It misses some failures rather than slowing the workflows.", "c": ["sup"], "r": ["eventsBestEffort"]}]}, {"id": "hung", "name": "A hung reviewer (edge case)", "steps": [{"t": "A reviewer waits on a call", "d": "A supervisor's review() calls an external policy service to decide. The service stops answering and the Mono never completes. There is no timeout in the contract or in core's reviewer.", "c": ["sup"], "r": ["reviewNoTimeout"]}, {"t": "The first command waits", "d": "Commands for the same run run one after another. The pending review holds that run's turn, so it never reaches a processor.", "c": ["sup", "cmds"], "r": ["reviewNoTimeout"]}, {"t": "A human presses stop", "d": "An operator sends StopWorkflow for the same run. It queues behind the stuck command and also waits, even though a human stop is what you most want to work.", "c": ["cmds", "sup"], "r": ["reviewNoTimeout"]}, {"t": "Other runs are fine", "d": "Commands for other runs have their own turn queues, so the damage is per run. But every command for every run asks all supervisors, so a reviewer that hangs on every call affects all runs.", "c": ["sup"], "r": ["reviewNoTimeout"]}, {"t": "Ways out", "d": "Add a per-review timeout in core that counts a timeout as a denial (or an allow for stop), exempt STOP from review, or require a timeout on the SPI. Each has a cost: a denied stop is also a failure.", "c": ["sup", "cmds"], "r": ["reviewNoTimeout", "decideStall"]}]}], "intro": {"life": "A plugin from registration to the end of a run, showing which method is called when, and which one is never called.", "badconfig": "How shared helpers and the validation hooks catch a mistake before anything runs.", "failure": "What a plugin failure becomes: counted, raised or routed to the error port, and the quiet failure of a long job that looks dead.", "command": "A stop command travelling through review, processor and directive, and what it leaves behind in the event feed.", "supervisor": "How an automated watcher reads events, issues commands inside limits and can still miss events.", "hung": "An edge case: one reviewer that never answers, and how it can block even a human stop."}, "caps": [["Plugin contract", "Three plugin kinds", "Trigger, processor and terminal interfaces with one required stream method each.", "start returns a Flux, process maps a Flux to a Flux, consume turns a Flux into a Mono that completes.", "The compiler requires the method; the category is filled by the kind.", "A plugin can only be one kind."], ["Plugin contract", "Safe defaults", "A plugin overrides only what it needs.", "Timeout 30 s, buffer 1024, ports ['default'], not blocking, empty validation and lifecycle hooks.", "A plugin with two required members and a stream method is valid.", "Defaults are shared by every plugin, so changing one changes all."], ["Plugin contract", "Virtual-thread offload", "A plugin declares that it blocks.", "isBlocking() true makes core subscribe it on a virtual thread.", "Blocking plugins do not tie up reactive threads.", "A plugin that lies about it blocks the reactive threads."], ["Plugin contract", "Per-config timeout and ports", "Timeout and ports can depend on settings.", "getDefaultTimeout(config) and getOutputPorts(config).", "A long step is not cut at 30 s; a router can have its own ports.", "Overriding is by convention; an override that is slow to compute runs on every use."], ["Plugin contract", "Two-stage validation", "Checks before the run.", "validateConfig(config) for settings; validateInContext(context, config) for graph position.", "Errors surface before any message flows.", "A plugin can skip both and still load."], ["Describing", "Plugin descriptor", "Description, usage and an optional picture.", "describe() returns PluginDescriptor with an optional UiDesign (HTML, width, height).", "Never null; EMPTY by default.", "The picture is a raw HTML string."], ["Describing", "Config schema", "Typed field list for form rendering.", "ConfigField with name, type, required, default, options, description; eight types.", "Options are copied into an immutable list.", "Flat only: no nesting or conditions."], ["Graph and liveness", "Graph context", "Neighbouring edges for a node.", "WorkflowContext holds node id, incoming and outgoing edges with source ports.", "Edge lists are copied and immutable.", "Direct neighbours only."], ["Graph and liveness", "Heartbeat", "A long job says it is alive.", "Read a Runnable from the Reactor context under 'yukta.heartbeat' and run it.", "Restarts the node's idle timeout.", "Absent outside a run; no hard cap."], ["Helpers", "Sandboxed expressions", "Evaluate user-written expressions safely.", "SpelUtils with SimpleEvaluationContext: properties, map keys, variables and a method allow-list (SafeMethodResolver).", "No static calls, constructors, bean references or methods outside the allow-list; tested.", "No evaluation timeout; one cache lock."], ["Helpers", "Failure routing", "Same failure behaviour in every plugin.", "PluginGuard.guard with FailureMode ERROR or CONTINUE; CONTINUE emits on port 'error' with failure details.", "OK and ERROR counted per node and metric.", "Opt-in; the 'error' port must be wired."], ["Helpers", "Config readers", "Reject bad numbers early.", "ConfigValidation.positiveLong, positiveInt, requiredString.", "Rejects zero, negatives, fractions, infinity and overflow.", "Only three readers."], ["Control", "Typed control commands", "Thirteen commands for live runs.", "A sealed interface of records; each names its run.", "Closed set, compiler-checked.", "Fixed at compile time."], ["Control", "Stop modes", "Three ways to stop.", "StopMode DRAIN (default), CANCEL, KILL.", "A null mode becomes DRAIN.", "DRAIN depends on a drain deadline in core."], ["Control", "Breakpoints", "Hold a node on a matching element.", "SetBreakpoint field is payload, payload.path or metadata.key, compared by text.", "Invalid fields are rejected when the record is built.", "Equality of text only."], ["Supervision", "Supervisors and vetoes", "Automation that watches and steers.", "supervise(events) emits commands; review(request) allows or denies any command.", "First denial wins; a review error denies.", "No review timeout."], ["Supervision", "Control-plane plugins", "Judge one event at a time.", "decide(event) returns ControlDecision with commands, confidence 0-1 and source RULE or MODEL.", "A failing decision counts as no opinion.", "Handled one event at a time per plugin."], ["Storage", "Checkpoint store", "Remember each node's output.", "save, get, getAll, clear, plus isComplete, markComplete and isFinished.", "A durable store persists before markComplete completes.", "Some calls are synchronous."]], "capsLede": "Eighteen things the contract lets a plugin or a supervisor do, grouped by where they are used.", "guar": {"title": "Guarantees and limits", "lede": "plugin-api is an interface, so most guarantees are promises that other modules must keep. Each row says who keeps the promise: the compiler, a test, core at runtime, or only the reader's discipline.", "tables": [{"title": "What is enforced and what is only convention", "head": ["Rule", "Status"], "rows": [["Every plugin has a type, a category and its stream method", ["ok", "Compiler enforces it"]], ["Plugin types are unique", ["ok", "Core fails startup on a duplicate and names both classes"]], ["The set of 13 control commands is closed", ["ok", "Sealed interface; exhaustive switches"]], ["A breakpoint field is payload, payload.path or metadata.key", ["ok", "Checked when the record is built"]], ["Expressions cannot call static code, build objects or use beans", ["ok", "Restricted evaluation context; tests cover T(), new, @bean and getClass().forName"]], ["Plugin instances hold no per-node state", ["part", "Javadoc rule only; nothing checks it"]], ["A reviewer or decide() completes in bounded time", ["part", "Javadoc asks for it on decide(); review() has no stated limit; neither is enforced"]], ["shutdown(config) releases resources", ["lost", "Core never calls it"]], ["isComputationallyHeavy and suppressOptimizationHint feed validator hints", ["lost", "No caller in core or web; only plugins read them"]], ["Config schema matches what the plugin reads", ["part", "Kept in step by hand"]], ["Checkpoint stores are thread-safe", ["part", "Stated in the Javadoc; not checked"]]]}, {"title": "Defaults a plugin inherits", "head": ["Setting", "Default", "Who reads it"], "rows": [["Timeout", "30 seconds (getDefaultTimeout)", "Core, when the node has no timeoutSeconds"], ["Buffer size", "1024 (getDefaultBufferSize)", "Core's workflow compiler"], ["Output ports", "['default']", "Core's validator and graph service"], ["Blocking", "false: runs on the reactive threads", "Core's node assemblers"], ["Validation", "passes", "Core's validator"], ["Control-plane review order", "0, lowest first", "Core's reviewer"], ["Command processor priority", "0, highest wins; built-ins 10-20", "Core's dispatcher"], ["Stop mode", "DRAIN", "The StopWorkflow command itself"], ["Failure mode", "ERROR", "FailureMode.from(config value)"], ["Expression cache", "1000 entries, least recently used out", "SpelUtils"]]}, {"title": "Semantics of control and events", "head": ["Topic", "Guarantee"], "rows": [["Review order", "Supervisors by order(), lowest first; the first denial wins; an error in review counts as denial."], ["Command order", "Core runs the commands of one run strictly in sequence; this interface does not itself define ordering."], ["Supervisor events", "Best effort: a slow supervisor misses events and the drops are counted. Own command outcomes are not delivered back."], ["Supervisor failure", "Resubscribed with backoff from 1 s to 1 min; never affects the runs."], ["Decision errors", "An error in decide() is treated as no opinion; later events are still handled."], ["Checkpoint completeness", "isComplete is false once a capped store dropped messages, so a restart does not replay partial output."], ["Node end marker", "markComplete must be durable before its Mono completes; a failure writing it is not a run failure."]]}, {"title": "What survives a restart", "lede": "This module holds no state, so the question is about what its interfaces let others keep.", "head": ["Item", "Where it lives"], "rows": [["Plugin objects", ["lost", "Recreated by Spring at startup"]], ["Parsed expression cache", ["lost", "Static memory in the process; rebuilt on demand"]], ["Checkpoints and end markers", ["info", "Decided by the NodeCheckpointStore that core provides: memory or files"]], ["Supervisor subscriptions and counters", ["lost", "In memory in core; resubscribed at startup"]], ["Secrets", ["info", "Held by the SecretProvider; the default reads environment variables each time"]]]}]}, "ref": [{"id": "contract", "title": "Plugin contract: method, default and caller", "lede": "Every member of the Plugin interface. The last column says who calls it in core, checked in the current code.", "head": ["Method", "Default", "Called by"], "rows": [["getType()", "required", "Plugin registry (map key); validator; graph service"], ["getCategory()", "filled by TriggerPlugin, ProcessorPlugin, TerminalPlugin", "Core, to pick start, process or consume"], ["start(config) / process(input, config) / consume(input, config)", "required (one per kind)", "The node assemblers when a run is built"], ["describe()", "PluginDescriptor.EMPTY", "Graph service; the plugin list for the UI and API"], ["getConfigSchema()", "empty list", "The web plugin controller"], ["getOutputPorts() / getOutputPorts(config)", "['default']", "Validator (edge ports) and graph service"], ["getDefaultTimeout() / getDefaultTimeout(config)", "30 s", "Node timeouts, validator and compiler; used when the node has no timeoutSeconds"], ["getDefaultBufferSize()", "1024", "Workflow compiler"], ["validateConfig(config)", "passes", "Workflow validator"], ["validateInContext(context, config)", "passes", "Workflow validator"], ["initialize(config)", "does nothing", "Workflow preparator, per node, before a run"], ["prepare(config)", "does nothing", "Workflow preparator, right after initialize"], ["isBlocking()", "false", "Trigger, processor and terminal assemblers (virtual thread if true)"], ["onControlSignal(message)", "empty", "Control bus service, when a node is addressed"], ["shutdown(config)", "does nothing", "Nobody in core"], ["isComputationallyHeavy(config) / suppressOptimizationHint(config)", "false", "No caller in core or web; the built-in filter plugin reads its own copy"]]}, {"id": "commands", "title": "The 13 control commands", "lede": "All carry executionId. Extra fields are listed.", "head": ["Command", "Extra fields", "Meaning"], "rows": [["PauseWorkflowCommand", "none", "Stop pulling new elements everywhere; in-flight work finishes"], ["ResumeWorkflowCommand", "none", "Undo the pause"], ["PauseNodeCommand", "nodeId", "Pause one node"], ["ResumeNodeCommand", "nodeId", "Resume one node"], ["StopNodeCommand", "nodeId, immediate, reason", "Hard stop (cancel upstream) or drain and stop"], ["SkipNodeCommand", "nodeId, skip", "Processor nodes only: pass elements through without calling the plugin"], ["EnableStepModeCommand", "nodeId", "Node holds each element until stepped"], ["DisableStepModeCommand", "nodeId", "Back to normal"], ["StepNodeCommand", "nodeId", "Let exactly one element through; no effect outside step mode"], ["StopWorkflowCommand", "reason, mode (null = DRAIN)", "Stop the whole run: DRAIN, CANCEL or KILL"], ["RestartCommand", "newExecutionId", "Stop and restart from the beginning with the original payload"], ["RestartFromNodeCommand", "fromNodeId, newExecutionId", "Restart using the checkpoints of the node's direct parents"], ["SetBreakpointCommand", "nodeId, field, equalsValue", "Hold the node before the first matching element; null field clears"]]}, {"id": "write", "title": "Write a plugin: checklist", "lede": "The smallest correct plugin and the rules that follow from the contract.", "head": ["Step", "What to do"], "rows": [["Pick a kind", "Implement TriggerPlugin (start), ProcessorPlugin (process) or TerminalPlugin (consume), and return a unique getType() string."], ["Register it", "Make it a Spring bean (for example @Component). Core collects every Plugin bean; a duplicate type stops startup."], ["Stay stateless", "One object serves all nodes. Read settings from the config argument inside each call. Do not store config from initialize in a field."], ["Say if you block", "Return isBlocking() true if you wait on I/O or compute for long. Do not call subscribeOn yourself."], ["Validate early", "Put setting checks in validateConfig (use ConfigValidation) and graph checks in validateInContext."], ["Declare your fields", "Return ConfigField entries from getConfigSchema, with the same key names the code reads."], ["Use the sandbox", "Evaluate user expressions with SpelUtils; call preParse in prepare. Read message data with payload(), not getPayload()."], ["Handle failure", "Wrap risky work in PluginGuard.guard with a FailureMode read from config, or let the error propagate."], ["Declare ports", "If you route, return the port names from getOutputPorts(config) and set sourcePort on emitted messages."], ["Long work", "Run the heartbeat Runn
