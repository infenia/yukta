<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta build-logic Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
  <div class="others" id="others"></div>
</nav>
<main id="main"></main>

<script>
var DATA = {"module": "build-logic", "title": "How Yukta build-logic works, and where it can break", "htmlTitle": "Yukta build-logic Guide", "date": "2026-10-15", "glance": {"lede": "build-logic is the rulebook for the build. It is a small Gradle project inside the repository that holds six shared 'convention plugins'. A module that applies one line of it gets the same Java version, the same dependency versions, the same code-style and bug checks, the same licence checks and the same test-coverage rules as every other module. Nothing here runs in production; it decides what code is allowed to be merged. This page is for thinking about it: open a component, replay a scenario, then challenge the weak spots.", "props": [["One rulebook, 27 modules", "24 modules apply library-conventions, boot and ui apply spring-conventions, ui also applies node-conventions, and cli applies none of them (it only wraps Go tooling). Change a rule once and every module follows."], ["Gates that fail, not warn", "Checkstyle allows 0 warnings, OpenGrep runs with --error, coverage must be 100% line and 100% branch per class, and disabling the coverage check fails the build. Policy is code, not a wiki page."], ["Local and CI differ in two places", "OpenGrep is silently skipped when its program is not installed locally (CI installs a pinned copy), and Trivy vulnerability scanning is CI only. Everything else in check runs the same way on a laptop."], ["Versions live in one catalog", "gradle/libs.versions.toml feeds both the modules and build-logic itself. The Netty version now comes from the catalog (spring-conventions sets netty.version from it); a stale netty.version line is still left in gradle.properties (see Risks)."]], "start": [["primer", "Primer", "New here? The problem, the vocabulary and one worked example: a new module going from first commit to merge"], ["map", "System map", "Ten components and how the rules reach a module and the CI pipeline"], ["map", "Replay ./gradlew check", "Six scenarios: the normal check run, adding a module, a coverage failure, a skipped gate, a bad licence, a Netty bump"], ["guarantees", "What runs where", "Switch between a laptop run, a pull request and a push to main and see which gates apply"], ["reference", "Lookup tables", "How to add a module, the full gate list, plugin map, coverage exceptions"], ["quality", "Stress it", "Scalability, performance, availability, security, operability, evolvability"], ["board", "Challenge it", "16 open risks, an impact x effort grid, your own notes"], ["adrs", "Decisions", "Eight ADRs, each with a revisit-when trigger"]]}, "primer": {"problem": "Yukta has 27 Gradle modules (a module is one separately built piece of the product: the engine, the web layer, one plugin and so on). If each module wrote its own build file, they would drift: one would use another Java version, another would skip the bug checks, a third would allow a licence the company cannot ship. <b>build-logic<\/b> prevents that. It is a small build of its own, included by the root build, that defines the rules once as <b>convention plugins<\/b> (a convention plugin is a reusable bundle of build settings that a module switches on with one line). Every module then applies the bundle and inherits the rules.", "analogy": "Think of a building code for a housing estate. Every house (module) is designed by a different builder, but each must meet the same code: same electrical standard, same fire doors, same inspection before anyone moves in. The code is written once by the estate authority (build-logic). Inspectors (the quality tools) check each house against it, and the occupancy certificate (a passing <code>./gradlew check<\/code>) is what lets a house be handed over (merged).", "layersTitle": "Where build-logic sits", "layers": [["Developer or CI", "Runs ./gradlew check, build, spotlessApply"], ["Root build", "settings.gradle.kts lists the 27 modules and includes build-logic; build.gradle.kts adds locking and a Trivy task"], ["build-logic", "The six convention plugins and the shared catalog wiring. This page.", "me"], ["Each module", "Applies one plugin id and adds only its own dependencies"], ["Config and tools", "config/ (Checkstyle, PMD, SpotBugs, OpenGrep, licence headers) and the tools themselves"]], "layersNote": "build-logic never contains product code. It only decides how product code is compiled, checked and measured.", "conceptsTitle": "The vocabulary in eight cards", "concepts": [["Convention plugin", "A Gradle plugin written in this repository that applies a bundle of settings. Modules switch it on with <code>id(\"com.infenia.yukta.library-conventions\")<\/code>.", "Without it, 27 build files would each repeat 200 lines of setup."], ["Included build", "A separate Gradle build that the root build pulls in by name (<code>includeBuild(\"build-logic\")<\/code>). It is compiled first, so its plugins exist before any module is configured.", "Editing a rule in build-logic affects every module on the next build."], ["Version catalog", "One file, <code>gradle/libs.versions.toml<\/code>, that names every library and tool version. Both the modules and build-logic read it.", "springBoot = 4.1.1, checkstyle = 13.2.0."], ["BOM", "Bill of materials: a published list of library versions known to work together. Importing it means a module names a library without a version.", "The Spring Boot BOM pins Netty; Yukta imports a newer Netty BOM after it."], ["Quality gate", "A check that fails the build when code breaks a rule. A passing build means every gate passed.", "Spotless, Checkstyle, PMD, SpotBugs, Error Prone, OpenGrep, licensee, JaCoCo."], ["Coverage", "The share of code lines and decision branches that tests actually ran, measured by JaCoCo. Branch coverage counts both sides of each if.", "An if with only its true side tested is 50% branch coverage."], ["Coverage exception", "A written, reasoned allowance for one class (or class pattern) to sit below the default. Below 80% a reason is mandatory.", "web allows generated MapStruct mappers 90% branch coverage."], ["Licence allow-list", "The list of open-source licences Yukta may depend on. The licensee plugin fails the build if a dependency uses any other licence.", "Apache-2.0, MIT, BSD are allowed; GPL needs a per-artifact decision."]], "ex": {"title": "One example, end to end", "lede": "A developer adds a new plugin module and opens a pull request. Click a step to see what happens, why it is built that way, and what can go wrong.", "viewBox": "0 0 880 230", "labels": ["What happens", "Why it works this way", "Can go wrong"], "legend": "Green = developer action · Blue = automatic step · Grey = outcome", "start": "inc", "nodes": [{"id": "inc", "n": "Add the module", "x": 10, "y": 40, "s": "settings + build file", "k": "t", "does": "The developer adds one include(...) line to the root settings.gradle.kts and creates the module's build.gradle.kts with a single plugin line, id(\"com.infenia.yukta.library-conventions\"), plus its own dependencies.", "adds": "Nothing else is needed. The convention plugin supplies the Java version, the dependency versions, Lombok, the test libraries and every quality gate. The developer also adds a path filter for the module to .github/workflows/ci.yml.", "wrong": "Forgetting the CI path filter: the lint-workflows job fails with 'Module has no path filter in ci.yml', so the mistake is caught early. Copying a coverageConfig block from another module 'just in case': if its pattern matches no class here, the stale check fails the build."}, {"id": "bld", "n": "Apply conventions", "x": 190, "y": 40, "s": "plugins load", "k": "p", "does": "Gradle compiles build-logic first, then applies library-conventions to the new module. That pulls in spring-conventions, which pulls in java, quality and jacoco conventions, in that order.", "adds": "The module now has the Java 25 toolchain, the Spring Boot, Spring AI and Netty BOMs, Spotless, Checkstyle, PMD, SpotBugs, Error Prone, licensee, an opengrep task and JaCoCo rules, without a single line of its own.", "wrong": "If JDK 25 is not installed, Gradle cannot find the toolchain and stops: there is no download resolver configured. A mistake in a convention plugin breaks every module at once."}, {"id": "compile", "n": "Compile", "x": 370, "y": 40, "s": "javac + Error Prone", "k": "p", "does": "javac compiles for Java 25 with -parameters (keeps method parameter names, which Spring and Jackson read at run time). Lombok generates getters and constructors. Error Prone, a plugin inside the compiler, flags known bug patterns.", "adds": "Generated sources under build/generated are skipped by Error Prone because nobody edits them and they are regenerated each build.", "wrong": "Error Prone runs with default settings, so most of its findings are warnings that do not fail the build. Only its 'error' level checks stop compilation."}, {"id": "lint", "n": "Format and lint", "x": 550, "y": 40, "s": "Spotless, PMD...", "k": "p", "does": "spotlessCheck verifies Google Java Format and the licence header; Checkstyle, PMD and SpotBugs then read the main and test code. Checkstyle is configured with maxWarnings = 0, so even a warning-level rule fails.", "adds": "Rule files live in config/ at the repository root, so one edit changes the rule for all modules. Spotless can fix most findings itself: ./gradlew spotlessApply.", "wrong": "A noisy new rule blocks every module at once. A module can switch a task off in its own build file (four modules do for PMD or Checkstyle tasks); nothing in build-logic stops that."}, {"id": "test", "n": "Test and coverage", "x": 730, "y": 40, "s": "JaCoCo 100%", "k": "p", "does": "JUnit 5 runs the tests, in parallel forks, with the JaCoCo agent recording which lines and branches ran. Then jacocoTestCoverageVerification checks every class: 100% of lines and 100% of branches unless the class has a reasoned exception.", "adds": "Lombok-generated code is tagged so JaCoCo ignores it. A stale exception (a pattern that matches no class) fails the build, so the list cannot rot.", "wrong": "A new class with one untested error branch fails the whole module. If a module had no test data at all, the check is skipped rather than failed."}, {"id": "scan", "n": "Scan and licences", "x": 730, "y": 150, "s": "OpenGrep, licensee", "k": "p", "does": "OpenGrep scans src/main against four local security rules (for example, no HostAccess.ALL for scripts). licensee checks every dependency's licence against the allow-list.", "adds": "The OpenGrep rules are a pinned file in the repository, not downloaded, so a rule cannot change under us. One shared lock makes OpenGrep runs go one module at a time.", "wrong": "If the opengrep program is not installed on the laptop, the task is skipped silently and the developer sees a green build that CI may later fail."}, {"id": "ci", "n": "CI runs the same", "x": 550, "y": 150, "s": "GitHub Actions", "k": "p", "does": "On a pull request CI runs the module and everything that depends on it. If build-logic, config or gradle files changed, it runs every module. It installs OpenGrep at a pinned version and checksum first.", "adds": "A separate workflow runs ./gradlew licensee and a REUSE header check; another runs Trivy for vulnerabilities and secrets.", "wrong": "The dependency lock check is skipped because no lock files are committed, so CI does not prove that dependency versions are reproducible."}, {"id": "merge", "n": "Merge", "x": 370, "y": 150, "s": "CI Gate green", "k": "e", "does": "The single required check, CI Gate, passes only if every job succeeded or was legitimately skipped. The pull request can merge.", "adds": "One required check in branch protection instead of a list of jobs to maintain.", "wrong": "Skipped counts as success. A job skipped by a wrong path filter would let a change through, which is why the lint job insists every module has a filter."}], "edges": [["inc", "bld"], ["bld", "compile"], ["compile", "lint"], ["lint", "test"], ["test", "scan"], ["scan", "ci"], ["ci", "merge"]], "json": {"title": "The whole build file of a library module", "note": "Taken from the shape of messaging/build.gradle.kts; the dependency lines are the module's own.", "text": "plugins {\n    id(\"com.infenia.yukta.library-conventions\")\n}\n\ndependencies {\n    api(libs.reactor.core)\n    api(libs.spring.boot.autoconfigure)\n}\n\n// Only if a class truly cannot reach the default. Prefer none.\n// coverageConfig {\n//     exception(\"com.infenia.yukta.mapper.*MapperImpl\", \"why\", mapOf(\"BRANCH\" to 0.9))\n// }"}}, "wrapper": {"title": "What ./gradlew check does to every module, in order", "lede": "These stages apply to every module that uses the conventions. The order is not strict for tasks Gradle can run in parallel, but this is the logical flow.", "steps": ["Compile (Java 25, Lombok, Error Prone)", "spotlessCheck (format + licence header)", "Checkstyle, PMD, SpotBugs on main and test code", "Tests with the JaCoCo agent", "Coverage verification (100% line and branch per class)", "OpenGrep (if installed)", "licensee (licence allow-list)"]}, "story": {"title": "The build rules in plain words", "steps": [["Include", "the root build includes build-logic, so its plugins exist before any module is configured."], ["Apply", "each module names one convention plugin; the plugin chain switches on everything else."], ["Resolve", "dependency versions come from the Spring Boot, Spring AI and Netty BOMs and from the shared catalog."], ["Compile", "javac targets Java 25; Lombok and Error Prone run inside the compiler."], ["Check", "formatting, style, bug and licence tools read the code and fail on any finding."], ["Measure", "tests run and JaCoCo verifies 100% line and branch coverage per class, minus reasoned exceptions."], ["Prove in CI", "GitHub Actions repeats it with pinned tools and adds vulnerability and secret scans."]]}, "paths": [["New to the module", "Primer, then Map and walkthroughs (start with the check run), then What runs where.", "primer"], ["Reviewing for improvements", "Quality lenses, then Risks and ideas (impact x effort grid), then Decisions for what you would revisit.", "quality"], ["Adding a module or changing a rule", "Lookup tables (How to add a module, Gate list), then the coverage scenario, then Guarantees.", "reference"]]}, "plain": {"plugins": ["The table of contents of the rulebook. It says which bundle of rules a module gets: libraries get everything, the app and the UI get everything except library packaging, the CLI gets none.", "Without one entry point, each module would copy and slowly change its own rules."], "catalog": ["The shopping list and the building site office. One file names every version, the root build lists the modules, and a few repository-wide settings (dependency locking, a Trivy scan task) live there.", "Two places choosing the same version leads to surprises: it is how Netty ended up with two numbers."], "javaconv": ["The basic workshop setup: which Java to use, how to compile, which test libraries, how tests run.", "Every module must compile the same way or code that works in one module breaks in another."], "boms": ["The approved parts list. It says which version of each library is safe to use together, and imports a newer Netty on top because the Spring one has known security holes.", "Hand-picked versions across 27 modules would clash; a single list prevents it."], "format": ["The style and bug inspectors: the formatter, Checkstyle, PMD, SpotBugs and Error Prone. They read the code and refuse it when it breaks a rule.", "Reviewers should discuss design, not argue about braces or catch a missed null check by eye."], "license": ["The legal inspector for dependencies. It lists every library the module uses and checks each licence against an approved list.", "A single wrongly licensed library can stop the company from shipping the product."], "opengrep": ["The security pattern scanner. It searches source code for a few dangerous constructions we have banned, such as letting scripts reach every Java method.", "Some risks are not bugs a compiler finds; they are patterns we decided never to allow without a written reason."], "coverage": ["The test auditor. After tests run, it checks that every class had all its lines and all its branches executed, and lets a class fall short only with a written reason.", "Without it, test quality decays quietly; a hard floor makes it visible at the moment of the change."], "node": ["The setup for the web UI's tools. It pins the Node.js and pnpm versions, downloads them locally, and turns off the npm and yarn tasks.", "UI builds would otherwise depend on whatever Node each developer happens to have installed."], "ci": ["The automatic referee. GitHub Actions runs the same checks on every pull request and adds scans we do not run locally (Trivy, dependency review).", "Local checks can be skipped or differ per machine; CI is the one place whose verdict decides a merge."]}, "comps": [{"id": "catalog", "name": "Catalog & Root Build", "tag": "versions, modules, locking", "c": 0, "r": 1, "resp": "Holds the repository-wide facts the plugins read: every library and tool version, the list of modules, dependency locking and an on-demand Trivy task.", "how": ["gradle/libs.versions.toml is the version catalog. build-logic/settings.gradle.kts loads it with <code>from(files(\"../gradle/libs.versions.toml\"))<\/code>, so the plugins read exactly the same file the modules do. Example: checkstyle = \"13.2.0\" is read by quality-conventions; springBoot = \"4.1.1\" by spring-conventions.", "build-logic/build.gradle.kts lists the Gradle plugins the conventions need (Spotless, SpotBugs, the Lombok plugin, node-gradle, Spring dependency management, Error Prone, licensee) and takes each version from the catalog. A bump in the catalog therefore changes the plugin jars too.", "The root settings.gradle.kts includes build-logic first, then lists 27 modules. The root build.gradle.kts sets the group, declares <code>dependencyLocking { lockAllConfigurations() }<\/code> for every project, and registers a root-only <code>trivy<\/code> task (HIGH and CRITICAL findings fail it). Trivy is deliberately not part of check; CI owns scanning.", "gradle.properties holds the build switches: build cache on, parallel on with 8 workers max, configuration cache off (the Go tasks in cli are not compatible with it), a 4 GB Gradle heap, one shared project version (0.0.1-SNAPSHOT) and a leftover <code>netty.version=4.2.16.Final<\/code> next to the catalog's <code>netty = 4.2.18.Final<\/code>. The leftover no longer wins: spring-conventions sets <code>netty.version<\/code> from the catalog (checked on 2026-10-15 with dependencyInsight: boot resolves 4.2.18.Final).", "Gradle itself is pinned by the wrapper (9.8.0). Dependabot proposes catalog and Action bumps weekly with a 7-day cooldown, grouped into one minor/patch PR."], "guar": "Every module and build-logic read one catalog, so the same tool version applies everywhere. The project version is defined in one place.", "state": "Plain files in git. Nothing runs at run time. Lock files are declared but none are committed, so there is no stored record of resolved versions.", "ceil": "A catalog or build-logic change makes CI build every module (the root path filter includes gradle/**, config/** and build-logic/**), so version bumps are still the most expensive pull requests. Since PR #391 that full build is split into four parallel shards (platform, infra, plugins, frontend) with shared caches.", "fail": "A typo in the catalog fails configuration of the whole build. A stale leftover (the Netty line in gradle.properties) can mislead a reader even though it no longer wins.", "set": ["gradle/libs.versions.toml", "gradle.properties: org.gradle.caching, org.gradle.parallel, org.gradle.workers.max=8, netty.version, version", "./gradlew trivy (on demand)"], "risks": ["nettyTwoSources", "noLockfiles", "fullBuildOnRoot"]}, {"id": "plugins", "name": "Plugin Hierarchy", "tag": "who applies what", "c": 0, "r": 0, "resp": "Defines the six convention plugins and how they stack, so a module opts in with one line.", "how": ["The plugins are precompiled Kotlin scripts (<code>com.infenia.yukta.&lt;name&gt;.gradle.kts<\/code>) in build-logic/src/main/kotlin. 'Precompiled' means Gradle compiles them once into real plugins instead of interpreting each one in every module.", "They stack. <b>library-conventions<\/b> = java-library + spring-conventions. <b>spring-conventions<\/b> = java-conventions + quality-conventions + jacoco-conventions + Spring dependency management. A library module therefore needs only one line, and still gets every gate.", "Who applies what (checked in each build file): 24 modules apply library-conventions (core, web, mcp, messaging, plugin-api and 19 plugins). boot and ui apply spring-conventions directly (they are an application and a bundle of static files, not libraries). ui also applies node-conventions. cli applies only Gradle's base plugin and wraps make targets for Go.", "In our view the name spring-conventions is misleading: it is the 'standard Yukta module' bundle, because even a module with no Spring code gets the Spring BOMs and test starters through it.", "The two remaining plugins are leaf bundles: java-conventions (toolchain, tests) and node-conventions (UI tooling). quality-conventions and jacoco-conventions are the heavy ones (about 200 and 150 lines)."], "guar": "A module that applies library-conventions or spring-conventions gets every gate; there is no way to get the toolchain without the quality tools.", "state": "None. These are build scripts evaluated at every Gradle run.", "ceil": "Plugin logic runs at configuration time for each of the 27 projects; a heavy convention slows every build even for a one-module change.", "fail": "A compile error in any convention script fails the whole build before any module is configured. A module can still weaken itself in its own build file (see Risks).", "set": ["id(\"com.infenia.yukta.library-conventions\")", "id(\"com.infenia.yukta.spring-conventions\")", "id(\"com.infenia.yukta.node-conventions\")", "includeBuild(\"build-logic\")"], "risks": ["docDrift", "cvePins"]}, {"id": "javaconv", "name": "Java & Test Setup", "tag": "toolchain, Lombok, tests", "c": 1, "r": 0, "resp": "Sets how every module compiles and how its tests run.", "how": ["The Java toolchain is 25 and the compiler flag <code>release<\/code> is also 25. A toolchain means Gradle looks for a matching JDK instead of using whatever runs Gradle. <code>-parameters<\/code> is added so method parameter names survive in the class files (Spring and Jackson need them for binding).", "The freefair Lombok plugin wires Lombok into compilation. The repository's lombok.config stops searching parent folders and tags generated code with @Generated, which is what lets JaCoCo ignore Lombok-written code.", "Dependencies come from Maven Central only (build-logic itself also uses the Gradle plugin portal). The only dependency added here is junit-platform-launcher at test runtime.", "Every test task uses JUnit Platform with parallel forks: <code>maxParallelForks = max(1, CPUs / 2)<\/code>. Tests run with <code>-XX:+UseParallelGC -XX:TieredStopAtLevel=1<\/code>: ParallelGC has little overhead for short test runs, and stopping at the first compiler tier makes short-lived JVMs start tests sooner. Example: a 16-core laptop runs 8 test JVMs at a time.", "<code>-PfailFast<\/code> stops at the first failing test. The group is com.infenia.yukta and the version comes from gradle.properties."], "guar": "Every module is compiled for Java 25 with the same flags, and every module's tests run on JUnit 5.", "state": "None.", "ceil": "Test parallelism is capped by memory: each fork is its own JVM. Because tests run with the fast tier only, timing-sensitive behaviour measured in tests may differ from production.", "fail": "No JDK 25 on the machine fails the build at configuration: no auto-download resolver (such as foojay) is configured in either settings file.", "set": ["-PfailFast", "-Pcoverage (reports on every test run)", "lombok.config"], "risks": ["noToolchainResolver"]}, {"id": "boms", "name": "Dependency Platform", "tag": "BOMs, Netty import", "c": 1, "r": 1, "resp": "Pins the versions of third-party libraries through three imported BOMs, and adds the common test libraries.", "how": ["spring-conventions applies Spring's dependency-management plugin and imports three BOMs in this order: Spring Boot (<code>springBoot<\/code> 4.1.1), Spring AI (<code>springAi<\/code> 2.0.0) and Netty (<code>netty<\/code> 4.2.18.Final). A module can then write <code>implementation(libs.spring.boot.starter.webflux)<\/code> with no version.", "Netty comes last on purpose. Spring Boot pins an older Netty that lacks CVE fixes (the catalog and properties file name five CVEs), so the patched BOM is imported after it to win. Example: Netty is the network library under WebFlux; an outdated copy means every HTTP request passes through code with known holes.", "History: the boot jar built on 2026-10-11, after the catalog moved to 4.2.18, still contained Netty 4.2.16 files, because <code>netty.version=4.2.16.Final<\/code> in gradle.properties overrode the Boot BOM's own Netty property. spring-conventions now assigns that property from the catalog, and on 2026-10-15 <code>:boot:dependencyInsight<\/code> shows io.netty:netty-codec-http at 4.2.18.Final. The stale line in gradle.properties is still there and nothing asserts the resolved version.", "Every standard module also gets spring-boot-starter-test and reactor-test as test dependencies. Reactor-test is what makes StepVerifier available for the project's reactive code."], "guar": "All modules resolve a library to the same version, because they all import the same three BOMs in the same order.", "state": "None. Resolution happens per Gradle run; no lock file is stored.", "ceil": "BOM imports are fine at this size. The ceiling is human: two places to set one version, and nothing checks that they agree.", "fail": "A BOM that moves a library to an incompatible major version breaks compile or run time in several modules at once. A wrong Netty version stays invisible because tests do not assert it.", "set": ["springBoot, springAi, netty in gradle/libs.versions.toml", "netty.version in gradle.properties", "libs.spring.boot.starter.test, libs.reactor.test"], "risks": ["nettyTwoSources", "cvePins"]}, {"id": "format", "name": "Format & Static Analysis", "tag": "Spotless, Checkstyle, PMD...", "c": 2, "r": 0, "flag": true, "resp": "Formats code and refuses code that breaks style or bug-pattern rules, using five tools whose rule files live in config/.", "how": ["<b>Spotless<\/b> formats Java with google-java-format (2-space indent, 100-character lines, long strings reflowed) and checks the Apache licence header from config/license/header.txt on Java, Kotlin build scripts and XML files. <code>./gradlew spotlessApply<\/code> rewrites files; check only verifies. The Java target excludes bin, build, out and node_modules.", "<b>Checkstyle<\/b> 13.2.0 uses config/checkstyle/checkstyle.xml (a Google-style rule set; its default severity is warning). With <code>maxWarnings = 0<\/code> a single warning fails the build, so 'warning' really means 'error'. HTML and XML reports are produced.", "<b>PMD<\/b> 7.21.0 runs config/pmd/ruleset.xml with whole categories switched on: best practices, code style, design, documentation, error-prone, multithreading, performance and security, with two rules excluded. <b>SpotBugs<\/b> (plugin 6.5.12) reads bytecode for bug patterns; config/spotbugs/exclude.xml lists a handful of reviewed false positives such as copies that are already immutable.", "<b>Error Prone<\/b> 2.50.0 runs inside javac. Generated code under build/generated is skipped. Error Prone and SpotBugs are used at default levels.", "A loop at the end of quality-conventions disables the Checkstyle, PMD, SpotBugs, OpenGrep and Spotless tasks whose names contain 'Aot', because Spring's native-image step generates code that nobody edits. A pin of plexus-utils 3.6.1 on the Checkstyle classpath fixes a directory-traversal CVE in the older copy.", "Not everything is applied: <code>removeUnusedImports()<\/code> is commented out in Spotless (we did not check whether google-java-format already removes unused imports), and the Kotlin build-logic scripts themselves are not checked (see Risks)."], "guar": "Any Spotless difference, any Checkstyle warning, any PMD or SpotBugs finding in the main or test code of a module fails its check.", "state": "Reports under each module's build/reports. Nothing persistent.", "ceil": "Static analysis runs per module, so total time grows with module count and code size. The tools see Java only; Go (cli) and TypeScript (ui) have their own tooling.", "fail": "A module can switch a task off in its own build file and nothing in build-logic stops it: mcp and plugin-api turn off pmdTest, internal-core turns off pmdMain, pmdTest and checkstyleTest, and constant-source turns off pmdMain and pmdTest (each with a 'temporarily disabled' comment). Error Prone warnings do not fail a compile.", "set": ["./gradlew spotlessApply", "config/checkstyle/checkstyle.xml", "config/pmd/ruleset.xml", "config/spotbugs/exclude.xml", "config/license/header*.txt"], "risks": ["disabledTasks", "advisoryTools", "selfUnchecked"]}, {"id": "license", "name": "Licence Gate", "tag": "licensee allow-list", "c": 2, "r": 1, "resp": "Fails the build if any dependency uses a licence that is not on the approved list.", "how": ["The licensee plugin (1.14.1) reads the licence of every dependency (from the library's metadata) and compares it to an allow-list: Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, Unlicense, 0BSD, Python-2.0, EPL-1.0, EPL-2.0 and UPL-1.0. A dependency with any other licence fails <code>./gradlew licensee<\/code>.", "Some libraries only publish a licence URL, not a licence name. About a dozen exact URLs are allowed (ANTLR, ASM, EDL, the MIT and UPL pages, and so on). A new URL form means a new line.", "Copyleft licences are not allowed by default. The only exception is one named artifact: <code>org.openjdk.nashorn:nashorn-core:15.4<\/code> under GPL-2.0 with Classpath Exception. It arrives through Handlebars (the template library used by internal-core), not through the GraalVM JS plugin; the written reason in the code says 'pulled in by GraalVM JS in internal-core', which is out of date.", "Why per-artifact: a general GPL allowance would cover anything that later arrives by accident. Naming one artifact and one version means a version bump or a new copyleft library fails the build and forces a conscious decision. Legal sign-off for shipping it inside the GraalVM native image (which links libraries statically) is still pending.", "CI runs this in its own workflow (license-compliance.yml): a REUSE check of file headers, <code>./gradlew licensee<\/code>, and a Trivy licence scan."], "guar": "No dependency enters a module without a licence that is on the list or an exact per-artifact exception.", "state": "Reports under build/reports/licensee in each module; CI uploads them as an artifact.", "ceil": "Resolution of every module's classpath makes it as slow as dependency resolution; it scales with the number of dependencies.", "fail": "A dependency that declares no licence, or a new URL form, fails the build even if the library is fine. The failure is noisy but safe.", "set": ["allow(...) and allowUrl(...) in quality-conventions", "allowDependency(group, artifact, version) { because(...) }", "./gradlew licensee"], "risks": ["legalSignoff"]}, {"id": "opengrep", "name": "OpenGrep Gate", "tag": "security pattern rules", "c": 2, "r": 2, "flag": true, "resp": "Scans each module's src/main with four project-specific security rules and fails the build on any finding.", "how": ["OpenGrep is a rule-based code scanner (an open fork of Semgrep). The ruleset is the local file config/opengrep/.semgrep.yml, so no rules are downloaded at build time. The four rules ban: <code>new StandardEvaluationContext(...)<\/code> (SpEL with unlimited access), <code>HostAccess.ALL<\/code> (scripts reach every Java method), <code>allowHostClassLookup(s -> true)<\/code> (scripts load any class) and actuator <code>include: \"*\"<\/code> in YAML (exposes every management endpoint).", "The task runs from the repository root and passes <code>--error<\/code>, so any finding exits non-zero and fails the build. A deliberate use is allowed with a comment <code>// nosem: &lt;rule-id&gt; - reason<\/code> on the flagged line.", "Before it runs, the task probes for the program with <code>opengrep --version<\/code>. If the program is missing, the task is skipped without a message and the build stays green. CI installs a pinned version (v1.25.0) and checks its SHA-256, so CI never skips.", "All modules share one build service limited to one user at a time. Reason: starting the wrapper in parallel could fail with 'Text file busy', so runs are serialised. Each module starts a new scan of its own src/main.", "<code>check<\/code> depends on the task, so it runs on every check of every module. It declares the rule file and src/main as inputs and the SARIF report as an output and is cacheable, so an unchanged module is skipped; a changed one still starts the scanner (one at a time, through a shared build service)."], "guar": "If the program is present, a banned pattern in main code cannot pass check. Rule changes are reviewed in git, not fetched live.", "state": "A SARIF report per module in build/reports/opengrep/opengrep-report.sarif.", "ceil": "Serialised across 27 modules and rerun every time. Four rules only: coverage of risky patterns is narrow by design. Test code and non-Java files are not scanned, except YAML for the actuator rule.", "fail": "A missing program means the gate is open locally. A finding fails the build with the rule id, and the report is in SARIF for tooling.", "set": ["./gradlew opengrep", "config/opengrep/.semgrep.yml", "OPENGREP_VERSION and OPENGREP_SHA256 in ci.yml", "// nosem: <rule-id> - reason"], "risks": ["opengrepSilentSkip", "opengrepEveryModule"]}, {"id": "coverage", "name": "Coverage Policy", "tag": "JaCoCo, exceptions", "c": 3, "r": 0, "flag": true, "resp": "Measures test coverage with JaCoCo and fails a class that is below the required ratio, unless it holds a reasoned exception.", "how": ["JaCoCo (0.8.14) records which lines and branches ran during tests. Only LINE and BRANCH are enforced; the other counters mostly repeat them. The default for <b>every class<\/b> is 100% of lines and 100% of branches (the code default; CLAUDE.md and the guide say 90/85, see Mismatches). Example: a class with 20 lines of which 19 ran fails; so does a class whose one <code>if<\/code> was only ever tested with true.", "Per-class exceptions are declared in a module with <code>coverageConfig { exception(pattern, reason, mapOf(\"BRANCH\" to 0.9)) }<\/code>. The pattern is a class-name glob such as <code>com.infenia.yukta.mapper.*MapperImpl<\/code>. A counter not listed keeps its default. A ratio below 80% (the floor) requires a reason or the build throws; a reason is recorded for any exception.", "A stale check runs before verification: every exception pattern must match at least one compiled class, or the build fails with 'coverage exceptions match no class (stale, delete them)'. This is why an empty <code>coverageConfig { }<\/code> is harmless but a leftover pattern is not.", "An after-configuration guard throws if a module disables jacocoTestCoverageVerification. The rule: fix the code or add a narrow, reasoned exception, never turn the check off. Other tasks (PMD, Checkstyle) have no such guard.", "Reports (XML and HTML) are only produced on request with <code>-Pcoverage<\/code>, but verification always depends on the report task, so <code>check<\/code> still builds one. Verification and the report skip themselves if no execution data file exists. JDK packages (java.*, javax.*, sun.*, jdk.*, ...) are not instrumented.", "Today only one exception exists in the repository: web allows generated MapStruct mappers 90% branch coverage (the generated loops contain compiler-added branches no test can reach). Other modules declare an empty <code>coverageConfig { }<\/code>."], "guar": "No class in a module can fall below its ratio without a visible, reasoned line in that module's build file, and the list of exceptions cannot contain dead entries.", "state": "JaCoCo .exec files and reports under each module's build directory. CI uploads coverage to Codecov (best-effort).", "ceil": "Per-class strictness scales linearly with code but makes every new defensive branch cost a test. Coverage is a floor on executed code, not proof that assertions are good.", "fail": "A violation fails jacocoTestCoverageVerification with the class name and ratio. A module with no execution data is skipped silently.", "set": ["coverageConfig { exception(pattern, reason, thresholds) }", "-Pcoverage", "-PfailFast", "./gradlew jacocoTestCoverageVerification"], "risks": ["coverageNoData", "strict100", "docDrift"]}, {"id": "node", "name": "Node Conventions", "tag": "UI toolchain, ui only", "c": 1, "r": 2, "resp": "Pins Node and pnpm for the ui module and makes its tasks use them.", "how": ["The versions come from the catalog: Node 24.13.1 and pnpm 10.30.1. The node-gradle plugin (7.1.0) downloads them into the project so every developer builds the UI with the same tools.", "When the environment variable <code>CI<\/code> is set, downloading is turned off and the system Node is used. Reason: GitHub Actions already installs Node and pnpm through its own setup steps, and downloading again wastes time. Side effect: CI only asks for Node 24 (any minor) and pnpm 10.30.1 in the build job, but the E2E job asks for pnpm 10.", "npm and yarn Gradle tasks are disabled, because the UI uses only pnpm. The ui module itself defines pnpmBuild, header validation and a package.json version check; its unit tests (pnpmTest) are defined but not wired into check (commented out in ui/build.gradle.kts)."], "guar": "Locally, the UI build always uses the pinned Node and pnpm. In CI, the pnpm version is pinned but the Node minor version is not.", "state": "Node and pnpm are downloaded by the node-gradle plugin into its own locations (not the system install) and reused between builds.", "ceil": "Only the ui module uses it; cost is the first-time download and pnpm install.", "fail": "If the CI environment variable is set locally, Gradle expects a system Node and fails if there is none. If the pinned Node is not on the download server, the UI build fails.", "set": ["node and pnpm in gradle/libs.versions.toml", "CI environment variable"], "risks": ["nodeDrift"]}, {"id": "ci", "name": "CI Pipeline", "tag": "GitHub Actions gates", "c": 3, "r": 1, "resp": "Runs the conventions' gates on every pull request and push, plus scans that are not part of check.", "how": ["On a pull request, a path filter decides what changed. If any of build-logic/**, config/**, gradle/**, build.gradle.kts, settings.gradle.kts, gradlew, lombok.config or the workflows changed, the whole build runs (<code>./gradlew build jacocoTestReport<\/code>). Otherwise each changed module runs <code>buildDependents<\/code>, meaning the module plus everything that depends on it. On pushes to main and the nightly schedule everything builds.", "The lint job insists that every module in settings.gradle.kts has a path filter in ci.yml, and the shard planner (.github/scripts/ci-tasks.sh) fails if a module has no task mapping. So a new module needs edits in settings, the filter list in ci.yml, and the path map and group_of function in ci-tasks.sh.", "CI installs the same toolchain locally needed: JDK 25, Go, Node 24, pnpm 10.30.1, OpenGrep v1.25.0 (checksum verified) and Trivy v0.72.0. The wrapper jar is validated and Actions are pinned by commit hash.", "Separate workflows run Trivy (security.yml: secret scan blocks every run; vulnerability scan blocks only on main, schedule and manual runs, and reports without failing on pull requests), the licence checks, CodeQL and OpenSSF Scorecard. A dependency-review job fails PRs that add HIGH-severity vulnerable dependencies.", "A lock-file check exists, but it exits early when no gradle.lockfile is tracked, which is the current state. The final job, CI Gate, is the single required check: it passes if every job succeeded or was skipped."], "guar": "Pull requests cannot merge unless CI Gate is green; scans run with pinned tool versions, so a tool upgrade is a visible diff.", "state": "Reports and test results are uploaded as run artifacts for 7 days; Trivy SARIF goes to GitHub security. Nothing else persists.", "ceil": "A root-file change runs every module, now as four parallel shards (platform, infra, plugins, frontend) with a 30-minute timeout each and shared caches; a library change (core, web, messaging, plugin-api, mcp) re-runs every shard.", "fail": "A skipped job counts as success, so a wrong path filter could skip a needed job. A failing Trivy vulnerability scan on a PR does not block the PR (main does).", "set": ["OPENGREP_VERSION, OPENGREP_SHA256, Trivy version in ci.yml", "changes job path filters", "timeout-minutes: 30"], "risks": ["noLockfiles", "ciManualMap", "trivyPrGate", "fullBuildOnRoot", "nodeDrift"]}], "mapFlag": {"label": "Highlight bypassable gates", "hint": "Dashed amber = a gate that can pass without running, or that a module can switch off", "badge": "SKIP"}, "mapLegend": "Solid arrows carry the normal flow of rules and results. Dashed arrows are configuration or installation. Amber components contain a gate that can be skipped or switched off.", "edges": [["catalog", "plugins", "ctrl", "versions"], ["plugins", "javaconv", "data", "applies"], ["plugins", "boms", "data", "applies"], ["plugins", "format", "data", "applies"], ["plugins", "node", "ctrl", "ui only"], ["javaconv", "coverage", "data", "tests"], ["boms", "license", "data", "jars"], ["format", "ci", "data", "verdict"], ["license", "ci", "data", "verdict"], ["opengrep", "ci", "data", "verdict"], ["coverage", "ci", "data", "verdict"], ["ci", "opengrep", "ctrl", "pinned binary"], ["catalog", "boms", "ctrl", "netty"]], "scen": [{"id": "check", "name": "Run ./gradlew check", "steps": [{"t": "Configure the module", "d": "Gradle compiles build-logic, then applies library-conventions to the module. That applies java, quality and jacoco conventions and imports the three BOMs. The module's own build file is only a few lines.", "c": ["plugins", "catalog", "boms"], "r": ["docDrift"]}, {"t": "Compile with Error Prone", "d": "javac builds for Java 25 with -parameters; Lombok writes boilerplate; Error Prone checks for bug patterns during compilation (default settings; generated code is skipped). Reason for checking inside the compiler: the bug is reported at the exact line, before any other tool runs.", "c": ["javaconv", "format"], "r": ["advisoryTools"]}, {"t": "Format and style", "d": "spotlessCheck compares the files to google-java-format and the licence header. Checkstyle, PMD and SpotBugs then read main and test code. Checkstyle with maxWarnings 0 turns warnings into failures. Any difference fails the build and prints the file.", "c": ["format"], "r": ["disabledTasks"]}, {"t": "Tests with the coverage agent", "d": "JUnit 5 runs tests in up to CPUs/2 JVMs, each with the JaCoCo agent attached. The agent records, per class, every line and branch that ran.", "c": ["javaconv", "coverage"], "r": []}, {"t": "Verify coverage", "d": "For each class, covered lines / total lines and covered branches / total branches must both be 1.00 unless an exception applies. Example: a class with one uncovered else-branch fails with its name and ratio. Exceptions are checked for staleness first.", "c": ["coverage"], "r": ["strict100", "coverageNoData"]}, {"t": "Scan and licence check", "d": "If the opengrep program exists, it scans src/main against the four rules (one module at a time, shared across modules). licensee checks the licences of the dependencies against the allow-list. Both fail the build on a violation.", "c": ["opengrep", "license"], "r": ["opengrepSilentSkip", "opengrepEveryModule"]}]}, {"id": "addmodule", "name": "Add a new module", "steps": [{"t": "Include and apply", "d": "The developer adds include(\"...\") to settings.gradle.kts and a build file whose first line applies library-conventions. That is the whole setup for the toolchain, BOMs and every gate.", "c": ["plugins", "catalog"], "r": []}, {"t": "Dependencies by name", "d": "The module lists libraries such as libs.reactor.core without versions. The BOMs and catalog supply them. If a library is not in either, it must be added to the catalog first, so no module hardcodes a version.", "c": ["boms", "catalog"], "r": ["nettyTwoSources"]}, {"t": "First check run", "d": "The new module has to satisfy the default: 100% line and branch coverage per class and every static-analysis rule. A new module with generated code (for example MapStruct) will hit the exception path.", "c": ["coverage", "format"], "r": ["strict100"]}, {"t": "CI registration", "d": "The module needs a path filter in ci.yml and a case in the partial-build step. The lint-workflows job and the partial-build step both fail on a missing entry, so forgetting is caught on the first pull request.", "c": ["ci"], "r": ["ciManualMap"]}, {"t": "Merge and boot wiring", "d": "If it is an optional plugin, boot lists it in an optionalPlugins map selected with -Pyukta.plugins. This is outside build-logic but follows the same convention of being declared in one place.", "c": ["ci"], "r": []}]}, {"id": "coveragefail", "name": "A class misses coverage", "steps": [{"t": "The failure", "d": "A developer adds a defensive branch and no test reaches it. jacocoTestCoverageVerification reports the class and the ratio, for example BRANCH 0.83 against the minimum 1.00, and the build fails.", "c": ["coverage"], "r": ["strict100"]}, {"t": "Preferred fix", "d": "Write the missing test or remove the unreachable branch. This is the expected route, because exception sprawl was an earlier problem that the current policy was written to stop (improvements note L3).", "c": ["coverage"], "r": []}, {"t": "Reasoned exception", "d": "If the branch is truly unreachable (generated code, compiler-made branches), add coverageConfig { exception(pattern, reason, mapOf(\"BRANCH\" to 0.9)) }. Below 0.80 a reason is mandatory; the helper always stores one.", "c": ["coverage"], "r": []}, {"t": "The shortcut that fails", "d": "Setting jacocoTestCoverageVerification.enabled = false throws at configuration time: 'must not be disabled'. Leaving an exception for a class that is later deleted or renamed fails the stale check on the next build.", "c": ["coverage"], "r": []}, {"t": "The shortcut that works", "d": "Disabling PMD, Checkstyle or SpotBugs tasks has no guard. Four modules do so today for test or main sources, each with a 'temporarily disabled' comment. Likewise a module with no test execution data skips coverage verification.", "c": ["format", "coverage"], "r": ["disabledTasks", "coverageNoData"]}]}, {"id": "skipped", "name": "OpenGrep skipped locally", "steps": [{"t": "Developer without the tool", "d": "A developer has not installed the opengrep program. They write new StandardEvaluationContext(...) in a plugin and run ./gradlew check.", "c": ["opengrep"], "r": ["opengrepSilentSkip"]}, {"t": "The probe", "d": "The task starts the program with --version. The process cannot start, an IOException is caught, and the task is marked skipped. No message is printed.", "c": ["opengrep"], "r": []}, {"t": "Green locally", "d": "All other gates pass; the build is green. The developer pushes.", "c": ["format", "coverage"], "r": []}, {"t": "Red in CI", "d": "CI installed OpenGrep v1.25.0 and checked its SHA-256 before the build. The scan finds the banned pattern and --error fails the build, so the pull request cannot merge. The fix: restructure, or add '// nosem: yukta-spel-standard-evaluation-context - reason'.", "c": ["ci", "opengrep"], "r": []}]}, {"id": "license", "name": "A bad licence arrives", "steps": [{"t": "New dependency", "d": "A developer adds a library that is licensed under LGPL (or declares no licence). The Maven metadata names the licence.", "c": ["boms", "license"], "r": []}, {"t": "licensee fails", "d": "licensee compares the licence with the allow-list and fails with the artifact and licence. CI runs the same task in the license-compliance workflow, and a Trivy licence scan runs beside it.", "c": ["license", "ci"], "r": []}, {"t": "Options", "d": "Pick another library; or get legal approval and add an allowDependency(group, artifact, version) { because(...) } entry. The exception names one artifact and one version, so it cannot cover anything else.", "c": ["license"], "r": ["legalSignoff"]}, {"t": "The existing example", "d": "nashorn-core 15.4 (GPL-2.0 with Classpath Exception) is allowed this way. It arrives with Handlebars in internal-core, and the reason text in the build file still blames GraalVM JS. Sign-off for static linking into the native image is still pending.", "c": ["license"], "r": ["legalSignoff"]}]}, {"id": "netty", "name": "Patch a Netty CVE", "steps": [{"t": "The alert", "d": "A Netty vulnerability is announced. Spring Boot's own BOM pins an older Netty, so a normal Boot upgrade is not enough or not yet available.", "c": ["boms"], "r": []}, {"t": "Bump the catalog", "d": "The developer sets netty = 4.2.18.Final in the catalog. spring-conventions imports netty-bom after the Boot BOM so the newer version should win. Dependabot already proposes such bumps (the 4.2.18 bump came from a grouped Dependabot PR).", "c": ["catalog", "boms"], "r": []}, {"t": "What actually happened", "d": "Until PR #373 the properties file won: gradle.properties still says netty.version=4.2.16.Final, and the boot jar built after the bump contained 4.2.16 Netty jars. spring-conventions now assigns netty.version from the catalog, and boot resolves 4.2.18.Final.", "c": ["boms", "catalog"], "r": ["nettyTwoSources"]}, {"t": "Why nothing stops it", "d": "Still no test or gate asserts the resolved Netty version, and no lock files record it. Trivy would only notice on main or schedule runs.", "c": ["ci"], "r": ["noLockfiles", "trivyPrGate"]}, {"t": "The fix", "d": "Delete the leftover gradle.properties line so the catalog is the only visible source, and add a check on the resolved version. Then commit lock files so any drift becomes a diff.", "c": ["catalog", "boms"], "r": []}]}], "intro": {"check": "What one ./gradlew check does to a library module, stage by stage, and which tool is responsible for each stage.", "addmodule": "How little a new module needs, and where the one manual step (CI registration) is caught.", "coveragefail": "How the coverage rule fails, the honest ways out, and the two shortcuts (one guarded, one not).", "skipped": "An edge case: a gate that passes locally because its tool is missing, and fails in CI.", "license": "How an unapproved licence is stopped, and how the one exception was made.", "netty": "A failure case from the repository itself: a security bump that is set in two places and not fully applied."}, "capsLede": "Every capability below is something a module gets by applying a convention plugin, grouped by what it protects.", "caps": [["Toolchain", "Java 25 toolchain", "All modules compile with a JDK 25 toolchain and release 25.", "java-conventions sets languageVersion 25 and options.release 25.", "One language level everywhere.", "Needs JDK 25 installed; no auto-download."], ["Toolchain", "Parameter names kept", "Method parameter names stay in class files.", "-parameters is added to every JavaCompile task.", "Spring and Jackson can bind by name.", "Applies to compiled Java only."], ["Toolchain", "Lombok", "Getters, constructors and builders generated at compile time.", "The freefair Lombok plugin; lombok.config tags output @Generated.", "JaCoCo ignores generated code.", "The freefair plugin picks the Lombok version; the catalog's lombok library entry is not referenced by any build script."], ["Toolchain", "Test runner setup", "JUnit 5 tests run in parallel forks.", "maxParallelForks = CPUs/2, ParallelGC, TieredStopAtLevel=1, optional failFast.", "Same runner everywhere.", "Forks are separate JVMs; memory grows with them."], ["Dependencies", "Imported BOMs", "Spring Boot, Spring AI and Netty versions pinned centrally.", "dependency-management plugin imports three BOMs in order.", "A library has one version across modules.", "Nothing checks the resolved Netty version."], ["Dependencies", "Shared catalog", "One file lists versions for modules and build-logic.", "build-logic/settings.gradle.kts loads ../gradle/libs.versions.toml.", "No second copy to drift.", "gradle.properties also carries netty.version."], ["Dependencies", "Locking declared", "Every project asks Gradle to lock all configurations.", "dependencyLocking { lockAllConfigurations() } in the root build.", "Nothing yet: no lock files are committed.", "CI skips verification without lock files."], ["Quality", "Formatting and header", "Google Java Format and an Apache licence header on Java, Kotlin scripts and XML.", "Spotless; spotlessApply fixes, spotlessCheck verifies.", "Uniform style, no style arguments.", "Kotlin target only matches files in each module's own folder."], ["Quality", "Style and bug tools", "Checkstyle, PMD, SpotBugs and Error Prone.", "Rule files in config/; maxWarnings = 0; Error Prone in javac.", "Findings fail the build, except Error Prone warnings.", "A module may disable its own tasks."], ["Quality", "AOT code exempt", "Spring AOT-generated code is not analysed.", "Tasks named *Aot* of Checkstyle, PMD, SpotBugs, OpenGrep and Spotless are disabled.", "No noise from generated code.", "Relies on task naming."], ["Security", "OpenGrep rules", "Four banned patterns (SpEL context, script host access, class lookup, actuator exposure).", "Local pinned ruleset, --error, nosem comments with reasons.", "A banned pattern in main code fails check when the tool is present.", "Skipped silently if not installed; four rules only."], ["Security", "Licence allow-list", "Dependencies must use an approved licence.", "licensee with allow, allowUrl and one allowDependency exception.", "Unapproved licences fail the build.", "Legal sign-off for the one GPL exception is pending."], ["Security", "CVE pin on a build tool", "plexus-utils pinned to 3.6.1 for Checkstyle.", "A constraint on the checkstyle configuration.", "The tool's own classpath avoids CVE-2025-67030.", "Only that configuration."], ["Coverage", "Per-class 100% rule", "Each class needs 100% line and 100% branch coverage.", "JaCoCo verification rule on element CLASS.", "No class hides behind a good average.", "Strict; generated code needs exceptions."], ["Coverage", "Reasoned exceptions", "A class may sit lower with a written reason.", "coverageConfig.exception(pattern, reason, thresholds); below 0.80 needs a reason.", "Every lowering is visible in git.", "Only one exception exists today (web)."], ["Coverage", "Stale and disabled guards", "Dead exceptions and disabled verification fail the build.", "A pre-verification pattern check and an afterEvaluate check.", "The exception list stays honest.", "Only covers coverage, not the other gates."], ["Frontend", "Pinned Node and pnpm", "The UI builds with Node 24.13.1 and pnpm 10.30.1.", "node-gradle plugin with versions from the catalog; npm and yarn tasks disabled.", "Reproducible UI builds locally.", "CI uses system Node (24.x) when CI is set."], ["CI", "Path-filtered builds", "Pull requests build changed modules and their dependents.", "paths-filter job, buildDependents, full build when root files change.", "Fast PRs without skipping dependents.", "Needs manual registration of each module."]], "guar": {"title": "Guarantees and limits", "lede": "The build rules are only as strong as the places they actually run. Pick where the build runs and see which gates apply, then read the thresholds and what is advisory.", "profileLabel": "Where the build runs", "profiles": ["Laptop: ./gradlew check", "CI: pull request", "CI: push to main / nightly"], "defaultProfile": 0, "tables": [{"title": "Which gates run where", "profiled": true, "head": ["Gate", "Where it runs"], "lede": "A pull request builds only changed modules and what depends on them, unless a root file changed. Main and the nightly run build everything.", "rows": [["Spotless, Checkstyle, PMD, SpotBugs, Error Prone", ["ok", "In check for every module"], ["ok", "Changed modules and dependents (all if root files changed)"], ["ok", "All modules"]], ["Tests + coverage verification (100% line/branch per class)", ["ok", "In check; skipped if no test data"], ["ok", "Same, for the built modules"], ["ok", "Same, all modules; coverage also uploaded to Codecov"]], ["OpenGrep (4 rules)", ["part", "Only if the opengrep program is installed; skipped silently otherwise"], ["ok", "Installed at v1.25.0 with SHA-256 check"], ["ok", "Same as pull request"]], ["Licence allow-list (licensee)", ["ok", "./gradlew licensee; check also runs it by plugin default (not verified here)"], ["ok", "Own workflow: REUSE headers, licensee, Trivy licence scan"], ["ok", "Same"]], ["Trivy vulnerabilities", ["info", "On demand: ./gradlew trivy"], ["part", "Reported to GitHub security; does not fail the PR"], ["ok", "Fails on HIGH or CRITICAL"]], ["Trivy secret scan", ["lost", "Not run"], ["ok", "Blocking"], ["ok", "Blocking"]], ["Dependency lock verification", ["lost", "No lock files"], ["part", "Step skipped: no gradle.lockfile is committed"], ["part", "Step skipped"]], ["Dependency review (new vulnerable dependencies)", ["lost", "Not run"], ["ok", "Fails on high severity"], ["info", "Graph submitted, no review job"]], ["UI unit tests (pnpmTest)", ["lost", "Not part of check (commented out)"], ["lost", "Not part of check"], ["lost", "Not part of check"]]]}, {"title": "Defaults and thresholds", "head": ["Setting", "Value", "Where it is set"], "rows": [["Java toolchain and release", "25", "java-conventions"], ["Coverage defaults", "LINE 1.00 and BRANCH 1.00 per class", "jacoco-conventions (code); older docs say 90/85"], ["Coverage floor needing a reason", "Below 0.80", "jacoco-conventions"], ["Checkstyle max warnings", "0", "quality-conventions"], ["Format limits", "100 columns, 2-space indent (google-java-format)", "Spotless; Checkstyle LineLength 100"], ["Tool versions", "Checkstyle 13.2.0, PMD 7.21.0, SpotBugs plugin 6.5.12, Error Prone 2.50.0, Spotless 8.10.3, JaCoCo 0.8.14, licensee 1.14.1", "gradle/libs.versions.toml"], ["Frontend tools", "Node 24.13.1, pnpm 10.30.1", "gradle/libs.versions.toml"], ["Test parallelism", "max(1, CPUs / 2) forks", "java-conventions"], ["Gradle", "Wrapper 9.8.0; build cache on; parallel on, 8 workers; configuration cache off; 4 GB heap", "gradle-wrapper.properties, gradle.properties"]]}, {"title": "Enforced versus advisory", "head": ["Rule", "Status", "Detail"], "rows": [["Format, style, bug patterns (Spotless, Checkstyle, PMD, SpotBugs)", ["ok", "Enforced"], "Failures fail check; a module may still disable a task"], ["Error Prone", ["part", "Errors only"], "Warning-level findings do not fail the compile"], ["Coverage", ["ok", "Enforced"], "Cannot be disabled; exceptions need reasons below 0.80; stale entries fail"], ["OpenGrep", ["part", "Enforced when installed"], "--error; silently skipped when the program is missing"], ["Licences", ["ok", "Enforced"], "Allow-list plus one named exception"], ["Dependency locking", ["lost", "Declared only"], "No lock files are committed"], ["Go and TypeScript code", ["info", "Other pipelines"], "cli uses Makefile targets; ui uses pnpm; not covered by this toolchain"]]}]}, "ref": [{"id": "addmod", "title": "How to add a module", "lede": "Three files, plus the module's own source. Copy the snippet, then follow the rules.", "head": ["Step", "What to do", "Why"], "rows": [["1. Register", "Add <code>include(\"path:to:module\")<\/code> in settings.gradle.kts", "Gradle only builds listed modules; the CI lint job reads this list."], ["2. Build file", "<code>plugins { id(\"com.infenia.yukta.library-conventions\") }<\/code> then your <code>dependencies { ... }<\/code>", "One line gives toolchain, BOMs and every gate. Use spring-conventions only for an application or bundle that must not be java-library."], ["3. Versions", "Name libraries through <code>libs.&lt;alias&gt;<\/code>; add new versions to gradle/libs.versions.toml, never inline", "One place to bump and to scan."], ["4. Coverage", "Aim for none. If needed: <code>coverageConfig { exception(\"pattern\", \"reason\", mapOf(\"BRANCH\" to 0.9)) }<\/code>", "Below 0.80 a reason is required; a pattern that matches nothing fails the build."], ["5. CI", "Add a path filter in ci.yml 'changes' job and a case in the partial-build step", "Without them lint-workflows or the partial build fails."], ["6. Do not", "Set <code>enabled = false<\/code> on a quality or coverage task; set a version in the module; add SPDX headers to Markdown", "Disabling coverage fails; the others hide drift. Run ./gradlew spotlessApply before committing."], ["7. Optional plugin?", "If boot should include it optionally, add it to the optionalPlugins map in boot/build.gradle.kts", "-Pyukta.plugins selects which plugins are in the image."]]}, {"id": "gates", "title": "Gate list", "lede": "What each gate checks and where its configuration lives. 'Fails' means a finding fails the build.", "head": ["Gate", "What it checks", "Config location", "Fails?", "Task"], "rows": [["Spotless", "google-java-format, licence header (Java, Kotlin scripts, XML), whitespace, trailing newline", "quality-conventions; config/license/header*.txt", "Yes", "spotlessCheck / spotlessApply"], ["Checkstyle", "Google-style rules, 100 columns, import order, no star imports", "config/checkstyle/checkstyle.xml", "Yes (maxWarnings 0)", "checkstyleMain, checkstyleTest"], ["PMD", "Eight rule categories (best practices, style, design, docs, error-prone, multithreading, performance, security)", "config/pmd/ruleset.xml", "Yes", "pmdMain, pmdTest"], ["SpotBugs", "Bytecode bug patterns", "config/spotbugs/exclude.xml (reviewed false positives)", "Yes", "spotbugsMain, spotbugsTest"], ["Error Prone", "Compile-time bug patterns", "quality-conventions (generated code excluded)", "Errors only", "compileJava"], ["licensee", "Dependency licences against the allow-list", "quality-conventions licensee block", "Yes", "licensee"], ["OpenGrep", "Four banned code patterns in src/main", "config/opengrep/.semgrep.yml", "Yes, if installed", "opengrep"], ["JaCoCo", "100% line and branch per class, exceptions, stale and disabled guards", "jacoco-conventions; module coverageConfig", "Yes", "jacocoTestCoverageVerification"], ["UI checks", "SPDX headers in UI sources; package.json version equals the Gradle version", "ui/build.gradle.kts", "Yes", "validateHeaders, verifyPackageVersion"], ["Trivy", "HIGH and CRITICAL vulnerabilities, secrets, misconfiguration", "build.gradle.kts (on demand); .github/workflows/security.yml", "CI only", "trivy (root)"]]}, {"id": "plugins", "title": "Convention plugin map", "head": ["Plugin", "Applies", "Adds"], "rows": [["library-conventions", "java-library, spring-conventions", "Library packaging (api and implementation configurations). Used by 24 modules."], ["spring-conventions", "java, quality, jacoco conventions; Spring dependency management", "Boot, Spring AI and Netty BOMs; spring-boot-starter-test and reactor-test. Used directly by boot and ui."], ["java-conventions", "java, Lombok plugin", "Toolchain 25, release 25, -parameters, Maven Central, JUnit launcher, test task settings."], ["quality-conventions", "Spotless, Checkstyle, PMD, SpotBugs, Error Prone, licensee", "Rule wiring, licence allow-list, OpenGrep task, Aot exemptions, plexus-utils pin."], ["jacoco-conventions", "jacoco", "coverageConfig extension, defaults, floor, stale and disabled guards, report wiring."], ["node-conventions", "node-gradle plugin", "Node and pnpm versions, local download vs CI system Node, npm and yarn tasks disabled. Used by ui."]]}, {"id": "exceptions", "title": "Coverage exceptions in the repository (corrected)", "lede": "The old guide listed eight modules with entries; none of that is true now. Verified by reading every module build file.", "head": ["Module", "Entries", "Detail"], "rows": [["web", "1", "com.infenia.yukta.mapper.*MapperImpl, BRANCH 0.9: MapStruct null guards the request records already normalise"], ["messaging, plugin-api, decision, file-io, http-request, script-js, llm-call, mcp-tool-call, process-executor, session-memory, sql-query, schedule-trigger", "0", "An empty coverageConfig { } block remains in each; it does nothing."], ["core, mcp, boot, ui, internal-core, constant-source and the other modules", "0", "No coverageConfig block."]]}, {"id": "opengrep", "title": "OpenGrep rules", "head": ["Rule id", "Bans", "Why"], "rows": [["yukta-spel-standard-evaluation-context", "new StandardEvaluationContext(...)", "Lets a Spring expression call any method or type. Use SimpleEvaluationContext, or justify."], ["yukta-graalvm-host-access-all", "HostAccess.ALL", "Exposes every Java method and field to guest scripts."], ["yukta-graalvm-allow-host-class-lookup", "allowHostClassLookup(s -> true)", "Lets scripts load any host class; use an allow-list predicate."], ["yukta-actuator-expose-all", "include: '*' in YAML", "Exposes every actuator endpoint; list endpoints instead."]]}, {"id": "licences", "title": "Licence allow-list", "head": ["Kind", "Entries"], "rows": [["SPDX ids", "Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, Unlicense, 0BSD, Python-2.0, EPL-1.
