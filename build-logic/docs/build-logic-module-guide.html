0, EPL-2.0, UPL-1.0"], ["Per-artifact exception", "org.openjdk.nashorn:nashorn-core:15.4 (GPL-2.0 with Classpath Exception; arrives via Handlebars in internal-core)"], ["Allowed URLs", "ANTLR (3 forms), ASM, webjars-locator-lite, ICU, JBoss Apache text, Eclipse EDL (2 forms), opensource.org MIT and UPL (3 forms)"]]}], "quality": [{"n": "Scalability", "pos": "Scales with module count, not users. Each of 27 modules runs its own analysis, and the checks that cannot be cached (OpenGrep, which declares no outputs) grow linearly. CI runs a whole-repo build whenever a root file changes.", "ceil": ["OpenGrep runs one module at a time (a shared service) but is cacheable, so unchanged modules are skipped", "A catalog, config or build-logic change triggers a full CI build", "One CI runner with a 30-minute timeout", "Test forks are limited by memory"], "have": ["Gradle build cache and parallel execution", "Path-filtered PR builds with buildDependents", "Test forks scaled to CPUs / 2"], "need": ["Run OpenGrep once at the root or give it declared outputs", "Split a full build across runners if it nears the timeout", "Remote build cache for CI and laptops"]}, {"n": "Performance", "pos": "A local ./gradlew check is the developer's inner loop, so its time is what matters. Rules are heavy (five analysers, per-class coverage, a scan), and CLAUDE.md steers developers toward the smallest test scope.", "ceil": ["Static analysis is not incremental across the board", "Coverage verification depends on every test finishing", "Configuration cache is off (Go tasks are incompatible)", "Test JVMs run at the lowest compiler tier"], "have": ["Build cache on; parallel on with 8 workers", "JaCoCo reports built only with -Pcoverage", "Tests in parallel forks, ParallelGC"], "need": ["Turn on the configuration cache for modules that allow it", "Measure which gate dominates check time", "Exclude test sources from the slowest analysers if needed (judgement)"]}, {"n": "Availability", "pos": "Barely applies to production, since build-logic runs nowhere at run time. It matters for the availability of the build: a broken convention plugin stops everyone, and CI downloads tools and rules at run time.", "ceil": ["One broken convention script fails every module", "CI depends on GitHub, Maven Central, the Gradle plugin portal and tool download sites", "No JDK 25 means no build"], "have": ["OpenGrep rules are local, so no rule download", "Pinned Action SHAs and a checked OpenGrep binary", "The wrapper jar is validated"], "need": ["A mirror or cache for plugin and dependency downloads", "A toolchain resolver or documented JDK setup", "Dependency lock files to make restores deterministic"]}, {"n": "Security", "pos": "This is where build-logic earns its keep: it is the supply-chain control point. It bans four dangerous code patterns, enforces a licence list, pins CVE-affected versions, and CI pins tools by checksum or commit hash.", "ceil": ["Locking is declared but no lock files exist, so resolved versions are not recorded", "Vulnerability scan blocks only on main, not on pull requests", "Four OpenGrep rules cover few risk patterns", "A stale Netty line remains in gradle.properties; the resolved version is not asserted"], "have": ["Local pinned OpenGrep rules with --error", "Licence allow-list with one per-artifact exception", "Netty BOM imported after Boot; plexus-utils pinned", "Secret scan blocking on every run; dependency review on PRs"], "need": ["Commit lock files and enable the CI lock check", "Remove the stale Netty line and add a check of the resolved version", "More OpenGrep rules for the plugin sandbox and file access", "Legal sign-off for the nashorn-core exception"]}, {"n": "Operability", "pos": "Developer experience: clear failures, one command to fix formatting, and a documented way to add a module. The weak spots are silent skips and docs that disagree with the code.", "ceil": ["Silent skip when opengrep is missing", "Docs say 90/85 while code enforces 100/100", "Adding a module needs edits in settings and two places in ci.yml", "Failure messages come from several tools in different styles"], "have": ["spotlessApply fixes formatting", "Reasoned coverage exceptions and stale-entry errors with clear messages", "CI lint reports a missing path filter by name"], "need": ["Print a warning when OpenGrep is skipped", "Keep CLAUDE.md and guides in step with the code", "Generate the CI module list from settings.gradle.kts"]}, {"n": "Evolvability", "pos": "Good: rules are in one place, versions in one catalog, and the plugins are small and layered. The cost is that a rule change hits all 27 modules at once, and a few module-level escapes exist.", "ceil": ["A new strict rule blocks every module at once", "spring-conventions is the de facto standard bundle (naming)", "Quality tooling is Java only", "Escape hatches in module build files"], "have": ["Layered plugins", "Reasoned exception DSL", "Config files separate from code"], "need": ["A rollout path for new rules (warn first, then fail)", "A guard against disabling quality tasks", "A decision on how Kotlin build code is checked"]}], "risks": [{"id": "nettyTwoSources", "t": "Netty: the catalog wins now, but a stale 4.2.16 line remains and nothing asserts it", "a": "Security", "i": 2, "e": 1, "c": ["catalog", "boms"], "why": "Done (PR #373): <code>spring-conventions<\/code> now assigns <code>netty.version<\/code> from the catalog and imports the Netty BOM from it, and <code>:boot:dependencyInsight<\/code> on 2026-10-15 shows netty-codec-http at 4.2.18.Final, so a Dependabot bump of the catalog reaches the application. Still open: <code>gradle.properties<\/code> still contains <code>netty.version=4.2.16.Final<\/code> with its CVE comment, which misleads a reader and would win again if the assignment were removed; and no check fails when the resolved version differs from the catalog.", "o": "Delete the gradle.properties line; add a small check (or test) that compares the resolved Netty with the catalog.", "q": "Which of the two numbers did we intend to ship, and who owns re-checking the other after a Dependabot bump?"}, {"id": "noLockfiles", "t": "Dependency locking is declared but no lock files exist", "a": "Security", "i": 3, "e": 3, "c": ["catalog", "ci"], "why": "The root build runs lockAllConfigurations() for every project, and the CI step 'Verify dependency lock files are up-to-date' exits at once because no gradle.lockfile is tracked (git ls-files finds none). Resolved versions can drift between builds, and the SBOM and Trivy documentation refers to lock files that do not exist.", "o": "Generate and commit lock files (the CI step already shows the command), or remove the locking line and the lock-file docs until the team wants it. A middle path: lock only the boot runtime classpath.", "q": "Is reproducibility of resolved dependencies a goal today, or is the BOM pinning enough?"}, {"id": "opengrepSilentSkip", "t": "OpenGrep is skipped silently when the program is not installed", "a": "Operability", "i": 3, "e": 2, "c": ["opengrep"], "why": "The task probes opengrep --version and skips on failure without a message. A developer gets a green local check and a red CI. Worse, a team that never installs it checks nothing locally. The skip exists so first-time contributors can build, but it hides the gate.", "o": "Print a visible warning when skipped; add an opt-in flag that makes absence an error (for the pre-push hook); provide a wrapper that downloads the pinned binary like the Gradle wrapper does.", "q": "Is a contributor without OpenGrep better served by a warning, by a hard failure, or by an automatic download?"}, {"id": "opengrepEveryModule", "t": "OpenGrep is cacheable now but still starts once per module", "a": "Performance", "i": 1, "e": 2, "c": ["opengrep"], "why": "Done: the task declares the SARIF report as an output and is cacheable, so a module whose sources and rules did not change is skipped. Still open: a changed module starts its own scan (one at a time, through the shared build service), and each module first starts <code>opengrep --version<\/code> to see whether the program exists.", "o": "Run one root-level scan over all src/main folders, or probe for the program once per build.", "q": "Would one repository-wide scan lose anything we rely on per module, such as report location or --error behaviour?"}, {"id": "disabledTasks", "t": "Modules can disable quality tasks and nothing prevents it", "a": "Governance", "i": 3, "e": 2, "c": ["format"], "why": "Only jacocoTestCoverageVerification is guarded. mcp and plugin-api disable pmdTest; internal-core disables pmdMain, pmdTest and checkstyleTest; and constant-source disables pmdMain and pmdTest, each with a 'temporarily disabled' comment (four modules, up from three). internal-core is the module where untested plugin logic sits, so the weakest checks are on the code that benefits most from them.", "o": "Extend the afterEvaluate guard to every quality task with an allow-list of dated, reasoned entries like coverage exceptions; then fix or burn down the three temporary disables.", "q": "Should disabling a quality task require the same written reason as lowering coverage, and should it expire?"}, {"id": "coverageNoData", "t": "Coverage verification passes when a module has no test data", "a": "Correctness", "i": 3, "e": 1, "c": ["coverage"], "why": "Both the report and the verification task have onlyIf { execution data exists }. If a module's tests are deleted, filtered out or never run, verification is skipped and check passes with no coverage at all. The guard against disabling verification does not cover this.", "o": "Fail when a module has main classes but no execution data (with an explicit opt-out for pure-API modules); or compare against a minimum test count.", "q": "Which modules legitimately have no tests, and can that list be written down?"}, {"id": "legalSignoff", "t": "Copyleft exception for the native image still lacks legal sign-off (L5)", "a": "Governance", "i": 4, "e": 2, "c": ["license"], "why": "nashorn-core 15.4 (GPL-2.0 with Classpath Exception) is allowed by name, but the GraalVM native image links libraries statically. The improvements note marks sign-off as a human task still open. The written reason also names the wrong source: the library arrives via Handlebars in internal-core, not via GraalVM JS.", "o": "Get a legal opinion and record it next to the exception; or drop the dependency by replacing Handlebars or excluding nashorn if it is not used at run time; fix the because() text.", "q": "Does the native image really ship nashorn-core, and who owns the legal decision before a first release?"}, {"id": "strict100", "t": "Per-class 100% line and branch rule is very strict", "a": "Evolvability", "i": 3, "e": 3, "c": ["coverage"], "why": "In our view, requiring every class to be fully covered pushes teams toward tests that only execute code to hit a branch, and makes each defensive branch cost a test. Only one exception exists today, so the rule seems livable, but generated code, reactive lambdas and rarely taken error paths are common sources of friction. Git history shows the default was lowered to 90/85 on 2026-10-10 (to stop exception sprawl) and raised back to 100/100 on 2026-10-11 in the 'full coverage' commit, which also deleted the exceptions; the docs were not updated.", "o": "Keep 100% with the exception mechanism; or set 95% per class for lines and require 100% only for new code; add mutation testing to check test quality.", "q": "What is the policy's real purpose: preventing untested code, or preventing slippage, and is 100% per class the cheapest way to get that?"}, {"id": "docDrift", "t": "Docs say coverage is 90/85 and list exceptions that no longer exist", "a": "Operability", "i": 2, "e": 1, "c": ["plugins", "coverage"], "why": "build-logic/CLAUDE.md, the improvements note (L3) and the old guide say LINE 90% / BRANCH 85%; the code enforces 100/100. The old guide's exception table lists eight modules; only an empty block and one web exception exist. The root CLAUDE.md names Gradle 9.0 while the wrapper is 9.8.0. Wrong docs lead developers to expect exceptions they will not get.", "o": "Correct the docs from the code now; add a test or script that reads the default from jacoco-conventions and prints it for docs.", "q": "Should rule values be documented once in code comments only, and linked from the docs?"}, {"id": "selfUnchecked", "t": "build-logic and the root build scripts are not formatted or linted", "a": "Governance", "i": 2, "e": 2, "c": ["format"], "why": "Spotless is applied per module through quality-conventions. Its Kotlin target <code>build-logic/**/*.gradle.kts<\/code> is relative to each module folder, so it never matches the included build; the root project applies Spotless with apply false. The convention scripts and root build scripts therefore get no header or format check (by reading the configuration; not run). The one place that decides every rule has the least checking.", "o": "Apply Spotless in the root project for build-logic and root scripts; add a kotlinGradle target with an absolute path; or add ktlint.", "q": "Do we want the rule files treated like product code, with review and formatting checks?"}, {"id": "advisoryTools", "t": "Error Prone and SpotBugs run at default strength", "a": "Correctness", "i": 2, "e": 2, "c": ["format"], "why": "Error Prone has no -Werror or severity overrides, so its warnings print but pass. SpotBugs has no effort or report-level setting; only a small exclude file exists for reviewed false positives. Real findings can scroll by in the log. In our view this is a calibration gap, not a bug: the tools run, but their strictest useful settings have not been chosen.", "o": "Choose a list of Error Prone checks to promote to error; set SpotBugs effort and threshold; keep exclusions in exclude.xml with a reason each.", "q": "Which three Error Prone or SpotBugs findings have caused real incidents or review comments here, and should those fail the build?"}, {"id": "noToolchainResolver", "t": "JDK 25 is required but not provisioned", "a": "Operability", "i": 2, "e": 1, "c": ["javaconv"], "why": "The toolchain requests Java 25 and neither settings file configures a toolchain resolver (such as foojay), so a machine without JDK 25 cannot build and the error is Gradle's generic one. CI installs Temurin 25 itself. New contributors hit this first.", "o": "Add the foojay toolchain resolver plugin to settings; or document the JDK in the README and add a friendlier check.", "q": "Is a download convenience worth a new plugin in the trusted build path?"}, {"id": "nodeDrift", "t": "Node and pnpm versions differ between local and CI", "a": "Operability", "i": 2, "e": 1, "c": ["node", "ci"], "why": "Locally the UI uses Node 24.13.1 and pnpm 10.30.1. CI sets CI so the system Node is used: the build job asks for Node 24 (any minor) and pnpm 10.30.1, while the E2E job asks for pnpm 10. A UI build can behave differently in CI than on a laptop. Update (2026-10-15): the build job and the shard jobs pin pnpm 10.30.1 and ask for Node 24 (any minor); the local pin is Node 24.13.1. The E2E job was not re-checked.", "o": "Read the versions from the catalog in CI (node-version-file or a step that prints them); or pin the exact minor in the workflows and add a check that they match.", "q": "How often does a Node minor change affect the UI build, and is exact pinning worth the churn?"}, {"id": "ciManualMap", "t": "Adding a module needs three manual edits, with partial safety nets", "a": "Evolvability", "i": 2, "e": 3, "c": ["ci"], "why": "A module is listed in settings.gradle.kts, in the paths-filter list of ci.yml, and in the path map and the group_of function of .github/scripts/ci-tasks.sh (the shard planner added in PR #391). The lint job and the planner's 'unrecognized module' error catch omissions, but only when a pull request touches that module or the lint runs. Four places invite mismatches such as a wrong Gradle path or a module in the wrong shard.", "o": "Generate the filter, the path map and the shard assignment from settings.gradle.kts in one script; or use one dynamic job that asks Gradle which projects changed.", "q": "Is it acceptable that a mapping error is only caught on a PR for that module?"}, {"id": "trivyPrGate", "t": "Vulnerability scan does not block pull requests", "a": "Security", "i": 3, "e": 2, "c": ["ci"], "why": "security.yml runs Trivy vulnerabilities with exit code 0 on pull requests and enforces HIGH/CRITICAL only on main, schedule and manual runs. A PR that adds a vulnerable dependency can merge, with the dependency-review job (high severity) as the only other guard. The root trivy task is on demand; the '-x trivy' leftover in ci.yml is gone.", "o": "Enforce on PRs when the vulnerability database is reliable; or gate on new findings only; remove the unused -x trivy.", "q": "Which is worse for us: a blocked PR on an old unrelated CVE, or a vulnerable dependency reaching main?"}, {"id": "fullBuildOnRoot", "t": "Any change to config, gradle or build-logic rebuilds every module in CI", "a": "Performance", "i": 2, "e": 3, "c": ["ci", "catalog"], "why": "The root path filter includes build-logic/**, config/**, gradle/**, gradlew and settings. This is correct, since those files can change any module's result, so every Dependabot catalog bump still runs every module. Done (PR #391): the build is split into four parallel shards (platform, infra, plugins, frontend) with shared caches and a fast lint job, so the wall-clock time and the single 30-minute runner limit no longer apply to the whole repository. Still open: the total compute for a catalog bump is the full 27 modules.", "o": "Split the catalog so bumps for a test library trigger a smaller set; rely on the remote cache.", "q": "How close is a full build to the 30-minute timeout today, and what happens at 40 modules?"}, {"id": "cvePins", "t": "CVE pins are hand-written in build-logic and expire silently", "a": "Governance", "i": 2, "e": 2, "c": ["boms", "plugins"], "why": "PR #373 added patch pins as constraints in <code>build-logic/build.gradle.kts<\/code> (jackson-core and jackson-databind 2.21.7 and 3.1.7, plexus-utils 3.6.1) and as properties in <code>spring-conventions<\/code> (<code>jackson-2-bom.version<\/code> 2.21.7, <code>jackson-bom.version<\/code> 3.1.7). The comments say to drop each one once Spring Boot ships the fix, but nothing reminds anyone. A pin that is lower than what a later Spring Boot brings would silently hold the library back, and a CVE that is fixed in a newer minor stays hidden by the pin.", "o": "Put the pinned versions in the catalog with a comment and a date; add a check that fails when Boot's own managed version is newer than a pin.", "q": "Who removes a pin when the upstream fix lands, and how do they find out?"}], "riskNote": "IDs such as L5 refer to the earlier build-logic review (build-logic/docs/build-logic-improvements.md). Its other findings, L1 to L14 except L5, are fixed in code and are not repeated here. Review of 2026-10-15 against main (after PRs #373, #374 and #391): 0 risks closed, 3 partly closed (nettyTwoSources, opengrepEveryModule, fullBuildOnRoot), 4 updated (disabledTasks, ciManualMap, nodeDrift, trivyPrGate), 1 added (cvePins); the other 9 are unchanged because their files are unchanged.", "adrs": [{"t": "Precompiled convention plugins in an included build", "ctx": "27 modules must share the same toolchain and gates. Copying build code would drift, and rules that sit in a root script cannot be versioned or tested as a unit.", "dec": "Put the rules in build-logic, an included build that compiles six precompiled Kotlin-DSL plugins. Modules apply them by id.", "con": "One change updates every module. A mistake breaks every module at once, and the build-logic compile happens before everything else.", "alt": "buildSrc: simpler, but any change invalidates caches for the whole build. allprojects/subprojects blocks in the root script: easy, but modules cannot opt out cleanly and the logic is hard to organise. Copy-paste: no coupling, but guaranteed drift.", "rev": "build-logic changes dominate CI time, or modules need real variants that the layered plugins cannot express."}, {"t": "One version catalog shared by modules and build-logic", "ctx": "Plugin versions and library versions were declared in several places before; Dependabot needs a single file to update.", "dec": "build-logic/settings.gradle.kts loads ../gradle/libs.versions.toml; modules use the same file.", "con": "One bump updates both. Anything outside the catalog breaks the single-source promise; the Netty line left in gradle.properties is such a leftover.", "alt": "Versions inline in plugin and module files: scattered. A separate catalog for build-logic: two files to keep in step.", "rev": "The catalog grows too large to review, or build-logic needs versions that must differ from the modules'."}, {"t": "Per-class 100% line and branch coverage, with reasoned exceptions", "ctx": "Coverage thresholds that are lowered quietly turn into exception sprawl; a build-wide average hides one untested class behind many tested ones.", "dec": "Apply LINE 1.00 and BRANCH 1.00 to each class. Allow narrow exceptions with a reason (required below 0.80), reject stale patterns and refuse to let verification be disabled.", "con": "Strong pressure to test everything and a visible list of what is not. Friction for generated code and reactive error paths. History: 100% was introduced in March 2026, lowered to 90/85 on 2026-10-10, and restored to 100% on 2026-10-11 together with the removal of most exceptions.", "alt": "Module-wide percentage: easier, but allows an untested class. 90/85 per class: fewer exceptions, weaker floor. Mutation testing: better test quality signal, much slower.", "rev": "Exceptions grow beyond a handful, tests become coverage-driven rather than behaviour-driven, or the team on bump re-opens it. Needs legal review, still pending for nashorn-core.", "alt": "A broad allow-list: fewer failures, hidden risk. A deny-list: new licences pass unnoticed. Trivy licence scanning only: report-level, not a gate (it also runs in CI).", "rev": "Legal sign-off changes, the native image stops shipping the artifact, or the number of exceptions makes the list unmanageable."}, {"t": "A Java-focused quality toolchain; other languages own their pipelines", "ctx": "The repository contains Java (Gradle), Go (cli) and TypeScript (ui). Each ecosystem has its own best tools.", "dec": "The conventions cover Java only. cli delegates to Makefile targets that pin gofmt, golangci-lint, gosec and govulncheck; ui runs pnpm scripts for header checks and build.", "con": "Best tool per language, but no single quality bar, no shared coverage view and different failure styles. UI unit tests are not yet wired into check.", "alt": "One cross-language scanner for everything (shallower per language). A separate repository per language (loses the single check).", "rev": "The UI or CLI grows to the point where its checks need the same gates, or a cross-language policy such as licence rules for npm and Go dependencies is required."}, {"t": "Download Node locally, use system Node in CI", "ctx": "The UI needs Node and pnpm. Developers should not need a particular install; CI runners already provide tools through setup steps.", "dec": "node-conventions pins versions in the catalog and sets download = (CI is not set). npm and yarn tasks are disabled.", "con": "Local builds are reproducible. CI builds use whichever Node 24 minor the setup action provides.", "alt": "Always download: same everywhere, slower CI. Always use system tools: simplest, but local drift. A container build: closest to production, heavier.", "rev": "A CI-only UI failure traces to a Node minor, or the UI build moves to a separate pipeline."}], "evo": [{"id": "now", "n": "Today", "d": "Six plugins, one catalog, 27 mod lass."], ["Kotlin DSL", "Gradle build files written in Kotlin (.kts).", "Gives autocompletion and type checks in the build scripts."], ["Version catalog", "A single file (libs.versions.toml) naming versions and libraries.", "Modules write libs.reactor.core and get the same version everywhere."], ["BOM (bill of materials)", "A published list of library versions that are known to work together.", "Spring Boot, Spring AI and Netty each publish one."], ["Toolchain", "The JDK version Gradle uses to compile and test, chosen by the build rather than by what is installed.", "Java 25 is required; no auto-download is configured."], ["Lombok", "A compile-time tool that generates getters, constructors and builders from annotations.", "Cuts boilerplate; its output is tagged so coverage ignores it."], ["Spotless", "A formatter plugin that checks or fixes code style and file headers.", "./gradlew spotlessApply fixes files before a commit."], ["google-java-format", "A strict automatic Java formatter with no style choices.", "Ends style arguments; 2-space indent, 100-character lines."], ["Checkstyle", "A tool that checks Java style rules such as naming, imports and line length.", "maxWarnings = 0 makes every warning fail."], ["PMD", "A source-code analyser that finds poor practice and likely bugs.", "Runs eight rule categories from config/pmd/ruleset.xml."], ["SpotBugs", "A tool that finds bug patterns by reading compiled bytecode.", "Catches null dereferences and exposed mutable state."], ["Error Prone", "A Google compiler plugin that reports known bug patterns while compiling.", "Runs at default strength here; warnings do not fail the build."], ["OpenGrep", "An open-source code scanner that matches patterns written as rules (a fork of Semgrep).", "Used to ban four dangerous code patterns."], ["SARIF", "A standard JSON format for static-analysis results.", "OpenGrep writes its report in it for tools to read."], ["nosem", "A comment that tells OpenGrep to ignore one flagged line.", function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
</script>
