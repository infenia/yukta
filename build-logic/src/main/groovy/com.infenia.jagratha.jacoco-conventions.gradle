plugins {
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.12"
}

/*
 * Configure test tasks
 */
tasks.withType(Test).configureEach {
    finalizedBy(tasks.withType(JacocoReport))

    jacoco {
        excludes = [
                'java.*',
                'javax.*',
                'sun.*',
                'jdk.*',
                'com.sun.*',
                'org.w3c.*',
                'org.xml.*'
        ]
    }
}

/*
 * Safe JaCoCo report configuration
 */
tasks.withType(JacocoReport).configureEach {

    dependsOn(tasks.withType(Test))

    // Proper provider-based filtering (NO doFirst, NO afterEvaluate)
    classDirectories.setFrom(
            classDirectories.files.collect { dir ->
                fileTree(dir: dir, exclude: ['gg/jte/generated/**'])
            }
    )

    onlyIf {
        executionData.files.any { it.exists() }
    }

    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

/*
 * Coverage verification
 */
tasks.withType(JacocoCoverageVerification).configureEach {

    dependsOn(tasks.withType(JacocoReport))

    classDirectories.setFrom(
            classDirectories.files.collect { dir ->
                fileTree(dir: dir, exclude: ['gg/jte/generated/**'])
            }
    )

    onlyIf {
        executionData.files.any { it.exists() }
    }

    violationRules {
        rule {
            limit {
                minimum = project.hasProperty('jacocoMinimumCoverage')
                        ? project.property('jacocoMinimumCoverage').toString().toBigDecimal()
                        : 0.80
            }
        }
    }
}

check.dependsOn(tasks.withType(JacocoCoverageVerification))
