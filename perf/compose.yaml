# Yukta with fixed resources, for repeatable benchmarks. Use perf/run.sh; knobs are env vars.
services:
  yukta:
    image: ${IMAGE:-eclipse-temurin:25-jre}
    command: ${RUN_CMD:-java -jar /app/yukta.jar}
    cpus: ${CPUS:-2}
    cpuset: ${CPUSET:-0,1}
    mem_limit: ${MEMORY:-8g}
    memswap_limit: ${MEMORY:-8g}   # no swap: results must not depend on it
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Dyukta.rate-limit-per-minute=0}
      SPRING_PROFILES_ACTIVE: ${PROFILES:-prod}   # prod,postgres with PERSISTENCE=postgres (run.sh)
      YUKTA_SERVER_ADDRESS: 0.0.0.0
      YUKTA_API_KEYS_0_NAME: admin
      YUKTA_API_KEYS_0_KEY: ${API_KEY:?set by run.sh}
      YUKTA_API_KEYS_0_ROLE: ADMIN
    env_file:
      - ${KEYS_ENV:-/dev/null}   # more keys for the notifications test, store and worker settings (run.sh writes it)
    volumes:
      - ${JAR:?set by run.sh}:/app/yukta.jar:ro   # the jar, or the native binary (BINARY=)
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # only with PERSISTENCE=postgres
    ports:
      - "127.0.0.1:${PORT:-9858}:9858"   # loopback only, so k6 may send the key over http
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9858"]
      interval: 2s
      retries: 60

  # PERSISTENCE=postgres only (run.sh sets COMPOSE_PROFILES=postgres): the database of the Plus flavour.
  # Pinned like the server, and with no swap, so the numbers do not depend on the host.
  postgres:
    profiles: ["postgres"]
    image: postgres:18-alpine
    cpus: ${PG_CPUS:-2}
    cpuset: ${PG_CPUSET:-}
    mem_limit: ${PG_MEMORY:-2g}
    memswap_limit: ${PG_MEMORY:-2g}
    environment:
      POSTGRES_DB: yukta
      POSTGRES_USER: yukta
      POSTGRES_PASSWORD: perf-only
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yukta", "-d", "yukta"]
      interval: 2s
      retries: 30

  # WORKERS=n only (run.sh sets COMPOSE_PROFILES=workers): n remote workers of the pool "default" that run the
  # placed nodes of the placed* workflows. WORKER_BINARY is a native image built for the worker role.
  worker:
    profiles: ["workers"]
    image: ${IMAGE:-eclipse-temurin:25-jre}
    # each replica is its own worker: its container's host name is its id
    command: ["sh", "-c", "YUKTA_WORKERS_ID=$$HOSTNAME exec ${WORKER_CMD:-/app/yukta.jar}"]
    deploy:
      replicas: ${WORKERS:-0}
    cpus: ${WORKER_CPUS:-1}
    mem_limit: ${WORKER_MEMORY:-1g}
    memswap_limit: ${WORKER_MEMORY:-1g}
    environment:
      YUKTA_WORKERS_CONTROL_PLANE: yukta:7000
      YUKTA_WORKERS_TOKEN: ${API_KEY:?set by run.sh}
      YUKTA_WORKERS_ALLOW_INSECURE: "true"   # the compose network, not a real one
      YUKTA_WORKERS_POOLS: default
      YUKTA_WORKERS_PLUGIN_TYPES: FILTER,MAPPER
      YUKTA_WORKERS_CAPACITY: ${WORKER_CAPACITY:-8}
    volumes:
      - ${WORKER_JAR:-/dev/null}:/app/yukta.jar:ro
    depends_on:
      yukta:
        condition: service_healthy
