plugins {
    id 'com.infenia.jagratha.java-conventions'
    id 'com.infenia.jagratha.quality-conventions'
    id 'com.infenia.jagratha.jacoco-conventions'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.jte)
}

ext {
    jacocoMinimumCoverage = 0.05
}

dependencies {
    implementation project(':jagratha-core')
    implementation libs.jte.starter
    implementation libs.jte.core
    implementation libs.spring.boot.starter.webflux

    testImplementation libs.spring.boot.starter.webflux.test
    testImplementation libs.reactor.test
}

jte {
    sourceDirectory = file("src/main/jte").toPath()
    targetDirectory = file("build/jte-classes").toPath()
    compilePath = sourceSets.main.compileClasspath
    generate()
    precompile()
    binaryStaticContent = true
}

bootJar {
    enabled = false
}

sourceSets.main.output.dir(file("build/jte-classes"), builtBy: 'precompileJte')

jar {
    enabled = true
}

task pnpmInstall(type: Exec) {
    workingDir projectDir
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'pnpm', 'install'
    } else {
        commandLine 'pnpm', 'install'
    }
}

// Tailwind CSS task
task tailwind(type: Exec) {
    dependsOn pnpmInstall
    workingDir projectDir
    inputs.file("./src/main/resources/static/css/input.css")
    outputs.file("$buildDir/tailwind/style.css")
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'pnpm', 'exec', 'tailwindcss', '-i', './src/main/resources/static/css/input.css', '-o', "$buildDir/tailwind/style.css", '--minify'
    } else {
        commandLine 'pnpm', 'exec', 'tailwindcss', '-i', './src/main/resources/static/css/input.css', '-o', "$buildDir/tailwind/style.css", '--minify'
    }
}

processResources {
    dependsOn tailwind
    from("$buildDir/tailwind") {
        into "static/css"
    }
}
