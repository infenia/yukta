<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta plugins Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;--mem:#b54708;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;--mem:#ffb35c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:60px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lede{color:var(--muted);max-width:780px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--p2-soft);color:var(--p2);text-decoration:none;cursor:pointer;margin:2px 3px 2px 0}
.chip.comp{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] button.sel{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) button.sel{color:#111}}
button:disabled{opacity:.45;cursor:default}
input[type=search],select,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.refs{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14px}
.callout.warn{border-color:var(--p1);background:var(--p1-soft)}
.callout.q{border-color:var(--p2);background:var(--p2-soft)}
.start a{display:block;text-decoration:none;color:var(--text);cursor:pointer}
.start a:hover{border-color:var(--accent)}
.start b{display:block;color:var(--accent)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.panel .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:860px){.panel .cols{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block}
.map .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}
.map .box text.n{fill:var(--text);font:600 14px var(--sans)}
.map .box text.s{fill:var(--muted);font:11.5px var(--sans)}
.map .box{cursor:pointer}
.map .box.act rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.map .box.on rect{stroke:var(--accent);stroke-width:3}
.map .box .ram{display:none;fill:var(--mem);font:700 10px var(--mono)}
.map.showmem .box.mem rect{stroke:var(--mem);stroke-dasharray:6 4;stroke-width:2.2}
.map.showmem .box.mem .ram{display:block}
.map .edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.7}
.map .edge.ctrl{stroke-dasharray:5 4}
.map .edge.act{stroke:var(--accent);stroke-width:2.6;opacity:1}
.map .el{fill:var(--muted);font:11px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .leg{fill:var(--muted);font:12px var(--sans)}
.panel h3{margin-top:0}
.panel dl{margin:8px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px}
.panel dt{color:var(--muted);font-size:13px}
.panel dd{margin:0;overflow-wrap:anywhere}
.stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:3px}
.dots i.d{background:var(--accent)}
/* cards */
.cap h3{font-size:15px;margin:0 0 4px}
.cap .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.cap p{margin:4px 0;font-size:14px}
.cap .g{color:var(--ok)}.cap .l{color:var(--p1)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.fold>.in{padding:0 16px 16px}
/* durability */
.cell{display:flex;gap:8px;align-items:flex-start}
.cell .pill{flex:none;margin-top:1px}
.clock{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;font-size:13px}
.clock .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.clock .track i{position:absolute;top:0;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.clock .track i.b{background:var(--p1)}
.clock .track i.c{background:var(--ok)}
.clock .note{grid-column:2;color:var(--muted);font-size:12px;margin-bottom:6px}
/* quality */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rng{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rng input{width:100%}
/* board */
.item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.item summary::-webkit-details-marker{display:none}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.item .body dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.item .body dt{color:var(--muted);font-size:13px}.item .body dd{margin:0;overflow-wrap:anywhere}
.item.hl{outline:2px solid var(--accent)}
.matrix{width:100%;height:auto;display:block;max-width:640px}
.matrix .q{fill:var(--surface-2);stroke:var(--line)}
.matrix .ql{fill:var(--muted);font:600 12px var(--sans)}
.matrix .dot{cursor:pointer}
.matrix .dot circle{stroke:var(--surface);stroke-width:2}
.matrix .dot text{fill:#fff;font:700 10px var(--mono);pointer-events:none}
/* adr / evolution / prompts */
.adr dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:8px 0 0}
.adr dt{color:var(--muted);font-size:13px}.adr dd{margin:0}
.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.evo .card{border-top:3px solid var(--accent)}
.evo .card.now{border-top-color:var(--ok)}
.deck .q{font-size:17px;line-height:1.45;margin:6px 0 10px}
/* primer */
.plain{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:14px}
.plain b{color:var(--ok)}
.layers{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.layers>div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.layers>div.me{border-color:var(--accent);background:var(--accent-soft)}
.layers b{display:block}
.ex{width:100%;height:auto;display:block}
.ex .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.ex .nd.t rect{stroke:var(--ok)}.ex .nd.p rect{stroke:var(--accent)}.ex .nd.e rect{stroke:var(--p3)}
.ex .nd.on rect{fill:var(--accent-soft);stroke-width:3}
.ex .nd{cursor:pointer}
.ex .nd text.n{fill:var(--text);font:600 13px var(--sans)}
.ex .nd text.s{fill:var(--muted);font:11px var(--mono)}
.ex .ed{fill:none;stroke:var(--muted);stroke-width:1.5}
.ex .ed.err{stroke:var(--p0);stroke-dasharray:5 4}
.ex .el{fill:var(--muted);font:11px var(--sans)}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrap span.s{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:13px}
.wrap span.a{color:var(--muted)}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0}
.gl .why{color:var(--muted);font-size:13px}
.paths a{text-decoration:none;color:var(--text);cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.mapwrap{grid-template-columns:1fr}
  .item summary{grid-template-columns:auto minmax(0,1fr)}
  .item .meta{grid-column:1/-1}
  .item .body dl,.panel dl,.adr dl{grid-template-columns:1fr}
  .rng{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}.clock .note{grid-column:1}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}

nav.side .others{margin-top:22px;font-size:13px}
nav.side .others h4{margin:0 0 4px}
nav.side .others a,nav.side .others span{display:block;padding:2px 10px;border-radius:6px}
nav.side .others span.cur{color:var(--text);font-weight:700}
.cell .pill{white-space:normal}
</style>
</head>

<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
  <div class="others" id="others"></div>
</nav>
<main id="main"></main>

<script>
var DATA = {"module": "plugins", "title": "How Yukta plugins work, and where they can break", "htmlTitle": "Yukta plugins Guide", "date": "2026-10-15", "glance": {"lede": "The plugins module is the toolbox of Yukta: 31 built-in node types (triggers that start a workflow, processors that route, transform, call outside systems or ask a model, and terminals that finish a branch) plus the supervisors and control planes that watch runs from outside. Each one is a small Spring bean that obeys a contract from plugin-api; the engine in core does the scheduling, retries and timeouts around it. This page is for thinking, not documenting: open a component, play a scenario, then challenge the weak spots, most of which are about what a workflow author is allowed to make a plugin do.", "props": [["One bean per type", "Every type id (for example HTTP_REQUEST) is one singleton bean found by name in a registry. Per-node settings arrive as a map on each call, so one instance serves every node of that type."], ["Same failure shape", "Plugins that touch the outside world share one pattern: a typed spec, a gateway that does the I/O, a failureMode (ERROR or CONTINUE), optional success/failure ports and a node timeout that is the plugin's own timeout plus a margin."], ["Config is power", "A workflow author's settings decide which program runs, which URL is called, which folder is read. The plugins are where that power is granted or limited, so most open risks here are security and resource limits."], ["Pick what ships", "The build includes nine optional plugins by default (-Pyukta.plugins=all). Choosing a shorter list removes them, and their dependencies, from the application."]], "start": [["primer", "Primer", "The problem, eight terms, and a chat-agent workflow clicked through node by node"], ["map", "System map", "Ten components: families of plugins, the shared contract, supervisors and the build"], ["map", "Replay a run", "Six scenarios: a tool-using chat turn, a failing call, a script, a loop, a rule pause, a model outage"], ["caps", "What the plugins can do", "Eighteen capabilities with their guarantees and limits"], ["reference", "Catalogue and variables", "Every type id with its settings and defaults, and the ${...} syntax"], ["quality", "Stress it", "Scalability, performance, availability and security lenses"], ["board", "Challenge it", "Open risks on an impact x effort grid, with questions for the architect"], ["adrs", "Decisions", "Eight design decisions, each with a 'revisit when' trigger"]]}, "primer": {"problem": "Yukta's engine knows how to run a graph of nodes, but it knows nothing about what a node does. Something has to actually fetch a web page, run a program, ask a language model, split a list into items, or post to a chat channel. Those somethings are plugins. The hard part is that they are driven by configuration written by whoever authors the workflow: that person names the URL, the command, the folder, the SQL, the model prompt. So a plugin must be flexible enough to be useful and careful enough that a configuration mistake (or a hostile configuration) does not take the server down.", "analogy": "Think of a workshop with a wall of power tools. The engine is the foreman: it decides when each tool is switched on, how long it may run and what happens if it jams. Each plugin is one tool. A tool has a standard plug (the contract), its own dial settings (the config), and a guard (the failure handling). Some tools are harmless (a stapler: FILTER). Some can take a finger off (a saw: PROCESS_EXECUTOR). The foreman does not know what the saw cuts, only that it must stop after the timeout.", "layersTitle": "Where plugins sit", "layers": [["Clients", "REST, web UI, MCP agents and the CLI submit workflow definitions and start runs", ""], ["core", "The engine. It validates graphs, wires nodes into streams, applies timeouts, retries and error ports, hosts supervisors, and keeps the plugin registry", ""], ["plugin-api", "The contract: three node interfaces (trigger, processor, terminal), the supervisor and control-plane interfaces, config field descriptions, failure helpers, a safe expression helper", ""], ["plugins", "The implementations. This page.", "me"], ["boot", "Chooses which optional plugin modules are compiled into the application", ""]], "layersNote": "In theory plugins depend only on plugin-api. In practice 11 of the 19 plugin modules also depend on core, to reuse the variable resolver and helpers (risk: coreLayering).", "conceptsTitle": "Eight terms to know first", "concepts": [["Plugin type", "A named kind of node, written as an upper-case id such as FILTER or LLM_CALL. A workflow node says which type it is and carries a config map.", "Node 'check-price' has type FILTER and config {condition: 'payload.price > 100'}."], ["Trigger, processor, terminal", "Three roles. A trigger has no input and creates the first messages. A processor takes messages in and sends messages out. A terminal only takes messages in and ends the branch.", "API_TRIGGER starts, MAPPER reshapes, NOTIFY_TERMINAL posts a webhook."], ["Message", "The unit that flows between nodes: a payload (the data), metadata (labels about the data), an id and the name of the output port it left on.", "A support ticket is a payload; the model's confidence is added to metadata."], ["Port", "A named exit of a node. Edges in the workflow can be wired to a specific port, so one node can send different messages to different next nodes.", "FILTER sends matching messages out of 'default' and rejects out of its discardPort; GATE uses 'pass' and 'reject'."], ["FailureMode and routeBy", "A setting on external-call plugins. ERROR fails the node when the call fails. CONTINUE turns the failure into a message with a status, and routeByStatus (or routeByExitCode) then sends it out of a 'success' or 'failure' port.", "HTTP_REQUEST with failureMode CONTINUE and routeByStatus true sends a 503 down the 'failure' edge to a fallback node."], ["Variable expression", "Text such as ${payload.user.id} inside a config value. The plugin replaces it with a real value when a message arrives. Not every plugin does this; the catalogue says which.", "url: 'https://api.example.com/cart/${payload.userId}'."], ["SpEL", "Spring Expression Language: a small expression syntax (payload.price > 100) used by FILTER, BRANCH, SPLITTER and others. In Yukta it runs in a restricted mode: it can read properties and call methods on data, but cannot name Java classes or create objects.", "BRANCH selector 'payload.type'."], ["Decision model", "A model asked a constrained question (pick a label, say yes or no, rate on a scale) instead of free chat. Two backends exist: System One, a local model on Ollama that returns calibrated probabilities, and any chat model, whose probability is its own guess.", "GATE asks 'Is this safe to send?' and routes on the probability of yes."]], "ex": {"title": "One example, end to end", "lede": "A chat agent that remembers the conversation, lets the model use a tool and posts the reply. Click a node to see what happens, why it is built that way, and what can go wrong.", "labels": ["What happens", "Why it is built this way", "Can go wrong"], "legend": "Green = trigger | Blue = processor | Grey = terminal | Arrows follow the message; two arrows into one node mean only one branch carries a message per turn", "start": "think", "nodes": [{"id": "chat", "n": "Chat message", "s": "API_TRIGGER", "k": "t", "x": 10, "y": 40, "does": "The REST or MCP start call carries a payload such as {sessionId: 's1', message: 'What is the weather in Pune?'}. The trigger emits it as one message.", "adds": "Core hands the start payload to the trigger through the Reactor context (the per-run bag of values that follows the stream). The trigger needs no settings of its own.", "wrong": "If the caller sends no payload, the trigger emits an empty message, and later nodes that expect sessionId fail on their own checks."}, {"id": "load", "n": "Load history", "s": "SESSION_MEMORY", "k": "p", "x": 190, "y": 40, "does": "In mode 'load' it reads the last maxTurns (default 20) turns stored for the session id, attaches them to the payload as 'history', then records the user's new message as a turn. It also copies the session id into metadata for the later 'append' node.", "adds": "Resolves ${payload.sessionId} and ${payload.message} for each message, so one node serves many conversations. The store is a single bean shared by every workflow.", "wrong": "The in-memory cache has no eviction, so abandoned sessions stay until a restart; the history survives a restart only if a directory or PostgreSQL is configured. The user turn is stored before the model answers, so a failed model call leaves a question without an answer."}, {"id": "think", "n": "Ask the model", "s": "LLM_CALL", "k": "p", "x": 370, "y": 40, "does": "Sends the history plus the new message to the model (OpenAI-compatible, Anthropic or Ollama, through Spring AI). If the reply contains <agent_action> blocks, they are cut out and returned as a parsed 'actions' list next to the clean 'content' text.", "adds": "The node timeout is computed from the plugin's own timeout (default 120 s per attempt), the retries setting and the backoff, so the engine does not cut off a legitimate slow call. Each attempt runs on a thread meant for blocking work.", "wrong": "Spending is capped only if the node sets 'budget'; 'prices' alone only reports cost. A model that ignores the action format simply returns text, and the workflow takes the no-tool path."}, {"id": "route", "n": "Tool wanted?", "s": "BRANCH", "k": "p", "x": 550, "y": 40, "does": "Evaluates a condition on the reply: did the model ask for an action? If yes the message leaves on the port named 'tool', otherwise on 'default'.", "adds": "The condition is SpEL in restricted mode. With strictMode (default true) a message that matches no case and has no default port is an error rather than a silent drop.", "wrong": "A condition that throws on an unexpected payload shape fails the message. An errorPort can catch it instead."}, {"id": "tool", "n": "Call the tool", "s": "MCP_TOOL_CALL", "k": "p", "x": 730, "y": 40, "does": "Calls a named tool on a remote MCP server over streamable HTTP, with the arguments the model asked for, and emits {success, tool, text, content, structured, error}.", "adds": "Keeps one handshaken session per server and credentials, forwards the server's progress notifications to the engine as heartbeats so a slow tool is not timed out, and cancels the remote request if the node is cancelled.", "wrong": "The server URL and tool name come from config (and can contain variables), and nothing limits which hosts may be called (risk: ssrf)."}, {"id": "final", "n": "Answer with result", "s": "LLM_CALL", "k": "p", "x": 730, "y": 150, "does": "A second LLM_CALL node. Its prompt includes the tool result, and its reply is the final answer text.", "adds": "Nothing new: the same retry, timeout and failureMode behaviour. A graph is acyclic, so a 'loop' of model, tool, model is written as separate nodes, not as a cycle.", "wrong": "Only one round of tool use is possible this way. Needing three rounds means three more nodes, or a model that batches its actions."}, {"id": "remember", "n": "Save reply", "s": "SESSION_MEMORY", "k": "p", "x": 550, "y": 150, "does": "In mode 'append' it stores the assistant's reply (default ${payload.content}) under the session id that 'load' left in metadata.", "adds": "Trims the session to maxTurns so the stored history cannot grow past the limit per session.", "wrong": "If the run crashes before this node, the user turn is stored and the reply is not. The next turn then shows the model a question with no answer."}, {"id": "reply", "n": "Post reply", "s": "NOTIFY_TERMINAL", "k": "e", "x": 370, "y": 150, "does": "Posts the reply text as a JSON webhook ({text: ...}, Slack-compatible) and ends the branch.", "adds": "Refuses plain http except for localhost when the config is checked, applies a 10 s default timeout and, with failureMode ERROR, fails the node on any non-2xx answer including redirects.", "wrong": "Any https host is accepted. A webhook that is slow or down fails the node, and the user never sees the reply even though memory already holds it."}], "edges": [["chat", "load"], ["load", "think"], ["think", "route"], ["route", "tool", "", "tool"], ["tool", "final"], ["final", "remember"], ["route", "remember", "", "default"], ["remember", "reply"]]}, "story": {"title": "The module in plain words", "steps": [["Register", "at startup every plugin bean is collected into a registry by type id. A duplicate type id stops the server from starting."], ["Describe", "each plugin publishes a description, a list of config fields (shown as a form in the UI) and its output ports."], ["Validate", "before a run, the engine asks each plugin to check its node's config, so a missing url fails at submit time, not at message 1,000."], ["Run", "the engine calls the plugin once per node with a stream of messages and the config map; the plugin returns a stream of messages."], ["Resolve", "plugins that support it replace ${...} variables and decrypted: secrets in their config using each message."], ["Guard", "external-call plugins wrap the work in the failure pattern: ERROR throws, CONTINUE turns the failure into a routable message."], ["Watch", "separately, supervisors and control planes read the stream of run events and may pause or stop a run, or veto a command."]]}, "paths": [["New to the module", "Primer, then the System map and the 'Tool-using chat turn' scenario, then the catalogue.", "primer"], ["Reviewing for security", "Quality lenses (Security), then Risks filtered by Security, then the ADRs on config power and optional plugins.", "quality"], ["Writing a new plugin", "The 'Plugin contract' component, the catalogue's shared pattern, then the decisions about gateways and state.", "reference"]]}, "plain": {"trig": ["The starting guns. A trigger has no input: it fires on its own (a REST start, a fixed value, a clock) and sends out the first message.", "Every workflow needs something that begins it. Splitting 'what starts a run' into three small plugins keeps the engine free of any knowledge about web requests or clocks."], "route": ["The traffic controllers. They decide which messages continue, where they go, how many pieces they are cut into, and whether they are well formed.", "Most workflows are about sending the right data to the right place. These plugins implement the classic enterprise-integration patterns (filter, route, split, group) so no one writes them again."], "xform": ["The reshapers. They change what a message looks like: rename fields, fill a template, run a small script, or strip fields out.", "Systems rarely agree on shape. Without a reshaper every pair of nodes would need custom code between them."], "flow": ["The clock and the notebook. They slow messages down, repeat another plugin, and keep small facts between messages.", "A graph cannot contain a cycle, yet retries, polling and counters are needed. Loops and a key-value store give those without breaking that rule."], "extio": ["The hands that reach outside: run a program, call a web address, read or write a file, query a database, call a tool on another server.", "Real work happens outside Yukta. These plugins make every outside call fail in the same way (a status you can route on) and keep each one inside its own timeout."], "ai": ["The thinkers. One calls a language model, one remembers the chat, and six ask a model a narrow question (label this, pass or fail, how urgent) and route on the answer.", "Free chat text is hard to route on. Constrained questions with probabilities turn a model into something a graph can branch on."], "term": ["The ends of the line: write the payload to the log, or post it to a webhook.", "A branch has to end somewhere. Terminals give a run its visible result and let the engine know the branch is finished."], "contract": ["The shared plug socket. It is the set of rules every plugin follows: how it is named, described, configured, checked, timed and wired to ports, plus the ${...} variable language.", "Without one contract the engine, the UI form builder and the workflow validator would each need to know every plugin. With it, adding a plugin is adding a bean."], "super": ["The safety officers. They read the live stream of run events and can pause or stop a run, or refuse a command before it is carried out. Some follow written rules, some ask a model.", "People cannot watch every run. Rules catch the obvious ('three failures in a minute: pause'), a model catches the fuzzy, and veto rules protect against dangerous commands from anyone."], "build": ["The packing list. It decides which optional plugin modules go into the application and enforces code-quality checks on each.", "Every plugin adds code, dependencies and attack surface. Optional modules let a deployment ship only what it needs."]}, "comps": [{"id": "trig", "name": "Triggers", "tag": "API, constant, schedule", "c": 0, "r": 0, "resp": "Creates the first message of a run. Three types: API_TRIGGER, CONSTANT_SOURCE and SCHEDULE_TRIGGER.", "how": ["API_TRIGGER takes the payload that the REST or MCP start call carried and emits it as one message with a fresh id. If the start call had no payload, it emits an empty one. It has no settings.", "CONSTANT_SOURCE emits one message built from a 'variables' map (dots in a key make nested fields: 'user.name'). 'target' says whether the values go into the payload (default) or the metadata. The values may use ${env.X}, ${sys.p}, ${context.k} and decrypted:key, but ${payload...} is not replaced with data: a trigger has no incoming message to read from.", "SCHEDULE_TRIGGER emits {tick, firedAt} repeatedly. Set exactly one of intervalMs (fixed gap; the first message comes after one interval, not at once) or cron (a Spring 6-field expression: second, minute, hour, day, month, weekday). 'zone' sets the cron time zone (default is the server's), 'maxRuns' stops after that many messages. A cron with no future date, or both or neither of the two settings, is rejected when the config is checked.", "A scheduled workflow is one long run that stays open and keeps emitting. The schedule lives inside that run, not in a separate scheduler: nothing remembers it after a restart, so a restarted server does not fire missed ticks."], "guar": "Each start produces a message with a new random id. SCHEDULE_TRIGGER never runs both schedules at once and refuses invalid cron or non-positive intervals at validation time.", "state": "None of its own. A schedule's position is held by the running stream and is lost with the process.", "ceil": "A trigger is one stream per run. Many schedules mean many open runs, each holding a timer and its downstream streams.", "fail": "A bad config is rejected before the run starts. A tick that finds downstream busy is not queued by the trigger itself; how back-pressure is handled is the engine's job.", "set": ["API_TRIGGER: none", "CONSTANT_SOURCE: variables, target (PAYLOAD|METADATA)", "SCHEDULE_TRIGGER: intervalMs | cron, zone, maxRuns"], "risks": ["unboundedMaps", "scheduleLost"]}, {"id": "route", "name": "Routing & EIP", "tag": "filter, branch, split, group", "c": 1, "r": 0, "resp": "Decides which messages go where and in what shape: FILTER, BRANCH, RECIPIENT_LIST, SPLITTER, AGGREGATE and VALIDATE.", "how": ["FILTER keeps a message if a condition is true. The default engine is SpEL; engine 'SIMPLE' offers a tiny language with ==, exists and matches (a regular expression). 'REGO' is accepted by the form but rejected at validation as not implemented. Failing messages are dropped, unless discardPort names a second port, which turns the filter into a two-way router. strictMode (default true) turns an evaluation error into a node error; false drops the message quietly.", "BRANCH sends each message to a named port. Mode SELECT_KEY (default) evaluates 'selector' and looks the result up in 'cases' (value to port name). Mode EXPRESSION treats each case key as a yes/no condition. defaultPort catches the rest. allowMultipleMatches (default false) lets one message go down several ports. With strictMode on and no match and no default, the message is an error, so a typo in a case value cannot silently lose data. errorPort sends evaluation failures to a port with the failure details attached.", "RECIPIENT_LIST copies a message to several ports at once. Mode DYNAMIC (default) computes port names with an expression; STATIC uses a fixed 'recipients' list; EXTERNAL reads the list from a header or payload field. 'parallel' (default true) sends concurrently. Because the port names can be computed, the node can declare 'any port'.", "SPLITTER turns one message holding a list into many messages, one per item (itemsPath says where the list is; headerMapping can copy per-item values into metadata). 'parallel' defaults to true and 'concurrency' to 1024. AGGREGATE does the reverse: it batches 'size' messages into one message holding a list of their payloads and flushes a partial batch after 'timeoutMs' if set, or when the stream ends. Example: SPLITTER over 3 orders, a model call per order, then AGGREGATE size 3 to rebuild one list.", "VALIDATE checks that listed fields exist and are not null ('required') and have the right type ('types': string, number, boolean, object, array). Good messages leave on 'default', bad ones on 'invalid' with the reasons in failureReason, so bad input can be quarantined instead of crashing a later node."], "guar": "Routing is by port name: the engine only delivers a message on edges wired to the port it left on. With strictMode on, an unmatched or unevaluable message is an error, not a silent drop. AGGREGATE flushes what it holds when the stream completes.", "state": "AGGREGATE holds a partial batch in memory until it is full, times out or the stream ends. The others hold nothing between messages. Expressions are cached after the first parse.", "ceil": "SPLITTER with parallel true can have 1024 items in flight per node. AGGREGATE's buffer is bounded by 'size' but 'size' is whatever the author sets. Expressions are evaluated in restricted SpEL, which is fast but still runs author-supplied logic per message.", "fail": "An expression error is a node error (strictMode true), a dropped message (strictMode false) or an errorPort message. REGO fails validation. Loss of a partial AGGREGATE batch on a crash is possible.", "set": ["FILTER: condition, engine, strictMode, discardPort, allowAfterHeavy", "BRANCH: mode, selector, cases, defaultPort, allowMultipleMatches, strictMode, errorPort", "RECIPIENT_LIST: mode, recipients, expression, sourceField, parallel", "SPLITTER: itemsPath, headerMapping, parallel, concurrency", "AGGREGATE: size, timeoutMs", "VALIDATE: required, types"], "risks": ["unboundedMaps", "typeIds"]}, {"id": "xform", "name": "Transform & script", "tag": "MAPPER, CONTENT-FILTER", "c": 1, "r": 1, "flag": true, "resp": "Reshapes the payload: MAPPER (projection, template or script) and CONTENT-FILTER (keep or remove fields).", "how": ["MAPPER has three modes. PROJECTION maps target field names (dots nest) to SpEL expressions: {'total': 'payload.price * payload.qty'}. TEMPLATE fills Handlebars templates (a Mustache-like text language): one template string, or a map of field to template. SCRIPT runs JavaScript that returns the new payload.", "dropOriginal (default true) throws the old payload away and keeps only what the mapping builds; false merges the result over the original. strictMode (default true) fails the message on any evaluation error; false logs it and carries on (a failing script then gives an empty payload).", "SCRIPT mode needs the optional script-js module, which implements a small interface (ScriptEngine) using GraalJS. If it is not in the build, SCRIPT configs are rejected with a message saying to add it to yukta.plugins. The script sees 'message', 'payload' and 'metadata', and its result is converted back into plain maps, lists and scalars.", "The GraalJS context still has host access to the objects it is given, but Class objects are denied, Java.type may load only 12 value classes and java.time.*, and a script is stopped after 50 million statements or 10 s (yukta.script.max-statements, yukta.script.timeout-ms). It has no memory limit (risk: scriptHostAccess). The engine marks SCRIPT nodes 'computationally heavy' and logs a hint if a script is simple enough to be a projection.", "CONTENT-FILTER keeps (INCLUDE, paths are SpEL) or removes (EXCLUDE, paths are dot notation) parts of the payload, with optional 'flatten' to turn nested maps into flat ones. It is meant for stripping sensitive or unimportant data before logging or sending on. Its type id is the only kebab-case one (typeIds)."], "guar": "PROJECTION and TEMPLATE cannot touch Java classes (restricted SpEL; Handlebars has no code access). With strictMode true an evaluation error fails the message instead of passing through a half-mapped payload.", "state": "Compiled templates, parsed expressions and parsed scripts are cached in plain maps keyed by their text, for the life of the process. Nothing is persisted.", "ceil": "Those caches have no size limit: every distinct script or template ever submitted stays (risk: unboundedMaps). Script work runs on the engine's threads with no time limit.", "fail": "A bad mapping fails at config check (missing mode or mapping, SCRIPT without the module). At run time an error follows strictMode.", "set": ["MAPPER: mode, mapping, dropOriginal, strictMode", "CONTENT-FILTER: mode, paths, flatten, strictMode, errorPort", "script-js is selected with -Pyukta.plugins"], "risks": ["scriptHostAccess", "unboundedMaps", "typeIds"]}, {"id": "flow", "name": "Flow & state", "tag": "DELAY, loops, KV_STORE", "c": 2, "r": 0, "flag": true, "resp": "Pace messages, repeat another plugin, and keep small facts: DELAY, LOOP_STREAM, LOOP_PREDICATE and KV_STORE.", "how": ["DELAY holds each message for delayMs and releases them one at a time, in order. Ten messages with delayMs 100 take about a second, which is a simple way to stay under a rate limit.", "LOOP_STREAM and LOOP_PREDICATE run another processor again and again on the same message. You name it with targetPluginId and give it targetConfig. After each run an exitCondition (SpEL; it can use #iterationCount and #elapsedTimeMs) decides whether to stop. With no exitCondition the loop stops after the first iteration. Safety limits: maxIterations (default 10), maxDuration (ISO-8601 duration, default PT1M) and delayInterval between rounds (default PT0S). LOOP_STREAM emits every message every iteration produced; LOOP_PREDICATE emits only the last one.", "failureStrategy (default ABORT) says what a failing iteration does: ABORT fails the node, RETRY and SKIP both move on to the next iteration with the same last message (today they behave identically), ESCALATE throws an error whose text starts with 'WorkflowExecutionException:' but whose Java type is a plain RuntimeException (risk: loopEscalate).", "A loop finds its target through the plugin registry and calls it directly, so the target's own config check is not run on targetConfig (risk: loopSkipsValidation). This is how Yukta gets polling and retry-until without breaking the 'no cycles' rule of a graph.", "KV_STORE is a shared map (in memory, or the kv_entry table with yukta.kv.store-type=postgres) with operations get, put, incr and delete. The key comes from config or the payload's 'key' field, 'namespace' prefixes keys to keep users apart, and the output is {key, value}. 'put' stores payload.value, 'incr' adds payload.value (default 1) to a whole number. maxEntries (default 10000) refuses new keys beyond the cap, but in the in-memory store the size check and the insert are not one atomic step, so the cap can be slightly overshot under heavy concurrency. In PostgreSQL incr is one statement."], "guar": "Loops always end: by exit condition, maxIterations or maxDuration. KV_STORE operations on one key are atomic (incr uses an atomic merge), and a full store refuses new keys.", "state": "KV_STORE is one store for the whole server: shared by every workflow and run. By default it is in memory, lost on restart and not shared between servers; with yukta.kv.store-type=postgres it survives a restart and is shared. Loops keep their iteration state only for the duration of one message.", "ceil": "KV_STORE is capped at 10,000 keys by default, in one JVM. A loop's cost is iterations times the target's cost, and maxDuration is checked between iterations, not during one.", "fail": "A full KV store throws 'KV store is full'. A non-whole number in incr throws. A loop target that is missing or is not a processor fails the node with a message naming it.", "set": ["DELAY: delayMs", "LOOP_*: targetPluginId, targetConfig, exitCondition, maxIterations (10), maxDuration (PT1M), delayInterval (PT0S), failureStrategy (ABORT)", "KV_STORE: op, key, namespace, maxEntries (10000)"], "risks": ["loopEscalate", "loopSkipsValidation", "kvVolatile"]}, {"id": "extio", "name": "External I/O", "tag": "process, http, file, sql, mcp", "c": 2, "r": 1, "flag": true, "resp": "Calls the outside world: PROCESS_EXECUTOR, HTTP_REQUEST, FILE_READ, FILE_WRITE, SQL_QUERY and MCP_TOOL_CALL.", "how": ["They share one pattern. Config is turned into a typed spec; a gateway does the I/O; failureMode ERROR (default) fails the node on a failed call; CONTINUE emits a message describing the failure; routeByStatus (HTTP_REQUEST, MCP_TOOL_CALL) or routeByExitCode (PROCESS_EXECUTOR) then stamps the message with port 'success' or 'failure'. FILE_READ, FILE_WRITE and SQL_QUERY use CONTINUE to send failures to an 'error' port instead. A node timeout is derived from the plugin's own: HTTP and MCP add 5 s, PROCESS_EXECUTOR adds 10 % (at least 5 s). Without that margin the engine's idle timer (default 30 s) would kill a 120 s call after 30 s.", "PROCESS_EXECUTOR runs an operating-system command (a list: program then arguments, each of which may contain variables). inputMode NONE|ENV|STDIN passes the message in. timeout defaults to 300 s, output is capped at 10,000 lines and 10 MiB per stream, outputFormat STRUCTURED (default) gives {exitCode, success, timedOut, durationMillis, outputTruncated, stdout, stderr}. On timeout it destroys the process, then kills it after a grace period. useShell wraps the command in sh or cmd.exe but escapes every special character, so pipes and && never work.", "HTTP_REQUEST sends one request per message (url, method, headers, body, timeout default 30 s) and emits {status, success, headers, body}, with JSON bodies parsed. Non-2xx answers are data, not errors, until failureMode ERROR turns them into one. The URL may come from the message, and there is no host allow-list (risk: ssrf).", "FILE_READ and FILE_WRITE work only inside 'baseDir': the path is normalised, anything that escapes the folder or reaches out through a symbolic link is refused. Reads are capped (maxBytes, default 10 MiB) and must be UTF-8. But baseDir is itself workflow config, so the sandbox limits a path, not an author (risk: fileSandbox).", "SQL_QUERY runs one parameterised statement per message over JDBC: only '?' placeholders, filled from named payload fields in order, never by pasting text. It opens one connection per message, caps rows (maxRows 1000) and sets a statement timeout (30 s). The driver comes from the deployer. MCP_TOOL_CALL calls a tool on a remote MCP server, keeps a session per server and credentials, reports progress to the engine as heartbeats, and understands a 'reset' control signal that drops cached sessions."], "guar": "Every plugin here moves blocking work off the event threads, bounds its wait with a timeout and shows the outcome as data or a clear error. SQL values are always bound parameters. File paths cannot leave baseDir by '..' or by a link that already exists.", "state": "MCP_TOOL_CALL caches sessions in memory. Everything else is stateless between messages. Secrets used here (apiKey, authToken, SQL password) live in the node's config.", "ceil": "HTTP_REQUEST, MCP_TOOL_CALL and PROCESS_EXECUTOR process messages with a default concurrency of 256 per node, so a burst can start 256 processes or requests at once (risk: fanout256). SQL opens a connection per message, with no pool.", "fail": "ERROR fails the node and the engine's retry and onError policy applies. CONTINUE keeps the run alive. A timed-out process leaves children running (risk: orphans). A SQL node's engine timeout is the 30 s default whatever timeoutSeconds says (risk: sqlTimeout).", "set": ["PROCESS_EXECUTOR: command, inputMode, timeout 300, outputFormat, failureMode, routeByExitCode, maxOutputLines, maxOutputBytes", "HTTP_REQUEST: url, method, headers, body, timeout 30, failureMode, routeByStatus", "FILE_*: baseDir, path, maxBytes, contentField, append, failureMode", "SQL_QUERY: url, username, password, sql, params, maxRows 1000, timeoutSeconds 30", "MCP_TOOL_CALL: url, tool, arguments, authToken, timeout 60, resultKey"], "risks": ["ssrf", "shellModel", "orphans", "fanout256", "fileSandbox", "sqlTimeout", "plaintextSecrets", "agentGuardsOptIn"]}, {"id": "ai", "name": "AI processors", "tag": "LLM, memory, decisions", "c": 3, "r": 0, "flag": true, "resp": "Model-backed nodes: LLM_CALL, SESSION_MEMORY and the decision family CLASSIFY, GATE, SCORE, ASK, ANOMALY and DEDUPE.", "how": ["LLM_CALL calls a chat model through Spring AI for providers openai (and openai-compatible endpoints such as Groq or vLLM through baseUrl), anthropic and ollama. It takes messages (a list of {role, content} turns or a SpEL expression), an optional prompt appended as the last user turn, and a system prompt. It emits {success, content, actions, usage, latencyMs, model, cost?}. Spring AI's own retry is switched off so the plugin's retries (default 0, exponential backoff from 500 ms) are the only ones.", "Tool use is by text: the model is asked to put JSON inside <agent_action> tags, LLM_CALL cuts those out into the 'actions' list, and the graph decides what to do (BRANCH then MCP_TOOL_CALL). It does not use the providers' native tool-calling. 'prices' ({input, output} per million tokens) adds a cost figure, and a 'budget' ({maxTokens, maxCost, maxCalls, agent, hardStop}) stops further calls once a run has used it up (hardStop ends the whole run). With failureMode CONTINUE the original payload passes through with llmSuccess=false and llmError in metadata, so a second LLM_CALL with the same config can act as a fallback model.", "SESSION_MEMORY keeps chat history per session id. Mode 'load' (before the model) adds 'history' to the payload and records the user turn; mode 'append' (after) records the reply. maxTurns defaults to 20. One bean holds all sessions, keyed by id alone, cached in memory; the history is also kept in a file per session (yukta.session-memory.dir) or in PostgreSQL (yukta.session-memory.store-type=postgres).", "The decision family asks a model a constrained question about the message and writes the answer into metadata under 'into'. CLASSIFY picks one of two or more labels (routeByLabel gives one port per label, plus 'uncertain' below minProbability 0.6). GATE asks a yes/no question and routes to 'pass' or 'reject' (threshold 0.5). SCORE rates on 2 to 26 ordered levels and can route 'high' or 'low' by threshold. ASK asks up to 64 mixed questions in one call. ANOMALY and DEDUPE compare each message with the last window messages of the node's current run (ANOMALY window 20, minHistory 5, threshold 0.5; DEDUPE window 10, minProbability 0.6).", "Two backends: SYSTEMONE (default) calls Ollama's /v1/systemone endpoint (needs Ollama 0.35 or newer and a decision model) and returns calibrated probabilities; LLM goes through LLM_CALL's gateway and asks the model for JSON, where the probability is the model's own estimate. What the model sees is the 'state' expression (default the whole payload), cut to 15,000 characters. A model failure fails the message; use the engine's retry and onError for recovery."], "guar": "Decision nodes always produce a value in a known shape or an error: a label that is not one of the options, or a reply that is not JSON, is rejected. Probabilities are clamped to 0..1. History per session is trimmed to maxTurns.", "state": "Conversation history (SESSION_MEMORY), the ANOMALY and DEDUPE windows and LLM_CALL's cache of model clients are all in memory. Windows live only for one node in one run. Nothing survives a restart.", "ceil": "Each model call is a network call that can take seconds and cost money, at up to 256 concurrent calls per node. Session memory grows with the number of distinct session ids and is never evicted.", "fail": "Timeouts and provider errors fail the node (ERROR) or pass the original payload on (CONTINUE). A decision model that is down fails each message. The user turn in SESSION_MEMORY is stored before the model answers.", "set": ["LLM_CALL: provider, model, prompt, messages, system, baseUrl, apiKey, temperature, maxTokens, timeout 120, retries 0, prices, failureMode, routeByStatus", "SESSION_MEMORY: mode, sessionId, message, assistant, maxTurns 20", "Decision common: backend, provider, model, baseUrl, apiKey, timeout 30, state, into"], "risks": ["plaintextSecrets", "promptInjection", "sessionMemory", "windowsPerRun", "fanout256", "decisionUnbudgeted", "sessionStoreBlocks"]}, {"id": "term", "name": "Terminals", "tag": "console, webhook", "c": 3, "r": 1, "resp": "Ends a branch: CONSOLE_TERMINAL logs the payload, NOTIFY_TERMINAL posts it to a webhook.", "how": ["CONSOLE_TERMINAL writes 'Consuming message: <payload>' to the application log at INFO for every message. It takes no settings. It is the quickest way to see a result, and also writes every payload in full to the logs (risk: consoleLogs).", "NOTIFY_TERMINAL sends {text: ...} as a JSON POST (Slack-compatible). The text is the 'text' setting if set, else the payload's 'text' field, else the payload turned into a string. url must be https; plain http is allowed only for localhost, 127.x and [::1].", "It sends one message at a time, in order. timeoutMs defaults to 10,000. failureMode ERROR (default) fails the node on a non-2xx answer, and redirects count as failures; CONTINUE logs the failure and keeps sending later messages.", "NOTIFY_TERMINAL's url is fixed in config and is not run through the variable resolver, so a message cannot choose where it is sent. Any https host is still accepted, including internal ones."], "guar": "NOTIFY_TERMINAL never sends in clear text except to the local machine, never follows a redirect silently, and sends messages in order. A terminal only consumes: it has no output ports.", "state": "None.", "ceil": "One request in flight at a time per node, so a slow webhook paces the branch (back-pressure). CONSOLE_TERMINAL is bounded only by log volume.", "fail": "A failed webhook either fails the node or is logged and skipped. A failure sinks the branch's result, not the other branches.", "set": ["CONSOLE_TERMINAL: none", "NOTIFY_TERMINAL: url, text, timeoutMs 10000, failureMode"], "risks": ["consoleLogs", "ssrf"]}, {"id": "contract", "name": "Contract & variables", "tag": "plugin-api, registry, ${...}", "c": 0, "r": 1, "resp": "The rules every plugin follows and the shared helpers they use: type registration, description, config schema, validation, ports, timeouts, failure helper, secrets and the variable language.", "how": ["A plugin is a Spring bean implementing one of three interfaces (trigger, processor, terminal). The registry collects every plugin bean by getType(); a duplicate type id stops startup. Plugins are singletons: one instance serves every node of that type, with the node's config passed on each call.", "A plugin may describe itself (text and a UI card), list its config fields (name, type, required, default; this generates the form in the UI, and field names must equal the keys the plugin reads), declare its output ports (possibly depending on config) and validate its own config. Four hooks run in order: validateConfig at submit, initialize and prepare at compile, shutdown at the end.", "Variables (${...}) are NOT resolved by the engine. Each plugin that wants them calls core's resolver itself: HTTP_REQUEST, MCP_TOOL_CALL, LLM_CALL, SESSION_MEMORY, PROCESS_EXECUTOR, CONSTANT_SOURCE and the decision plugins (for model, baseUrl and apiKey). FILTER, BRANCH, SPLITTER and others use SpEL instead; FILE_*, SQL_QUERY, NOTIFY_TERMINAL and KV_STORE use their config literally. So SQL_QUERY's password 'decrypted:db' is NOT resolved, although the form text suggests it.", "decrypted:key asks a SecretProvider. The default one reads the environment variable YUKTA_SECRET_<KEY> (key upper-cased, other characters become underscores), so a workflow cannot read arbitrary environment variables through it. ${env.X} and ${sys.p} read only an allow-list: YUKTA_VAR_* variables, yukta.var.* properties, a short list of harmless ones and names listed in YUKTA_VARIABLES_ALLOWED; names that look like secrets stay blocked even if listed.", "The shared helpers: FailureMode and a guard that turns a failure into an 'error'-port message, a metrics counter hook, config validators (positive numbers, required strings) and SpelUtils, which runs SpEL in a restricted mode (read properties and call methods only; no types, constructors or bean references) with a 1,000-entry LRU cache."], "guar": "Restricted SpEL cannot reach Java classes. A plugin's declared ports are the only ones the engine will route on. Secrets read by decrypted: come only from YUKTA_SECRET_ variables with the default provider.", "state": "The registry is built once at startup. SpEL cache is in memory, bounded at 1,000.", "ceil": "One instance per type means plugin code must be thread-safe, and any in-memory state is shared by all nodes and runs of that type.", "fail": "Duplicate type ids and invalid config fail fast, at startup or submit. An unresolved variable path gives an empty value; a secret that is missing is an error; a blocked env name raises a SecurityException.", "set": ["yukta.plugins (build property, see Selection)", "YUKTA_SECRET_<KEY> environment variables for decrypted:key"], "risks": ["plaintextSecrets", "coreLayering"]}, {"id": "super", "name": "Supervisors & planes", "tag": "rules, model, rules-first", "c": 3, "r": 2, "flag": true, "resp": "Watches the run-event stream from outside the graph and can pause or stop runs or veto commands: RuleSupervisor, RuleControlPlane, ModelControlPlane and RulesFirstControlPlane.", "how": ["A supervisor reads events (node status changed, workflow status changed, log line, control outcome) and returns commands (pause or resume or stop a workflow or node). Core's host applies them with the supervisor as the named actor, rate-limited (default 20 per second) and with a dry-run switch. Separately a supervisor may review any command, human or automated, and refuse it.", "RuleSupervisor (id 'rules', on when yukta.supervisor.rules.file is set) reads a JSON file of rules. A reacting rule has 'when' (event, status, module, nodeId, workflowId, an 'if' SpEL condition, and optionally count within withinSeconds, default 60) and 'then' (command, mode, reason, immediate). Example: three FAILURE statuses from HTTP_REQUEST within 60 s on one run, then PauseWorkflow. A deny rule has 'command', optional 'if' and 'reason' and vetoes matching commands, for example StopWorkflow with mode KILL.", "Failure bias is deliberate. If a deny rule's condition cannot be evaluated, the command is denied (fail closed). If an event rule's condition cannot be evaluated, the rule simply does not fire. An unknown command name in a rule fails at load, not at run time.", "RuleControlPlane (yukta.control-plane.rules.file) is the same rules behind the control-plane contract: one decide(event) per event, with probability 1 and source RULE. ModelControlPlane (on when yukta.control-plane.model.name is set) asks a decision model a multiple-choice question about each event: 'instructions' is the question, options.<key> has a description and a command (NONE, PAUSE or STOP). By default it is asked about node and workflow status changes only, the defaults are continue=NONE and pause=PAUSE so it cannot stop anything unless configured, timeout is 2 s and min-probability 0.6.", "The model plane fails open: if the model is down, slow or unsure, the decision is 'no opinion' and the run continues. It does not review commands (everything is allowed). RulesFirstControlPlane (on when yukta.control-plane.rules-first.model.name is set) asks rules first and consults the model only when no rule fired; a rule error is treated as no rule; deny reviews always come from the rules."], "guar": "A deny rule cannot be bypassed by the model plane: reviews in the rules-first plane come from rules only. A broken deny condition blocks rather than allows. A rule file with an unknown field, a missing id, or a rule that is neither 'when/then' nor 'deny', fails at startup.", "state": "Rules are read once at startup and never reloaded. Count windows are kept per rule and run in memory and are never removed when a run ends. The model plane keeps no state.", "ceil": "ModelControlPlane makes one model call per matching event, serially (concatMap), so a busy server asks the model a lot and a slow model delays decisions without limit other than its 2 s timeout.", "fail": "Model errors or timeouts mean 'no opinion' (fail open). A rule that cannot parse stops startup. A reacting rule that names an unknown command fails at load.", "set": ["yukta.supervisor.rules.file", "yukta.control-plane.rules.file", "yukta.control-plane.model.name, .backend, .provider, .base-url, .api-key, .timeout (2s), .min-probability (0.6), .instructions, .options.<key>.description/.command, .events", "yukta.control-plane.rules-first.rules-file and .model.*", "(host, in core) yukta.supervisor.max-commands-per-second (20), yukta.supervisor.dry-run"], "risks": ["modelFailsOpen", "promptInjection", "unboundedMaps", "decisionUnbudgeted"]}, {"id": "build", "name": "Selection & gates", "tag": "-Pyukta.plugins, quality", "c": 1, "r": 2, "resp": "Decides which plugin modules are compiled in and holds each module to code-quality checks.", "how": ["Always included: internal-core (the 12 routing, transform and flow types), the three triggers, both terminals, the rule supervisor and the three control planes. Optional, nine modules: process-executor, http-request, file-io, sql-query, llm-call, session-memory, decision, mcp-tool-call and script-js.", "Selection is a build property: -Pyukta.plugins=all (default), none, or a comma-separated list such as http-request,llm-call. An unknown name fails the build with a list of valid names. Choosing fewer modules shrinks the application and, more importantly, removes whole capabilities (for example, no PROCESS_EXECUTOR means a workflow cannot run programs at all).", "The three control-plane modules are always compiled in, the model plane exposes the decision module, and the decision module depends on llm-call. So, reading the build files, CLASSIFY, GATE, SCORE, ASK, ANOMALY, DEDUPE and LLM_CALL are on the runtime classpath even with -Pyukta.plugins=none (not confirmed by running a build). Optional means optional to name, not necessarily absent (risk: optionalNotOptional).", "Each module is checked by the normal gates (formatting, Checkstyle, PMD, SpotBugs, coverage). internal-core and constant-source switch off PMD main and test, and internal-core also switches off Checkstyle on tests, with a note to re-enable. The riskiest code (the script mapper) therefore has the lightest checks.", "About 12,000 lines of main code across 19 modules. Leftover folders exist on disk with no source and no entry in settings.gradle.kts (triggers/auto-trigger, processors/scripting): they are not plugins."], "guar": "A build with a given list contains exactly those modules; an unknown name fails fast. Duplicate type ids across included modules stop startup.", "state": "Build-time only. A deployment cannot add or remove an optional plugin without rebuilding.", "ceil": "All-or-nothing per module: you cannot keep HTTP_REQUEST but forbid private addresses. Runtime allow-lists exist for commands (yukta.process.allowed-commands), MCP tools and LLM prompts, not for hosts.", "fail": "Unknown plugin names fail the Gradle configuration step. Disabled gates mean violations are not caught.", "set": ["-Pyukta.plugins=all|none|a,b,c (boot/build.gradle.kts)"], "risks": ["gatesOff", "coreLayering", "optionalNotOptional"]}], "edges": [["trig", "route", "data", "start message"], ["route", "xform", "data", "routed"], ["route", "flow", "data", "loops, delay"], ["xform", "extio", "data", "request body"], ["flow", "extio", "data", "target calls"], ["extio", "ai", "data", "results"], ["ai", "term", "data", "answers"], ["extio", "term", "data", "results"], ["contract", "trig", "ctrl", "config, ports"], ["contract", "extio", "ctrl", "FailureMode"], ["flow", "contract", "ctrl", "registry lookup"], ["super", "ai", "ctrl", "decision model"], ["build", "contract", "ctrl", "selects beans"], ["contract", "ai", "ctrl", "variables"]], "mapFlag": {"label": "Highlight in-memory state", "hint": "Dashed amber = state kept only in this process (caches, windows, stores)", "badge": "RAM"}, "scen": [{"id": "chat", "name": "Tool-using chat turn", "steps": [{"t": "A message arrives", "d": "A client starts the chat workflow with {sessionId: 's1', message: 'Weather in Pune?'}. API_TRIGGER emits it as one message, taking the payload from the run's Reactor context.", "c": ["trig"], "r": []}, {"t": "History is loaded", "d": "SESSION_MEMORY in 'load' mode resolves ${payload.sessionId} and ${payload.message}, attaches the last 20 turns as 'history', then stores the new user turn. The ordering matters: it reads before it writes, so the model does not see the question twice.", "c": ["ai", "contract"], "r": ["sessionMemory"]}, {"t": "The model answers", "d": "LLM_CALL sends history plus prompt to the configured provider. The reply says 'I need the weather tool' inside <agent_action> tags. The plugin lifts the JSON out into the 'actions' list and leaves clean text in 'content'. The node timeout was computed from the plugin's timeout and retries, so a slow model is not cut off at the engine's 30 s default.", "c": ["ai"], "r": ["promptInjection"]}, {"t": "BRANCH picks a path", "d": "A condition on the reply says an action was requested, so the message leaves on port 'tool'. A reply with no action would take 'default' straight to the save step. strictMode means an unmatched message is an error, not a silent drop.", "c": ["route"], "r": []}, {"t": "The tool runs", "d": "MCP_TOOL_CALL opens (or reuses) a session to the tool server, calls the tool and streams back progress, which restarts the engine's idle timer. The result is {success, text, content, ...}. The server address and token come from config.", "c": ["extio"], "r": ["ssrf", "plaintextSecrets"]}, {"t": "Final answer, save, post", "d": "A second LLM_CALL turns the tool result into the final text, SESSION_MEMORY 'append' stores it under the session id kept in metadata, and NOTIFY_TERMINAL posts it. If the run dies before 'append', the question is remembered without an answer.", "c": ["ai", "term"], "r": ["sessionMemory"]}]}, {"id": "failing", "name": "A failing external call", "steps": [{"t": "The request fails", "d": "HTTP_REQUEST calls an inventory API that answers 503. The plugin does not throw on a non-2xx answer: it builds {status: 503, success: false, headers, body} and decides what to do from failureMode.", "c": ["extio"], "r": []}, {"t": "ERROR mode: the node fails", "d": "With failureMode ERROR (default) the 503 becomes a WorkflowExecutionException. The engine's engine.retry policy, if the node has one, retries the message with backoff; with onError ROUTE the failed message goes to the node's 'error' port. The plugin itself does not retry.", "c": ["extio", "contract"], "r": []}, {"t": "CONTINUE mode: a status you can route on", "d": "With failureMode CONTINUE and routeByStatus true, the 503 message leaves on port 'failure' (2xx leaves on 'success'). A transport error such as a timeout becomes status 0 with the error text. routeByStatus without CONTINUE is rejected when the config is checked.", "c": ["extio"], "r": []}, {"t": "The fallback runs", "d": "The 'failure' edge leads to a second node (for example another HTTP_REQUEST to a backup, or a NOTIFY_TERMINAL). The same pattern lets LLM_CALL fail over to a second model: on failure it passes the original payload through so the fallback node can reuse the same config.", "c": ["extio", "ai", "term"], "r": []}, {"t": "The burst problem", "d": "If a trigger or splitter emits 1,000 messages at once, HTTP_REQUEST starts up to 256 requests at the same time (its default concurrency). A rate-limited API will answer many of them with 429, which then all take the failure path.", "c": ["extio"], "r": ["fanout256"]}]}, {"id": "script", "name": "A script, and where its limits end", "steps": [{"t": "An author writes a script", "d": "A MAPPER node in SCRIPT mode holds JavaScript such as 'return {total: payload.items.length}'. When the workflow is submitted, MAPPER checks that the script-js module is present; if not, the config is rejected with a message to add it to yukta.plugins.", "c": ["xform", "build"], "r": []}, {"t": "The script is compiled once", "d": "At compile time the script text is parsed and cached by its text. The cache is a plain map with no size limit, so every distinct script ever submitted stays in memory.", "c": ["xform"], "r": ["unboundedMaps"]}, {"t": "Each message runs it", "d": "For each message a fresh GraalJS context runs the script with 'message', 'payload' and 'metadata' in scope, then the result is converted back to maps and lists. The shared engine reuses compiled code across contexts.", "c": ["xform"], "r": []}, {"t": "A hostile script", "d": "Another author writes Java.type('java.lang.Runtime').getRuntime().exec(...). The class lookup refuses it, and an infinite loop is cancelled after 10 s or 50 million statements. What is left is memory: a script can still allocate a lot, because the runtime has no heap limit option.", "c": ["xform"], "r": ["scriptHostAccess"]}, {"t": "Choosing the safe path", "d": "PROJECTION (SpEL in restricted mode) and TEMPLATE (Handlebars) cannot reach Java classes. A deployment that does not need scripts can leave script-js out with -Pyukta.plugins, which removes the capability entirely.", "c": ["xform", "build"], "r": ["scriptHostAccess"]}]}, {"id": "loop", "name": "Poll until ready with a loop", "steps": [{"t": "Configure the loop", "d": "A LOOP_PREDICATE node names targetPluginId HTTP_REQUEST and a targetConfig with the status URL, an exitCondition on the answer, maxIterations 10, maxDuration PT1M and delayInterval PT2S. A graph cannot contain a cycle, so repeating is done inside one node.", "c": ["flow"], "r": []}, {"t": "The target is looked up", "d": "At run time the loop asks the registry for HTTP_REQUEST and checks it is a processor. It then calls that plugin's process method directly with targetConfig. The target's own config check and initialisation are never run for this config, so a missing url fails on the first message, not at submit.", "c": ["flow", "contract"], "r": ["loopSkipsValidation"]}, {"t": "Each round", "d": "The loop runs the target once on the last message, evaluates the exit condition with #iterationCount and #elapsedTimeMs available, and waits delayInterval. LOOP_PREDICATE keeps only the final message. LOOP_STREAM would pass on everything each round produced.", "c": ["flow", "extio"], "r": []}, {"t": "Limits end it", "d": "If the condition never becomes true, the loop stops at 10 iterations or one minute, whichever is first, and emits what it has. The duration is checked between rounds, so a single slow request can run past it.", "c": ["flow"], "r": []}, {"t": "A round fails", "d": "With failureStrategy ABORT (default) the node fails. RETRY and SKIP both go on to the next round with the previous message. ESCALATE fails with an error whose text starts with 'WorkflowExecutionException:' but whose type is a plain RuntimeException, so engine policies that match on exception type do not recognise it.", "c": ["flow"], "r": ["loopEscalate"]}]}, {"id": "rule", "name": "A rule pauses a run", "steps": [{"t": "The rules are loaded", "d": "At startup RuleSupervisor reads the file named by yukta.supervisor.rules.file. A rule with an unknown command, a missing id, or both 'when/then' and 'deny' stops the server from starting. The rules are not reloaded while it runs.", "c": ["super"], "r": []}, {"t": "Events stream in", "d": "Core feeds the supervisor every execution event: node status changes, workflow status changes, log lines and command outcomes. Each is turned into a few fields (status, module, nodeId, metadata...) that rules match on.", "c": ["super"], "r": []}, {"t": "A counting rule fires", "d": "The rule 'pause-on-repeated-http-failure' wants 3 FAILURE statuses from module HTTP_REQUEST within 60 s. The supervisor keeps a list of timestamps per rule and run. On the third failure the list is cleared and a PauseWorkflow command is returned.", "c": ["super"], "r": ["unboundedMaps"]}, {"t": "The host applies it", "d": "Core's host sends the command with the supervisor's id as the actor, within the rate limit (20 per second by default) and not at all if dry-run is on. The pause is logged as 'PauseWorkflowCommand [by rules]'.", "c": ["super"], "r": []}, {"t": "A deny rule vetoes", "d": "A person tries StopWorkflow with mode KILL. Before it runs, every supervisor reviews it. The 'no-kill' rule matches and the caller gets HTTP 403 with the reason. If the rule's condition had thrown an evaluation error, the command would also be denied: deny fails closed.", "c": ["super"], "r": []}]}, {"id": "modelout", "name": "Model control plane, model down", "steps": [{"t": "Configure the plane", "d": "yukta.control-plane.model.name is set. The plane builds one multiple-choice question from 'instructions' and the options. By default the options are 'continue' (no command) and 'pause' (PAUSE), so the model can pause a run but cannot stop it unless an option says STOP.", "c": ["super"], "r": []}, {"t": "An event arrives", "d": "A node reports FAILURE. The event kind is in the plane's events list (default node and workflow status), so it is described in plain English ('Step HTTP_REQUEST changed status to FAILURE. Details: ...') and sent to the decision model.", "c": ["super", "ai"], "r": ["promptInjection"]}, {"t": "The model answers", "d": "System One or the chosen chat model returns the chosen option with a probability. If that is below min-probability (0.6) or the option has no command, the decision is no commands. Otherwise the plane returns PauseWorkflow or StopWorkflow.", "c": ["super", "ai"], "r": []}, {"t": "The model is down", "d": "The call times out after 2 s or errors. The plane logs a warning and returns 'no opinion'. The run continues untouched. This is fail-open: an outage removes oversight rather than stopping work.", "c": ["super"], "r": ["modelFailsOpen"]}, {"t": "Rules-first as the safer shape", "d": "RulesFirstControlPlane asks the rules first and consults the model only if no rule fired. A rule error counts as no rule. Veto (review) decisions always come from the rules, so the model can never loosen a deny rule.", "c": ["super"], "r": []}]}], "intro": {"chat": "A chat agent that remembers the conversation, lets a model call a tool, and posts the reply. Use it first to learn how the families fit together.", "failing": "What an outside call does when it fails, how the failure pattern turns it into something you can route on, and the burst case.", "script": "How MAPPER's SCRIPT mode works and why it is the sharpest edge in the module.", "loop": "How a loop node repeats another plugin inside one node, which limits end it, and where its shortcuts show.", "rule": "How a written rule watches a run, pauses it, and how a deny rule refuses a command.", "modelout": "How a model-driven control plane behaves, including when the model is unavailable, and why rules-first is safer."}, "caps": [["Starting runs", "REST-started runs", "Emits the payload that started the run.", "API_TRIGGER reads the payload from the Reactor context and emits it as one message with a new id.", "No payload gives an empty message, not a crash.", "No settings; one message per run."], ["Starting runs", "Scheduled runs", "Fires on a fixed gap or a cron time.", "SCHEDULE_TRIGGER with intervalMs or a 6-field cron, optional zone and maxRuns. Payload {tick, firedAt}.", "Exactly one of cron or intervalMs; invalid values are rejected at validation.", "Lives inside one open run; missed ticks are not replayed after a restart."], ["Starting runs", "Fixed inputs", "Starts a workflow with constants or environment values.", "CONSTANT_SOURCE builds a message from 'variables', into payload or metadata.", "Static values are resolved once and reused.", "No ${payload}: a trigger has no input."], ["Routing and shaping", "Filtering and branching", "Keeps, drops or routes messages by condition.", "FILTER with an optional discard port; BRANCH by selector or by per-case conditions; RECIPIENT_LIST to several ports.", "strictMode makes an unmatched or failing message an error, not silent loss.", "Conditions are restricted SpEL; the REGO engine is not implemented."], ["Routing and shaping", "Split and group", "Turns one list into items and items back into a batch.", "SPLITTER (itemsPath, concurrency 1024) and AGGREGATE (size, timeoutMs).", "AGGREGATE flushes when the stream completes.", "A partial batch is only in memory."], ["Routing and shaping", "Input checks", "Sends malformed data to an 'invalid' port.", "VALIDATE with required fields and types.", "Reasons are attached in failureReason.", "Checks shape only, not business rules."], ["Routing and shaping", "Reshaping", "Renames, computes, templates and trims fields.", "MAPPER PROJECTION, TEMPLATE or SCRIPT; CONTENT-FILTER INCLUDE or EXCLUDE.", "PROJECTION and TEMPLATE cannot reach Java classes.", "SCRIPT may load only 12 value classes and java.time.*, runs at most 50 million statements and 10 s, and has no memory limit."], ["Flow and state", "Pacing and repeating", "Slows a stream and repeats another plugin.", "DELAY (delayMs); LOOP_STREAM and LOOP_PREDICATE with maxIterations 10, maxDuration PT1M.", "Loops always end.", "Loops skip the target's config check; RETRY equals SKIP."], ["Flow and state", "Shared counters and flags", "Keeps small facts between messages and runs.", "KV_STORE get, put, incr, delete with namespace and maxEntries 10000.", "incr is atomic; a full store refuses new keys.", "In memory, one JVM, shared by all workflows."], ["Calling out", "Running programs", "Runs an OS command per message and returns its result.", "PROCESS_EXECUTOR with env or stdin input, caps and timeout, structured, raw or JSON output.", "Output is capped (10,000 lines, 10 MiB); a timeout destroys the process.", "Any program the server can run; children can outlive a timeout."], ["Calling out", "Web calls", "Calls any HTTP address and returns status, headers and body.", "HTTP_REQUEST with variables in url, headers and body; routeByStatus.", "Non-2xx is data unless failureMode ERROR.", "No host allow-list; concurrency 256."], ["Calling out", "Files in a folder", "Reads or writes text files under a base directory.", "FILE_READ and FILE_WRITE normalise paths and refuse '..' or links that leave baseDir.", "Reads are size-capped (10 MiB).", "baseDir is author-chosen; a link swapped in after the check is not caught."], ["Calling out", "Database queries", "Runs a parameterised SQL statement.", "SQL_QUERY binds payload fields to '?' placeholders over JDBC.", "Values are never pasted into SQL; rows capped at 1000; statement timeout 30 s.", "A connection per message; any statement kind is allowed."], ["Calling out", "Calling tools on another server", "Invokes an MCP tool and returns its result.", "MCP_TOOL_CALL over streamable HTTP with cached sessions, progress heartbeats and cancellation.", "A slow tool is not timed out while it reports progress.", "No host allow-list; token in config."], ["Models and memory", "Asking a model", "Gets text and parsed actions from a model.", "LLM_CALL for openai(-compatible), anthropic, ollama with retries, prices and failureMode.", "Provider-level retries are off; the plugin's retries are the only ones.", "Cost is reported and can be capped per run with budget (tokens, cost, calls; hardStop ends the run)."], ["Models and memory", "Remembering a chat", "Stores turns per session id.", "SESSION_MEMORY load and append, trimmed to maxTurns.", "Bounded history per session.", "Memory only; no eviction of sessions."], ["Models and memory", "Constrained decisions", "Routes on a model's label, yes/no, score, answers, anomaly or duplicate verdict.", "CLASSIFY, GATE, SCORE, ASK, ANOMALY, DEDUPE with SYSTEMONE or LLM backend.", "Answers outside the options or non-JSON replies are rejected.", "Text sent to the model is cut to 15,000 characters."], ["Watching runs", "Rules and model oversight", "Pauses or stops runs and vetoes commands.", "RuleSupervisor, RuleControlPlane, ModelControlPlane and RulesFirstControlPlane.", "Deny rules fail closed; the model plane fails open.", "Rules load once at startup."], ["Finishing", "Output", "Logs or posts the result.", "CONSOLE_TERMINAL logs each payload; NOTIFY_TERMINAL posts {text} to an https webhook.", "NOTIFY never uses clear text except to localhost.", "CONSOLE writes full payloads at INFO."]], "capsLede": "Eighteen things the plugins can do, grouped by purpose, e
