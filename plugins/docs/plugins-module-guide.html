<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta Plugins Guide</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0efec;--text:#1d1d1b;--muted:#5f5e5a;--line:#dcdad4;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;
  --p0:#b42318;--p0-soft:#fde8e6;--p1:#b54708;--p1-soft:#fdf0e1;--p2:#6941c6;--p2-soft:#efe9fb;--p3:#475467;--p3-soft:#eceef1;
  --ok:#067647;--ok-soft:#e3f5ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--text:#ecebe6;--muted:#a3a29c;--line:#383835;
  --accent:#8aa8ff;--accent-soft:#232c45;
  --p0:#ff8a80;--p0-soft:#3b1d1a;--p1:#ffb35c;--p1-soft:#3a2915;--p2:#c3a6ff;--p2-soft:#2b2240;--p3:#b8c0cc;--p3-soft:#2a2d31;
  --ok:#5fd39b;--ok-soft:#173226;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:4px}
pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0}
pre code{background:none;padding:0}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line)}
nav.side .brand{font-weight:700;font-size:17px;margin-bottom:2px}
nav.side .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
nav.side a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav.side a:hover,nav.side a.active{background:var(--accent-soft);color:var(--text)}
nav.side .theme{margin-top:22px}
main{padding:32px 40px 80px;min-width:0}
section{margin-bottom:56px;scroll-margin-top:16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 6px}
.lede{color:var(--muted);max-width:760px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card>h3:first-child{margin-top:0}
.card ul,.card ol{padding-left:18px;margin:6px 0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;text-decoration:none}
.P0{background:var(--p0-soft);color:var(--p0)}.P1{background:var(--p1-soft);color:var(--p1)}
.P2{background:var(--p2-soft);color:var(--p2)}.P3{background:var(--p3-soft);color:var(--p3)}
.okp{background:var(--ok-soft);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button[aria-pressed="true"]{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"]{color:#111}}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);min-width:220px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pipe{width:100%;height:auto;display:block}
.pipe .box rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2;transition:fill .15s,stroke .15s}
.pipe .box text{fill:var(--text);font:600 13px var(--sans)}
.pipe .box .s{fill:var(--muted);font:12px var(--mono)}
.pipe .box.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.pipe .arrow{stroke:var(--muted);stroke-width:1.4;fill:none}
.pipe .box{cursor:pointer}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.stepbody h3{margin-top:0}
.refs{font-size:13px;color:var(--muted)}
.flag{border-left:3px solid var(--p1);background:var(--p1-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:10px;font-size:14px}
.flag.p0{border-color:var(--p0);background:var(--p0-soft)}
.pkgs{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.pkglist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:6px;padding:7px 10px;background:transparent;font-family:var(--mono);font-size:12.5px}
.pkglist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.finding{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.finding summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}
.finding summary::-webkit-details-marker{display:none}
.finding .id{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:30px}
.finding .t{font-weight:600}
.finding .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.finding .body{padding:0 14px 14px 14px;border-top:1px solid var(--line)}
.finding .body dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;margin:12px 0 0}
.finding .body dt{color:var(--muted);font-size:13px}
.finding .body dd{margin:0;min-width:0;overflow-wrap:anywhere}
.finding.done{opacity:.55}
.finding.done .t{text-decoration:line-through}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.progress .bar{flex:1;height:8px;margin:0}
.progress .bar>i{background:var(--ok)}
.empty{color:var(--muted);padding:20px;text-align:center}
.score td:nth-child(2){font-family:var(--mono);white-space:nowrap}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav.side .links{display:flex;flex-wrap:wrap;gap:4px}
  main{padding:20px 16px 60px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.pkgs{grid-template-columns:1fr}
  .finding summary{grid-template-columns:auto minmax(0,1fr)}
  .finding .meta{grid-column:1/-1}
  .finding .body dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
<nav class="side" aria-label="Sections">
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="navLinks"></div>
  <div class="theme"><button id="themeBtn" type="button">Toggle theme</button></div>
</nav>
<main id="main"></main>
</div>
<script>
var DATA = {"module": "plugins", "htmlTitle": "Yukta Plugins Guide", "title": "plugins guide", "date": "2026-10-09", "lede": "Yukta's 16 built-in plugins across 9 Gradle modules: triggers that start a workflow, processors that route, transform, loop, run processes or call HTTP and LLM services, and terminals that consume results. <b>http-request, llm-call and session-memory were uncommitted work in progress at review time.<\/b>", "stats": [["16", "plugin types"], ["9", "modules"], ["≈6.3k", "main lines"]], "overviewHtml": "<h3>Design in one paragraph<\/h3><p>Each plugin is a Spring <code>@Component<\/code> implementing a <code>plugin-api<\/code> category interface. Config arrives as a <code>Map<\/code> from the workflow node. Dynamic values are resolved per message by core's <code>VariableResolver<\/code> (<code>${payload.x}<\/code>, <code>${metadata.k}<\/code>, <code>${env.X}<\/code>, <code>${sys.p}<\/code>, <code>decrypted:key<\/code>) or by SpEL through <code>SpelUtils<\/code>. Newer plugins (process-executor, http-request, llm-call) share a pattern: a typed config/spec record, a <code>*Gateway<\/code> doing the I/O, a <code>FailureMode<\/code> of ERROR or CONTINUE, and optional success/failure port routing.<\/p><div class=\"flag p0\"><b>Read first:<\/b> <a href=\"#f-G1\" data-jump=\"G1\">G1<\/a> and <a href=\"#f-G2\" data-jump=\"G2\">G2<\/a>. Workflow config can execute arbitrary Java through mapper scripts and SpEL.<\/div>", "score": [["Feature coverage", "4/5", "Good EIP set plus process, HTTP, LLM"], ["Security", "1/5", "Two code-execution paths, SSRF, plaintext secrets"], ["Resource safety", "2/5", "Process fan-out, orphaned processes, unbounded caches"], ["Layering", "2/5", "Plugins depend on core internals"], ["Quality gates", "2/5", "internal-core disables PMD and JaCoCo"], ["Docs", "4/5", "Good usage patterns"]], "flowTitle": "How a plugin handles one message", "steps": [{"k": "Receive", "cls": "core strategy → plugin.process(Flux, config)", "d": "The plugin gets the merged parent stream and the node's config map. One singleton instance serves every node of this type.", "f": ["G11", "G12"]}, {"k": "Resolve", "cls": "core VariableResolver · SpelUtils", "d": "Config values containing <code>${…}<\/code> are resolved against the message, the environment, system properties and the Reactor context. Expression plugins evaluate SpEL against the message.", "f": ["G2", "G5", "G6"]}, {"k": "Execute", "cls": "*Gateway / script engine / registry", "d": "Process: <code>ProcessBuilder<\/code> with output caps and a timeout. HTTP: WebClient. LLM: Spring AI. Mapper: SpEL, Handlebars or GraalJS. Loop: calls another plugin from the registry.", "f": ["G1", "G3", "G4", "G7", "G8", "G9", "G14"]}, {"k": "Map result", "cls": "FailureMode ERROR | CONTINUE", "d": "On failure, ERROR throws a <code>WorkflowExecutionException<\/code>. CONTINUE emits a result payload, such as <code>{exitCode, success, …}<\/code> or <code>{status, body}<\/code>.", "f": ["G10", "G13"]}, {"k": "Route", "cls": "withSourcePort(success|failure|branch)", "d": "Routers and <code>routeBy*<\/code> options stamp <code>sourcePort<\/code>. Core filters edges by port. Internal-core plugins also stamp history, which duplicates it.", "f": ["G15"]}], "pkgTitle": "Plugin modules", "pkgs": [["internal-core", 12, 2862, "BRANCH, RECIPIENT_LIST, SPLITTER, FILTER, CONTENT-FILTER, MAPPER (SpEL/Handlebars/JS), LOOP_STREAM, LOOP_PREDICATE. Uses SpEL and GraalJS. Quality gates are disabled.", "plugins/processors/internal/internal-core"], ["process-executor", 9, 1783, "PROCESS_EXECUTOR: runs OS commands with env/stdin input, output caps, timeout, structured, raw or JSON output, and exit-code routing.", "plugins/processors/process-executor"], ["llm-call (WIP)", 8, 678, "LLM_CALL: OpenAI-compatible, Anthropic or Ollama through Spring AI, with cost calculation and agent actions.", "plugins/processors/llm-call"], ["http-request (WIP)", 5, 389, "HTTP_REQUEST: WebClient call with variable-resolved url, method, headers and body, plus status routing.", "plugins/processors/http-request"], ["session-memory (WIP)", 3, 245, "SESSION_MEMORY: in-memory chat history per session (append and read), trimmed to maxTurns.", "plugins/processors/session-memory"], ["constant-source", 1, 134, "CONSTANT_SOURCE: emits configured variables as the payload or metadata.", "plugins/triggers/constant-source"], ["api-trigger", 1, 87, "api-trigger: emits the REST start payload from the Reactor context.", "plugins/triggers/api-trigger"], ["console-terminal", 1, 74, "CONSOLE_TERMINAL: logs each payload at INFO.", "plugins/terminals/console-terminal"], ["oneshot-trigger", 1, 65, "ONE_SHOT: emits a single empty message.", "plugins/triggers/oneshot-trigger"]], "sections": [{"id": "catalogue", "title": "Plugin catalogue", "lede": "Every built-in type ID, what it does, and its risk notes.", "html": "<div class=\"card tablewrap\"><table><tr><th>Type<\/th><th>Category<\/th><th>Does<\/th><th>Risk notes<\/th><\/tr><tr><td class=\"mono\">api-trigger<\/td><td>Trigger<\/td><td>Emits the REST start payload<\/td><td>G16, G25<\/td><\/tr><tr><td class=\"mono\">ONE_SHOT<\/td><td>Trigger<\/td><td>Emits one empty message<\/td><td><\/td><\/tr><tr><td class=\"mono\">CONSTANT_SOURCE<\/td><td>Trigger<\/td><td>Emits configured variables<\/td><td>G12<\/td><\/tr><tr><td class=\"mono\">FILTER<\/td><td>Processor<\/td><td>SpEL condition: pass or discard port<\/td><td>G2, G15<\/td><\/tr><tr><td class=\"mono\">BRANCH<\/td><td>Processor<\/td><td>SpEL selector to a named port<\/td><td>G2, G15<\/td><\/tr><tr><td class=\"mono\">RECIPIENT_LIST<\/td><td>Processor<\/td><td>Fans out to several ports by expression<\/td><td>G2, G15<\/td><\/tr><tr><td class=\"mono\">SPLITTER<\/td><td>Processor<\/td><td>Splits a collection into a message sequence<\/td><td>G2, G15<\/td><\/tr><tr><td class=\"mono\">CONTENT-FILTER<\/td><td>Processor<\/td><td>Keeps or removes payload fields<\/td><td>G15, G25<\/td><\/tr><tr><td class=\"mono\">MAPPER<\/td><td>Processor<\/td><td>PROJECTION (SpEL), TEMPLATE (Handlebars), SCRIPT (JS)<\/td><td><b>G1<\/b>, G2, G11<\/td><\/tr><tr><td class=\"mono\">LOOP_STREAM / LOOP_PREDICATE<\/td><td>Processor<\/td><td>Repeatedly runs a target processor until an exit condition<\/td><td>G2, G13, G14<\/td><\/tr><tr><td class=\"mono\">PROCESS_EXECUTOR<\/td><td>Processor<\/td><td>Runs an OS command<\/td><td>G3, G4, G8, G9, G10<\/td><\/tr><tr><td class=\"mono\">HTTP_REQUEST<\/td><td>Processor<\/td><td>HTTP call (WIP)<\/td><td>G7<\/td><\/tr><tr><td class=\"mono\">LLM_CALL<\/td><td>Processor<\/td><td>Chat completion (WIP)<\/td><td>G2, G5<\/td><\/tr><tr><td class=\"mono\">SESSION_MEMORY<\/td><td>Processor<\/td><td>Chat history (WIP)<\/td><td>G17<\/td><\/tr><tr><td class=\"mono\">CONSOLE_TERMINAL<\/td><td>Terminal<\/td><td>Logs payloads<\/td><td>G23<\/td><\/tr><\/table><\/div>"}, {"id": "variables", "title": "Variable expressions", "lede": "How <code>${…}<\/code> values are resolved, and the known gaps.", "html": "<div class=\"grid g2\"><div class=\"card\"><h3>Syntax<\/h3><table><tr><th>Form<\/th><th>Resolves to<\/th><\/tr><tr><td class=\"mono\">${payload}<\/td><td>whole payload (keeps its type when it is the entire value)<\/td><\/tr><tr><td class=\"mono\">${payload.a.b}<\/td><td>nested map field<\/td><\/tr><tr><td class=\"mono\">${metadata.k}<\/td><td>metadata entry<\/td><\/tr><tr><td class=\"mono\">${env.NAME} / ${sys.prop}<\/td><td>server environment variable or system property<\/td><\/tr><tr><td class=\"mono\">${context.k}<\/td><td>Reactor context value<\/td><\/tr><tr><td class=\"mono\">${x:int}<\/td><td>cast: int, long, double, bool, string<\/td><\/tr><tr><td class=\"mono\">decrypted:key<\/td><td>SecretProvider (no-op today)<\/td><\/tr><\/table><\/div><div class=\"card\"><h3>Gaps<\/h3><ul><li>The blacklist <code>.*(PASSWORD|SECRET|KEY).*<\/code> applies to <i>every<\/i> key. <code>${payload.keyword}<\/code> throws, while <code>${env.GITHUB_TOKEN}<\/code> is allowed (G6).<\/li><li>No real SecretProvider exists, so API keys go into workflow JSON in plaintext (G5).<\/li><li>Payload-derived values flowing into <code>PROCESS_EXECUTOR<\/code> commands with <code>useShell<\/code> rely on quoting that is wrong on Windows (G3).<\/li><\/ul><\/div><\/div>"}], "findings": [{"id": "G1", "sev": "P0", "area": "Security", "pkg": ["internal-core"], "t": "The mapper's SCRIPT mode gives workflow JavaScript full Java access", "where": "MapperProcessor.executeScript: allowHostAccess(ALL), allowHostClassLookup(s -> true), no resource limits", "impact": "Java.type('java.lang.Runtime') gives code execution, and while(true){} pins a thread.", "fix": "HostAccess.NONE, class lookup off, IO off, statementLimit, ProxyObject inputs, plus a regression test.", "eff": "S"}, {"id": "G2", "sev": "P0", "area": "Security", "pkg": ["internal-core", "llm-call (WIP)"], "t": "SpEL in plugin config (plugin-api A1)", "where": "Filter, Branch, Mapper, RecipientList, LoopStream, Splitter, LlmCall", "impact": "Code execution through T(...) expressions.", "fix": "Sandbox SpelUtils and add a T(...) test per plugin.", "eff": "S"}, {"id": "G3", "sev": "P1", "area": "Security", "pkg": ["process-executor"], "t": "Windows shell quoting is ineffective", "where": "ProcessExecutorGateway.escapeShellArg single-quotes for cmd.exe", "impact": "& | ^ in interpolated arguments run on Windows.", "fix": "Refuse useShell with interpolation on Windows, or use cmd-specific escaping.", "eff": "S"}, {"id": "G4", "sev": "P1", "area": "Design", "pkg": ["process-executor"], "t": "useShell can't use any shell feature", "where": "wrapInShell escapes every metacharacter (test asserts pipes are literal); the safe regex allows ( ) and spaces", "impact": "A misleading option, and word-splitting surprises.", "fix": "Either a trusted verbatim shell string with no interpolation, or remove useShell.", "eff": "S"}, {"id": "G5", "sev": "P1", "area": "Security", "pkg": ["llm-call (WIP)", "http-request (WIP)"], "t": "No way to provide secrets, so API keys are plaintext in workflow config", "where": "NoOpSecretProvider returns empty; ${env.*KEY*} is blocked; bruno sample puts apiKey inline", "impact": "Keys are stored in session files and returned by the read APIs and MCP.", "fix": "An EnvSecretProvider default, and redaction in the read APIs.", "eff": "S"}, {"id": "G6", "sev": "P2", "area": "Correctness", "pkg": ["process-executor", "constant-source"], "t": "The VariableResolver blacklist blocks the wrong things", "where": "core VariableResolver SECRET_BLACKLIST applied to every key", "impact": "${payload.keyword} fails; ${env.GITHUB_TOKEN} is allowed.", "fix": "Apply it only to env and sys, with an allow-list prefix.", "eff": "S"}, {"id": "G7", "sev": "P2", "area": "Security", "pkg": ["http-request (WIP)"], "t": "http-request can reach internal addresses (SSRF)", "where": "HttpRequestGateway: any url, including ${payload.url}", "impact": "Cloud metadata and the internal network are reachable.", "fix": "An allowed-hosts list, block link-local and loopback, check redirects.", "eff": "S"}, {"id": "G8", "sev": "P1", "area": "Resources", "pkg": ["process-executor"], "t": "Up to 256 processes run at once per node", "where": "ProcessExecutorPlugin.process flatMapSequential (default concurrency 256)", "impact": "Mass process creation from a burst of messages.", "fix": "A maxConcurrency config, default 1.", "eff": "S"}, {"id": "G9", "sev": "P1", "area": "Resources", "pkg": ["process-executor"], "t": "A timeout leaves grandchild processes running", "where": "cleanupProcess destroys only the direct child", "impact": "Orphaned processes and blocked reader threads.", "fix": "process.descendants().forEach(ProcessHandle::destroy).", "eff": "S"}, {"id": "G10", "sev": "P2", "area": "Resources", "pkg": ["process-executor"], "t": "Up to 10 MB of output goes into exception messages and logs", "where": "executionFailure and toLineStream embed all stdout", "impact": "Huge logs and leaked output (web W2).", "fix": "Truncate to the last 50 lines.", "eff": "S"}, {"id": "G11", "sev": "P2", "area": "Resources", "pkg": ["internal-core", "constant-source"], "t": "Unbounded script, template and value caches", "where": "MapperProcessor templateCache/jsSourceCache; ConfigVariableSource.staticValueCache", "impact": "Memory grows for every distinct workflow.", "fix": "A bounded LRU, or clear on shutdown.", "eff": "S"}, {"id": "G12", "sev": "P2", "area": "Correctness", "pkg": ["constant-source"], "t": "ConfigVariableSource relies on prepare(), which is never called", "where": "ConfigVariableSource.prepare (plugin-api A7)", "impact": "A dead cache. It only works because start resolves the values again.", "fix": "Delete prepare and the cache.", "eff": "S"}, {"id": "G13", "sev": "P2", "area": "Correctness", "pkg": ["internal-core"], "t": "LoopStream: RETRY equals SKIP; ESCALATE uses the wrong exception type", "where": "LoopStreamProcessor.handleFailure", "impact": "Surprising loop semantics.", "fix": "A distinct SKIP and a real WorkflowExecutionException.", "eff": "S"}, {"id": "G14", "sev": "P2", "area": "Correctness", "pkg": ["internal-core"], "t": "Loops call another plugin and skip its validation", "where": "LoopStream/LoopPredicate registry.get(targetPluginId).process(targetConfig)", "impact": "Invalid target config fails at runtime.", "fix": "Validate targetConfig in the loop's validateConfig.", "eff": "M"}, {"id": "G15", "sev": "P2", "area": "Correctness", "pkg": ["internal-core"], "t": "Plugins stamp history themselves (messaging M1)", "where": "Branch, RecipientList, Splitter, ContentFilter, Filter", "impact": "Duplicate history entries.", "fix": "Remove the plugin-side withAddedHistory.", "eff": "S"}, {"id": "G16", "sev": "P3", "area": "Correctness", "pkg": ["api-trigger"], "t": "api-trigger throws on a missing context payload", "where": "ctx.get(\"payload\")", "impact": "NoSuchElementException.", "fix": "getOrDefault with Map.of().", "eff": "S"}, {"id": "G17", "sev": "P3", "ar
