ach with what it guarantees and where it stops.", "guar": {"title": "Guarantees, limits and defaults", "lede": "What the plugins promise, what they leave to the engine, and what is not enforced at all. Open the tables to see how messages are ordered, what is lost on a restart and which protections exist only as advice.", "tables": [{"title": "How messages are processed", "lede": "The engine hands each plugin a stream. How a plugin consumes it decides ordering and concurrency.", "head": ["Plugins", "How messages are handled", "What it means"], "rows": [["PROCESS_EXECUTOR, HTTP_REQUEST, MCP_TOOL_CALL, LLM_CALL, SESSION_MEMORY, decision plugins (except ANOMALY, DEDUPE)", "Started concurrently, output kept in input order; default concurrency 256 per node", ["part", "Fast, but a burst of 1,000 messages starts 256 calls at once and cannot be tuned in config"]], ["FILE_READ, FILE_WRITE, SQL_QUERY, NOTIFY_TERMINAL, ANOMALY, DEDUPE, loops", "One message at a time, in order", ["ok", "Safe for order-dependent state; a slow call paces everything behind it"]], ["FILTER, MAPPER, RECIPIENT_LIST (parallel true), SPLITTER (parallel true, 1024)", "Handled concurrently; order of output is not guaranteed across messages", ["info", "Fine for independent items; set parallel false when order matters"]], ["DELAY", "Each message waits delayMs, released one at a time", ["ok", "Spaces out a stream; a plain way to stay under a rate limit"]], ["AGGREGATE", "Collects 'size' messages or waits timeoutMs, then emits one list", ["part", "A partial batch lives only in memory"]]]}, {"title": "What survives a restart", "head": ["State", "Where it lives", "After a restart"], "rows": [["KV_STORE contents", "In-memory map in one bean", ["lost", "Gone; also not shared between servers"]], ["SESSION_MEMORY history", "In-memory map keyed by session id", ["lost", "Gone; replace the SessionStore bean for durability"]], ["ANOMALY and DEDUPE windows", "Local to one node run", ["lost", "Gone, and also reset at the start of every run"]], ["Schedule position (SCHEDULE_TRIGGER)", "The running stream", ["lost", "Gone; a restarted run starts counting again"]], ["MCP sessions, LLM model clients, compiled scripts and templates", "Caches in plugin beans", ["info", "Rebuilt on demand; no data is lost"]], ["Rule files (supervisor and control planes)", "Files on disk, read at startup", ["ok", "Re-read at boot; edits need a restart"]], ["Rule count windows", "In-memory per rule and run", ["lost", "Gone; a counting rule starts again from zero"]], ["Files written by FILE_WRITE, rows written by SQL_QUERY, webhooks sent", "Outside Yukta", ["ok", "Kept; but after a crash a node may run again, so these side effects can repeat (at-least-once)"]], ["Secrets", "Environment variables YUKTA_SECRET_<KEY>, or any value written in config", ["info", "Environment: kept by the host. Config: kept wherever workflows are stored"]]]}, {"title": "Enforced or not", "lede": "A table of protections a reader might assume. 'Enforced' means code rejects or limits it; 'Not enforced' means only the workflow author's care stands in the way.", "head": ["Protection", "Status"], "rows": [["Call timeouts (process 300 s, HTTP 30 s, MCP 60 s, LLM 120 s per attempt, SQL 30 s, webhook 10 s)", ["ok", "Enforced per plugin; the engine's node timeout follows the plugin's, except SQL_QUERY and FILE_* which keep the engine default of 30 s"]], ["Output and result size caps", ["part", "Enforced for process output (10,000 lines, 10 MiB), file reads (10 MiB) and SQL rows (1000). No plugin-level cap on HTTP or MCP response bodies; client-library defaults apply and were not checked"]], ["Restricted expressions (no Java types in SpEL)", ["ok", "Enforced for FILTER, BRANCH, MAPPER projection and friends"]], ["Resource limits on JavaScript", ["part", "Class lookup limited to 12 classes and java.time, Class objects denied, 50 million statements and 10 s; no memory limit"]], ["Which hosts HTTP_REQUEST, MCP_TOOL_CALL and NOTIFY_TERMINAL may reach", ["lost", "Not enforced (NOTIFY only requires https)"]], ["Which programs PROCESS_EXECUTOR may run", ["lost", "Not enforced: any program the server account can start"]], ["File paths stay under baseDir", ["part", "Enforced for '..' and existing links; baseDir itself is workflow config, and a link created after the check is not caught"]], ["SQL values never concatenated into SQL", ["ok", "Enforced: only bound '?' parameters; but any statement kind (even DDL) may be run"]], ["Secrets hidden from read APIs and logs", ["lost", "Not enforced: apiKey, authToken and password stored in config are returned as written; CONSOLE_TERMINAL logs payloads in full"]], ["Spending cap on model calls", ["part", "LLM_CALL and MCP_TOOL_CALL stop at a per-run budget (tokens, cost, calls; hardStop ends the run). Counted in memory per JVM; LLM-backed decisions are not budgeted"]], ["Deny rules in a supervisor", ["ok", "Enforced and fail closed"]], ["Model control plane oversight", ["part", "Best effort: fails open when the model is unavailable"]]]}, {"title": "Timeouts and margins", "head": ["Plugin", "Own timeout", "Node timeout the engine uses"], "rows": [["PROCESS_EXECUTOR", "timeout, 300 s", "timeout plus 10 % (at least 5 s)"], ["HTTP_REQUEST", "timeout, 30 s", "timeout plus 5 s"], ["MCP_TOOL_CALL", "timeout, 60 s", "timeout plus 5 s; progress heartbeats restart the idle clock"], ["LLM_CALL", "timeout, 120 s per attempt", "(timeout + 1) x (retries + 1) + 5 s + backoff; retries counted up to 10"], ["Decision plugins", "timeout, 30 s", "timeout plus 5 s"], ["SQL_QUERY", "timeoutSeconds, 30 s", "Not derived: engine default of 30 s"], ["NOTIFY_TERMINAL", "timeoutMs, 10 s", "Not derived: engine default of 30 s"], ["ModelControlPlane", "timeout, 2 s", "Not a node: a failed or late answer means no opinion"]]}]}, "ref": [{"id": "cat1", "title": "Catalogue 1: triggers, routing, transform, flow", "lede": "Type id, what it does, key settings with defaults, and notes. All 'strictMode' defaults are true. Risk ids refer to the Risks board.", "head": ["Type", "Category", "Does", "Key settings (default)", "Notes"], "rows": [["API_TRIGGER", "Trigger", "Emits the start payload from the REST or MCP start call", "none", "Empty map if no payload"], ["CONSTANT_SOURCE", "Trigger", "Emits one message of fixed or env-derived values", "variables (empty), target PAYLOAD|METADATA (PAYLOAD)", "No ${payload}; static value cache unbounded"], ["SCHEDULE_TRIGGER", "Trigger", "Emits {tick, firedAt} on a schedule", "intervalMs xor cron (6-field), zone (system), maxRuns (unbounded)", "First tick after one interval; schedule lost on restart"], ["FILTER", "Processor", "Keeps messages where a condition is true", "condition, engine SpEL|SIMPLE (SpEL), discardPort, strictMode, allowAfterHeavy (false)", "REGO rejected as not implemented; no discardPort means silent drop"], ["BRANCH", "Processor", "Routes a message to a named port", "mode SELECT_KEY|EXPRESSION (SELECT_KEY), selector, cases, defaultPort, allowMultipleMatches (false), errorPort", "No match and no default is an error when strict"], ["RECIPIENT_LIST", "Processor", "Copies a message to several ports", "mode DYNAMIC|STATIC|EXTERNAL (DYNAMIC), recipients, expression, sourceField, parallel (true), errorPort", "Dynamic mode declares any port name"], ["SPLITTER", "Processor", "One message per list item", "itemsPath, headerMapping, parallel (true), concurrency (1024), errorPort", "Parallel output order not promised"], ["AGGREGATE", "Processor", "Batches payloads into one list message", "size (required), timeoutMs (none)", "Partial batch in memory; flushed at stream end"], ["VALIDATE", "Processor", "Checks required fields and types", "required, types (string|number|boolean|object|array)", "Bad messages leave on 'invalid' with failureReason"], ["MAPPER", "Processor", "Reshapes the payload", "mode PROJECTION|TEMPLATE|SCRIPT, mapping, dropOriginal (true)", "SCRIPT needs script-js; class lookup, time and statements limited, no memory limit (scriptHostAccess)"], ["CONTENT-FILTER", "Processor", "Keeps (INCLUDE) or drops (EXCLUDE) paths", "mode, paths, flatten (false), errorPort", "Only kebab-case type id (typeIds)"], ["DELAY", "Processor", "Holds each message delayMs, one at a time", "delayMs (required, positive)", ""], ["LOOP_STREAM", "Processor", "Runs a target processor repeatedly, emits every round's output", "targetPluginId, targetConfig, exitCondition, maxIterations (10), maxDuration (PT1M), delayInterval (PT0S), failureStrategy (ABORT)", "No exitCondition means one round; loopEscalate, loopSkipsValidation"], ["LOOP_PREDICATE", "Processor", "Same, emits only the last message", "same as LOOP_STREAM", "Same risks"], ["KV_STORE", "Processor", "Shared in-memory key-value store", "op get|put|incr|delete, key (payload.key), namespace (none), maxEntries (10000)", "Emits {key, value}; kvVolatile"]]}, {"id": "cat2", "title": "Catalogue 2: external I/O and AI", "lede": "All of these use failureMode ERROR (default) or CONTINUE. Where routeByStatus or routeByExitCode exists it needs CONTINUE and adds ports 'success' and 'failure'.", "head": ["Type", "Does", "Key settings (default)", "Output", "Notes"], "rows": [["PROCESS_EXECUTOR", "Runs an OS command", "command (list), inputMode NONE|ENV|STDIN (NONE), workingDir, timeout (300 s), env, useShell (false), captureStderr (false), outputFormat STRUCTURED|RAW|JSON|PASSTHROUGH (STRUCTURED), routeByExitCode (false), maxOutputLines (10000), maxOutputBytes (10 MiB), includeOutput (true), includeInput (false)", "{exitCode, success, timedOut, durationMillis, outputTruncated, stdout, stderr}", "No program allow-list; concurrency 256; children survive a timeout; useShell escapes all metacharacters"], ["HTTP_REQUEST", "One HTTP request per message", "url, method (GET), headers, body, timeout (30 s), routeByStatus (false)", "{status, success, headers, body} and metadata status", "Any host reachable; transport errors give status 0 under CONTINUE"], ["FILE_READ", "Reads a UTF-8 file", "baseDir (required), path (payload.path), maxBytes (10 MiB)", "{path, content}", "Errors to 'error' port under CONTINUE"], ["FILE_WRITE", "Writes or appends a line", "baseDir, path, contentField (content), append (false)", "Input message passes through", "A plain String payload is written as is"], ["SQL_QUERY", "Runs one parameterised statement", "url, username, password, sql, params, maxRows (1000), timeoutSeconds (30)", "{rows, count} or {updated}", "Driver from deployer; connection per message; password is not variable-resolved"], ["MCP_TOOL_CALL", "Calls a tool on a remote MCP server", "url, tool, arguments (payload), headers, authToken, timeout (60 s), resultKey, routeByStatus (false)", "{success, tool, text, content, structured, error}; metadata mcpSuccess, mcpTool, mcpLatencyMs", "Control signal 'reset' drops cached sessions; routeByStatus restricts edge ports to success, failure, error"], ["LLM_CALL", "Calls a chat model", "provider openai|openai-compatible|anthropic|ollama, model, prompt, messages, system, baseUrl, apiKey, temperature, maxTokens, timeout (120 s), retries (0), prices, routeByStatus (false)", "{success, content, actions, usage, latencyMs, model, cost?}", "CONTINUE passes the original payload on with llmSuccess=false; budget {maxTokens, maxCost, maxCalls, agent, hardStop}"], ["SESSION_MEMORY", "Per-session chat history", "mode load|append, sessionId, message, assistant, maxTurns (20)", "load adds payload.history; append passes through", "In memory; keyed by session id alone"], ["CLASSIFY", "Picks one of 2+ labels", "labels (map), question, minProbability (0.6), routeByLabel (false)", "metadata 'classification' {label, probabilities, uncertain}", "Ports: one per label plus 'uncertain', or 'default'"], ["GATE", "Yes/no question", "question, threshold (0.5)", "metadata 'gate' {probability, passed}", "Ports 'pass', 'reject'"], ["SCORE", "Rates on ordered levels", "question, levels (2 to 26), threshold (none)", "metadata 'score' {score, level}", "Ports 'high', 'low' with a threshold, else 'default'"], ["ASK", "Up to 64 questions in one call", "questions (name to {type choice|yesno|score, instructions, criteria})", "metadata 'answers'", "Route on answers with BRANCH"], ["ANOMALY", "Is this unusual vs the last window messages?", "window (20), minHistory (5), threshold (0.5), question", "metadata 'anomaly' {probability, warmup}", "Ports 'normal', 'anomalous'; window per node and run"], ["DEDUPE", "Same meaning as a recent message?", "window (10), minProbability (0.6)", "metadata 'dedupe' {duplicate, duplicateOf, probability}", "Ports 'unique', 'duplicate'; window per node and run"]]}, {"id": "cat3", "title": "Catalogue 3: terminals, supervisors, control planes", "lede": "Decision plugins share these settings: backend SYSTEMONE|LLM (SYSTEMONE), provider (needed for LLM), model, baseUrl (http://localhost:11434 for SYSTEMONE), apiKey, timeout (30 s), state (payload, cut to 15,000 characters), into (the metadata key).", "head": ["Name", "Kind", "Does", "Switch and settings (default)", "Notes"], "rows": [["CONSOLE_TERMINAL", "Terminal", "Logs each payload at INFO", "none", "Full payloads in logs (consoleLogs)"], ["NOTIFY_TERMINAL", "Terminal", "POSTs {text} to a webhook", "url (https, http only for localhost), text, timeoutMs (10000), failureMode (ERROR)", "Redirects count as failures; url is not variable-resolved"], ["RuleSupervisor (id 'rules')", "Supervisor", "Applies JSON rules to events and reviews commands", "yukta.supervisor.rules.file", "Rules fixed at startup"], ["RuleControlPlane", "Control plane", "The same rules behind decide(event)", "yukta.control-plane.rules.file", "Probability 1, source RULE"], ["ModelControlPlane", "Control plane", "Asks a decision model what to do about an event", "yukta.control-plane.model.name; .backend (SYSTEMONE), .provider, .base-url, .api-key, .timeout (2s), .min-probability (0.6), .instructions, .options.<key>.description and .command NONE|PAUSE|STOP (defaults continue=NONE, pause=PAUSE), .events (NodeStatusChanged, WorkflowStatusChanged)", "Fails open; no command review; at least two options required"], ["RulesFirstControlPlane", "Control plane", "Rules first, model only if no rule fired", "yukta.control-plane.rules-first.rules-file and .model.* (same keys as above)", "Leave the individual plugins' properties unset; deny reviews come from rules"]]}, {"id": "vars", "title": "The ${...} variable syntax", "lede": "Only plugins that call the resolver use this (see the Contract component). If the whole value is one variable it keeps its type; mixed with text it becomes text.", "head": ["Form", "Resolves to", "Notes"], "rows": [["${payload}", "The whole payload", "Keeps its type when it is the entire value"], ["${payload.a.b}", "A nested field of a payload map", "Missing path gives an empty value; only maps are walked, not lists"], ["${metadata.k}", "A metadata entry", ""], ["${env.X}", "Environment variable X of the server", "Blocked when the name contains PASSWORD, PASSWD, SECRET, TOKEN, CREDENTIAL, PRIVATE or KEY (any case); no allow-list otherwise"], ["${sys.p}", "JVM system property p", "Same name check as env"], ["${context.k}", "A value in the Reactor context", "Per-run values the engine places in the Reactor context"], ["${x:int}", "Cast to int, integer, long, double, float, bool, boolean or string", "Needed where a plugin expects a number, because untyped variables resolve to text"], ["decrypted:key", "A secret from the SecretProvider", "Default provider reads YUKTA_SECRET_<KEY>; a missing secret is an error. Works as a whole value or inside ${...}"], ["SpEL expressions", "Not variables: separate syntax used by FILTER, BRANCH, SPLITTER, MAPPER projection, LOOP exitCondition, LLM_CALL messages, decision 'state'", "Restricted mode: property reads and method calls only"]]}, {"id": "select", "title": "Which module brings which types", "lede": "Always-on modules are compiled into every build. Optional modules are picked with -Pyukta.plugins.", "head": ["Module (name in yukta.plugins)", "Always on?", "Types or components it provides"], "rows": [["internal-core", "Always", "FILTER, BRANCH, RECIPIENT_LIST, SPLITTER, AGGREGATE, VALIDATE, MAPPER, CONTENT-FILTER, DELAY, LOOP_STREAM, LOOP_PREDICATE, KV_STORE"], ["api-trigger, constant-source, schedule-trigger", "Always", "API_TRIGGER, CONSTANT_SOURCE, SCHEDULE_TRIGGER"], ["console-terminal, notify-terminal", "Always", "CONSOLE_TERMINAL, NOTIFY_TERMINAL"], ["rule-supervisor, rule-control-plane, model-control-plane, rules-first-control-plane", "Always", "RuleSupervisor, RuleControlPlane, ModelControlPlane, RulesFirstControlPlane (each active only if its property is set)"], ["process-executor", "Optional", "PROCESS_EXECUTOR"], ["http-request", "Optional", "HTTP_REQUEST"], ["file-io", "Optional", "FILE_READ, FILE_WRITE"], ["sql-query", "Optional", "SQL_QUERY (JDBC driver supplied by the deployer)"], ["llm-call", "Optional", "LLM_CALL"], ["session-memory", "Optional", "SESSION_MEMORY"], ["decision", "Optional (but pulled in by the control planes)", "CLASSIFY, GATE, SCORE, ASK, ANOMALY, DEDUPE; pulls in llm-call"], ["mcp-tool-call", "Optional", "MCP_TOOL_CALL"], ["script-js", "Optional", "GraalJS implementation of the ScriptEngine interface, enabling MAPPER SCRIPT mode"]]}, {"id": "rules", "title": "Rule file fields", "lede": "One JSON file, {\"rules\": [...]}. Each rule has an id and either when/then or deny. Unknown fields fail at startup.", "head": ["Part", "Field", "Meaning"], "rows": [["when", "event", "NodeStatusChanged, WorkflowStatusChanged, LogLine or ControlOutcome (class name of the event)"], ["when", "status, module, nodeId, workflowId", "Exact match on the event field; omitted means any"], ["when", "if", "SpEL condition over the event fields (status, module, nodeId, metadata, command, actor, line...). If it cannot be evaluated the rule does not fire"], ["when", "count, withinSeconds", "Fire only when count matching events arrive within the window (default window 60 s), counted per rule and run"], ["then", "command", "PauseWorkflow, ResumeWorkflow, StopWorkflow, PauseNode, ResumeNode or StopNode"], ["then", "mode, reason, immediate", "StopWorkflow mode (default DRAIN); StopNode immediate flag; reason text (default 'Stopped by rule')"], ["deny", "command", "Name of the command to veto (the 'Command' suffix is optional)"], ["deny", "if", "SpEL over the command fields (executionId, actor, nodeId, mode, reason, immediate). If it cannot be evaluated the command is denied"], ["deny", "reason", "Text returned to the caller (default 'denied by rule <id>')"]]}], "quality": [{"n": "Scalability", "pos": "Per-message plugins scale with the JVM's threads and with the number of nodes, and most of the cost is waiting on outside systems. What does not scale is state: KV_STORE, SESSION_MEMORY and the control-plane windows live in one process.", "ceil": ["Default concurrency of 256 per node for process, HTTP, MCP, model and session plugins, not configurable", "KV_STORE capped at 10,000 keys in one JVM; SESSION_MEMORY unbounded", "ModelControlPlane asks the model about each matching event, one at a time", "SQL_QUERY opens a connection per message"], "have": ["Caps on process output, file reads and SQL rows", "SPLITTER concurrency and AGGREGATE size are settings", "Optional modules keep unused code out of a build"], "need": ["A max-concurrency setting on external plugins", "A store interface so KV_STORE and SESSION_MEMORY can be database-backed", "A connection pool for SQL_QUERY"]}, {"n": "Performance", "pos": "Pure plugins (FILTER, BRANCH, PROJECTION) are cheap and cache parsed expressions. The cost is in model calls and outside requests, which take seconds, not microseconds.", "ceil": ["A model call per message (decision plugins, LLM_CALL) dominates latency and cost", "SCRIPT mode creates a fresh GraalJS context per message", "A Handlebars or SpEL parse is cached forever, so memory, not CPU, is the limit", "File and SQL work uses a shared pool for blocking work"], "have": ["Compiled scripts and templates are reused", "SpEL cache is a 1,000-entry LRU", "Model clients are reused per configuration", "Timeouts bound every external wait"], "need": ["Rate limits for hosts and non-model plugins (model providers have yukta.llm.rate-limit)", "Budgets for LLM-backed decisions (LLM_CALL and MCP_TOOL_CALL have them)", "Benchmark figures (none were found in the module notes)"]}, {"n": "Availability", "pos": "Plugins are as available as what they call. The module's job is to fail in a way the graph can handle: status ports, error ports, fallbacks. In-memory state does not survive a restart.", "ceil": ["A failed model, webhook or database fails every message that needs it", "KV_STORE, session history and windows vanish on restart", "The model control plane fails open by design", "Schedules are not remembered across restarts"], "have": ["failureMode CONTINUE with routeBy ports for fallback paths", "LLM_CALL passes the payload on for model failover", "Engine retry and dead-letter ports apply on top"], "need": ["Durable session and KV stores", "A circuit breaker for repeated failures of one outside system", "Persistent schedules"]}, {"n": "Security", "pos": "This is the lens that matters most. Plugins turn author-written configuration into running code, network calls, file access and database queries. Several guards exist (restricted SpEL, bound SQL parameters, file path checks, https for webhooks), but several are absent.", "ceil": ["JavaScript has a class allow-list, a statement limit and a time limit, but no memory limit", "No host allow-list for HTTP_REQUEST, MCP_TOOL_CALL or NOTIFY_TERMINAL; PROCESS_EXECUTOR runs nothing unless yukta.process.allowed-commands is set (or allow-any is on)", "Secrets written in config are returned by read APIs as plaintext", "Untrusted text goes straight into model prompts"], "have": ["Restricted SpEL with no types or constructors", "decrypted: secrets from YUKTA_SECRET_ environment variables", "File sandbox with link checks; SQL bound parameters; https-only webhooks", "Deny rules that fail closed; optional modules"], "need": ["Host and command allow-lists, set by the operator, not the author", "A memory limit for scripts and a host allow-list for outbound calls", "Secret redaction in read APIs", "A decision on who is trusted to author workflows"]}, {"n": "Operability", "pos": "Each external plugin counts successes and errors per node and publishes a usage description. MCP calls get a timer. Logging is uneven: some plugins log payloads and exception text in full.", "ceil": ["CONSOLE_TERMINAL logs every payload at INFO", "PROCESS_EXECUTOR puts up to 10 MiB of output into error messages and logs", "Rule files need a restart to change", "No metrics for model cost totals"], "have": ["Per-node counters for most plugins", "A Micrometer timer yukta.mcp.call", "A generated config form from each plugin's field list", "Usage text that explains every setting"], "need": ["Truncation of embedded output", "Reloadable rules", "Cost and token metrics", "Redacted logging"]}, {"n": "Evolvability", "pos": "Adding a plugin is easy: one bean, one config schema. The friction is below the surface: 11 of 19 plugin modules depend on core, two quality gates are off in the largest module, and type ids are not uniformly named.", "ceil": ["Plugins compile against core classes, so core changes can break them", "internal-core holds 12 types and has PMD and Checkstyle-test disabled", "Per-plugin copies of UI card HTML", "Aliases do not exist if a type id is renamed"], "have": ["One contract; a registry that rejects duplicates", "A shared failure helper, metrics hook and config validators", "A tests-pin-the-field-names convention in the module notes"], "need": ["Move resolver and helpers into plugin-api", "Re-enable the disabled gates", "A naming rule and an alias mechanism for type ids"]}], "risks": [{"id": "scriptHostAccess", "t": "MAPPER SCRIPT: sandboxed, but no memory limit and host access to its inputs (G1)", "a": "Security", "i": 2, "e": 3, "c": ["xform", "build"], "why": "Done (PR #373): the GraalJS class lookup accepts only 12 value classes (Math, String, the number and boolean wrappers, UUID, Base64, ArrayList, HashMap, List, Map) and java.time.*; Class objects are denied, so no reflection; a script is cancelled after 50 million statements or 10 s (<code>yukta.script.max-statements<\/code>, <code>yukta.script.timeout-ms<\/code>). Still open: (1) there is no memory limit (the runtime has no heap option), so a script can allocate until the JVM is under pressure; (2) <code>HostAccess.ALL<\/code> is still used, so a script can call every public method of the objects it is given (message, payload, metadata); (3) the 'nosem' comments that switch off the OpenGrep rules remain, so a regression would not be flagged; (4) one shared watchdog thread cancels every script.", "o": "Run scripts on a bounded pool and watch their heap use from the watchdog, or give them read-only proxy views of the message instead of host objects; add a test that fails if the lookup list grows; keep script-js out of builds that do not need it (-Pyukta.plugins).", "q": "Do you trust every workflow author with the CPU and memory of the server for ten seconds at a time?"}, {"id": "ssrf", "t": "No host allow-list for HTTP_REQUEST, MCP_TOOL_CALL (G7)", "a": "Security", "i": 4, "e": 2, "c": ["extio", "term", "build"], "why": "HTTP_REQUEST and MCP_TOOL_CALL send to any url in config, and the url can be built from the message (${payload.url}). That reaches the cloud metadata address (169.254.169.254), localhost admin ports and anything on the internal network. NOTIFY_TERMINAL requires https but accepts any host. The MCP session cache is keyed by url and credentials, so many different urls also mean many cached sessions. Update: MCP_TOOL_CALL now has tool-level controls (<code>allowedTools<\/code>, <code>yukta.mcp-client.allowed-tools<\/code>, argument limits and deny patterns, <code>requireApproval<\/code>), but they decide which tool is called, not which host: an empty allow-list still allows any tool and any url.", "o": "An operator-set list of allowed hosts (for example yukta.http.allowed-hosts); block loopback and link-local addresses by default; re-check the address after each redirect and after DNS resolution; apply the same check to MCP and webhooks.", "q": "Should the allow-list be per deployment, per session (team), or per workflow? And is a network egress policy outside the application a cleaner place for it?"}, {"id": "plaintextSecrets", "t": "Secrets sit in workflow config and are returned as written", "a": "Security", "i": 4, "e": 3, "c": ["contract", "extio", "ai"], "why": "A default secret provider now exists (decrypted:key reads YUKTA_SECRET_<KEY>), but nothing forces its use. apiKey (LLM_CALL, decision plugins, model plane), authToken (MCP), SQL passwords and webhook urls can be typed into the config, and the code has no redaction in read paths, so the REST and MCP workflow views return them. LlmGateway also keeps the key inside its client cache key. And SQL_QUERY's schema text suggests 'decrypted:<key>' for the password, but the plugin never calls the resolver, so that form would be used literally.", "o": "Redact secret-typed fields (the field list already has a SECRET type) in every read API; make plugins that take secrets resolve decrypted: consistently, including SQL_QUERY; consider rejecting plain-text values for SECRET fields.", "q": "Is it acceptable for a workflow definition to be a secret-bearing document, or must it be safe to share like source code?"}, {"id": "shellModel", "t": "PROCESS_EXECUTOR: command allow-list added; allow-any and useShell remain (G3, G4)", "a": "Security", "i": 2, "e": 2, "c": ["extio"], "why": "Done (PR #373): nothing runs unless <code>yukta.process.allowed-commands<\/code> lists the executable (or <code>yukta.process.allow-any=true<\/code>), and <code>useShell<\/code> is refused while the list is set. Still open: (1) <code>allow-any=true<\/code> switches the check off, and then <code>useShell<\/code> works with the old quoting, which <code>cmd.exe<\/code> on Windows does not honour, so '&amp;' or '|' inside an interpolated value can still act; (2) the list names programs, not arguments, so an allowed interpreter or a tool that takes options (git, python, curl) still runs whatever a message puts into its arguments; (3) on Unix the single-quote escaping means pipes and redirects never work, so <code>useShell<\/code> only adds PATH lookup, which surprises authors.", "o": "Refuse useShell on Windows when any argument is interpolated; allow a pattern per program (allowed arguments) for the programs that take options; consider dropping useShell and exec arguments directly.", "q": "Which programs do your workflows really need, and can any of them be told to run another program?"}, {"id": "orphans", "t": "A timeout kills the child but not its children (G9)", "a": "Reliability", "i": 3, "e": 2, "c": ["extio"], "why": "On timeout the plugin destroys, then force-kills, the process it started. If that process was a shell or a build tool that started others (sh -> mvn -> java), the descendants keep running and keep the output pipes open, which can block the reader threads on the pool for blocking work.", "o": "Destroy descendants before the parent, in both the graceful and the forcible path (the platform's process handle lists them); consider running the child in its own process group.", "q": "Do you run build tools and scripts through this plugin, or only single binaries?"}, {"id": "fanout256", "t": "Default concurrency 256 per node, not configurable (G8)", "a": "Scalability", "i": 3, "e": 2, "c": ["extio", "ai"], "why": "PROCESS_EXECUTOR, HTTP_REQUEST, MCP_TOOL_CALL, LLM_CALL, SESSION_MEMORY and the decision plugins start work for up to 256 messages at once and keep the output in order. A trigger or splitter that emits 1,000 messages starts 256 processes, requests or model calls together. Model and web APIs rate-limit well below that, and each process uses real memory and file handles. Update: model calls can now be spaced per provider with <code>yukta.llm.rate-limit.&lt;provider&gt;<\/code> (requests per minute, across all nodes and runs), which covers the provider-rate part for LLM_CALL and the LLM-backed decisions. PROCESS_EXECUTOR, HTTP_REQUEST, MCP_TOOL_CALL, SESSION_MEMORY and the file and SQL plugins still start up to 256 at once.", "o": "A maxConcurrency setting per node (default small, for example 1 to 4 for processes and 8 to 16 for network calls); a shared rate limiter per provider or host.", "q": "Should the engine own a per-node concurrency policy (like retry) instead of each plugin choosing?"}, {"id": "fileSandbox", "t": "File sandbox protects a path, not an author", "a": "Security", "i": 3, "e": 2, "c": ["extio"], "why": "baseDir is a plain config value, so the author who writes the workflow also chooses the sandbox: baseDir '/' reads anything the server can read. In our view the sandbox therefore only helps when the path comes from the message (untrusted input) and baseDir from a trusted author. Also, the link check and the open are separate steps (the code has a 'ponytail' note), so a link swapped in between is not caught.", "o": "An operator-set root that every baseDir must be inside; open files without following links (the platform's no-follow option) so there is no gap between check and use.", "q": "Who chooses baseDir in your deployment: the operator or the author?"}, {"id": "unboundedMaps", "t": "Several caches and maps never evict (G11)", "a": "Scalability", "i": 3, "e": 2, "c": ["xform", "route", "trig", "ai", "extio", "super"], "why": "These all grow with the number of distinct inputs and are never trimmed: MAPPER's template and script caches (keyed by text), the SIMPLE expression cache, CONSTANT_SOURCE's static value cache, LlmGateway's model clients (keyed by url, key, model and options), MCP session cache (keyed by endpoint and credentials), and the supervisor's count windows (keyed by rule and run, only cleared when the rule fires). Each is small per entry; the risk is a long-lived server whose workflows change often.", "o": "A bounded LRU or time-based expiry for each (the SpEL cache already does 1,000 entries); remove entries when a run ends or a node shuts down.", "q": "How long does one server live in your deployment, and how often do definitions change?"}, {"id": "sessionMemory", "t": "SESSION_MEMORY: durable now; memory cache never evicts and no owner", "a": "Reliability", "i": 3, "e": 2, "c": ["ai"], "why": "Done: the history can be kept in a file per session (<code>yukta.session-memory.dir<\/code>) or in PostgreSQL (<code>yukta.session-memory.store-type=postgres<\/code>, table session_history; <code>yukta.session-memory.ttl<\/code> deletes sessions not written for that long), so a restart no longer erases it. Still open: (1) the in-memory map in <code>SessionStore<\/code> still has no eviction (the 'ponytail' note is still there; the TTL cleans the database, not the cache), so abandoned sessions stay until a restart; (2) the key is the session id alone, so any workflow that knows or guesses an id can read that conversation; (3) the user turn is stored before the model answers, so a failed call leaves an unanswered question.", "o": "Evict idle sessions from the cache (a size or time bound); scope keys by workflow or owner; store the user turn together with the answer, or mark an unanswered turn.", "q": "Is chat history user data that must be isolated, retained or deleted on request?"}, {"id": "kvVolatile", "t": "KV_STORE: PostgreSQL option added; default still memory-only, namespace optional", "a": "Reliability", "i": 3, "e": 2, "c": ["flow"], "why": "Done: with <code>yukta.kv.store-type=postgres<\/code> the store is the <code>kv_entry<\/code> table (<code>R2dbcKeyValueStore<\/code>), survives a restart, is shared by servers and increments a counter in one statement, behind the new <code>KeyValueStore<\/code> SPI. Still open: (1) the default is the in-memory store, so counters and flags that look durable are not unless the type is set; (2) <code>namespace<\/code> is optional (default none), so two workflows using the key 'counter' share it; (3) in the in-memory store the size check and the insert are separate steps, so the cap can be passed slightly under heavy concurrency (a 'ponytail' note says so).", "o": "Make namespace default to the workflow id; log a warning at startup when KV_STORE nodes exist and the store is in memory; make the cap check atomic.", "q": "What would you use KV_STORE for that you could not afford to lose?"}, {"id": "loopEscalate", "t": "LOOP failureStrategy: RETRY equals SKIP; ESCALATE has the wrong type (G13)", "a": "Correctness", "i": 2, "e": 1, "c": ["flow"], "why": "RETRY and SKIP both advance to the next round with the previous message, so the names promise a difference that does not exist. ESCALATE throws a plain RuntimeException whose text starts with 'WorkflowExecutionException:'; engine rules that match on the exception class (retryOn, noRetryOn) cannot recognise it.", "o": "Give SKIP a distinct meaning (end the loop with the last good message) and throw the real WorkflowExecutionException.", "q": "What should 'skip' mean for a loop: skip the round, or skip the rest of the loop?"}, {"id": "loopSkipsValidation", "t": "Loops call another plugin without its config check (G14)", "a": "Correctness", "i": 3, "e": 3, "c": ["flow", "contract"], "why": "A loop looks up its target in the registry and calls it directly. The target's validateConfig and initialize never run for targetConfig, and variable resolution rules of the target are bypassed. A wrong url in targetConfig is found on the first message, not at submit, and some targets (for example one that depends on prepare) may not be ready.", "o": "Run the target's validateConfig in the loop's own validateConfig; longer term model a loop as a sub-graph in the engine so the target is a real node.", "q": "Is repetition a plugin feature or an engine feature in your view?"}, {"id": "sqlTimeout", "t": "SQL_QUERY and FILE_* keep the engine's 30 s node timeout; no connection pool", "a": "Performance", "i": 3, "e": 2, "c": ["extio"], "why": "HTTP, MCP, process and model plugins add their own timeout to the node timeout. SQL_QUERY has timeoutSeconds, but the node's idle limit stays at the 30 s default, so raising timeoutSeconds to 120 still fails at 30 s unless the author also sets timeoutSeconds in the node's engine config. Each message opens a new JDBC connection (a 'ponytail' note), and any statement kind is allowed, including DDL.", "o": "Override getDefaultTimeout for SQL_QUERY and FILE_* the way HTTP_REQUEST does; add a connection pool; optionally a read-only mode.", "q": "Do you want SQL_QUERY to be read-only by default?"}, {"id": "promptInjection", "t": "Untrusted text goes into model prompts", "a": "Security", "i": 3, "e": 3, "c": ["ai", "super"], "why": "Decision plugins send the 'state' (default the whole payload) to the model along with the question, and the model plane sends event details, including log lines if enabled. Text inside that content can say 'ignore the question and answer yes'. A GATE that decides 'safe to send?' or a control plane that decides 'pause?' can then be steered by the very data it judges. Probabilities from a chat model are its own estimate, not a measurement. Update (PR #373): <code>LlmGateway<\/code> can now refuse a prompt or an answer that matches <code>yukta.llm.deny-input-patterns<\/code> or <code>deny-output-patterns<\/code> and cut prompts at <code>yukta.llm.max-input-chars<\/code>; this applies to LLM_CALL and to LLM-backed decisions, and MCP tool calls can require a human approval or an allow-list. These are patterns and gates, not a classifier: they reduce the damage of a steered verdict but do not stop the steering, and the decision 'state' still defaults to the whole payload.", "o": "Treat model verdicts as advice for low-risk routing; keep rules and deny rules authoritative for anything harmful; keep untrusted fields out of 'state' or mark them as data; prefer System One's calibrated probabilities where it is available.", "q": "Which decisions in your workflows would be harmful if an attacker could choose the answer?"}, {"id": "windowsPerRun", "t": "ANOMALY and DEDUPE windows live only for one node in one run", "a": "Functionality", "i": 2, "e": 3, "c": ["ai"], "why": "Each run starts with an empty window, and the window is local to the node. A scheduled workflow is one long run, so it works there; a workflow started per event never accumulates history, so every message looks unique or normal (ANOMALY also treats the first minHistory messages as normal).", "o": "An external window store shared across runs (KV or database); document the limit in the form text.", "q": "Do your detection workflows run long, or start fresh for every event?"}, {"id": "consoleLogs", "t": "CONSOLE_TERMINAL logs every payload at INFO (G23)", "a": "Security", "i": 3, "e": 1, "c": ["term"], "why": "Every message is written in full to the application log. Payloads can carry personal data and secrets, and large payloads inflate logs. PROCESS_EXECUTOR can also put up to 10 MiB of process output in error messages.", "o": "Log at DEBUG or truncate and redact; cap output embedded in exception text to the last few lines.", "q": "Which of your log destinations are allowed to hold payload data?"}, {"id": "scheduleLost", "t": "Schedules are not remembered across restarts", "a": "Availability", "i": 2, "e": 3, "c": ["trig"], "why": "SCHEDULE_TRIGGER lives inside one running workflow. After a restart the run is gone and its schedule with it; missed ticks are not made up, and no one re-starts the run unless something else does.", "o": "A persistent scheduler in core that starts runs at planned times and records the last fired tick.", "q": "Is a missed nightly run acceptable, or must it be caught up?"}, {"id": "modelFailsOpen", "t": "Model control plane fails open and asks the model per event", "a": "Availability", "i": 3, "e": 2, "c": ["super"], "why": "If the decision model is down, slow (2 s limit) or unsure, the plane returns no commands, so oversight silently disappears exactly when the system may be unhealthy. It also makes one model call per matching event, one after another. It cannot review commands, so it adds no protection against dangerous ones.", "o": "Count and surface 'no opinion' results as a metric and alert; prefer RulesFirstControlPlane so rules cover the clear cases; sample events instead of asking for each.", "q": "If the model is down for an hour, what should happen to unattended runs?"}, {"id": "typeIds", "t": "CONTENT-FILTER is the only kebab-case type id (G25)", "a": "Evolvability", "i": 1, "e": 1, "c": ["xform", "route"], "why": "Every other type is UPPER_SNAKE_CASE. The inconsistency makes workflow JSON harder to remember and generate. The old API_TRIGGER inconsistency is fixed. Renaming without an alias would break stored workflows.", "o": "Rename to CONTENT_FILTER and accept the old id as an alias in the registry for one release.", "q": "Do stored workflows or external tools depend on the current id?"}, {"id": "coreLayering", "t": "11 of 19 plugin modules depend on :core (G18)", "a": "Evolvability", "i": 3, "e": 4, "c": ["contract", "build"], "why": "Plugins use core's variable resolver, helper classes, registry and tracker. Counted on 2026-10-15: 11 of the plugin build files depend on :core, with 26 imports of VariableResolver (15 files), 10 of MapUtils (10 files), 4 of PluginRegistry and 4 of DefaultTaskTrackerService. The intended direction is core depends on plugin-api and plugins depend only on plugin-api; today core changes can break plugins and a plugin cannot be built and tested without the engine. New shared helpers (RunBudgets, SignalWaits, the KeyValueStore and SessionHistoryStore SPIs) went into plugin-api, which is the right direction; the older helpers have not moved.", "o": "Move the resolver, map helpers and secret lookup into plugin-api or a small plugin-support module; give loops and other cross-plugin features narrow interfaces for the registry and tracker.", "q": "Will third parties write plugins? If yes, the core dependency is a public-API problem."}, {"id": "gatesOff", "t": "Quality gates disabled for the riskiest module (G19)", "a": "Governance", "i": 3, "e": 3, "c": ["build"], "why": "internal-core turns off PMD (main and test) and Checkstyle for tests, with an unfinished-work note. constant-source turns off PMD main and test. The old note that JaCoCo verification was off and that coverage exceptions named missing classes no longer matches the build file. The 12 routing, transform and script types, including the script mapper, are the least checked.", "o": "Turn the gates back on one at a time, starting with the script mapper after its fix.", "q": "Who owns turning the disabled checks back on, and by when?"}, {"id": "optionalNotOptional", "t": "'Optional' decision and LLM plugins may be present anyway", "a": "Security", "i": 2, "e": 2, "c": ["build"], "why": "-Pyukta.plugins=none removes the nine listed modules, but the three control-plane modules are always compiled in, the model plane exposes the decision module and the decision module depends on llm-call. So CLASSIFY, GATE and the other decision types and LLM_CALL appear to stay on the runtime classpath (read from build files, not confirmed by a running build). A deployment that wanted no outbound model calls may still have the plugins, though their beans do nothing until used in a workflow.", "o": "Make the control planes optional too, or split the decision API from its plugins; confirm with a build that lists registered types.", "q": "Does a minimal build need to guarantee that a capability is absent, or only unused?"}, {"id": "agentGuardsOptIn", "t": "Agent guards are all opt-in: tool lists, approvals, budgets and filters default to off", "a": "Governance", "i": 3, "e": 2, "c": ["extio", "ai"], "why": "The controls added for agent workflows (PR #373) exist but none is on by default. <code>allowedTools<\/code> and <code>yukta.mcp-client.allowed-tools<\/code>: empty means any tool. <code>requireApproval<\/code>: empty means no approval. <code>budget<\/code>: absent means no limit. <code>yukta.llm.deny-input-patterns<\/code>, <code>deny-output-patterns<\/code> and <code>max-input-chars<\/code>: empty or 0 means off. <code>yukta.llm.rate-limit<\/code>: absent means none. A workflow where an LLM_CALL picks the tool for an MCP_TOOL_CALL (the tool name may come from the message) is therefore fully open until the author or the operator sets each guard, and a missing setting looks the same as a working one.", "o": "Log (or report in the workflow validation result) a warning when an MCP_TOOL_CALL gets its tool from the message and has neither allowedTools nor requireApproval; offer a deployment switch 'agent safe mode' that makes the lists mandatory.", "q": "If an author forgets allowedTools on an agent node, what is the worst tool the model can reach?"}, {"id": "decisionUnbudgeted", "t": "LLM-backed decisions and the model control plane are outside the run budget", "a": "Governance", "i": 2, "e": 2, "c": ["ai", "super"], "why": "Only <code>LlmCallPlugin<\/code> and <code>ToolBudget<\/code> (MCP_TOOL_CALL) use the shared ledger <code>RunBudgets<\/code>. The decision plugins with <code>backend: LLM<\/code> call <code>LlmGateway<\/code> directly and have no <code>budget<\/code> option, and the model control plane asks the model once per matching event, so a chatty run can spend tokens that no budget sees. The per-provider rate limit does apply to them (it lives in the gateway), but a rate limit bounds speed, not total spend.", "o": "Move the budget check into LlmGateway (key by execution id) so every caller is counted, or add the same budget option to the decision plugins; count the control plane's calls under a fixed agent key.", "q": "Should a GATE that asks a chat model 'safe to send?' count against the same budget as the node that wrote the text?"}, {"id": "sessionStoreBlocks", "t": "SESSION_MEMORY blocks a reactive thread while it calls the database", "a": "Performance", "i": 3, "e": 2, "c": ["ai"], "why": "<code>SessionStore<\/code> calls <code>SessionHistoryStore.load<\/code> and <code>save<\/code> (blocking by design) from inside <code>ConcurrentHashMap.computeIfAbsent<\/code> and <code>compute<\/code>, so a map bin stays locked during the call. <code>SessionMemoryPlugin<\/code> does not override <code>isBlocking()<\/code>, so core does not move it to the virtual-thread scheduler. The PostgreSQL implementation waits on the calling thread for up to 10 s, so a slow database can hold a Reactor thread for that long per message.", "o": "Return true from isBlocking() so the node runs on the blocking scheduler (one line); load before and save after the map operation instead of inside it.", "q": "What is your database's worst-case latency, and how many chats are active at once?"}], "riskNote": "IDs in brackets such as (G1) are finding numbers from the module's review notes (plugins/docs/plugins-improvements.md); only findings still open in the code are listed. Ids without brackets are new findings from reading the code, some of them judgement. Review of 2026-10-15 against main (after PRs #373 and #374): 2 risks closed (secretBlacklist, llmBudget), 5 partly closed (scriptHostAccess, shellModel, sessionMemory, kvVolatile, promptInjection), 3 added (agentGuardsOptIn, decisionUnbudgeted, sessionStoreBlocks); 3 more (ssrf, fanout256, coreLayering) got updated facts; the other 14 are unchanged because their code is unchanged.", "adrs": [{"t": "One singleton bean per plugin type, found by type id", "ctx": "The engine must run many nodes of the same kind, validate and describe plugins, and build forms from them, without knowing each class.", "dec": "Every plugin is a Spring bean implementing a plugin-api interface; the registry maps getType() to the bean, rejects duplicates at startup, and passes the node's config on each call.", "con": "Simple discovery and a stable contract. Plugins must be thread-safe and any state they hold is shared by all nodes and runs of that type (KV_STORE and SESSION_MEMORY are exactly that).", "alt": "A new instance per node (cleaner state, more objects, harder to keep a shared client or cache); separate class loaders or processes per plugin (strong isolation, much more complex, slower).", "rev": "Third parties need to ship untrusted plugins, or per-node state becomes common."}, {"t": "Typed spec, gateway, failure mode and routeBy ports for external calls", "ctx": "Process, HTTP, MCP, model, file and SQL calls all fail, time out and need to be routed on without writing a BRANCH after each one.", "dec": "Each such plugin turns config and message into a spec, delegates I/O to a gateway, and offers failureMode ERROR or CONTINUE with optional success/failure (or error) ports. The node timeout is the plugin's timeout plus a margin.", "con": "A uniform way to build fallbacks and metrics. Not every plugin follows it yet: SQL_QUERY and FILE_* skip the timeout margin, and the HTTP, MCP, model and process plugins each copy the same resolve-spec code.", "alt": "Always throw and use only the engine's onError ROUTE (simpler plugin, but the plugin cannot attach a status or output to the error); one generic 'call' plugin with drivers (less duplication, a larger blast radius).", "rev": "A seventh external plugin is added, or the duplication causes a divergence bug; then extract a shared base."}, {"t": "Plugins resolve their own variables", "ctx": "Config values like ${payload.id} or decrypted:key must be replaced per message; where to do it is a choice.", "dec": "The engine does not resolve config. Each plugin that needs it calls core's resolver on the fields where it makes sense, and SpEL plugins evaluate expressions themselves.", "con": "A plugin controls which fields are variable and which are literal (a webhook url cannot be steered by a message). The cost is inconsistency: SQL_QUERY's password is not resolved though its form hint says it is, and every plugin links to core.", "alt": "The engine resolves the whole config before each call (uniform, but a secret would reach every plugin and untrusted payloads could set any field); a declared per-field flag in the config schema (uniform and safe, needs a schema change).", "rev": "Another plugin needs variables, or plugin-api takes over the resolver (coreLayering)."}, {"t": "Optional plugins are chosen at build time", "ctx": "Process execution, file access, SQL and model calls are powerful, and some deployments (or native images) want none of them.", "dec": "boot lists nine optional modules and includes them according to -Pyukta.plugins (default all). Scripting is one of them: MAPPER depends only on a small ScriptEngine interface and script-js implements it with GraalJS; without it SCRIPT configs are rejected with a clear message. Always-on: routing, triggers, terminals, supervisors and control planes.", "con": "Smaller application and attack surface when used. No runtime switch, and the control planes pull in decision and LLM code regardless.", "alt": "Runtime feature flags per plugin (flexible, but the code is always present and always scanned); separate plugin jars loaded at startup (flexible, but a class-loading and native-image burden); for scripting, no engine at all (safest, loses power) or a separate worker process (real isolation, much more work).", "rev": "Operators want to turn plugins on or off per environment without rebuilding."}, {"t": "Two backends behind one DecisionModel interface", "ctx": "Routing on a model's answer needs a label and a confidence, and some users run a local specialised model while others use a hosted chat model.", "dec": "CLASSIFY, GATE, SCORE, ASK, ANOMALY and DEDUPE and the model control plane all call a DecisionModel. SYSTEMONE (default) asks Ollama's System One endpoint for calibrated probabilities; LLM asks any chat model for JSON and clamps its stated confidence.", "con": "One set of plugins, two ways of running them. Probabilities mean different things per backend, so thresholds do not transfer.", "alt": "Always use LLM_CALL and parse text (less code, no calibration, fragile); a classic machine-learning classifier (cheap, needs training data); a single hard-wired backend (simpler, locks users in).", "rev": "A third backend arrives, or users cannot tune thresholds because of the mismatch."}, {"t": "Model tool use is explicit in the graph, as text actions", "ctx": "Agents need a model to ask for tools, but the engine wants every step visible, retryable and supervisable.", "dec": "LLM_CALL extracts <agent_action> JSON blocks into an 'actions' list; the workflow uses BRANCH and MCP_TOOL_CALL to act and a second LLM_CALL to answer. Providers' native tool-calling is not used. This is our reading of the code and the usage text; no document states the reason.", "con": "Every step is a node with its own timeout, retry, logs and events; works the same across providers. The number of rounds is fixed by the number of nodes, and a model must follow the tag format.", "alt": "Native function calling through Spring AI inside one plugin (fewer nodes, better format adherence, hides the loop from the engine and supervisors); an agent-loop plugin that calls tools itself (compact, but a second engine inside a node).", "rev": "Agents need many rounds of tools, or reliability of the tag format becomes a problem."}, {"t": "Rules decide first; the model is advisory; deny is authoritative", "ctx": "Automatic oversight of runs must be trustworthy but also able to handle cases rules cannot describe.", "dec": "RuleSupervisor and RuleControlPlane apply written rules; deny rules fail closed. ModelControlPlane is advisory, fails open and can only issue the commands its options name (default pause only). RulesFirstControlPlane asks rules first and takes reviews only from rules.", "con": "Predictable on the clear cases and safe by default; a model outage cannot block work. It also means a model outage removes the fuzzy oversight silently.", "alt": "Model-only control (flexible, unpredictable, steerable); rules-only (predictable, blind to novel failures); fail-closed model (safer, stops work when the model is down).", "rev": "Unattended runs become high-stakes, so a silent fail-open is no longer acceptable."}, {"t": "State is in memory first", "ctx": "KV_STORE, SESSION_MEMORY, anomaly windows and schedule positions need somewhere to live, and a database would add setup and a dependency.", "dec": "They live in plain in-process maps by default, with 'ponytail' comments in the code naming what to add later (eviction, a pool); KV_STORE and SESSION_MEMORY now also have opt-in PostgreSQL stores.", "con": "Zero setup and fast. Nothing survives a restart or is shared between servers, and some of it grows without bounds.", "alt": "A store interface with memory and database implementations from day one (more work now, easy to swap); an external cache such as Redis (shared, one more service).", "rev": "Yukta runs on more than one server, or users depend on chat history or counters surviving a restart."}], "evo": [{"id": "now", "n": "Today", "d": "31 node types and four supervisor kinds on one JVM. Done since the first guide (PRs #373, #374): script sandbox with class allow-list and limits, command allow-list, env allow-list, restricted SpEL methods, LLM and MCP budgets, provider rate limit, tool approvals, PostgreSQL stores for KV_STORE and SESSION_MEMORY. Open: no host allow-list, plaintext secrets in config, no concurrency cap, memory-only defaults.", "r": []}, {"id": "contain", "n": "Contain the sharp edges", "d": "Done: script sandbox, command allow-list. Next: operator-set host and folder allow-lists, a max-concurrency setting, kill descendant processes on timeout, redact secrets in read APIs, make the agent guards a deployment default.", "r": ["scriptHostAccess", "ssrf", "shellModel", "orphans", "fanout256", "plaintextSecrets", "fileSandbox", "agentGuardsOptIn"]}, {"id": "bound", "n": "Bound memory and cost", "d": "Evict caches and sessions, put LLM-backed decisions under the run budget (LLM_CALL and MCP_TOOL_CALL already are), derive timeouts for SQL and file plugins, add a connection pool, take SESSION_MEMORY off the reactive threads, truncate logged output.", "r": ["unboundedMaps", "sessionMemory", "sqlTimeout", "consoleLogs", "sessionStoreBlocks"]}, {"id": "durable", "n": "Make state durable", "d": "Done: PostgreSQL stores for KV_STORE and SESSION_MEMORY (opt-in). Left: make them the default or warn when memory-only, durable anomaly windows, a persistent scheduler, rules that reload.", "r": ["kvVolatile", "windowsPerRun", "scheduleLost"]}, {"id": "layer", "n": "Clean the layering", "d": "Move the resolver and helpers into plugin-api, validate loop targets, re-enable the gates, rename CONTENT-FILTER with an alias, make control planes optional.", "r": ["coreLayering", "gatesOff", "loopSkipsValidation", "loopEscalate", "typeIds", "optionalNotOptional"]}, {"id": "trust", "n": "Decide the oversight model", "d": "Alert on 'no opinion' from the model plane, prefer rules-first, treat model verdicts as advice.", "r": ["modelFailsOpen", "promptInjection"]}], "prompts": [["Security", "If a workflow author is not fully trusted, which plugins would you remove from the build and which would you keep behind allow-lists?", "build", "scriptHostAccess"], ["Security", "Where should the host allow-list live: in each plugin's config, a deployment setting, or the network around the server?", "extio", "ssrf"], ["Scalability", "What is the right default concurrency for a plugin that starts a program, calls a model, or reads a file, and who should set it?", "extio", "fanout256"], ["Evolvability", "Is the 'typed spec, gateway, failure mode' pattern worth extracting into a base class, or does that hide the differences between a process, a web call and a tool call?", "contract", "coreLayering"], ["Reliability", "Which of KV_STORE, SESSION_MEMORY, ANOMALY windows and schedules deserve durable storage first, and what would break without it?", "flow", "kvVolatile"], ["Governance", "Should a model be allowed to spend money without a cap, and what is the unit of a budget: tokens, cost, calls or time?", "ai", "decisionUnbudgeted"], ["Security", "Which verdicts in your workflows would hurt if an attacker could choose the answer, and should those use a model at all?", "ai", "promptInjection"], ["Availability", "When the model control plane is down, should the system keep running unattended, or stop?", "super", "modelFailsOpen"], ["Functionality", "Should a loop be a plugin that calls other plugins, or a real sub-graph in the engine?", "flow", "loopSkipsValidation"], ["Operability", "What should be in the logs for a failed external call: nothing, a summary, or everything the process printed?", "term", "consoleLogs"]], "gloss": [["Plugin", "A named kind of node (trigger, processor or terminal) implemented as a Spring bean.", "Every capability of a workflow is a plugin; adding one means adding a bean."], ["Trigger", "A plugin with no input that creates the first messages of a run.", "Without one a workflow never starts."], ["Processor", "A plugin that takes messages in and sends messages out.", "Most of the module's 31 types are processors."], ["Terminal", "A plugin that only receives messages and ends a branch.", "It is where results become visible: a log line or a webhook."], ["Message", "The unit of data between nodes: payload, metadata, id and the output port it left on.", "Plugins read and rewrite it; many risks are about what goes into it."], ["Payload and metadata", "Payload is the data being processed. Metadata is labels about it, such as a model's verdict.", "Decision plugins write results to metadata so the payload stays unchanged."], ["Port", "A named exit of a node. Edges can be wired to one port, so a node can branch.", "Routing, failure paths ('failure', 'error') and decisions ('pass', 'reject') are all ports."], ["Plugin registry", "The table that maps a type id to its bean; it rejects duplicates at startup.", "It is also how loops find the plugin they repeat."], ["Spring bean", "An object created and managed by the Spring framework; here, one per plugin.", "One bean means one instance serves all nodes of that type."], ["Singleton", "Only one instance of a class exists in the application.", "Any state a plugin keeps in a field is shared by every node and run."], ["Config schema", "A plugin's list of setting names, types and defaults, used to draw a form in the UI.", "Field names must equal the keys the plugin reads or the form lies."], ["Variable expression", "Text like ${payload.id} in a config value, replaced per message.", "Only some plugins support it; the catalogue lists which."], ["SpEL", "Spring Expression Language, a small expression syntax.", "Used by FILTER, BRANCH and others; restricted here so it cannot name Java classes."], ["Handlebars", "A text template language with {{placeholders}}.", "MAPPER's TEMPLATE mode; it cannot run arbitrary Java."], ["GraalJS and GraalVM", "A JavaScript engine that runs on the Java virtual machine, part of the GraalVM project.", "Powers MAPPER's SCRIPT mode; its security settings decide what a script can do."], ["Host access", "The ability of guest script code to call into the Java program that hosts it.", "HostAccess.ALL is still used, but Class objects are denied and class lookup is allow-listed; it is the core of risk scriptHostAccess."], ["SSRF", "Server-side request forgery: making a server call an address the caller could not reach.", "HTTP_REQUEST and MCP_TOOL_CALL can reach internal systems if the url is not restricted."], ["Allow-list and deny-list", "Allow-list: only listed things are permitted. Deny-list: everything except listed things.", "Deny-lists miss new cases; the variable resolver uses one, the file sandbox uses neither."], ["Sandbox", "A restriction that keeps code or data inside a defined area.", "FILE_READ and FILE_WRITE use a base directory as one."], ["Symbolic link", "A file that points to another path.", "A link inside baseDir can lead outside it; the plugin checks for it, but not atomically."], ["Time-of-check to time-of-use", "A gap between checking something and using it, in which it can change.", "The file sandbox checks links, then opens the file; a swap in between is not caught."], ["JDBC and parameterised query", "JDBC is Java's database interface. A parameterised query sends values separately from the SQL text.", "SQL_QUERY binds values to '?' so message text cannot become SQL."], ["MCP", "Model Context Protocol: a standard for exposing tools to AI models over HTTP.", "MCP_TOOL_CALL is a client; Yukta's own MCP server is a separate module."], ["Streamable HTTP", "MCP's HTTP transport, where a reply can be plain JSON or a stream of events.", "Progress events in that stream restart the engine's idle timer."], ["Ollama and System One", "Ollama runs models locally. System One is a decision-style interface it exposes that returns calibrated probabilities.", "The default backend of the decision plugins and the model control plane."], ["Calibrated probability", "A probability that matches how often the model is right at that confidence.", "Lets a threshold like 0.6 mean something; a chat model's self-reported confidence does not."], ["Prompt injection", "Text in the data that tells a model to ignore its instructions.", "Decision plugins judge data that may contain such text."], ["Fail open and fail closed", "On error, allow (open) or refuse (closed).", "The model plane fails open; deny rules fail closed."], ["Back-pressure", "A slow consumer making its producers wait instead of buffering without limit.", "Why a slow webhook slows the whole branch."], ["Reactor and flatMap concurrency", "Reactor is the stream library; flatMap runs inner work concurrently, by default up to 256 at once.", "The source of risk fanout256."], ["Reactor context", "A bag of values that travels with a stream, such as node id or the start payload.", "API_TRIGGER and many plugins read from it."], ["Dead letter", "A message that failed and is parked on an error path instead of being lost.", "The engine's onError ROUTE sends failures to the 'error' port."], ["Heartbeat", "A signal from a long task saying it is still alive.", "MCP_TOOL_CALL turns progress notifications into heartbeats."], ["Idempotency", "Doing the same operation twice has the same effect as once.", "Engine retries and crash recovery can repeat a call, so side effects should be idempotent."], ["Supervisor and control plane", "Components outside the graph that read run events and may issue commands or refuse them.", "RuleSupervisor and the three control planes."], ["Cron expression", "A schedule written as fields (here six: second to weekday).", "SCHEDULE_TRIGGER accepts Spring's format."], ["ISO-8601 duration", "A time length written like PT1M (one minute) or PT2S.", "Loop maxDuration and delayInterval use it."], ["Enterprise integration patterns", "A catalogue of message-routing patterns: filter, router, splitter, aggregator, recipient list.", "The routing plugins implement them."], ["LRU cache", "A cache that drops the least recently used entry when full.", "The SpEL cache is one (1,000 entries); several others are not."], ["Quality gates", "Automatic checks (formatting, static analysis, coverage) that must pass.", "Some are switched off in internal-core."]], "evoLede": "A possible order of work, safest edges first."};

 var msg=$("#copyMsg"),ta=$("#copyArea");if(!any){msg.textContent="Nothing to copy yet. Set a status or note first.";return}
 ta.hidden=false;ta.value=md;ta.rows=10;
 var done=function(){msg.textContent="Copied."},fail=function(){msg.textContent="Select the text below and copy it."};
 try{navigator.clipboard.writeText(md).then(done,fail)}catch(e){fail()}};
board();

document.addEventListener("click",function(e){var r=e.target.closest("[data-risk]");if(r){e.preventDefault();openRisk(r.getAttribute("data-risk"));return}
 var c=e.target.closest("[data-comp]");if(c){e.preventDefault();pick(c.getAttribute("data-comp"));$("#map").scrollIntoView({behavior:"smooth"})}});

if(D.prompts&&D.prompts.length){var pi=0;
 var deck=function(){var p=D.prompts[pi];$("#deck").innerHTML='<span class="pill P2">'+p[0]+'</span> <span class="refs">'+(pi+1)+' of '+D.prompts.length+'</span><p class="q">'+p[1]+'</p><div>'+compChip(p[2])+riskChip(p[3])+'</div><div class="stepnav"><button type="button" id="pPrev">Previous</button><button type="button" id="pNext">Next</button><button type="button" id="pRand">Surprise me</button></div>';
  $("#pPrev").onclick=function(){pi=(pi+D.prompts.length-1)%D.prompts.length;deck()};$("#pNext").onclick=function(){pi=(pi+1)%D.prompts.length;deck()};$("#pRand").onclick=function(){pi=Math.floor(Math.random()*D.prompts.length);deck()}};
 deck()}
/* ---- glossary ---- */
function glRender(){var t=($("#glq").value||"").trim().toLowerCase();var l=D.gloss.filter(function(g){return !t||(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(t)>=0});
 $("#glList").innerHTML=l.length?l.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd><dd class="why">Why it matters: '+g[2]+'</dd>'}).join(""):'<dd class="refs">No term matches.</dd>'}
$("#glq").oninput=glRender;glRender();
/* ---- nav ---- */
var links=$$("nav.side .links a");
links.forEach(function(l){l.addEventListener("click",function(e){var t=$(l.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}})});
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)links.forEach(function(l){l.classList.toggle("active",l.getAttribute("href")==="#"+en.target.id)})})},{rootMargin:"-40% 0px -55% 0px"});$$("main section").forEach(function(s){io.observe(s)})}
})();
